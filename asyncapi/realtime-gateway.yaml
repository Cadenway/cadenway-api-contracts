# The broker-facing subscriptions and the browser protocol of the realtime gateway.
asyncapi: 3.0.0
info:
  title: Realtime gateway subscriptions
  version: 1.0.0
  description: |
    The gateway consumes existing producer facts through NATS JetStream. Delivery may repeat.
    The browser-facing Socket.IO protocol is defined in `x-cadenway-socket-io`. Browser packets
    travel only on that connection. The gateway keeps authorization and transport state in Redis
    without persisting the business data received from producers.
  contact:
    name: Cadenway
    url: https://github.com/Cadenway/cadenway-api-contracts
  license:
    name: Proprietary
    url: https://github.com/Cadenway/cadenway-api-contracts/blob/main/LICENSE
  x-consumers:
    - repository: cadenway-webapp
      uses: The Socket.IO protocol for invalidation of open tasks, lists and Git links, and organization presence.
servers:
  nats:
    host: nats:4222
    protocol: nats
    description: NATS JetStream of each environment, on its internal network.
channels:
  sessionRevokedV1:
    address: evt.session.revoked.v1
    description: Produced by identity-service. Consumed by realtime-gateway.
    messages:
      sessionRevokedV1:
        $ref: './identity-service.yaml#/components/messages/sessionRevokedV1'
  sessionOrganizationChangedV1:
    address: evt.session.organization-changed.v1
    description: Produced by identity-service. Consumed by realtime-gateway.
    messages:
      sessionOrganizationChangedV1:
        $ref: './identity-service.yaml#/components/messages/sessionOrganizationChangedV1'
  memberRoleChangedV1:
    address: evt.member.role-changed.v1
    description: Produced by organization-service. Consumed by realtime-gateway.
    messages:
      memberRoleChangedV1:
        $ref: './organization-service.yaml#/components/messages/memberRoleChangedV1'
  memberRemovedV1:
    address: evt.member.removed.v1
    description: Produced by organization-service. Consumed by realtime-gateway.
    messages:
      memberRemovedV1:
        $ref: './organization-service.yaml#/components/messages/memberRemovedV1'
  spaceUpdatedV1:
    address: evt.space.updated.v1
    description: Produced by task-service. Consumed by realtime-gateway.
    messages:
      spaceUpdatedV1:
        $ref: './task-service.yaml#/components/messages/spaceUpdatedV1'
  spaceAccessChangedV1:
    address: evt.space.access-changed.v1
    description: Produced by task-service. Consumed by realtime-gateway.
    messages:
      spaceAccessChangedV1:
        $ref: './task-service.yaml#/components/messages/spaceAccessChangedV1'
  spaceAccessRepublishedV1:
    address: evt.space.access-republished.v1
    description: Produced by task-service. Consumed by realtime-gateway.
    messages:
      spaceAccessRepublishedV1:
        $ref: './task-service.yaml#/components/messages/spaceAccessRepublishedV1'
  spaceDeletedV1:
    address: evt.space.deleted.v1
    description: Produced by task-service. Consumed by realtime-gateway.
    messages:
      spaceDeletedV1:
        $ref: './task-service.yaml#/components/messages/spaceDeletedV1'
  listAccessChangedV1:
    address: evt.list.access-changed.v1
    description: Produced by task-service. Consumed by realtime-gateway.
    messages:
      listAccessChangedV1:
        $ref: './task-service.yaml#/components/messages/listAccessChangedV1'
  listDeletedV1:
    address: evt.list.deleted.v1
    description: Produced by task-service. Consumed by realtime-gateway.
    messages:
      listDeletedV1:
        $ref: './task-service.yaml#/components/messages/listDeletedV1'
  taskUpdatedV1:
    address: evt.task.updated.v1
    description: Produced by task-service. Consumed by realtime-gateway.
    messages:
      taskUpdatedV1:
        $ref: './task-service.yaml#/components/messages/taskUpdatedV1'
  taskStatusChangedV1:
    address: evt.task.status-changed.v1
    description: Produced by task-service. Consumed by realtime-gateway.
    messages:
      taskStatusChangedV1:
        $ref: './task-service.yaml#/components/messages/taskStatusChangedV1'
  taskTrashedV1:
    address: evt.task.trashed.v1
    description: Produced by task-service. Consumed by realtime-gateway.
    messages:
      taskTrashedV1:
        $ref: './task-service.yaml#/components/messages/taskTrashedV1'
  taskPurgedV1:
