operations:
  receiveSessionRevokedV1:
    action: receive
    summary: Record a terminal session fence and close its sockets.
    channel:
      $ref: '#/channels/sessionRevokedV1'
  receiveSessionOrganizationChangedV1:
    action: receive
    summary: Record the session version and close sockets bound to an older context.
    channel:
      $ref: '#/channels/sessionOrganizationChangedV1'
  receiveMemberRoleChangedV1:
    action: receive
    summary: Invalidate the affected membership and close its sockets in the organization.
    channel:
      $ref: '#/channels/memberRoleChangedV1'
  receiveMemberRemovedV1:
    action: receive
    summary: Invalidate the affected membership and close its sockets in the organization.
    channel:
      $ref: '#/channels/memberRemovedV1'
  receiveSpaceUpdatedV1:
    action: receive
    summary: Recheck rooms affected by a visibility change.
    channel:
      $ref: '#/channels/spaceUpdatedV1'
  receiveSpaceAccessChangedV1:
    action: receive
    summary: Recheck list and task rooms affected by a change of space grants.
    channel:
      $ref: '#/channels/spaceAccessChangedV1'
  receiveSpaceAccessRepublishedV1:
    action: receive
    summary: Recheck access to rooms in a restored space without joining them automatically.
    channel:
      $ref: '#/channels/spaceAccessRepublishedV1'
  receiveSpaceDeletedV1:
    action: receive
    summary: Invalidate list and task rooms under the deleted space.
    channel:
      $ref: '#/channels/spaceDeletedV1'
  receiveListAccessChangedV1:
    action: receive
    summary: Recheck list and task rooms affected by a change of list access.
    channel:
      $ref: '#/channels/listAccessChangedV1'
  receiveListDeletedV1:
    action: receive
    summary: Invalidate the deleted list room and its task room memberships.
    channel:
      $ref: '#/channels/listDeletedV1'
  receiveTaskCreatedV1:
    action: receive
    summary: Send list.tasks-changed.v1 to the list room of the task.
    channel:
      $ref: '#/channels/taskCreatedV1'
  receiveTaskArchivedV1:
    action: receive
    summary: Send list.tasks-changed.v1 to the list room of the task.
    channel:
      $ref: '#/channels/taskArchivedV1'
  receiveTaskUnarchivedV1:
    action: receive
    summary: Send list.tasks-changed.v1 to the list room of the task.
    channel:
      $ref: '#/channels/taskUnarchivedV1'
  receiveTaskRestoredV1:
    action: receive
    summary: Send list.tasks-changed.v1 to the list room of the task.
    channel:
      $ref: '#/channels/taskRestoredV1'
  receiveTaskUpdatedV1:
    action: receive
    summary: Recheck moved task subscriptions, relay a minimal task notice in its current placement, and send list.tasks-changed.v1 to the former list on a move.
    channel:
      $ref: '#/channels/taskUpdatedV1'
  receiveTaskStatusChangedV1:
    action: receive
    summary: Relay a status invalidation to authorized list and task room members.
    channel:
      $ref: '#/channels/taskStatusChangedV1'
  receiveTaskTrashedV1:
    action: receive
    summary: Invalidate the task room, then send list.tasks-changed.v1 to its list room.
    channel:
      $ref: '#/channels/taskTrashedV1'
  receiveTaskPurgedV1:
    action: receive
    summary: Remove any remaining room registration for the purged task.
    channel:
      $ref: '#/channels/taskPurgedV1'
  receiveCommentCreatedV1:
    action: receive
    summary: Relay a comment ID to authorized task room members.
    channel:
      $ref: '#/channels/commentCreatedV1'
  receiveGitBranchCreatedV1:
    action: receive
    summary: Invalidate Git links for authorized task readers.
    channel:
      $ref: '#/channels/gitBranchCreatedV1'
  receiveGitPrOpenedV1:
    action: receive
    summary: Invalidate Git links for authorized task readers.
    channel:
      $ref: '#/channels/gitPrOpenedV1'
  receiveGitPrMergedV1:
    action: receive
    summary: Invalidate Git links for authorized task readers.
    channel:
      $ref: '#/channels/gitPrMergedV1'
  receiveGitPrClosedV1:
    action: receive
    summary: Invalidate Git links for authorized task readers.
    channel:
      $ref: '#/channels/gitPrClosedV1'
  receiveGitChecksCompletedV1:
    action: receive
    summary: Invalidate Git links for authorized task readers.
    channel:
      $ref: '#/channels/gitChecksCompletedV1'
  receiveNotificationCreatedV1:
    action: receive
    summary: Relay an inbox invalidation to the recipient's authorized personal room.
    channel:
      $ref: '#/channels/notificationCreatedV1'
  receiveReminderDueV1:
    action: receive
    summary: Relay a due reminder's IDs to the recipient's authorized personal room.
    channel:
      $ref: '#/channels/reminderDueV1'
# Socket.IO uses application events and acknowledgements rather than NATS subjects.
x-cadenway-socket-io:
  version: 1
  namespace: /
  path: /socket.io
  description: |
    Connect to the environment's realtime host using Socket.IO. The adapter compares the Origin
    exactly with the allowed origins before redeeming the ticket. Obtain a fresh, single-use ticket
    from `POST /v1/realtime/tickets`, valid for 60 seconds, and pass it as `auth.token`.
    A refused handshake is generic. The server never echoes the ticket or sends it in a URL.
    On every reconnect, obtain a fresh ticket, request the required list and task subscriptions
    again, and refetch through the HTTP API. Socket.IO connection state recovery is disabled.
    The gateway does not replay socket messages.
  handshake:
    description: |
      Identity redemption establishes the account, membership, active organization, session
      version and session deadline. Record the connection for that context and check the
      Redis session and membership invalidation markers before enabling delivery or sending
      hello. Check again after registration to close the race with an event arriving during
      registration. A revoked session is terminal. A switch version invalidates every socket
      with a lower session version and does not affect a socket authenticated at that version
      or later. A membership removal or role change closes only the affected organization and
      member's connections. The membership fence rejects a removed membership and a redemption
      whose claimed role differs from the role recorded by the latest membership fact. Keep fences
      for the lifetime of any affected socket or pending registration. Close at the deadline
      supplied by Identity if the session has not already ended. An uncertain authorization state
      prevents delivery.
    organizationRoom: 'org:<organizationId>'
    personalRoom: 'member:<memberId>'
    descriptionOfRooms: |
      The gateway joins the verified organization and personal rooms at handshake. All room
      indexes and recipient checks are scoped by the authenticated organization, including
      personal deliveries from facts that identify a user instead of a membership. Connections
      never request an organization ID or a personal room ID. Session or membership invalidation
      removes every room registration of the affected socket across instances.
  clientEvents:
    'room:join':
      description: |
        Join the organization room of the verified context, or ask Task for current access to
        the requested list or task as the verified user in that context. For a task, map its key
        to `task:<taskId>` only with the stable UUID returned by Task's access check. Reject an
        older producer response without that UUID. Missing and hidden resources share the
        `room.not-found` acknowledgement. Check the same authorization context again before
        enabling delivery. Each connection can join up to 32 distinct list and task rooms in
        total. A further authorized resource join returns `room.limit-reached` until the
        connection leaves a resource room. Joining an already joined room is idempotent.
      payload:
        $ref: '#/x-cadenway-socket-io/schemas/roomSelection'
      acknowledgement:
        $ref: '#/x-cadenway-socket-io/schemas/acknowledgement'
    'room:leave':
      description: |
        Leave a subscription of this connection. Resolve a task key only against this socket's
        existing authorized subscription. Repeated or absent subscriptions succeed without
        disclosing resource existence. Only the gateway manages the personal room.
      payload:
        $ref: '#/x-cadenway-socket-io/schemas/roomSelection'
      acknowledgement:
        $ref: '#/x-cadenway-socket-io/schemas/acknowledgement'
    'presence:heartbeat':
      description: |
        Refresh this connection's presence lease in Redis. Send at the cadence advertised in
        hello. The heartbeat does not extend the authenticated session deadline. When every
        connection of the member expires or disconnects, their organization sees them offline.
      payload:
        $ref: '#/x-cadenway-socket-io/schemas/emptyPayload'
      acknowledgement:
        $ref: '#/x-cadenway-socket-io/schemas/acknowledgement'
    'presence:set':
      description: |
        Set presence for the authenticated membership. An invisible membership appears offline
        and does not expose its private preference to the organization.
      payload:
        type: object
        additionalProperties: false
        required: [status]
        properties:
          status:
            type: string
            enum: [online, away, do-not-disturb, invisible]
      acknowledgement:
        $ref: '#/x-cadenway-socket-io/schemas/acknowledgement'
    'presence:list':
      description: |
        Read one page of the presence snapshot of the verified organization. Request it after
        hello and after every reconnect, so the client shows who is visible before any
        `user.status-changed.v1` notice arrives. The request carries no organization or member
        selector. Omit `cursor` for the first page, then pass back each `nextCursor` unchanged
        until it is null. Only a first page request starts a snapshot, at most once every 5
        seconds per connection. A continuation accepts only the cursor of this connection's
        previous page; any other cursor answers `request.invalid`, and the client starts again
        with a first page no sooner than 5 seconds after the previous one. One `presence:list`
        request per connection can be in flight, independently of heartbeats and status
        changes. A busy or too frequent request answers `realtime.unavailable` without closing
        the connection, and a continuation refused that way keeps its cursor for a retry.

        A page lists at most 100 members whose visible status is online, away or do not
        disturb, and can hold fewer before the last page. A member absent from every page is
        offline, an invisible member included. The audience is the one of the presence notices:
        every ready connection of the organization with a current session and membership,
        guests included. Both disclose only member IDs and visible statuses, which a client maps
        to people only through its own authorized reads. A member whose last lease expired is
        omitted, even before its offline notice arrives.

        `status` is the caller's own selected status, the only place where `invisible` appears.
        Notices never change it: a notice about the caller's own member ID reports what other
        members see. After the status was changed from another connection, a new snapshot
        returns the current one.

        Pages follow member ID order, and a cursor marks the last member ID covered, never an
        offset. A member visible during the whole traversal therefore appears in exactly one
        page, whatever changes for other members. The gateway reads each page when it handles
        the request, so only members whose status changes during the traversal can be missed
        or stale, and each such change produces a notice. Keep the `user.status-changed.v1`
        notices received after sending the first page request, apply the pages, then apply the
        kept notices in arrival order: a member's later notice replaces its snapshot status. A
        connection receives a member's notices in the order of the transitions, and a newer
        transition can replace an older one not yet delivered. Notices are volatile and carry
        no sequence number: request a new snapshot after every reconnect, and whenever the
        client wants to resynchronize, for example when its page becomes visible again.
      payload:
        $ref: '#/x-cadenway-socket-io/schemas/presenceListRequest'
      acknowledgement:
        $ref: '#/x-cadenway-socket-io/schemas/presenceListAcknowledgement'
  serverEvents:
    hello:
      description: Sent once when a connection can receive messages. Uses the common envelope.
      type: connection.ready.v1
      envelope:
        $ref: '#/x-cadenway-socket-io/schemas/envelope'
      data:
        type: object
        additionalProperties: false
        required: [organizationId, sessionExpiresAt, heartbeatIntervalSeconds]
        properties:
          organizationId:
            type: string
            format: uuid
          sessionExpiresAt:
            type: string
            format: date-time
          heartbeatIntervalSeconds:
            type: integer
            minimum: 1
            description: The client sends a heartbeat before this interval elapses.
    change:
      description: |
        An invalidation for an authorized receiver. The event id, time and version are taken
        from the producer fact when one exists. A client deduplicates the same fact by id and
        understands that different facts can share an aggregate version. For a presence change
        or Git links invalidation, `version` is the browser protocol version. Clients refetch
        business state via the API.

        `list.tasks-changed.v1` tells a list room that the set of its tasks changed, after a
        task-service fact: evt.task.created.v1, evt.task.archived.v1, evt.task.unarchived.v1,
        evt.task.trashed.v1 or evt.task.restored.v1 for the task's list, and evt.task.updated.v1
        carrying previousListId (a move) for the former list. It keeps the fact's time and
        version but has an id of its own, the UUID version 5 of the name
        `urn:cadenway:list.tasks-changed.v1:<fact id>` in the URL namespace
        (`6ba7b811-9dad-11d1-80b4-00c04fd430c8`): stable across redeliveries of the fact, and
        never equal to the id of another notice, so a client that deduplicates by id alone keeps
        both the `task.updated.v1` and the `list.tasks-changed.v1` of a move. It names neither the
        task nor what happened to it, and the client refetches the list through the API, which
        applies the task permissions (a trashed task stays unknown to a reader who cannot change
        its list). A client ignores an unsupported notice type. evt.task.trashed.v1 also closes
        the task's room.
      envelope:
        $ref: '#/x-cadenway-socket-io/schemas/envelope'
      notices:
        list.tasks-changed.v1:
          description: |
            The set of tasks of this list changed: a task was created, archived, unarchived,
            trashed or restored in it, or moved out of it (to `list:<previousListId>` of an
            evt.task.updated.v1 fact carrying previousListId; the new list receives the
            `task.updated.v1` notice). One notice per fact.
          rooms: ['list:<listId>', 'list:<previousListId>']
          data:
            $ref: '#/x-cadenway-socket-io/schemas/listTasksChange'
        task.updated.v1:
          rooms: ['task:<taskId>', 'list:<listId>']
          data:
            $ref: '#/x-cadenway-socket-io/schemas/taskChange'
        task.status-changed.v1:
          rooms: ['task:<taskId>', 'list:<listId>']
          data:
            $ref: '#/x-cadenway-socket-io/schemas/taskChange'
        git.links-changed.v1:
          description: |
            Uniform Git invalidation from the five Integration link facts. Preserve the producer
            event ID and time. Use protocol version 1. Refresh the task's Development panel or
            its Git chip through the authorized HTTP projection. The data carries only the verified
            task ID. Clients can ignore an unsupported notice type and refetch on reconnect.
          rooms: ['task:<taskId>', 'list:<listId>']
          data:
            type: object
            additionalProperties: false
            required: [taskId]
            properties:
              taskId:
                type: string
                format: uuid
        comment.created.v1:
          rooms: ['task:<taskId>']
          data:
            type: object
            additionalProperties: false
            required: [taskId, commentId]
            properties:
              taskId:
                type: string
                format: uuid
              commentId:
                type: string
                format: uuid
        user.status-changed.v1:
          rooms: ['org:<organizationId>']
          data:
            type: object
            additionalProperties: false
            required: [memberId, status]
            properties:
              memberId:
                type: string
                format: uuid
              status:
                type: string
                enum: [online, away, do-not-disturb, offline]
        notification.created.v1:
          description: |
            Inbox invalidation in the recipient's personal room. Preserve the producer event ID,
            time and version. Refetch the badge through `GET /v1/inbox/unread-count`, and an open
            inbox through its authorized HTTP routes. The data is empty: no notification ID,
            subject, text or count.
          rooms: ['member:<memberId>']
          data:
            $ref: '#/x-cadenway-socket-io/schemas/emptyPayload'
        reminder.due.v1:
          description: |
            A reminder of the recipient fired. Preserve the producer event ID, time and version.
            The data carries only the reminder and task IDs. Before presenting it, refetch the
            reminder through `GET /v1/reminders/{reminderId}`, which reflects a later snooze,
            completion or access change.
          rooms: ['member:<memberId>']
          data:
            type: object
            additionalProperties: false
            required: [reminderId, taskId]
            properties:
              reminderId:
                type: string
                format: uuid
              taskId:
                type: string
                format: uuid
      audience: |
        A room is a delivery index. Each delivery uses the receiver's still-valid session and
        organization and current permission to see the resource. Resolve the task's UUID and
        placement through Task's permission check, including when a list notice comes from a
        producer fact carrying only a task key. A changed placement or failed check prevents
        delivery based on the old fact. Recheck or evict affected room memberships after
        access, lifecycle and placement changes. Private resource notices never enter the
        organization room. Task status notices carry `changed: [status]`. Other task notices
        carry field names from the producer's `changed` list. Values, assignee IDs, grants,
        comment bodies and producer payloads are omitted.

        For Git invalidations, confirm each recipient's current session and task access as that
        user in the event organization. Resolve its stable UUID and current placement using Task.
        Its current space and list must match the placement in the fact. The producer list ID
        is only an index for finding candidate subscriptions. A list recipient must also have an
        active subscription to the verified list. Suppress delivery when Task denies access,
        cannot prove the UUID or placement, or the recipient's authorization is uncertain.
        Require the session and membership fences to remain current through delivery. Relay only
        to the verified task and list rooms. Deduplicate delivery to a socket subscribed to both
        eligible rooms.

        `list.tasks-changed.v1` is the exception to the task-based rule above: the task may no
        longer be visible (trashed) or may have left the room's list (moved), so it does not
        resolve the task and names neither the task nor its fact. For each candidate
        subscription of `list:<listId>` (`list:<previousListId>` for a move), confirm the
        receiver's current session, its membership fences and its current permission to see that
        list in the fact's organization, through the same check as a list room join, and require
        the fences to remain current through delivery. Suppress delivery to a receiver the
        check denies. An unavailable decision (the check cannot conclude) leaves the fact for
        broker redelivery, as for personal notices, so the notice reaches the receivers once the
        check answers. The notice tells an authorized reader of the list only that it should
        refetch the list.

        Personal notices answer a Notification fact that names an account, `recipientId` or
        `userId`, in the fact's organization. Look up only the ready connections authenticated as
        that account in that organization, and deliver through the personal room of each
        connection's verified membership. Capture each connection's current session, membership
        and visibility fences, then ask Task, as that account in that organization, for the
        current visibility of the inbox subject or of the reminder's task. A subjectless inbox
        fact needs only the current membership. A missing, hidden, deleted or trashed subject
        withholds the notice, and so does Task's `404 organization.not-found` for an account
        without an active membership. An unavailable decision leaves the fact for broker
        redelivery.
        Require the fences to remain current through delivery. Personal notices are not
        replayed: the client reads its badge and reminders through HTTP on load and after
        every reconnect.
  schemas:
    emptyPayload:
      type: object
      additionalProperties: false
    acknowledgement:
      oneOf:
        - type: object
          additionalProperties: false
          required: [ok]
          properties:
            ok:
              const: true
        - type: object
          additionalProperties: false
          required: [ok, code]
          properties:
            ok:
              const: false
            code:
              type: string
              enum: [request.invalid, room.not-found, room.limit-reached, realtime.unavailable]
    presenceListRequest:
      type: object
      additionalProperties: false
      properties:
        cursor:
          type: string
          minLength: 1
          maxLength: 128
          description: The opaque `nextCursor` of this connection's previous page. Absent for the first page.
    presenceListAcknowledgement:
      oneOf:
        - type: object
          additionalProperties: false
          required: [ok, status, members, nextCursor]
          properties:
            ok:
              const: true
            status:
              type: string
              enum: [online, away, do-not-disturb, invisible]
              description: The caller's own selected status. Other members see `invisible` as offline.
            members:
              type: array
              maxItems: 100
              items:
                $ref: '#/x-cadenway-socket-io/schemas/memberPresence'
            nextCursor:
              type: [string, 'null']
              minLength: 1
              maxLength: 128
              description: Opaque cursor of the next page, or null on the last page.
        - type: object
          additionalProperties: false
          required: [ok, code]
          properties:
            ok:
              const: false
            code:
              type: string
              enum: [request.invalid, realtime.unavailable]
    memberPresence:
      type: object
      additionalProperties: false
      required: [memberId, status]
      properties:
        memberId:
          type: string
          format: uuid
        status:
          type: string
          enum: [online, away, do-not-disturb]
    roomSelection:
      oneOf:
        - type: object
          additionalProperties: false
          required: [kind]
          properties:
            kind:
              const: organization
        - type: object
          additionalProperties: false
          required: [kind, listId]
          properties:
            kind:
              const: list
            listId:
              type: string
              format: uuid
        - type: object
          additionalProperties: false
          required: [kind, taskKey]
          properties:
            kind:
              const: task
            taskKey:
              # Keep aligned with TaskKey. AsyncAPI extension references are not bundled.
              type: string
              pattern: '^[A-Z]{2,5}-[1-9][0-9]{0,8}$'
    envelope:
      type: object
      additionalProperties: false
      required: [id, type, at, version, data]
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
        at:
          type: string
          format: date-time
        version:
          type: integer
          minimum: 1
        data:
          type: object
    listTasksChange:
      type: object
      additionalProperties: false
      required: [listId]
      properties:
        listId:
          type: string
          format: uuid
          description: The list whose set of tasks changed, the one of the room it is sent to.
    taskChange:
      type: object
      additionalProperties: false
      required: [taskId, changed]
      properties:
        taskId:
          type: string
          format: uuid
        changed:
          type: array
          minItems: 1
          items:
            type: string
  examples:
    hello:
      id: 019a7005-6f7a-7b8c-9d0e-1f2a3b4c5d4f
      type: connection.ready.v1
      at: '2026-11-08T10:40:00Z'
      version: 1
      data:
        organizationId: 019a5f3c-8d2e-7c4a-9b1f-3e5d7a9c1b2f
        sessionExpiresAt: '2026-11-08T11:00:00Z'
        heartbeatIntervalSeconds: 30
    taskJoin:
      kind: task
      taskKey: CAD-482
    deniedTaskJoin:
      ok: false
      code: room.not-found
    listTasksChanged:
      id: f780e4c6-ffdd-5c26-9f98-2f2494099eb8
      type: list.tasks-changed.v1
      at: '2026-11-08T10:41:00Z'
      version: 1
      data:
        listId: 019a7001-2b3c-7d4e-8f5a-6b7c8d9e0f12
    statusChange:
      id: 019a7005-6f7a-7b8c-9d0e-1f2a3b4c5d4d
      type: task.status-changed.v1
      at: '2026-11-08T10:41:00Z'
      version: 4
      data:
        taskId: 019a7002-3c4d-7e5f-8a6b-7c8d9e0f1a23
        changed: [status]
    gitLinksChanged:
      id: 019a7005-6f7a-7b8c-9d0e-1f2a3b4c5d50
      type: git.links-changed.v1
      at: '2026-11-08T10:41:00Z'
      version: 1
      data:
        taskId: 019a7002-3c4d-7e5f-8a6b-7c8d9e0f1a23
    presenceListFirstPage: {}
    presenceListPage:
      ok: true
      status: invisible
      members:
        - memberId: 019a5f3d-1a2b-7c3d-8e4f-5a6b7c8d9e41
          status: away
        - memberId: 019a5f3d-1a2b-7c3d-8e4f-5a6b7c8d9e42
          status: do-not-disturb
      nextCursor: null
    inboxChanged:
      id: 019a7005-6f7a-7b8c-9d0e-1f2a3b4c5d10
      type: notification.created.v1
      at: '2026-11-08T10:40:00Z'
      version: 1
      data: {}
    reminderDue:
      id: 019a7005-6f7a-7b8c-9d0e-1f2a3b4c5d11
      type: reminder.due.v1
      at: '2026-11-08T11:00:00Z'
      version: 2
      data:
        reminderId: 019a7000-1a2b-7c3d-8e4f-5a6b7c8d9e12
        taskId: 019a7002-3c4d-7e5f-8a6b-7c8d9e0f1a23
