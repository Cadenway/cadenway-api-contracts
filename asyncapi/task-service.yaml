  publishTaskNotificationDeliveryAuthorizedV1:
    action: send
    summary: task-service publishes one correlated task delivery authorization decision.
    description: |
      Consume `notification.delivery-authorization-requested.v1` from the authorized producer.
      In the tenant transaction that records the decision, resolve the recipient and task using
      the current canonical Task access policy for that account. Include effective organization,
      space and list access and the task's current state, as in an ordinary authorized Task
      read. An audience on a prior event never proves current access.

      Persist the request's immutable binding, the decision and its outbox record atomically.
      Each organization and correlation identifies one logical decision. A redelivery preserves
      its decision, event ID and version. A conflicting reuse cannot change the persisted
      binding. Retain decision deduplication throughout the supported event replay window.
    channel:
      $ref: '#/channels/taskNotificationDeliveryAuthorizedV1'
    messages:
      - $ref: '#/channels/taskNotificationDeliveryAuthorizedV1/messages/taskNotificationDeliveryAuthorizedV1'
