            changedUserIds: [019a5f3c-a0b1-7c2d-9e3f-5a6b7c8d9e32]
    listAccessChangedV1:
      name: list.access-changed.v1
      title: List access changed
      summary: The grants or the switch "Accès de l’organisation" of a list changed.
      description: |
        Emitted when a grant of a list is given, changed or removed, by a person who has `edit` on
        it, by the approval of a request, or when a member leaves the organization (`actor`
        `{ type: 'system', id: 'task-service' }`), and when its switch "Accès de l’organisation"
