            version,
            listId,
            spaceId,
            organizationAccess,
            grants,
            changed,
            changedUserIds,
          ]
        properties:
          id:
            type: string
            format: uuid
            description: Id of the event, the deduplication key.
          occurredAt:
            type: string
            format: date-time
            description: When the change was committed.
          organizationId:
            type: string
            format: uuid
          actor:
            $ref: '../components/events.yaml#/components/schemas/Actor'
          version:
            type: integer
            minimum: 2
            description: Version of the list after the change.
          listId:
            type: string
            format: uuid
          spaceId:
            type: string
            format: uuid
          organizationAccess:
            type: boolean
            description: |
