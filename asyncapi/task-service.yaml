      taskDependencyRemovedV1:
        $ref: '#/components/messages/taskDependencyRemovedV1'
  milestoneReachedV1:
    address: evt.milestone.reached.v1
    description: |
      A milestone entered done. Emitted by task-service. Consumers: none yet; available for future automation.
    messages:
      milestoneReachedV1:
        $ref: '#/components/messages/milestoneReachedV1'
  taskOccurrenceCreatedV1:
    address: evt.task.occurrence-created.v1
    description: |
      A recurring task created its successor. Emitted by task-service. Consumers: none yet; planned, cadenway-realtime-gateway.
    messages:
      taskOccurrenceCreatedV1:
        $ref: '#/components/messages/taskOccurrenceCreatedV1'
  spaceTaskTemplateChangedV1:
    address: evt.space.task-template-changed.v1
    description: |
      A space task template was created or deleted. Emitted by task-service. Consumers: none yet; planned, cadenway-realtime-gateway.
    messages:
      spaceTaskTemplateChangedV1:
        $ref: '#/components/messages/spaceTaskTemplateChangedV1'
  listSavedViewChangedV1:
    address: evt.list.saved-view-changed.v1
    description: |
      A saved view was created, updated or deleted. Emitted by task-service. Consumers: none yet; planned, cadenway-realtime-gateway.
    messages:
      listSavedViewChangedV1:
        $ref: '#/components/messages/listSavedViewChangedV1'
  spaceCreatedV1:
