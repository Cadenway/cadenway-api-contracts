        prefixes stay reserved; a task restored from the trash brings the space back
        (`space.restored.v1`).

        Personal data: none beyond the ids.
      headers:
        $ref: '#/components/schemas/EventHeaders'
      payload:
        type: object
        required: [id, occurredAt, organizationId, actor, version, spaceId]
        properties:
          id:
            type: string
            format: uuid
            description: Id of the event, the deduplication key.
          occurredAt:
            type: string
            format: date-time
            description: When the deletion was committed.
          organizationId:
            type: string
            format: uuid
          actor:
            $ref: '../components/events.yaml#/components/schemas/Actor'
          version:
            type: integer
            minimum: 2
            description: Version of the space after the deletion.
          spaceId:
            type: string
            format: uuid
      examples:
        - name: marketing
          summary: Camille Martin deletes the space "Marketing"
          payload:
            id: 019a7005-6f7a-7b8c-9d0e-1f2a3b4c5d18
