      Task decided a single notification delivery authorization request. Emitted by task-service.
      Planned consumer: cadenway-notification-service.
    messages:
      taskNotificationDeliveryAuthorizedV1:
        $ref: '#/components/messages/taskNotificationDeliveryAuthorizedV1'
  intakeAttachmentClaimedV1:
    address: evt.intake.attachment-claimed.v1
    description: |
      A submission claimed a verified attachment. Emitted by task-service.
      Planned consumer: cadenway-storage-service.
      Only the `task` publisher may emit this exact subject.
    messages:
      intakeAttachmentClaimedV1:
        $ref: '#/components/messages/intakeAttachmentClaimedV1'
  intakeAttachmentReleasedV1:
    address: evt.intake.attachment-released.v1
    description: |
      An anonymous intake attachment reservation was closed without a claim.
      Emitted by task-service. Planned consumer: cadenway-storage-service.
      Only the `task` publisher may emit this exact subject.
    messages:
      intakeAttachmentReleasedV1:
        $ref: '#/components/messages/intakeAttachmentReleasedV1'
