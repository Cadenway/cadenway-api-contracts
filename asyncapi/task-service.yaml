            description: When the change was committed.
          organizationId:
            type: string
            format: uuid
          actor:
            $ref: '../components/events.yaml#/components/schemas/Actor'
          version:
            type: integer
            minimum: 2
            description: Version of the space after the change.
          spaceId:
            type: string
            format: uuid
          grants:
            $ref: '#/components/schemas/Grants'
          changedUserIds:
            type: array
            minItems: 1
