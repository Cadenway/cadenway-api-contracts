            authorizationRequestId: 019a7002-3c4d-7e5f-8a6b-7c8d9e0f1a25
            decision: deny
            validUntil: '2026-11-08T11:00:15Z'
    intakeAttachmentClaimedV1:
      name: intake.attachment-claimed.v1
      title: Intake attachment claimed
      summary: A submission assigned the verified attachment to its new task.
      description: |
        Appended once when the tenant submission transaction commits the verified reservation
        as claimed for the new task. The system actor is task-service. Storage matches all three
        reservation identifiers and binds the pinned object idempotently. The draft deadline
        governs the submission, regardless of how long the outbox delivery takes.
        Storage preserves a task purge fence even when the claim arrives after the purge and
        discards the pinned object in that case.

        The claim is mutually exclusive with `intake.attachment-released.v1` for the same
        reservation. Its identifiers do not grant access. The payload carries no draft
        credential, public key, filename, contact, object key or signed URL.
      headers:
        $ref: '#/components/schemas/EventHeaders'
      payload:
        type: object
        additionalProperties: false
        required:
          [id, occurredAt, organizationId, actor, version, publicationId, attachmentId, taskKey]
        properties:
          id:
            type: string
            format: uuid
            description: Stable event ID, the delivery deduplication key.
          occurredAt:
            type: string
            format: date-time
            description: UTC instant when the submission was recorded.
          organizationId:
            type: string
            format: uuid
            description: Organization of the intake reservation and new task.
          actor:
            $ref: '../components/events.yaml#/components/schemas/Actor'
          version:
            type: integer
            minimum: 1
            maximum: 1
            description: Version of the immutable Task decision record.
          publicationId:
            $ref: '../components/intake.yaml#/components/schemas/IntakePublicationId'
          attachmentId:
            $ref: '../components/attachments.yaml#/components/schemas/AttachmentId'
          taskKey:
            $ref: '../components/task.yaml#/components/schemas/TaskKey'
      examples:
        - name: intakeUploadClaimed
          payload:
            id: 019a7005-6f7a-7b8c-9d0e-1f2a3b4c5d33
            occurredAt: '2026-11-20T14:03:00Z'
            organizationId: 019a5f3c-8d2e-7c4a-9b1f-3e5d7a9c1b2f
            actor:
              type: system
              id: task-service
            version: 1
            publicationId: 019a7006-7a8b-7c9d-8e0f-1a2b3c4d5e01
            attachmentId: 019a7006-7a8b-7c9d-8e0f-1a2b3c4d5e04
            taskKey: CAD-482
    intakeAttachmentReleasedV1:
      name: intake.attachment-released.v1
      title: Intake attachment released
      summary: Task closed an anonymous attachment reservation without attaching it.
      description: |
        Appended once with the terminal release after explicit removal, expiry or closing the
        draft without claiming this reservation. The system actor is task-service. Storage
        matches the organization, publication and attachment and commits a durable release
        fence before scheduling idempotent cleanup, even when no Storage reservation exists.
        A late upload or verification cannot reopen the release. Storage writes no ready file
        fact when cleaning up a released reservation.

        The release is mutually exclusive with `intake.attachment-claimed.v1` for the same
        reservation. The payload carries no task reference, draft credential, public key,
        filename, contact, object key or signed URL.
      headers:
        $ref: '#/components/schemas/EventHeaders'
      payload:
        type: object
        additionalProperties: false
        required: [id, occurredAt, organizationId, actor, version, publicationId, attachmentId]
        properties:
          id:
            type: string
            format: uuid
            description: Stable event ID, the delivery deduplication key.
          occurredAt:
            type: string
            format: date-time
            description: UTC instant when the release was recorded.
          organizationId:
            type: string
            format: uuid
            description: Organization of the intake reservation.
          actor:
            $ref: '../components/events.yaml#/components/schemas/Actor'
          version:
            type: integer
            minimum: 1
            maximum: 1
            description: Version of the immutable Task decision record.
          publicationId:
            $ref: '../components/intake.yaml#/components/schemas/IntakePublicationId'
          attachmentId:
            $ref: '../components/attachments.yaml#/components/schemas/AttachmentId'
      examples:
        - name: intakeUploadReleased
          payload:
            id: 019a7005-6f7a-7b8c-9d0e-1f2a3b4c5d34
            occurredAt: '2026-11-20T14:03:00Z'
            organizationId: 019a5f3c-8d2e-7c4a-9b1f-3e5d7a9c1b2f
            actor:
              type: system
              id: task-service
            version: 1
            publicationId: 019a7006-7a8b-7c9d-8e0f-1a2b3c4d5e01
            attachmentId: 019a7006-7a8b-7c9d-8e0f-1a2b3c4d5e05
