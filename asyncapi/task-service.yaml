    messages:
      - $ref: '#/channels/intakeAttachmentReleasedV1/messages/intakeAttachmentReleasedV1'
components:
  schemas:
    EventHeaders:
      type: object
      properties:
        traceparent:
          type: string
          description: W3C Trace Context of the request that caused the event.
    StatusKey:
      type: string
      description: |
        Key of a status, `STATUS_KEYS` of `@cadenway/contracts`; the ten keys never change. Its
        category is `STATUS_CATEGORY_BY_KEY`.
      enum: [triage, backlog, todo, progress, review, testing, waiting, blocked, done, cancelled]
    PriorityKey:
      type: string
      description: Priority, `PRIORITY_KEYS` of `@cadenway/contracts`; another value would take new event versions.
      enum: [urgente, haute, moyenne, basse]
    CancelReason:
      type: [string, 'null']
      description: |
        Why the task was cancelled, `CANCEL_REASONS` of `@cadenway/contracts`; `null` unless its
        status is `cancelled`. Another value would take new event versions.
      enum: [duplicate, wontdo, scope, obsolete, null]
    SpaceStatus:
      type: object
      required: [name, hidden]
      properties:
        name:
          type: [string, 'null']
          description: The name the space gives the status; `null` for its default label.
        hidden:
          type: boolean
          description: Whether the space no longer uses the status.
    SpaceStatuses:
      type: object
      description: The ten statuses as the space shows them, by key.
      required:
        [triage, backlog, todo, progress, review, testing, waiting, blocked, done, cancelled]
      properties:
        triage:
          $ref: '#/components/schemas/SpaceStatus'
        backlog:
          $ref: '#/components/schemas/SpaceStatus'
        todo:
          $ref: '#/components/schemas/SpaceStatus'
        progress:
          $ref: '#/components/schemas/SpaceStatus'
        review:
          $ref: '#/components/schemas/SpaceStatus'
        testing:
          $ref: '#/components/schemas/SpaceStatus'
        waiting:
          $ref: '#/components/schemas/SpaceStatus'
        blocked:
          $ref: '#/components/schemas/SpaceStatus'
        done:
          $ref: '#/components/schemas/SpaceStatus'
        cancelled:
          $ref: '#/components/schemas/SpaceStatus'
    Sprint:
      type: [object, 'null']
      description: The dates and the goal of a sprint; `null` for a list that is not a sprint.
      required: [startDate, endDate, goal]
      properties:
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        goal:
          type: [string, 'null']
    Icon:
      type: [string, 'null']
      description: |
        Key of the icon (`rocket`, `paint`, `lightning`…, the keys of `LOOK_ICONS`); `null` for the
        default. The set may grow without a new event version: a consumer treats an unknown key as
        `null`.
    Color:
      type: string
      description: |
        Key of the color (`gris`, `violet`, `orange`…, the keys of `LOOK_COLORS`). The set may grow
        without a new event version: a consumer treats an unknown key as `gris`.
    Changed:
      type: array
      minItems: 1
      description: Names of the members that changed; later versions may name others, which a consumer ignores.
      items:
        type: string
    Role:
      type: string
      description: |
        A role given by a grant: `edit` ("Peut modifier"), `comment` ("Peut commenter") or `view`
        ("Lecture seule") today, from the most to the least. The set may grow without a new event
        version: a consumer treats an unknown role as `view`.
      examples: [edit]
    Grants:
      type: array
      description: |
        Every grant after the change, in the order they were first given; 200 at most today. The
        owner of the space holds none.
      items:
        type: object
        required: [userId, role]
        properties:
          userId:
            type: string
            format: uuid
            description: Account of the person given access.
          role:
            $ref: '#/components/schemas/Role'
  messages:
    commentCreatedV1:
      name: comment.created.v1
      title: Comment created
      summary: A comment was posted.
      description: |
        Emitted in the comment creation transaction. Eligible mentions and effective watchers are
        snapshotted at commit. Reply IDs are included only for an eligible human reply recipient;
        the consumer deduplicates recipients and suppresses the actor. No comment text travels.

        Personal data: IDs only.
      headers:
        $ref: '#/components/schemas/EventHeaders'
      payload:
        type: object
        required:
          [
            id,
            occurredAt,
            organizationId,
            actor,
            version,
            key,
            spaceId,
            listId,
            commentId,
            commentVersion,
            mentionedUserIds,
            watcherIds,
          ]
        properties:
          id:
            type: string
            format: uuid
            description: Event ID, the deduplication key.
          occurredAt:
            type: string
            format: date-time
            description: UTC commit instant.
          organizationId:
            type: string
            format: uuid
            description: Organization of the transaction.
          actor:
            $ref: '../components/events.yaml#/components/schemas/Actor'
          version:
            type: integer
            minimum: 1
            description: Task version after the committed change.
          key:
            type: string
            pattern: '^[A-Z]{2,5}-[1-9][0-9]{0,8}$'
            description: Task key.
          spaceId:
            type: string
            format: uuid
            description: Space containing the task.
          listId:
            type: string
            format: uuid
            description: List containing the task.
          commentId:
            type: string
            format: uuid
            description: Comment ID.
          commentVersion:
            type: integer
            minimum: 1
            description: Comment version after this change.
          mentionedUserIds:
            type: array
            description: Eligible structured mention recipients.
            items:
              type: string
              format: uuid
          watcherIds:
            type: array
            description: Effective eligible watchers at commit.
            items:
              type: string
              format: uuid
          replyToCommentId:
            type: string
            format: uuid
            description: Live reply target, when an eligible human recipient exists.
          replyToUserId:
            type: string
            format: uuid
            description: Eligible human recipient of the reply.
      examples:
        - name: atelierNord
          summary: A committed change in Atelier Nord
          payload:
            id: 019a7005-6f7a-7b8c-9d0e-1f2a3b4c5d40
            occurredAt: '2026-11-08T10:40:00Z'
            organizationId: 019a5f3c-8d2e-7c4a-9b1f-3e5d7a9c1b2f
            actor: { type: user, id: 019a5f3c-8d2e-7c4a-9b1f-3e5d7a9c1b30 }
            version: 13
            key: CAD-482
            spaceId: 019a7000-1a2b-7c3d-8e4f-5a6b7c8d9e01
            listId: 019a7001-2b3c-7d4e-8f5a-6b7c8d9e0f12
            commentId: 019a7003-4d5e-7f6a-8b9c-0d1e2f3a4b01
            commentVersion: 1
            mentionedUserIds: [019a5f3c-9e1f-7b2a-8c3d-4e5f6a7b8c31]
            watcherIds: [019a5f3c-9e1f-7b2a-8c3d-4e5f6a7b8c31]
            replyToCommentId: 019a7003-4d5e-7f6a-8b9c-0d1e2f3a4b02
            replyToUserId: 019a5f3c-9e1f-7b2a-8c3d-4e5f6a7b8c31
    commentUpdatedV1:
      name: comment.updated.v1
      title: Comment updated
      summary: A comment was edited.
      description: |
        Emitted on an author edit, with the added and removed eligible mention recipient sets. The
        notification consumer uses added recipients, suppresses the actor and rechecks visibility.
        The Markdown and excerpts never travel.

        Personal data: IDs only.
      headers:
        $ref: '#/components/schemas/EventHeaders'
      payload:
        type: object
        required:
          [
            id,
            occurredAt,
            organizationId,
            actor,
            version,
            key,
            spaceId,
            listId,
            commentId,
            commentVersion,
            addedMentionUserIds,
            removedMentionUserIds,
          ]
        properties:
          id:
            type: string
            format: uuid
            description: Event ID, the deduplication key.
          occurredAt:
            type: string
            format: date-time
            description: UTC commit instant.
          organizationId:
            type: string
            format: uuid
            description: Organization of the transaction.
          actor:
            $ref: '../components/events.yaml#/components/schemas/Actor'
          version:
            type: integer
            minimum: 1
            description: Task version after the committed change.
          key:
            type: string
            pattern: '^[A-Z]{2,5}-[1-9][0-9]{0,8}$'
            description: Task key.
          spaceId:
            type: string
            format: uuid
            description: Space containing the task.
          listId:
            type: string
            format: uuid
            description: List containing the task.
          commentId:
            type: string
            format: uuid
            description: Comment ID.
          commentVersion:
            type: integer
            minimum: 1
            description: Comment version after this change.
          addedMentionUserIds:
            type: array
            description: Eligible recipients added by the edit.
            items:
              type: string
              format: uuid
          removedMentionUserIds:
            type: array
            description: Eligible recipients removed by the edit.
            items:
              type: string
              format: uuid
      examples:
        - name: atelierNord
          summary: A committed change in Atelier Nord
          payload:
            id: 019a7005-6f7a-7b8c-9d0e-1f2a3b4c5d41
            occurredAt: '2026-11-08T10:40:00Z'
            organizationId: 019a5f3c-8d2e-7c4a-9b1f-3e5d7a9c1b2f
            actor: { type: user, id: 019a5f3c-8d2e-7c4a-9b1f-3e5d7a9c1b30 }
            version: 13
            key: CAD-482
            spaceId: 019a7000-1a2b-7c3d-8e4f-5a6b7c8d9e01
            listId: 019a7001-2b3c-7d4e-8f5a-6b7c8d9e0f12
            commentId: 019a7003-4d5e-7f6a-8b9c-0d1e2f3a4b01
            commentVersion: 2
            addedMentionUserIds: [019a5f3c-8d2e-7c4a-9b1f-3e5d7a9c1b30]
            removedMentionUserIds: []
    commentDeletedV1:
      name: comment.deleted.v1
