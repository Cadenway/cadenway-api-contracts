        properties, its list or parent, its assignees and labels, each added or removed by its own
        route, its checklist, or its assignees when a removed member leaves them (`actor`
        `{ type: 'system', id: 'task-service' }`). Carries the task after the
        change and `changed`, the members of the task that changed: `name`, `description`,
        `status`, `cancelReason`, `cancelNote`, `priority`, `assigneeIds`, `dueDate`, `startDate`,
        `estimateMinutes`, `labels`, `listId`, `spaceId`, `parentKey` or `checklist` today. The
        description, the cancel note and the checklist do not travel.

