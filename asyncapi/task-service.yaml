    taskNotificationDeliveryAuthorizedV1:
      name: task.notification-delivery-authorized.v1
      title: Task notification delivery authorization decided
      summary: Task decided whether to permit a single pending delivery attempt.
      description: |
        The system actor is task-service. The decision corresponds to one request from
        notification-service. An absent or unreadable task and a recipient with no effective
        membership receive the same generic denial. If current access cannot be established,
        retry while the request remains live. An expired attempt can receive only a denial.

        `validUntil` never exceeds the request expiry. A permit requires a current positive
        decision strictly before `validUntil`. A denial of an already expired request has a
        deadline that is already past. The consumer discards decisions it no longer awaits.
        The permit authorizes only the matching redacted internal operation within that
        window. Private Task content remains subject to current authorization at disclosure,
        including in browser and email deliveries.

        The envelope identifies the organization and the opaque correlation. The payload
        contains a generic outcome and its deadline without recipient, task, authorization
        reason or resource state.
      headers:
        $ref: '#/components/schemas/EventHeaders'
      payload:
        type: object
        additionalProperties: false
        required:
          [
            id,
            occurredAt,
            organizationId,
            actor,
            version,
            authorizationRequestId,
            decision,
            validUntil,
          ]
        properties:
          id:
            type: string
            format: uuid
            description: Stable event ID, the deduplication key.
          occurredAt:
            type: string
            format: date-time
            description: UTC instant of the canonical Task decision, or of an expiry denial.
          organizationId:
            type: string
            format: uuid
            description: The organization of the matched authorization request.
          actor:
            $ref: '../components/events.yaml#/components/schemas/Actor'
          version:
            type: integer
            minimum: 1
            maximum: 1
            description: Version of the immutable decision. It does not track the task version.
          authorizationRequestId:
            type: string
            format: uuid
            description: Opaque UUID from the matching Notification attempt.
          decision:
            type: string
            enum: [permit, deny]
            description: The generic outcome for that intended recipient and task.
          validUntil:
            type: string
            format: date-time
            description: Exclusive UTC deadline for accepting this decision.
      examples:
        - name: authorized-attempt
          payload:
            id: 019a7005-6f7a-7b8c-9d0e-1f2a3b4c5d14
