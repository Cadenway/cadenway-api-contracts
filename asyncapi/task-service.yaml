    messages:
      taskRestoredV1:
        $ref: '#/components/messages/taskRestoredV1'
  taskPurgedV1:
    address: evt.task.purged.v1
    description: |
      A task of the trash was erased for good. Emitted by task-service. Consumers: none yet;
      planned, cadenway-search-service, cadenway-realtime-gateway and cadenway-storage-service.
    messages:
      taskPurgedV1:
        $ref: '#/components/messages/taskPurgedV1'
  taskNotificationDeliveryAuthorizedV1:
