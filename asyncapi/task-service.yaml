      name: space.deleted.v1
      title: Space deleted
      summary: A space was deleted, with its lists and their tasks.
      description: |
        Emitted once per space, when a person who manages it deletes it ("Supprimer l’espace"):
        the space, all its lists, archived ones included, and their tasks are gone at once, and a
        consumer drops them by `spaceId`, without a `list.deleted.v1` per list. The
