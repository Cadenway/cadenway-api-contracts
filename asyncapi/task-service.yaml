          occurredAt:
            type: string
            format: date-time
            description: When the deletion was committed.
          organizationId:
            type: string
            format: uuid
          actor:
            $ref: '../components/events.yaml#/components/schemas/Actor'
          version:
            type: integer
            minimum: 2
            description: Version of the space after the deletion.
          spaceId:
            type: string
            format: uuid
