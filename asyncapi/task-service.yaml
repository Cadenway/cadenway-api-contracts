# Events of task-service: spaces, lists and sprints, and tasks (creation, change, status, assignment),
# their access (grants, access requests), their archives, the trash and the deletions.
asyncapi: 3.0.0
info:
  title: task-service events
  version: 1.0.0
  description: |
    What task-service tells the other services about spaces, lists and tasks. Every event leaves
    through the outbox of `@cadenway/nest-messaging` once its change is committed, at least once: a
    consumer deduplicates on `id`.

    Every event belongs to an organization: `organizationId` is never `null`, and the event is
    appended in the tenant transaction of that organization. The aggregates are the space
    (`spaceId`), the list (`listId`) and the task, named by its `key` as everywhere outside
    task-service: a key never changes and is never given to another task of the organization.

    **Without calling back.** Each event carries what its planned consumers need without reading
    task-service: the whole space or list after the change, and for a task its key, name, status,
    priority, assignees, dates, estimate, labels, list, space and parent after the change. The
    description and the checklist of a task do not travel: `changed` names them, and a consumer
    that needs them reads the task. The payloads carry no limit of the product (lengths, counts),
    which later versions may raise; the formats of a task key and a prefix are part of the
    identifiers.

    **Several events for one change.** `task.updated.v1` follows every committed change of a task,
    with `changed`. A change of status also emits `task.status-changed.v1`, and each person added to
    the assignees `task.assigned.v1`, with the same `version`: these are facts for the consumers
    that react to them (notifications, automations), not other versions. A consumer that keeps a
    copy reads `task.created.v1` and `task.updated.v1` and ignores a `version` of the aggregate it
    has already applied; one that reacts to a fact deduplicates it on `id` only, since two facts of
    one change share its `version`. Moving a task moves its subtasks: each emits its own
    `task.updated.v1`. Turning the switch "Accès de l’organisation" of a list emits
    `list.access-changed.v1` with the version of the list, beside `list.updated.v1` and with the
    same `version` when the same patch changes its name, appearance or sprint: like a fact, it is
    not another version. A consumer that keeps both the content of a list and who reaches it keeps
    one watermark of `version` for each, the access applied from `list.access-changed.v1` alone,
    and so for a space; the events of one aggregate on different subjects arrive in no
    guaranteed order.

    **Access.** `space.access-changed.v1` and `list.access-changed.v1` carry every grant of the
    space or the list after the change, 200 at most, and the version of the space or the list, so
    that a consumer keeps a copy of who reaches what (search, realtime): a person sees a list when
    the rule of the organization (a space `organization` and a list whose switch is on), the
    owner of the space, a grant of the space or a grant of the list gives them a role on it, as
    "Access" of `openapi/public/spaces.yaml` says. A request for access emits
    `space.access-requested.v1`, `list.access-requested.v1` or `task.access-requested.v1`, its
    answer the `…access-request-decided.v1` of the same target, with the version of the request,
    `1` then `2`.

    **Archives, trash and deletions.** Each task of a subtree emits its own event, the root
    first, with its own version: `task.archived.v1` and `task.unarchived.v1`; `task.trashed.v1`,
    `task.restored.v1` and `task.purged.v1`, which carry the trash entry and its root. A consumer
    that keeps a copy of the tasks reads them with `task.created.v1` and `task.updated.v1`: an
    archived, trashed or purged task leaves what it shows, an unarchived or restored one comes
    back. `list.archived.v1` and `list.unarchived.v1` hide and show a list, whose tasks stay as
    they are. `list.deleted.v1` and `space.deleted.v1` remove a list, or a space with all its
    lists, and their tasks at once; the `task.trashed.v1` of those tasks follow within minutes,
    as a job moves them. A restoration from the trash emits `space.restored.v1` and
    `list.restored.v1` first when the space or the list comes back with it. None of these is
    recorded in the activity log of the tasks.

    **Visibility.** A private space, its lists and its tasks emit events like any other: a consumer
    that shows them to people filters by the visibility it reads in `space.created.v1` and
    `space.updated.v1`, by the owner of the space, and by the switch and the grants of the access
    events.

    **No restricted event.** None carries a secret; they travel on `evt.space.>`, `evt.list.>` and
    `evt.task.>`, the subjects the NATS user `task` publishes.
  contact:
    name: Cadenway
    url: https://github.com/Cadenway/cadenway-api-contracts
  license:
    name: Proprietary
    url: https://github.com/Cadenway/cadenway-api-contracts/blob/main/LICENSE
  tags:
    - name: spaces
      description: Spaces.
    - name: lists
      description: Lists and sprints.
    - name: tasks
      description: Tasks.
  x-consumers:
    - repository: cadenway-search-service
      uses: Planned, the creations, changes, access changes, archives, deletions, restorations and purges of spaces, lists and tasks, for the search index and who may find what.
    - repository: cadenway-notification-service
      uses: Planned, task.assigned.v1 and task.status-changed.v1, for the inbox and the emails; the access requests and their answers, for the notice to the owner of the space and the answer to the requester.
    - repository: cadenway-realtime-gateway
      uses: Planned, every event but the access requests and their answers, to push the changes to the open lists and tasks and to close the rooms a person no longer sees.
    - repository: cadenway-automation-service
      uses: Planned, task.created.v1, task.status-changed.v1 and task.assigned.v1, as the triggers of the rules.
    - repository: cadenway-storage-service
      uses: Planned, task.purged.v1, to erase the attachments of the tasks erased for good.
servers:
  nats:
    host: nats:4222
    protocol: nats
    description: NATS JetStream of each environment, on its internal network.
channels:
  spaceCreatedV1:
    address: evt.space.created.v1
    description: |
      A space was created. Emitted by task-service. Consumers: none yet; planned,
      cadenway-search-service and cadenway-realtime-gateway.
    messages:
      spaceCreatedV1:
        $ref: '#/components/messages/spaceCreatedV1'
  spaceUpdatedV1:
    address: evt.space.updated.v1
    description: |
      A space changed. Emitted by task-service. Consumers: none yet; planned,
      cadenway-search-service and cadenway-realtime-gateway.
    messages:
      spaceUpdatedV1:
        $ref: '#/components/messages/spaceUpdatedV1'
  listCreatedV1:
    address: evt.list.created.v1
    description: |
      A list or a sprint was created. Emitted by task-service. Consumers: none yet; planned,
      cadenway-search-service and cadenway-realtime-gateway.
    messages:
      listCreatedV1:
        $ref: '#/components/messages/listCreatedV1'
  listUpdatedV1:
    address: evt.list.updated.v1
    description: |
      A list or a sprint changed. Emitted by task-service. Consumers: none yet; planned,
      cadenway-search-service and cadenway-realtime-gateway.
    messages:
      listUpdatedV1:
        $ref: '#/components/messages/listUpdatedV1'
  taskCreatedV1:
    address: evt.task.created.v1
    description: |
      A task was created. Emitted by task-service. Consumers: none yet; planned,
      cadenway-search-service, cadenway-realtime-gateway and cadenway-automation-service.
    messages:
      taskCreatedV1:
        $ref: '#/components/messages/taskCreatedV1'
  taskUpdatedV1:
    address: evt.task.updated.v1
    description: |
      A task changed. Emitted by task-service. Consumers: none yet; planned,
      cadenway-search-service and cadenway-realtime-gateway.
    messages:
      taskUpdatedV1:
        $ref: '#/components/messages/taskUpdatedV1'
  taskStatusChangedV1:
    address: evt.task.status-changed.v1
    description: |
      The status of a task changed. Emitted by task-service. Consumers: none yet; planned,
      cadenway-notification-service, cadenway-realtime-gateway and
      cadenway-automation-service.
    messages:
      taskStatusChangedV1:
        $ref: '#/components/messages/taskStatusChangedV1'
  taskAssignedV1:
    address: evt.task.assigned.v1
    description: |
      A person was assigned a task. Emitted by task-service. Consumers: none yet; planned,
      cadenway-notification-service, cadenway-realtime-gateway and
      cadenway-automation-service.
    messages:
      taskAssignedV1:
        $ref: '#/components/messages/taskAssignedV1'
  spaceAccessChangedV1:
    address: evt.space.access-changed.v1
    description: |
      The grants of a space changed. Emitted by task-service. Consumers: none yet; planned,
      cadenway-search-service and cadenway-realtime-gateway.
    messages:
      spaceAccessChangedV1:
        $ref: '#/components/messages/spaceAccessChangedV1'
  listAccessChangedV1:
    address: evt.list.access-changed.v1
    description: |
      The grants or the switch "Accès de l’organisation" of a list changed. Emitted by
      task-service. Consumers: none yet; planned, cadenway-search-service and
      cadenway-realtime-gateway.
    messages:
      listAccessChangedV1:
        $ref: '#/components/messages/listAccessChangedV1'
  spaceAccessRequestedV1:
    address: evt.space.access-requested.v1
    description: |
      Someone asked for access to a space. Emitted by task-service. Consumers: none yet; planned,
      cadenway-notification-service.
    messages:
      spaceAccessRequestedV1:
        $ref: '#/components/messages/spaceAccessRequestedV1'
  listAccessRequestedV1:
    address: evt.list.access-requested.v1
    description: |
      Someone asked for access to a list. Emitted by task-service. Consumers: none yet; planned,
      cadenway-notification-service.
    messages:
      listAccessRequestedV1:
        $ref: '#/components/messages/listAccessRequestedV1'
  taskAccessRequestedV1:
    address: evt.task.access-requested.v1
    description: |
      Someone asked for access to a task. Emitted by task-service. Consumers: none yet; planned,
      cadenway-notification-service.
    messages:
      taskAccessRequestedV1:
        $ref: '#/components/messages/taskAccessRequestedV1'
  spaceAccessRequestDecidedV1:
    address: evt.space.access-request-decided.v1
    description: |
      A request for access to a space was approved or refused. Emitted by task-service.
      Consumers: none yet; planned, cadenway-notification-service.
    messages:
      spaceAccessRequestDecidedV1:
        $ref: '#/components/messages/spaceAccessRequestDecidedV1'
  listAccessRequestDecidedV1:
    address: evt.list.access-request-decided.v1
    description: |
      A request for access to a list was approved or refused. Emitted by task-service.
      Consumers: none yet; planned, cadenway-notification-service.
    messages:
      listAccessRequestDecidedV1:
        $ref: '#/components/messages/listAccessRequestDecidedV1'
  taskAccessRequestDecidedV1:
    address: evt.task.access-request-decided.v1
    description: |
      A request for access to a task was approved or refused. Emitted by task-service.
      Consumers: none yet; planned, cadenway-notification-service.
    messages:
      taskAccessRequestDecidedV1:
        $ref: '#/components/messages/taskAccessRequestDecidedV1'
  spaceDeletedV1:
    address: evt.space.deleted.v1
    description: |
      A space was deleted, with its lists and their tasks. Emitted by task-service. Consumers:
      none yet; planned, cadenway-search-service and cadenway-realtime-gateway.
    messages:
      spaceDeletedV1:
        $ref: '#/components/messages/spaceDeletedV1'
  spaceRestoredV1:
    address: evt.space.restored.v1
    description: |
      A deleted space came back with a task restored from the trash. Emitted by task-service.
      Consumers: none yet; planned, cadenway-search-service and cadenway-realtime-gateway.
    messages:
      spaceRestoredV1:
        $ref: '#/components/messages/spaceRestoredV1'
  listArchivedV1:
    address: evt.list.archived.v1
    description: |
      A list or a sprint was archived. Emitted by task-service. Consumers: none yet; planned,
      cadenway-search-service and cadenway-realtime-gateway.
    messages:
      listArchivedV1:
        $ref: '#/components/messages/listArchivedV1'
  listUnarchivedV1:
    address: evt.list.unarchived.v1
    description: |
      An archived list or sprint was restored. Emitted by task-service. Consumers: none yet;
      planned, cadenway-search-service and cadenway-realtime-gateway.
    messages:
      listUnarchivedV1:
        $ref: '#/components/messages/listUnarchivedV1'
  listDeletedV1:
    address: evt.list.deleted.v1
    description: |
      A list or a sprint was deleted, with its tasks. Emitted by task-service. Consumers: none
      yet; planned, cadenway-search-service and cadenway-realtime-gateway.
    messages:
      listDeletedV1:
        $ref: '#/components/messages/listDeletedV1'
  listRestoredV1:
    address: evt.list.restored.v1
    description: |
      A deleted list came back with a task restored from the trash. Emitted by task-service.
      Consumers: none yet; planned, cadenway-search-service and cadenway-realtime-gateway.
    messages:
      listRestoredV1:
        $ref: '#/components/messages/listRestoredV1'
  taskArchivedV1:
    address: evt.task.archived.v1
    description: |
      A task was archived, alone or with the subtree it belongs to. Emitted by task-service.
      Consumers: none yet; planned, cadenway-search-service and cadenway-realtime-gateway.
    messages:
      taskArchivedV1:
        $ref: '#/components/messages/taskArchivedV1'
  taskUnarchivedV1:
    address: evt.task.unarchived.v1
    description: |
      An archived task was restored with its archive. Emitted by task-service. Consumers: none
      yet; planned, cadenway-search-service and cadenway-realtime-gateway.
    messages:
      taskUnarchivedV1:
        $ref: '#/components/messages/taskUnarchivedV1'
  taskTrashedV1:
    address: evt.task.trashed.v1
    description: |
      A task went to the trash, with the entry it belongs to. Emitted by task-service. Consumers:
      none yet; planned, cadenway-search-service and cadenway-realtime-gateway.
    messages:
      taskTrashedV1:
        $ref: '#/components/messages/taskTrashedV1'
  taskRestoredV1:
    address: evt.task.restored.v1
    description: |
      A task came back from the trash with its entry. Emitted by task-service. Consumers: none
      yet; planned, cadenway-search-service and cadenway-realtime-gateway.
    messages:
      taskRestoredV1:
        $ref: '#/components/messages/taskRestoredV1'
  taskPurgedV1:
    address: evt.task.purged.v1
    description: |
      A task of the trash was erased for good. Emitted by task-service. Consumers: none yet;
      planned, cadenway-search-service, cadenway-realtime-gateway and cadenway-storage-service.
    messages:
      taskPurgedV1:
        $ref: '#/components/messages/taskPurgedV1'
