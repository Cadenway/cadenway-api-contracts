asyncapi: 3.0.0
info:
  title: integration-service events
  version: 1.0.0
  description: |
    Integration-service owns the Git links of a task. It publishes facts about committed link
    changes from a verified GitHub or GitLab delivery. Resolve the active repository mapping and
    obtain Task's authorization before creating a link. The event uses the mapped organization
    and the space and list from the placement authorized by Task for the link.
    The Git actor has `type: git` and uses the local Cadenway integration ID.

    Append the fact to the outbox in the same tenant transaction as the link change. Publish it at
    least once from the outbox after commit. Use one fact per committed link change across repeat
    deliveries. A delivery that changes several task links produces a separate fact per affected
    link. Task-service owns task status writes and emits the facts for those writes.

    **Ordering.** Each link keeps the provider time of the last delivery applied to its
    lifecycle (`pull_request.updated_at` on GitHub, `object_attributes.updated_at` on GitLab)
    and, separately, to each other projected member. Provider times have a resolution of one
    second, so two changes can share one. Integration ignores a delivery older than the one
    already applied to the member it would change. A delivery whose provider time equals it is
    applied in arrival order; a repeated delivery is already removed by its delivery identity.
    A merge is final: no delivery, older, equal or newer, reverts a `merged` link. A closure is
    reversed by a verified reopen (GitHub `pull_request` action `reopened`, GitLab merge request
    action `reopen`) whose provider time is not older than the closure, which sets the state
    back to `open` and publishes `git.pr-reopened.v1`. Every committed change increments the
    link version by one and publishes exactly one fact: the lifecycle and check facts below, or
    `git.link-updated.v1` for any other change to the projection read through
    `GET /internal/v1/tasks/{taskKey}/git-links`.

    **Reconciliation.** A tie can leave the lifecycle wrong only until the next delivery for
    the request. Every later delivery that carries the request's current state realigns it:
    any GitHub `pull_request` action (`pull_request.state` and `pull_request.merged`), any
    GitLab merge request action (`object_attributes.state`) and a GitLab merge request pipeline
    (`merge_request.state`). GitHub's check suite lists its pull requests without their state
    and does not realign. When that delivery is not older than the last applied lifecycle and
    its state differs from the recorded one, Integration sets the recorded state to it and
    publishes the matching lifecycle fact: `git.pr-reopened.v1` for `open`, `git.pr-closed.v1`
    for `closed`, `git.pr-merged.v1` for `merged`, never leaving `merged`. A realignment sends
    no Task status action: only the verified closing delivery carries task status intent.

    Examples with the same provider time `T` on one request:

    - close at `T`, then reopen at `T`: `closed`, then `open` (`git.pr-reopened.v1`);
    - reopen at `T`, then close at `T`: `open`, then `closed` (`git.pr-closed.v1`); the next
      delivery, such as a `synchronize` at `T` reporting `state: open`, realigns to `open` with
      `git.pr-reopened.v1`;
    - close at `T`, then merge at `T`: `closed`, then `merged` (`git.pr-merged.v1`);
    - merge at `T`, then close at `T`: `merged`; the close is ignored and publishes nothing.

    The event ID is stable across retries. The version is ordered only within the link identified
    by `(organizationId, gitLinkId)`. The task is addressed by its stable business key. Payloads
    expose only the event envelope, local link and task placement identifiers and the changed
    field. Consumers deduplicate by event ID and may refetch their authorized view regardless of
    delivery order. Only the Integration broker identity may publish the Git subjects.
    Consumers use the broker's publisher restrictions and require the Git actor kind.

    Integration-service consumes the Task purge fact. It records the purge for the authorized
    event organization and stable task key and removes the corresponding links. A terminal purge
    marker prevents a late or retried delivery from creating a new link for that task.
  contact:
    name: Cadenway
    url: https://github.com/Cadenway/cadenway-api-contracts
  license:
    name: Proprietary
    url: https://github.com/Cadenway/cadenway-api-contracts/blob/main/LICENSE
  tags:
    - name: git-links
      description: Committed Git link updates.
  x-consumers:
    - repository: cadenway-realtime-gateway
      uses: Planned in P6, invalidates the authorized task Git projection through Socket.IO.
servers:
  nats:
    host: nats:4222
    protocol: nats
    description: NATS JetStream of each environment, on its internal network.
defaultContentType: application/json
channels:
  gitBranchCreatedV1:
    address: evt.git.branch-created.v1
    description: Git branch created. Emitted by integration-service. Planned consumer is cadenway-realtime-gateway.
    messages:
      gitBranchCreatedV1:
        $ref: '#/components/messages/gitBranchCreatedV1'
  gitPrOpenedV1:
    address: evt.git.pr-opened.v1
    description: Git pull request opened. Emitted by integration-service. Planned consumer is cadenway-realtime-gateway.
    messages:
      gitPrOpenedV1:
        $ref: '#/components/messages/gitPrOpenedV1'
  gitPrMergedV1:
    address: evt.git.pr-merged.v1
    description: Git pull request merged. Emitted by integration-service. Planned consumer is cadenway-realtime-gateway.
    messages:
      gitPrMergedV1:
        $ref: '#/components/messages/gitPrMergedV1'
  gitPrClosedV1:
    address: evt.git.pr-closed.v1
    description: Git pull request closed. Emitted by integration-service. Planned consumer is cadenway-realtime-gateway.
    messages:
      gitPrClosedV1:
        $ref: '#/components/messages/gitPrClosedV1'
  gitChecksCompletedV1:
    address: evt.git.checks-completed.v1
    description: Git checks completed. Emitted by integration-service. Planned consumer is cadenway-realtime-gateway.
    messages:
      gitChecksCompletedV1:
        $ref: '#/components/messages/gitChecksCompletedV1'
  gitPrReopenedV1:
    address: evt.git.pr-reopened.v1
    description: Git pull request reopened. Emitted by integration-service. Consumed by cadenway-realtime-gateway.
    messages:
      gitPrReopenedV1:
        $ref: '#/components/messages/gitPrReopenedV1'
  gitLinkUpdatedV1:
    address: evt.git.link-updated.v1
    description: Other Git link projection change. Emitted by integration-service. Consumed by cadenway-realtime-gateway.
    messages:
      gitLinkUpdatedV1:
        $ref: '#/components/messages/gitLinkUpdatedV1'
  taskPurgedV1:
    address: evt.task.purged.v1
    description: Produced by task-service. Integration-service removes its Git links for the task.
    messages:
      taskPurgedV1:
        $ref: './task-service.yaml#/components/messages/taskPurgedV1'
operations:
  publishGitBranchCreatedV1:
    action: send
    summary: Git branch created.
    channel:
      $ref: '#/channels/gitBranchCreatedV1'
    messages:
      - $ref: '#/channels/gitBranchCreatedV1/messages/gitBranchCreatedV1'
  publishGitPrOpenedV1:
    action: send
    summary: Git pull request opened.
    channel:
      $ref: '#/channels/gitPrOpenedV1'
    messages:
      - $ref: '#/channels/gitPrOpenedV1/messages/gitPrOpenedV1'
  publishGitPrMergedV1:
    action: send
    summary: Git pull request merged.
    channel:
      $ref: '#/channels/gitPrMergedV1'
    messages:
      - $ref: '#/channels/gitPrMergedV1/messages/gitPrMergedV1'
  publishGitPrClosedV1:
    action: send
    summary: Git pull request closed.
    channel:
      $ref: '#/channels/gitPrClosedV1'
    messages:
      - $ref: '#/channels/gitPrClosedV1/messages/gitPrClosedV1'
  publishGitChecksCompletedV1:
    action: send
    summary: Git checks completed.
    channel:
      $ref: '#/channels/gitChecksCompletedV1'
    messages:
      - $ref: '#/channels/gitChecksCompletedV1/messages/gitChecksCompletedV1'
  publishGitPrReopenedV1:
    action: send
    summary: Git pull request reopened.
    channel:
      $ref: '#/channels/gitPrReopenedV1'
    messages:
      - $ref: '#/channels/gitPrReopenedV1/messages/gitPrReopenedV1'
  publishGitLinkUpdatedV1:
    action: send
    summary: Other Git link projection change.
    channel:
      $ref: '#/channels/gitLinkUpdatedV1'
    messages:
      - $ref: '#/channels/gitLinkUpdatedV1/messages/gitLinkUpdatedV1'
  receiveTaskPurgedV1:
    action: receive
    summary: Remove links and fence their recreation after the task is purged.
    channel:
      $ref: '#/channels/taskPurgedV1'
components:
  schemas:
    EventHeaders:
      type: object
      properties:
        traceparent:
          type: string
          description: W3C Trace Context of the request or event that caused the change.
    LocalId:
      type: string
      format: uuid
      pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-7[0-9a-fA-F]{3}-[89aAbB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$'
      description: Cadenway UUIDv7.
    CommitTime:
      type: string
      format: date-time
      description: UTC time when Integration recorded the link change.
    GitLinkVersion:
      type: integer
      minimum: 1
      description: Version of the linked Git object for that task, assigned by Integration.
  messages:
    gitBranchCreatedV1:
      name: git.branch-created.v1
      title: Git branch created
      summary: Integration recorded a created branch for an authorized linked task.
      headers:
        $ref: '#/components/schemas/EventHeaders'
      payload:
        type: object
        additionalProperties: false
        required:
          [
            id,
            occurredAt,
            organizationId,
            actor,
            version,
            taskKey,
            spaceId,
            listId,
            gitLinkId,
            changed,
          ]
        properties:
          id:
            $ref: '#/components/schemas/LocalId'
          occurredAt:
            $ref: '#/components/schemas/CommitTime'
          organizationId:
            $ref: '#/components/schemas/LocalId'
          actor:
            $ref: '../components/events.yaml#/components/schemas/Actor'
          version:
            $ref: '#/components/schemas/GitLinkVersion'
          taskKey:
            $ref: '../components/task.yaml#/components/schemas/TaskKey'
          spaceId:
            $ref: '#/components/schemas/LocalId'
          listId:
            $ref: '#/components/schemas/LocalId'
          gitLinkId:
            $ref: '#/components/schemas/LocalId'
          changed:
            type: array
            minItems: 1
            maxItems: 1
            items:
              const: branch
      examples:
        - name: Git branch created
          payload:
            id: 019a7005-6f7a-7b8c-9d0e-1f2a3b4c5d4f
            occurredAt: '2026-11-08T10:41:00Z'
            organizationId: 019a5f3c-8d2e-7c4a-9b1f-3e5d7a9c1b2f
            actor: { type: git, id: 019a700b-1a2b-7c3d-8e4f-5a6b7c8d9e01 }
            version: 1
            taskKey: CAD-482
            spaceId: 019a7000-1a2b-7c3d-8e4f-5a6b7c8d9e01
            listId: 019a7001-2b3c-7d4e-8f5a-6b7c8d9e0f12
            gitLinkId: 019a700b-1a2b-7c3d-8e4f-5a6b7c8d9e02
            changed: [branch]
    gitPrOpenedV1:
      name: git.pr-opened.v1
      title: Git pull request opened
      summary: Integration recorded an opened pull request or merge request for an authorized linked task.
      headers:
        $ref: '#/components/schemas/EventHeaders'
      payload:
        type: object
        additionalProperties: false
        required:
          [
            id,
            occurredAt,
            organizationId,
            actor,
            version,
            taskKey,
            spaceId,
            listId,
            gitLinkId,
            changed,
          ]
        properties:
          id:
            $ref: '#/components/schemas/LocalId'
          occurredAt:
            $ref: '#/components/schemas/CommitTime'
          organizationId:
            $ref: '#/components/schemas/LocalId'
          actor:
            $ref: '../components/events.yaml#/components/schemas/Actor'
          version:
            $ref: '#/components/schemas/GitLinkVersion'
          taskKey:
            $ref: '../components/task.yaml#/components/schemas/TaskKey'
          spaceId:
            $ref: '#/components/schemas/LocalId'
          listId:
            $ref: '#/components/schemas/LocalId'
          gitLinkId:
            $ref: '#/components/schemas/LocalId'
          changed:
            type: array
            minItems: 1
            maxItems: 1
            items:
              const: state
      examples:
        - name: Open CAD-482 pull request
          payload:
            id: 019a7005-6f7a-7b8c-9d0e-1f2a3b4c5d50
            occurredAt: '2026-11-08T10:41:00Z'
            organizationId: 019a5f3c-8d2e-7c4a-9b1f-3e5d7a9c1b2f
            actor: { type: git, id: 019a700b-1a2b-7c3d-8e4f-5a6b7c8d9e01 }
            version: 1
            taskKey: CAD-482
            spaceId: 019a7000-1a2b-7c3d-8e4f-5a6b7c8d9e01
            listId: 019a7001-2b3c-7d4e-8f5a-6b7c8d9e0f12
            gitLinkId: 019a700b-1a2b-7c3d-8e4f-5a6b7c8d9e03
            changed: [state]
    gitPrMergedV1:
      name: git.pr-merged.v1
      title: Git pull request merged
      summary: Integration recorded a merged pull request or merge request for an authorized linked task.
      description: |
        Published for a verified merge, or for a realignment to the current `merged` state of
        the request (see "Reconciliation"). Only the verified merge delivery sends closing task
        status intent to Task.
      headers:
        $ref: '#/components/schemas/EventHeaders'
      payload:
        type: object
        additionalProperties: false
        required:
          [
            id,
            occurredAt,
            organizationId,
            actor,
            version,
            taskKey,
            spaceId,
            listId,
            gitLinkId,
            changed,
          ]
        properties:
          id:
            $ref: '#/components/schemas/LocalId'
          occurredAt:
            $ref: '#/components/schemas/CommitTime'
          organizationId:
            $ref: '#/components/schemas/LocalId'
          actor:
            $ref: '../components/events.yaml#/components/schemas/Actor'
          version:
            $ref: '#/components/schemas/GitLinkVersion'
          taskKey:
            $ref: '../components/task.yaml#/components/schemas/TaskKey'
          spaceId:
            $ref: '#/components/schemas/LocalId'
          listId:
            $ref: '#/components/schemas/LocalId'
          gitLinkId:
            $ref: '#/components/schemas/LocalId'
          changed:
            type: array
            minItems: 1
            maxItems: 1
            items:
              const: state
      examples:
        - name: Git pull request merged
          payload:
            id: 019a7005-6f7a-7b8c-9d0e-1f2a3b4c5d51
            occurredAt: '2026-11-08T10:41:00Z'
            organizationId: 019a5f3c-8d2e-7c4a-9b1f-3e5d7a9c1b2f
            actor: { type: git, id: 019a700b-1a2b-7c3d-8e4f-5a6b7c8d9e01 }
            version: 3
            taskKey: CAD-482
            spaceId: 019a7000-1a2b-7c3d-8e4f-5a6b7c8d9e01
            listId: 019a7001-2b3c-7d4e-8f5a-6b7c8d9e0f12
            gitLinkId: 019a700b-1a2b-7c3d-8e4f-5a6b7c8d9e03
            changed: [state]
    gitPrClosedV1:
      name: git.pr-closed.v1
      title: Git pull request closed
      summary: Integration recorded a pull request or merge request closed without a merge for an authorized linked task.
      description: |
        Published for a verified closure without a merge, or for a realignment to the current
        `closed` state of the request (see "Reconciliation"). A merged link never closes.
      headers:
        $ref: '#/components/schemas/EventHeaders'
      payload:
        type: object
        additionalProperties: false
        required:
          [
            id,
            occurredAt,
            organizationId,
            actor,
            version,
            taskKey,
            spaceId,
            listId,
            gitLinkId,
            changed,
          ]
        properties:
          id:
            $ref: '#/components/schemas/LocalId'
          occurredAt:
            $ref: '#/components/schemas/CommitTime'
          organizationId:
            $ref: '#/components/schemas/LocalId'
          actor:
            $ref: '../components/events.yaml#/components/schemas/Actor'
          version:
            $ref: '#/components/schemas/GitLinkVersion'
          taskKey:
            $ref: '../components/task.yaml#/components/schemas/TaskKey'
          spaceId:
            $ref: '#/components/schemas/LocalId'
          listId:
            $ref: '#/components/schemas/LocalId'
          gitLinkId:
            $ref: '#/components/schemas/LocalId'
          changed:
            type: array
            minItems: 1
            maxItems: 1
            items:
              const: state
      examples:
        - name: Git pull request closed
          payload:
            id: 019a7005-6f7a-7b8c-9d0e-1f2a3b4c5d52
            occurredAt: '2026-11-08T10:41:00Z'
            organizationId: 019a5f3c-8d2e-7c4a-9b1f-3e5d7a9c1b2f
            actor: { type: git, id: 019a700b-1a2b-7c3d-8e4f-5a6b7c8d9e01 }
            version: 2
            taskKey: CAD-482
            spaceId: 019a7000-1a2b-7c3d-8e4f-5a6b7c8d9e01
            listId: 019a7001-2b3c-7d4e-8f5a-6b7c8d9e0f12
            gitLinkId: 019a700b-1a2b-7c3d-8e4f-5a6b7c8d9e04
            changed: [state]
    gitChecksCompletedV1:
      name: git.checks-completed.v1
      title: Git checks completed
      summary: Integration recorded completed checks for an authorized linked task.
      headers:
        $ref: '#/components/schemas/EventHeaders'
      payload:
        type: object
        additionalProperties: false
        required:
          [
            id,
            occurredAt,
            organizationId,
            actor,
            version,
            taskKey,
            spaceId,
            listId,
            gitLinkId,
            changed,
          ]
        properties:
          id:
            $ref: '#/components/schemas/LocalId'
          occurredAt:
            $ref: '#/components/schemas/CommitTime'
          organizationId:
            $ref: '#/components/schemas/LocalId'
          actor:
            $ref: '../components/events.yaml#/components/schemas/Actor'
          version:
            $ref: '#/components/schemas/GitLinkVersion'
          taskKey:
            $ref: '../components/task.yaml#/components/schemas/TaskKey'
          spaceId:
            $ref: '#/components/schemas/LocalId'
          listId:
            $ref: '#/components/schemas/LocalId'
          gitLinkId:
            $ref: '#/components/schemas/LocalId'
          changed:
            type: array
            minItems: 1
            maxItems: 1
            items:
              const: checks
      examples:
        - name: Git checks completed
          payload:
            id: 019a7005-6f7a-7b8c-9d0e-1f2a3b4c5d53
            occurredAt: '2026-11-08T10:41:00Z'
            organizationId: 019a5f3c-8d2e-7c4a-9b1f-3e5d7a9c1b2f
            actor: { type: git, id: 019a700b-1a2b-7c3d-8e4f-5a6b7c8d9e01 }
            version: 2
            taskKey: CAD-482
            spaceId: 019a7000-1a2b-7c3d-8e4f-5a6b7c8d9e01
            listId: 019a7001-2b3c-7d4e-8f5a-6b7c8d9e0f12
            gitLinkId: 019a700b-1a2b-7c3d-8e4f-5a6b7c8d9e03
            changed: [checks]
    gitPrReopenedV1:
      name: git.pr-reopened.v1
      title: Git pull request reopened
      summary: Integration recorded a reopened pull request or merge request for an authorized linked task.
      description: |
        A verified reopen (GitHub `pull_request` action `reopened`, GitLab merge request action
        `reopen`) not older than the closure, or a realignment to the current `open` state of
        the request (see "Reconciliation"), set a `closed` link back to `open`. A merged link
        never reopens. This fact does not change Task status.
      headers:
        $ref: '#/components/schemas/EventHeaders'
      payload:
        type: object
        additionalProperties: false
        required:
          [
            id,
            occurredAt,
            organizationId,
            actor,
            version,
            taskKey,
            spaceId,
            listId,
            gitLinkId,
            changed,
          ]
        properties:
          id:
            $ref: '#/components/schemas/LocalId'
          occurredAt:
            $ref: '#/components/schemas/CommitTime'
          organizationId:
            $ref: '#/components/schemas/LocalId'
          actor:
            $ref: '../components/events.yaml#/components/schemas/Actor'
          version:
            $ref: '#/components/schemas/GitLinkVersion'
          taskKey:
            $ref: '../components/task.yaml#/components/schemas/TaskKey'
          spaceId:
            $ref: '#/components/schemas/LocalId'
          listId:
            $ref: '#/components/schemas/LocalId'
          gitLinkId:
            $ref: '#/components/schemas/LocalId'
          changed:
            type: array
            minItems: 1
            maxItems: 1
            items:
              const: state
      examples:
        - name: Git pull request reopened
          payload:
            id: 019a7005-6f7a-7b8c-9d0e-1f2a3b4c5d54
            occurredAt: '2026-11-08T11:02:00Z'
            organizationId: 019a5f3c-8d2e-7c4a-9b1f-3e5d7a9c1b2f
            actor: { type: git, id: 019a700b-1a2b-7c3d-8e4f-5a6b7c8d9e01 }
            version: 3
            taskKey: CAD-482
            spaceId: 019a7000-1a2b-7c3d-8e4f-5a6b7c8d9e01
            listId: 019a7001-2b3c-7d4e-8f5a-6b7c8d9e0f12
            gitLinkId: 019a700b-1a2b-7c3d-8e4f-5a6b7c8d9e04
            changed: [state]
    gitLinkUpdatedV1:
      name: git.link-updated.v1
      title: Git link updated
      summary: Integration recorded a change to the projection of a link that no lifecycle or check fact covers.
      description: |
        Published for every other committed change to the members of `GitLink` in
        `components/git-links.yaml`, with their names in `changed`: `title`, `draft`, `url`,
        `repository`, `sourceBranch`, `author`, `checks`, `reviewRequested`, `additions`,
        `deletions` and `headSha` today. Later versions may name other members, which a consumer
        ignores. Several members changed by one delivery share one fact. The deliveries that
        produce it are:

        - GitHub `pull_request` actions `edited`, `ready_for_review`, `converted_to_draft`,
          `review_requested`, `review_request_removed` and `synchronize` (new head, line counts);
        - GitHub `check_suite` actions `requested` and `rerequested` when GitHub sends them to
          the installation, a suite not yet completed (`checks` running);
        - GitLab `Merge Request Hook` action `update` (title, draft, reviewers, new head);
        - GitLab `Pipeline Hook` with status `created`, `pending` or `running` (`checks`
          running);
        - an opening, merge, closure, reopen, branch creation or check completion delivery that
          also changes another member of an existing link without changing its lifecycle or
          checks.

        A delivery that changes nothing in the projection publishes nothing. This fact does not
        change Task status.
      headers:
        $ref: '#/components/schemas/EventHeaders'
      payload:
        type: object
        additionalProperties: false
        required:
          [
            id,
            occurredAt,
            organizationId,
            actor,
            version,
            taskKey,
            spaceId,
            listId,
            gitLinkId,
            changed,
          ]
        properties:
          id:
            $ref: '#/components/schemas/LocalId'
          occurredAt:
            $ref: '#/components/schemas/CommitTime'
          organizationId:
            $ref: '#/components/schemas/LocalId'
          actor:
            $ref: '../components/events.yaml#/components/schemas/Actor'
          version:
            $ref: '#/components/schemas/GitLinkVersion'
          taskKey:
            $ref: '../components/task.yaml#/components/schemas/TaskKey'
          spaceId:
            $ref: '#/components/schemas/LocalId'
          listId:
            $ref: '#/components/schemas/LocalId'
          gitLinkId:
            $ref: '#/components/schemas/LocalId'
          changed:
            type: array
            minItems: 1
            description: Names of the `GitLink` members that changed; a consumer ignores names it does not know.
            items:
              type: string
              minLength: 1
              x-extensible-enum:
                [
                  title,
                  draft,
