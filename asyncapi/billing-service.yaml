asyncapi: 3.0.0
info:
  title: billing-service events
  version: 1.0.0
  description: |
    Billing-service owns quota counters and records confirmed upward crossings of the 80%
    threshold for billed seats or verified ready attachment bytes. A usage observation can
    record a pending crossing when utilization moves from below 80% to at least 80%. Staying
    at or above the threshold creates no new crossing. A later upward crossing can follow a
    drop below the threshold. While confirmation is pending, Billing keeps only the latest
    crossing for each organization and metric.

    Billing confirms a pending crossing against the same active projection once its JetStream
    consumers have caught up and delivery continuity is verified. If the current total is below
    the threshold, Billing clears the pending crossing. Billing confirms the crossing and
    appends the fact to its outbox in one tenant transaction. The relay publishes the confirmed
    fact to `EVENTS` after commit with at-least-once delivery. Redelivery of an input fact and
    replay to rebuild a quota projection do not create another threshold fact. The 90% gauge
    state and the 95% banner are application display states.

    Notification-service deduplicates by event `id`, resolves the current active owners and
    administrators of the event's organization, and sends email and in-app notifications to
    those recipients. The payload carries no recipient identifiers or contact details.

    Billing-service owns the effective subscription entitlements. Organization-service and
    storage-service use committed entitlement snapshots to enforce their admission limits.
  contact:
    name: Cadenway
    url: https://github.com/Cadenway/cadenway-api-contracts
  license:
    name: Proprietary
    url: https://github.com/Cadenway/cadenway-api-contracts/blob/main/LICENSE
  tags:
    - name: quotas
      description: Committed changes to quota utilization.
    - name: subscriptions
      description: Committed changes to effective subscription entitlements.
  x-consumers:
    - repository: cadenway-notification-service
      uses: Planned in P5, quota.threshold-reached.v1 to notify current organization owners and administrators.
    - repository: cadenway-organization-service
      uses: Applies subscription.changed.v1 to the seat admission limit under the tenant's seat admission lock.
    - repository: cadenway-storage-service
      uses: Applies subscription.changed.v1 to the attachment byte limit under the tenant's storage quota lock.
servers:
  nats:
    host: nats:4222
    protocol: nats
    description: NATS JetStream of each environment, on its internal network.
defaultContentType: application/json
channels:
  quotaThresholdReachedV1:
    address: evt.quota.threshold-reached.v1
    description: Emitted by billing-service. Planned consumer cadenway-notification-service.
    messages:
      quotaThresholdReachedV1:
        $ref: '#/components/messages/quotaThresholdReachedV1'
  subscriptionChangedV1:
    address: evt.subscription.changed.v1
    description: Emitted by billing-service. Consumers are cadenway-organization-service and cadenway-storage-service.
    messages:
      subscriptionChangedV1:
        $ref: '#/components/messages/subscriptionChangedV1'
operations:
  publishQuotaThresholdReachedV1:
    action: send
    summary: Publish a confirmed upward crossing of the 80% quota threshold.
    description: Sent at least once from the transactional outbox after confirmation commits.
    channel:
      $ref: '#/channels/quotaThresholdReachedV1'
    messages:
      - $ref: '#/channels/quotaThresholdReachedV1/messages/quotaThresholdReachedV1'
  publishSubscriptionChangedV1:
    action: send
    summary: Publish an effective subscription entitlement change.
    description: >
      Billing writes the new entitlement snapshot, payment settlement receipt and outbox event
      in one tenant transaction. The relay publishes the event to EVENTS after commit with
      at-least-once delivery. Delivery order is unspecified.
    channel:
      $ref: '#/channels/subscriptionChangedV1'
    messages:
      - $ref: '#/channels/subscriptionChangedV1/messages/subscriptionChangedV1'
components:
  schemas:
    EventHeaders:
      type: object
      properties:
        traceparent:
          type: string
          description: W3C Trace Context of the request or event that caused the change.
    QuotaMetric:
      type: string
      enum: [seats, storage]
      description: |
        `seats` counts active owners, administrators and members in seats. Active guests
        are counted separately. `storage` measures verified ready attachments in bytes.
  messages:
    quotaThresholdReachedV1:
      name: quota.threshold-reached.v1
      title: Quota threshold reached
      summary: Billing confirmed a rise in utilization from below 80% to at least 80%.
      description: The actor is the billing-service system actor that confirmed the crossing.
      headers:
        $ref: '#/components/schemas/EventHeaders'
      payload:
        type: object
        additionalProperties: false
        required:
          [id, occurredAt, organizationId, actor, version, metric, thresholdPercent, used, limit]
        properties:
          id:
            type: string
            format: uuid
            description: Event deduplication key, stable across deliveries.
          occurredAt:
            type: string
            format: date-time
            description: When confirmation of the quota crossing was committed.
          organizationId:
            type: string
            format: uuid
            description: Tenant whose quota crossed the threshold.
          actor:
            $ref: '../components/events.yaml#/components/schemas/Actor'
          version:
            type: integer
            minimum: 1
            maximum: 9007199254740991
            description: Quota version of the confirmed crossing for the organization and metric.
          metric:
            $ref: '#/components/schemas/QuotaMetric'
          thresholdPercent:
            type: integer
            const: 80
            description: Threshold crossed, expressed as an integer percentage.
          used:
            type: integer
            minimum: 0
            maximum: 9007199254740991
            description: Exact committed usage at confirmation, in seats or bytes according to the metric.
          limit:
            type: integer
            minimum: 1
            maximum: 9007199254740991
            description: Exact committed quota limit at confirmation, in seats or bytes according to the metric.
      examples:
        - name: atelierNordFreeSeats
          summary: Atelier Nord reaches four of the five seats on the Free plan.
          payload:
            id: 019a7005-6f7a-7b8c-9d0e-1f2a3b4c5d40
            occurredAt: '2026-11-20T14:08:00Z'
            organizationId: 019a5f3c-8d2e-7c4a-9b1f-3e5d7a9c1b2f
            actor:
              type: system
              id: billing-service
            version: 4
            metric: seats
            thresholdPercent: 80
            used: 4
            limit: 5
        - name: atelierNordFreeStorage
          summary: Atelier Nord reaches 1.6 of the 2 GB of attachment storage on the Free plan.
          payload:
            id: 019a7005-6f7a-7b8c-9d0e-1f2a3b4c5d41
            occurredAt: '2026-11-20T14:10:00Z'
            organizationId: 019a5f3c-8d2e-7c4a-9b1f-3e5d7a9c1b2f
            actor:
              type: system
              id: billing-service
            version: 2
            metric: storage
            thresholdPercent: 80
            used: 1600000000
            limit: 2000000000
    subscriptionChangedV1:
      name: subscription.changed.v1
      title: Subscription changed
      summary: Billing committed a new effective entitlement snapshot for an organization.
      description: |
        The actor is the billing-service system actor (`type: system`, `id: billing-service`).
        The event contains the complete entitlement limits for this version of the subscription.
        Billing emits a new version when the plan changes, including when the limits stay equal.
        A scheduled Stripe cancellation keeps the Team entitlement in effect. When the return
        to Free is enabled, Billing may emit a newer Free snapshot after an authenticated
        Stripe read confirms cancellation of the bound subscription. The Free limits are
        five seats and 2,000,000,000 bytes. Enable this path after both admission owners
        support the Free return.

        Organization and Storage compare the tenant's persisted entitlement version and apply only
        a newer snapshot under their respective admission locks. They persist the applied version
        atomically with the limit used for admission. The Free return preserves existing members,
        attachments and verified upload reservations. Once a consumer applies the snapshot,
        its enabled admission checks refuse additions that would exceed the Free limit.
        Delivery is asynchronous. Repeated deliveries and older snapshots leave the current
        limit in effect. For recovery, either consumer can read the latest
        snapshot through the signed `getBillingEntitlementInternal` operation and apply the same
        version check. Version zero is the legacy Free snapshot returned by that operation before
        the first committed entitlement change.
      headers:
        $ref: '#/components/schemas/EventHeaders'
      payload:
        type: object
        additionalProperties: false
        required:
          [id, occurredAt, organizationId, actor, version, plan, seatLimit, storageByteLimit]
        properties:
          id:
            type: string
            format: uuid
            description: Event deduplication key, stable across deliveries.
          occurredAt:
            type: string
            format: date-time
            description: When Billing committed the entitlement change.
          organizationId:
            type: string
            format: uuid
            description: Tenant whose effective subscription changed.
          actor:
            $ref: '../components/events.yaml#/components/schemas/Actor'
          version:
            type: integer
            minimum: 1
            maximum: 9007199254740991
            description: Monotonically increasing entitlement version within the organization.
          plan:
            $ref: '../components/billing.yaml#/components/schemas/BillingPlan'
          seatLimit:
            type: integer
            minimum: 1
            maximum: 9007199254740991
            description: Effective limit for active owners, administrators and members occupying seats.
          storageByteLimit:
            type: integer
            minimum: 1
            maximum: 9007199254740991
            description: Effective storage limit in decimal bytes for verified ready attachments.
      examples:
        - name: atelierNordTeamEntitlement
          summary: Atelier Nord upgrades from Free to Team with eighteen seats and 100 GB of storage.
          payload:
            id: 019a7005-6f7a-7b8c-9d0e-1f2a3b4c5d42
            occurredAt: '2026-11-21T14:08:00Z'
            organizationId: 019a5f3c-8d2e-7c4a-9b1f-3e5d7a9c1b2f
            actor:
              type: system
              id: billing-service
            version: 1
            plan: team
            seatLimit: 18
            storageByteLimit: 100000000000
        - name: atelierNordFreeReturn
          summary: Atelier Nord returns to the Free allowance after its Stripe subscription is canceled.
          payload:
            id: 019a7005-6f7a-7b8c-9d0e-1f2a3b4c5d43
            occurredAt: '2026-11-22T14:08:00Z'
            organizationId: 019a5f3c-8d2e-7c4a-9b1f-3e5d7a9c1b2f
            actor:
              type: system
              id: billing-service
            version: 2
            plan: free
            seatLimit: 5
            storageByteLimit: 2000000000
