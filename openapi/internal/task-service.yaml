        the same version. Emits `list.unarchived.v1`. Internal token: actor `user`, organization
        required.
      tags: [archives]
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
