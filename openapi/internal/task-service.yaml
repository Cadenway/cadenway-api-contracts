      tags: [tasks]
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '204':
          description: The person is not among the assignees.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InternalTokenRefused'
        '403':
          $ref: '#/components/responses/WriteForbidden'
        '404':
          $ref: '#/components/responses/TaskNotFound'
        '409':
          $ref: '#/components/responses/TaskArchived'
        '412':
          $ref: '#/components/responses/VersionMismatch'
  /internal/v1/tasks/{taskKey}/labels/add:
