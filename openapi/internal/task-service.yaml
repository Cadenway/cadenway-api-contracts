            ETag:
              $ref: '#/components/headers/GoalETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoalResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InternalTokenRefused'
        '403':
          $ref: '#/components/responses/InternalAccessRefused'
        '404':
          $ref: '#/components/responses/GoalResultNotFound'
    patch:
      operationId: updateGoalResultInternal
      summary: Update a goal result
      description: |
        Applies a merge patch to a result the caller can read on a writable goal. Every kind accepts a
        label. Only a number accepts `currentValue`, and only a checkbox accepts `checked`. The kind,
        numeric endpoints and linked target are fixed. Use result deletion and creation to replace a
        link. A linked target must stay readable through the write. `If-Match` checks the goal's
        version.
      tags: [goals]
      parameters:
        - $ref: '#/components/parameters/GoalId'
        - $ref: '#/components/parameters/ResultId'
        - $ref: '#/components/parameters/GoalIfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoalResultPatch'
            example:
              label: Tâches SSO terminées
      responses:
        '200':
          description: The updated result.
          headers:
            ETag:
              $ref: '#/components/headers/GoalETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoalResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InternalTokenRefused'
        '403':
          $ref: '#/components/responses/GoalWriteForbidden'
        '404':
          $ref: '#/components/responses/GoalResultNotFound'
        '412':
          $ref: '#/components/responses/VersionMismatch'
        '422':
          $ref: '#/components/responses/GoalResultChangeRefused'
    delete:
      operationId: deleteGoalResultInternal
      summary: Delete a goal result
      description: |
        Removes a readable result from a writable goal. A linked target must stay readable
        through the write. `If-Match` checks the goal's version.
      tags: [goals]
      parameters:
        - $ref: '#/components/parameters/GoalId'
        - $ref: '#/components/parameters/ResultId'
        - $ref: '#/components/parameters/GoalIfMatch'
      responses:
        '204':
          description: The result was deleted.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InternalTokenRefused'
        '403':
          $ref: '#/components/responses/GoalWriteForbidden'
        '404':
          $ref: '#/components/responses/GoalResultNotFound'
        '412':
          $ref: '#/components/responses/VersionMismatch'
  /internal/v1/reports/team-dashboard:
    get:
      operationId: getTeamDashboardInternal
      summary: Read the dashboard of visible team work
      description: |
        Computes the dashboard in one read of the caller's visible live tasks in readable live lists.
        Open statuses have category `open` or `active`. Late tasks are open and due before `today`.
        The blocked counter uses exactly `blocked`, and the status distribution covers every visible
        live task. The overdue preview keeps the first ten tasks by due date and key. The workload
        counts each open task against each of its current visible assignees, with a six-task threshold.

        The selected 8 or 12 calendar weeks start on Monday in `timeZone` and include the week of `today`.
        Each bucket counts a visible live task once if a durable activity entry records its transition to
        `done` during the covered week. A task currently reopened still counts for its recorded completion.
        Every bucket stops at `observedAt` at the latest. The current week also stops at the end of
        `today` in `timeZone`. The total completed count is the sum of the week counts. Historical
        occurrences of tasks that the caller cannot currently read are absent from every counter
        and drill-down.
      tags: [team-reports]
      parameters:
        - $ref: '#/components/parameters/Today'
        - $ref: '#/components/parameters/TeamDashboardTimeZone'
        - $ref: '#/components/parameters/TeamDashboardWeeks'
      responses:
        '200':
          description: Dashboard counts, completion buckets and overdue preview.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamDashboard'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InternalTokenRefused'
        '403':
          $ref: '#/components/responses/InternalAccessRefused'
        '404':
          $ref: '#/components/responses/OrganizationNotFound'
  /internal/v1/lists/{listId}/intake-form:
    parameters:
      - $ref: '#/components/parameters/ListId'
    get:
      operationId: getIntakeFormConfigurationInternal
      summary: Read the intake configuration of a list
      description: |
        Requires current list `edit`. Initializing the draft saves version 1, an unpublished
        form, `triage` when available with `todo` as fallback, and no assignee.
        Settings can be read during archive. Internal token: api-gateway, user and organization.
      tags: [intake]
      responses:
        '200':
          $ref: '#/components/responses/IntakeConfiguration'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InternalTokenRefused'
        '403':
          $ref: '#/components/responses/WriteForbidden'
        '404':
          $ref: '#/components/responses/ListNotFound'
    patch:
      operationId: updateIntakeFormConfigurationInternal
      summary: Change intake settings
      description: |
        Requires current `edit` on an active list and the strong form `ETag` in `If-Match`.
        Validate the status and assignee, and commit editable settings and version together.
        An unchanged patch keeps the version and an active publication keeps its key.
        Internal token: api-gateway, user and organization.
      tags: [intake]
      parameters:
        - $ref: '#/components/parameters/RequiredIntakeIfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../../components/intake.yaml#/components/schemas/IntakeFormPatch'
            example:
              title: Déposer une demande
              fields: { description: required, contactEmail: optional }
              defaultStatus: triage
              defaultAssigneeId: null
      responses:
        '200':
          $ref: '#/components/responses/IntakeConfiguration'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InternalTokenRefused'
        '403':
          $ref: '#/components/responses/WriteForbidden'
        '404':
          $ref: '#/components/responses/ListNotFound'
        '409':
          $ref: '#/components/responses/IntakeListArchived'
        '412':
          $ref: '#/components/responses/VersionMismatch'
        '422':
          $ref: '#/components/responses/IntakeDefaultsInvalid'
  /internal/v1/lists/{listId}/intake-form/publish:
    parameters:
      - $ref: '#/components/parameters/ListId'
    post:
      operationId: publishIntakeFormInternal
      summary: Publish an intake form
      description: |
        Requires current `edit` on an active list. Validate the defaults under the publication
        lock. Publish a fresh key when disabled. A repeat with unchanged valid settings
        preserves the current key and version. Internal token: api-gateway, user and organization.
      tags: [intake]
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          $ref: '#/components/responses/IntakeConfiguration'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InternalTokenRefused'
        '403':
          $ref: '#/components/responses/WriteForbidden'
        '404':
          $ref: '#/components/responses/ListNotFound'
        '409':
          $ref: '#/components/responses/IntakeListArchived'
        '412':
          $ref: '#/components/responses/VersionMismatch'
        '422':
          $ref: '#/components/responses/IntakeDefaultsInvalid'
  /internal/v1/lists/{listId}/intake-form/publication:
    parameters:
      - $ref: '#/components/parameters/ListId'
    delete:
      operationId: disableIntakeFormInternal
      summary: Disable a published intake form
      description: |
        Requires current list `edit`, including on archived lists. Revoke the key in the
        same transaction as the version change and retain the settings. An already disabled
        form keeps its version. Internal token: api-gateway, user and organization.
      tags: [intake]
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '204':
          description: The draft is unpublished.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InternalTokenRefused'
        '403':
          $ref: '#/components/responses/WriteForbidden'
        '404':
          $ref: '#/components/responses/ListNotFound'
        '412':
          $ref: '#/components/responses/VersionMismatch'
  /internal/v1/tasks/{taskKey}/intake-contact:
    parameters:
      - $ref: '#/components/parameters/TaskKey'
    get:
      operationId: getTaskIntakeContactInternal
      summary: Read a requester's contact email
      description: |
        Requires current `edit` on the task's list. Read the contact separately from the
        task projection and return null when absent. Internal token: api-gateway, user
        and organization.
      tags: [intake]
      responses:
        '200':
          description: The independently stored contact, if any.
          content:
            application/json:
              schema:
                $ref: '../../components/intake.yaml#/components/schemas/TaskIntakeContact'
              example:
                contactEmail: prenom.nom@example.com
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InternalTokenRefused'
        '403':
          $ref: '#/components/responses/WriteForbidden'
        '404':
          $ref: '#/components/responses/TaskNotFound'
  /internal/v1/intake-forms/{publicKey}:
    parameters:
      - $ref: '#/components/parameters/IntakePublicKey'
    get:
      operationId: getPublicIntakeFormInternal
      summary: Read the published applicant form
      description: |
        The key resolves the tenant and list. Verify that the publication and defaults
        remain valid on an active list and return only the applicant projection.
        Archive suspends the publication. Deletion and disable revoke its key.
        Internal token: api-gateway and actor system, without an organization.
      tags: [intake]
      responses:
        '200':
          description: The applicant's form.
          content:
            application/json:
              schema:
                $ref: '../../components/intake.yaml#/components/schemas/PublicIntakeForm'
              example:
                title: Déposer une demande
                description: Décrivez votre besoin en quelques mots.
                fields:
                  description: optional
                  priority: optional
                  dueDate: optional
                  contactEmail: required
        '401':
          $ref: '#/components/responses/InternalTokenRefused'
        '403':
          $ref: '#/components/responses/IntakeApplicantAccessRefused'
        '404':
          $ref: '#/components/responses/PublicIntakeNotFound'
  /internal/v1/intake-forms/{publicKey}/submissions:
    parameters:
      - $ref: '#/components/parameters/IntakePublicKey'
    post:
      operationId: submitPublicIntakeFormInternal
      summary: Submit a request through a published form
      description: |
        Internal token: api-gateway and actor system, without an organization. Resolve the
        tenant and list by key. Recheck the publication, list, status and assignee under the
        write locks before applying the form's fields and normal task creation rules.
        Attachment IDs require the private draft key and idempotency key. When a draft
        key is supplied without attachment IDs, it still requires an idempotency key.
        Require each selected reservation to have a matching verified fact and belong to
        this same publication and draft. Commit the task, private contact, receipt, ordinary
        task outbox events and the reservation decisions in the same tenant transaction.
        Claim the selected reservations and release the others when a draft is committed.
        A matching replay returns the original opaque receipt within 24 hours while the
        publication is valid, even after the draft closes. The set of normalized attachment IDs,
        regardless of their order, and the draft identity are part of the replay comparison.
        A submission without a draft or attachments keeps its existing replay behavior.
      tags: [intake]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IntakeDraftKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../../components/intake.yaml#/components/schemas/IntakeSubmission'
            example:
              title: Accès SSO pour Atelier Nord
              description: Activer la connexion pour l’équipe du sprint 14.
              contactEmail: prenom.nom@example.com
      responses:
        '200':
          description: The submission is accepted and its task is committed.
          content:
            application/json:
              schema:
                $ref: '../../components/intake.yaml#/components/schemas/IntakeReceipt'
              example:
                receipt: T3Wf3e3VdFKPIsnP7t9m2kUuwtHTU2yXrP-Ekq11BRg
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InternalTokenRefused'
        '403':
          $ref: '#/components/responses/IntakeApplicantAccessRefused'
        '404':
          $ref: '#/components/responses/IntakeDraftNotFound'
        '409':
          $ref: '#/components/responses/IntakeAttachmentSubmissionConflict'
        '422':
          $ref: '#/components/responses/IntakeSubmissionRefused'
  /internal/v1/intake-forms/{publicKey}/attachments:
    parameters:
      - $ref: '#/components/parameters/IntakePublicKey'
    post:
      operationId: allocateIntakeAttachmentInternal
      summary: Authorize an anonymous upload and allocate its stable ID
      description: |
        Internal token: api-gateway and actor system, without an organization. Recheck
        the live publication, its defaults and its attachment policy in the resolved
        tenant. The private draft key scopes the allocation. Its first reservation
        opens a 30-minute draft with at most five active reservations. Refuse a
        declaration above 25 MiB before occupying a slot.

        A matching reservation key and declaration return the same allocation while
        the reservation, draft and publication stay eligible. The idempotency key is
        scoped to the tenant, publication and draft. A retry cannot extend their expiry.
        The gateway uses the returned tenant, publication, ID and expiry to request
        the signed upload from storage-service. The applicant never receives this
        allocation response directly.
      tags: [intake]
      parameters:
        - $ref: '#/components/parameters/RequiredIntakeDraftKey'
        - $ref: '#/components/parameters/IntakeAttachmentIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../../components/attachments.yaml#/components/schemas/StartAttachmentUpload'
            example: { fileName: capture-sso.png, contentType: image/png, sizeBytes: 184320 }
      responses:
        '201':
          description: The publication and reservation binding.
          headers:
            Location:
              $ref: '#/components/headers/IntakeAttachmentLocation'
            Cache-Control:
              $ref: '#/components/headers/IntakeAttachmentNoStore'
          content:
            application/json:
              schema:
                $ref: '../../components/intake.yaml#/components/schemas/IntakeAttachmentAllocation'
              example:
                organizationId: 019a5f3c-8d2e-7c4a-9b1f-3e5d7a9c1b2f
                publicationId: 019a7001-2b3c-7d4e-8f5a-6b7c8d9e0f12
                attachmentId: 019a7004-3b2c-7d4e-8f5a-6b7c8d9e0f15
                expiresAt: '2026-11-20T14:30:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InternalTokenRefused'
        '403':
          $ref: '#/components/responses/IntakeApplicantAccessRefused'
        '404':
          $ref: '#/components/responses/IntakeDraftNotFound'
        '409':
          $ref: '#/components/responses/IntakeSubmissionInProgress'
        '422':
          $ref: '#/components/responses/IntakeAttachmentAllocationRefused'
  /internal/v1/intake-forms/{publicKey}/attachments/{attachmentId}:
    parameters:
      - $ref: '#/components/parameters/IntakePublicKey'
      - $ref: '#/components/parameters/IntakeAttachmentId'
    get:
      operationId: resolveIntakeAttachmentInternal
      summary: Authorize completion of a draft upload
      description: |
        Internal token: api-gateway and actor system, without an organization. In
        one snapshot check the current publication, attachment policy and draft
        ownership. Return only the trusted scope for storage-service. Unknown or
        unrelated IDs, unusable publications and closed or expired drafts return
        the same refusal. This lookup does not provide any storage status.
      tags: [intake]
      parameters:
        - $ref: '#/components/parameters/RequiredIntakeDraftKey'
      responses:
        '200':
          description: This reservation is eligible for upload completion.
          headers:
            Cache-Control:
              $ref: '#/components/headers/IntakeAttachmentNoStore'
          content:
            application/json:
              schema:
                $ref: '../../components/intake.yaml#/components/schemas/IntakeAttachmentAllocation'
              example:
                organizationId: 019a5f3c-8d2e-7c4a-9b1f-3e5d7a9c1b2f
                publicationId: 019a7001-2b3c-7d4e-8f5a-6b7c8d9e0f12
                attachmentId: 019a7004-3b2c-7d4e-8f5a-6b7c8d9e0f15
                expiresAt: '2026-11-20T14:30:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InternalTokenRefused'
        '403':
          $ref: '#/components/responses/IntakeApplicantAccessRefused'
        '404':
          $ref: '#/components/responses/IntakeDraftNotFound'
    delete:
      operationId: releaseIntakeAttachmentInternal
      summary: Release a draft upload that has not been claimed
      description: |
        Internal token: api-gateway and actor system, without an organization. Check
        the current publication and draft ownership. Commit the terminal release
        and its outbox fact together, including when storage-service has not yet
        recorded the reservation. A repeat of the same release is successful while
        the publication and draft are eligible. A claimed reservation is unavailable.
      tags: [intake]
      parameters:
        - $ref: '#/components/parameters/RequiredIntakeDraftKey'
      responses:
        '204':
          description: The reservation has been released.
          headers:
            Cache-Control:
              $ref: '#/components/headers/IntakeAttachmentNoStore'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InternalTokenRefused'
        '403':
          $ref: '#/components/responses/IntakeApplicantAccessRefused'
        '404':
          $ref: '#/components/responses/IntakeDraftNotFound'
components:
  securitySchemes:
    internalToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Internal token of `@cadenway/nest-common`: Ed25519, 60 seconds, `aud` = `task-service`,
        issuer `api-gateway`, or `realtime-gateway` for the access checks.
  parameters:
    SearchProjectionKind:
      name: kind
      in: query
      required: true
      description: Kind of Task resource to export.
      schema:
        $ref: '#/components/schemas/SearchProjectionKind'
    SearchProjectionSpace:
      name: spaceId
      in: query
      description: Parent space filter for task and list exports.
      schema:
        $ref: '#/components/schemas/SearchProjectionUuid'
    SearchProjectionList:
      name: listId
      in: query
      description: Parent list filter for task exports.
      schema:
        $ref: '#/components/schemas/SearchProjectionUuid'
    SheetExportColumn:
      name: sheetSortColumn
      in: query
      required: false
      description: Feuille column key or an active custom field ID for this list's space.
      schema:
        $ref: '../../components/reporting.yaml#/components/schemas/SheetExportColumn'
    SheetExportDirection:
      name: sheetSortDirection
      in: query
      required: false
      description: Sheet export sort direction, ascending when omitted. Requires sheetSortColumn.
      schema:
        $ref: '../../components/reporting.yaml#/components/schemas/SheetExportDirection'
    CustomFieldId:
      name: fieldId
      in: path
      required: true
      schema:
        $ref: '../../components/task.yaml#/components/schemas/CustomFieldId'
    GoalToday:
      name: today
      in: query
      required: true
      description: |
        The caller's calendar day. Expected goal progress is
        `100 * clamp((today - quarterStart) / (quarterEnd - quarterStart), 0, 1)`,
        using calendar days. Compare expected and actual percentages before display rounding.
      schema:
        type: string
        format: date
        examples: ['2026-11-08']
    GoalIfMatch:
      name: If-Match
      in: header
      required: false
      description: Strong ETag of the goal aggregate underlying the change.
      schema:
        type: string
        examples: ['"12"']
    GoalQuarter:
      name: quarter
      in: query
      required: true
      description: Calendar quarter whose goals are requested.
      schema:
        $ref: '../../components/goals.yaml#/components/schemas/GoalQuarter'
    GoalId:
      name: goalId
      in: path
      required: true
      description: UUID of the goal.
      schema:
        type: string
        format: uuid
        examples: [019a7008-8b9c-7d0e-8f1a-2b3c4d5e6f01]
    ResultId:
      name: resultId
      in: path
      required: true
      description: UUID of the key result within the goal.
      schema:
        type: string
        format: uuid
        examples: [019a7008-8b9c-7d0e-8f1a-2b3c4d5e6f02]
    TeamDashboardTimeZone:
      name: timeZone
      in: query
      required: true
      description: IANA time-zone identifier used to bucket completion activity.
      schema:
        $ref: '../../components/dashboard.yaml#/components/schemas/TeamDashboardTimeZone'
    TeamDashboardWeeks:
      name: weeks
      in: query
      description: Number of weeks including the week of today.
      schema:
        $ref: '../../components/dashboard.yaml#/components/schemas/TeamDashboardWeeks'
        default: 8
    TemplateId:
      name: templateId
      in: path
      required: true
      description: ID of the template.
      schema:
        type: string
        format: uuid
        examples: [019a7007-8b9c-7d0e-8f1a-2b3c4d5e6f01]
    SavedViewId:
      name: viewId
      in: path
      required: true
      description: ID of the saved view.
      schema:
        type: string
        format: uuid
        examples: [019a7007-8b9c-7d0e-8f1a-2b3c4d5e6f01]
    FavoriteId:
      name: favoriteId
      in: path
      required: true
      description: ID of the favorite.
      schema:
        type: string
        format: uuid
        examples: [019a7007-8b9c-7d0e-8f1a-2b3c4d5e6f01]
    DependencyId:
      name: dependencyId
      in: path
      required: true
      description: ID of a directed dependency edge.
      schema:
        type: string
        format: uuid
        examples: [019a7003-4d5e-7f6a-8b9c-0d1e2f3a4b01]
    DependencyDirection:
      name: direction
      in: query
      required: true
      description: Direction of the edge relative to the anchor task.
      schema:
        $ref: '#/components/schemas/DependencyDirection'
    WatcherUserId:
      name: userId
      in: path
      required: true
      description: Account whose watcher override is changed.
      schema:
        type: string
        format: uuid
        examples: [019a5f3c-8d2e-7c4a-9b1f-3e5d7a9c1b30]
    CommentId:
      name: commentId
      in: path
      required: true
      description: ID of the comment on this task.
      schema:
        type: string
        format: uuid
        examples: [019a7003-4d5e-7f6a-8b9c-0d1e2f3a4b01]
    UserId:
      name: userId
      in: path
      required: true
      description: Id of the account of the actor, as the introspection returned it.
      schema:
        type: string
        format: uuid
        examples: [019a5f3c-8d2e-7c4a-9b1f-3e5d7a9c1b30]
    SpaceId:
      name: spaceId
      in: path
      required: true
      description: Id of the space.
      schema:
        type: string
        format: uuid
        examples: [019a7000-1a2b-7c3d-8e4f-5a6b7c8d9e01]
    ListId:
      name: listId
      in: path
      required: true
      description: Id of the list.
      schema:
        type: string
        format: uuid
        examples: [019a7001-2b3c-7d4e-8f5a-6b7c8d9e0f12]
    ApprovalRoundId:
      name: roundId
      in: path
      required: true
      description: Identifier of the current approval round.
      schema:
        type: string
        format: uuid
        examples: [019a7003-4d5e-7f6a-8b9c-0d1e2f3a4b01]
    ApprovalIfMatch:
      name: If-Match
      in: header
      required: true
      description: The strong task version ETag last returned on the task or approval state.
      schema:
        type: string
        pattern: '^"[1-9][0-9]*"$'
        examples: ['"13"']
    TaskKey:
      name: taskKey
      in: path
      required: true
      description: Key of the task.
      schema:
        $ref: '../../components/task.yaml#/components/schemas/TaskKey'
    AssigneeUserId:
      name: userId
      in: path
      required: true
      description: Account of the person to assign or to remove, not the actor.
      schema:
        type: string
        format: uuid
        examples: [019a5f3c-9e1f-7b2a-8c3d-4e5f6a7b8c31]
    ChecklistItemId:
      name: checklistItemId
      in: path
      required: true
      description: Id of the checklist item.
      schema:
        type: string
        format: uuid
        examples: [019a7003-4d5e-7f6a-8b9c-0d1e2f3a4b01]
    GrantUserId:
      name: userId
      in: path
      required: true
      description: Account of the person given access, not the actor.
      schema:
        type: string
        format: uuid
        examples: [019a5f3c-a0b1-7c2d-9e3f-5a6b7c8d9e32]
    AccessRequestId:
      name: accessRequestId
      in: path
      required: true
      description: Id of the access request.
      schema:
        type: string
        format: uuid
        examples: [019a7007-8b9c-7d0e-8f1a-2b3c4d5e6f01]
    EntryId:
      name: entryId
      in: path
      required: true
      description: Id of the trash entry.
      schema:
        type: string
        format: uuid
        examples: [019a7006-7a8b-7c9d-8e0f-1a2b3c4d5e01]
    SpaceIdFilter:
      name: spaceId
      in: query
      required: false
      description: Keep the requests of this space, its lists and their tasks.
      schema:
        type: string
        format: uuid
    ListIdFilter:
      name: listId
      in: query
      required: false
      description: Keep the requests of this list and its tasks.
      schema:
        type: string
        format: uuid
    IfMatch:
      name: If-Match
      in: header
      required: false
      description: '`"<version>"` the change was made from.'
      schema:
        type: string
    RequiredIntakeIfMatch:
      name: If-Match
      in: header
      required: true
      description: Strong ETag of the current form settings.
      schema:
        type: string
        examples: ['"1"']
    IntakePublicKey:
      name: publicKey
      in: path
      required: true
      description: Opaque publication key. A key with an invalid shape is handled as unknown.
      schema:
        type: string
        example: F3Nq7tG2hu0TQvQqMCuBCgBl2R7dV7jvxrT3SRiYkTQ
    IntakeAttachmentId:
      name: attachmentId
      in: path
      required: true
      description: Stable ID already allocated to the verified publication and draft.
      schema:
        $ref: '../../components/attachments.yaml#/components/schemas/AttachmentId'
    IntakeDraftKey:
      name: Intake-Draft-Key
      in: header
      required: false
      description: Private applicant key, required when claiming attachment IDs.
      schema:
        $ref: '../../components/intake.yaml#/components/schemas/IntakeDraftKey'
    RequiredIntakeDraftKey:
      name: Intake-Draft-Key
      in: header
      required: true
      description: Private applicant key presented by the gateway for this same draft.
      schema:
        $ref: '../../components/intake.yaml#/components/schemas/IntakeDraftKey'
    TaskActionIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Stable command identity derived from the normalized Git delivery or triggering Task event,
        reused on every retry and redelivery for this actor, operation and task. Use an opaque
        value without raw provider headers or payload. Reserve a distinct value for each command
        within the signed organization and actor. Reusing a value for a different operation,
        task key or body is refused. Task rechecks current target authorization before returning
        an execution receipt and retains receipts for at least 24 hours. Callers keep their own
        durable delivery deduplication and do not resend a submitted command after that window.
      schema:
        type: string
        minLength: 1
        maxLength: 255
        examples: [p6-019a701b-2b3c-7d4e-8f5a-6b7c8d9e0f12]
    IntakeAttachmentIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Client-chosen key for this reservation within its tenant, publication and draft.
      schema:
        type: string
        minLength: 1
        maxLength: 255
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Key of the creation, as the client sent it to the gateway.
      schema:
        type: string
        minLength: 1
        maxLength: 255
    Today:
      $ref: '../../components/task.yaml#/components/parameters/Today'
    StatusFilter:
      $ref: '../../components/task.yaml#/components/parameters/StatusFilter'
    PriorityFilter:
      $ref: '../../components/task.yaml#/components/parameters/PriorityFilter'
    AssigneeFilter:
      $ref: '../../components/task.yaml#/components/parameters/AssigneeFilter'
    LabelFilter:
      $ref: '../../components/task.yaml#/components/parameters/LabelFilter'
    Search:
      $ref: '../../components/task.yaml#/components/parameters/Search'
    DueFrom:
      $ref: '../../components/task.yaml#/components/parameters/DueFrom'
    DueTo:
      $ref: '../../components/task.yaml#/components/parameters/DueTo'
    Level:
      $ref: '../../components/task.yaml#/components/parameters/Level'
    TaskSort:
      $ref: '../../components/task.yaml#/components/parameters/TaskSort'
    GroupBy:
      $ref: '../../components/task.yaml#/components/parameters/GroupBy'
    MyTaskState:
      $ref: '../../components/task.yaml#/components/parameters/MyTaskState'
    ActivityKind:
      $ref: '../../components/task.yaml#/components/parameters/ActivityKind'
    ActorId:
      $ref: '../../components/task.yaml#/components/parameters/ActorId'
  headers:
    TaskActionReplayed:
      description: Present with the value true when returning the recorded response without running the command again.
      schema:
        type: string
        const: 'true'
    AutomationTaskNoStore:
      required: true
      description: Prevents caching the automation response.
      schema:
        type: string
        const: 'private, no-store'
    SearchProjectionNoStore:
      required: true
      description: Prevents caches from storing search projection data.
      schema:
        type: string
        const: private, no-store
    AttachmentAccessNoStore:
      required: true
      description: Prevents caches from storing the access decision.
      schema:
        type: string
        const: no-store
    IntakeAttachmentNoStore:
      required: true
      description: Prevents storage of the draft authorization by caches.
      schema:
        type: string
        const: no-store
    IntakeAttachmentLocation:
      required: true
      description: Relative reference to the reservation, resolved against the request URI.
      schema:
        type: string
        examples: ['attachments/019a7004-3b2c-7d4e-8f5a-6b7c8d9e0f15']
    OnboardingETag:
      description: Version of the caller's onboarding state, `"<version>"`.
      schema:
        type: string
    GoalETag:
      description: Strong validator of the goal aggregate, including its results.
      schema:
        type: string
        examples: ['"1"']
    GoalLocation:
      description: Public URI reference for the new goal, including the creation request's today value.
      schema:
        type: string
        format: uri-reference
        examples: ['/v1/goals/019a7008-8b9c-7d0e-8f1a-2b3c4d5e6f01?today=2026-11-08']
    GoalResultLocation:
      description: Public URI reference for the new key result.
      schema:
        type: string
        format: uri-reference
        examples:
          [
            /v1/goals/019a7008-8b9c-7d0e-8f1a-2b3c4d5e6f01/results/019a7008-8b9c-7d0e-8f1a-2b3c4d5e6f02,
          ]
    ETag:
      description: Version of the space, the list or the task, `"<version>"`.
      schema:
        type: string
    RetryAfter:
      description: Seconds to wait before the request can succeed (RFC 9110).
      schema:
        type: integer
        minimum: 1
  examples:
    RoleInsufficient:
      summary: The actor sees the list without `edit`
      value:
        type: about:blank
        title: Forbidden
        status: 403
        code: access.role-insufficient
        details:
          role: view
          requiredRole: edit
    ManageForbidden:
      summary: The actor does not manage the space
      value:
        type: about:blank
        title: Forbidden
        status: 403
        code: space.manage-forbidden
    IssuerNotAllowed:
      summary: An issuer the route does not accept
      value:
        type: about:blank
        title: Forbidden
        status: 403
        code: auth.issuer-not-allowed
    TaskArchived:
      summary: An archived task
      value:
        type: about:blank
        title: Conflict
        status: 409
        code: task.archived
        details:
          key: CAD-430
    ActorNotAllowed:
      summary: Actor not accepted
      value:
        type: about:blank
        title: Forbidden
        status: 403
        code: auth.actor-not-allowed
    OrganizationRequired:
      summary: Token without an organization
      value:
        type: about:blank
        title: Forbidden
        status: 403
        code: auth.organization-required
    PrefixTaken:
      summary: Prefix of another space
      value:
        type: about:blank
        title: Conflict
        status: 409
        code: space.prefix-taken
        details:
          prefix: CAD
    RequestInProgress:
      summary: The first request with this key still runs
      value:
        type: about:blank
        title: Conflict
        status: 409
        code: idempotency.request-in-progress
    IdempotencyKeyReused:
      summary: Key sent before with another body
      value:
        type: about:blank
        title: Unprocessable Content
        status: 422
        code: idempotency.key-reused
  responses:
    GitTaskActionReceipt:
      description: |
        The Git command disposition and the minimal task identity and placement authorized by
        Task when it recorded this command. A replay makes no version, activity or event changes.
      headers:
        Idempotent-Replayed:
          $ref: '#/components/headers/TaskActionReplayed'
        Cache-Control:
          required: true
          description: Prevents caching the command receipt.
          schema:
            type: string
            const: 'private, no-store'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/GitTaskActionReceipt'
          example:
            disposition: applied
            taskId: 019a7001-1a2b-7c3d-8e4f-5a6b7c8d9e01
            listId: 019a7002-1a2b-7c3d-8e4f-5a6b7c8d9e01
            spaceId: 019a7000-1a2b-7c3d-8e4f-5a6b7c8d9e01
    TaskActionReceipt:
      description: |
        The first or recorded disposition, without task or resource properties. A no-op commits
        only the receipt. A replay makes no version, activity or event changes.
      headers:
        Idempotent-Replayed:
          $ref: '#/components/headers/TaskActionReplayed'
        Cache-Control:
          required: true
          description: Prevents caching the command receipt.
          schema:
            type: string
            const: 'private, no-store'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TaskActionReceipt'
          examples:
            applied:
              value: { disposition: applied }
            noOp:
              value: { disposition: no_op }
    TaskActionTargetUnavailable:
      description: |
        `task.not-found` for a missing, inactive, cross-tenant or unauthorized target, including
        its current parent scope. All cases return the same problem without resource details.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          example:
            type: about:blank
            title: Not Found
            status: 404
            code: task.not-found
    TaskActionUnavailable:
      description: |
        `task.action-unavailable` when Task cannot verify current authorization or complete the
        command transaction. Retry with the same key. The problem omits resource details.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
    AutomationTaskActionRefused:
      description: |
        `idempotency.key-reused` for a different body under the same command key,
        `task.assignee-invalid` for an ineligible recipient, or `task.assignee-limit-reached`
        when the task already has the maximum number of assignees. No resource details are returned.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          examples:
            idempotencyKeyReused:
              $ref: '#/components/examples/IdempotencyKeyReused'
    AutomationTaskBadRequest:
      description: '`request.invalid`: the request does not match the schema; one `details.issues` entry per issue.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/AutomationTaskNoStore'
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          example:
            type: about:blank
            title: Bad Request
            status: 400
            code: request.invalid
            details:
              issues:
                - in: body
                  path: ruleAuthorUserId
                  code: invalid_format
                  message: Expected a UUIDv7.
    AutomationTaskInternalTokenRefused:
      description: |
        The internal token is missing (`auth.token-missing`) or refused (`auth.token-invalid`,
        with `details.reason`).
      headers:
        Cache-Control:
          $ref: '#/components/headers/AutomationTaskNoStore'
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          example:
            type: about:blank
            title: Unauthorized
            status: 401
            code: auth.token-invalid
            details:
              reason: expired
    AutomationTaskInternalAccessRefused:
      description: |
        The internal token is valid but the route does not accept its issuer
        (`auth.issuer-not-allowed`) or its actor (`auth.actor-not-allowed`), or it carries no
        organization (`auth.organization-required`).
      headers:
        Cache-Control:
          $ref: '#/components/headers/AutomationTaskNoStore'
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          examples:
            issuerNotAllowed:
              $ref: '#/components/examples/IssuerNotAllowed'
            actorNotAllowed:
              $ref: '#/components/examples/ActorNotAllowed'
            organizationRequired:
              $ref: '#/components/examples/OrganizationRequired'
    AutomationTaskCommentReceipt:
      description: The first or recorded disposition of the committed comment action.
      headers:
        Idempotent-Replayed:
          $ref: '#/components/headers/TaskActionReplayed'
        Cache-Control:
          $ref: '#/components/headers/AutomationTaskNoStore'
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [disposition]
            properties:
              disposition:
                type: string
                const: applied
          example: { disposition: applied }
    AutomationTaskCommentTargetUnavailable:
      description: |
        `task.not-found` for a missing, inactive, cross-tenant or unauthorized target, including
        its current parent scope. All cases return the same problem without resource details.
      headers:
        Cache-Control:
          $ref: '#/components/headers/AutomationTaskNoStore'
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          example:
            type: about:blank
            title: Not Found
            status: 404
            code: task.not-found
    AutomationTaskCommentInProgress:
      description: '`idempotency.request-in-progress`: a request with the same `Idempotency-Key` still runs.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/AutomationTaskNoStore'
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          examples:
            requestInProgress:
              $ref: '#/components/examples/RequestInProgress'
    AutomationTaskCommentKeyReused:
      description: '`idempotency.key-reused`: the `Idempotency-Key` was sent before with another body.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/AutomationTaskNoStore'
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          examples:
            idempotencyKeyReused:
              $ref: '#/components/examples/IdempotencyKeyReused'
    AutomationTaskCommentUnavailable:
      description: |
        `task.action-unavailable` when Task cannot verify current authorization or complete the
        command transaction. Retry with the same key. The problem omits resource details.
      headers:
        Cache-Control:
          $ref: '#/components/headers/AutomationTaskNoStore'
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
    AutomationTaskNotificationAuthorizationDenied:
      description: |
        `task.not-found` for a missing, inactive, cross-tenant or unauthorized task or parent,
        or when either account lacks the required access. All cases return the same problem.
      headers:
        Cache-Control:
          $ref: '#/components/headers/AutomationTaskNoStore'
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          example:
            type: about:blank
            title: Not Found
            status: 404
            code: task.not-found
    AutomationTaskNotificationAuthorizationUnavailable:
      description: '`task.notification-authorization-unavailable`: Task could not establish a current access snapshot.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/AutomationTaskNoStore'
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          example:
            type: about:blank
            title: Notification authorization unavailable.
            status: 503
            code: task.notification-authorization-unavailable
    SearchBadRequest:
      description: |
        `request.invalid` with `details.issues` for an invalid request, selector or cursor.
        `request.body-too-large` applies when the request exceeds the JSON body limit.
      headers:
        Cache-Control:
          $ref: '#/components/headers/SearchProjectionNoStore'
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          example:
            type: about:blank
            title: Bad Request
            status: 400
            code: request.invalid
            details:
              issues:
                - in: body
                  path: candidates
                  code: duplicate
                  message: Candidate selectors must be unique.
    SearchInternalTokenRefused:
      description: '`auth.token-missing` or `auth.token-invalid`.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/SearchProjectionNoStore'
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          example:
            type: about:blank
            title: Unauthorized
            status: 401
            code: auth.token-invalid
            details:
              reason: expired
    SearchInternalAccessRefused:
      description: |
        `auth.issuer-not-allowed`, `auth.actor-not-allowed` or `auth.organization-required`.
      headers:
        Cache-Control:
          $ref: '#/components/headers/SearchProjectionNoStore'
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          examples:
            actorNotAllowed:
              $ref: '#/components/examples/ActorNotAllowed'
            organizationRequired:
              $ref: '#/components/examples/OrganizationRequired'
    SearchAccessUnavailable:
      description: '`task.search-access-unavailable`: current membership or candidate access could not be proved.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/SearchProjectionNoStore'
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          example:
            type: about:blank
            title: Service Unavailable
            status: 503
            code: task.search-access-unavailable
    SearchProjectionBatchTooLarge:
      description: '`task.projection-batch-too-large`: the full result exceeds the response byte limit. Retry with smaller batches.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/SearchProjectionNoStore'
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          example:
            type: about:blank
            title: Unprocessable Entity
            status: 422
            code: task.projection-batch-too-large
    SearchProjectionsUnavailable:
      description: '`task.projection-unavailable`: the producer could not complete the snapshot.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/SearchProjectionNoStore'
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          example:
            type: about:blank
            title: Service Unavailable
            status: 503
            code: task.projection-unavailable
    SprintReportNotFound:
      description: |
        `list.not-found` when the list is not a readable sprint. `organization.not-found`
        follows `ListNotFound`.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          example:
            type: about:blank
            title: Sprint not found.
            status: 404
            code: list.not-found
    ExportRowLimitReached:
      description: |
        `list.export-row-limit-reached` when more than 10,000 readable rows match.
        `details.maxRows` is the export limit and the response contains no CSV bytes.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          example:
            type: about:blank
            title: List export row limit reached.
            status: 422
            code: list.export-row-limit-reached
            details: { maxRows: 10000 }
    IntakeConfiguration:
      description: Current list form configuration.
      headers:
        ETag:
          $ref: '#/components/headers/ETag'
      content:
        application/json:
          schema:
            $ref: '../../components/intake.yaml#/components/schemas/IntakeFormConfiguration'
          example:
            title: Déposer une demande
            description: Décrivez votre besoin en quelques mots.
            fields:
              description: optional
              priority: optional
              dueDate: optional
              contactEmail: required
            defaultStatus: triage
            defaultAssigneeId: null
            publicKey: F3Nq7tG2hu0TQvQqMCuBCgBl2R7dV7jvxrT3SRiYkTQ
            version: 2
    IntakeApplicantAccessRefused:
      description: '`auth.issuer-not-allowed` or `auth.actor-not-allowed` for an applicant call.'
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          examples:
            issuerNotAllowed:
              $ref: '#/components/examples/IssuerNotAllowed'
            actorNotAllowed:
              $ref: '#/components/examples/ActorNotAllowed'
    PublicIntakeNotFound:
      description: '`intake-form.not-found`: generic response for a key without a valid active publication.'
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          example:
            type: about:blank
            title: Not Found
            status: 404
            code: intake-form.not-found
    IntakeDraftNotFound:
      description: |
        `intake-form.not-found` for an unavailable publication, expired or closed draft, or
        an unknown, unavailable or unrelated reservation. These cases use the same response.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          example:
            type: about:blank
            title: Not Found
            status: 404
            code: intake-form.not-found
    IntakeListArchived:
      description: '`intake-form.list-archived`: editing or publishing an archived list’s form is refused.'
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          example:
            type: about:blank
            title: Conflict
            status: 409
            code: intake-form.list-archived
    IntakeDefaultsInvalid:
      description: '`intake-form.defaults-invalid`: the configured status or assignee is invalid for this list.'
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          example:
            type: about:blank
            title: Unprocessable Content
            status: 422
            code: intake-form.defaults-invalid
    IntakeSubmissionInProgress:
      description: '`idempotency.request-in-progress`: a request with this key on this publication still runs.'
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          examples:
            requestInProgress:
              $ref: '#/components/examples/RequestInProgress'
    IntakeAttachmentSubmissionConflict:
      description: |
        `idempotency.request-in-progress` when another write holds the submission key,
        or `attachment.upload-not-ready` when verification has not been recorded for a
        selected reservation that belongs to this draft.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          examples:
            requestInProgress:
              $ref: '#/components/examples/RequestInProgress'
            uploadNotReady:
              value:
                type: about:blank
                title: Conflict
                status: 409
                code: attachment.upload-not-ready
    IntakeAttachmentAllocationRefused:
      description: |
        `attachment.file-too-large` above 26,214,400 bytes,
        `intake-form.attachments-disabled` if the form disallows attachments,
        `intake-form.attachment-limit-exceeded` if the draft holds five active
