# Internal routes of task-service, called by cadenway-api-gateway: the spaces of
# openapi/public/spaces.yaml, the lists and sprints of openapi/public/lists.yaml, the tasks,
# queries, "Mes tâches" and "Accueil" of openapi/public/tasks.yaml, the grants and access requests
# of openapi/public/access.yaml, the archives of openapi/public/archives.yaml and the trash of
# openapi/public/trash.yaml; and the access checks called by cadenway-realtime-gateway.
openapi: 3.1.0
info:
  title: task-service internal routes
  version: 1.0.0
  description: |
    What task-service exposes to the API gateway for spaces, lists, sprints, tasks, access,
    archives and the trash, and to the realtime gateway for its access checks. The service has no
    public route: the gateway serves `openapi/public/spaces.yaml`, `openapi/public/lists.yaml`,
    `openapi/public/tasks.yaml`, `openapi/public/access.yaml`, `openapi/public/archives.yaml` and
    `openapi/public/trash.yaml` and calls these routes, with the same bodies, the same answers and
    the same codes.

    | Public route | Internal call |
    | --- | --- |
    | `POST /v1/spaces` | `POST /internal/v1/spaces` |
    | `GET /v1/spaces` | `GET /internal/v1/spaces` |
    | `GET /v1/spaces/{spaceId}` | `GET /internal/v1/spaces/{spaceId}` |
    | `PATCH /v1/spaces/{spaceId}` | `PATCH /internal/v1/spaces/{spaceId}` |
    | `GET /v1/spaces/{spaceId}/overview` | `GET /internal/v1/spaces/{spaceId}/overview` |
    | `POST /v1/spaces/{spaceId}/lists` | `POST /internal/v1/spaces/{spaceId}/lists` |
    | `GET /v1/spaces/{spaceId}/lists` | `GET /internal/v1/spaces/{spaceId}/lists` |
    | `GET /v1/lists/{listId}` | `GET /internal/v1/lists/{listId}` |
    | `PATCH /v1/lists/{listId}` | `PATCH /internal/v1/lists/{listId}` |
    | `GET /v1/lists/{listId}/counts` | `GET /internal/v1/lists/{listId}/counts` |
    | `GET /v1/lists/{listId}/activity` | `GET /internal/v1/lists/{listId}/activity` |
    | `POST /v1/lists/{listId}/tasks` | `POST /internal/v1/lists/{listId}/tasks` |
    | `GET /v1/lists/{listId}/tasks` | `GET /internal/v1/lists/{listId}/tasks` |
    | `GET /v1/lists/{listId}/task-groups` | `GET /internal/v1/lists/{listId}/task-groups` |
    | `GET /v1/tasks/{taskKey}` | `GET /internal/v1/tasks/{taskKey}` |
    | `PATCH /v1/tasks/{taskKey}` | `PATCH /internal/v1/tasks/{taskKey}` |
    | `PUT /v1/tasks/{taskKey}/assignees/{userId}` | `PUT /internal/v1/tasks/{taskKey}/assignees/{userId}` |
    | `DELETE /v1/tasks/{taskKey}/assignees/{userId}` | `DELETE /internal/v1/tasks/{taskKey}/assignees/{userId}` |
    | `POST /v1/tasks/{taskKey}/labels/add` | `POST /internal/v1/tasks/{taskKey}/labels/add` |
    | `POST /v1/tasks/{taskKey}/labels/remove` | `POST /internal/v1/tasks/{taskKey}/labels/remove` |
    | `GET /v1/tasks/{taskKey}/detail` | `GET /internal/v1/tasks/{taskKey}/detail`, to which the gateway adds `partial` |
    | `GET /v1/tasks/{taskKey}/subtasks` | `GET /internal/v1/tasks/{taskKey}/subtasks` |
    | `POST /v1/tasks/{taskKey}/subtasks` | `POST /internal/v1/tasks/{taskKey}/subtasks` |
    | `POST /v1/tasks/{taskKey}/checklist-items` | `POST /internal/v1/tasks/{taskKey}/checklist-items` |
    | `PATCH /v1/tasks/{taskKey}/checklist-items/{checklistItemId}` | `PATCH /internal/v1/tasks/{taskKey}/checklist-items/{checklistItemId}` |
    | `GET /v1/tasks/{taskKey}/activity` | `GET /internal/v1/tasks/{taskKey}/activity` |
    | `GET /v1/labels` | `GET /internal/v1/labels` |
    | `GET /v1/me/tasks` | `GET /internal/v1/users/{userId}/tasks` with the user the introspection returned |
    | `GET /v1/me/home` | `GET /internal/v1/users/{userId}/home` with the user the introspection returned |
    | `DELETE /v1/spaces/{spaceId}` | `DELETE /internal/v1/spaces/{spaceId}` |
    | `DELETE /v1/lists/{listId}` | `DELETE /internal/v1/lists/{listId}` |
    | `GET /v1/spaces/{spaceId}/grants` | `GET /internal/v1/spaces/{spaceId}/grants` |
    | `PUT /v1/spaces/{spaceId}/grants/{userId}` | `PUT /internal/v1/spaces/{spaceId}/grants/{userId}` |
    | `DELETE /v1/spaces/{spaceId}/grants/{userId}` | `DELETE /internal/v1/spaces/{spaceId}/grants/{userId}` |
    | `GET /v1/lists/{listId}/grants` | `GET /internal/v1/lists/{listId}/grants` |
    | `PUT /v1/lists/{listId}/grants/{userId}` | `PUT /internal/v1/lists/{listId}/grants/{userId}` |
    | `DELETE /v1/lists/{listId}/grants/{userId}` | `DELETE /internal/v1/lists/{listId}/grants/{userId}` |
    | `POST /v1/access-requests` | `POST /internal/v1/access-requests` |
    | `GET /v1/access-requests` | `GET /internal/v1/access-requests` |
    | `POST /v1/access-requests/{accessRequestId}/approval` | `POST /internal/v1/access-requests/{accessRequestId}/approval` |
    | `POST /v1/access-requests/{accessRequestId}/refusal` | `POST /internal/v1/access-requests/{accessRequestId}/refusal` |
    | `POST /v1/lists/{listId}/archive` | `POST /internal/v1/lists/{listId}/archive` |
    | `POST /v1/lists/{listId}/unarchive` | `POST /internal/v1/lists/{listId}/unarchive` |
    | `POST /v1/tasks/{taskKey}/archive` | `POST /internal/v1/tasks/{taskKey}/archive` |
    | `POST /v1/tasks/{taskKey}/unarchive` | `POST /internal/v1/tasks/{taskKey}/unarchive` |
    | `GET /v1/archives/lists` | `GET /internal/v1/archives/lists` |
    | `GET /v1/archives/tasks` | `GET /internal/v1/archives/tasks` |
    | `POST /v1/tasks/{taskKey}/trash` | `POST /internal/v1/tasks/{taskKey}/trash` |
    | `GET /v1/trash/entries` | `GET /internal/v1/trash/entries` |
    | `DELETE /v1/trash/entries/{entryId}` | `DELETE /internal/v1/trash/entries/{entryId}` |
    | `POST /v1/trash/entries/{entryId}/restore` | `POST /internal/v1/trash/entries/{entryId}/restore` |
    | `POST /v1/trash/empty` | `POST /internal/v1/trash/empty` |

    The realtime gateway calls `GET /internal/v1/lists/{listId}/access` and
    `GET /internal/v1/tasks/{taskKey}/access`, which have no public route.

    **Internal token.** Every call carries the internal token of `@cadenway/nest-common`
    (`Authorization: Bearer`, Ed25519, 60 seconds, `aud` = `task-service`). Every route accepts the
    issuer `api-gateway` and the actor `user` only, but for the two access checks, which accept the
    issuer `realtime-gateway` only, with the actor `user`; every route requires an organization: it
    acts on the organization of the token, the current organization of the session or the
    organization of the personal API token, and runs in the tenant transaction of that
    organization. The actor and the organization come from the token, never from a body or a path;
    the `userId` of a path under `/internal/v1/users/` that is not the actor answers
    `404 user.not-found` (the `userId` of `/internal/v1/tasks/{taskKey}/assignees/{userId}` is the
    person assigned, that of `…/grants/{userId}` the person given access). The guard of the kit
    answers `401 auth.token-missing`, `401 auth.token-invalid`, `403 auth.issuer-not-allowed`,
    `403 auth.actor-not-allowed` and `403 auth.organization-required`. The gateway answers
    `403 organization.not-selected` itself, before the call, when the session has no current
    organization. Later versions accept other issuers (the automation and Git integrations, with
    their actors).

    **Members.** task-service decides every rule from its own copy of the members of each
    organization and their roles, never from the `role` of the token. It builds the copy from
    `member.joined.v1`, `member.role-changed.v1` and `member.removed.v1`
    (`asyncapi/organization-service.yaml`), through the durable consumers
    `task-service__project-member-joined`, `task-service__project-member-role-changed` and
    `task-service__project-member-removed` of the stream `EVENTS`. It reads the whole history of
    these events, applies each membership by its `version` and keeps a removed one removed, and
    retries a failed event for at least 24 hours before its dead letter. An actor the copy does not
    hold as a member of the organization of the token, for a few seconds after they joined or
    after their removal, gets `404 organization.not-found`. On `member.removed.v1`, task-service
    removes the member from the assignees of every task (an entry `assign` of the activity log and
    `task.updated.v1`, by the actor `{ type: system, id: task-service }`), gives the private
    spaces the member owned to the owner of the organization (`space.updated.v1`), removes their
    grants (`space.access-changed.v1` and `list.access-changed.v1`, by the same actor) and drops
    their pending access requests, in bounded batches. On `member.role-changed.v1`, task-service
    only records the new role: a member who becomes a guest stays among the assignees they had,
    keeps the spaces they own and their grants, and their grants of spaces give them nothing while
    they are a guest.

    **Visibility and roles.** task-service applies "Access" and "Who sees a space" of
    `openapi/public/spaces.yaml` to every route: what the actor does not see answers `404` and is
    left out of every collection, query and count; what they see without the role a change needs
    answers `403 access.role-insufficient` or `403 space.manage-forbidden`. The role of a list is
    the highest of the rule of the organization, the owner of the space, the grant of the space and
    the grant of the list: one indexed read of the grants of the actor on the space and the list.

    **Jobs.** Three jobs of `@cadenway/nest-jobs` work in bounded batches, each in the tenant
    transaction of its organization, and can stop and resume: the deletion of a list or a space
    moves its tasks to the trash, one entry per top-level task, with the actor of the deletion; the
    daily purge erases the entries 30 days after their deletion, and the tombstone of a deleted
    list or space once its last entry is erased; "Vider la corbeille" hands its entries to the
    purge. A job that moves or erases a task emits its events as it goes.

    **Access requests.** task-service counts the requests of each actor over the last hour, stored
    or not, and answers the eleventh `429 access-request.limit-reached` with
    `details.nextAvailableAt`, when the oldest request counted leaves the hour, and `Retry-After`,
    the seconds until then. The internal client does not carry the headers of a problem: the
    gateway derives the public `Retry-After` from `details.nextAvailableAt`, as for
    organization-service.

    **Creations.** A creation that carries `Idempotency-Key` is recorded with its key, the actor
    and a fingerprint of its body for 24 hours: the same key and body answer the recorded answer
    again, another body `422 idempotency.key-reused`, a request with the key that still runs
    `409 idempotency.request-in-progress`. The gateway forwards the header as it came.

    **Versions.** `ETag` and `If-Match` carry `"<version>"` as in the public routes; the gateway
    forwards both.

    **Events.** Every change emits the events of `asyncapi/task-service.yaml` through the outbox of
    `@cadenway/nest-messaging`, in the transaction of the change.

    **Errors.** The gateway forwards the `code` and the `details` and answers the French `title` of
    the public spec; the titles here are English. The gateway's internal client turns any `401`
    into `503 upstream.unauthorized`, and answers `403 auth.issuer-not-allowed`,
    `403 auth.actor-not-allowed` and `403 auth.organization-required`, configuration defects, as
    `503 upstream.unauthorized` too, never to the browser.
  contact:
    name: Cadenway
    url: https://github.com/Cadenway/cadenway-api-contracts
  license:
    name: Proprietary
    url: https://github.com/Cadenway/cadenway-api-contracts/blob/main/LICENSE
  x-consumers:
    - repository: cadenway-api-gateway
      uses: Calls every route but the access checks through its generated client, for openapi/public/spaces.yaml, openapi/public/lists.yaml, openapi/public/tasks.yaml, openapi/public/access.yaml, openapi/public/archives.yaml and openapi/public/trash.yaml, and composes the task detail.
    - repository: cadenway-realtime-gateway
      uses: Planned, the access checks of a list and a task, before a socket joins their room.
servers:
  - url: http://task-service:3013
    description: task-service on the internal network of each environment (`TASK_SERVICE_URL`).
security:
  - internalToken: []
tags:
  - name: spaces
    description: Spaces of the organization of the token.
  - name: lists
    description: Lists and sprints of the spaces of the organization of the token.
  - name: tasks
    description: Tasks, subtasks, checklists and activity logs.
  - name: task-queries
    description: The tasks of a list, filtered, sorted and counted by group, and the labels.
  - name: users
    description: '"Mes tâches" and "Accueil" of the actor.'
  - name: access
    description: The grants of spaces and lists, and the access checks of the realtime gateway.
  - name: access-requests
    description: The requests for access and their answers.
  - name: archives
    description: Archived lists and tasks.
  - name: trash
    description: The trash and its entries.
paths:
  /internal/v1/spaces:
    post:
      operationId: createSpaceInternal
      summary: Create a space
      description: |
        Creates a space owned by the actor and its list "Première liste", in one transaction, as
        `POST /v1/spaces` says. A guest gets `403 organization.role-forbidden`; a current or former
        prefix of another space, `409 space.prefix-taken`. Emits `space.created.v1` and
        `list.created.v1`. Internal token: actor `user`, organization required.
      tags: [spaces]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SpaceCreation'
            example:
              name: Ressources humaines
              prefix: RH
      responses:
        '201':
          description: The space exists, with its first list.
          headers:
            Location:
              description: '`/internal/v1/spaces/<spaceId>`.'
              schema:
                type: string
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpaceCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InternalTokenRefused'
        '403':
          $ref: '#/components/responses/RoleForbidden'
        '404':
          $ref: '#/components/responses/OrganizationNotFound'
        '409':
          $ref: '#/components/responses/SpaceCreationConflict'
        '422':
          $ref: '#/components/responses/IdempotencyKeyReused'
    get:
      operationId: listSpacesInternal
      summary: List the spaces
      description: |
        Lists the spaces the actor sees, as `GET /v1/spaces` says: in the order of the sidebar, a
        space restored from the trash at the end, and for a guest the spaces of the lists shared
        with them. Internal token: actor `user`, organization required.
      tags: [spaces]
      parameters:
        - $ref: '../../components/http.yaml#/components/parameters/Cursor'
        - $ref: '../../components/http.yaml#/components/parameters/Limit'
      responses:
        '200':
          description: One page of spaces.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpacePage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InternalTokenRefused'
        '403':
          $ref: '#/components/responses/InternalAccessRefused'
        '404':
          $ref: '#/components/responses/OrganizationNotFound'
  /internal/v1/spaces/{spaceId}:
    parameters:
      - $ref: '#/components/parameters/SpaceId'
    get:
      operationId: getSpaceInternal
      summary: Read a space
      description: |
        Returns a space the actor sees; any other answers `404 space.not-found`. Internal token:
        actor `user`, organization required.
      tags: [spaces]
      responses:
        '200':
          description: The space.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Space'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InternalTokenRefused'
        '403':
          $ref: '#/components/responses/InternalAccessRefused'
        '404':
          $ref: '#/components/responses/SpaceNotFound'
    patch:
      operationId: updateSpaceInternal
      summary: Change a space
      description: |
        Applies a JSON Merge Patch to a space the actor has `edit` on, as
        `PATCH /v1/spaces/{spaceId}` says: `403 access.role-insufficient` without it,
        `403 space.visibility-forbidden` for a change of the visibility by an actor who does not
        manage the space, `409 space.prefix-taken`, `412 request.version-mismatch`,
        `422 space.status-required`. Emits `space.updated.v1` when something changed. Internal
        token: actor `user`, organization required.
      tags: [spaces]
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SpacePatch'
            example:
              statuses:
                review:
                  name: Relecture
      responses:
        '200':
          description: The space after the change.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Space'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InternalTokenRefused'
        '403':
          $ref: '#/components/responses/SpaceWriteForbidden'
        '404':
          $ref: '#/components/responses/SpaceNotFound'
        '409':
          $ref: '#/components/responses/PrefixTaken'
        '412':
          $ref: '#/components/responses/VersionMismatch'
        '422':
          $ref: '#/components/responses/StatusRequired'
    delete:
      operationId: deleteSpaceInternal
      summary: Delete a space
      description: |
        Deletes a space the actor manages, as `DELETE /v1/spaces/{spaceId}` says
        (`403 space.manage-forbidden`, `412 request.version-mismatch`): the space and its lists
        become tombstones that every route answers `404`, its pending access requests are dropped,
        and the deletion job moves its tasks to the trash. Emits `space.deleted.v1`, then
        `task.trashed.v1` for each task the job moves. Internal token: actor `user`, organization
        required.
      tags: [spaces]
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '204':
          description: The space is deleted.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InternalTokenRefused'
        '403':
          $ref: '#/components/responses/ManageForbidden'
        '404':
          $ref: '#/components/responses/SpaceNotFound'
        '412':
          $ref: '#/components/responses/VersionMismatch'
  /internal/v1/spaces/{spaceId}/milestones:
    parameters:
      - $ref: '#/components/parameters/SpaceId'
    get:
      operationId: listSpaceMilestonesInternal
      summary: List milestones of a space
      description: |
        Returns visible live milestones in visible lists of the space, excluding archived lists.
        A caller with only list grants sees only their qualifying lists. Sort by due date ascending,
        undated last; the opaque cursor is bound to the space and ordering. Total counts matching
        visible milestones and does not change existing space, list or sprint counts.
        Internal token: issuer api-gateway, actor user and organization required.
      tags: [spaces]
      parameters:
        - $ref: '../../components/http.yaml#/components/parameters/Cursor'
        - $ref: '../../components/http.yaml#/components/parameters/Limit'
      responses:
        '200':
          description: One page of milestones.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MilestonePage'
              example: { items: [], nextCursor: null, total: 0 }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InternalTokenRefused'
        '403':
          $ref: '#/components/responses/InternalAccessRefused'
        '404':
          $ref: '#/components/responses/SpaceNotFound'
  /internal/v1/spaces/{spaceId}/overview:
    parameters:
      - $ref: '#/components/parameters/SpaceId'
    get:
      operationId: getSpaceOverviewInternal
      summary: Read the overview of a space
      description: |
        Returns the lists of a space the actor sees with the counts of their top-level tasks, as
        `GET /v1/spaces/{spaceId}/overview` says. Internal token: actor `user`, organization
        required.
      tags: [spaces]
      parameters:
        - $ref: '#/components/parameters/Today'
        - $ref: '../../components/http.yaml#/components/parameters/Cursor'
        - $ref: '../../components/http.yaml#/components/parameters/Limit'
      responses:
        '200':
          description: One page of the lists of the space, with their counts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpaceOverview'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InternalTokenRefused'
        '403':
          $ref: '#/components/responses/InternalAccessRefused'
        '404':
          $ref: '#/components/responses/SpaceNotFound'
  /internal/v1/spaces/{spaceId}/lists:
    parameters:
      - $ref: '#/components/parameters/SpaceId'
    post:
      operationId: createListInternal
      summary: Create a list or a sprint
      description: |
        Creates a list in a space the actor has `edit` on, as `POST /v1/spaces/{spaceId}/lists`
        says: `403 access.role-insufficient` without it, `422 list.sprint-dates-invalid` for an end
        before the start, `organizationAccess` on unless the body turns it off. Emits
        `list.created.v1`. Internal token: actor `user`, organization required.
      tags: [lists]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ListCreation'
            example:
              name: Sprint 15
              icon: lightning
              color: violet
              sprint:
                startDate: '2026-11-18'
                endDate: '2026-12-01'
      responses:
        '201':
          description: The list exists.
          headers:
            Location:
              description: '`/internal/v1/lists/<listId>`.'
              schema:
                type: string
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InternalTokenRefused'
        '403':
          $ref: '#/components/responses/WriteForbidden'
        '404':
          $ref: '#/components/responses/SpaceNotFound'
        '409':
          $ref: '#/components/responses/RequestInProgress'
        '422':
          $ref: '#/components/responses/ListCreationRefused'
    get:
      operationId: listListsInternal
      summary: List the lists of a space
      description: |
        Lists the lists of a space that the actor sees, in the order of the sidebar, archived
        lists left out. Internal token: actor `user`, organization required.
      tags: [lists]
      parameters:
        - $ref: '../../components/http.yaml#/components/parameters/Cursor'
        - $ref: '../../components/http.yaml#/components/parameters/Limit'
      responses:
        '200':
          description: One page of lists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskListPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InternalTokenRefused'
        '403':
          $ref: '#/components/responses/InternalAccessRefused'
        '404':
          $ref: '#/components/responses/SpaceNotFound'
  /internal/v1/lists/{listId}:
    parameters:
      - $ref: '#/components/parameters/ListId'
    get:
      operationId: getListInternal
      summary: Read a list
      description: |
        Returns a list the actor sees, an archived one included, with `callerRole`; any other, a
        deleted one included, answers `404 list.not-found`. Internal token: actor `user`,
        organization required.
      tags: [lists]
      responses:
        '200':
          description: The list.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InternalTokenRefused'
        '403':
          $ref: '#/components/responses/InternalAccessRefused'
        '404':
          $ref: '#/components/responses/ListNotFound'
    patch:
      operationId: updateListInternal
      summary: Change a list or a sprint
      description: |
        Applies a JSON Merge Patch to a list the actor has `edit` on, as `PATCH /v1/lists/{listId}`
