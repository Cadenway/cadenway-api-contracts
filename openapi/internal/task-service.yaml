            type: about:blank
            title: Notification visibility unavailable.
            status: 503
            code: task.notification-visibility-unavailable
    UserNotFound:
      description: |
        - `user.not-found`: the `userId` of the path is not the actor;
        - `organization.not-found`: see `OrganizationNotFound`.
      content:
        application/problem+json:
