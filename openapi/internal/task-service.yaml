        version; the owner of the space, `422 access.owner-unchangeable`. `ETag` gives the version
        after the change. Emits `space.access-changed.v1` when there was a grant. Internal token:
        actor `user`, organization required.
      tags: [access]
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '204':
          description: The person holds no grant on the space.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InternalTokenRefused'
        '403':
          $ref: '#/components/responses/ManageForbidden'
        '404':
          $ref: '#/components/responses/SpaceNotFound'
        '412':
          $ref: '#/components/responses/VersionMismatch'
        '422':
          $ref: '#/components/responses/OwnerUnchangeable'
