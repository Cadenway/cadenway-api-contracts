components:
  securitySchemes:
    internalToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Internal token of `@cadenway/nest-common`: Ed25519, 60 seconds, `aud` = `task-service`,
        issuer `api-gateway`, or `realtime-gateway` for the access checks.
  parameters:
    TemplateId:
      name: templateId
      in: path
      required: true
      description: ID of the template.
      schema:
        type: string
        format: uuid
        examples: [019a7007-8b9c-7d0e-8f1a-2b3c4d5e6f01]
    SavedViewId:
      name: viewId
      in: path
      required: true
      description: ID of the saved view.
      schema:
        type: string
        format: uuid
        examples: [019a7007-8b9c-7d0e-8f1a-2b3c4d5e6f01]
    FavoriteId:
      name: favoriteId
      in: path
      required: true
      description: ID of the favorite.
      schema:
        type: string
        format: uuid
        examples: [019a7007-8b9c-7d0e-8f1a-2b3c4d5e6f01]
    DependencyId:
      name: dependencyId
      in: path
      required: true
      description: ID of a directed dependency edge.
      schema:
        type: string
        format: uuid
        examples: [019a7003-4d5e-7f6a-8b9c-0d1e2f3a4b01]
    DependencyDirection:
      name: direction
      in: query
      required: true
      description: Direction of the edge relative to the anchor task.
      schema:
        $ref: '#/components/schemas/DependencyDirection'
    WatcherUserId:
      name: userId
      in: path
      required: true
      description: Account whose watcher override is changed.
      schema:
        type: string
        format: uuid
        examples: [019a5f3c-8d2e-7c4a-9b1f-3e5d7a9c1b30]
    CommentId:
      name: commentId
      in: path
      required: true
      description: ID of the comment on this task.
      schema:
        type: string
        format: uuid
        examples: [019a7003-4d5e-7f6a-8b9c-0d1e2f3a4b01]
    UserId:
      name: userId
      in: path
      required: true
      description: Id of the account of the actor, as the introspection returned it.
      schema:
        type: string
        format: uuid
        examples: [019a5f3c-8d2e-7c4a-9b1f-3e5d7a9c1b30]
    SpaceId:
      name: spaceId
      in: path
      required: true
      description: Id of the space.
      schema:
