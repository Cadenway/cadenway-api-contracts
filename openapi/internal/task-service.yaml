        '403':
          $ref: '#/components/responses/InternalAccessRefused'
        '404':
          $ref: '#/components/responses/OrganizationNotFound'
  /internal/v1/spaces/access/resolve:
    post:
      operationId: resolveDocumentSpaceAccessInternal
      summary: Resolve current space access for documents
      description: |
        Checks the requested space IDs in a single read-only tenant snapshot. The lookup reads
        the actor's active membership and role from the Organization projection together with
        live spaces and their grants, applying Task's canonical effective space role. Access to
        a list alone does not count as a role on its parent space. Unknown, deleted, hidden and
        cross-organization spaces are all omitted, as are spaces where the actor has no role.
        An absent active membership answers `404 organization.not-found` for the whole lookup.
        An empty request checks the same active membership and returns an empty result on success.

        IDs are compared case-insensitively. Each authorized space appears once with its
        canonical lowercase ID, in the order of its first occurrence in the request.
        The caller uses this decision for one authorization check for the same actor and
        organization. An omitted requested ID conveys no access. The caller rejects the whole
        proof if an entry has no role or a role other than `view`, `comment` or `edit`, a
        malformed ID, a duplicate ID after normalization or an ID outside the request. An
        error never supplies a partial decision.
        The lookup writes nothing and emits no events.

        Internal token: issuer `document-service` only, actor `user`, organization required.
        Document-service forwards the verified account and selected organization from its
        incoming call. The body cannot override the actor, organization or role.
      tags: [access]
      x-cadenway-strict-body: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentSpaceAccessLookup'
            example:
              spaceIds:
                - 019a7000-1a2b-7c3d-8e4f-5a6b7c8d9e01
                - 019a7000-1a2b-7c3d-8e4f-5a6b7c8d9e02
      responses:
        '200':
          description: The actor's effective roles on the requested spaces where they have access.
          headers:
            Cache-Control:
              description: The caller obtains a fresh decision for each authorization check.
              required: true
              schema: { const: no-store }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentSpaceAccessResult'
              example:
                results:
                  - spaceId: 019a7000-1a2b-7c3d-8e4f-5a6b7c8d9e01
                    role: edit
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InternalTokenRefused'
        '403':
          $ref: '#/components/responses/InternalAccessRefused'
        '404':
          $ref: '#/components/responses/OrganizationNotFound'
        '503':
          $ref: '#/components/responses/DocumentSpaceAccessUnavailable'
  /internal/v1/lists/{listId}/access:
    parameters:
      - $ref: '#/components/parameters/ListId'
    get:
      operationId: checkListAccessInternal
      summary: Check the access of a person to a list
      description: |
        Answers whether the actor, the person of a socket of the realtime gateway, sees a list and
        with which role, before the socket joins the room of the list. A list they do not see, a
        deleted one included, answers `404 list.not-found`, as everywhere; an archived list they
        see answers its role. One indexed read of the grants of the actor on the list and its
        space, with the space and the copy of the members; nothing is written and nothing is
        emitted.

        Internal token: issuer `realtime-gateway` only (`403 auth.issuer-not-allowed` for any
        other), actor `user`, organization required.
      tags: [access]
      responses:
        '200':
          description: The actor sees the list, with this role.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessCheck'
              example:
                role: edit
                spaceId: 019a7000-1a2b-7c3d-8e4f-5a6b7c8d9e01
                listId: 019a7001-2b3c-7d4e-8f5a-6b7c8d9e0f12
                taskKey: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InternalTokenRefused'
        '403':
          $ref: '#/components/responses/AccessCheckRefused'
        '404':
          $ref: '#/components/responses/ListNotFound'
  /internal/v1/tasks/{taskKey}/access:
    parameters:
      - $ref: '#/components/parameters/TaskKey'
    get:
      operationId: checkTaskAccessInternal
      summary: Check the access of a person to a task
      description: |
        Answers whether the actor, the person of a socket of the realtime gateway, sees a task and
        with which role, the role of its list, before the socket joins the room of the task. A
        task they do not see, a task in the trash included, answers `404 task.not-found`, never
        `task.trashed`; an archived task they see answers its role. One indexed read, as for a
        list; nothing is written and nothing is emitted.

        The response supplies the stable `taskId` for the room `task:<id>`. The realtime gateway
        uses this verified UUID to join the room. If an older task-service omits it, the gateway
        refuses the join rather than using an unverified identifier.

        Internal token: issuer `realtime-gateway` only (`403 auth.issuer-not-allowed` for any
        other), actor `user`, organization required.
      tags: [access]
      responses:
        '200':
          description: The actor sees the task, with this role.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessCheck'
              example:
