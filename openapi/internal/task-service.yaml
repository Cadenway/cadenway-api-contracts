  /internal/v1/trash/entries/{entryId}:
    parameters:
      - $ref: '#/components/parameters/EntryId'
    delete:
      operationId: purgeTrashEntryInternal
      summary: Erase a trash entry for good
      description: |
        Erases an entry the actor may restore at once, as `DELETE /v1/trash/entries/{entryId}`
        says; any other answers `404 trash-entry.not-found`. Emits `task.purged.v1` for each task
        of the entry. Internal token: actor `user`, organization required.
      tags: [trash]
      responses:
        '204':
          description: The entry is erased.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InternalTokenRefused'
        '403':
          $ref: '#/components/responses/InternalAccessRefused'
        '404':
          $ref: '#/components/responses/TrashEntryNotFound'
  /internal/v1/trash/entries/{entryId}/restore:
    parameters:
      - $ref: '#/components/parameters/EntryId'
    post:
      operationId: restoreTrashEntryInternal
      summary: Restore a trash entry
      description: |
        Brings an entry the actor may restore back to its list, as
        `POST /v1/trash/entries/{entryId}/restore` says: the root detached from a parent that is no
        longer live or can no longer take it, a deleted list and space brought back with it; any
        other entry answers `404 trash-entry.not-found`. Emits `space.restored.v1` and
        `list.restored.v1` for what came back with it, then `task.restored.v1` for each task, the
        root first. Internal token: actor `user`, organization required.
      tags: [trash]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmptyRequest'
            example: {}
      responses:
        '200':
          description: The root of the entry, back in its list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrashRestored'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InternalTokenRefused'
        '403':
          $ref: '#/components/responses/InternalAccessRefused'
        '404':
          $ref: '#/components/responses/TrashEntryNotFound'
  /internal/v1/trash/empty:
    post:
      operationId: emptyTrashInternal
      summary: Empty the trash
      description: |
        Takes every entry the actor may restore out of the trash at once and hands them to the
        purge job, as `POST /v1/trash/empty` says: `202` with their count. Emits `task.purged.v1`
        for each task as the job erases it. Internal token: actor `user`, organization required.
      tags: [trash]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmptyRequest'
            example: {}
      responses:
        '202':
          description: The entries are out of the trash and on their way to be erased.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrashEmptied'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InternalTokenRefused'
        '403':
          $ref: '#/components/responses/InternalAccessRefused'
        '404':
          $ref: '#/components/responses/OrganizationNotFound'
  /internal/v1/lists/{listId}/access:
    parameters:
      - $ref: '#/components/parameters/ListId'
    get:
      operationId: checkListAccessInternal
      summary: Check the access of a person to a list
      description: |
        Answers whether the actor, the person of a socket of the realtime gateway, sees a list and
        with which role, before the socket joins the room of the list. A list they do not see, a
        deleted one included, answers `404 list.not-found`, as everywhere; an archived list they
        see answers its role. One indexed read of the grants of the actor on the list and its
        space, with the space and the copy of the members; nothing is written and nothing is
        emitted.

        Internal token: issuer `realtime-gateway` only (`403 auth.issuer-not-allowed` for any
        other), actor `user`, organization required.
      tags: [access]
      responses:
        '200':
          description: The actor sees the list, with this role.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessCheck'
              example:
                role: edit
                spaceId: 019a7000-1a2b-7c3d-8e4f-5a6b7c8d9e01
                listId: 019a7001-2b3c-7d4e-8f5a-6b7c8d9e0f12
                taskKey: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InternalTokenRefused'
        '403':
          $ref: '#/components/responses/AccessCheckRefused'
        '404':
          $ref: '#/components/responses/ListNotFound'
  /internal/v1/tasks/{taskKey}/access:
    parameters:
      - $ref: '#/components/parameters/TaskKey'
    get:
      operationId: checkTaskAccessInternal
      summary: Check the access of a person to a task
      description: |
        Answers whether the actor, the person of a socket of the realtime gateway, sees a task and
        with which role, the role of its list, before the socket joins the room of the task. A
        task they do not see, a task in the trash included, answers `404 task.not-found`, never
        `task.trashed`; an archived task they see answers its role. One indexed read, as for a
        list; nothing is written and nothing is emitted.

        Internal token: issuer `realtime-gateway` only (`403 auth.issuer-not-allowed` for any
        other), actor `user`, organization required.
      tags: [access]
      responses:
        '200':
          description: The actor sees the task, with this role.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessCheck'
              example:
                role: comment
                spaceId: 019a7000-1a2b-7c3d-8e4f-5a6b7c8d9e01
                listId: 019a7001-2b3c-7d4e-8f5a-6b7c8d9e0f12
                taskKey: CAD-482
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InternalTokenRefused'
        '403':
          $ref: '#/components/responses/AccessCheckRefused'
        '404':
          $ref: '#/components/responses/TaskNotFound'
components:
  securitySchemes:
    internalToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Internal token of `@cadenway/nest-common`: Ed25519, 60 seconds, `aud` = `task-service`,
        issuer `api-gateway`, or `realtime-gateway` for the access checks.
  parameters:
    UserId:
      name: userId
      in: path
      required: true
      description: Id of the account of the actor, as the introspection returned it.
      schema:
        type: string
        format: uuid
        examples: [019a5f3c-8d2e-7c4a-9b1f-3e5d7a9c1b30]
    SpaceId:
      name: spaceId
      in: path
      required: true
      description: Id of the space.
      schema:
        type: string
        format: uuid
        examples: [019a7000-1a2b-7c3d-8e4f-5a6b7c8d9e01]
    ListId:
      name: listId
      in: path
      required: true
      description: Id of the list.
      schema:
        type: string
        format: uuid
        examples: [019a7001-2b3c-7d4e-8f5a-6b7c8d9e0f12]
    TaskKey:
      name: taskKey
      in: path
      required: true
      description: Key of the task.
      schema:
        $ref: '../../components/task.yaml#/components/schemas/TaskKey'
    AssigneeUserId:
      name: userId
      in: path
      required: true
      description: Account of the person to assign or to remove, not the actor.
      schema:
        type: string
        format: uuid
        examples: [019a5f3c-9e1f-7b2a-8c3d-4e5f6a7b8c31]
    ChecklistItemId:
      name: checklistItemId
      in: path
      required: true
      description: Id of the checklist item.
      schema:
        type: string
        format: uuid
        examples: [019a7003-4d5e-7f6a-8b9c-0d1e2f3a4b01]
    GrantUserId:
      name: userId
      in: path
      required: true
      description: Account of the person given access, not the actor.
      schema:
        type: string
        format: uuid
        examples: [019a5f3c-a0b1-7c2d-9e3f-5a6b7c8d9e32]
    AccessRequestId:
      name: accessRequestId
      in: path
      required: true
      description: Id of the access request.
      schema:
        type: string
        format: uuid
        examples: [019a7007-8b9c-7d0e-8f1a-2b3c4d5e6f01]
    EntryId:
      name: entryId
      in: path
      required: true
      description: Id of the trash entry.
      schema:
        type: string
        format: uuid
        examples: [019a7006-7a8b-7c9d-8e0f-1a2b3c4d5e01]
    SpaceIdFilter:
      name: spaceId
      in: query
      required: false
      description: Keep the requests of this space, its lists and their tasks.
      schema:
        type: string
        format: uuid
    ListIdFilter:
      name: listId
      in: query
      required: false
      description: Keep the requests of this list and its tasks.
      schema:
        type: string
        format: uuid
    IfMatch:
      name: If-Match
      in: header
      required: false
      description: '`"<version>"` the change was made from.'
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Key of the creation, as the client sent it to the gateway.
      schema:
        type: string
        minLength: 1
        maxLength: 255
    Today:
      $ref: '../../components/task.yaml#/components/parameters/Today'
    StatusFilter:
      $ref: '../../components/task.yaml#/components/parameters/StatusFilter'
    PriorityFilter:
      $ref: '../../components/task.yaml#/components/parameters/PriorityFilter'
    AssigneeFilter:
      $ref: '../../components/task.yaml#/components/parameters/AssigneeFilter'
    LabelFilter:
      $ref: '../../components/task.yaml#/components/parameters/LabelFilter'
    Search:
      $ref: '../../components/task.yaml#/components/parameters/Search'
    DueFrom:
      $ref: '../../components/task.yaml#/components/parameters/DueFrom'
    DueTo:
      $ref: '../../components/task.yaml#/components/parameters/DueTo'
    Level:
      $ref: '../../components/task.yaml#/components/parameters/Level'
    TaskSort:
      $ref: '../../components/task.yaml#/components/parameters/TaskSort'
    GroupBy:
      $ref: '../../components/task.yaml#/components/parameters/GroupBy'
    MyTaskState:
      $ref: '../../components/task.yaml#/components/parameters/MyTaskState'
    ActivityKind:
      $ref: '../../components/task.yaml#/components/parameters/ActivityKind'
    ActorId:
      $ref: '../../components/task.yaml#/components/parameters/ActorId'
  headers:
    ETag:
      description: Version of the space, the list or the task, `"<version>"`.
      schema:
        type: string
    RetryAfter:
      description: Seconds to wait before the request can succeed (RFC 9110).
      schema:
        type: integer
        minimum: 1
  examples:
    RoleInsufficient:
      summary: The actor sees the list without `edit`
      value:
        type: about:blank
        title: Forbidden
        status: 403
        code: access.role-insufficient
        details:
          role: view
          requiredRole: edit
    ManageForbidden:
      summary: The actor does not manage the space
      value:
        type: about:blank
        title: Forbidden
        status: 403
        code: space.manage-forbidden
    IssuerNotAllowed:
      summary: An issuer the route does not accept
      value:
        type: about:blank
        title: Forbidden
        status: 403
        code: auth.issuer-not-allowed
    TaskArchived:
      summary: An archived task
      value:
        type: about:blank
        title: Conflict
        status: 409
        code: task.archived
        details:
          key: CAD-430
    ActorNotAllowed:
      summary: Actor not accepted
      value:
        type: about:blank
        title: Forbidden
        status: 403
        code: auth.actor-not-allowed
    OrganizationRequired:
      summary: Token without an organization
      value:
        type: about:blank
        title: Forbidden
        status: 403
        code: auth.organization-required
    PrefixTaken:
      summary: Prefix of another space
      value:
        type: about:blank
        title: Conflict
        status: 409
        code: space.prefix-taken
        details:
          prefix: CAD
    RequestInProgress:
      summary: The first request with this key still runs
      value:
        type: about:blank
        title: Conflict
        status: 409
        code: idempotency.request-in-progress
    IdempotencyKeyReused:
      summary: Key sent before with another body
      value:
        type: about:blank
        title: Unprocessable Content
        status: 422
        code: idempotency.key-reused
  responses:
    BadRequest:
      description: '`request.invalid`: the request does not match the schema; one `details.issues` entry per issue.'
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          example:
            type: about:blank
            title: Bad Request
            status: 400
            code: request.invalid
            details:
              issues:
                - in: body
                  path: name
                  code: too_small
                  message: Too small
    InternalTokenRefused:
      description: |
        The internal token is missing (`auth.token-missing`) or refused (`auth.token-invalid`, with
        `details.reason`). The gateway's client reports it as `503 upstream.unauthorized`.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          example:
            type: about:blank
            title: Unauthorized
            status: 401
            code: auth.token-invalid
            details:
              reason: expired
    InternalAccessRefused:
      description: |
        The internal token is valid but the route does not accept its issuer
        (`auth.issuer-not-allowed`) or its actor (`auth.actor-not-allowed`), or it carries no
        organization (`auth.organization-required`).
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          examples:
            actorNotAllowed:
              $ref: '#/components/examples/ActorNotAllowed'
            organizationRequired:
              $ref: '#/components/examples/OrganizationRequired'
    RoleForbidden:
      description: |
        - `organization.role-forbidden`: a guest does not create spaces;
        - `auth.issuer-not-allowed`, `auth.actor-not-allowed`, `auth.organization-required`: see
          the internal token.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          examples:
            roleForbidden:
              summary: A guest
              value:
                type: about:blank
                title: Forbidden
                status: 403
                code: organization.role-forbidden
            actorNotAllowed:
              $ref: '#/components/examples/ActorNotAllowed'
    SpaceWriteForbidden:
      description: |
        - `space.visibility-forbidden`: only the owner of the space, and the owner and the admins
          of the organization, change its visibility;
        - `access.role-insufficient`: the actor sees the space without `edit` on it;
          `details.role` is their role there (`null` for a space they see only through some of its
          lists), `details.requiredRole` is `edit`;
        - `auth.issuer-not-allowed`, `auth.actor-not-allowed`, `auth.organization-required`: see
          the internal token.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          examples:
            visibilityForbidden:
              summary: A member who does not own the space
              value:
                type: about:blank
                title: Forbidden
                status: 403
                code: space.visibility-forbidden
            roleInsufficient:
              $ref: '#/components/examples/RoleInsufficient'
            actorNotAllowed:
              $ref: '#/components/examples/ActorNotAllowed'
    ManageForbidden:
      description: |
        - `space.manage-forbidden`: the actor does not manage the space: neither its owner nor,
          for a space `organization`, the owner or an admin of the organization;
        - `auth.issuer-not-allowed`, `auth.actor-not-allowed`, `auth.organization-required`: see
          the internal token.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          examples:
            manageForbidden:
              $ref: '#/components/examples/ManageForbidden'
            actorNotAllowed:
              $ref: '#/components/examples/ActorNotAllowed'
    WriteForbidden:
      description: |
        - `access.role-insufficient`: the actor sees the list, or the space for a creation of a
          list, without `edit` on it; `details.role` is their role there (`null` for a space they
          see only through some of its lists), `details.requiredRole` is `edit`;
        - `auth.issuer-not-allowed`, `auth.actor-not-allowed`, `auth.organization-required`: see
          the internal token.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          examples:
            roleInsufficient:
              $ref: '#/components/examples/RoleInsufficient'
            actorNotAllowed:
              $ref: '#/components/examples/ActorNotAllowed'
    AccessCheckRefused:
      description: |
        The internal token is valid but is not from `realtime-gateway` (`auth.issuer-not-allowed`),
        its actor is not `user` (`auth.actor-not-allowed`), or it carries no organization
        (`auth.organization-required`).
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          examples:
            issuerNotAllowed:
              $ref: '#/components/examples/IssuerNotAllowed'
            organizationRequired:
              $ref: '#/components/examples/OrganizationRequired'
    OrganizationNotFound:
      description: |
        `organization.not-found`: task-service does not hold the actor as a member of the
        organization of the token, removed or not yet learnt.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          example:
            type: about:blank
            title: Not Found
            status: 404
            code: organization.not-found
    UserNotFound:
      description: |
        - `user.not-found`: the `userId` of the path is not the actor;
        - `organization.not-found`: see `OrganizationNotFound`.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          example:
            type: about:blank
            title: Not Found
            status: 404
            code: user.not-found
    SpaceNotFound:
      description: |
        - `space.not-found`: no space with this id that the actor sees;
        - `organization.not-found`: see `OrganizationNotFound`.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          example:
            type: about:blank
            title: Not Found
            status: 404
            code: space.not-found
    ListNotFound:
      description: |
        - `list.not-found`: no list with this id that the actor sees;
        - `organization.not-found`: see `OrganizationNotFound`.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          example:
            type: about:blank
            title: Not Found
            status: 404
            code: list.not-found
    TaskNotFound:
      description: |
        - `task.not-found`: no task with this key that the actor sees, or a task in the trash the
          actor could not change;
        - `task.trashed`: the task is in the trash and the actor could change its list, with
          `details.key`, `details.name`, `details.entryId`, `details.rootKey`,
          `details.trashedAt`, `details.trashedBy` and `details.purgeAt` (see `TaskNotFound` in
          `openapi/public/tasks.yaml`); the access checks never answer it;
        - `organization.not-found`: see `OrganizationNotFound`.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          examples:
            taskNotFound:
              summary: No task the actor sees
              value:
                type: about:blank
                title: Not Found
                status: 404
                code: task.not-found
            taskTrashed:
              summary: CAD-452 in the trash
              value:
                type: about:blank
                title: Not Found
                status: 404
                code: task.trashed
                details:
                  key: CAD-452
                  name: Ancien écran de connexion
                  entryId: 019a7006-7a8b-7c9d-8e0f-1a2b3c4d5e01
                  rootKey: CAD-452
                  trashedAt: '2026-11-06T16:20:00Z'
                  trashedBy:
                    type: user
                    id: 019a5f3c-8d2e-7c4a-9b1f-3e5d7a9c1b30
                  purgeAt: '2026-12-06T16:20:00Z'
    TrashEntryNotFound:
      description: |
        - `trash-entry.not-found`: no entry with this id that the actor may restore;
        - `organization.not-found`: see `OrganizationNotFound`.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          example:
            type: about:blank
            title: Not Found
            status: 404
            code: trash-entry.not-found
    AccessRequestNotFound:
      description: |
        - `access-request.not-found`: no request with this id that the actor may answer;
        - `organization.not-found`: see `OrganizationNotFound`.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          example:
            type: about:blank
            title: Not Found
            status: 404
            code: access-request.not-found
    AccessRequestDecided:
      description: '`access-request.already-decided`: the request was approved or refused first, with `details.state`.'
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          example:
            type: about:blank
            title: Conflict
            status: 409
            code: access-request.already-decided
            details:
              state: refused
    AccessRequestLimitReached:
      description: |
        `access-request.limit-reached`: the actor asked 10 times within the last hour;
        `details.nextAvailableAt` is when the oldest request counted leaves the hour, and
        `Retry-After` the seconds until then, from which the gateway answers its own.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          example:
            type: about:blank
            title: Too Many Requests
            status: 429
            code: access-request.limit-reached
            details:
              nextAvailableAt: '2026-11-08T12:02:00Z'
    GrantRefused:
      description: |
        A grant rule refuses the request, with the codes of the public route:
        `access.grantee-invalid` (`details.userId`), `access.guest-space-forbidden`,
        `access.owner-unchangeable` or `access.grant-limit-reached`.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          examples:
            granteeInvalid:
              summary: Someone who is not in the organization
              value:
                type: about:blank
                title: Unprocessable Content
                status: 422
                code: access.grantee-invalid
                details:
                  userId: 019a6f00-1b2c-7d3e-8f4a-5b6c7d8e9f41
            grantLimitReached:
              summary: 200 grants already
              value:
                type: about:blank
                title: Unprocessable Content
                status: 422
                code: access.grant-limit-reached
    OwnerUnchangeable:
      description: '`access.owner-unchangeable`: the person is the owner of the space, who always has `edit`.'
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          example:
            type: about:blank
            title: Unprocessable Content
            status: 422
            code: access.owner-unchangeable
    TaskArchived:
      description: '`task.archived`: the task, or the parent a patch names, is archived; `details.key` names it.'
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          examples:
            taskArchived:
              $ref: '#/components/examples/TaskArchived'
    TaskCreationConflict:
      description: |
        `task.archived` (`details.key`): the task that would hold the new subtask or checklist item
        is archived; or `idempotency.request-in-progress`.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          examples:
            taskArchived:
              $ref: '#/components/examples/TaskArchived'
            requestInProgress:
              $ref: '#/components/examples/RequestInProgress'
    ChecklistItemNotFound:
      description: |
        - `checklist-item.not-found`: the task has no item with this id;
        - `task.not-found`, `organization.not-found`: see `TaskNotFound`.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          example:
            type: about:blank
            title: Not Found
            status: 404
            code: checklist-item.not-found
    PrefixTaken:
      description: '`space.prefix-taken`: another space of the organization uses or used the prefix, with `details.prefix`.'
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          examples:
            prefixTaken:
              $ref: '#/components/examples/PrefixTaken'
    SpaceCreationConflict:
      description: '`space.prefix-taken`, with `details.prefix`, or `idempotency.request-in-progress`.'
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          examples:
            prefixTaken:
              $ref: '#/components/examples/PrefixTaken'
            requestInProgress:
              $ref: '#/components/examples/RequestInProgress'
    RequestInProgress:
      description: '`idempotency.request-in-progress`: a request with the same `Idempotency-Key` still runs.'
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          examples:
            requestInProgress:
              $ref: '#/components/examples/RequestInProgress'
    IdempotencyKeyReused:
      description: '`idempotency.key-reused`: the `Idempotency-Key` was sent before with another body.'
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          examples:
            idempotencyKeyReused:
              $ref: '#/components/examples/IdempotencyKeyReused'
    StatusRequired:
      description: '`space.status-required`: the patch hides `todo` or `done`, with `details.status`.'
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          example:
            type: about:blank
            title: Unprocessable Content
            status: 422
            code: space.status-required
            details:
              status: todo
    ListCreationRefused:
      description: '`list.sprint-dates-invalid` or `idempotency.key-reused`.'
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          examples:
            sprintDatesInvalid:
              summary: End before the start
              value:
                type: about:blank
                title: Unprocessable Content
                status: 422
                code: list.sprint-dates-invalid
            idempotencyKeyReused:
              $ref: '#/components/examples/IdempotencyKeyReused'
    SprintDatesInvalid:
      description: '`list.sprint-dates-invalid`: the end of the sprint is before its start.'
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          example:
            type: about:blank
            title: Unprocessable Content
            status: 422
            code: list.sprint-dates-invalid
    TaskRefused:
      description: |
        A task rule refuses the request, with the codes of the public route: `task.status-hidden`
        (`details.status`), `task.cancel-reason-required`, `task.cancel-reason-unexpected`,
        `task.assignee-invalid` (`details.userIds`, at a creation), `task.start-date-invalid`,
        `task.list-invalid`, `task.parent-invalid` (`details.parentKey`),
        `task.subtask-depth-exceeded`, `task.subtask-limit-reached`, or, on a creation,
        `idempotency.key-reused`.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          examples:
            subtaskDepthExceeded:
              summary: More than 3 levels
              value:
                type: about:blank
                title: Unprocessable Content
                status: 422
                code: task.subtask-depth-exceeded
            assigneeInvalid:
              summary: An assignee who is not a member, or a guest
              value:
                type: about:blank
                title: Unprocessable Content
                status: 422
                code: task.assignee-invalid
                details:
                  userIds: [019a6f00-1b2c-7d3e-8f4a-5b6c7d8e9f40]
            idempotencyKeyReused:
              $ref: '#/components/examples/IdempotencyKeyReused'
    AssigneeRefused:
      description: '`task.assignee-invalid`, with `details.userIds`, or `task.assignee-limit-reached` beyond 20 assignees.'
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          examples:
            assigneeLimitReached:
              summary: 20 assignees already
              value:
                type: about:blank
                title: Unprocessable Content
                status: 422
                code: task.assignee-limit-reached
    LabelLimitReached:
      description: '`task.label-limit-reached`: the task has 20 labels.'
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          example:
            type: about:blank
            title: Unprocessable Content
            status: 422
            code: task.label-limit-reached
    ChecklistItemRefused:
      description: '`task.checklist-limit-reached` beyond 100 items, or `idempotency.key-reused`.'
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          examples:
            checklistLimitReached:
              summary: 100 items already
              value:
                type: about:blank
                title: Unprocessable Content
                status: 422
                code: task.checklist-limit-reached
            idempotencyKeyReused:
              $ref: '#/components/examples/IdempotencyKeyReused'
    VersionMismatch:
      description: '`request.version-mismatch`: `If-Match` is not the current version, with `details.version`.'
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          example:
            type: about:blank
            title: Precondition Failed
            status: 412
            code: request.version-mismatch
            details:
              version: 13
