    InternalTokenRefused:
      description: |
        The internal token is missing (`auth.token-missing`) or refused (`auth.token-invalid`, with
        `details.reason`). The gateway's client reports it as `503 upstream.unauthorized`.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          example:
            type: about:blank
            title: Unauthorized
            status: 401
            code: auth.token-invalid
            details:
              reason: expired
    InternalAccessRefused:
      description: |
        The internal token is valid but the route does not accept its issuer
        (`auth.issuer-not-allowed`) or its actor (`auth.actor-not-allowed`), or it carries no
        organization (`auth.organization-required`).
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          examples:
            actorNotAllowed:
              $ref: '#/components/examples/ActorNotAllowed'
            organizationRequired:
              $ref: '#/components/examples/OrganizationRequired'
    RoleForbidden:
      description: |
        - `organization.role-forbidden`: a guest does not create spaces;
        - `auth.issuer-not-allowed`, `auth.actor-not-allowed`, `auth.organization-required`: see
          the internal token.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          examples:
            roleForbidden:
              summary: A guest
              value:
                type: about:blank
                title: Forbidden
                status: 403
                code: organization.role-forbidden
            actorNotAllowed:
              $ref: '#/components/examples/ActorNotAllowed'
    SpaceWriteForbidden:
      description: |
        - `space.visibility-forbidden`: only the owner of the space, and the owner and the admins
          of the organization, change its visibility;
        - `access.role-insufficient`: the actor sees the space without `edit` on it;
          `details.role` is their role there (`null` for a space they see only through some of its
          lists), `details.requiredRole` is `edit`;
        - `auth.issuer-not-allowed`, `auth.actor-not-allowed`, `auth.organization-required`: see
          the internal token.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          examples:
            visibilityForbidden:
              summary: A member who does not own the space
              value:
                type: about:blank
                title: Forbidden
                status: 403
                code: space.visibility-forbidden
            roleInsufficient:
              $ref: '#/components/examples/RoleInsufficient'
            actorNotAllowed:
              $ref: '#/components/examples/ActorNotAllowed'
    ManageForbidden:
      description: |
        - `space.manage-forbidden`: the actor does not manage the space: neither its owner nor,
          for a space `organization`, the owner or an admin of the organization;
        - `auth.issuer-not-allowed`, `auth.actor-not-allowed`, `auth.organization-required`: see
          the internal token.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          examples:
            manageForbidden:
              $ref: '#/components/examples/ManageForbidden'
            actorNotAllowed:
              $ref: '#/components/examples/ActorNotAllowed'
    WriteForbidden:
      description: |
        - `access.role-insufficient`: the actor sees the list, or the space for a creation of a
          list, without `edit` on it; `details.role` is their role there (`null` for a space they
          see only through some of its lists), `details.requiredRole` is `edit`;
        - `auth.issuer-not-allowed`, `auth.actor-not-allowed`, `auth.organization-required`: see
          the internal token.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          examples:
            roleInsufficient:
              $ref: '#/components/examples/RoleInsufficient'
            actorNotAllowed:
              $ref: '#/components/examples/ActorNotAllowed'
    AccessCheckRefused:
      description: |
        The internal token is valid but is not from `realtime-gateway` (`auth.issuer-not-allowed`),
        its actor is not `user` (`auth.actor-not-allowed`), or it carries no organization
        (`auth.organization-required`).
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          examples:
            issuerNotAllowed:
              $ref: '#/components/examples/IssuerNotAllowed'
            organizationRequired:
              $ref: '#/components/examples/OrganizationRequired'
    AttachmentAccessForbidden:
      description: |
        `access.role-insufficient` when the actor sees the task but has no `edit` role on its
        current list in `write` mode. The details report the effective `role` and
        `requiredRole: edit`. Also answers `auth.issuer-not-allowed`, `auth.actor-not-allowed`
        or `auth.organization-required` for a refused verified token.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          examples:
            roleInsufficient:
              $ref: '#/components/examples/RoleInsufficient'
            issuerNotAllowed:
              $ref: '#/components/examples/IssuerNotAllowed'
            actorNotAllowed:
              $ref: '#/components/examples/ActorNotAllowed'
            organizationRequired:
              $ref: '#/components/examples/OrganizationRequired'
    AttachmentTaskNotFound:
      description: |
        `task.not-found` when the task is unknown, invisible, trashed or erased, including when
        its list or space was deleted. `organization.not-found` for an inactive membership.
      headers:
        Cache-Control:
          $ref: '#/components/headers/AttachmentAccessNoStore'
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          examples:
            taskNotFound:
              value:
                type: about:blank
                title: Not Found
                status: 404
                code: task.not-found
            organizationNotFound:
              value:
                type: about:blank
                title: Not Found
                status: 404
                code: organization.not-found
    AttachmentTaskArchived:
      description: |
        `task.archived` in `write` mode when the task or its current list is archived.
        `details.key` names the target task.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          examples:
            taskArchived:
              $ref: '#/components/examples/TaskArchived'
    OrganizationNotFound:
      description: |
        `organization.not-found`: task-service does not hold the actor as a member of the
        organization of the token, removed or not yet learnt.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          example:
            type: about:blank
            title: Not Found
            status: 404
            code: organization.not-found
    DocumentSpaceAccessUnavailable:
      description: '`task.document-space-access-unavailable`: Task could not establish a current space access snapshot.'
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          example:
            type: about:blank
            title: Document space access unavailable.
            status: 503
            code: task.document-space-access-unavailable
    NotificationSubjectLookupUnavailable:
