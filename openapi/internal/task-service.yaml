            $ref: '../../components/http.yaml#/components/schemas/Problem'
          example:
            type: about:blank
            title: Not Found
            status: 404
            code: user.not-found
    SpaceNotFound:
      description: |
        - `space.not-found`: no space with this id that the actor sees;
