          type: array
          minItems: 1
          maxItems: 100
          items:
            oneOf:
              - type: object
                additionalProperties: false
                required: [subject]
                properties:
                  subject:
                    $ref: '../../components/notification.yaml#/components/schemas/NotificationSubjectRef'
              - type: object
                additionalProperties: false
                required: [subject, display]
                properties:
                  subject:
                    oneOf:
                      - $ref: '../../components/notification.yaml#/components/schemas/NotificationTaskIdSubjectRef'
                      - $ref: '../../components/notification.yaml#/components/schemas/NotificationTaskKeySubjectRef'
                  display:
                    type: object
                    additionalProperties: false
                    description: Requests the task identity and name for display for a visible task.
                    properties:
                      commentId:
                        type: string
                        format: uuid
                        description: Requests a bounded excerpt from this comment on the resolved task.
    NotificationSubjectLookupResult:
      type: object
      additionalProperties: false
      required: [results]
      properties:
        results:
          type: array
          minItems: 1
          maxItems: 100
          description: Position-aligned outcomes, one for each submitted subject.
          items:
            oneOf:
              - type: object
                additionalProperties: false
                required: [visible]
                properties:
                  visible: { const: false }
              - type: object
                additionalProperties: false
                required: [visible]
                properties:
                  visible: { const: true }
                  display:
                    type: object
                    additionalProperties: false
                    description: Returned when the API gateway requested display data for this visible task.
                    required: [taskId, taskKey, taskName]
                    properties:
                      taskId:
                        type: string
                        format: uuid
                      taskKey:
                        $ref: '../../components/task.yaml#/components/schemas/TaskKey'
                      taskName:
                        type: string
                      commentExcerpt:
                        type: [string, 'null']
