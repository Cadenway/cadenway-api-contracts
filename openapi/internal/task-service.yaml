      tags: [tasks]
      responses:
        '200':
          description: The current approval and task version.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskApprovalState'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InternalTokenRefused'
        '403':
          $ref: '#/components/responses/InternalAccessRefused'
        '404':
          $ref: '#/components/responses/TaskNotFound'
  /internal/v1/tasks/{taskKey}/approvals/request:
    parameters:
      - $ref: '#/components/parameters/TaskKey'
    post:
      operationId: requestTaskApprovalInternal
      summary: Start or replace the current task approval
      description: |
        An editor of the task starts a new round, replacing any current round and clearing its
        votes from the current state. Closed round history is retained with the task.
        The task must be ordinary and live. All requested reviewers, including the caller
        when designated, must currently have edit access. Invalid reviewers cause
        `422 approval.reviewer-invalid` without identifying them. The request keeps the task
        status unchanged. The task version, round and approval event commit together.
        Requires an internal token from api-gateway with a user actor and an organization.
      tags: [tasks]
      parameters:
        - $ref: '#/components/parameters/ApprovalIfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskApprovalRequest'
            example:
              reviewerUserIds: [019a5f3c-9e1f-7b2a-8c3d-4e5f6a7b8c31]
      responses:
        '200':
          description: The new current round and task version.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskApprovalState'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InternalTokenRefused'
        '403':
          $ref: '#/components/responses/WriteForbidden'
        '404':
          $ref: '#/components/responses/TaskNotFound'
        '409':
          $ref: '#/components/responses/ApprovalRoundConflict'
        '412':
          $ref: '#/components/responses/VersionMismatch'
        '422':
          $ref: '#/components/responses/ApprovalReviewersRefused'
  /internal/v1/tasks/{taskKey}/approvals/{roundId}/votes/me:
    parameters:
      - $ref: '#/components/parameters/TaskKey'
      - $ref: '#/components/parameters/ApprovalRoundId'
    put:
      operationId: voteOnTaskApprovalInternal
      summary: Cast the caller's approval vote
      description: |
        The caller must be a designated reviewer of this current round and still have edit
        access. Withdraw a recorded vote before casting another. A change request creates
        a task comment with the supplied reason and moves the task to `progress`.
        When the last pending eligible reviewer approves and every eligible vote approves,
        the task moves to `done`. A refused status change leaves the vote, task, comment and
        events untouched. The normal task status, activity and recurrence rules apply.
        Requires an internal token from api-gateway with a user actor and an organization.
      tags: [tasks]
      parameters:
        - $ref: '#/components/parameters/ApprovalIfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskApprovalVote'
            example:
              decision: changes-requested
              reason: Merci de vérifier le parcours de connexion.
      responses:
        '200':
          description: The recorded decision and resulting task version.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskApprovalState'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InternalTokenRefused'
        '403':
          $ref: '#/components/responses/ApprovalVoteForbidden'
        '404':
          $ref: '#/components/responses/ApprovalRoundNotFound'
        '409':
          $ref: '#/components/responses/ApprovalVoteConflict'
        '412':
          $ref: '#/components/responses/VersionMismatch'
        '422':
          $ref: '#/components/responses/ApprovalTransitionRefused'
    delete:
      operationId: withdrawTaskApprovalVoteInternal
      summary: Withdraw the caller's approval vote
      description: |
        The caller must be a designated reviewer of this current round and still have edit
        access. Withdrawing a vote leaves the task status and any earlier comment unchanged.
        The round is recomputed from the remaining eligible votes. When the caller has no
        recorded vote, the request succeeds without a change to the task version or events.
        Requires an internal token from api-gateway with a user actor and an organization.
      tags: [tasks]
      parameters:
        - $ref: '#/components/parameters/ApprovalIfMatch'
      responses:
        '204':
          description: The caller has no recorded vote. A successful withdrawal changes the task version.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InternalTokenRefused'
        '403':
          $ref: '#/components/responses/ApprovalVoteForbidden'
        '404':
          $ref: '#/components/responses/ApprovalRoundNotFound'
        '409':
          $ref: '#/components/responses/ApprovalRoundConflict'
        '412':
          $ref: '#/components/responses/VersionMismatch'
  /internal/v1/tasks/{taskKey}/comments:
