    AccessCheck:
      type: object
      required: [role, spaceId, listId, taskKey]
      description: |
        What the realtime gateway needs to let a socket join the room of a list or a task: the role
        of the actor and where the list or the task is.
      properties:
        role:
          $ref: '../../components/task.yaml#/components/schemas/AccessRoleValue'
        spaceId:
          type: string
          format: uuid
        listId:
          type: string
          format: uuid
          description: The list checked, or the list of the task checked.
        taskKey:
          description: The task checked; `null` for a list.
          oneOf:
            - $ref: '../../components/task.yaml#/components/schemas/TaskKey'
            - type: 'null'
        taskId:
          type: string
          format: uuid
          description: |
            Stable UUID of the checked task, present on task access checks once the producer
            supports realtime room joins. Omitted on list access checks.
    DocumentSpaceAccessSpaceId:
      type: string
      format: uuid
      description: Stable UUID of a space, as accepted by the other Task space routes.
      examples: [019a7000-1a2b-7c3d-8e4f-5a6b7c8d9e01]
    DocumentSpaceAccessLookup:
      type: object
      additionalProperties: false
      required: [spaceIds]
      properties:
        spaceIds:
          type: array
          maxItems: 100
          description: Candidate spaces for a document query or mutation. An empty array requests only the current membership check. Repeated IDs share one result.
          items:
            $ref: '#/components/schemas/DocumentSpaceAccessSpaceId'
    DocumentSpaceAccessResult:
      type: object
      required: [results]
      properties:
        results:
          type: array
          maxItems: 100
          description: One entry per accessible space. An empty response grants no access.
          items:
            type: object
            required: [spaceId, role]
            properties:
              spaceId:
                $ref: '#/components/schemas/DocumentSpaceAccessSpaceId'
              role:
                $ref: '../../components/task.yaml#/components/schemas/AccessRole'
    NotificationSubjectLookup:
