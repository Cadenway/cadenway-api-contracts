      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          example:
            type: about:blank
            title: Not Found
            status: 404
            code: list.not-found
    ApprovalVoteForbidden:
      description: |
        - `approval.reviewer-required` applies when an editor was omitted from the round.
        - `access.role-insufficient` applies when the actor has a list role below `edit`.
        - See `InternalAccessRefused` for `auth.issuer-not-allowed`, `auth.actor-not-allowed` and
          `auth.organization-required`.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          examples:
            reviewerRequired:
              value:
                type: about:blank
                title: 'Forbidden'
                status: 403
                code: approval.reviewer-required
            RoleInsufficient:
              $ref: '#/components/examples/RoleInsufficient'
            ActorNotAllowed:
              $ref: '#/components/examples/ActorNotAllowed'
            OrganizationRequired:
              $ref: '#/components/examples/OrganizationRequired'
    ApprovalRoundNotFound:
      description: |
        - `approval.round-not-found` applies when the supplied ID differs from the current round or the task has no round.
        - See `TaskNotFound` for `task.not-found`, `task.trashed` and `organization.not-found`.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          examples:
            roundNotFound:
              value:
                type: about:blank
                title: 'Not Found'
                status: 404
                code: approval.round-not-found
            taskNotFound:
              value:
                type: about:blank
                title: 'Not Found'
                status: 404
                code: task.not-found
    ApprovalRoundConflict:
      description: |
        - An archived task returns `task.archived`.
        - A milestone returns `approval.milestone-unsupported`.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          examples:
            TaskArchived:
              $ref: '#/components/examples/TaskArchived'
            milestoneUnsupported:
              value:
                type: about:blank
                title: 'Conflict'
                status: 409
                code: approval.milestone-unsupported
    ApprovalVoteConflict:
      description: |
        - An archived task returns `task.archived`.
        - A milestone returns `approval.milestone-unsupported`.
        - An existing vote returns `approval.vote-already-recorded`. Withdraw it before casting another.
        - The automated completion returns `recurrence.already-spawned` if it would repeat an occurrence.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          examples:
            TaskArchived:
              $ref: '#/components/examples/TaskArchived'
            milestoneUnsupported:
              value:
                type: about:blank
                title: 'Conflict'
                status: 409
                code: approval.milestone-unsupported
            alreadyVoted:
              value:
                type: about:blank
                title: 'Conflict'
                status: 409
                code: approval.vote-already-recorded
            alreadySpawned:
              value:
                type: about:blank
                title: 'Conflict'
                status: 409
                code: recurrence.already-spawned
    ApprovalReviewersRefused:
      description: |
        A requested reviewer without edit access causes `approval.reviewer-invalid`.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          examples:
            reviewerInvalid:
              value:
                type: about:blank
                title: 'Unprocessable Content'
                status: 422
                code: approval.reviewer-invalid
    ApprovalTransitionRefused:
      description: |
        - `task.status-hidden` applies if the automatic status is unavailable in the task's space.
        - `task.subtask-limit-reached` applies if the recurrence successor would exceed the parent capacity.
        - `recurrence.date-out-of-range` applies if the successor dates are out of range.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          examples:
            statusHidden:
              value:
                type: about:blank
                title: 'Unprocessable Content'
                status: 422
                code: task.status-hidden
            subtaskLimit:
              value:
                type: about:blank
                title: 'Unprocessable Content'
                status: 422
                code: task.subtask-limit-reached
            recurrenceDates:
              value:
                type: about:blank
                title: 'Unprocessable Content'
                status: 422
                code: recurrence.date-out-of-range
    TaskNotFound:
      description: |
        - `task.not-found`: no task with this key that the actor sees, or a task in the trash the
          actor could not change;
        - `task.trashed`: the task is in the trash and the actor could change its list, with
          `details.key`, `details.name`, `details.entryId`, `details.rootKey`,
          `details.trashedAt`, `details.trashedBy` and `details.purgeAt` (see `TaskNotFound` in
          `openapi/public/tasks.yaml`); the access checks never answer it;
        - `organization.not-found`: see `OrganizationNotFound`.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          examples:
            taskNotFound:
              summary: No task the actor sees
              value:
                type: about:blank
                title: Not Found
                status: 404
                code: task.not-found
            taskTrashed:
              summary: CAD-452 in the trash
              value:
                type: about:blank
                title: Not Found
                status: 404
                code: task.trashed
                details:
                  key: CAD-452
                  name: Ancien écran de connexion
                  entryId: 019a7006-7a8b-7c9d-8e0f-1a2b3c4d5e01
                  rootKey: CAD-452
                  trashedAt: '2026-11-06T16:20:00Z'
                  trashedBy:
                    type: user
                    id: 019a5f3c-8d2e-7c4a-9b1f-3e5d7a9c1b30
                  purgeAt: '2026-12-06T16:20:00Z'
    TrashEntryNotRestorableYet:
      description: '`trash-entry.not-restorable-yet`: list deletion is still batching.'
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          example:
            type: about:blank
            title: Trash entry is not restorable yet.
            status: 409
            code: trash-entry.not-restorable-yet
    TrashEntryNotFound:
      description: |
        - `trash-entry.not-found`: no entry with this id that the actor may restore;
        - `organization.not-found`: see `OrganizationNotFound`.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          example:
            type: about:blank
            title: Not Found
            status: 404
            code: trash-entry.not-found
    AccessRequestNotFound:
      description: |
        - `access-request.not-found`: no request with this id that the actor may answer;
        - `organization.not-found`: see `OrganizationNotFound`.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          example:
            type: about:blank
            title: Not Found
            status: 404
            code: access-request.not-found
    AccessRequestDecided:
      description: '`access-request.already-decided`: the request was approved or refused first, with `details.state`.'
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          example:
            type: about:blank
            title: Conflict
            status: 409
            code: access-request.already-decided
            details:
              state: refused
    AccessRequestLimitReached:
      description: |
        `access-request.limit-reached`: the actor asked 10 times within the last hour;
        `details.nextAvailableAt` is when the oldest request counted leaves the hour, and
        `Retry-After` the seconds until then, from which the gateway answers its own.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          example:
            type: about:blank
            title: Too Many Requests
            status: 429
            code: access-request.limit-reached
            details:
              nextAvailableAt: '2026-11-08T12:02:00Z'
    GrantRefused:
      description: |
        A grant rule refuses the request, with the codes of the public route:
        `access.grantee-invalid` (`details.userId`), `access.guest-space-forbidden`,
        `access.owner-unchangeable` or `access.grant-limit-reached`.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          examples:
            granteeInvalid:
              summary: Someone who is not in the organization
              value:
                type: about:blank
                title: Unprocessable Content
                status: 422
                code: access.grantee-invalid
                details:
                  userId: 019a6f00-1b2c-7d3e-8f4a-5b6c7d8e9f41
            grantLimitReached:
              summary: 200 grants already
              value:
                type: about:blank
                title: Unprocessable Content
                status: 422
                code: access.grant-limit-reached
    OwnerUnchangeable:
      description: '`access.owner-unchangeable`: the person is the owner of the space, who always has `edit`.'
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          example:
            type: about:blank
            title: Unprocessable Content
            status: 422
            code: access.owner-unchangeable
    TaskArchived:
      description: '`task.archived`: the task, or the parent a patch names, is archived; `details.key` names it.'
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          examples:
            taskArchived:
              $ref: '#/components/examples/TaskArchived'
    TaskCreationConflict:
      description: |
        `task.archived` (`details.key`): the task that would hold the new subtask or checklist item
        is archived; or `idempotency.request-in-progress`.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          examples:
            taskArchived:
              $ref: '#/components/examples/TaskArchived'
            requestInProgress:
              $ref: '#/components/examples/RequestInProgress'
    ChecklistItemNotFound:
      description: |
        - `checklist-item.not-found`: the task has no item with this id;
        - `task.not-found`, `organization.not-found`: see `TaskNotFound`.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          example:
            type: about:blank
            title: Not Found
            status: 404
            code: checklist-item.not-found
    PrefixTaken:
      description: '`space.prefix-taken`: another space of the organization uses or used the prefix, with `details.prefix`.'
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          examples:
            prefixTaken:
              $ref: '#/components/examples/PrefixTaken'
    SpaceCreationConflict:
      description: '`space.prefix-taken`, with `details.prefix`, or `idempotency.request-in-progress`.'
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          examples:
            prefixTaken:
              $ref: '#/components/examples/PrefixTaken'
            requestInProgress:
              $ref: '#/components/examples/RequestInProgress'
    RequestInProgress:
      description: '`idempotency.request-in-progress`: a request with the same `Idempotency-Key` still runs.'
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          examples:
            requestInProgress:
              $ref: '#/components/examples/RequestInProgress'
    IdempotencyKeyReused:
      description: '`idempotency.key-reused`: the `Idempotency-Key` was sent before with another body.'
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          examples:
            idempotencyKeyReused:
              $ref: '#/components/examples/IdempotencyKeyReused'
    StatusRequired:
      description: '`space.status-required`: the patch hides `todo` or `done`, with `details.status`.'
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          example:
            type: about:blank
            title: Unprocessable Content
            status: 422
            code: space.status-required
            details:
              status: todo
    ListCreationRefused:
      description: '`list.sprint-dates-invalid` or `idempotency.key-reused`.'
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          examples:
            sprintDatesInvalid:
              summary: End before the start
              value:
                type: about:blank
                title: Unprocessable Content
                status: 422
                code: list.sprint-dates-invalid
            idempotencyKeyReused:
              $ref: '#/components/examples/IdempotencyKeyReused'
    SprintDatesInvalid:
      description: '`list.sprint-dates-invalid`: the end of the sprint is before its start.'
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          example:
            type: about:blank
            title: Unprocessable Content
            status: 422
            code: list.sprint-dates-invalid
    TaskRefused:
      description: |
        A task rule refuses the request, with the codes of the public route: `task.status-hidden`
        (`details.status`), `task.cancel-reason-required`, `task.cancel-reason-unexpected`,
        `task.assignee-invalid` (`details.userIds`, at a creation), `task.start-date-invalid`,
        `task.list-invalid`, `task.parent-invalid` (`details.parentKey`),
        `task.subtask-depth-exceeded`, `task.subtask-limit-reached`, or, on a creation,
        `idempotency.key-reused`.
        - `mention.recipient-invalid`: a description mention recipient is ineligible;
        - `milestone.status-invalid` or `milestone.dates-invalid`: the final milestone is invalid;
        - `recurrence.date-out-of-range`: the successor date cannot be represented;
        - `custom-field.value-invalid`: on a patch, a field is absent, retired or outside the
          resulting space, the value has the wrong type or designated sprint points are negative.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          examples:
            invalidCustomFieldValue:
              value:
                type: about:blank
                title: Unprocessable Content
                status: 422
                code: custom-field.value-invalid
            subtaskDepthExceeded:
              summary: More than 3 levels
              value:
                type: about:blank
                title: Unprocessable Content
                status: 422
                code: task.subtask-depth-exceeded
            assigneeInvalid:
              summary: An assignee who is not a member, or a guest
              value:
                type: about:blank
                title: Unprocessable Content
                status: 422
                code: task.assignee-invalid
                details:
                  userIds: [019a6f00-1b2c-7d3e-8f4a-5b6c7d8e9f40]
            idempotencyKeyReused:
              $ref: '#/components/examples/IdempotencyKeyReused'
    AssigneeRefused:
      description: '`task.assignee-invalid`, with `details.userIds`, or `task.assignee-limit-reached` beyond 20 assignees.'
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          examples:
            assigneeLimitReached:
              summary: 20 assignees already
              value:
                type: about:blank
                title: Unprocessable Content
                status: 422
                code: task.assignee-limit-reached
    LabelLimitReached:
      description: '`task.label-limit-reached`: the task has 20 labels.'
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          example:
            type: about:blank
            title: Unprocessable Content
            status: 422
            code: task.label-limit-reached
    ChecklistItemRefused:
      description: '`task.checklist-limit-reached` beyond 100 items, or `idempotency.key-reused`.'
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          examples:
            checklistLimitReached:
              summary: 100 items already
              value:
                type: about:blank
                title: Unprocessable Content
                status: 422
                code: task.checklist-limit-reached
            idempotencyKeyReused:
              $ref: '#/components/examples/IdempotencyKeyReused'
    VersionMismatch:
      description: '`request.version-mismatch`: `If-Match` is not the current version, with `details.version`.'
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          example:
            type: about:blank
            title: Precondition Failed
            status: 412
            code: request.version-mismatch
            details:
              version: 13
  schemas:
    SearchProjectionKind:
      type: string
      enum: [task, list, space]
    SearchProjectionUuid:
      type: string
      format: uuid
      pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-7[0-9a-fA-F]{3}-[89aAbB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$'
    SearchProjectionVersion:
      type: integer
      minimum: 1
      maximum: 9007199254740991
    SearchProjectionIdentifier:
      oneOf:
        - $ref: '../../components/task.yaml#/components/schemas/TaskKey'
        - $ref: '#/components/schemas/SearchProjectionUuid'
    SearchTaskProjection:
      type: object
      additionalProperties: false
      required: [kind, id, version, name, lifecycle, status, listId, spaceId]
      properties:
        kind:
          type: string
          const: task
        id:
          $ref: '../../components/task.yaml#/components/schemas/TaskKey'
        version:
          $ref: '#/components/schemas/SearchProjectionVersion'
        name:
          type: string
          minLength: 1
          maxLength: 300
        lifecycle:
          type: string
          const: active
        status:
          $ref: '../../components/task.yaml#/components/schemas/StatusKey'
        listId:
          $ref: '#/components/schemas/SearchProjectionUuid'
        spaceId:
          $ref: '#/components/schemas/SearchProjectionUuid'
    SearchListProjection:
      type: object
      additionalProperties: false
      required: [kind, id, version, name, lifecycle, spaceId]
      properties:
        kind:
          type: string
          const: list
        id:
          $ref: '#/components/schemas/SearchProjectionUuid'
        version:
          $ref: '#/components/schemas/SearchProjectionVersion'
        name:
          type: string
          minLength: 1
          maxLength: 80
        lifecycle:
          type: string
          const: active
        spaceId:
          $ref: '#/components/schemas/SearchProjectionUuid'
    SearchSpaceProjection:
      type: object
      additionalProperties: false
      required: [kind, id, version, name, lifecycle]
      properties:
        kind:
          type: string
          const: space
        id:
          $ref: '#/components/schemas/SearchProjectionUuid'
        version:
          $ref: '#/components/schemas/SearchProjectionVersion'
        name:
          type: string
          minLength: 1
          maxLength: 80
        lifecycle:
          type: string
          const: active
    SearchProjection:
      oneOf:
        - $ref: '#/components/schemas/SearchTaskProjection'
        - $ref: '#/components/schemas/SearchListProjection'
        - $ref: '#/components/schemas/SearchSpaceProjection'
    SearchProjectionPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/SearchProjection'
        nextCursor:
          $ref: '../../components/http.yaml#/components/schemas/NextCursor'
    SearchProjectionLookup:
      oneOf:
        - $ref: '#/components/schemas/SearchTaskProjectionLookup'
        - $ref: '#/components/schemas/SearchListProjectionLookup'
        - $ref: '#/components/schemas/SearchSpaceProjectionLookup'
    SearchTaskProjectionLookup:
      type: object
      additionalProperties: false
      required: [kind, ids]
      properties:
        kind:
          type: string
          const: task
        ids:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items:
            $ref: '../../components/task.yaml#/components/schemas/TaskKey'
    SearchListProjectionLookup:
      type: object
      additionalProperties: false
      required: [kind, ids]
