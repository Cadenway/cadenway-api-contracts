# Internal routes of task-service, called by cadenway-api-gateway: the spaces of
# openapi/public/spaces.yaml, the lists and sprints of openapi/public/lists.yaml, the tasks,
# queries, "Mes tâches" and "Accueil" of openapi/public/tasks.yaml, the grants and access requests
# of openapi/public/access.yaml, the archives of openapi/public/archives.yaml, the trash of
# openapi/public/trash.yaml, the work logs, status durations and timesheets of openapi/public/time.yaml,
# goals and reports, the intake form and attachment access. Both gateways check notification
# subject visibility. The realtime gateway checks access before a socket joins a room, and
# document-service resolves the actor's current role on the spaces that contain documents.
# Integration and Automation submit dedicated status and task actions.
openapi: 3.1.0
info:
  title: task-service internal routes
  version: 1.0.0
  description: |
    What task-service exposes to the API gateway for spaces, lists, sprints, tasks, access,
    archives, trash, time, goals, reports, intake and attachment access, and to the realtime gateway
    for its access checks. The API gateway serves the public contracts for these features and calls
    the corresponding internal routes. Document-service checks access to a document's space here.

    | Public route | Internal call |
    | --- | --- |
    | `POST /v1/spaces` | `POST /internal/v1/spaces` |
    | `GET /v1/spaces` | `GET /internal/v1/spaces` |
    | `GET /v1/spaces/{spaceId}` | `GET /internal/v1/spaces/{spaceId}` |
    | `PATCH /v1/spaces/{spaceId}` | `PATCH /internal/v1/spaces/{spaceId}` |
    | `GET /v1/spaces/{spaceId}/overview` | `GET /internal/v1/spaces/{spaceId}/overview` |
    | `POST /v1/spaces/{spaceId}/lists` | `POST /internal/v1/spaces/{spaceId}/lists` |
    | `GET /v1/spaces/{spaceId}/lists` | `GET /internal/v1/spaces/{spaceId}/lists` |
    | `GET /v1/lists/{listId}` | `GET /internal/v1/lists/{listId}` |
    | `PATCH /v1/lists/{listId}` | `PATCH /internal/v1/lists/{listId}` |
    | `GET /v1/lists/{listId}/counts` | `GET /internal/v1/lists/{listId}/counts` |
    | `GET /v1/lists/{listId}/sprint-report` | `GET /internal/v1/lists/{listId}/sprint-report` |
    | `GET /v1/lists/{listId}/workload` | `GET /internal/v1/lists/{listId}/workload` |
    | `GET /v1/lists/{listId}/timesheet` | `GET /internal/v1/lists/{listId}/timesheet` |
    | `GET /v1/lists/{listId}/tasks/export` | `GET /internal/v1/lists/{listId}/tasks/export` |
    | `GET /v1/lists/{listId}/activity` | `GET /internal/v1/lists/{listId}/activity` |
    | `POST /v1/lists/{listId}/tasks` | `POST /internal/v1/lists/{listId}/tasks` |
    | `GET /v1/lists/{listId}/tasks` | `GET /internal/v1/lists/{listId}/tasks` |
    | `GET /v1/lists/{listId}/task-groups` | `GET /internal/v1/lists/{listId}/task-groups` |
    | `GET /v1/tasks/{taskKey}` | `GET /internal/v1/tasks/{taskKey}` |
    | `PATCH /v1/tasks/{taskKey}` | `PATCH /internal/v1/tasks/{taskKey}` |
    | `PUT /v1/tasks/{taskKey}/assignees/{userId}` | `PUT /internal/v1/tasks/{taskKey}/assignees/{userId}` |
    | `DELETE /v1/tasks/{taskKey}/assignees/{userId}` | `DELETE /internal/v1/tasks/{taskKey}/assignees/{userId}` |
    | `POST /v1/tasks/{taskKey}/labels/add` | `POST /internal/v1/tasks/{taskKey}/labels/add` |
    | `POST /v1/tasks/{taskKey}/labels/remove` | `POST /internal/v1/tasks/{taskKey}/labels/remove` |
    | `GET /v1/tasks/{taskKey}/detail` | `GET /internal/v1/tasks/{taskKey}/detail`, to which the gateway adds `partial` |
    | `GET /v1/tasks/{taskKey}/subtasks` | `GET /internal/v1/tasks/{taskKey}/subtasks` |
    | `POST /v1/tasks/{taskKey}/subtasks` | `POST /internal/v1/tasks/{taskKey}/subtasks` |
    | `POST /v1/tasks/{taskKey}/checklist-items` | `POST /internal/v1/tasks/{taskKey}/checklist-items` |
    | `PATCH /v1/tasks/{taskKey}/checklist-items/{checklistItemId}` | `PATCH /internal/v1/tasks/{taskKey}/checklist-items/{checklistItemId}` |
    | `GET /v1/tasks/{taskKey}/activity` | `GET /internal/v1/tasks/{taskKey}/activity` |
    | `GET /v1/tasks/{taskKey}/time-entries` | `GET /internal/v1/tasks/{taskKey}/time-entries` |
    | `POST /v1/tasks/{taskKey}/time-entries` | `POST /internal/v1/tasks/{taskKey}/time-entries` |
    | `GET /v1/tasks/{taskKey}/time-entries/{timeEntryId}` | `GET /internal/v1/tasks/{taskKey}/time-entries/{timeEntryId}` |
    | `DELETE /v1/tasks/{taskKey}/time-entries/{timeEntryId}` | `DELETE /internal/v1/tasks/{taskKey}/time-entries/{timeEntryId}` |
    | `GET /v1/tasks/{taskKey}/time-summary` | `GET /internal/v1/tasks/{taskKey}/time-summary` |
    | `GET /v1/tasks/{taskKey}/status-durations` | `GET /internal/v1/tasks/{taskKey}/status-durations` |
    | `GET /v1/labels` | `GET /internal/v1/labels` |
    | `GET /v1/me/tasks` | `GET /internal/v1/users/{userId}/tasks` with the user the introspection returned |
    | `GET /v1/me/home` | `GET /internal/v1/users/{userId}/home` with the user the introspection returned |
    | `GET` and `PATCH /v1/me/onboarding` | `GET` and `PATCH /internal/v1/users/{userId}/onboarding` with that same user |
    | `PATCH /v1/me/onboarding/checklist` | `PATCH /internal/v1/users/{userId}/onboarding/checklist` |
    | `POST /v1/me/onboarding/finish` | `POST /internal/v1/users/{userId}/onboarding/finish` |
    | `DELETE /v1/spaces/{spaceId}` | `DELETE /internal/v1/spaces/{spaceId}` |
    | `DELETE /v1/lists/{listId}` | `DELETE /internal/v1/lists/{listId}` |
    | `GET /v1/spaces/{spaceId}/grants` | `GET /internal/v1/spaces/{spaceId}/grants` |
    | `PUT /v1/spaces/{spaceId}/grants/{userId}` | `PUT /internal/v1/spaces/{spaceId}/grants/{userId}` |
    | `DELETE /v1/spaces/{spaceId}/grants/{userId}` | `DELETE /internal/v1/spaces/{spaceId}/grants/{userId}` |
    | `GET /v1/lists/{listId}/grants` | `GET /internal/v1/lists/{listId}/grants` |
    | `PUT /v1/lists/{listId}/grants/{userId}` | `PUT /internal/v1/lists/{listId}/grants/{userId}` |
    | `DELETE /v1/lists/{listId}/grants/{userId}` | `DELETE /internal/v1/lists/{listId}/grants/{userId}` |
    | `POST /v1/access-requests` | `POST /internal/v1/access-requests` |
    | `GET /v1/access-requests` | `GET /internal/v1/access-requests` |
    | `POST /v1/access-requests/{accessRequestId}/approval` | `POST /internal/v1/access-requests/{accessRequestId}/approval` |
    | `POST /v1/access-requests/{accessRequestId}/refusal` | `POST /internal/v1/access-requests/{accessRequestId}/refusal` |
    | `POST /v1/lists/{listId}/archive` | `POST /internal/v1/lists/{listId}/archive` |
    | `POST /v1/lists/{listId}/unarchive` | `POST /internal/v1/lists/{listId}/unarchive` |
    | `POST /v1/tasks/{taskKey}/archive` | `POST /internal/v1/tasks/{taskKey}/archive` |
    | `POST /v1/tasks/{taskKey}/unarchive` | `POST /internal/v1/tasks/{taskKey}/unarchive` |
    | `GET /v1/archives/lists` | `GET /internal/v1/archives/lists` |
    | `GET /v1/archives/tasks` | `GET /internal/v1/archives/tasks` |
    | `POST /v1/tasks/{taskKey}/trash` | `POST /internal/v1/tasks/{taskKey}/trash` |
    | `GET /v1/trash/entries` | `GET /internal/v1/trash/entries` |
    | `DELETE /v1/trash/entries/{entryId}` | `DELETE /internal/v1/trash/entries/{entryId}` |
    | `POST /v1/trash/entries/{entryId}/restore` | `POST /internal/v1/trash/entries/{entryId}/restore` |
    | `POST /v1/trash/empty` | `POST /internal/v1/trash/empty` |
    | `GET/PATCH /v1/lists/{listId}/intake-form` | `GET/PATCH /internal/v1/lists/{listId}/intake-form` |
    | `POST /v1/lists/{listId}/intake-form/publish` | `POST /internal/v1/lists/{listId}/intake-form/publish` |
    | `DELETE /v1/lists/{listId}/intake-form/publication` | `DELETE /internal/v1/lists/{listId}/intake-form/publication` |
    | `GET /v1/tasks/{taskKey}/intake-contact` | `GET /internal/v1/tasks/{taskKey}/intake-contact` |
    | `GET /v1/intake-forms/{publicKey}` | `GET /internal/v1/intake-forms/{publicKey}` |
    | `POST /v1/intake-forms/{publicKey}/submissions` | `POST /internal/v1/intake-forms/{publicKey}/submissions` |
    | `POST /v1/intake-forms/{publicKey}/attachments` | `POST /internal/v1/intake-forms/{publicKey}/attachments` |
    | `POST /v1/intake-forms/{publicKey}/attachments/{attachmentId}/completion` | `GET /internal/v1/intake-forms/{publicKey}/attachments/{attachmentId}` before relaying completion to storage-service |
    | `DELETE /v1/intake-forms/{publicKey}/attachments/{attachmentId}` | `DELETE /internal/v1/intake-forms/{publicKey}/attachments/{attachmentId}` |

    The realtime gateway calls `GET /internal/v1/lists/{listId}/access` and
    `GET /internal/v1/tasks/{taskKey}/access`, which have no public route.

    Both gateways call `POST /internal/v1/notification-subjects/resolve` to check current access
    before disclosing a notification. The API gateway may also request display data for the task.

    Document-service calls `POST /internal/v1/spaces/access/resolve` for the actor's effective
    space roles. This lookup has no public route.

    Search-service calls the search projection routes to rebuild and refresh its index from
    current Task data. Before returning search results, it checks candidate visibility through
    the Task search access lookup for the verified user. These routes have no public counterpart.

    Integration-service and automation-service submit dedicated write commands with no public
    counterpart. Their responses report only the disposition of the command.

    **Internal token.** Every call carries the internal token of `@cadenway/nest-common`
    (`Authorization: Bearer`, Ed25519, 60 seconds, `aud` = `task-service`). Every route accepts the
    issuer `api-gateway` and the actor `user` by default. The two access checks accept
    `realtime-gateway` with the actor `user`. The notification lookup accepts both gateways
    with the actor `user` and restricts enrichment to `api-gateway`. The document space lookup
    accepts `document-service` with the actor `user`. Search projection routes accept the
    `search-service` issuer and the `search-service` system actor, in the signed organization.
    The search access lookup accepts the same issuer with a verified `user` actor instead.
    The Git status command accepts only `integration-service` with the actor `git`. The rule
    action and comment commands accept only `automation-service` with the actor `automation`.
    These commands require the organization in the signed token and use the signed actor ID in
    activity and events. Only `notification-service` with its own `system` actor may check
    whether an automation notification can use the task as its subject.
    The applicant intake routes accept `api-gateway`
    with the actor `system` and resolve the target exclusively from the publication key.
    The user routes require an organization and run in the tenant transaction for the
    organization's session or personal API token. They take the actor and organization from
    the internal token. The `userId` of a path under `/internal/v1/users/` that is not the actor answers
    `404 user.not-found` (the `userId` of `/internal/v1/tasks/{taskKey}/assignees/{userId}` is the
    person assigned, that of `…/grants/{userId}` the person given access). The guard of the kit
    answers `401 auth.token-missing`, `401 auth.token-invalid`, `403 auth.issuer-not-allowed`,
    `403 auth.actor-not-allowed` and `403 auth.organization-required`. The gateway answers
    `403 organization.not-selected` itself, before the call, when the session has no current
    organization.

    **Applicant intake.** The gateway uses a system token without an organization for the
    applicant routes. A valid publication key is the only authority for resolving the list
    and tenant. Task-service enters that tenant's transaction after lookup and rechecks the
    publication, list and task defaults before a write. Upload authorization additionally
    requires the private key of the same applicant draft. The request carries no actor,
    tenant or placement override. The task, contact, upload claims and receipt commit
    together. The normal task events use the system actor. Event payloads carry no contact,
    publication key or draft key.

    **Members.** task-service decides every rule from its own copy of the members of each
    organization and their roles, never from the `role` of the token. It builds the copy from
    `member.joined.v1`, `member.role-changed.v1` and `member.removed.v1`
    (`asyncapi/organization-service.yaml`), through the durable consumers
    `task-service__project-member-joined`, `task-service__project-member-role-changed` and
    `task-service__project-member-removed` of the stream `EVENTS`. It reads the whole history of
    these events, applies each membership by its `version` and keeps a removed one removed, and
    retries a failed event for at least 24 hours before its dead letter. An actor the copy does not
    hold as a member of the organization of the token, for a few seconds after they joined or
    after their removal, gets `404 organization.not-found`. On `member.removed.v1`, task-service
    removes the member from the assignees of every task (an entry `assign` of the activity log and
    `task.updated.v1`, by the actor `{ type: system, id: task-service }`), gives the private
    spaces the member owned to the owner of the organization (`space.updated.v1`), removes their
    grants (`space.access-changed.v1` and `list.access-changed.v1`, by the same actor) and drops
    their pending access requests, in bounded batches. On `member.role-changed.v1`, task-service
    only records the new role: a member who becomes a guest stays among the assignees they had,
    keeps the spaces they own and their grants, and their grants of spaces give them nothing while
    they are a guest.

    **Visibility and roles.** task-service applies "Access" and "Who sees a space" of
    `openapi/public/spaces.yaml` to every route: what the actor does not see answers `404` and is
    left out of every collection, query and count; what they see without the role a change needs
    answers `403 access.role-insufficient` or `403 space.manage-forbidden`. The role of a list is
    the highest of the rule of the organization, the owner of the space, the grant of the space and
    the grant of the list: one indexed read of the grants of the actor on the space and the list.

    **Jobs.** Three jobs of `@cadenway/nest-jobs` work in bounded batches, each in the tenant
    transaction of its organization, and can stop and resume: the deletion of a list or a space
    moves its tasks to the trash, one entry per top-level task, with the actor of the deletion; the
    daily purge erases the entries 30 days after their deletion, and the tombstone of a deleted
    list or space once its last entry is erased; "Vider la corbeille" hands its entries to the
    purge. A job that moves or erases a task emits its events as it goes.

    **Access requests.** task-service counts the requests of each actor over the last hour, stored
    or not, and answers the eleventh `429 access-request.limit-reached` with
    `details.nextAvailableAt`, when the oldest request counted leaves the hour, and `Retry-After`,
    the seconds until then. The internal client does not carry the headers of a problem: the
    gateway derives the public `Retry-After` from `details.nextAvailableAt`, as for
    organization-service.

    **Creations.** A creation that carries `Idempotency-Key` is recorded with its key, the actor
    and a fingerprint of its body for 24 hours: the same key and body answer the recorded answer
    again, another body `422 idempotency.key-reused`, a request with the key that still runs
    `409 idempotency.request-in-progress`. The gateway forwards the header as it came.

    **Versions.** `ETag` and `If-Match` carry `"<version>"` as in the public routes; the gateway
    forwards both.

    **Events.** Every change emits the events of `asyncapi/task-service.yaml` through the outbox of
    `@cadenway/nest-messaging`, in the transaction of the change.

    **Errors.** The gateway forwards the `code` and the `details` and answers the French `title` of
    the public spec; the titles here are English. The gateway's internal client turns any `401`
    into `503 upstream.unauthorized`, and answers `403 auth.issuer-not-allowed`,
    `403 auth.actor-not-allowed` and `403 auth.organization-required`, configuration defects, as
    `503 upstream.unauthorized` too, never to the browser.
  contact:
    name: Cadenway
    url: https://github.com/Cadenway/cadenway-api-contracts
  license:
    name: Proprietary
    url: https://github.com/Cadenway/cadenway-api-contracts/blob/main/LICENSE
  x-consumers:
    - repository: cadenway-api-gateway
      uses: >-
        Calls the public route counterparts through its generated client for
        openapi/public/spaces.yaml, openapi/public/lists.yaml, openapi/public/tasks.yaml,
        openapi/public/access.yaml, openapi/public/archives.yaml, openapi/public/trash.yaml,
        openapi/public/time.yaml, openapi/public/goals.yaml, openapi/public/reports.yaml and
        openapi/public/intake.yaml. It checks access for openapi/public/attachments.yaml before
        relaying to storage-service. It also composes the task detail and checks visibility and
        display data for the inbox and reminders.
    - repository: cadenway-realtime-gateway
      uses: Checks list or task access before a room join and verifies notification subject visibility before relay.
    - repository: cadenway-document-service
      uses: Resolves the actor's current space roles before returning or mutating documents.
    - repository: cadenway-search-service
      uses: Rebuilds and refreshes Task search projections and verifies current candidate visibility.
    - repository: cadenway-integration-service
      uses: Submits forward status changes for verified deliveries from repositories mapped to a Task space.
    - repository: cadenway-automation-service
      uses: Submits task writes and comments for enabled rules matched to validated Task events in the same organization.
    - repository: cadenway-notification-service
      uses: Rechecks a rule author's and recipient's task access before accepting an automation notification.
servers:
  - url: http://task-service:3013
    description: task-service on the internal network of each environment (`TASK_SERVICE_URL`).
security:
  - internalToken: []
tags:
  - name: goals
    description: Quarterly goals and key results of the current organization.
  - name: team-reports
    description: Reports over the caller's visible team work.
  - name: spaces
    description: Spaces of the organization of the token.
  - name: lists
    description: Lists and sprints of the spaces of the organization of the token.
  - name: tasks
    description: Tasks, subtasks, checklists and activity logs.
  - name: task-queries
    description: The tasks of a list, filtered, sorted and counted by group, and the labels.
  - name: users
    description: '"Mes tâches" and "Accueil" of the actor.'
  - name: access
    description: The grants of spaces and lists, attachment access and realtime room access.
  - name: access-requests
    description: The requests for access and their answers.
  - name: archives
    description: Archived lists and tasks.
  - name: trash
    description: The trash and its entries.
  - name: intake
    description: List form configuration, applicant routes and protected task contacts.
  - name: search-projections
    description: Authorized exports for the Search service's index.
paths:
  /internal/v1/task-search-projections:
    get:
      operationId: listTaskSearchProjectionsInternal
      summary: Export one page of Task search projections
      description: |
        Internal token: issuer `search-service` only, actor `{type: system, id: search-service}`,
        organization required. The token supplies the tenant. The export is system-only and
        does not grant any end-user access to its results. All responses are private, no-store.

        Returns the requested kind in ascending immutable row UUID order. A read-only tenant
        snapshot produces each page and checks its rows, lifecycle and current placement.
        The first page captures an inclusive upper row UUID for the export scope. The opaque
        cursor authenticates the tenant, kind, filters, upper bound and last emitted UUID.
        A cursor that does not match this request answers `400 request.invalid`. A page may
        contain fewer than `limit` items to keep the compact UTF-8 JSON response within 1,048,576 bytes. Only
        `nextCursor: null` completes the export. A nonterminal page advances past the last
        emitted record.

        Trashed, deleted or archived records and tasks or lists made inactive by an ancestor
        are excluded. A space moved out of active state also excludes its lists and tasks.
        A `spaceId` may narrow a list or task export, and a `listId` may narrow a task export.
        When both are supplied the filters intersect. A missing or cross-tenant parent matches
        nothing. Other filter and kind combinations answer `400 request.invalid`.
        A page is not a snapshot of the whole export. Search starts durable invalidations
        before the first page and reconciles them against current source reads before
        promoting the rebuilt index. A reopened parent needs a scoped export to discover
        active descendants that were absent during an earlier build.
        This operation writes and emits nothing.
      tags: [search-projections]
      parameters:
        - $ref: '#/components/parameters/SearchProjectionKind'
        - $ref: '#/components/parameters/SearchProjectionSpace'
        - $ref: '#/components/parameters/SearchProjectionList'
        - $ref: '../../components/http.yaml#/components/parameters/Cursor'
        - $ref: '../../components/http.yaml#/components/parameters/Limit'
      responses:
        '200':
          description: A bounded page of active projections of the requested kind.
          headers:
            Cache-Control:
              $ref: '#/components/headers/SearchProjectionNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchProjectionPage'
              example:
                items:
                  - kind: task
                    id: CAD-482
                    version: 12
                    name: Refondre l’écran de connexion SSO
                    status: progress
                    lifecycle: active
                    listId: 019a7001-1a2b-7c3d-8e4f-5a6b7c8d9e01
                    spaceId: 019a7000-1a2b-7c3d-8e4f-5a6b7c8d9e01
                nextCursor: null
        '400':
          $ref: '#/components/responses/SearchBadRequest'
        '401':
          $ref: '#/components/responses/SearchInternalTokenRefused'
        '403':
          $ref: '#/components/responses/SearchInternalAccessRefused'
        '503':
          $ref: '#/components/responses/SearchProjectionsUnavailable'
  /internal/v1/task-search-projections/resolve:
    post:
      operationId: resolveTaskSearchProjectionsInternal
      summary: Resolve current Task search projections by identifier
      description: |
        Internal token: issuer `search-service` only, actor `{type: system, id: search-service}`,
        organization required. The token supplies the tenant. All responses are private, no-store.

        Returns exactly one decision for each input ID, in request order, from one read-only
        tenant snapshot. Task IDs are their stable keys, such as `CAD-482`. List and space IDs
        are their UUIDs, compared case-insensitively and returned in canonical lowercase. IDs
        must be unique after normalization.
        Invalid IDs for the selected kind or duplicate IDs answer `400 request.invalid`.

        A current active record yields `present` with its projection. An absent record, an
        inactive record or one with an inactive ancestor yields `absent`. An absent decision
        reports the known same-tenant source version, or `null` when no source version is
        available. An unknown or cross-tenant ID has the same absent result and a null version.
        Parent changes may change whether a descendant is present without changing its own
        version. Treat these decisions as current authority; a stale fact or an unchanged
        descendant version cannot supersede them. This lookup does not confer end-user access.

        If the complete compact UTF-8 JSON response exceeds 1,048,576 bytes, the caller splits
        the batch after `422 task.projection-batch-too-large`. The producer never returns
        partial decisions. The caller treats a missing, additional, malformed, out-of-order
        or wrong-kind decision as an unavailable proof. This operation writes and emits nothing.
      tags: [search-projections]
      x-cadenway-strict-body: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchProjectionLookup'
            example:
              kind: task
              ids: [CAD-482, CAD-483]
      responses:
        '200':
          description: Current decisions in the exact order of the requested identifiers.
          headers:
            Cache-Control:
              $ref: '#/components/headers/SearchProjectionNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchProjectionDecisions'
              example:
                results:
                  - status: present
                    projection:
                      kind: task
                      id: CAD-482
                      version: 12
                      name: Refondre l’écran de connexion SSO
                      lifecycle: active
                      status: progress
                      listId: 019a7001-1a2b-7c3d-8e4f-5a6b7c8d9e01
                      spaceId: 019a7000-1a2b-7c3d-8e4f-5a6b7c8d9e01
                  - status: absent
                    id: CAD-483
                    version: null
        '400':
          $ref: '#/components/responses/SearchBadRequest'
        '401':
          $ref: '#/components/responses/SearchInternalTokenRefused'
        '403':
          $ref: '#/components/responses/SearchInternalAccessRefused'
        '422':
          $ref: '#/components/responses/SearchProjectionBatchTooLarge'
        '503':
          $ref: '#/components/responses/SearchProjectionsUnavailable'
  /internal/v1/task-search-access/resolve:
    post:
      operationId: resolveTaskSearchAccessInternal
      summary: Prove current visibility of Task search candidates
      description: |
        Requires issuer `search-service`, a verified actor of type `user` and an organization
        in the signed token. Search signs the request for its verified current user and tenant.
        The body cannot override either. Every response carries `Cache-Control: private, no-store`.

        Search obtains `membership` from Organization's current search membership proof for
        this same actor and organization before calling Task. Task compares the membership ID,
        version and role with its active membership projection, then reads resource placement,
        lifecycle and effective grants in the same read-only tenant snapshot. The body supplies
        a consistency check only. A missing local membership, any mismatch or an unavailable
        snapshot fails the whole request with `503 task.search-access-unavailable`.

        A request contains up to 100 unique selectors. An empty set still checks membership.
        Task keys are stable. UUIDs are compared case-insensitively and returned in canonical
        lowercase. A repeated selector after normalization answers `400 request.invalid`.
        Task applies its canonical read policy to each candidate in its current placement.
        Unknown, hidden, cross-tenant, archived, deleted and trashed candidates, including
        those made inactive by a parent, are all omitted. The remaining proofs follow the
        request order and carry only identities, versions, current parent IDs and the space
        access distinction. A space accessible only through a list has `directSpace: false`.
        A document in that space requires `directSpace: true`, regardless of grants on lists.

        A proof is for the signed user and organization in this request only. Search excludes
        omitted candidates and indexed records whose version or placement disagrees with current
        proof. It rejects the whole proof if a result is malformed, duplicated, out of order or
        outside the request. Results contain no titles, bodies or other display data. No state
        changes and no events are emitted.
      tags: [search-projections]
      x-cadenway-strict-body: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchAccessLookup'
            example:
              membership:
                memberId: 019a5f3d-1a2b-7c3d-8e4f-5a6b7c8d9e41
                version: 2
                role: admin
              candidates:
                - { kind: task, id: CAD-482 }
                - { kind: space, id: 019a7000-1a2b-7c3d-8e4f-5a6b7c8d9e01 }
      responses:
        '200':
          description: Current proofs for visible candidates only, in request order.
          headers:
            Cache-Control:
              $ref: '#/components/headers/SearchProjectionNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchAccessProof'
              example:
                results:
                  - kind: task
                    id: CAD-482
                    version: 12
                    listId: 019a7001-1a2b-7c3d-8e4f-5a6b7c8d9e01
                    spaceId: 019a7000-1a2b-7c3d-8e4f-5a6b7c8d9e01
                  - kind: space
                    id: 019a7000-1a2b-7c3d-8e4f-5a6b7c8d9e01
                    version: 8
                    directSpace: true
        '400':
          $ref: '#/components/responses/SearchBadRequest'
        '401':
          $ref: '#/components/responses/SearchInternalTokenRefused'
        '403':
          $ref: '#/components/responses/SearchInternalAccessRefused'
        '503':
          $ref: '#/components/responses/SearchAccessUnavailable'
