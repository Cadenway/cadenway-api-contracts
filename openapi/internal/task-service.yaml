  /internal/v1/lists/{listId}/access:
    parameters:
      - $ref: '#/components/parameters/ListId'
    get:
      operationId: checkListAccessInternal
      summary: Check the access of a person to a list
      description: |
        Answers whether the actor, the person of a socket of the realtime gateway, sees a list and
        with which role, before the socket joins the room of the list. A list they do not see, a
        deleted one included, answers `404 list.not-found`, as everywhere; an archived list they
        see answers its role. One indexed read of the grants of the actor on the list and its
        space, with the space and the copy of the members; nothing is written and nothing is
        emitted.

        Internal token: issuer `realtime-gateway` only (`403 auth.issuer-not-allowed` for any
        other), actor `user`, organization required.
      tags: [access]
      responses:
        '200':
          description: The actor sees the list, with this role.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessCheck'
              example:
                role: edit
                spaceId: 019a7000-1a2b-7c3d-8e4f-5a6b7c8d9e01
                listId: 019a7001-2b3c-7d4e-8f5a-6b7c8d9e0f12
                taskKey: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InternalTokenRefused'
        '403':
          $ref: '#/components/responses/AccessCheckRefused'
        '404':
          $ref: '#/components/responses/ListNotFound'
  /internal/v1/tasks/{taskKey}/access:
    parameters:
      - $ref: '#/components/parameters/TaskKey'
    get:
      operationId: checkTaskAccessInternal
      summary: Check the access of a person to a task
      description: |
        Answers whether the actor, the person of a socket of the realtime gateway, sees a task and
        with which role, the role of its list, before the socket joins the room of the task. A
        task they do not see, a task in the trash included, answers `404 task.not-found`, never
        `task.trashed`; an archived task they see answers its role. One indexed read, as for a
        list; nothing is written and nothing is emitted.

        Internal token: issuer `realtime-gateway` only (`403 auth.issuer-not-allowed` for any
        other), actor `user`, organization required.
      tags: [access]
      responses:
        '200':
          description: The actor sees the task, with this role.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessCheck'
              example:
                role: comment
                spaceId: 019a7000-1a2b-7c3d-8e4f-5a6b7c8d9e01
                listId: 019a7001-2b3c-7d4e-8f5a-6b7c8d9e0f12
                taskKey: CAD-482
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InternalTokenRefused'
        '403':
          $ref: '#/components/responses/AccessCheckRefused'
        '404':
          $ref: '#/components/responses/TaskNotFound'
  /internal/v1/spaces/{spaceId}/task-templates:
    parameters:
      - $ref: '#/components/parameters/SpaceId'
    get:
      operationId: listTaskTemplatesInternal
      summary: List task templates
      description: |
        The library is shared within the space and requires an actual space role; a grant only on
        a list does not grant access to the library (`404 space.not-found`). The 50-template bound
        is enforced in the owning transaction. Built-in presets are client-side.
        Ordered by creation time and ID; the opaque cursor is bound to the space and order.
        Internal token: issuer api-gateway, actor user and organization required.
      tags: [spaces]
      parameters:
        - $ref: '../../components/http.yaml#/components/parameters/Cursor'
        - $ref: '../../components/http.yaml#/components/parameters/Limit'
      responses:
        '200':
          description: Resource or page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskTemplatePage'
              example:
                items:
                  - id: 019a7007-8b9c-7d0e-8f1a-2b3c4d5e6f01
                    spaceId: 019a7000-1a2b-7c3d-8e4f-5a6b7c8d9e01
                    name: Connexion SSO
                    title: Refondre l’écran de connexion SSO
                    description: Remplacer l’écran actuel par la connexion d’entreprise.
                    priority: haute
                    labels:
                      - Auth
                      - Front
                    checklist: []
                    subtasks:
                      - Messages d’erreur et verrouillage
                      - Tests de bout en bout du SSO
                      - Documenter la connexion SSO
                    createdAt: '2026-11-08T10:40:00Z'
                    version: 1
                nextCursor: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InternalTokenRefused'
        '403':
          $ref: '#/components/responses/InternalAccessRefused'
        '404':
          $ref: '#/components/responses/SpaceNotFound'
    post:
      operationId: createTaskTemplateInternal
      summary: Save a task template
      description: |
        The library is shared within the space and requires an actual space role; a grant only on
        a list does not grant access to the library (`404 space.not-found`). The 50-template bound
        is enforced in the owning transaction. Built-in presets are client-side.
        The sourceTaskKey must name a live task in this space; a task in another space answers
        `404 task.not-found`, as does an invisible task. Requires edit on the space and source list. Captures title, description, priority,
        labels, checklist texts and direct live child names, without dates, assignees, mentions,
        recurrence, milestone or watchers. An archived source refuses writes. A restricted source
        list in an organization-visible space answers `422 template.source-restricted`, preventing
        the library from widening its audience. `422 template.limit-reached` means the library is
        full. Later source or template changes never alter previously created tasks. The client
        submits normal TaskCreation, including its checklist and name-only subtasks.
        An optional Idempotency-Key replays the original response and Location for 24 hours;
        a changed request answers `422 idempotency.key-reused` and an in-flight replay answers
        `409 idempotency.request-in-progress`.
        The change and space.task-template-changed.v1 outbox fact commit together.
        Internal token: issuer api-gateway, actor user and organization required.
      tags: [spaces]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskTemplateCreation'
            example: { sourceTaskKey: CAD-482, name: Connexion SSO }
      responses:
        '201':
          description: Resource created.
          headers:
            ETag:
              description: Version of the new resource.
              schema:
                type: string
            Location:
              description: Path of the created resource, `/internal/v1/spaces/{spaceId}/task-templates/{templateId}`.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskTemplate'
              example:
                id: 019a7007-8b9c-7d0e-8f1a-2b3c4d5e6f01
                spaceId: 019a7000-1a2b-7c3d-8e4f-5a6b7c8d9e01
                name: Connexion SSO
                title: Refondre l’écran de connexion SSO
                description: Remplacer l’écran actuel par la connexion d’entreprise.
                priority: haute
                labels: [Auth, Front]
                checklist: []
                subtasks:
