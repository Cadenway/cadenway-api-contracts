    GitTaskStatusAction:
      type: object
      additionalProperties: false
      required: [provider, spaceId, mappingAuthorUserId, status]
      properties:
        provider:
          type: string
          enum: [github, gitlab]
          description: Provider authenticated by Integration for the current delivery and mapping.
        spaceId:
          $ref: '#/components/schemas/GitTaskActionResourceId'
          description: The Task space UUIDv7 of the verified repository mapping.
        mappingAuthorUserId:
          type: string
          format: uuid
          pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-7[0-9a-fA-F]{3}-[89aAbB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$'
          description: UUIDv7 of the user whose authority Integration recorded when enabling the mapping.
        status:
          anyOf:
            - $ref: '../../components/task.yaml#/components/schemas/StatusKey'
            - type: 'null'
          description: The configured target status, or null when the delivery records a link without changing status.
    GitTaskActionResourceId:
      type: string
      format: uuid
      pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-7[0-9a-fA-F]{3}-[89aAbB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$'
      description: UUIDv7 of a resource verified by Task for a Git command.
    GitTaskActionReceipt:
      type: object
      additionalProperties: false
      required: [disposition, taskId, listId, spaceId]
      properties:
        disposition:
          $ref: '#/components/schemas/TaskActionReceipt/properties/disposition'
        taskId:
          $ref: '#/components/schemas/GitTaskActionResourceId'
        listId:
          $ref: '#/components/schemas/GitTaskActionResourceId'
        spaceId:
          $ref: '#/components/schemas/GitTaskActionResourceId'
