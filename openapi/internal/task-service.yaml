    ListTaskExport:
      type: object
      required: [filename, header, rows]
      additionalProperties: false
      properties:
        filename:
          type: string
          pattern: '^[A-Za-z0-9_-]{1,124}[.]csv$'
          description: Safe attachment basename to use in the public Content-Disposition header.
        header:
          type: string
          description: The complete encoded CSV header, with semicolon separators and without a trailing CRLF.
        rows:
          type: array
          maxItems: 10000
          description: Ordered rows with the same columns as the header.
          items:
            type: object
            required: [beforeAssignees, assigneeIds, afterAssignees]
            additionalProperties: false
            properties:
              beforeAssignees:
                type: array
                minItems: 4
                maxItems: 4
                description: Encoded identifier, name, status and priority cells in column order.
