  /internal/v1/tasks/bulk-actions:
    post:
      operationId: executeBulkTaskActionInternal
      summary: Apply an atomic bulk task action
      description: |
        Applies one explicit action to 1–50 distinct selected keys in a single tenant transaction.
        Resolve and authorize all keys and optional per-key expected versions, lock and recheck in
        stable order, then apply the action and write activity and outbox. A stale selected version
        answers `412 request.version-mismatch`; duplicate or ambiguous selections and more than 50
        keys answer `400 request.invalid`. The expansion limit is 1,000 affected task rows including
        subtrees, successors and copies (`422 bulk.expansion-limit-reached`). On any deterministic
        error nothing changes or emits; `details.key` identifies only an authorized visible task.
        Status, priority and explicit assign or unassign affect selected tasks, even selected
        descendants. Move and trash collapse selections already covered by selected ancestors;
        move carries the live subtree with immutable keys, detaching a moved subtask from its old
        parent and retaining statuses. Duplicate applies the single-task copy rule per selection.
        Existing task status, cancellation, milestone, recurrence, archive, tree and role rules
        apply. A destination that is invisible answers `404 list.not-found`, a visible but
        uneditable destination `403 access.role-insufficient`. The optional Idempotency-Key replays
        the recorded response for 24 hours, and conflicting or concurrent reuse has the standard
        `422 idempotency.key-reused` or `409 idempotency.request-in-progress` problem. Normal task
        creation, change and lifecycle facts are emitted, never partial facts.
        Internal token: issuer api-gateway, actor user and organization required.
      tags: [tasks]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkTaskAction'
            example:
              selection:
                - { taskKey: CAD-482, version: 12 }
                - { taskKey: CAD-483, version: 3 }
              action: { type: status, status: done }
      responses:
        '200':
          description: The action committed for all selected tasks.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkTaskResult'
              example:
                results:
                  - { taskKey: CAD-482, version: 13 }
                  - { taskKey: CAD-483, version: 4 }
                affectedCount: 2
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InternalTokenRefused'
        '403':
          $ref: '#/components/responses/WriteForbidden'
        '404':
          $ref: '#/components/responses/BulkTargetNotFound'
        '409':
          $ref: '#/components/responses/BulkConflict'
        '412':
          $ref: '#/components/responses/VersionMismatch'
        '422':
          $ref: '#/components/responses/BulkRefused'
  /internal/v1/tasks/{taskKey}:
    parameters:
      - $ref: '#/components/parameters/TaskKey'
    get:
      operationId: getTaskInternal
      summary: Read a task
      description: |
        Returns a task the actor sees, an archived one included; any other key answers
        `404 task.not-found`, and a task in the trash `404 task.trashed` with its `details` when
        the actor could change its list. Every route of a key answers a task in the trash so.
        Internal token: actor `user`, organization required.
      tags: [tasks]
      responses:
        '200':
          description: The task.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InternalTokenRefused'
        '403':
          $ref: '#/components/responses/InternalAccessRefused'
        '404':
          $ref: '#/components/responses/TaskNotFound'
    patch:
      operationId: updateTaskInternal
      summary: Change a task
      description: |
        Applies a JSON Merge Patch to a task the actor sees, as `PATCH /v1/tasks/{taskKey}` says:
        the status and its cancel reason, checked against the statuses of the space the task is in
        after the patch, the due date that moves the start and keeps the duration, the move of the
        task and its subtasks, the parent, `If-Match` required with `description`
        (`400 request.invalid` with an issue on the header), `edit` on the list of the task and on
        the list it moves to (`403 access.role-insufficient`), `409 task.archived` for an archived
        task or parent. A custom field patch is checked against the resulting space, clears entries
        set to null and refuses inactive or mismatched definitions and values with
        `422 custom-field.value-invalid`. Cross-space move removes incompatible values from the
        moved tasks in that transaction. Records the changes of status, priority and due date.
        Changes of the priority and the due date of a task by the same actor within 60 seconds merge into one
        entry. Emits `task.updated.v1` and `task.status-changed.v1` as the public route says. The
        assignee, label, subtask and checklist routes below refuse an archived task the same way.
        Internal token: actor `user`, organization required.
        Description mentions require If-Match, including spans-only changes. Replacing text clears
        old spans unless replacements are supplied. Milestone conversion and recurrence follow
        the shared TaskPatch rules. Entering done with a due date creates at most one root successor
        in the same list, atomically with resetting recurrence to none, the link and the outbox.
        Cancellation, an undated completion, a repeated done, creation in done and restore create
        none. A source that has already spawned cannot be rearmed (`409 recurrence.already-spawned`).
        Unrepresentable dates answer `422 recurrence.date-out-of-range`. A successor copies the
        title, Markdown, priority, labels, eligible assignees, ordinary estimate, milestone and
        unchecked checklist, with a fresh key and todo status. It excludes children, parent,
        mentions, comments, watcher overrides, dependencies and completion metadata. Start dates
        move by the due-date delta and milestones retain date alignment. Monthly cadence retains
        the original day across short months. Fresh watcher defaults apply. A live existing task
        entering done as a milestone emits milestone.reached.v1, including when the same patch
        adds the flag. Creation in done, restore, cancellation, repeated done and adding the flag
        to an already-done task do not; a later genuine transition into done can emit it again.
      tags: [tasks]
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskPatch'
            example:
              status: cancelled
              cancelReason: duplicate
      responses:
        '200':
          description: The task after the change.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InternalTokenRefused'
        '403':
          $ref: '#/components/responses/WriteForbidden'
        '404':
          $ref: '#/components/responses/TaskNotFound'
        '409':
          $ref: '#/components/responses/TaskRecurrenceConflict'
        '412':
          $ref: '#/components/responses/VersionMismatch'
        '422':
          $ref: '#/components/responses/TaskRefused'
  /internal/v1/tasks/{taskKey}/git-status-actions:
    parameters:
      - $ref: '#/components/parameters/TaskKey'
    post:
      operationId: applyGitTaskStatusActionInternal
      x-cadenway-strict-body: true
      summary: Apply a forward status transition from a verified Git delivery
      description: |
        Requires the signed `integration-service` issuer, `git` actor with the integration ID,
        `task-service` audience and organization. Integration verifies the original provider
        delivery, resolves its current active repository mapping and status rule, and binds the
        request to the normalized delivery, verified provider and mapped space before calling Task.
        The mapping carries the user who authorized it. Task verifies the task, list and space are
        active in the signed organization, rechecks that the task is currently in that mapped space
        and that the authorizing user still has edit permission on it, in the transaction that
        locks and changes the task. The mapping author supplies permission evidence only.

        The default rules map a branch or first commit to `progress`, an opened PR or MR to
        `review` (for example, PR #214 for CAD-482), and a merged PR or MR to `done`.
        The status must be available in the current space and have a strictly higher Git rank
        than the task's current status. In increasing rank, the groups are `triage`, `backlog`,
        `todo`; then `waiting`, `progress`, `blocked`; then `review`; then `testing`; then
        `done`, `cancelled`. Milestones, unavailable statuses, cancellation and transitions of
        equal or lower rank yield `no_op`. Task applies its existing status transition invariants
        and side effects, including recurrence when entering `done`. A transition refused by a
        Task business invariant yields `no_op`. A null status authorizes the link with no
        status change, for example a check completion. A change records the Git actor and verified
        provider for activity, increments the task version and enqueues `task.updated.v1` and
        `task.status-changed.v1` in the same transaction as the command receipt.
        An authorized receipt binds the stable task ID to its placement at the decision.
        A consumer of a recorded placement rechecks the task's current placement before relay.
      tags: [tasks]
      parameters:
        - $ref: '#/components/parameters/TaskActionIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GitTaskStatusAction'
            example:
              provider: github
              spaceId: 019a7000-1a2b-7c3d-8e4f-5a6b7c8d9e01
              mappingAuthorUserId: 019a5f3c-8d2e-7c4a-9b1f-3e5d7a9c1b30
              status: review
      responses:
        '200':
          $ref: '#/components/responses/GitTaskActionReceipt'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InternalTokenRefused'
        '403':
          $ref: '#/components/responses/InternalAccessRefused'
        '404':
          $ref: '#/components/responses/TaskActionTargetUnavailable'
        '409':
          $ref: '#/components/responses/RequestInProgress'
        '422':
          $ref: '#/components/responses/IdempotencyKeyReused'
        '503':
          $ref: '#/components/responses/TaskActionUnavailable'
  /internal/v1/tasks/{taskKey}/automation-actions:
    parameters:
      - $ref: '#/components/parameters/TaskKey'
    post:
      operationId: applyAutomationTaskActionInternal
      x-cadenway-strict-body: true
      summary: Apply an enabled rule's task action to the task in its triggering event
      description: |
        Requires the signed `automation-service` issuer, `automation` actor with the rule ID,
        `task-service` audience and organization. Automation validates the `task.created.v1` or
        `task.status-changed.v1` event and binds the task key and organization to that event. It
        selects the action of its current enabled rule in that organization, using the authority
        recorded at rule creation. It ignores `task.status-changed.v1` events from `automation`
        actors.

        In the tenant transaction, Task locks the target, verifies that the task and its parents
        are active, and rechecks the rule author's current membership and effective edit permission
        on the task. The rule ID remains the actor for all activity and events. Assignment also
        applies Task's current recipient eligibility and assignee limit. An unchanged priority or
        an existing eligible assignee yields `no_op`. A change commits the command receipt, write,
        activity and usual task outbox entries together.

        This command accepts only `assign` and `priority`. Automatic comments have their own
        Task command. Notification handles the `notify` action and checks current task access
        through the automation notification authorization operation.
      tags: [tasks]
      parameters:
        - $ref: '#/components/parameters/TaskActionIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AutomationTaskActionCommand'
            example:
              ruleAuthorUserId: 019a5f3c-8d2e-7c4a-9b1f-3e5d7a9c1b30
              type: priority
              priority: haute
      responses:
        '200':
          $ref: '#/components/responses/TaskActionReceipt'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InternalTokenRefused'
        '403':
          $ref: '#/components/responses/InternalAccessRefused'
        '404':
          $ref: '#/components/responses/TaskActionTargetUnavailable'
        '409':
          $ref: '#/components/responses/RequestInProgress'
        '422':
          $ref: '#/components/responses/AutomationTaskActionRefused'
        '503':
          $ref: '#/components/responses/TaskActionUnavailable'
  /internal/v1/tasks/{taskKey}/automation-comments:
    parameters:
      - $ref: '#/components/parameters/TaskKey'
    post:
      operationId: applyAutomationTaskCommentInternal
      x-cadenway-strict-body: true
      summary: Apply an enabled rule's comment action to its triggering task
      description: |
        Requires signed issuer `automation-service`, audience `task-service`, an organization
        and an `automation` actor whose ID is the rule UUIDv7 in canonical lowercase form.
        Automation signs that form so every retry uses the same actor-scoped receipt. It binds
        the command to the task key and organization of a validated `task.created.v1` or
        `task.status-changed.v1` event, ignores automation-authored status events, and selects
        the action and recorded author of its current enabled rule in that organization.

        Task uses the signed organization only. It checks current rule-author membership and
        effective `edit` access on the active task and its active parent scope before any
        receipt lookup or replay. The write transaction locks and rechecks those conditions.
        The signed rule is the author of the comment, its activity and its event. On ordinary
        comment reads, it has `actor.type: automation`, `mentions: []` and
        `replyToCommentId: null`. The rule author's account ID serves only as authorization
        evidence and is not exposed as the comment author. A human task editor who also manages
        the current space may delete the comment through the ordinary moderation path.

        The comment, task version, comment activity, text-free `comment.created.v1` event with
        current eligible watchers, and command receipt commit together. A replay returns the
        recorded disposition without repeating those changes or recreating a moderated comment.
        All responses send `Cache-Control: private, no-store`.
      tags: [tasks]
      parameters:
        - $ref: '#/components/parameters/TaskActionIdempotencyKey'
      requestBody:
        required: true
        content:
