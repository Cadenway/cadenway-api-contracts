                $ref: '#/components/schemas/CommentPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InternalTokenRefused'
        '403':
          $ref: '#/components/responses/InternalAccessRefused'
        '404':
          $ref: '#/components/responses/TaskNotFound'
    post:
      operationId: createTaskCommentInternal
      summary: Create a task comment
      description: |
