  /internal/v1/access-requests:
    post:
      operationId: createAccessRequestInternal
      summary: Ask for access
      description: |
        Records a request of the actor for access, as `POST /v1/access-requests` says: always
        `202` with no body, a request stored only for a target of the organization, live or
        archived, on which the actor has no role, once per requester and target while pending, a
        space not for a guest; `400 request.invalid` for none or several targets;
        `429 access-request.limit-reached` with `Retry-After` beyond 10 requests within the hour.
        Emits `space.access-requested.v1`, `list.access-requested.v1` or
        `task.access-requested.v1` when stored. Internal token: actor `user`, organization
        required.
      tags: [access-requests]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccessRequestCreation'
            example:
              spaceId: 019a7000-1a2b-7c3d-8e4f-5a6b7c8d9e09
              message: Je dois chiffrer la part outillage du budget 2027.
      responses:
        '202':
          description: The request is taken; nothing tells whether it was stored.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InternalTokenRefused'
        '403':
          $ref: '#/components/responses/InternalAccessRefused'
        '404':
          $ref: '#/components/responses/OrganizationNotFound'
        '429':
          $ref: '#/components/responses/AccessRequestLimitReached'
