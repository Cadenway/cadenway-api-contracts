# Document service HTTP routes.
openapi: 3.1.0
info:
  title: document-service internal routes
  version: 1.0.0
  description: |
    Catalog and editing requests use a signed `api-gateway` token for the verified user and selected
    organization, with `document-service` as audience. The gateway applies session, CSRF and rate
    limits. Document owns its data, derives the tenant and actor from the token, and resolves live
    direct-space access in bounded batches through `resolveDocumentSpaceAccessInternal` in Task.
    It requires a current Task proof before disclosure or mutation, including before replay. An
    indirect list grant gives no direct-space role. A read can use `view`, `comment` or `edit`.
    A write requires `edit`. A requested space omitted from a valid result carries no proof.
    When a catalog page has no candidate spaces, an empty Task lookup still verifies
    the active membership before returning the empty page.
    A malformed proof, unknown role, duplicate result or unrequested space invalidates the batch
    and returns `503 document.unavailable` before disclosure or mutation.

    Scope lookups, documents and cursor positions to the signed tenant and actor. Space visibility
    is checked anew even if a cursor or replay receipt is available. Document state, creation
    receipt and the corresponding outbox fact commit together. Create and delete emit
    `doc.created.v1` and `doc.deleted.v1` respectively. A changed patch emits `doc.updated.v1`.

    Search projection reads use a separate `search-service` system token and the organization
    carried by it. The projection stays on the internal service boundary. Search must establish
    current access and version before exposing an indexed result to a user.
  contact:
    name: Cadenway
    url: https://github.com/Cadenway/cadenway-api-contracts
  license:
    name: Proprietary
    url: https://github.com/Cadenway/cadenway-api-contracts/blob/main/LICENSE
  x-consumers:
    - repository: cadenway-api-gateway
      uses: Calls the document catalog and editing routes through its generated internal client.
    - repository: cadenway-search-service
      uses: Reads document projections for index reconstruction and invalidation processing.
servers:
  - url: http://document-service:3014
    description: Document service on the internal network.
security:
  - internalToken: []
tags:
  - name: documents
    description: Space-scoped documents and their Markdown content.
  - name: search-projections
    description: Tenant-scoped source projections for the internal search index.
paths:
  /internal/v1/documents:
    get:
      operationId: listDocumentsInternal
      summary: List visible documents
      description: |
        Returns metadata in descending `(updatedAt, id)` order. The opaque cursor is scoped to
        the caller, selected organization and normalized query. Visibility is checked again on
        every page and only readable documents count towards its limit. The title and body
        filter applies within this document catalog.
      tags: [documents]
      parameters:
        - $ref: '../../components/documents.yaml#/components/parameters/DocumentQuery'
        - $ref: '../../components/http.yaml#/components/parameters/Cursor'
        - $ref: '../../components/http.yaml#/components/parameters/Limit'
      responses:
        '200':
          description: One page of readable document metadata.
          headers:
            Cache-Control:
              $ref: '../../components/documents.yaml#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '../../components/documents.yaml#/components/schemas/DocumentPage'
              example:
                items:
                  - id: 019a7005-4b2c-7d4e-8f5a-6b7c8d9e0f17
                    spaceId: 019a7000-1a2b-7c3d-8e4f-5a6b7c8d9e01
                    title: Notes de version 3.1
                    authorUserId: 019a5f3c-8d2e-7c4a-9b1f-3e5d7a9c1b30
                    createdAt: '2026-11-07T08:00:00Z'
                    updatedAt: '2026-11-09T17:20:00Z'
                    version: 3
                nextCursor: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ReadForbidden'
        '404':
          $ref: '#/components/responses/OrganizationNotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
    post:
      operationId: createDocumentInternal
      summary: Create a document in a space
      description: |
        Creates the document in a space the caller can edit. The space is immutable. The caller
        becomes the author and version starts at 1. With an idempotency key, the same normalized
        request replays its original response, Location and ETag for 24 hours while the caller
        retains edit access and the created document still exists.
      tags: [documents]
      parameters:
        - $ref: '../../components/documents.yaml#/components/parameters/IdempotencyKey'
      x-cadenway-strict-body: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../../components/documents.yaml#/components/schemas/DocumentCreation'
            example:
              spaceId: 019a7000-1a2b-7c3d-8e4f-5a6b7c8d9e01
              title: Notes de version 3.1
              body: ''
      responses:
        '201':
          description: The stored document including its original version.
          headers:
            Cache-Control:
              $ref: '../../components/documents.yaml#/components/headers/PrivateNoStore'
            Location:
              required: true
              description: URI path for reading the created document.
              schema:
                type: string
                examples: ['/internal/v1/documents/019a7005-4b2c-7d4e-8f5a-6b7c8d9e0f17']
            ETag:
              $ref: '../../components/documents.yaml#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '../../components/documents.yaml#/components/schemas/DocumentDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/WriteForbidden'
        '404':
          $ref: '#/components/responses/CreationTargetNotFound'
        '409':
          $ref: '#/components/responses/RequestInProgress'
        '422':
          $ref: '#/components/responses/IdempotencyKeyReused'
        '503':
          $ref: '#/components/responses/Unavailable'
  /internal/v1/documents/{documentId}:
    parameters:
      - $ref: '../../components/documents.yaml#/components/parameters/DocumentId'
    get:
      operationId: getDocumentInternal
      summary: Read the current document
      description: Returns the ordered Markdown body and current metadata under live space access.
      tags: [documents]
      responses:
        '200':
          $ref: '#/components/responses/DocumentResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ReadForbidden'
        '404':
          $ref: '#/components/responses/DocumentNotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
    patch:
      operationId: updateDocumentInternal
      summary: Save a document edit
      description: |
        Applies a JSON Merge Patch to the title or Markdown body. The caller needs edit access
        and sends the strong current ETag. The supplied body replaces the complete source in its
        original order. A stored change updates the author, date and version together. An
        equivalent patch returns the current document without a version or event change.
      tags: [documents]
      parameters:
        - $ref: '../../components/documents.yaml#/components/parameters/IfMatch'
      x-cadenway-strict-body: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../../components/documents.yaml#/components/schemas/DocumentPatch'
            example:
              title: Notes de version 3.1
              body: |-
                # Nouveautés
                - Vue Tableau : limite configurable par colonne
                - Export CSV qui respecte les filtres et le tri
      responses:
        '200':
          $ref: '#/components/responses/DocumentResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/WriteForbidden'
        '404':
          $ref: '#/components/responses/DocumentNotFound'
        '412':
          $ref: '#/components/responses/VersionMismatch'
        '503':
          $ref: '#/components/responses/Unavailable'
    delete:
      operationId: deleteDocumentInternal
      summary: Delete the current document
      description: |
        Deletes the document for the organization. The caller needs edit access and sends the
        strong current ETag. The deletion commits at the next version. A later read or deletion
        returns the same not-found response as an invisible document.
      tags: [documents]
      parameters:
        - $ref: '../../components/documents.yaml#/components/parameters/IfMatch'
      responses:
        '204':
          description: The document was deleted.
          headers:
            Cache-Control:
              $ref: '../../components/documents.yaml#/components/headers/PrivateNoStore'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/WriteForbidden'
        '404':
          $ref: '#/components/responses/DocumentNotFound'
        '412':
          $ref: '#/components/responses/VersionMismatch'
        '503':
          $ref: '#/components/responses/Unavailable'
  /internal/v1/document-search-projections:
    get:
      operationId: listDocumentSearchProjectionsInternal
      summary: Export a page of active document projections
      description: |
        Requires issuer `search-service`, actor `{ type: system, id: search-service }`, audience
        `document-service`, and an organization claim. The claim scopes every read and cursor.

        The first page captures the highest active document UUIDv7 in its read snapshot. Each
        page reads active rows in ascending document UUID order up to that inclusive bound, in
        one read snapshot per request. A continuation is opaque, binds the tenant and upper
        bound, and resumes strictly after the last returned UUID. Each page has at most `limit`
        items and at most 1,048,576 bytes of compact UTF-8 JSON, excluding HTTP framing.
        A page shortened by the byte limit resumes after its last returned item.
        Only `nextCursor: null` means the scan is complete.

        There is no cross-page snapshot. Search starts recording document invalidations before
        its first page and re-resolves their IDs before activating the rebuilt index. Concurrent
        inserts may fall behind the cursor and updates or deletes may supersede an exported
        version. The event payloads supply invalidation IDs, not document content.
      tags: [search-projections]
      parameters:
        - $ref: '../../components/http.yaml#/components/parameters/Cursor'
        - $ref: '../../components/http.yaml#/components/parameters/Limit'
      responses:
        '200':
          description: Complete page within the item and byte bounds.
          headers:
            Cache-Control:
              $ref: '../../components/documents.yaml#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentSearchProjectionPage'
              example:
                items:
                  - documentId: 019a7005-4b2c-7d4e-8f5a-6b7c8d9e0f17
                    spaceId: 019a7000-1a2b-7c3d-8e4f-5a6b7c8d9e01
                    version: 3
                    title: Notes de version 3.1
                    body: |-
                      # Nouveautés
                      - Export CSV qui respecte les filtres et le tri
                nextCursor: null
        '400':
          $ref: '#/components/responses/SearchProjectionBadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ReadForbidden'
        '503':
          $ref: '#/components/responses/SearchProjectionUnavailable'
  /internal/v1/document-search-projections/resolve:
    post:
      operationId: resolveDocumentSearchProjectionsInternal
      summary: Resolve current search projections or confirmed absences
      description: |
        Requires issuer `search-service`, actor `{ type: system, id: search-service }`, audience
        `document-service`, and an organization claim. Resolve the whole batch in one read
        snapshot. Return exactly one result for each requested UUID in input order.

        An active document returns its current version and projection. A deleted document
        returns only its UUID and committed terminal version. An ID with no record in the
        selected organization returns an absence with a null version, regardless of whether
        another organization owns that ID. A source error or an incomplete or ambiguous
        result fails the whole batch with 503. Search keeps those IDs pending for retry.

        The 200 response is at most 1,048,576 bytes of compact UTF-8 JSON, excluding HTTP framing.
        When the complete batch would exceed that bound, return 422 without a partial result.
        Search can split the batch and retry. A single legal Document projection fits this bound.
        This action only reads data.
      tags: [search-projections]
      x-cadenway-strict-body: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolveDocumentSearchProjections'
            example:
              documentIds:
                - 019a7005-4b2c-7d4e-8f5a-6b7c8d9e0f17
                - 019a7005-4b2c-7d4e-8f5a-6b7c8d9e0f18
                - 019a7005-4b2c-7d4e-8f5a-6b7c8d9e0f19
      responses:
        '200':
          description: Complete ordered resolution of the requested document IDs.
          headers:
            Cache-Control:
              $ref: '../../components/documents.yaml#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentSearchProjectionResults'
              example:
                results:
                  - status: present
                    projection:
                      documentId: 019a7005-4b2c-7d4e-8f5a-6b7c8d9e0f17
                      spaceId: 019a7000-1a2b-7c3d-8e4f-5a6b7c8d9e01
                      version: 3
                      title: Notes de version 3.1
                      body: |-
                        # Nouveautés
                        - Export CSV qui respecte les filtres et le tri
                  - status: absent
                    documentId: 019a7005-4b2c-7d4e-8f5a-6b7c8d9e0f18
                    version: 6
                  - status: absent
                    documentId: 019a7005-4b2c-7d4e-8f5a-6b7c8d9e0f19
                    version: null
        '400':
          $ref: '#/components/responses/SearchProjectionBadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ReadForbidden'
        '422':
          $ref: '#/components/responses/SearchProjectionBatchTooLarge'
        '503':
          $ref: '#/components/responses/SearchProjectionUnavailable'
components:
  securitySchemes:
    internalToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    DocumentSearchProjectionVersion:
      type: integer
      minimum: 1
      maximum: 9007199254740991
      description: Committed version of the document at the source.
    DocumentSearchProjection:
      type: object
      additionalProperties: false
      required: [documentId, spaceId, version, title, body]
      properties:
        documentId:
          $ref: '../../components/documents.yaml#/components/schemas/DocumentUuid'
        spaceId:
          type: string
          format: uuid
          description: The owning space of the document.
        version:
          $ref: '#/components/schemas/DocumentSearchProjectionVersion'
        title:
          $ref: '../../components/documents.yaml#/components/schemas/DocumentTitle'
        body:
          $ref: '../../components/documents.yaml#/components/schemas/DocumentMarkdown'
    DocumentSearchProjectionPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/DocumentSearchProjection'
        nextCursor:
          $ref: '../../components/http.yaml#/components/schemas/NextCursor'
    ResolveDocumentSearchProjections:
      type: object
      additionalProperties: false
      required: [documentIds]
      properties:
        documentIds:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          description: Ordered document UUIDs. Case variants of the same UUID count as duplicates.
          items:
            $ref: '../../components/documents.yaml#/components/schemas/DocumentUuid'
    DocumentSearchProjectionPresent:
      type: object
      additionalProperties: false
      required: [status, projection]
      properties:
        status:
          type: string
          const: present
        projection:
          $ref: '#/components/schemas/DocumentSearchProjection'
    DocumentSearchProjectionAbsent:
      type: object
      additionalProperties: false
      required: [status, documentId, version]
      properties:
        status:
          type: string
          const: absent
        documentId:
          $ref: '../../components/documents.yaml#/components/schemas/DocumentUuid'
        version:
          description: Committed terminal version, or null when the tenant has no record for this ID.
          oneOf:
            - $ref: '#/components/schemas/DocumentSearchProjectionVersion'
            - type: 'null'
    DocumentSearchProjectionResults:
      type: object
      additionalProperties: false
      required: [results]
      properties:
        results:
          type: array
          minItems: 1
          maxItems: 100
          items:
            oneOf:
              - $ref: '#/components/schemas/DocumentSearchProjectionPresent'
              - $ref: '#/components/schemas/DocumentSearchProjectionAbsent'
  responses:
    DocumentResult:
      description: The current document including its Markdown body.
      headers:
        Cache-Control:
          $ref: '../../components/documents.yaml#/components/headers/PrivateNoStore'
        ETag:
          $ref: '../../components/documents.yaml#/components/headers/ETag'
      content:
        application/json:
          schema:
            $ref: '../../components/documents.yaml#/components/schemas/DocumentDetail'
          examples:
            atelierNord:
              $ref: '../../components/documents.yaml#/components/examples/DocumentReleaseNotes'
    BadRequest:
      description: |
        `request.invalid` with `details.issues` for malformed input, including a missing or invalid
        write precondition or a cursor that does not belong to this request. `request.body-too-large`
        applies when a request body exceeds the HTTP limit.
      headers:
        Cache-Control:
          $ref: '../../components/documents.yaml#/components/headers/PrivateNoStore'
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
    Unauthenticated:
      description: |
        The internal token is missing (`auth.token-missing`) or refused (`auth.token-invalid`).
      headers:
        Cache-Control:
          $ref: '../../components/documents.yaml#/components/headers/PrivateNoStore'
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
    ReadForbidden:
      description: |
        `auth.issuer-not-allowed`, `auth.actor-not-allowed` or `auth.organization-required`.
      headers:
        Cache-Control:
          $ref: '../../components/documents.yaml#/components/headers/PrivateNoStore'
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
    WriteForbidden:
      description: |
        `auth.issuer-not-allowed`, `auth.actor-not-allowed`, `auth.organization-required` or
        `access.role-insufficient` when the caller can read the space but cannot edit it.
        A space role refusal reports `details.role` and `details.requiredRole`, with `edit` as the latter.
      headers:
        Cache-Control:
          $ref: '../../components/documents.yaml#/components/headers/PrivateNoStore'
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
    OrganizationNotFound:
      description: |
        `organization.not-found` for an inactive membership of the selected organization.
      headers:
        Cache-Control:
          $ref: '../../components/documents.yaml#/components/headers/PrivateNoStore'
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
    CreationTargetNotFound:
      description: |
        `space.not-found` for a missing or invisible space, `document.not-found` for a deleted replay
        target, or `organization.not-found` for an inactive organization membership.
      headers:
        Cache-Control:
          $ref: '../../components/documents.yaml#/components/headers/PrivateNoStore'
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
    DocumentNotFound:
      description: |
        `document.not-found` for a missing, deleted, invisible or cross-organization document, or
        `organization.not-found` for an inactive membership of the selected organization.
      headers:
        Cache-Control:
          $ref: '../../components/documents.yaml#/components/headers/PrivateNoStore'
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
    RequestInProgress:
      description: |
        `idempotency.request-in-progress` while an equivalent document creation is running.
      headers:
        Cache-Control:
          $ref: '../../components/documents.yaml#/components/headers/PrivateNoStore'
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
    IdempotencyKeyReused:
      description: |
        `idempotency.key-reused` when the key was used for a different request.
      headers:
        Cache-Control:
          $ref: '../../components/documents.yaml#/components/headers/PrivateNoStore'
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
    VersionMismatch:
      description: |
        `request.version-mismatch` when `If-Match` differs from the current strong document ETag.
        After live write authorization, `details.version` carries the current document version as
        an integer.
      headers:
        Cache-Control:
          $ref: '../../components/documents.yaml#/components/headers/PrivateNoStore'
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          example:
            type: about:blank
            title: Precondition Failed
            status: 412
            code: request.version-mismatch
            details:
              version: 3
    Unavailable:
      description: |
        `document.unavailable` when Document cannot complete the request or establish current space
        authority with Task. A failed authority check produces no document data or write.
      headers:
        Cache-Control:
          $ref: '../../components/documents.yaml#/components/headers/PrivateNoStore'
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
    SearchProjectionBadRequest:
      description: |
        `request.invalid` with `details.issues` for malformed input, an invalid cursor, or
        duplicate document IDs. `request.body-too-large` applies when a request body exceeds
        the HTTP limit.
      headers:
        Cache-Control:
          $ref: '../../components/documents.yaml#/components/headers/PrivateNoStore'
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
    SearchProjectionBatchTooLarge:
      description: |
        `document.projection-batch-too-large` when the complete resolution would exceed the
        response byte limit. No projection is returned. Split the input and retry.
      headers:
        Cache-Control:
          $ref: '../../components/documents.yaml#/components/headers/PrivateNoStore'
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
    SearchProjectionUnavailable:
      description: |
        `document.unavailable` when Document cannot establish a complete and consistent
        source result. No page, batch result or continuation is returned.
      headers:
        Cache-Control:
          $ref: '../../components/documents.yaml#/components/headers/PrivateNoStore'
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
