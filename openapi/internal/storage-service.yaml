openapi: 3.1.0
info:
  title: storage-service internal routes
  version: 1.0.0
  description: |
    Attachment and profile image resources owned by storage-service. Gateway routes use a verified
    `api-gateway` token. Search projection routes use a verified `search-service` token. The Billing
    usage export uses a verified `billing-service` system token scoped to an organization. Task
    attachment, quota and logo operations require a `user` actor and an organization. Applicant
    upload operations require a `system` actor and the organization resolved by task-service. The account owns
    its avatar independently of any organization. Avatar operations require a `user` actor.
    Directory avatar reads require the organization in which the gateway verified member access.
    Before relaying each task attachment request, the gateway requires a successful decision
    from `checkTaskAttachmentAccessInternal`. Task-service reads current placement, visibility,
    role and archive state in one snapshot. The gateway uses `read` for list, metadata and
    download, and `write` for reserve, complete and delete. Mutations require `edit` on the
    current list and an active task and list. Storage
    bounds each operation by the verified organization and the authorized task key, and binds a
    pending upload to the verified uploader. A task key remains stable through moves. A purge
    permanently revokes the task key for attachments and schedules removal of pending and ready
    objects. Temporary URL cleanup covers expired reservations and leftover staged objects.
    Signed URLs are sensitive and must be omitted from logs and traces.

    For applicant uploads the gateway obtains the trusted tenant, publication, reservation ID and
    draft expiry from task-service. Storage verifies and pins the immutable candidate for the
    reservation. It keeps candidate bytes until the authoritative claim or release from
    task-service. Only a successful claim can publish ready task metadata and the normal uploaded
    fact. Storage never receives the form's public key, the applicant's private draft key, or
    their contact details.
  contact:
    name: Cadenway
    url: https://github.com/Cadenway/cadenway-api-contracts
  license:
    name: Proprietary
    url: https://github.com/Cadenway/cadenway-api-contracts/blob/main/LICENSE
  x-consumers:
    - repository: cadenway-api-gateway
      uses: Authorizes task and applicant upload access through task-service and relays attachment and profile image operations using the generated internal client. Profile images require current owner or directory access.
    - repository: cadenway-search-service
      uses: Rebuilds and refreshes its index of ready task attachment filenames through the internal search projection routes.
    - repository: cadenway-billing-service
      uses: Rebuilds its storage usage projection from verified sizes and versions of ready task attachments and the terminal versions of deletions.
servers:
  - url: http://storage-service:3015
    description: Internal service endpoint.
security:
  - internalToken: []
tags:
  - name: attachments
    description: Signed upload and download, attachment metadata and cleanup.
  - name: intake-attachments
    description: Unbound applicant uploads awaiting an authoritative task claim or release.
  - name: profile-media
    description: Signed transfers, verified raster preparation and authorized image reads.
  - name: search-projections
    description: Bounded snapshots and current attachment metadata for the search index.
  - name: billing-usage
    description: Verified attachment usage snapshots for Billing reconciliation.
paths:
  /internal/v1/intake-publications/{publicationId}/attachments:
    parameters:
      - $ref: '#/components/parameters/IntakePublicationId'
    post:
      operationId: startIntakeAttachmentUploadInternal
      summary: Sign an upload previously allocated by task-service
      description: |
        Internal token: api-gateway, actor system, with the organization returned by
        task-service for this reservation. The gateway must first obtain the same tenant,
        publication, attachment ID and draft expiry from the Task allocation operation.
        The body supplies the trusted allocated ID, expiry and file declaration.

        Issue one multipart upload capability for the same tenant, publication and allocated
        ID. Only the first declaration for that binding can be reserved. The staging
        destination exposed in the signed form is opaque and contains no organization,
        list or publication identifiers. The capability is valid for at most five minutes
        and never after the supplied draft expiry. A retry of the same reservation replays
        the original signed response and expiry. A terminal release already recorded for
        the allocation prevents issuance.
      tags: [intake-attachments]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../../components/intake.yaml#/components/schemas/IntakeAttachmentUploadStart'
            example:
              attachmentId: 019a7004-3b2c-7d4e-8f5a-6b7c8d9e0f15
              expiresAt: '2026-11-20T14:30:00Z'
              fileName: capture-sso.png
              contentType: image/png
              sizeBytes: 184320
      responses:
        '201':
          description: The temporary upload capability for this reservation.
          headers:
            Location:
              $ref: '#/components/headers/IntakeAttachmentLocation'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '../../components/attachments.yaml#/components/schemas/AttachmentUpload'
              example:
                id: 019a7004-3b2c-7d4e-8f5a-6b7c8d9e0f15
                method: POST
                url: https://files.example.com/fixtures/intake-upload
                fields: { Content-Type: image/png }
                expiresAt: '2026-11-20T14:05:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InternalTokenRefused'
        '403':
          $ref: '#/components/responses/InternalAccessRefused'
        '404':
          $ref: '#/components/responses/IntakeAttachmentNotFound'
        '409':
          $ref: '#/components/responses/UploadReservationConflict'
        '422':
          $ref: '#/components/responses/IntakeAttachmentStartRefused'
        '503':
          $ref: '#/components/responses/Unavailable'
  /internal/v1/intake-publications/{publicationId}/attachments/{attachmentId}/completion:
    parameters:
      - $ref: '#/components/parameters/IntakePublicationId'
      - $ref: '#/components/parameters/AttachmentId'
    post:
      operationId: completeIntakeAttachmentUploadInternal
      summary: Verify the applicant object and pin its elected copy
      description: |
        Internal token: api-gateway, actor system, with the organization returned by
        task-service for this reservation. The gateway must first authorize completion
        with task-service for the current publication and draft.

        Verify the same immutable bytes that will be retained, and commit election of the
        candidate together with the verification event. A successful retry returns the
        same acknowledgement without another verification fact. No task attachment
        metadata or ordinary file facts are published by this operation. Keep the elected
        candidate until the Task claim or release is applied, including past the draft
        expiry if event delivery is delayed.
      tags: [intake-attachments]
      responses:
        '200':
          description: The upload was verified for this reservation.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '../../components/intake.yaml#/components/schemas/IntakeAttachmentCompletion'
              example: { id: 019a7004-3b2c-7d4e-8f5a-6b7c8d9e0f15 }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InternalTokenRefused'
        '403':
          $ref: '#/components/responses/InternalAccessRefused'
        '404':
          $ref: '#/components/responses/IntakeAttachmentNotFound'
        '409':
          $ref: '#/components/responses/UploadStateConflict'
        '422':
          $ref: '#/components/responses/UploadContentRefused'
        '503':
          $ref: '#/components/responses/Unavailable'
  /internal/v1/tasks/{taskKey}/attachments:
    parameters:
      - $ref: '#/components/parameters/TaskKey'
    get:
      operationId: listTaskAttachmentsInternal
      summary: List task attachments
      description: |
        Lists ready attachments in descending `(uploadedAt,id)` order. The opaque cursor is
        bound to the caller's organization, task and ordering. The caller must be able to read
        the task. Readable archived tasks remain accessible. Pending or deleted attachments
        are excluded.
      tags: [attachments]
      parameters:
        - $ref: '../../components/http.yaml#/components/parameters/Cursor'
        - $ref: '../../components/http.yaml#/components/parameters/Limit'
      responses:
        '200':
          description: One page of ready attachments.
          content:
            application/json:
              schema:
                $ref: '../../components/attachments.yaml#/components/schemas/AttachmentPage'
              example:
                items:
                  - id: 019a7004-3b2c-7d4e-8f5a-6b7c8d9e0f15
                    taskKey: CAD-482
                    fileName: maquette-sso.png
                    contentType: image/png
                    sizeBytes: 248320
                    authorUserId: 019a5f3c-9e1f-7b2a-8c3d-4e5f6a7b8c31
                    uploadedAt: '2026-11-08T08:05:00Z'
                    version: 1
                nextCursor: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InternalTokenRefused'
        '403':
          $ref: '#/components/responses/InternalAccessRefused'
        '503':
          $ref: '#/components/responses/Unavailable'
    post:
      operationId: startTaskAttachmentUploadInternal
      summary: Reserve a signed task attachment upload
      description: |
        Reserves one upload for the verified editor of the active task. The file-size limit is
        26,214,400 bytes (25 MiB). A larger declared size answers `422 attachment.file-too-large`
        before a URL is issued. The media type must match the registered type of the final file
        extension, ignoring case. The response authorizes a five-minute multipart POST to a temporary
        object, restricted to that object, the declared media type and 1 to 26,214,400 file bytes.
        Append all returned form fields unchanged to FormData, then append the file as its final
        part named `file`. Complete the upload before the expiry instant.
        Keep the URL and form fields out of logs. While authorization still holds, an equivalent
        request with the same Idempotency-Key replays the original response and Location for 24 hours,
        with the original URL expiry. Use a fresh key for a new reservation.
      tags: [attachments]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../../components/attachments.yaml#/components/schemas/StartAttachmentUpload'
            example: { fileName: maquette-sso.png, contentType: image/png, sizeBytes: 248320 }
      responses:
        '201':
          description: The reserved attachment and temporary upload capability.
          headers:
            Location:
              $ref: '#/components/headers/Location'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '../../components/attachments.yaml#/components/schemas/AttachmentUpload'
              example:
                id: 019a7004-3b2c-7d4e-8f5a-6b7c8d9e0f15
                method: POST
                url: https://files.example.com/fixtures/sso-upload
                fields: { Content-Type: image/png }
                expiresAt: '2026-11-08T08:10:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InternalTokenRefused'
        '403':
          $ref: '#/components/responses/InternalAccessRefused'
        '404':
          $ref: '#/components/responses/AttachmentNotFound'
        '409':
          $ref: '#/components/responses/UploadReservationConflict'
        '422':
          $ref: '#/components/responses/UploadStartRefused'
        '503':
          $ref: '#/components/responses/Unavailable'
  /internal/v1/tasks/{taskKey}/attachments/{attachmentId}:
    parameters:
      - $ref: '#/components/parameters/TaskKey'
      - $ref: '#/components/parameters/AttachmentId'
    get:
      operationId: getTaskAttachmentInternal
      summary: Read a ready attachment
      description: |
        Returns metadata for a ready attachment of a readable task, including an archived one.
        An attachment pending upload, erased, or associated with another task answers
        `404 attachment.not-found`.
      tags: [attachments]
      responses:
        '200':
          description: Metadata of the ready attachment.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '../../components/attachments.yaml#/components/schemas/TaskAttachment'
              example:
                id: 019a7004-3b2c-7d4e-8f5a-6b7c8d9e0f15
                taskKey: CAD-482
                fileName: maquette-sso.png
                contentType: image/png
                sizeBytes: 248320
                authorUserId: 019a5f3c-9e1f-7b2a-8c3d-4e5f6a7b8c31
                uploadedAt: '2026-11-08T08:05:00Z'
                version: 1
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InternalTokenRefused'
        '403':
          $ref: '#/components/responses/InternalAccessRefused'
        '404':
          $ref: '#/components/responses/AttachmentNotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
    delete:
      operationId: deleteTaskAttachmentInternal
      summary: Delete a task attachment
      description: |
        Deletes a ready attachment from an active task the caller may edit. An optional strong ETag
        checks its current version. The deletion makes the attachment unavailable, records
        `file.deleted.v1` and persists the cleanup request together. Object cleanup is asynchronous.
        Previously issued download URLs can remain valid until expiration or object cleanup.
      tags: [attachments]
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '204':
          description: The attachment is unavailable and cleanup is scheduled.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InternalTokenRefused'
        '403':
          $ref: '#/components/responses/InternalAccessRefused'
        '404':
          $ref: '#/components/responses/AttachmentNotFound'
        '412':
          $ref: '#/components/responses/VersionMismatch'
        '503':
          $ref: '#/components/responses/Unavailable'
  /internal/v1/tasks/{taskKey}/attachments/{attachmentId}/completion:
    parameters:
      - $ref: '#/components/parameters/TaskKey'
      - $ref: '#/components/parameters/AttachmentId'
    post:
      operationId: completeTaskAttachmentUploadInternal
      summary: Complete a task attachment upload
      description: |
        Completes the reservation of the verified uploader, who must still be able to edit the active
        task. The service checks the staged object length and media type against the reservation,
        and checks its type using the first 4 KiB of bytes. Plain-text files, including logs, require
        a valid UTF-8 prefix without NUL bytes and without a conflicting detected binary type.
        Other types require a matching file signature. The checks apply to the finalized bytes.
        The finalized object is independent of the upload capability, so a repeated POST to the
        upload URL cannot replace it. The first successful completion publishes the attachment
        and records `file.uploaded.v1` together. Repeating successful completion returns the same
        metadata without a second fact. A staged object that is missing before expiry answers
        `409 attachment.upload-not-ready`. Expired pending reservations cannot be completed.
      tags: [attachments]
      responses:
        '200':
          description: The ready attachment and its strong ETag.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '../../components/attachments.yaml#/components/schemas/TaskAttachment'
              example:
                id: 019a7004-3b2c-7d4e-8f5a-6b7c8d9e0f15
                taskKey: CAD-482
                fileName: maquette-sso.png
                contentType: image/png
                sizeBytes: 248320
                authorUserId: 019a5f3c-9e1f-7b2a-8c3d-4e5f6a7b8c31
                uploadedAt: '2026-11-08T08:05:00Z'
                version: 1
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InternalTokenRefused'
        '403':
          $ref: '#/components/responses/InternalAccessRefused'
        '404':
          $ref: '#/components/responses/AttachmentNotFound'
        '409':
          $ref: '#/components/responses/UploadStateConflict'
        '422':
          $ref: '#/components/responses/UploadContentRefused'
        '503':
          $ref: '#/components/responses/Unavailable'
  /internal/v1/tasks/{taskKey}/attachments/{attachmentId}/download:
    parameters:
      - $ref: '#/components/parameters/TaskKey'
      - $ref: '#/components/parameters/AttachmentId'
    get:
      operationId: getTaskAttachmentDownloadInternal
      summary: Sign a task attachment download
      description: |
        Signs a temporary GET for a ready attachment of a readable task. The signed URL is a capability
        on the cookie-free object-storage origin. Clients do not send application credentials to that origin.
        The signed download always uses `Content-Disposition: attachment` with a safely encoded filename.
        The application can provide its own safe preview for supported media. It never renders HTML or SVG
        inline. This operation does not change attachment state.
      tags: [attachments]
      responses:
        '200':
          description: The signed GET URL and its expiry.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '../../components/attachments.yaml#/components/schemas/AttachmentDownload'
              example:
                url: https://files.example.com/fixtures/sso-download
                expiresAt: '2026-11-08T08:10:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InternalTokenRefused'
        '403':
          $ref: '#/components/responses/InternalAccessRefused'
        '404':
          $ref: '#/components/responses/AttachmentNotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
  /internal/v1/profile-media-uploads/{uploadId}/transfer:
    parameters:
      - name: uploadId
        in: path
        required: true
        description: Opaque id allocated by the owning service.
        schema:
          $ref: '../../components/profile-media.yaml#/components/schemas/ProfileMediaId'
    post:
      operationId: signProfileMediaTransferInternal
      summary: Sign a reserved profile image transfer
      description: |
        The gateway calls only after the owning service allocated this id for the verified actor,
        scope, declaration and expiry. The signed multipart POST is restricted to one staging key,
        an exact media type and a size range up to 5,242,880 bytes. The capability expires at the
        owner's original expiry, at most five minutes after reservation. An authorized repeat for
        the same reservation and declaration returns the original signed response, never a renewed
        capability. If there is no signed response and the reserved expiry has passed, the
        operation refuses to sign it. Do not log the destination or form fields. The issuer is api-gateway with actor
        user. An avatar uses the account id with no organization scope, while a logo uses the
        organization in the token and the id of the verified uploader.
      tags: [profile-media]
      x-cadenway-strict-body: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../../components/profile-media.yaml#/components/schemas/SignProfileMediaTransfer'
            example:
              kind: avatar
              expiresAt: '2026-11-08T08:10:00Z'
              contentType: image/webp
              sizeBytes: 43024
      responses:
        '200':
          description: The short-lived signed upload capability.
          headers:
            Cache-Control:
              required: true
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema:
                $ref: '../../components/profile-media.yaml#/components/schemas/ProfileMediaUpload'
              example:
                uploadId: 019a7003-4d5e-7f6a-8b9c-0d1e2f3a4b01
                method: POST
                url: https://files.example.com/fixtures/profile-avatar
                fields: { Content-Type: image/webp }
                expiresAt: '2026-11-08T08:10:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InternalTokenRefused'
        '403':
          $ref: '#/components/responses/InternalAccessRefused'
        '404':
          $ref: '#/components/responses/ProfileMediaNotFound'
        '409':
          $ref: '#/components/responses/ProfileMediaReservationConflict'
        '422':
          $ref: '#/components/responses/ProfileMediaReservationRefused'
        '503':
          $ref: '#/components/responses/ProfileMediaUnavailable'
  /internal/v1/profile-media-uploads/{uploadId}/preparation:
    parameters:
      - name: uploadId
        in: path
        required: true
        description: Opaque id allocated by the owning service.
        schema:
          $ref: '../../components/profile-media.yaml#/components/schemas/ProfileMediaId'
    post:
      operationId: prepareProfileMediaInternal
      summary: Verify and prepare a profile image
      description: |
        The gateway calls only for a pending reservation verified by its owner. The actor and
        scope must match the transfer. Storage verifies the reserved declaration and uploaded
        bytes of one pinned generation. It decodes one static square image with a declared
        allowed encoding, at most 4,096 pixels per side and at most 16,777,216 pixels, then
        encodes a metadata-free PNG at most 512 pixels per side without upscaling. Avatar input
        is PNG, JPEG or WebP at least 256 pixels per side. Logo input is PNG or SVG. SVG input
        must be self-contained and static with no external resource access. The decode and
        rasterization run within byte, pixel, memory and time limits.

        The immutable derivative uses the upload id as asset id. Repeated preparation returns
        the same accepted preparation. Storage retains this candidate until an authoritative
        owner decision. An abandoned reservation fences late preparation and cleanup of the
        staging object accounts for the original signed expiry. This action alone never changes
        the published reference. Issuer api-gateway only, verified actor user.
      tags: [profile-media]
      x-cadenway-strict-body: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../../components/profile-media.yaml#/components/schemas/PrepareProfileMedia'
            example: { kind: avatar }
      responses:
        '200':
          description: Metadata of the verified immutable derivative.
          content:
            application/json:
              schema:
                $ref: '../../components/profile-media.yaml#/components/schemas/ProfileMediaPreparation'
              example:
                {
                  uploadId: 019a7003-4d5e-7f6a-8b9c-0d1e2f3a4b01,
                  contentType: image/png,
                  width: 512,
                  height: 512,
                  sizeBytes: 41632,
                }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InternalTokenRefused'
        '403':
          $ref: '#/components/responses/InternalAccessRefused'
        '404':
          $ref: '#/components/responses/ProfileMediaNotFound'
        '409':
          $ref: '#/components/responses/ProfileMediaUploadStateConflict'
        '422':
          $ref: '#/components/responses/ProfileMediaUploadRefused'
        '503':
          $ref: '#/components/responses/ProfileMediaUnavailable'
  /internal/v1/avatars/{assetId}:
    parameters:
      - name: assetId
        in: path
        required: true
        description: Opaque id of the immutable PNG derivative.
        schema:
          $ref: '../../components/profile-media.yaml#/components/schemas/ProfileMediaId'
    get:
      operationId: getAvatarImageInternal
      summary: Read an authorized PNG avatar derivative
      description: |
        The gateway calls only after the current avatar reference and authorization were
        resolved. ownerUserId is the verified actor's own account or the user id returned by
        the live organization member lookup. Storage requires the exact avatar asset and that
        account id. Any organization in the token is not part of avatar ownership. A different
        ownerUserId requires the token organization used by the gateway for the directory check.
        Issuer api-gateway and actor user only. The owner-referenced candidate is readable while
        the durable adoption fact is in transit. Retired or rejected objects are unavailable.
      tags: [profile-media]
      parameters:
        - name: ownerUserId
          in: query
          required: true
          description: Account id for the authorized reference.
          schema:
            type: string
            format: uuid
            examples: [019a5f3c-8d2e-7c4a-9b1f-3e5d7a9c1b30]
      responses:
        '200':
          description: Immutable, verified PNG bytes with a maximum size of 5,242,880 bytes.
          headers:
            Cache-Control:
              required: true
              schema: { type: string, const: 'private, no-store' }
            X-Content-Type-Options:
              required: true
              schema: { type: string, const: nosniff }
          content:
            image/png: {}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InternalTokenRefused'
        '403':
          $ref: '#/components/responses/InternalAccessRefused'
        '404':
          $ref: '#/components/responses/ProfileMediaNotFound'
        '503':
          $ref: '#/components/responses/ProfileMediaUnavailable'
  /internal/v1/organization/logo-assets/{assetId}:
    parameters:
      - name: assetId
        in: path
        required: true
        description: Opaque id of the immutable PNG derivative.
        schema:
          $ref: '../../components/profile-media.yaml#/components/schemas/ProfileMediaId'
    get:
      operationId: getOrganizationLogoImageInternal
      summary: Read an authorized PNG logo derivative
      description: |
        The gateway calls only after checking current membership and resolving the current
        logo reference in the same organization-service read. Storage requires the exact logo
        asset in the verified organization. Issuer api-gateway, actor user and organization
        required. The owner-referenced candidate is readable while the durable adoption fact
        is in transit. Retired or rejected objects are unavailable.
      tags: [profile-media]
      responses:
        '200':
          description: Immutable, verified PNG bytes with a maximum size of 5,242,880 bytes.
          headers:
            Cache-Control:
              required: true
              schema: { type: string, const: 'private, no-store' }
            X-Content-Type-Options:
              required: true
              schema: { type: string, const: nosniff }
          content:
            image/png: {}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InternalTokenRefused'
        '403':
          $ref: '#/components/responses/InternalAccessRefused'
        '404':
          $ref: '#/components/responses/ProfileMediaNotFound'
        '503':
          $ref: '#/components/responses/ProfileMediaUnavailable'
  /internal/v1/attachments/largest:
    get:
      operationId: listLargestAttachmentsInternal
      summary: List the organization's largest ready attachments
      description: |
        Lists ready task attachments of the verified organization in descending `(sizeBytes,id)`
        order for storage usage analysis. The opaque cursor binds the tenant and ordering. The gateway
        checks current organization owner or admin membership through `getOrganizationInternal` before
        calling. This internal result is a quota input. A public presentation must also enforce
        current task visibility before disclosing file names or task keys.
      tags: [attachments]
      parameters:
        - $ref: '../../components/http.yaml#/components/parameters/Cursor'
        - $ref: '../../components/http.yaml#/components/parameters/Limit'
      responses:
        '200':
          description: One page of ready attachment metadata.
          content:
            application/json:
              schema:
                $ref: '../../components/attachments.yaml#/components/schemas/AttachmentPage'
              example:
                items:
                  - id: 019a7004-3b2c-7d4e-8f5a-6b7c8d9e0f15
                    taskKey: CAD-482
                    fileName: maquette-sso.png
                    contentType: image/png
                    sizeBytes: 248320
                    authorUserId: 019a5f3c-9e1f-7b2a-8c3d-4e5f6a7b8c31
                    uploadedAt: '2026-11-08T08:05:00Z'
                    version: 1
                nextCursor: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InternalTokenRefused'
        '403':
          $ref: '#/components/responses/InternalAccessRefused'
        '503':
          $ref: '#/components/responses/Unavailable'
  /internal/v1/billing-attachment-usage:
    get:
      operationId: listBillingAttachmentUsageInternal
      summary: Export attachment states for Billing storage usage
      description: |
        Requires issuer `billing-service`, actor `{ type: 'system', id: 'billing-service' }`,
        and an organization in the verified internal token. The token determines the tenant.
        Every response carries `Cache-Control: private, no-store`. Each ready task attachment,
        including a claimed public intake attachment, is exported with its ID, verified byte
        count and version. Each retained deletion of a previously ready attachment is exported
        with its ID and terminal version. The export must include a deletion whenever an older
        upload fact can still arrive, including from a delayed Storage outbox. Pending or
        discarded uploads that never reached the ready state, unclaimed intake candidates and
        profile media contribute no row. During a task purge, each attachment stops contributing
        when Storage commits its file tombstone and appends `file.deleted.v1`.
        Physical object erasure can follow later. No file names, task keys, object keys or author
        details are returned. A tenant with no eligible attachments receives an empty page.

        The first page fixes an inclusive upper file ID in its tenant snapshot. Each page reads
        its own tenant snapshot in ascending immutable UUID order above the last returned ID
        and at or below that upper bound. The opaque, authenticated cursor has 1 to 1,024
        characters and binds the operation, the tenant, the upper bound and the last returned ID.
        Only `nextCursor: null` marks completion. The UTF-8 JSON body is at most 1,048,576 bytes.

        Billing reconciles `file.uploaded.v1` and `file.deleted.v1` by file ID and highest source
        version. A deletion takes precedence over a ready row of the same version. Once a file ID
        is terminal, Billing never restores its usage. A rebuild requires continuous durable delivery from a
        starting position recorded before the first page through a catch-up position recorded after
        the final page. Billing proves coverage and applies all relevant facts through that position
        before promotion. On a confirmed gap, Billing discards the candidate and restarts from a
        new starting position.
      tags: [billing-usage]
      parameters:
        - $ref: '../../components/http.yaml#/components/parameters/Cursor'
        - $ref: '../../components/http.yaml#/components/parameters/Limit'
      responses:
        '200':
          description: One page of verified ready task attachments and retained deletions.
          headers:
            Cache-Control:
              $ref: '#/components/headers/BillingPrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingAttachmentUsagePage'
              example:
                items:
                  - fileId: 019a7004-3b2c-7d4e-8f5a-6b7c8d9e0f15
                    state: ready
                    sizeBytes: 248320
                    version: 1
                  - fileId: 019a7004-3b2c-7d4e-8f5a-6b7c8d9e0f16
                    state: deleted
                    version: 2
                nextCursor: null
        '400':
          $ref: '#/components/responses/BillingUsageBadRequest'
        '401':
          $ref: '#/components/responses/BillingUsageTokenRefused'
        '403':
          $ref: '#/components/responses/BillingUsageAccessRefused'
        '503':
          $ref: '#/components/responses/BillingUsageUnavailable'
  /internal/v1/attachment-search-projections:
    get:
      operationId: listAttachmentSearchProjectionsInternal
      summary: Export ready attachments for search
      description: |
        Requires issuer `search-service`, actor `{ type: 'system', id: 'search-service' }`, and
        an organization in the signed token. Every response carries `Cache-Control: private,
        no-store`. The operation exports only ready task attachments in that organization. A
        permanent Task purge recorded by Storage excludes all attachments of that task.

        The first page fixes an upper file ID in its read snapshot. Each page reads an independent
        tenant snapshot in ascending immutable file ID order up to that inclusive upper bound. The
        cursor binds the tenant, the upper bound and the last returned file ID. A new page uses an
        exclusive lower bound at that ID. An invalid cursor or cursor for another tenant returns
        `400 request.invalid`. The encoded UTF-8 JSON body is at most 1,048,576 bytes. When the byte
        cap shortens a page, the cursor advances only past returned items. Only `nextCursor: null`
        marks completion.

        Search starts consuming durable attachment and Task invalidations before the first page,
        then refreshes changes against the current owner state before activating the rebuilt index.
        Search must prove current attachment availability and Task visibility before disclosing
        results derived from this metadata.
      tags: [search-projections]
      parameters:
        - $ref: '../../components/http.yaml#/components/parameters/Cursor'
        - $ref: '../../components/http.yaml#/components/parameters/Limit'
      responses:
        '200':
          description: One page of ready attachment projections.
          headers:
            Cache-Control:
              $ref: '#/components/headers/SearchPrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttachmentSearchProjectionPage'
              example:
                items:
                  - fileId: 019a7004-3b2c-7d4e-8f5a-6b7c8d9e0f15
                    taskKey: CAD-482
                    fileName: maquette-sso.png
                    version: 1
                nextCursor: null
        '400':
          $ref: '#/components/responses/SearchProjectionBadRequest'
        '401':
          $ref: '#/components/responses/SearchProjectionTokenRefused'
        '403':
          $ref: '#/components/responses/SearchProjectionAccessRefused'
        '503':
          $ref: '#/components/responses/SearchProjectionUnavailable'
  /internal/v1/attachment-search-projections/resolve:
    post:
      operationId: resolveAttachmentSearchProjectionsInternal
      summary: Read the current state of attachment search projections
      description: |
        Requires issuer `search-service`, actor `{ type: 'system', id: 'search-service' }`, and
        an organization in the signed token. Every response carries `Cache-Control: private,
        no-store`. In one tenant snapshot, returns one decision per requested file ID in request
        order. UUIDs are compared without regard to case. Duplicate IDs return `400 request.invalid`.

        A ready attachment of a task that Storage has not fenced for permanent purge yields
        `present`. A deleted attachment yields `absent` with the terminal version when Storage
        retains it. An unknown ID, a pending attachment, an ID outside the tenant, or a fenced task
        whose attachment terminal version is unavailable yields `absent` with `version: null`.
        An unavailable snapshot fails the entire batch with `503 storage.unavailable`; a consumer
        must not treat a failed, malformed or incomplete batch as evidence of absence.
        The response body is at most 1,048,576 bytes of UTF-8 JSON.
      tags: [search-projections]
      x-cadenway-strict-body: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolveAttachmentSearchProjectionsRequest'
            example:
              fileIds: [019a7004-3b2c-7d4e-8f5a-6b7c8d9e0f15, 019a7004-3b2c-7d4e-8f5a-6b7c8d9e0f16]
      responses:
        '200':
          description: Current projection decisions in request order.
          headers:
            Cache-Control:
              $ref: '#/components/headers/SearchPrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResolveAttachmentSearchProjectionsResult'
              example:
                results:
                  - status: present
                    projection:
                      fileId: 019a7004-3b2c-7d4e-8f5a-6b7c8d9e0f15
                      taskKey: CAD-482
                      fileName: maquette-sso.png
                      version: 1
                  - status: absent
                    fileId: 019a7004-3b2c-7d4e-8f5a-6b7c8d9e0f16
                    version: 2
        '400':
          $ref: '#/components/responses/SearchProjectionBadRequest'
        '401':
          $ref: '#/components/responses/SearchProjectionTokenRefused'
        '403':
          $ref: '#/components/responses/SearchProjectionAccessRefused'
        '503':
          $ref: '#/components/responses/SearchProjectionUnavailable'
components:
  securitySchemes:
    internalToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Signed internal token with audience storage-service. The operation defines the accepted issuer, actor and organization scope.
  parameters:
    IntakePublicationId:
      name: publicationId
      in: path
      required: true
      description: Internal publication ID provided by task-service for this reservation.
      schema:
        $ref: '../../components/intake.yaml#/components/schemas/IntakePublicationId'
    TaskKey:
      name: taskKey
      in: path
      required: true
      description: Stable key of the target task.
      schema:
        $ref: '../../components/task.yaml#/components/schemas/TaskKey'
    AttachmentId:
      name: attachmentId
      in: path
      required: true
      description: UUID allocated by the upload request.
      schema:
        $ref: '../../components/attachments.yaml#/components/schemas/AttachmentId'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Client-chosen key for an upload reservation.
      schema:
        type: string
        minLength: 1
        maxLength: 255
    IfMatch:
      name: If-Match
      in: header
      required: false
      description: Strong ETag of the attachment version when a conditional deletion is needed.
      schema:
        type: string
        pattern: '^"[1-9][0-9]*"$'
        examples: ['"1"']
  headers:
    BillingPrivateNoStore:
      required: true
      description: Keeps Billing authority responses out of HTTP caches.
      schema:
        type: string
        const: 'private, no-store'
    SearchPrivateNoStore:
      required: true
      description: Keeps the private attachment projection out of HTTP caches.
      schema:
        type: string
        const: 'private, no-store'
    IntakeAttachmentLocation:
      required: true
      description: Internal path identifying the upload reservation.
      schema:
        type: string
        examples:
          - /internal/v1/intake-publications/019a7001-2b3c-7d4e-8f5a-6b7c8d9e0f12/attachments/019a7004-3b2c-7d4e-8f5a-6b7c8d9e0f15
    Location:
      required: true
      description: Path of the reserved attachment. Its metadata becomes readable when the upload is complete.
      schema:
        type: string
        examples: ['/internal/v1/tasks/CAD-482/attachments/019a7004-3b2c-7d4e-8f5a-6b7c8d9e0f15']
    NoStore:
      required: true
      description: Prevents HTTP caches from storing a response that carries a signed URL.
      schema:
        type: string
        const: no-store
    ETag:
      required: true
      description: Strong entity tag of the attachment version.
      schema:
        type: string
        examples: ['"1"']
  responses:
    BillingUsageBadRequest:
      description: '`request.invalid` for invalid query parameters or a malformed cursor, including a cursor for a different operation or tenant.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/BillingPrivateNoStore'
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
    BillingUsageTokenRefused:
      description: '`auth.token-missing` or `auth.token-invalid`.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/BillingPrivateNoStore'
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
    BillingUsageAccessRefused:
      description: |
        `auth.issuer-not-allowed` for another issuer, `auth.actor-not-allowed` for another actor
        type or ID, or `auth.organization-required` for an unscoped token.
      headers:
        Cache-Control:
          $ref: '#/components/headers/BillingPrivateNoStore'
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
    BillingUsageUnavailable:
      description: '`storage.unavailable` when Storage cannot complete the snapshot page.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/BillingPrivateNoStore'
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
    SearchProjectionBadRequest:
      description: |
        `request.invalid` for invalid input, including an invalid cursor or duplicate file IDs.
        `request.body-too-large` when the incoming request body exceeds the JSON body limit.
      headers:
        Cache-Control:
          $ref: '#/components/headers/SearchPrivateNoStore'
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
    SearchProjectionTokenRefused:
      description: '`auth.token-missing` or `auth.token-invalid`.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/SearchPrivateNoStore'
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
    SearchProjectionAccessRefused:
      description: |
        `auth.issuer-not-allowed` for another issuer, `auth.actor-not-allowed` for another actor
        type or ID, or `auth.organization-required` for an unscoped token.
      headers:
        Cache-Control:
          $ref: '#/components/headers/SearchPrivateNoStore'
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
    SearchProjectionUnavailable:
      description: |
        `storage.unavailable` when Storage cannot complete the requested snapshot.
        No partial page or batch is returned.
      headers:
        Cache-Control:
          $ref: '#/components/headers/SearchPrivateNoStore'
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
    ProfileMediaNotFound:
      description: |
        `media.not-found` for an unknown, unavailable or unrelated image or reservation.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
    ProfileMediaReservationConflict:
      description: |
        `idempotency.request-in-progress` when equivalent signing is running, or
        `media.upload-expired` when an unsigned transfer passed its original expiry.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
    ProfileMediaReservationRefused:
      description: |
        `media.file-too-large` above 5,242,880 declared bytes, `media.unsupported-type` for a
        disallowed image encoding, or `idempotency.key-reused` for a conflicting reservation.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
    ProfileMediaUploadStateConflict:
      description: |
        `media.upload-expired` for expiration, `media.upload-not-ready` for an upload that has not
        arrived, or `media.upload-superseded` for an invalidated prior generation.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
    ProfileMediaUploadRefused:
      description: |
        `media.file-too-large`, `media.unsupported-type`, or `media.invalid-image` for metadata,
        decoding, shape, dimension or safety failures.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
    ProfileMediaUnavailable:
      description: |
        `storage.unavailable` when the dependency or durable media state is unavailable.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
    BadRequest:
      description: |
        `request.invalid` with `details.issues`.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
    InternalTokenRefused:
      description: |
        `auth.token-missing` or `auth.token-invalid`.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
    InternalAccessRefused:
      description: |
        `auth.issuer-not-allowed`, `auth.actor-not-allowed` or `auth.organization-required`.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
    AttachmentNotFound:
      description: |
        `attachment.not-found` for an unknown, unavailable or unrelated attachment, a pending reservation of another uploader, or a target already permanently purged.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
    IntakeAttachmentNotFound:
      description: |
        `attachment.not-found` for a missing, unavailable or unrelated reservation, an
        allocation with an expired draft, or a recorded terminal claim or release.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
    UploadReservationConflict:
      description: |
        `idempotency.request-in-progress` while the equivalent upload reservation is running.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
    UploadStateConflict:
      description: |
        `attachment.upload-expired` for an expired pending reservation or `attachment.upload-not-ready` when the temporary object has not arrived.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
    UploadStartRefused:
      description: |
        `attachment.file-too-large` above 26,214,400 bytes, `attachment.upload-metadata-mismatch`
        for a missing or unknown extension or one that disagrees with the declared media type,
        or `idempotency.key-reused` for a key previously used with a different request.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
    IntakeAttachmentStartRefused:
      description: |
        `attachment.upload-metadata-mismatch` for an unsupported or inconsistent file
        declaration, or `idempotency.key-reused` for a different declaration of the same
        allocated reservation.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
    UploadContentRefused:
      description: |
        `attachment.file-too-large` when the stored object exceeds the limit, or
        `attachment.upload-metadata-mismatch` when its length, declared media type or detected type
        is inconsistent with the reservation.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
    VersionMismatch:
      description: |
        `request.version-mismatch` when the supplied attachment ETag is stale.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
    Unavailable:
      description: |
        `storage.unavailable` when object storage or the durable attachment state cannot be reached.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
  schemas:
    BillingAttachmentUsage:
      oneOf:
        - $ref: '#/components/schemas/BillingReadyAttachment'
        - $ref: '#/components/schemas/BillingDeletedAttachment'
      discriminator:
        propertyName: state
        mapping:
          ready: '#/components/schemas/BillingReadyAttachment'
          deleted: '#/components/schemas/BillingDeletedAttachment'
    BillingReadyAttachment:
      type: object
      additionalProperties: false
      required: [fileId, version, state, sizeBytes]
      properties:
        fileId: { $ref: '../../components/attachments.yaml#/components/schemas/AttachmentId' }
        state: { type: string, const: ready }
        sizeBytes:
          type: integer
          minimum: 1
          maximum: 26214400
          description: Verified object size in bytes, up to 25 MiB.
        version:
          type: integer
          minimum: 1
          maximum: 9007199254740991
          description: Owner version of the ready attachment.
    BillingDeletedAttachment:
      type: object
      additionalProperties: false
      required: [fileId, version, state]
      properties:
        fileId: { $ref: '../../components/attachments.yaml#/components/schemas/AttachmentId' }
        state: { type: string, const: deleted }
        version:
          type: integer
          minimum: 2
          maximum: 9007199254740991
          description: Terminal version of the previously ready attachment.
    BillingAttachmentUsagePage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/BillingAttachmentUsage' }
        nextCursor:
          type: [string, 'null']
          allOf:
            - $ref: '../../components/http.yaml#/components/schemas/NextCursor'
            - type: [string, 'null']
              minLength: 1
              maxLength: 1024
    AttachmentSearchProjection:
      type: object
      additionalProperties: false
      required: [fileId, taskKey, fileName, version]
      properties:
        fileId: { $ref: '../../components/attachments.yaml#/components/schemas/AttachmentId' }
        taskKey: { $ref: '../../components/task.yaml#/components/schemas/TaskKey' }
        fileName:
          { $ref: '../../components/attachments.yaml#/components/schemas/AttachmentFileName' }
        version:
          type: integer
          minimum: 1
          maximum: 9007199254740991
          description: Owner version of the ready attachment.
    AttachmentSearchProjectionPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/AttachmentSearchProjection' }
        nextCursor: { $ref: '../../components/http.yaml#/components/schemas/NextCursor' }
    ResolveAttachmentSearchProjectionsRequest:
      type: object
      additionalProperties: false
      required: [fileIds]
      properties:
        fileIds:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items: { $ref: '../../components/attachments.yaml#/components/schemas/AttachmentId' }
    ResolveAttachmentSearchProjectionsResult:
      type: object
      additionalProperties: false
      required: [results]
      properties:
        results:
          type: array
          minItems: 1
          maxItems: 100
          items:
            oneOf:
              - $ref: '#/components/schemas/PresentAttachmentSearchProjection'
              - $ref: '#/components/schemas/AbsentAttachmentSearchProjection'
    PresentAttachmentSearchProjection:
      type: object
      additionalProperties: false
      required: [status, projection]
      properties:
        status: { const: present }
        projection: { $ref: '#/components/schemas/AttachmentSearchProjection' }
    AbsentAttachmentSearchProjection:
      type: object
      additionalProperties: false
      required: [status, fileId, version]
      properties:
        status: { const: absent }
        fileId: { $ref: '../../components/attachments.yaml#/components/schemas/AttachmentId' }
        version:
          type: [integer, 'null']
          minimum: 1
          maximum: 9007199254740991
          description: Terminal attachment version when known, or null.
