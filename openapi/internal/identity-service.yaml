# Internal routes of identity-service. cadenway-api-gateway calls the authentication flows of
# openapi/public/auth.yaml and their two-step challenge, the introspection of the session cookie and
# of a personal API token, the sessions of a user, their revocation and the choice of their
# organization, the password reset and the recent re-authentication, the reading, the profile, the
# password, the address, the two-step verification and the deletion of a user, the authentication
# policy of an organization, the personal API tokens of openapi/public/api-tokens.yaml, the
# account avatar and realtime ticket issuance. cadenway-realtime-gateway redeems tickets.
# cadenway-notification-service reads the recipient profile for notification emails.
openapi: 3.1.0
info:
  title: identity-service internal routes
  version: 1.0.0
  description: |
    What identity-service exposes to the API gateway for sign-up, sign-in, sessions, the current
    user, two-step verification, the authentication policy of an organization and personal API
    tokens. The service has no public route: the gateway serves `openapi/public/auth.yaml`,
    `openapi/public/api-tokens.yaml`, and the choice of the current organization and the
    authentication policy of `openapi/public/organizations.yaml`, and calls these routes.
    The gateway also calls the account avatar operations for `openapi/public/profile-media.yaml`
    and issues tickets for `openapi/public/realtime.yaml`. The realtime gateway calls the
    single-use redemption route before accepting a socket. Notification calls the internal
    recipient read for account notification emails.

    | Public route | Internal call |
    | --- | --- |
    | `POST /v1/auth/sign-in-methods` | `POST /internal/v1/auth/sign-in-methods` |
    | `POST /v1/auth/sign-in/federated/start` | `POST /internal/v1/auth/sign-in/federated/start` |
    | `GET /v1/auth/sign-in/federated/providers/{provider}/callback` | `POST /internal/v1/auth/sign-in/federated/oauth/callback` |
    | `POST /v1/auth/sign-in/federated/saml/callback` | `POST /internal/v1/auth/sign-in/federated/saml/callback` |
    | `POST /v1/auth/sign-in/federated/finish` | `POST /internal/v1/auth/sign-in/federated/finish` |
    | `POST /v1/auth/sign-up` | `POST /internal/v1/auth/sign-up` |
    | `POST /v1/auth/sign-up/code` | `POST /internal/v1/auth/sign-up/code` |
    | `POST /v1/auth/sign-up/verification` | `POST /internal/v1/auth/sign-up/verification` |
    | `POST /v1/auth/sign-in` | `POST /internal/v1/auth/sign-in` |
    | `POST /v1/auth/sign-in/code` | `POST /internal/v1/auth/sign-in/code` |
    | `POST /v1/auth/sign-in/code/verification` | `POST /internal/v1/auth/sign-in/code/verification` |
    | `POST /v1/auth/sign-in/challenge/inspection` | `POST /internal/v1/auth/sign-in/challenge/inspection` |
    | `POST /v1/auth/sign-in/challenge/authenticator-app` | `POST /internal/v1/auth/sign-in/challenge/authenticator-app` |
    | `POST /v1/auth/sign-in/challenge/backup-code` | `POST /internal/v1/auth/sign-in/challenge/backup-code` |
    | `POST /v1/auth/sign-in/challenge/security-key/options` | `POST /internal/v1/auth/sign-in/challenge/security-key/options` |
    | `POST /v1/auth/sign-in/challenge/security-key` | `POST /internal/v1/auth/sign-in/challenge/security-key` |
    | `POST /v1/auth/sign-out` | `DELETE /internal/v1/sessions/{sessionId}` with the session the introspection returned |
    | `POST /v1/auth/password-reset` | `POST /internal/v1/auth/password-reset` |
    | `POST /v1/auth/password-reset/inspection` | `POST /internal/v1/auth/password-reset/inspection` |
    | `POST /v1/auth/password-reset/confirmation` | `POST /internal/v1/auth/password-reset/confirmation` |
    | `POST /v1/auth/reauthentication` | `POST /internal/v1/sessions/{sessionId}/reauthentication` with the session the introspection returned |
    | `GET /v1/me` | `GET /internal/v1/users/{userId}` with the user the introspection returned |
    | `POST /v1/me/avatar/uploads` | `POST /internal/v1/users/{userId}/avatar/uploads` before Storage signs the transfer |
    | `PUT /v1/me/avatar` | Check `GET /internal/v1/users/{userId}/avatar/uploads/{uploadId}`, prepare pending assets through Storage, then `PUT /internal/v1/users/{userId}/avatar` |
    | `DELETE /v1/me/avatar` | `DELETE /internal/v1/users/{userId}/avatar` |
    | `GET /v1/me/avatar` or authorized `GET /v1/members/{memberId}/avatar` | `GET /internal/v1/users/{userId}/avatar-reference` before the Storage read |
    | `PATCH /v1/me` | `PATCH /internal/v1/users/{userId}` with the user the introspection returned |
    | `PUT /v1/me/password` | `PUT /internal/v1/users/{userId}/password` with the user and the session the introspection returned |
    | `POST /v1/me/email-change` | `POST /internal/v1/users/{userId}/email-change` with the user and the session the introspection returned |
    | `POST /v1/me/email-change/confirmation` | `POST /internal/v1/users/{userId}/email-change/confirmation` with the user and the session the introspection returned |
    | `POST /v1/me/deletion` | `POST /internal/v1/users/{userId}/deletion` with the user and the session the introspection returned |
    | `GET /v1/me/two-step-verification` | `GET /internal/v1/users/{userId}/two-step-verification` with the user the introspection returned |
    | `DELETE /v1/me/two-step-verification` | `POST /internal/v1/users/{userId}/two-step-verification/disable` with the user and the session the introspection returned |
    | `POST /v1/me/two-step-verification/authenticator-app/setup` | `POST /internal/v1/users/{userId}/two-step-verification/authenticator-app/setup` with the user and the session the introspection returned |
    | `POST /v1/me/two-step-verification/authenticator-app/setup/confirmation` | `POST /internal/v1/users/{userId}/two-step-verification/authenticator-app/setup/confirmation` with the user and the session the introspection returned |
    | `POST /v1/me/two-step-verification/backup-codes/regenerate` | `POST /internal/v1/users/{userId}/two-step-verification/backup-codes/regenerate` with the user and the session the introspection returned |
    | `POST /v1/me/two-step-verification/security-keys/registration` | `POST /internal/v1/users/{userId}/two-step-verification/security-keys/registration` with the user and the session the introspection returned |
    | `POST /v1/me/two-step-verification/security-keys` | `POST /internal/v1/users/{userId}/two-step-verification/security-keys` with the user and the session the introspection returned |
    | `DELETE /v1/me/two-step-verification/security-keys/{securityKeyId}` | `POST /internal/v1/users/{userId}/two-step-verification/security-keys/{securityKeyId}/remove` with the user and the session the introspection returned |
    | `GET /v1/organization/authentication-policy` | `GET /internal/v1/organization/authentication-policy` |
    | `PATCH /v1/organization/authentication-policy` | `PATCH /internal/v1/organization/authentication-policy?sessionId=` with the session the introspection returned |
    | `GET /v1/sessions` | `GET /internal/v1/users/{userId}/sessions` with the user and, as `currentSessionId`, the session the introspection returned |
    | `DELETE /v1/sessions/{sessionId}` | `DELETE /internal/v1/sessions/{sessionId}` with the id of the path |
    | `POST /v1/sessions/revoke-others` | `POST /internal/v1/sessions/{sessionId}/revoke-others` with the session the introspection returned |
    | `PUT /v1/session/organization` | `PUT /internal/v1/sessions/{sessionId}/organization` with the session the introspection returned |
    | `POST /v1/realtime/tickets` | `POST /internal/v1/realtime/tickets` with the session and organization the introspection returned |
    | `POST /v1/api-tokens` | `POST /internal/v1/api-tokens` |
    | `GET /v1/api-tokens` | `GET /internal/v1/api-tokens` |
    | `DELETE /v1/api-tokens/{apiTokenId}` | `DELETE /internal/v1/api-tokens/{apiTokenId}` |
    | Any request with the session cookie | `POST /internal/v1/tokens/introspect`, before the route |
    | Any request with `Authorization: Bearer cw_pat_…` | `POST /internal/v1/api-tokens/introspect`, before the route |

    **Tokens.** A route that signs in returns the opaque session token once, in `token`: the gateway
    writes it into the cookie `__Host-cw_session` and never logs it; identity-service keeps only its
    SHA-256 hash. The gateway reads the browser's address and User-Agent and sends them in `client`:
    identity-service never reads them from the headers of the internal call. The routes whose
    security email shows the device (the sign-ins, the password reset, the password change and the
    confirmation of a new address) take `client` for it. A reset link token, a two-step challenge
    token, a trusted device token, the secret of an authenticator app and the backup codes are
    secrets too: they travel in bodies only and are never logged; identity-service keeps the
    tokens and the backup codes hashed and the secret of the app encrypted.

    **Federated sign-in.** Identity owns the short-lived provider flow, browser binding and
    one-use continuation receipt. The gateway identifies its four calls as `anonymous` without
    an organization, forwards credentials only in bodies, maps provider refusals to the one
    public problem and never copies provider diagnostics to the browser. It maps
    `auth.federated-unavailable` to the public `upstream.unavailable` for identity-service.
    The gateway sets or clears the dedicated browser cookies and selects the fixed webapp
    continuation URL.
    No request supplies provider endpoint addresses or OAuth redirect URIs. Provider credentials,
    state, proofs, cookies and receipt are excluded from logs, traces and error details.

    **Two-step challenge.** For an account with two-step verification, the right password of
    `POST /internal/v1/auth/sign-in` and the right code of
    `POST /internal/v1/auth/sign-in/code/verification` answer `202` with a challenge, no token and
    no session, unless `trustedDeviceToken`, the value of the cookie `__Host-cw_trusted_device`
    the gateway forwards, names a device this account trusts. The gateway answers that `202` as
    is, without a cookie, and validates its body with the validator of
    `POST /internal/v1/auth/sign-in/challenge/inspection`, which answers the same schema. The
    answers of the challenge (`/internal/v1/auth/sign-in/challenge/…`) open the session as a sign-in
    does and answer `200` with `SessionIssued`; with `trustDevice`, `trustedDevice` carries the
    device token the gateway writes into its cookie. A new challenge of the account replaces the
    previous one. Five wrong answers in a row across the challenges of the account and the codes
    of the re-authentication lock the two-step answers of the account for 15 minutes
    (`429 auth.two-step-locked`).

    **Trusted devices.** A trusted device is a token of 256 random bits bound to the account,
    valid 30 days, kept as its SHA-256 hash. A password change or reset, the revocation of the
    other sessions, turning two-step verification off and scheduling the deletion forget every
    trusted device of the account. A `trustedDeviceToken` that is unknown, expired, forgotten, of
    another account or malformed is ignored: the sign-in answers the challenge, and tells nothing
    about the token.

    **Authentication policy.** identity-service keeps the authentication policy of each
    organization it knows from the copy of the memberships (decision D5): the roles that must have
    two-step verification (`nobody` by default, `admins`, `everyone`) and the inactivity of the
    sessions acting on it (12 hours by default; 1 hour, 7 days or 30 days). It applies both
    itself: the inactivity at each introspection of a session, from the policy of its current
    organization; the two-step requirement by withholding the organization (below), by refusing
    the choice of the organization (`403 organization.mfa-required`) and by refusing to turn
    two-step verification off (`409 auth.mfa-required-by-organization`). Only the owner and the
    admins of the organization, in the copy of the memberships, read and change it.

    **Withheld organization.** When the policy of the organization of a session or of a personal
    API token requires two-step verification for the role its person has there, and the account
    has none, the active introspection names that organization in `withheldOrganization` with the
    code `organization.mfa-required`, and gives no organization context: `organizationId` and
    `role` are `null` for a session, and `scopes` is empty for a personal API token. The gateway
    answers `403 organization.mfa-required`, with `details.organizationId`, on every route that
    needs an organization, and serves the routes of the account, which need none, so that the
    person can set two-step verification up. A gateway that does not read `withheldOrganization`
    yet refuses those routes all the same (`403 organization.not-selected`, or
    `403 auth.scope-missing` for a token). The organization comes back at the next introspection
    after the setup, with nothing to choose again.

    **Session of the request.** The routes a signed-in person calls about their own account name
    the session the introspection returned, in the path (`sessionId`), the body (`sessionId`) or the
    query (`currentSessionId`). identity-service checks that it is an open session of the actor;
    otherwise it answers `404 session.not-found`, which the gateway answers as
    `401 auth.session-expired`, since the session ended after its introspection. Only the
    revocation of a session by the id of the public path relays `404 session.not-found` as is.

    **Recent authentication.** identity-service records, per session, when its person last proved
    who they are, and how. For an account without two-step verification: the sign-in that opened
    the session, the password of `POST /internal/v1/sessions/{sessionId}/reauthentication`, or the
    right current password of `PUT /internal/v1/users/{userId}/password`. For an account with
    two-step verification, a two-step proof only: the answer of the challenge of the sign-in that
    opened the session (a sign-in on a trusted device, which skipped it, records nothing), the
    `code` of the re-authentication, or the code that confirms the authenticator app; a password
    never counts, and turning two-step verification on ends the windows other sessions opened
    with a password. The request of a change of address, the scheduling of the deletion, the
    creation of a personal API token, the change of the authentication policy of an organization,
    the routes of two-step verification that start or remove something (the start of the setup of
    the app, its disabling, the regeneration of the backup codes, the start of the registration of
    a security key and its removal), and, for an account with two-step verification, the change of
    the password require it within the last 10 minutes, else they answer
    `403 auth.reauthentication-required` with `details.methods`: `[password]` without two-step
    verification, `[authenticator-app]` with it (a security key does not confirm in this
    version). identity-service answers this code itself; the gateway forwards it with its French
    title, unlike the refusals of the internal token.

    **Lockout.** The failed passwords of the re-authentication and of the password change count
    with the failed sign-ins of the address of the account: 5 in a row lock its password sign-in
    for 15 minutes (`429 auth.account-locked`), and these two routes answer the same code during the
    lockout, without closing the session. A right password, and a completed password reset, end
    the count. The wrong two-step codes of the re-authentication count with the wrong answers of
    the two-step challenges instead (`429 auth.two-step-locked`).

    **Ownership.** identity-service refuses to schedule the deletion of an account that owns an
    organization according to its membership projection (`409 account.organization-owner`).
    Before final deletion it obtains a durable reservation from organization-service, which
    checks current ownership and fences new ownership and memberships for the account.

    **Internal token.** Every call carries the internal token of `@cadenway/nest-common`
    (`Authorization: Bearer`, Ed25519, 60 seconds, `aud` = `identity-service`). Realtime ticket
    redemption accepts only `realtime-gateway`. The notification recipient read accepts only
    `notification-service` with an unscoped `system` actor. The verified address read accepts only
    `organization-service` with an unscoped `system` actor. The gateway routes accept only
    `api-gateway`.
    Each operation declares its actor and whether it requires an organization. Realtime ticket
    issuance, personal API token management and the authentication policy use the current
    organization of the session. The guard of the kit
    answers `401 auth.token-missing`, `401 auth.token-invalid`, `403 auth.issuer-not-allowed`,
    `403 auth.actor-not-allowed` and `403 auth.organization-required`. The gateway answers
    `403 organization.not-selected` itself, before the call, when the session has no current
    organization. Gateway routes that require no organization ignore the one the token may carry.

    **Memberships.** identity-service keeps a copy of the memberships (organization, user, role)
    from `member.joined.v1`, `member.role-changed.v1` and `member.removed.v1`
    (`asyncapi/organization-service.yaml`). It checks the choice of an organization against this
    projection. It applies each membership by its `version` and keeps each removal terminal for
    its membership ID. For an active credential scoped to an organization, Identity verifies the
    current membership and role with organization-service before returning a context. If the proof
    is unavailable, introspection returns `503 organization.unavailable` without returning a
    projected role or treating the credential as permanently inactive.

    **Errors.** The codes are those of the public routes; the gateway forwards the `code` and the
    `details`, answers the French `title` of `openapi/public/auth.yaml`, and derives `Retry-After`
    from `details` (the internal client does not carry headers of a problem). The titles here are
    English. A refused password or code answers `422`, never `401`: the gateway's internal client
    turns any `401` into `503 upstream.unauthorized`, a configuration defect. The gateway answers
    `403 auth.issuer-not-allowed`, `403 auth.actor-not-allowed` and `403 auth.organization-required`,
    which are configuration defects too, as `503 upstream.unauthorized`, never to the browser.
  contact:
    name: Cadenway
    url: https://github.com/Cadenway/cadenway-api-contracts
  license:
    name: Proprietary
    url: https://github.com/Cadenway/cadenway-api-contracts/blob/main/LICENSE
  x-consumers:
    - repository: cadenway-api-gateway
      uses: >-
        Calls its routes through the generated client for authentication, session and API token
        introspection, account and avatar management, personal API tokens, the current
        organization and its authentication policy, and realtime ticket issuance.
    - repository: cadenway-realtime-gateway
      uses: Redeems a realtime ticket before authenticating a Socket.IO connection.
    - repository: cadenway-notification-service
      uses: >-
        Reads one current recipient profile for immediate notification email or a digest,
        including weekday and Monday deliveries at 09:00 in the account's time zone.
        Enable the consumer after identity-service serves the route and trusts the Notification
        issuer for this operation.
    - repository: cadenway-organization-service
      uses: >-
        Resolves the authenticated actor's current verified address before listing, accepting
        or refusing invitations addressed to that actor.
servers:
  - url: http://identity-service:3010
    description: identity-service on the internal network of each environment (`IDENTITY_SERVICE_URL`).
security:
  - internalToken: []
tags:
  - name: auth
    description: Sign-up, email verification, sign-in and its two-step challenge, and password reset, before a session exists.
  - name: sessions
    description: Introspection, list, recent re-authentication and revocation of sessions.
  - name: realtime-tickets
    description: Issue and redeem one-time Socket.IO credentials.
  - name: users
    description: Accounts, their profile, password, address and deletion.
  - name: api-tokens
    description: Personal API tokens and their introspection.
  - name: two-step-verification
    description: The two-step verification of a user.
  - name: authentication-policy
    description: The authentication policy of the organization of the token.
paths:
  /internal/v1/auth/sign-in-methods:
    post:
      operationId: discoverSignInMethodsInternal
      summary: Discover the sign-in methods of an address
      description: |
        Same answer for every address today: `password` and `email-code`. Internal token: actor
        `anonymous`, no organization.
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignInMethodsRequest'
            example:
              email: camille.martin@ateliernord.fr
      responses:
        '200':
          description: The methods offered for the address.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignInMethods'
              example:
                methods:
                  - type: password
                  - type: email-code
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InternalTokenRefused'
        '403':
          $ref: '#/components/responses/InternalAccessRefused'
  /internal/v1/auth/sign-in/federated/start:
    post:
      operationId: startFederatedSignInInternal
      x-cadenway-strict-body: true
      summary: Start federated sign-in and create its browser binding
      description: |
        Generates an expiring flow and a browser binding. For SAML, a work email selects the
        configured connection of its verified organization domain, without using the address
        as an account identifier. For OAuth the provider selects a configured client,
        authorization endpoint, issuer and redirect URI. Use authorization code and S256
        PKCE for all social providers and a nonce for Google, Microsoft and GitLab OIDC.
        GitHub supplies identity from its authenticated user endpoint. Keep verifiers and
        nonce server-side, and retain only digests of one-use opaque browser credentials.
        Internal token: actor `anonymous`, no organization.
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../../components/federated-sign-in.yaml#/components/schemas/FederatedSignInStart'
            example:
              provider: saml
              email: camille.martin@ateliernord.fr
      responses:
        '200':
          description: The authorization URL and the opaque browser binding that the gateway sets in its flow cookie.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FederatedFlowStarted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InternalTokenRefused'
        '403':
          $ref: '#/components/responses/InternalAccessRefused'
        '422':
          $ref: '#/components/responses/FederatedSignInRefused'
        '503':
          $ref: '#/components/responses/FederatedAuthorityUnavailable'
  /internal/v1/auth/sign-in/federated/oauth/callback:
    post:
      operationId: completeOAuthSignInInternal
      x-cadenway-strict-body: true
      summary: Validate an OAuth callback and issue a continuation receipt
      description: |
        Validates the exact fields of the closed response variant before claiming state. An
        authorized response carries only its outcome and code, and a denied response carries
        only its outcome and error. Unknown fields and mixed outcomes are refused.
        Atomically claims the unexpired state only when the provider and browser binding match.
        A matched state is consumed once, including on provider refusal. Identity exchanges
        a code once with the original verifier and exact registered redirect URI. For OIDC, it
        validates the ID token signature and claims including issuer, audience, expiration,
        nonce and stable subject against the configured client and provider. For GitHub it
        resolves the stable user ID through the configured authenticated user API. Provider
        access tokens are short-lived inputs for this flow and are never returned to Gateway.
        Success issues only a continuation receipt and does not create a Cadenway session.
        Internal token: actor `anonymous`, no organization.
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FederatedOAuthCallback'
      responses:
        '200':
          $ref: '#/components/responses/FederatedContinuationIssued'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InternalTokenRefused'
        '403':
          $ref: '#/components/responses/InternalAccessRefused'
        '422':
          $ref: '#/components/responses/FederatedSignInRefused'
        '503':
          $ref: '#/components/responses/FederatedAuthorityUnavailable'
  /internal/v1/auth/sign-in/federated/saml/callback:
    post:
      operationId: completeSamlSignInInternal
      x-cadenway-strict-body: true
      summary: Validate a SAML assertion and issue a continuation receipt
      description: |
        Atomically claims the unexpired RelayState only when the original SAML flow and browser
        binding match. Accepts only an SP-initiated response from the organization connection
        bound to the flow. Verify a trusted signature over the assertion used, the configured
        issuer, SP audience, destination and recipient, validity window, response and bearer
        InResponseTo, and the uniqueness of the accepted assertion ID for its validity window.
        Process bounded XML without resolving external resources. Select the stable linked
        subject from this verified issuer and assertion and verify its current membership with
        Organization. No assertion attribute links accounts by email. Success returns only a
        receipt; no Cadenway session is created.
        Internal token: actor `anonymous`, no organization.
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FederatedSamlCallback'
      responses:
        '200':
          $ref: '#/components/responses/FederatedContinuationIssued'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InternalTokenRefused'
        '403':
          $ref: '#/components/responses/InternalAccessRefused'
        '422':
          $ref: '#/components/responses/FederatedSignInRefused'
        '503':
          $ref: '#/components/responses/SamlAuthorityUnavailable'
  /internal/v1/auth/sign-in/federated/finish:
    post:
      operationId: finishFederatedSignInInternal
      x-cadenway-strict-body: true
      summary: Redeem a federated receipt using the ordinary session and two-step flow
      description: |
        Consumes the unexpired receipt once and proves the account through the existing link for
        the verified provider, issuer and subject. SAML additionally requires an active
        membership in the organization bound to the flow, verified with Organization before
        issuing a challenge or opening a session. A revoked link, disabled account or
        now-disallowed method cannot open a session. The receipt preserves the chosen
        `rememberMe` and never substitutes for Cadenway's applicable two-step challenge.
        A previously trusted Cadenway device keeps its existing behavior. Any session that opens
        uses the usual token, lifetime, organization policy and new-device reporting. An opened
        SAML session retains the originating membership as an authorization requirement even
        when it acts on a different organization.
        Internal token: actor `anonymous`, no organization.
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FederatedSignInFinish'
      responses:
        '200':
          $ref: '#/components/responses/SessionIssued'
        '202':
          $ref: '#/components/responses/ChallengeIssued'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InternalTokenRefused'
        '403':
          $ref: '#/components/responses/InternalAccessRefused'
        '422':
          $ref: '#/components/responses/FederatedSignInRefused'
        '503':
          $ref: '#/components/responses/SamlAuthorityUnavailable'
  /internal/v1/auth/sign-up:
    post:
      operationId: signUpInternal
      summary: Create an account
      description: |
        Creates an unverified account, or replaces the name and password of an account whose
        address is not verified yet, and issues an `email-verification` code
        (`one-time-code.issued.v1`). The first sign-up of an address emits `user.signed-up.v1`; a
        repeated one emits it again with the next version.

        The verification is bound to the password of the latest sign-up of the address:
        `POST /internal/v1/auth/sign-up/verification` answers `422 auth.sign-up-replaced` to a
        `password` that differs from it, and requires `password` once the address was signed up
        more than once, so that a replacement never lets the code verify a password the owner of
        the address did not choose. Every sign-up is a code request of the address and follows the
        throttle of `CodeThrottled`. Internal token: actor `anonymous`, no organization.
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignUpRequest'
            example:
              name: Camille Martin
              email: camille.martin@ateliernord.fr
              password: atelier-nord-sprint-14
              acceptTerms: true
      responses:
        '202':
          description: The account exists, unverified, and a code was issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodeSent'
              example:
                email: camille.martin@ateliernord.fr
                expiresAt: '2026-11-08T13:17:00Z'
                resendAvailableAt: '2026-11-08T13:07:30Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InternalTokenRefused'
        '403':
          $ref: '#/components/responses/InternalAccessRefused'
        '409':
          $ref: '#/components/responses/EmailTaken'
        '422':
          $ref: '#/components/responses/SignUpRefused'
        '429':
          $ref: '#/components/responses/CodeThrottled'
  /internal/v1/auth/sign-up/code:
    post:
      operationId: resendSignUpCodeInternal
      summary: Issue a new sign-up code
      description: |
        Issues a new `email-verification` code when an unverified account uses the address, and
        invalidates the previous one; answers `202` without issuing anything otherwise. Throttled
        per address, account or not, together with the sign-up and the sign-in codes: 30 seconds
        between two requests and at most 5 in an hour (`CodeThrottled`). Internal token: actor
        `anonymous`, no organization.
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CodeRequest'
            example:
              email: camille.martin@ateliernord.fr
      responses:
        '202':
          description: Accepted, whether or not a code was issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodeSent'
              example:
                email: camille.martin@ateliernord.fr
                expiresAt: '2026-11-08T13:17:30Z'
                resendAvailableAt: '2026-11-08T13:08:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InternalTokenRefused'
        '403':
          $ref: '#/components/responses/InternalAccessRefused'
        '429':
          $ref: '#/components/responses/CodeThrottled'
  /internal/v1/auth/sign-up/verification:
    post:
      operationId: verifySignUpInternal
      summary: Verify the address and open a session
      description: |
        Checks the `email-verification` code, then the password of the sign-up, verifies the
        address (`user.email-verified.v1`) and opens a session for the `client`. The checks run in
        this order:

        1. The code. A wrong code answers `422 auth.code-invalid` and a code no longer usable
           `422 auth.code-expired`, with or without `password`.
        2. With the right code, a `password` is compared with the password of the pending
           sign-up, the latest one of the address. When it differs, the answer is
           `422 auth.sign-up-replaced` and the code stops working.
        3. When a later sign-up replaced the name and password of the pending account (the
           address was signed up more than once before this verification), `password` is
           required: without it the answer is `422 auth.sign-up-replaced` too, and the code stops
           working. Only an accepted sign-up (`202`) counts: a refused one replaces nothing.

        Without `password`, an address signed up once is verified by its code alone.
        `auth.sign-up-replaced` needs the right code, so it tells a caller without the code
        nothing. The gateway forwards the `password` of the public request unchanged. Internal
        token: actor `anonymous`, no organization.
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignUpVerification'
            example:
              email: camille.martin@ateliernord.fr
              code: '482913'
              rememberMe: false
              password: atelier-nord-sprint-14
              client:
                ipAddress: 86.247.12.30
                userAgent: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:145.0) Gecko/20100101 Firefox/145.0
      responses:
        '200':
          $ref: '#/components/responses/SessionIssued'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InternalTokenRefused'
        '403':
          $ref: '#/components/responses/InternalAccessRefused'
        '422':
          $ref: '#/components/responses/SignUpVerificationRefused'
  /internal/v1/auth/sign-in:
    post:
      operationId: signInWithPasswordInternal
      summary: Sign in with a password
      description: |
        Checks the address and the password, counting failures per address whether or not an
        account uses it, and opens a session for the `client`.

        - An account whose deletion is scheduled is signed in and its deletion cancelled:
          `deletionCancelled: true` and `user.deletion-cancelled.v1`.
        - A session opened on a device the account did not use in the last 90 days emits
          `session.opened-on-new-device.v1`.
        - The right password of an account with two-step verification answers `202` with a
          two-step challenge, no token and no session, unless `trustedDeviceToken` names a device
          this account trusts (see "Two-step challenge"). Only the `200`, here or of the answer of
          the challenge, opens a session, cancels a deletion and counts the device; the challenge
          keeps `rememberMe` for the session its answer opens, for the `client` of the answer.

        Internal token: actor `anonymous`, no organization.
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordSignIn'
            example:
              email: camille.martin@ateliernord.fr
              password: atelier-nord-sprint-14
              rememberMe: true
              client:
                ipAddress: 86.247.12.30
                userAgent: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:145.0) Gecko/20100101 Firefox/145.0
      responses:
        '200':
          $ref: '#/components/responses/SessionIssued'
        '202':
          $ref: '#/components/responses/ChallengeIssued'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InternalTokenRefused'
        '403':
          $ref: '#/components/responses/SignInForbidden'
        '422':
          $ref: '#/components/responses/CredentialsRefused'
        '429':
          $ref: '#/components/responses/AccountLocked'
  /internal/v1/auth/sign-in/code:
    post:
      operationId: requestSignInCodeInternal
      summary: Issue a sign-in code
      description: |
        Issues a `sign-in` code (`one-time-code.issued.v1`) when a verified account uses the
        address, invalidating the previous one; answers `202` the same way otherwise. Throttled per
        address, account or not, together with the sign-up codes: 30 seconds between two requests
        and at most 5 in an hour (`CodeThrottled`). Internal token: actor `anonymous`, no
        organization.
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CodeRequest'
            example:
              email: camille.martin@ateliernord.fr
      responses:
        '202':
          description: Accepted, whether or not a code was issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodeSent'
              example:
                email: camille.martin@ateliernord.fr
                expiresAt: '2026-11-08T13:17:00Z'
                resendAvailableAt: '2026-11-08T13:07:30Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InternalTokenRefused'
        '403':
          $ref: '#/components/responses/InternalAccessRefused'
        '429':
          $ref: '#/components/responses/CodeThrottled'
  /internal/v1/auth/sign-in/code/verification:
    post:
      operationId: signInWithCodeInternal
      summary: Sign in with a code
      description: |
        Checks the `sign-in` code and opens a session for the `client`. An address without a
        verified account answers like a wrong code. As with `POST /internal/v1/auth/sign-in`, the
        session cancels a scheduled deletion (`deletionCancelled: true`,
        `user.deletion-cancelled.v1`) and emits `session.opened-on-new-device.v1` on a device the
        account did not use in the last 90 days. The right code of an account with two-step
        verification answers `202` with a two-step challenge, no token and no session, unless
        `trustedDeviceToken` names a device this account trusts. Internal token: actor
        `anonymous`, no organization.
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CodeVerification'
            example:
              email: camille.martin@ateliernord.fr
              code: '482913'
              rememberMe: true
              client:
                ipAddress: 86.247.12.30
                userAgent: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:145.0) Gecko/20100101 Firefox/145.0
      responses:
        '200':
          $ref: '#/components/responses/SessionIssued'
        '202':
          $ref: '#/components/responses/ChallengeIssued'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InternalTokenRefused'
        '403':
          $ref: '#/components/responses/InternalAccessRefused'
        '422':
          $ref: '#/components/responses/CodeRefused'
  /internal/v1/auth/sign-in/challenge/inspection:
    post:
      operationId: inspectSignInChallengeInternal
      summary: Read a two-step challenge
      description: |
        Returns a usable challenge, as the `202` of the sign-in gave it, without answering it or
        counting an attempt. Its `200` has the schema of those `202`: the gateway validates both
        with its validator. A challenge that expired, was answered, was replaced or is unknown, and
        a malformed token, answer `422 auth.challenge-expired`. Internal token: actor `anonymous`,
        no organization.
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChallengeTokenRequest'
            example:
              token: ExampleOnlyChallengeToken00000000000000000
      responses:
        '200':
          description: The challenge.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignInChallenge'
              examples:
                camilleMartin:
                  $ref: '#/components/examples/SignInChallenge'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InternalTokenRefused'
        '403':
          $ref: '#/components/responses/InternalAccessRefused'
        '422':
          $ref: '#/components/responses/ChallengeExpired'
  /internal/v1/auth/sign-in/challenge/authenticator-app:
    post:
      operationId: answerSignInChallengeWithAuthenticatorAppInternal
      summary: Answer a two-step challenge with a code of the app
      description: |
        Checks the challenge, then the code against the authenticator app of its account (one step
        of tolerance either way; a time step already accepted is refused). On success, in one
        transaction: the challenge is used up, a session is opened for the `client` with the
        `rememberMe` of the sign-in, a scheduled deletion is cancelled
        (`user.deletion-cancelled.v1`), the device is counted
        (`session.opened-on-new-device.v1`), the count of wrong answers ends, and, with
        `trustDevice`, a trusted device is recorded and returned in `trustedDevice`.

        A wrong or used code answers `422 auth.two-step-code-invalid` with
        `details.remainingAttempts`; the fifth wrong answer in a row of the account, and every
        answer during the lockout, `429 auth.two-step-locked` with `details.lockedUntil`. A
        challenge no longer usable answers `422 auth.challenge-expired` and counts nothing.
        For a SAML challenge, Identity verifies the current originating membership with
        Organization before opening the session.
        Internal token: actor `anonymous`, no organization.
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthenticatorAppAnswer'
            example:
              token: ExampleOnlyChallengeToken00000000000000000
              code: '261845'
              trustDevice: true
              client:
                ipAddress: 86.247.12.30
                userAgent: Mozilla/5.0 (iPhone; CPU iPhone OS 18_1 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/18.1 Mobile/15E148 Safari/604.1
      responses:
        '200':
          $ref: '#/components/responses/ChallengeAnswered'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InternalTokenRefused'
        '403':
          $ref: '#/components/responses/InternalAccessRefused'
        '422':
          $ref: '#/components/responses/TwoStepCodeRefused'
        '429':
          $ref: '#/components/responses/TwoStepLocked'
        '503':
          $ref: '#/components/responses/MembershipAuthorityUnavailable'
  /internal/v1/auth/sign-in/challenge/backup-code:
    post:
      operationId: answerSignInChallengeWithBackupCodeInternal
      summary: Answer a two-step challenge with a backup code
      description: |
        Checks the challenge, then the backup code, upper-cased and without its dash, against the
        hashes of the unused backup codes of its account; the right one is used up in the
        transaction that opens the session. Otherwise as
        `POST /internal/v1/auth/sign-in/challenge/authenticator-app`: the same refusals, counted
        together, and the same effects of the success. Internal token: actor `anonymous`, no
        organization.
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BackupCodeAnswer'
            example:
              token: ExampleOnlyChallengeToken00000000000000000
              code: 4F7K-2M9Q
              trustDevice: false
              client:
                ipAddress: 86.247.12.30
                userAgent: Mozilla/5.0 (iPhone; CPU iPhone OS 18_1 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/18.1 Mobile/15E148 Safari/604.1
      responses:
        '200':
          $ref: '#/components/responses/ChallengeAnswered'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InternalTokenRefused'
        '403':
          $ref: '#/components/responses/InternalAccessRefused'
        '422':
          $ref: '#/components/responses/TwoStepCodeRefused'
        '429':
          $ref: '#/components/responses/TwoStepLocked'
        '503':
          $ref: '#/components/responses/MembershipAuthorityUnavailable'
  /internal/v1/auth/sign-in/challenge/security-key/options:
    post:
      operationId: getSignInChallengeSecurityKeyOptionsInternal
      summary: Issue the WebAuthn options of a challenge
      description: |
        Issues a new WebAuthn assertion challenge for a usable two-step challenge, valid 5 minutes,
        allowing the security keys of its account only, and replaces the previous options of the
        challenge. A challenge no longer usable answers `422 auth.challenge-expired`, an account
        without a key `422 auth.security-key-refused`, and a lockout of the two-step answers
        `429 auth.two-step-locked`. Counts no attempt. Internal token: actor `anonymous`, no
        organization.
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChallengeTokenRequest'
            example:
              token: ExampleOnlyChallengeToken00000000000000000
      responses:
        '200':
          description: The options, for the browser.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecurityKeyAssertionOptions'
              example:
                options:
                  challenge: ExampleOnlyWebAuthnChallenge000000000000000
                  rpId: cadenway.com
                  timeout: 300000
                  userVerification: preferred
                  allowCredentials:
                    - id: ExampleOnlyCredentialIdYubiKey5CNfc0000000
                      type: public-key
                      transports: [usb, nfc]
                expiresAt: '2026-11-09T07:47:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InternalTokenRefused'
        '403':
          $ref: '#/components/responses/InternalAccessRefused'
        '422':
          $ref: '#/components/responses/SecurityKeyAnswerRefused'
        '429':
          $ref: '#/components/responses/TwoStepLocked'
  /internal/v1/auth/sign-in/challenge/security-key:
    post:
      operationId: answerSignInChallengeWithSecurityKeyInternal
      summary: Answer a two-step challenge with a security key
      description: |
        Checks the challenge, then verifies `credential` against the latest options of the
        challenge and the keys of its account (`@simplewebauthn/server`: the WebAuthn challenge;
        the exact origin of the web application of the environment, cross-origin answers refused;
        the relying party of the environment; the signature; the counter; and `userHandle`, when
        present, equal to the handle of the account of the challenge). An
        answer that does not verify answers `422 auth.security-key-refused` with
        `details.remainingAttempts`, counted with the other wrong answers. On success, the effects
        of `POST /internal/v1/auth/sign-in/challenge/authenticator-app`, and the key records its
        last use and its counter. Internal token: actor `anonymous`, no organization.
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SecurityKeyAnswer'
            example:
              token: ExampleOnlyChallengeToken00000000000000000
              credential:
                id: ExampleOnlyCredentialIdYubiKey5CNfc0000000
                rawId: ExampleOnlyCredentialIdYubiKey5CNfc0000000
                type: public-key
                response:
                  clientDataJSON: ExampleOnlyClientDataJson
                  authenticatorData: ExampleOnlyAuthenticatorData
                  signature: ExampleOnlySignature
                  userHandle: ExampleOnlyUserHandle
                authenticatorAttachment: cross-platform
                clientExtensionResults: {}
              trustDevice: true
              client:
                ipAddress: 192.0.2.14
                userAgent: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:132.0) Gecko/20100101 Firefox/132.0
      responses:
        '200':
          $ref: '#/components/responses/ChallengeAnswered'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InternalTokenRefused'
        '403':
          $ref: '#/components/responses/InternalAccessRefused'
        '422':
          $ref: '#/components/responses/SecurityKeyAnswerRefused'
        '429':
          $ref: '#/components/responses/TwoStepLocked'
        '503':
          $ref: '#/components/responses/MembershipAuthorityUnavailable'
  /internal/v1/tokens/introspect:
    post:
      operationId: introspectToken
      summary: Introspect a session token
      description: |
        Tells whether the token of a session cookie is active and, when it is, whose it is and
        which organization it acts on. The gateway calls it on every request that carries the
        cookie, never caches the answer, and gives the request its context from it
        (`setRequestOrganizationContext`): `organizationId`, `role` and `scopes` go into the
        internal token of its calls.

        A token that is unknown, expired, revoked or malformed answers `200` with
        `active: false`, never an error; so does a personal API token, introspected by
        `POST /internal/v1/api-tokens/introspect`. For a locally valid session with a selected
        organization, Identity verifies the active membership with organization-service. A
        confirmed absence or a replacement membership ID yields an active session with no
        organization or role. The current role from Organization applies to the policy and
        returned context.
        If the proof is unavailable the call returns `503 organization.unavailable`.

        An active answer counts as activity: the inactivity period of the session starts again,
        the one the authentication policy of its current organization sets (12 hours by default
        and without an organization); a session
        idle for longer is inactive. A current organization withheld for want of two-step
        verification gives `withheldOrganization` and no organization (see "Withheld
        organization"); the inactivity of the policy of that organization still applies to the
        session. Calling it twice has the same effect as once, so the call can be retried.
        Internal token: actor `system`, no organization.
      tags: [sessions]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IntrospectionRequest'
            example:
              token: example-session-token
      responses:
        '200':
          description: Whether the token is active, and its subject when it is.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Introspection'
              examples:
                active:
                  summary: Active session in Atelier Nord
                  value:
                    active: true
                    tokenType: session
                    sessionId: 019a6a2e-4b1c-7d3e-8f5a-2c9b7e1d4a60
                    userId: 019a5f3c-8d2e-7c4a-9b1f-3e5d7a9c1b30
                    organizationId: 019a5f3c-8d2e-7c4a-9b1f-3e5d7a9c1b2f
                    role: owner
                    scopes: [tasks:read, tasks:write, members:read, webhooks:manage]
                    expiresAt: '2026-12-08T13:07:00Z'
                noOrganization:
                  summary: Active session without a current organization
                  value:
                    active: true
                    tokenType: session
                    sessionId: 019a6a2e-4b1c-7d3e-8f5a-2c9b7e1d4a60
                    userId: 019a5f3c-8d2e-7c4a-9b1f-3e5d7a9c1b30
                    organizationId: null
                    role: null
                    scopes: [tasks:read, tasks:write, members:read, webhooks:manage]
                    expiresAt: '2026-12-08T13:07:00Z'
                withheldOrganization:
                  summary: Théo Bernard, without two-step verification, once Atelier Nord requires it of everyone
                  value:
                    active: true
                    tokenType: session
                    sessionId: 019a6a31-5c2d-7e4f-9a6b-3d8c7f2e5b71
                    userId: 019a5f3c-b2c3-7d4e-8f5a-6b7c8d9e0f33
                    organizationId: null
                    role: null
                    scopes: [tasks:read, tasks:write, members:read, webhooks:manage]
                    expiresAt: '2026-12-08T13:07:00Z'
                    withheldOrganization:
                      organizationId: 019a5f3c-8d2e-7c4a-9b1f-3e5d7a9c1b2f
                      code: organization.mfa-required
                inactive:
                  summary: Unknown, expired or revoked token
                  value:
                    active: false
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InternalTokenRefused'
        '403':
          $ref: '#/components/responses/InternalAccessRefused'
        '503':
          $ref: '#/components/responses/MembershipAuthorityUnavailable'
  /internal/v1/sessions/{sessionId}:
    delete:
      operationId: revokeSession
      summary: Revoke a session
      description: |
        Ends a session of the actor: its token is no longer active from the next introspection and
        `session.revoked.v1` is emitted. Revoking a session that already ended answers `204` and
        emits nothing. A session of another user, or an unknown id, answers
        `404 session.not-found`. The gateway calls it for the sign-out, with the session of the
        cookie, and for `DELETE /v1/sessions/{sessionId}`, with the id of the path, which may be the
        session of the request too. Internal token: actor `user`, no organization.
      tags: [sessions]
      parameters:
        - name: sessionId
          in: path
          required: true
          description: Id of the session, as the introspection returned it.
          schema:
            type: string
            format: uuid
            examples: [019a6a2e-4b1c-7d3e-8f5a-2c9b7e1d4a60]
      responses:
        '204':
          description: The session is revoked.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InternalTokenRefused'
        '403':
          $ref: '#/components/responses/InternalAccessRefused'
        '404':
          $ref: '#/components/responses/SessionNotFound'
  /internal/v1/users/{userId}/avatar/uploads:
    parameters:
      - name: userId
        in: path
        required: true
        description: Account id.
        schema:
          type: string
          format: uuid
          examples: [019a5f3c-8d2e-7c4a-9b1f-3e5d7a9c1b30]
    post:
      operationId: reserveAvatarUploadInternal
      summary: Reserve an account avatar upload
      description: |
        Allocates one pending reservation for the actor and the current avatar generation before the
        gateway obtains a signed Storage transfer. Stores the bound declaration and expiry. While
        authorization still holds, replaying an equivalent Idempotency-Key returns the original
        reservation and expiry. Internal token issuer api-gateway, actor user with userId matching the actor. Any organization
        claim is ignored for this account-scoped operation.
      tags: [users]
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: Key scoped to the verified actor and image owner.
          schema: { type: string, minLength: 1, maxLength: 255 }
      x-cadenway-strict-body: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../../components/profile-media.yaml#/components/schemas/StartAvatarUpload'
            example: { contentType: image/webp, sizeBytes: 43024 }
      responses:
        '201':
          description: The current owner reservation.
          headers:
            Location:
              required: true
              description: Path of the owner reservation.
              schema:
                type: string
                examples:
                  [
                    /internal/v1/users/019a5f3c-8d2e-7c4a-9b1f-3e5d7a9c1b30/avatar/uploads/019a7003-4d5e-7f6a-8b9c-0d1e2f3a4b01,
                  ]
          content:
            application/json:
              schema:
                $ref: '../../components/profile-media.yaml#/components/schemas/ProfileMediaReservation'
              example:
                {
                  uploadId: 019a7003-4d5e-7f6a-8b9c-0d1e2f3a4b01,
                  expiresAt: '2026-11-08T08:10:00Z',
                }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InternalTokenRefused'
        '403':
          $ref: '#/components/responses/InternalAccessRefused'
        '404':
          $ref: '#/components/responses/UserNotFound'
        '409':
          $ref: '#/components/responses/ProfileMediaReservationConflict'
        '422':
          $ref: '#/components/responses/ProfileMediaReservationRefused'
  /internal/v1/users/{userId}/avatar/uploads/{uploadId}:
    parameters:
      - name: userId
        in: path
        required: true
        description: Account id.
        schema:
          type: string
          format: uuid
          examples: [019a5f3c-8d2e-7c4a-9b1f-3e5d7a9c1b30]
      - name: uploadId
        in: path
        required: true
        description: Opaque id allocated by the owning service.
        schema:
          $ref: '../../components/profile-media.yaml#/components/schemas/ProfileMediaId'
    get:
      operationId: getAvatarUploadStateInternal
      summary: Read account avatar upload state
      description: |
        Checks that the caller owns the reservation and returns whether it is pending or already
        committed. An expired or superseded pending upload is refused. The gateway checks this before
        asking Storage to prepare the pending upload. A committed replay skips preparation and cannot
        reactivate a prior image. Internal token issuer api-gateway, actor user with userId matching the actor. Any organization
        claim is ignored for this account-scoped operation.
      tags: [users]
      responses:
        '200':
          description: State of the caller’s reservation.
          content:
            application/json:
              schema:
                $ref: '../../components/profile-media.yaml#/components/schemas/ProfileMediaReservationState'
              example:
                {
                  uploadId: 019a7003-4d5e-7f6a-8b9c-0d1e2f3a4b01,
                  state: pending,
                  expiresAt: '2026-11-08T08:10:00Z',
                }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InternalTokenRefused'
        '403':
          $ref: '#/components/responses/InternalAccessRefused'
        '404':
          $ref: '#/components/responses/AvatarOwnerOrUploadNotFound'
        '409':
          $ref: '#/components/responses/ProfileMediaUploadStateConflict'
  /internal/v1/users/{userId}/avatar:
    parameters:
      - name: userId
        in: path
        required: true
        description: Account id.
        schema:
          type: string
          format: uuid
          examples: [019a5f3c-8d2e-7c4a-9b1f-3e5d7a9c1b30]
    put:
      operationId: setAvatarInternal
      summary: Publish the prepared avatar
      description: |
        The gateway calls this operation for a pending reservation only after Storage confirms
        preparation for the same id and actor. Identity locks the account and reservation, checks the
        scope, generation and expiry again, and changes the reference and appends
        `user.avatar-changed.v1` in the same transaction. A committed replay is a no-op and returns
        the current ETag. A stale optional If-Match on first publication is refused.
        Internal token issuer api-gateway, actor user with userId matching the actor. Any organization
        claim is ignored for this account-scoped operation.
      tags: [users]
      parameters:
        - name: If-Match
          in: header
          required: false
          description: Strong ETag of the current account or organization.
          schema:
            type: string
            pattern: '^"[1-9][0-9]*"$'
            examples: ['"7"']
      x-cadenway-strict-body: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../../components/profile-media.yaml#/components/schemas/SetProfileMedia'
            example: { uploadId: 019a7003-4d5e-7f6a-8b9c-0d1e2f3a4b01 }
      responses:
        '204':
          description: The avatar was set or the reservation was already committed.
          headers:
            ETag:
              required: true
              description: Strong ETag of the current account or organization.
              schema: { type: string, examples: ['"8"'] }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InternalTokenRefused'
        '403':
          $ref: '#/components/responses/InternalAccessRefused'
        '404':
          $ref: '#/components/responses/AvatarOwnerOrUploadNotFound'
        '409':
          $ref: '#/components/responses/ProfileMediaUploadStateConflict'
        '412':
          $ref: '#/components/responses/VersionMismatch'
    delete:
      operationId: deleteAvatarInternal
      summary: Clear the account avatar
      description: |
        Clears the reference and invalidates older pending uploads under the same lock as publication.
        An actual reference change commits with `user.avatar-changed.v1`. An absent image leaves the
        account version unchanged and emits no avatar change. Internal token issuer api-gateway, actor user with userId matching the actor. Any organization
        claim is ignored for this account-scoped operation.
      tags: [users]
      parameters:
        - name: If-Match
          in: header
          required: false
          description: Strong ETag of the current account or organization.
          schema:
            type: string
            pattern: '^"[1-9][0-9]*"$'
            examples: ['"7"']
      responses:
        '204':
          description: The account no longer has an avatar.
          headers:
            ETag:
              required: true
              description: Strong ETag of the current account or organization.
              schema: { type: string, examples: ['"8"'] }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InternalTokenRefused'
        '403':
          $ref: '#/components/responses/InternalAccessRefused'
        '404':
          $ref: '#/components/responses/UserNotFound'
        '412':
          $ref: '#/components/responses/VersionMismatch'
  /internal/v1/users/{userId}/avatar-reference:
    parameters:
      - name: userId
        in: path
        required: true
        description: Account id.
        schema:
          type: string
          format: uuid
          examples: [019a5f3c-8d2e-7c4a-9b1f-3e5d7a9c1b30]
    get:
      operationId: getAvatarReferenceInternal
      summary: Read the active avatar reference
      description: |
        Returns only the current opaque image id or null, never a profile or storage capability.
        For a self read, the verified actor matches userId, with any organization ignored. For a
        different userId an organization is mandatory, and the API gateway must have just confirmed
        both caller and target access through the current member lookup in the token organization.
        The requested userId is the one returned by that lookup. Issuer api-gateway and actor user only.
      tags: [users]
      responses:
        '200':
          description: The current account avatar reference.
          content:
            application/json:
              schema:
                $ref: '../../components/profile-media.yaml#/components/schemas/CurrentAvatarReference'
              example: { assetId: 019a7003-4d5e-7f6a-8b9c-0d1e2f3a4b01 }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InternalTokenRefused'
        '403':
          $ref: '#/components/responses/InternalAccessRefused'
        '404':
          $ref: '#/components/responses/UserNotFound'
  /internal/v1/users/{userId}:
    get:
      operationId: getUser
      summary: Read a user
      description: |
        Returns an account. A user actor reads its own account only: another id, or an unknown one,
        answers `404 user.not-found`. Internal token: actor `user`, no organization.
      tags: [users]
      parameters:
        - name: userId
          in: path
          required: true
          description: Id of the account.
          schema:
            type: string
            format: uuid
            examples: [019a5f3c-8d2e-7c4a-9b1f-3e5d7a9c1b30]
      responses:
        '200':
          description: The account.
          headers:
            ETag:
              description: Version of the account, `"<version>"`.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              examples:
                camilleMartin:
                  $ref: '#/components/examples/CamilleMartin'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InternalTokenRefused'
        '403':
          $ref: '#/components/responses/InternalAccessRefused'
        '404':
          $ref: '#/components/responses/UserNotFound'
    patch:
      operationId: updateUser
      summary: Update the profile of a user
      description: |
        Applies a JSON Merge Patch to the profile of the account of the actor, as
        `PATCH /v1/me` says: another id, or an unknown one, answers `404 user.not-found`; a time
        zone that is not an IANA name answers `400 request.invalid`; `If-Match` is optional
        (`412 request.version-mismatch`). Emits `user.profile-updated.v1` when something changed.
        Internal token: actor `user`, no organization.
      tags: [users]
      parameters:
        - name: userId
          in: path
          required: true
          description: Id of the account, the actor.
          schema:
            type: string
            format: uuid
            examples: [019a5f3c-8d2e-7c4a-9b1f-3e5d7a9c1b30]
        - name: If-Match
          in: header
          required: false
          description: '`"<version>"` the change was made from.'
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfilePatch'
            example:
              displayName: camille
              jobTitle: Responsable produit
              timeZone: Europe/Paris
      responses:
        '200':
          description: The account after the change.
          headers:
            ETag:
              description: Version of the account, `"<version>"`.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              examples:
                camilleMartin:
                  $ref: '#/components/examples/CamilleMartin'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InternalTokenRefused'
        '403':
          $ref: '#/components/responses/InternalAccessRefused'
        '404':
          $ref: '#/components/responses/UserNotFound'
        '412':
          $ref: '#/components/responses/VersionMismatch'
  /internal/v1/sessions/{sessionId}/organization:
    put:
      operationId: switchSessionOrganization
      summary: Choose the current organization of a session
      description: |
        Makes an organization the current organization of a session of the actor, and the one the
        next sessions of the actor start in. The membership is checked against the copy of the
        memberships: an organization the actor does not belong to, or one whose
        `member.joined.v1` has not arrived yet, answers `404 organization.not-found`. A session of
        another user, or an unknown id, answers `404 session.not-found`, which the gateway answers
        as `401 auth.session-expired`: the session ended since its introspection. Choosing the
        current organization of the session again answers `200` and leaves the session as it is,
        but records the organization as the last choice of the actor again, the one their next
        sessions start in, also when another session of theirs chose another organization since.
        From the next introspection the session carries the organization and the role.

        An organization whose authentication policy requires two-step verification for the role of
        the actor in it, while the account has none, answers `403 organization.mfa-required` with
        `details.organizationId`, and the session and the last choice stay as they were: the
        person sets two-step verification up, then chooses again. Checked once the membership is
        found.

        The inactivity of the session counts against the policy of the organization chosen: a
        session that had been idle, before this request, for longer than that policy allows is
        closed instead, and answers `404 session.not-found`, so that choosing an organization never
        revives a session its own policy would have closed. Internal token: actor `user`, no
        organization.
      tags: [sessions]
      parameters:
        - name: sessionId
          in: path
          required: true
          description: Id of the session, as the introspection returned it.
          schema:
            type: string
            format: uuid
            examples: [019a6a2e-4b1c-7d3e-8f5a-2c9b7e1d4a60]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationChoice'
            example:
              organizationId: 019a5f3c-8d2e-7c4a-9b1f-3e5d7a9c1b2f
      responses:
        '200':
          description: The session acts on this organization.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionOrganization'
              example:
                organizationId: 019a5f3c-8d2e-7c4a-9b1f-3e5d7a9c1b2f
                role: owner
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InternalTokenRefused'
        '403':
          $ref: '#/components/responses/OrganizationChoiceRefused'
        '404':
          $ref: '#/components/responses/SessionOrOrganizationNotFound'
  /internal/v1/auth/password-reset:
    post:
      operationId: requestPasswordResetInternal
      summary: Issue a password reset link
      description: |
        Issues a reset link (`password-reset-link.issued.v1`, restricted) when a verified account
        uses the address, and makes the previous link of the account stop working; answers `202`
        the same way otherwise, an unverified account included, without a difference of time an
        observer could measure. The link works once, for 30 minutes, from any browser.
        An authenticated password change invalidates any open reset link. Throttled per address, account or not, apart from the codes: 45 seconds between two requests and at
        most 5 in an hour (`ResetThrottled`). The `client` is the browser that asked, shown in the
        email. Internal token: actor `anonymous`, no organization.
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
            example:
              email: camille.martin@ateliernord.fr
              client:
                ipAddress: 192.0.2.14
                userAgent: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:132.0) Gecko/20100101 Firefox/132.0
      responses:
        '202':
          description: Accepted, whether or not a link was issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordResetLinkSent'
              example:
                email: camille.martin@ateliernord.fr
                expiresAt: '2026-11-09T13:40:00Z'
                resendAvailableAt: '2026-11-09T13:10:45Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InternalTokenRefused'
        '403':
          $ref: '#/components/responses/InternalAccessRefused'
        '429':
          $ref: '#/components/responses/ResetThrottled'
  /internal/v1/auth/password-reset/inspection:
    post:
      operationId: inspectPasswordResetLinkInternal
      summary: Read the account of a password reset link
      description: |
        Returns the address of the account of a usable link, when it expires and how many open
        sessions the account has, without using the link. A link that expired, was used, was
        replaced, was invalidated by a password or address change, or is unknown answers
        `422 auth.reset-link-expired`. A malformed token also returns that error.
        Internal token: actor `anonymous`, no organization.
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetToken'
            example:
              token: ExampleOnlyResetToken0000000000000000000000
      responses:
        '200':
          description: The link works; the account it is for.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordResetLink'
              example:
                email: camille.martin@ateliernord.fr
                expiresAt: '2026-11-09T13:40:00Z'
                sessionCount: 3
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InternalTokenRefused'
        '403':
          $ref: '#/components/responses/InternalAccessRefused'
        '422':
          $ref: '#/components/responses/ResetLinkExpired'
  /internal/v1/auth/password-reset/confirmation:
    post:
      operationId: confirmPasswordResetInternal
      summary: Set a new password with a reset link
      description: |
        Sets the new password of the account of the link and uses the link up, as
        `POST /v1/auth/password-reset/confirmation` says. Never opens a session.

        - The link first: `422 auth.reset-link-expired`, including after an authenticated
          password change. Then the new password:
          `422 auth.password-too-short` or `422 auth.password-compromised`, which leave the link
          usable.
        - `closeOtherSessions` (`true` by default) revokes every open session of the account, each
          with `session.revoked.v1`.
        - Ends the lockout of the password sign-in of the address, drops a pending change of
          address, ends the recent authentication of the sessions it leaves open, voids the open
          challenge and every pending two-step setup and key registration of the account, and
          forgets every trusted device of the account; keeps the personal API tokens and the two-step
          verification; does not cancel a scheduled deletion.

        Emits `user.password-changed.v1` with `method: reset`, the number of closed sessions and
        the device of the `client`. Internal token: actor `anonymous`, no organization.
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmation'
            example:
              token: ExampleOnlyResetToken0000000000000000000000
              newPassword: nord-atelier-sprint-15
              closeOtherSessions: true
              client:
                ipAddress: 192.0.2.14
                userAgent: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:132.0) Gecko/20100101 Firefox/132.0
      responses:
        '200':
          description: The password is changed; no session is opened.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordResetCompleted'
              example:
                email: camille.martin@ateliernord.fr
                closedSessionCount: 3
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InternalTokenRefused'
        '403':
          $ref: '#/components/responses/InternalAccessRefused'
        '422':
          $ref: '#/components/responses/PasswordResetRefused'
  /internal/v1/sessions/{sessionId}/reauthentication:
    post:
      operationId: reauthenticateInternal
      summary: Confirm who the person of a session is
      description: |
        Checks the password of an actor without two-step verification, or the `code` of the
        authenticator app of an actor with it, and records a recent authentication of the session,
        which opens the 10-minute window of the guarded routes. Both or neither answer
        `400 request.invalid`; a `password` for an account with two-step verification answers
        `403 auth.reauthentication-required` with `details.methods: [authenticator-app]`, without
        checking or counting the password; a `code` for an account without an authenticator app
        answers `409 auth.two-step-not-enabled`. A wrong password answers
        `422 auth.password-incorrect` and counts with the failed sign-ins of the address
        (`429 auth.account-locked` once locked); a wrong or used code answers
        `422 auth.two-step-code-invalid` and counts with the wrong answers of the two-step
        challenges of the account (`429 auth.two-step-locked` once locked); the session stays open
        either way. A session of another user, an unknown or an ended one, answers
        `404 session.not-found`. Internal token: actor `user`, no organization.
      tags: [sessions]
      parameters:
        - $ref: '#/components/parameters/SessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReauthenticationRequest'
            examples:
              password:
                summary: With the password
                value:
                  password: atelier-nord-sprint-14
              authenticatorApp:
                summary: With a code of the authenticator app
                value:
                  code: '261845'
      responses:
        '200':
          description: The password or the code is right; the window of recent authentication.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecentAuthentication'
              example:
                authenticatedAt: '2026-11-09T13:12:00Z'
                expiresAt: '2026-11-09T13:22:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InternalTokenRefused'
        '403':
          $ref: '#/components/responses/RecentAuthenticationRequired'
        '404':
          $ref: '#/components/responses/SessionNotFound'
        '409':
          $ref: '#/components/responses/TwoStepNotEnabled'
        '422':
          $ref: '#/components/responses/PasswordRefused'
        '429':
          $ref: '#/components/responses/AccountLocked'
  /internal/v1/sessions/{sessionId}/revoke-others:
    post:
      operationId: revokeOtherSessionsInternal
      summary: Revoke every other session of the actor
      description: |
        Revokes every open session of the actor except `sessionId`, each with
        `session.revoked.v1`, and says how many, and forgets every trusted device of the account,
        the one of `sessionId` included. The personal API tokens stay. A session of another
        user, an unknown or an ended one, answers `404 session.not-found` and revokes nothing.
        Internal token: actor `user`, no organization.
      tags: [sessions]
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: The other sessions are revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevokedSessions'
              example:
                revokedCount: 2
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InternalTokenRefused'
        '403':
          $ref: '#/components/responses/InternalAccessRefused'
        '404':
          $ref: '#/components/responses/SessionNotFound'
  /internal/v1/users/{userId}/notification-recipient:
    get:
      operationId: getNotificationRecipientInternal
      summary: Read the current recipient of a notification email
      description: |
        Returns one account's current verified email address, language, IANA time zone and version
        from the same account read. A missing account, an unverified current address or an account
        scheduled for deletion has the same `404 user.not-found` response as a deleted account.
        The address of a pending email change becomes eligible only after its confirmation.

        Only a Notification delivery job calls this operation. The internal token has issuer
        `notification-service`, audience `identity-service` and actor `system`, with no
        organization, role or scopes. The path uses the user ID from the job's authorized
        recipient and takes no query parameters or body. The lookup does not authorize access
        to organization content. Notification applies its own preferences and verifies current
        access before sending content from an organization.

        Resolve the profile when deciding the schedule and before attempting delivery. A
        response is current at the time of the read. Do not cache the response or persist its
        address in a job payload. Keep the address out of application logs, telemetry, problems
        and events. This operation emits no event and has no public route.
      tags: [users]
      parameters:
        - name: userId
          in: path
          required: true
          description: Account id of the authorized recipient already carried by the Notification job.
          schema:
            type: string
            format: uuid
            examples: [019a5f3c-8d2e-7c4a-9b1f-3e5d7a9c1b30]
      responses:
        '200':
          description: The current verified recipient profile.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NotificationRecipientNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationRecipient'
              example:
                email: camille.martin@ateliernord.fr
                language: fr
                timeZone: Europe/Paris
                version: 3
        '400':
          description: '`request.invalid` for malformed request input.'
          headers:
            Cache-Control:
              $ref: '#/components/headers/NotificationRecipientNoStore'
          content:
            application/problem+json:
              schema:
                $ref: '../../components/http.yaml#/components/schemas/Problem'
        '401':
          description: '`auth.token-missing` or `auth.token-invalid`.'
          headers:
            Cache-Control:
              $ref: '#/components/headers/NotificationRecipientNoStore'
          content:
            application/problem+json:
              schema:
                $ref: '../../components/http.yaml#/components/schemas/Problem'
        '403':
          description: |
            `auth.issuer-not-allowed` for a different issuer, or `auth.actor-not-allowed` for a
            different actor type or a token carrying an organization, role or scopes.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NotificationRecipientNoStore'
          content:
            application/problem+json:
              schema:
                $ref: '../../components/http.yaml#/components/schemas/Problem'
        '404':
          description: '`user.not-found` when no current deliverable recipient exists for the account.'
          headers:
            Cache-Control:
              $ref: '#/components/headers/NotificationRecipientNoStore'
          content:
            application/problem+json:
              schema:
                $ref: '../../components/http.yaml#/components/schemas/Problem'
              example:
                { type: 'about:blank', title: 'Not Found', status: 404, code: user.not-found }
        '503':
          description: '`upstream.unavailable` when Identity cannot read the account state.'
          headers:
            Cache-Control:
              $ref: '#/components/headers/NotificationRecipientNoStore'
          content:
            application/problem+json:
              schema:
                $ref: '../../components/http.yaml#/components/schemas/Problem'
              example:
                {
                  type: 'about:blank',
                  title: 'Service Unavailable',
                  status: 503,
                  code: upstream.unavailable,
                }
  /internal/v1/users/{userId}/verified-email:
    get:
      operationId: getVerifiedEmailInternal
      summary: Read the current verified address for invitation authorization
      description: |
        Returns the account's current verified email address. A missing account, an unverified
        current address or an account scheduled for deletion answers `404 user.not-found`.
        A pending email change does not change the result until confirmation.

        Organization is the only caller. Its internal token has issuer `organization-service`,
        audience `identity-service` and actor `{ type: 'system', id: 'organization-service' }`,
        with no organization, role or scopes. The path must use the authenticated actor's account
        ID from the invitation operation. This operation takes no query parameters or body.

        Organization uses the result for the current invitation operation only, refuses the
        operation if verification is unavailable and keeps the address out of logs, traces,
        problems and public responses. No result is cached. This operation emits no event.
      tags: [users]
      parameters:
        - name: userId
          in: path
          required: true
          description: The authenticated actor's account ID in the invitation operation.
          schema:
            type: string
            format: uuid
            examples: [019a5f3c-8d2e-7c4a-9b1f-3e5d7a9c1b30]
      responses:
        '200':
          description: The verified address at the time of the read.
          headers:
            Cache-Control:
              $ref: '#/components/headers/VerifiedEmailNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifiedEmail'
              example:
                email: camille.martin@ateliernord.fr
        '400':
          description: '`request.invalid` for malformed request input.'
          headers:
            Cache-Control:
              $ref: '#/components/headers/VerifiedEmailNoStore'
          content:
            application/problem+json:
              schema:
                $ref: '../../components/http.yaml#/components/schemas/Problem'
        '401':
          description: '`auth.token-missing` or `auth.token-invalid`.'
          headers:
            Cache-Control:
              $ref: '#/components/headers/VerifiedEmailNoStore'
          content:
            application/problem+json:
              schema:
                $ref: '../../components/http.yaml#/components/schemas/Problem'
        '403':
          description: |
            `auth.issuer-not-allowed` for another issuer or `auth.actor-not-allowed` for another
            actor type or ID, or for a token carrying an organization, role or scopes.
          headers:
            Cache-Control:
              $ref: '#/components/headers/VerifiedEmailNoStore'
          content:
            application/problem+json:
              schema:
                $ref: '../../components/http.yaml#/components/schemas/Problem'
        '404':
          description: '`user.not-found` when the account has no current verified address to return.'
          headers:
            Cache-Control:
              $ref: '#/components/headers/VerifiedEmailNoStore'
          content:
            application/problem+json:
              schema:
                $ref: '../../components/http.yaml#/components/schemas/Problem'
              example:
                type: about:blank
                title: Not Found
                status: 404
                code: user.not-found
        '503':
          description: '`upstream.unavailable` when Identity cannot read the account state.'
          headers:
            Cache-Control:
              $ref: '#/components/headers/VerifiedEmailNoStore'
          content:
            application/problem+json:
              schema:
                $ref: '../../components/http.yaml#/components/schemas/Problem'
              example:
                type: about:blank
                title: Service Unavailable
                status: 503
                code: upstream.unavailable
  /internal/v1/users/{userId}/sessions:
    get:
      operationId: listUserSessionsInternal
      summary: List the open sessions of a user
      description: |
        Lists the open sessions of the actor, sorted by sign-in, the most recent first, then by
        id, marks `currentSessionId` as `current`, and gives each the inactivity of the policy of
        its current organization (`inactivityTimeoutMinutes`). Another user id, or an unknown one,
        answers `404 user.not-found`; a `currentSessionId` that is not an open session of the actor
        answers `404 session.not-found`. Internal token: actor `user`, no organization.
      tags: [sessions]
      parameters:
        - $ref: '#/components/parameters/UserId'
        - name: currentSessionId
          in: query
          required: true
          description: The session of the public request, as the introspection returned it.
          schema:
            type: string
            format: uuid
            examples: [019a6a2e-4b1c-7d3e-8f5a-2c9b7e1d4a60]
        - $ref: '../../components/http.yaml#/components/parameters/Cursor'
        - $ref: '../../components/http.yaml#/components/parameters/Limit'
      responses:
        '200':
          description: One page of the open sessions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenSessionPage'
              example:
                items:
                  - id: 019a6a2e-4b1c-7d3e-8f5a-2c9b7e1d4a60
                    current: true
                    device:
                      type: desktop
                      browser: Firefox
                      browserVersion: '132'
                      os: Windows
                      osVersion: null
                    ipAddress: 192.0.2.14
                    signedInAt: '2026-11-09T07:58:00Z'
                    lastActiveAt: '2026-11-09T13:24:00Z'
                    expiresAt: '2026-12-09T07:58:00Z'
                    inactivityTimeoutMinutes: 720
                  - id: 019a6914-2f7a-7b3c-9d4e-5f6a7b8c9d01
                    current: false
                    device:
                      type: mobile
                      browser: Safari
                      browserVersion: '18'
                      os: iOS
                      osVersion: '18.1'
                    ipAddress: 86.247.12.30
                    signedInAt: '2026-11-09T07:42:00Z'
                    lastActiveAt: '2026-11-09T11:20:00Z'
                    expiresAt: '2026-12-09T07:42:00Z'
                    inactivityTimeoutMinutes: 720
                nextCursor: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InternalTokenRefused'
        '403':
          $ref: '#/components/responses/InternalAccessRefused'
        '404':
          $ref: '#/components/responses/UserOrSessionNotFound'
  /internal/v1/users/{userId}/password:
    put:
      operationId: changePasswordInternal
      summary: Change the password of a user
      description: |
        Replaces the password of the actor, as `PUT /v1/me/password` says: the new password is
        checked first (`422 auth.password-too-short`, `422 auth.password-compromised`), without
        counting an attempt; then, for an account with two-step verification only, a recent
        two-step proof of `sessionId` (`403 auth.reauthentication-required` with
        `details.methods: [authenticator-app]`, before the current password is checked or
        counted); then the current one, always required (`422 auth.password-incorrect`, counted
        with the failed sign-ins; `429 auth.account-locked`). For an account without two-step
        verification, a right current password records a recent authentication of `sessionId`;
        for an account with it, it records none. Every session stays open, but a pending change of
        address is dropped and any open password reset link is invalidated in the same
        transaction. The recent authentication of the other sessions ends with their
        pending two-step setups and key registrations, the open challenge of the account is voided,
        and every trusted device of the account is forgotten. Answers the account with
        the next `version` and its `passwordChangedAt`, and emits `user.password-changed.v1` with
        `method: change`, no closed session and the device of the `client`. Another user id, or an
        unknown one, answers `404 user.not-found`; a `sessionId` that is not an open session of the
        actor, `404 session.not-found`. Internal token: actor `user`, no organization.
      tags: [users]
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChange'
            example:
              sessionId: 019a6a2e-4b1c-7d3e-8f5a-2c9b7e1d4a60
              currentPassword: atelier-nord-sprint-14
              newPassword: nord-atelier-sprint-15
              client:
                ipAddress: 192.0.2.14
                userAgent: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:132.0) Gecko/20100101 Firefox/132.0
      responses:
        '200':
          description: The account after the change.
          headers:
            ETag:
              description: Version of the account, `"<version>"`.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              example:
                id: 019a5f3c-8d2e-7c4a-9b1f-3e5d7a9c1b30
                name: Camille Martin
                email: camille.martin@ateliernord.fr
                language: fr
                displayName: camille
                jobTitle: Responsable produit
                timeZone: Europe/Paris
                passwordChangedAt: '2026-11-09T13:16:00Z'
                version: 4
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InternalTokenRefused'
        '403':
          $ref: '#/components/responses/RecentAuthenticationRequired'
        '404':
          $ref: '#/components/responses/UserOrSessionNotFound'
        '422':
          $ref: '#/components/responses/PasswordChangeRefused'
        '429':
          $ref: '#/components/responses/AccountLocked'
  /internal/v1/users/{userId}/email-change:
    post:
      operationId: requestEmailChangeInternal
      summary: Ask to change the address of a user
      description: |
        Records a pending change of address of the actor and issues an `email-change` code to the
        new address (`one-time-code.issued.v1`, 15 minutes); a new request replaces the pending
        change and its code. The pending change belongs to `sessionId`: the end or the revocation of
        that session, and a change or a reset of the password, drop it. The checks run in this
        order: recent authentication of `sessionId` (`403 auth.reauthentication-required`), the
        current address (`422 auth.email-unchanged`), a verified account of the new address
        (`409 auth.email-taken`; an unverified sign-up does not count), then the throttle of the
        code requests of the new address (`429 auth.code-throttled`). Another user id, or an
        unknown one, answers
        `404 user.not-found`; a `sessionId` that is not an open session of the actor,
        `404 session.not-found`. Internal token: actor `user`, no organization.
      tags: [users]
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailChangeRequest'
            example:
              sessionId: 019a6a2e-4b1c-7d3e-8f5a-2c9b7e1d4a60
              email: camille@ateliernord.fr
      responses:
        '202':
          description: The code is issued to the new address.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailChangeCodeSent'
              example:
                email: camille@ateliernord.fr
                expiresAt: '2026-11-09T13:35:00Z'
                resendAvailableAt: '2026-11-09T13:20:30Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InternalTokenRefused'
        '403':
          $ref: '#/components/responses/RecentAuthenticationRequired'
        '404':
          $ref: '#/components/responses/UserOrSessionNotFound'
        '409':
          $ref: '#/components/responses/EmailTaken'
        '422':
          $ref: '#/components/responses/EmailUnchanged'
        '429':
          $ref: '#/components/responses/CodeThrottled'
  /internal/v1/users/{userId}/email-change/confirmation:
    post:
      operationId: confirmEmailChangeInternal
      summary: Confirm the new address of a user
      description: |
        Checks the `email-change` code of the pending change of the actor and makes the new
        address the address of the account, verified. Without a pending change of `sessionId` (the
        session that asked for it), or with a wrong code: `422 auth.code-invalid`; a code no longer usable: `422 auth.code-expired`; a new
        address a verified account took since the request: `409 auth.email-taken`, and the change
        is dropped. Recent authentication is not required again. The codes and the reset link
        issued to the previous address stop working, an unverified sign-up of the new address
        ends, and the sessions and personal API tokens stay. Answers the account with the next
        `version`, and emits `user.email-changed.v1` with the device of the `client`. Another user
        id, or an unknown one, answers `404 user.not-found`; a `sessionId` that is not an open
        session of the actor, `404 session.not-found`. Internal token: actor `user`, no
        organization.
      tags: [users]
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailChangeConfirmation'
            example:
              sessionId: 019a6a2e-4b1c-7d3e-8f5a-2c9b7e1d4a60
              code: '731406'
              client:
                ipAddress: 192.0.2.14
                userAgent: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:132.0) Gecko/20100101 Firefox/132.0
      responses:
        '200':
          description: The account, with its new address.
          headers:
            ETag:
              description: Version of the account, `"<version>"`.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              example:
                id: 019a5f3c-8d2e-7c4a-9b1f-3e5d7a9c1b30
                name: Camille Martin
                email: camille@ateliernord.fr
                language: fr
                displayName: camille
                jobTitle: Responsable produit
                timeZone: Europe/Paris
                passwordChangedAt: '2026-11-09T13:16:00Z'
                version: 5
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InternalTokenRefused'
        '403':
          $ref: '#/components/responses/InternalAccessRefused'
        '404':
          $ref: '#/components/responses/UserOrSessionNotFound'
        '409':
          $ref: '#/components/responses/EmailTaken'
        '422':
          $ref: '#/components/responses/EmailChangeCodeRefused'
  /internal/v1/users/{userId}/deletion:
    post:
      operationId: scheduleAccountDeletionInternal
      summary: Schedule the deletion of a user
      description: |
        Schedules the deletion of the account of the actor in 30 days, as `POST /v1/me/deletion`
        says. The checks run in this order: an organization the actor owns in the copy of the
        memberships (`409 account.organization-owner`, with `details.organizationIds`), then the
        recent authentication of `sessionId` (`403 auth.reauthentication-required`).

        On success, in the same transaction: every session of the account, `sessionId` included,
        is revoked (`session.revoked.v1` each), every personal API token is revoked, every trusted
        device is forgotten, a pending change of address is dropped, and
        `user.deletion-scheduled.v1` is emitted. The two-step verification stays. The gateway
        then clears the session cookie. A sign-in before `deleteAt` cancels the deletion. Once
        the deadline is reached, Identity durably claims a deletion attempt and asks
        organization-service to reserve the account for that attempt. An account that still owns
        an organization stays scheduled until it no longer owns one or signs in. Identity only
        deletes the account and emits `user.deleted.v1` after Organization confirms the same
        reservation. Identity retries a temporary failure with the same attempt ID. Another user
        ID, or an unknown one, answers `404 user.not-found`; a `sessionId` that is not an open
        session of the actor answers
        `404 session.not-found`. Internal token: actor `user`, no organization.
      tags: [users]
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeletionRequest'
            example:
              sessionId: 019a6a2e-4b1c-7d3e-8f5a-2c9b7e1d4a60
      responses:
        '202':
          description: The deletion is scheduled; the sessions and tokens of the account are revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletionScheduled'
              example:
                deleteAt: '2026-12-09T15:30:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InternalTokenRefused'
        '403':
          $ref: '#/components/responses/RecentAuthenticationRequired'
        '404':
          $ref: '#/components/responses/UserOrSessionNotFound'
        '409':
          $ref: '#/components/responses/OrganizationOwner'
  /internal/v1/users/{userId}/two-step-verification:
    get:
      operationId: getTwoStepVerificationInternal
      summary: Read the two-step verification of a user
      description: |
        Returns the two-step verification of the account of the actor, as
        `GET /v1/me/two-step-verification` says, with `requiredBy` from the copy of the memberships
        and the authentication policies. Never returns a secret. Another user id, or an unknown
        one, answers `404 user.not-found`. Internal token: actor `user`, no organization.
      tags: [two-step-verification]
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: The two-step verification of the account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TwoStepVerification'
              examples:
                enabled:
                  $ref: '#/components/examples/TwoStepVerificationEnabled'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InternalTokenRefused'
        '403':
          $ref: '#/components/responses/InternalAccessRefused'
        '404':
          $ref: '#/components/responses/UserNotFound'
  /internal/v1/users/{userId}/two-step-verification/disable:
    post:
      operationId: disableTwoStepVerificationInternal
      summary: Turn the two-step verification of a user off
      description: |
        Turns the two-step verification of the actor off, as `DELETE /v1/me/two-step-verification`
        says. The checks run in this order: an organization of the copy of the memberships whose
        policy requires it for the role of the actor (`409 auth.mfa-required-by-organization`, with
        `details.organizationIds`), then the recent authentication of `sessionId`
        (`403 auth.reauthentication-required`). On success, in one transaction, the authenticator
        app, the security keys, the backup codes, the pending setups and the trusted devices of the
        account are deleted, and `user.two-step-verification-changed.v1` (`change: disabled`) is
        emitted with the device of the `client`. Already off: `204`, nothing emitted. Another user
        id, or an unknown one, answers `404 user.not-found`; a `sessionId` that is not an open
        session of the actor, `404 session.not-found`. Internal token: actor `user`, no
        organization.
      tags: [two-step-verification]
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TwoStepChange'
            example:
              sessionId: 019a6a2e-4b1c-7d3e-8f5a-2c9b7e1d4a60
              client:
                ipAddress: 192.0.2.14
                userAgent: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:132.0) Gecko/20100101 Firefox/132.0
      responses:
        '204':
          description: Two-step verification is off.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InternalTokenRefused'
        '403':
          $ref: '#/components/responses/RecentAuthenticationRequired'
        '404':
          $ref: '#/components/responses/UserOrSessionNotFound'
        '409':
          $ref: '#/components/responses/MfaRequiredByOrganization'
  /internal/v1/users/{userId}/two-step-verification/authenticator-app/setup:
    post:
      operationId: startAuthenticatorAppSetupInternal
      summary: Start setting up the authenticator app of a user
      description: |
        Requires the recent authentication of `sessionId` (`403 auth.reauthentication-required`),
        then records a pending setup of the actor for that session, valid 15 minutes, with a new
        TOTP secret of 160 random bits from `node:crypto`, kept encrypted, and returns the secret
        and its `otpauth://` URI once. A new start replaces the pending setup. Nothing else changes
        until the confirmation; the current app, if any, keeps working. Another user id, or an
        unknown one, answers `404 user.not-found`; a `sessionId` that is not an open session of the
        actor, `404 session.not-found`. Internal token: actor `user`, no organization.
      tags: [two-step-verification]
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionReference'
            example:
              sessionId: 019a6a2e-4b1c-7d3e-8f5a-2c9b7e1d4a60
      responses:
        '200':
          description: The secret of the new app, returned once.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticatorAppSetup'
              example:
                secret: JBSWY3DPEHPK3PXPJBSWY3DPEHPK3PXP
                otpauthUri: otpauth://totp/Cadenway:camille.martin%40ateliernord.fr?secret=JBSWY3DPEHPK3PXPJBSWY3DPEHPK3PXP&issuer=Cadenway&algorithm=SHA1&digits=6&period=30
                expiresAt: '2026-11-09T13:35:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InternalTokenRefused'
        '403':
          $ref: '#/components/responses/RecentAuthenticationRequired'
        '404':
          $ref: '#/components/responses/UserOrSessionNotFound'
  /internal/v1/users/{userId}/two-step-verification/authenticator-app/setup/confirmation:
    post:
      operationId: confirmAuthenticatorAppSetupInternal
      summary: Confirm the authenticator app of a user
      description: |
        Checks `code` against the secret of the pending setup of `sessionId` and, in one
        transaction, makes it the authenticator app of the actor and ends the pending setup. When
        two-step verification was off, it turns on with 10 new backup codes, returned once and
        kept as HMAC-SHA-256 under a key derived from the pepper (`change: enabled`); otherwise
        the new app replaces the previous one and the backup codes stay (`backupCodes: null`,
        `change: authenticator-app-replaced`). The right code records a recent two-step
        authentication of `sessionId`, and turning two-step verification on ends the recent
        authentication other sessions of the actor opened with a password. Emits
        `user.two-step-verification-changed.v1` with the device of the `client`. No pending setup
        of `sessionId`, or an expired one: `422 auth.two-step-setup-expired`; a wrong code:
        `422 auth.two-step-code-invalid`, without a count. Recent authentication is not required
        again. Another user id, or an unknown one, answers `404 user.not-found`; a `sessionId` that
        is not an open session of the actor, `404 session.not-found`. Internal token: actor `user`,
        no organization.
      tags: [two-step-verification]
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthenticatorAppConfirmation'
            example:
              sessionId: 019a6a2e-4b1c-7d3e-8f5a-2c9b7e1d4a60
              code: '261845'
              client:
                ipAddress: 192.0.2.14
                userAgent: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:132.0) Gecko/20100101 Firefox/132.0
      responses:
        '200':
          description: The app is the authenticator app of the account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticatorAppConfigured'
              example:
                twoStepVerification:
                  enabled: true
                  primaryMethod: authenticator-app
                  methods: [authenticator-app]
                  authenticatorApp:
                    configuredAt: '2026-11-09T13:21:00Z'
                  securityKeys: []
                  backupCodes:
                    remaining: 10
                    total: 10
                    generatedAt: '2026-11-09T13:21:00Z'
                  requiredBy:
                    - organizationId: 019a5f3c-8d2e-7c4a-9b1f-3e5d7a9c1b2f
                      requiredFor: admins
                backupCodes:
                  codes:
                    - 4F7K-2M9Q
                    - H3XP-8D2L
                    - Q9TZ-5W1C
                    - B6NR-7J4E
                    - K2VD-9S8A
                    - M8LC-3F6P
                    - T5QW-1H7Z
                    - R4GY-6B3N
                    - C7EJ-2K5U
                    - W1PS-8V9D
                  generatedAt: '2026-11-09T13:21:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InternalTokenRefused'
        '403':
          $ref: '#/components/responses/InternalAccessRefused'
        '404':
          $ref: '#/components/responses/UserOrSessionNotFound'
        '422':
          $ref: '#/components/responses/SetupCodeRefused'
  /internal/v1/users/{userId}/two-step-verification/backup-codes/regenerate:
    post:
      operationId: regenerateBackupCodesInternal
      summary: Generate new backup codes of a user
      description: |
        Replaces the backup codes of the actor with 10 new ones, returned once and kept hashed; the
        previous ones stop working in the same transaction, which emits
        `user.two-step-verification-changed.v1` (`change: backup-codes-regenerated`) with the device
        of the `client`. The checks run in this order: two-step verification on
        (`409 auth.two-step-not-enabled`), then the recent authentication of `sessionId`
        (`403 auth.reauthentication-required`). Another user id, or an unknown one, answers
        `404 user.not-found`; a `sessionId` that is not an open session of the actor,
        `404 session.not-found`. Internal token: actor `user`, no organization.
      tags: [two-step-verification]
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TwoStepChange'
            example:
              sessionId: 019a6a2e-4b1c-7d3e-8f5a-2c9b7e1d4a60
              client:
                ipAddress: 192.0.2.14
                userAgent: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:132.0) Gecko/20100101 Firefox/132.0
      responses:
        '200':
          description: The new backup codes, returned once.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackupCodes'
              example:
                codes:
                  - 4F7K-2M9Q
                  - H3XP-8D2L
                  - Q9TZ-5W1C
                  - B6NR-7J4E
                  - K2VD-9S8A
                  - M8LC-3F6P
                  - T5QW-1H7Z
                  - R4GY-6B3N
                  - C7EJ-2K5U
                  - W1PS-8V9D
                generatedAt: '2026-11-08T16:05:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InternalTokenRefused'
        '403':
          $ref: '#/components/responses/RecentAuthenticationRequired'
        '404':
          $ref: '#/components/responses/UserOrSessionNotFound'
        '409':
          $ref: '#/components/responses/TwoStepNotEnabled'
  /internal/v1/users/{userId}/two-step-verification/security-keys/registration:
    post:
      operationId: startSecurityKeyRegistrationInternal
      summary: Issue the WebAuthn options to register a key of a user
      description: |
        Records a pending registration of `sessionId`, valid 5 minutes, and returns its WebAuthn
        creation options (`@simplewebauthn/server`, `residentKey: 'preferred'`, the keys of the
        account in `excludeCredentials`). A new start replaces it. The checks run in this order:
        two-step verification on and fewer than 10 keys (`409 auth.two-step-not-enabled`,
        `409 auth.security-key-limit-reached`), then the recent authentication of `sessionId`
        (`403 auth.reauthentication-required`). Another user id, or an unknown one, answers
        `404 user.not-found`; a `sessionId` that is not an open session of the actor,
        `404 session.not-found`. Internal token: actor `user`, no organization.
      tags: [two-step-verification]
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionReference'
            example:
              sessionId: 019a6a2e-4b1c-7d3e-8f5a-2c9b7e1d4a60
      responses:
        '200':
          description: The options, for the browser.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecurityKeyRegistration'
              example:
                options:
                  challenge: ExampleOnlyWebAuthnChallenge000000000000000
                  rp:
                    id: cadenway.com
                    name: Cadenway
                  user:
                    id: ExampleOnlyWebAuthnUserHandle00000000000000
                    name: camille.martin@ateliernord.fr
                    displayName: Camille Martin
                  pubKeyCredParams:
                    - type: public-key
                      alg: -8
                    - type: public-key
                      alg: -7
                    - type: public-key
                      alg: -257
                  timeout: 300000
                  attestation: none
                  authenticatorSelection:
                    residentKey: preferred
                    userVerification: preferred
                  excludeCredentials: []
                expiresAt: '2026-11-09T13:26:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InternalTokenRefused'
        '403':
          $ref: '#/components/responses/RecentAuthenticationRequired'
        '404':
          $ref: '#/components/responses/UserOrSessionNotFound'
        '409':
          $ref: '#/components/responses/SecurityKeyNotAddable'
  /internal/v1/users/{userId}/two-step-verification/security-keys:
    post:
      operationId: addSecurityKeyInternal
      summary: Register a security key of a user
      description: |
        Verifies `credential` against the pending registration of `sessionId` and, in one
        transaction, stores the key (its credential id, public key, counter, transports and flags,
        so that passkeys can come later without a migration) under `name`, after the same checks
        of origin and relying party as the answers of a challenge, ends the pending
        registration, and emits `user.two-step-verification-changed.v1`
        (`change: security-key-added`) with the device of the `client`. An answer that does not
        verify, or a credential id already registered, to this account or another one:
        `422 auth.security-key-refused`; no
        pending registration of `sessionId`, or an expired one: `422 auth.two-step-setup-expired`;
        two-step verification turned off since, or 10 keys: `409 auth.two-step-not-enabled`,
        `409 auth.security-key-limit-reached`. Recent authentication is not required again.
        Another user id, or an unknown one, answers `404 user.not-found`; a `sessionId` that is not
        an open session of the actor, `404 session.not-found`. Internal token: actor `user`, no
        organization.
      tags: [two-step-verification]
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SecurityKeyAddition'
            example:
              sessionId: 019a6a2e-4b1c-7d3e-8f5a-2c9b7e1d4a60
              name: YubiKey 5C NFC
              credential:
                id: ExampleOnlyCredentialIdYubiKey5CNfc0000000
                rawId: ExampleOnlyCredentialIdYubiKey5CNfc0000000
                type: public-key
                response:
                  clientDataJSON: ExampleOnlyClientDataJson
                  attestationObject: ExampleOnlyAttestationObject
                  transports: [usb, nfc]
                authenticatorAttachment: cross-platform
                clientExtensionResults: {}
              client:
                ipAddress: 192.0.2.14
                userAgent: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:132.0) Gecko/20100101 Firefox/132.0
      responses:
        '201':
          description: The key is registered.
          headers:
            Location:
              description: '`/internal/v1/users/<userId>/two-step-verification/security-keys/<securityKeyId>`.'
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecurityKey'
              example:
                id: 019a6c52-1d2e-7f3a-8b4c-5d6e7f8a9b01
                name: YubiKey 5C NFC
                createdAt: '2026-11-09T13:22:00Z'
                lastUsedAt: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InternalTokenRefused'
        '403':
          $ref: '#/components/responses/InternalAccessRefused'
        '404':
          $ref: '#/components/responses/UserOrSessionNotFound'
        '409':
          $ref: '#/components/responses/SecurityKeyNotAddable'
        '422':
          $ref: '#/components/responses/SecurityKeyRegistrationRefused'
  /internal/v1/users/{userId}/two-step-verification/security-keys/{securityKeyId}/remove:
    post:
      operationId: removeSecurityKeyInternal
      summary: Remove a security key of a user
      description: |
        Deletes a key of the actor and emits `user.two-step-verification-changed.v1`
        (`change: security-key-removed`) with the device of the `client`, in one transaction. A key
        of another user, an unknown or a removed one answers `404 security-key.not-found`; then the
        recent authentication of `sessionId` is checked (`403 auth.reauthentication-required`).
        Another user id, or an unknown one, answers `404 user.not-found`; a `sessionId` that is not
        an open session of the actor, `404 session.not-found`. Internal token: actor `user`, no
        organization.
      tags: [two-step-verification]
      parameters:
        - $ref: '#/components/parameters/UserId'
        - name: securityKeyId
          in: path
          required: true
          description: Id of the key, as the two-step verification of the account gave it.
          schema:
            type: string
            format: uuid
            examples: [019a6c52-1d2e-7f3a-8b4c-5d6e7f8a9b01]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TwoStepChange'
            example:
              sessionId: 019a6a2e-4b1c-7d3e-8f5a-2c9b7e1d4a60
              client:
                ipAddress: 192.0.2.14
                userAgent: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:132.0) Gecko/20100101 Firefox/132.0
      responses:
        '204':
          description: The key is removed.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InternalTokenRefused'
        '403':
          $ref: '#/components/responses/RecentAuthenticationRequired'
        '404':
          $ref: '#/components/responses/UserSessionOrSecurityKeyNotFound'
  /internal/v1/organization/authentication-policy:
    get:
      operationId: getAuthenticationPolicyInternal
      summary: Read the authentication policy of the organization
      description: |
        Returns the authentication policy of the organization of the token, as
        `GET /v1/organization/authentication-policy` says, with the counts of its members without
        two-step verification from the copy of the memberships. The owner and the admins only, from
        the copy of the memberships: `403 organization.role-forbidden` otherwise; an actor the copy
        does not hold as a member, `404 organization.not-found`. Internal token: actor `user`,
        organization required.
      tags: [authentication-policy]
      responses:
        '200':
          description: The policy.
          headers:
            ETag:
              description: Version of the policy, `"<version>"`.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationPolicy'
              examples:
                atelierNord:
                  $ref: '#/components/examples/AtelierNordPolicy'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InternalTokenRefused'
        '403':
          $ref: '#/components/responses/PolicyAccessRefused'
        '404':
          $ref: '#/components/responses/OrganizationNotFound'
    patch:
      operationId: updateAuthenticationPolicyInternal
      summary: Update the authentication policy of the organization
      description: |
        Applies a JSON Merge Patch to the authentication policy of the organization of the token,
        as `PATCH /v1/organization/authentication-policy` says. The checks run in this order: the
        current role of the actor verified with Organization (`403 organization.role-forbidden`,
        `404 organization.not-found` or `503 organization.unavailable`), `If-Match`
        (`412 request.version-mismatch`), when the patch
        requires two-step verification for a role the actor has, the two-step verification of the
        actor (`409 auth.two-step-not-enabled`), then the recent authentication of `sessionId`
        (`403 auth.reauthentication-required`; `404 session.not-found` for a session that is not
        an open session of the actor). A patch that changes nothing answers `200` with the same
        version. From the next introspection, the sessions and tokens acting on the organization
        follow the new policy. Emits nothing. Internal token: actor `user`, organization required.
      tags: [authentication-policy]
      parameters:
        - name: sessionId
          in: query
          required: true
          description: The session of the public request, as the introspection returned it, whose recent authentication is checked.
          schema:
            type: string
            format: uuid
            examples: [019a6a2e-4b1c-7d3e-8f5a-2c9b7e1d4a60]
        - name: If-Match
          in: header
          required: false
          description: '`"<version>"` the change was made from.'
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthenticationPolicyPatch'
            example:
              twoStepVerificationRequiredFor: admins
              sessionInactivityTimeoutMinutes: 720
      responses:
        '200':
          description: The policy after the change.
          headers:
            ETag:
              description: Version of the policy, `"<version>"`.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationPolicy'
              examples:
                atelierNord:
                  $ref: '#/components/examples/AtelierNordPolicy'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InternalTokenRefused'
        '403':
          $ref: '#/components/responses/PolicyAccessRefused'
        '404':
          $ref: '#/components/responses/OrganizationOrSessionNotFound'
        '409':
          $ref: '#/components/responses/TwoStepNotEnabled'
        '412':
          $ref: '#/components/responses/VersionMismatch'
        '503':
          $ref: '#/components/responses/MembershipAuthorityUnavailable'
  /internal/v1/realtime/tickets:
    post:
      operationId: issueRealtimeTicketInternal
      x-cadenway-strict-body: true
      summary: Issue a realtime ticket for an open session
      description: |
        Internal token: issuer `api-gateway` only, actor `user`, organization required.
        The API gateway sends the session id obtained from the verified cookie. Identity checks
        in the issuance transaction that this session belongs to the actor, is open, and acts
        on the organization in the signed internal token. The current membership and its
        authentication policy still have to permit access. No ticket is issued on refusal.

        Identity keeps the SHA-256 digest of the ticket, its bound session, session version and
        organization, and its expiration. The opaque value has 256 random bits and is returned
        once. It expires no later than 60 seconds after issuance. Use a fresh call if the result
        was lost.
      tags: [realtime-tickets]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RealtimeTicketIssuance'
            example:
              sessionId: 019a6a2e-4b1c-7d3e-8f5a-2c9b7e1d4a60
      responses:
        '200':
          description: The new credential, returned once.
          headers:
            Cache-Control:
              $ref: '#/components/headers/RealtimeNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RealtimeTicket'
              example:
                token: 0123456789abcdefghijklmnopqrstuvwxyzABCDEFA
                expiresAt: '2026-11-20T09:01:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InternalTokenRefused'
        '403':
          $ref: '#/components/responses/RealtimeTicketIssuanceRefused'
        '404':
          $ref: '#/components/responses/RealtimeTicketSessionNotFound'
  /internal/v1/realtime/tickets/redemption:
    post:
      operationId: redeemRealtimeTicketInternal
      x-cadenway-strict-body: true
      summary: Redeem a realtime ticket once
      description: |
        Internal token: issuer `realtime-gateway` only, actor `system`, without an organization.
        The realtime gateway checks the socket's Origin before forwarding its ticket. The
        organization, session, user and active membership come from Identity's records.

        Verify the current membership with Organization. Then in one transaction, revalidate
        the active session, its bound version and organization, the membership binding and the
        authentication policy, and consume the unexpired ticket atomically.
        At most one concurrent redemption succeeds. A ticket that is absent, expired, already
        consumed or whose binding no longer authorizes the session answers the same `404`.
        Neither a success nor a refusal exposes a ticket in logs, traces or events.
        Do not retry redemption after an ambiguous result. A new handshake needs a fresh ticket.

        A caller sends `Prefer: cadenway-saml-source-membership` to confirm it can revalidate
        the origin of a SAML session. Identity refuses to redeem a SAML session's ticket
        without this preference, using the same `404 realtime-ticket.not-found` as other
        unusable tickets. On success Identity confirms the preference with
        `Preference-Applied: cadenway-saml-source-membership` even for a non-SAML session,
        which omits the source membership field. Without the preference, non-SAML sessions
        retain their existing response with neither the field nor the confirmation header.
        Realtime revalidates any source membership alongside the current organization
        membership while the connection is active.
      tags: [realtime-tickets]
      parameters:
        - name: Prefer
          in: header
          required: false
          description: Confirms support for SAML source membership revalidation (RFC 7240). Required to redeem a SAML session's ticket.
          schema:
            type: string
            examples: [cadenway-saml-source-membership]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RealtimeTicketRedemption'
            example:
              token: 0123456789abcdefghijklmnopqrstuvwxyzABCDEFA
      responses:
        '200':
          description: The verified identity and its organization for this connection.
          headers:
            Cache-Control:
              $ref: '#/components/headers/RealtimeNoStore'
            Preference-Applied:
              description: Confirms that Identity honored the source membership preference, including for non-SAML sessions.
              schema:
                type: string
                const: cadenway-saml-source-membership
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RealtimeSession'
              example:
                sessionId: 019a6a2e-4b1c-7d3e-8f5a-2c9b7e1d4a60
                sessionVersion: 2
                userId: 019a5f3c-8d2e-7c4a-9b1f-3e5d7a9c1b30
                organizationId: 019a5f3c-8d2e-7c4a-9b1f-3e5d7a9c1b2f
                memberId: 019a5f3c-8d2e-7c4a-9b1f-3e5d7a9c1b31
                role: owner
                sessionExpiresAt: '2026-11-20T20:00:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InternalTokenRefused'
        '403':
          $ref: '#/components/responses/RealtimeTicketRedemptionRefused'
        '404':
          $ref: '#/components/responses/RealtimeTicketNotFound'
        '503':
          $ref: '#/components/responses/MembershipAuthorityUnavailable'
  /internal/v1/api-tokens:
    post:
      operationId: createApiTokenInternal
      summary: Create a personal API token
      description: |
        Creates a token of the actor in the organization of the internal token, the current
        organization of the session, as `POST /v1/api-tokens` says, and returns its secret once:
        `cw_pat_`, 30 base62 characters from `node:crypto`, then 6 characters of CRC32 check.
        identity-service keeps its SHA-256 hash and its first 11 characters, never the secret.

        Requires a recent authentication of `sessionId`, the session of the public request: a
        session without one in the last 10 minutes, or a request without `sessionId`, answers
        `403 auth.reauthentication-required` with `details.methods` and creates nothing; a
        `sessionId` that is not an open session of the actor answers `404 session.not-found`, which
        the gateway answers as `401 auth.session-expired`. Internal token: actor `user`,
        organization required.
      tags: [api-tokens]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiTokenCreation'
            example:
              sessionId: 019a6a2e-4b1c-7d3e-8f5a-2c9b7e1d4a60
              name: Synchronisation GitLab
              scopes: [tasks:read]
              expiration: 30-days
      responses:
        '201':
          description: The token exists; its secret is in `secret`, once.
          headers:
            Location:
              description: '`/internal/v1/api-tokens/<apiTokenId>`.'
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiTokenCreated'
              example:
                apiToken:
                  id: 019a6c30-7a8b-7c9d-8e0f-1a2b3c4d5e90
                  name: Synchronisation GitLab
                  prefix: cw_pat_Exam
                  scopes: [tasks:read]
                  organizationId: 019a5f3c-8d2e-7c4a-9b1f-3e5d7a9c1b2f
                  createdAt: '2026-11-08T14:02:00Z'
                  expiresAt: '2026-12-08T14:02:00Z'
                  lastUsedAt: null
                secret: cw_pat_ExampleOnlyNotARealToken000000000000
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InternalTokenRefused'
        '403':
          $ref: '#/components/responses/RecentAuthenticationRequired'
        '404':
          $ref: '#/components/responses/SessionNotFound'
    get:
      operationId: listApiTokensInternal
      summary: List the personal API tokens
      description: |
        Lists the tokens of the actor in the organization of the internal token that are neither
        revoked nor expired, the most recently created first, never with their secret. Internal
        token: actor `user`, organization required.
      tags: [api-tokens]
      parameters:
        - $ref: '../../components/http.yaml#/components/parameters/Cursor'
        - $ref: '../../components/http.yaml#/components/parameters/Limit'
      responses:
        '200':
          description: One page of tokens.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiTokenPage'
              example:
                items:
                  - id: 019a6c30-7a8b-7c9d-8e0f-1a2b3c4d5e90
                    name: Synchronisation GitLab
                    prefix: cw_pat_Exam
                    scopes: [tasks:read]
                    organizationId: 019a5f3c-8d2e-7c4a-9b1f-3e5d7a9c1b2f
                    createdAt: '2026-11-08T14:02:00Z'
                    expiresAt: '2026-12-08T14:02:00Z'
                    lastUsedAt: '2026-11-08T14:10:00Z'
                nextCursor: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InternalTokenRefused'
        '403':
          $ref: '#/components/responses/InternalAccessRefused'
  /internal/v1/api-tokens/{apiTokenId}:
    delete:
      operationId: revokeApiTokenInternal
      summary: Revoke a personal API token
      description: |
        Revokes a token of the actor in the organization of the internal token: from the next
        introspection it is inactive. Revoking it again answers `204`; a token of another user or
        organization, or an unknown id, answers `404 api-token.not-found`. Internal token: actor
        `user`, organization required.
      tags: [api-tokens]
      parameters:
        - name: apiTokenId
          in: path
          required: true
          description: Id of the token.
          schema:
            type: string
            format: uuid
            examples: [019a6c30-7a8b-7c9d-8e0f-1a2b3c4d5e90]
      responses:
        '204':
          description: The token is revoked.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InternalTokenRefused'
        '403':
          $ref: '#/components/responses/InternalAccessRefused'
        '404':
          $ref: '#/components/responses/ApiTokenNotFound'
  /internal/v1/api-tokens/introspect:
    post:
      operationId: introspectApiToken
      summary: Introspect a personal API token
      description: |
        Tells whether a personal API token, sent as `Authorization: Bearer`, is active and, when it
        is, whose it is, which organization it acts in and with which scopes. The gateway calls it
        on every request that carries a bearer token, never caches the answer, and gives the request
        its context from it, as for a session.

        A token is active when it is known by its hash, neither revoked nor expired, and
        organization-service confirms its user's current membership and role. A token of a removed
        member is inactive while the person is not a member, and active again, until revoked or
        expired, once they join the organization again with a new membership. Any other token,
        malformed ones and session tokens included, answers `200` with `active: false`, never an
        error. An unavailable membership proof answers `503 organization.unavailable`.
        While the authentication policy of its organization requires two-step verification
        for the role of its user, who has none, the token stays active but acts on nothing:
        `withheldOrganization` names the organization and `scopes` is empty (see "Withheld
        organization"). An active answer records the last use of the token, at most once a
        minute. The call can be retried. Separate from `POST /internal/v1/tokens/introspect`, whose
        active answer always names a session and an expiry: a personal token has neither a session
        nor, with `never`, an expiry. Internal token: actor `system`, no organization.
      tags: [api-tokens]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiTokenIntrospectionRequest'
            example:
              token: cw_pat_ExampleOnlyNotARealToken000000000000
      responses:
        '200':
          description: Whether the token is active, and its subject when it is.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiTokenIntrospection'
              examples:
                active:
                  summary: Active token of Camille Martin in Atelier Nord
                  value:
                    active: true
                    tokenType: api-token
                    apiTokenId: 019a6c30-7a8b-7c9d-8e0f-1a2b3c4d5e90
                    userId: 019a5f3c-8d2e-7c4a-9b1f-3e5d7a9c1b30
                    organizationId: 019a5f3c-8d2e-7c4a-9b1f-3e5d7a9c1b2f
                    role: owner
                    scopes: [tasks:read]
                    expiresAt: '2026-12-08T14:02:00Z'
                withheldOrganization:
                  summary: Token of Théo Bernard, once Atelier Nord requires two-step verification of everyone
                  value:
                    active: true
                    tokenType: api-token
                    apiTokenId: 019a6c30-7a8b-7c9d-8e0f-1a2b3c4d5e91
                    userId: 019a5f3c-b2c3-7d4e-8f5a-6b7c8d9e0f33
                    organizationId: 019a5f3c-8d2e-7c4a-9b1f-3e5d7a9c1b2f
                    role: member
                    scopes: []
                    expiresAt: null
                    withheldOrganization:
                      organizationId: 019a5f3c-8d2e-7c4a-9b1f-3e5d7a9c1b2f
                      code: organization.mfa-required
                inactive:
                  summary: Unknown, expired or revoked token, or user no longer a member
                  value:
                    active: false
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InternalTokenRefused'
        '403':
          $ref: '#/components/responses/InternalAccessRefused'
        '503':
          $ref: '#/components/responses/MembershipAuthorityUnavailable'
components:
  securitySchemes:
    internalToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Internal token of `@cadenway/nest-common`: Ed25519, 60 seconds, `aud` = `identity-service`,
        issuer `api-gateway` for the gateway routes, `realtime-gateway` for realtime ticket
        redemption and `notification-service` for the notification recipient read.
  parameters:
    SessionId:
      name: sessionId
      in: path
      required: true
      description: Id of the session of the public request, as the introspection returned it.
      schema:
        type: string
        format: uuid
        examples: [019a6a2e-4b1c-7d3e-8f5a-2c9b7e1d4a60]
    UserId:
      name: userId
      in: path
      required: true
      description: Id of the account, the actor.
      schema:
        type: string
        format: uuid
        examples: [019a5f3c-8d2e-7c4a-9b1f-3e5d7a9c1b30]
  headers:
    VerifiedEmailNoStore:
      required: true
      description: Prevents caching the address or the result of the lookup.
      schema:
        type: string
        const: no-store
    NotificationRecipientNoStore:
      required: true
      description: Prevents storage of the recipient profile or the result of the lookup.
      schema:
        type: string
        const: no-store
    RealtimeNoStore:
      description: Prevents storage by caches.
      schema:
        type: string
        const: no-store
        examples: [no-store]
    RetryAfter:
      description: Seconds to wait before the request can succeed (RFC 9110).
      schema:
        type: integer
        minimum: 1
  examples:
    CamilleMartin:
      summary: Camille Martin, with the profile of the mockup
      value:
        id: 019a5f3c-8d2e-7c4a-9b1f-3e5d7a9c1b30
        name: Camille Martin
        email: camille.martin@ateliernord.fr
        language: fr
        displayName: camille
        jobTitle: Responsable produit
        timeZone: Europe/Paris
        passwordChangedAt: '2026-08-12T09:30:00Z'
        version: 3
    SignInChallenge:
      summary: The challenge of Camille Martin, with the app, two keys and 7 backup codes
      value:
        token: ExampleOnlyChallengeToken00000000000000000
        expiresAt: '2026-11-09T07:52:00Z'
        email: camille.martin@ateliernord.fr
        name: Camille Martin
        primaryMethod: authenticator-app
        methods: [authenticator-app, security-key, backup-code]
        securityKeys:
          - name: YubiKey 5C NFC
          - name: Touch ID (MacBook Air)
        backupCodesRemaining: 7
        lockedUntil: null
    TwoStepVerificationEnabled:
      summary: The card of Camille Martin in the mockup
      value:
        enabled: true
        primaryMethod: authenticator-app
        methods: [authenticator-app, security-key]
        authenticatorApp:
          configuredAt: '2026-03-03T10:15:00Z'
        securityKeys:
          - id: 019a6c52-1d2e-7f3a-8b4c-5d6e7f8a9b01
            name: YubiKey 5C NFC
            createdAt: '2026-03-03T10:20:00Z'
            lastUsedAt: '2026-11-09T07:42:00Z'
          - id: 019a6c52-1d2e-7f3a-8b4c-5d6e7f8a9b02
            name: Touch ID (MacBook Air)
            createdAt: '2026-04-14T08:05:00Z'
            lastUsedAt: '2026-11-06T08:15:00Z'
        backupCodes:
          remaining: 7
          total: 10
          generatedAt: '2026-03-03T10:15:00Z'
        requiredBy:
          - organizationId: 019a5f3c-8d2e-7c4a-9b1f-3e5d7a9c1b2f
            requiredFor: admins
    AtelierNordPolicy:
      summary: The policy of Atelier Nord in the mockup
      value:
        twoStepVerificationRequiredFor: admins
        sessionInactivityTimeoutMinutes: 720
        membersWithoutTwoStepVerification:
          admins: 0
          everyone: 7
        version: 2
  responses:
    FederatedContinuationIssued:
      description: Identity verified the provider response and issued an opaque one-use receipt.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/FederatedReceipt'
    FederatedSignInRefused:
      description: |
        `auth.federated-sign-in-refused`: no eligible federated sign-in can proceed.
        No credential, account identifier or provider diagnostic is returned.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          example:
            type: about:blank
            title: Unprocessable Content
            status: 422
            code: auth.federated-sign-in-refused
    FederatedAuthorityUnavailable:
      description: |
        `auth.federated-unavailable`: a configured provider or Identity's sign-in authority
        is temporarily unavailable. A new flow is needed after a matched state was consumed.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          example:
            type: about:blank
            title: Service Unavailable
            status: 503
            code: auth.federated-unavailable
    MembershipAuthorityUnavailable:
      description: |
        `organization.unavailable` when Identity cannot verify the required membership with
        Organization. No success or authorization proof is produced. A temporary failure of
        introspection does not invalidate the credential.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          example:
            type: about:blank
            title: Service Unavailable
            status: 503
            code: organization.unavailable
    SamlAuthorityUnavailable:
      description: |
        `auth.federated-unavailable` when a provider or sign-in authority is unavailable, or
        `organization.unavailable` when Identity cannot verify the originating SAML membership.
        No receipt, challenge or session can be issued without the required verification.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          examples:
            federatedUnavailable:
              value:
                type: about:blank
                title: Service Unavailable
                status: 503
                code: auth.federated-unavailable
            organizationUnavailable:
              value:
                type: about:blank
                title: Service Unavailable
                status: 503
                code: organization.unavailable
    ProfileMediaReservationConflict:
      description: |
        `idempotency.request-in-progress` when the equivalent signing or owner reservation is running.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
    ProfileMediaReservationRefused:
      description: |
        `media.file-too-large` above 5,242,880 declared bytes, `media.unsupported-type` for a
        disallowed image encoding, or `idempotency.key-reused` for a conflicting reservation.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
    ProfileMediaUploadStateConflict:
      description: |
        `media.upload-expired` for expiration, `media.upload-not-ready` for an upload that has not
        arrived, or `media.upload-superseded` for an invalidated prior generation.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
    AvatarOwnerOrUploadNotFound:
      description: |
        `user.not-found` for a different or unavailable account, or `media.not-found` for an absent or unrelated upload.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
    ChallengeIssued:
      description: |
        The account has two-step verification: no session, no token. The body is the challenge, the
        schema `POST /internal/v1/auth/sign-in/challenge/inspection` answers; `token` is a secret.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SignInChallenge'
          examples:
            camilleMartin:
              $ref: '#/components/examples/SignInChallenge'
    ChallengeAnswered:
      description: |
        A session is open, as for `SessionIssued`; with `trustDevice`, `trustedDevice` holds the
        device token, returned once, that the gateway writes into `__Host-cw_trusted_device`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SessionIssued'
          example:
            token: example-session-token
            session:
              id: 019a6914-2f7a-7b3c-9d4e-5f6a7b8c9d01
              expiresAt: '2026-12-09T07:42:00Z'
              persistent: true
            user:
              id: 019a5f3c-8d2e-7c4a-9b1f-3e5d7a9c1b30
              name: Camille Martin
              email: camille.martin@ateliernord.fr
              language: fr
              displayName: camille
              jobTitle: Responsable produit
              timeZone: Europe/Paris
              passwordChangedAt: '2026-08-12T09:30:00Z'
              version: 9
            trustedDevice:
              token: ExampleOnlyTrustedDeviceToken0000000000000
              expiresAt: '2026-12-09T07:42:00Z'
    ChallengeExpired:
      description: |
        `auth.challenge-expired`: the challenge expired (10 minutes), was answered, was replaced,
        or is unknown or malformed.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          example:
            type: about:blank
            title: Unprocessable Content
            status: 422
            code: auth.challenge-expired
    TwoStepCodeRefused:
      description: |
        `auth.challenge-expired` (checked first, no attempt counted), then
        `auth.two-step-code-invalid` with `details.remainingAttempts` (at least 1): the code is
        wrong or was used already.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          examples:
            challengeExpired:
              summary: Challenge no longer usable
              value:
                type: about:blank
                title: Unprocessable Content
                status: 422
                code: auth.challenge-expired
            twoStepCodeInvalid:
              summary: Wrong or used code
              value:
                type: about:blank
                title: Unprocessable Content
                status: 422
                code: auth.two-step-code-invalid
                details:
                  remainingAttempts: 4
    SecurityKeyAnswerRefused:
      description: |
        `auth.challenge-expired` (checked first), then `auth.security-key-refused`: no key on the
        account (options), or an answer that does not verify (answer, with
        `details.remainingAttempts`).
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          example:
            type: about:blank
            title: Unprocessable Content
            status: 422
            code: auth.security-key-refused
            details:
              remainingAttempts: 4
    TwoStepLocked:
      description: |
        `auth.two-step-locked`: the two-step answers of the account are locked until
        `details.lockedUntil`, 15 minutes after the fifth wrong answer in a row.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          example:
            type: about:blank
            title: Too Many Requests
            status: 429
            code: auth.two-step-locked
            details:
              lockedUntil: '2026-11-09T08:02:00Z'
    MfaRequiredByOrganization:
      description: |
        `auth.mfa-required-by-organization`: the policy of an organization of the copy of the
        memberships requires two-step verification for the role of the actor in it;
        `details.organizationIds` lists them.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          example:
            type: about:blank
            title: Conflict
            status: 409
            code: auth.mfa-required-by-organization
            details:
              organizationIds: [019a5f3c-8d2e-7c4a-9b1f-3e5d7a9c1b2f]
    SetupCodeRefused:
      description: |
        `auth.two-step-setup-expired`: no pending setup of the session, or it expired or was
        replaced; `auth.two-step-code-invalid`: a wrong code, without `details.remainingAttempts`.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          example:
            type: about:blank
            title: Unprocessable Content
            status: 422
            code: auth.two-step-setup-expired
    TwoStepNotEnabled:
      description: |
        `auth.two-step-not-enabled`: the request needs two-step verification on the account of the
        actor: backup codes, a security key, a `code` of the re-authentication, or a policy that
        requires it for a role of the actor.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          example:
            type: about:blank
            title: Conflict
            status: 409
            code: auth.two-step-not-enabled
    SecurityKeyNotAddable:
      description: |
        `auth.two-step-not-enabled` (two-step verification off), or
        `auth.security-key-limit-reached` (10 keys, with `details.maxSecurityKeys`).
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          example:
            type: about:blank
            title: Conflict
            status: 409
            code: auth.security-key-limit-reached
            details:
              maxSecurityKeys: 10
    SecurityKeyRegistrationRefused:
      description: |
        `auth.two-step-setup-expired`: no pending registration of the session, or it expired or
        was replaced; `auth.security-key-refused`: the answer does not verify, or the account
        already has the key.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          example:
            type: about:blank
            title: Unprocessable Content
            status: 422
            code: auth.security-key-refused
    UserSessionOrSecurityKeyNotFound:
      description: |
        - `user.not-found`: the user id is not the actor, or no account has it;
        - `session.not-found`: the session of the request is not an open session of the actor. The
          gateway answers it as `401 auth.session-expired`;
        - `security-key.not-found`: no key with this id belongs to the actor.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          example:
            type: about:blank
            title: Not Found
            status: 404
            code: security-key.not-found
    OrganizationChoiceRefused:
      description: |
        - `organization.mfa-required`: the policy of the organization requires two-step
          verification for the role of the actor, who has none; `details.organizationId` names it.
          The gateway forwards it with the French title of `openapi/public/organizations.yaml`;
        - `auth.issuer-not-allowed`, `auth.actor-not-allowed`: see the internal token.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          examples:
            mfaRequired:
              summary: Two-step verification required by the organization
              value:
                type: about:blank
                title: Forbidden
                status: 403
                code: organization.mfa-required
                details:
                  organizationId: 019a5f3c-8d2e-7c4a-9b1f-3e5d7a9c1b2f
            actorNotAllowed:
              summary: Actor not accepted
              value:
                type: about:blank
                title: Forbidden
                status: 403
                code: auth.actor-not-allowed
    PolicyAccessRefused:
      description: |
        - `organization.role-forbidden`: only the owner and the admins of the organization, in the
          copy of the memberships, read and change its policy;
        - `auth.reauthentication-required`, on a change: the session has no authentication in the
          last 10 minutes, with `details.methods`; the gateway forwards it with its French title;
        - `auth.issuer-not-allowed`, `auth.actor-not-allowed`, `auth.organization-required`: see
          the internal token.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          examples:
            roleForbidden:
              summary: A member or a guest
              value:
                type: about:blank
                title: Forbidden
                status: 403
                code: organization.role-forbidden
            organizationRequired:
              summary: Token without an organization
              value:
                type: about:blank
                title: Forbidden
                status: 403
                code: auth.organization-required
    OrganizationOrSessionNotFound:
      description: |
        - `organization.not-found`: the copy of the memberships holds no membership of the actor
          in the organization of the token;
        - `session.not-found`: `sessionId` is not an open session of the actor. The gateway
          answers it as `401 auth.session-expired`.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          example:
            type: about:blank
            title: Not Found
            status: 404
            code: organization.not-found
    OrganizationNotFound:
      description: |
        `organization.not-found`: the copy of the memberships holds no membership of the actor in
        the organization of the token.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          example:
            type: about:blank
            title: Not Found
            status: 404
            code: organization.not-found
    SessionIssued:
      description: |
        A session is open. `token` is returned here only, once: the gateway sets the cookie from it
        and from `session` (`Max-Age` when `persistent`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SessionIssued'
          example:
            token: example-session-token
            session:
              id: 019a6a2e-4b1c-7d3e-8f5a-2c9b7e1d4a60
              expiresAt: '2026-12-08T13:07:00Z'
              persistent: true
            user:
              id: 019a5f3c-8d2e-7c4a-9b1f-3e5d7a9c1b30
              name: Camille Martin
              email: camille.martin@ateliernord.fr
              language: fr
              displayName: null
              jobTitle: null
              timeZone: Europe/Paris
              version: 2
    BadRequest:
      description: '`request.invalid`: the request does not match the schema; one `details.issues` entry per issue.'
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          example:
            type: about:blank
            title: Bad Request
            status: 400
            code: request.invalid
            details:
              issues:
                - in: body
                  path: email
                  code: invalid_format
                  message: Invalid email address
    InternalTokenRefused:
      description: |
        The internal token is missing (`auth.token-missing`) or refused (`auth.token-invalid`, with
        `details.reason`). The gateway's client reports it as `503 upstream.unauthorized`.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          example:
            type: about:blank
            title: Unauthorized
            status: 401
            code: auth.token-invalid
            details:
              reason: expired
    InternalAccessRefused:
      description: |
        The internal token is valid but the route does not accept its issuer
        (`auth.issuer-not-allowed`) or its actor (`auth.actor-not-allowed`), or the route requires
        an organization the token does not carry (`auth.organization-required`).
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          example:
            type: about:blank
            title: Forbidden
            status: 403
            code: auth.actor-not-allowed
    RealtimeTicketIssuanceRefused:
      description: |
        - `organization.not-selected`: the session no longer acts in the organization of the
          request. The response does not name another organization.
        - `organization.mfa-required`: the organization requires two-step verification for
          the actor, who has none. `details.organizationId` identifies the organization.
        - `auth.issuer-not-allowed`, `auth.actor-not-allowed`, `auth.organization-required`:
          see the internal token.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          example:
            type: about:blank
            title: Forbidden
            status: 403
            code: organization.not-selected
    RealtimeTicketSessionNotFound:
      description: |
        - `session.not-found`: the session is no longer open or does not belong to the user.
          The API gateway maps this to `401 auth.session-expired`.
        - `organization.not-found`: Identity does not recognize a current membership in the
          organization of the signed request.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          example:
            type: about:blank
            title: Not Found
            status: 404
            code: session.not-found
    RealtimeTicketRedemptionRefused:
      description: |
        The internal token is valid but the issuer is not `realtime-gateway`
        (`auth.issuer-not-allowed`), the actor is not `system` (`auth.actor-not-allowed`),
        or the token carries an organization (`auth.organization-not-allowed`).
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          example:
            type: about:blank
            title: Forbidden
            status: 403
            code: auth.issuer-not-allowed
    RealtimeTicketNotFound:
      description: |
        `realtime-ticket.not-found`: no usable ticket was found. This includes a SAML ticket
        when the caller did not negotiate source membership revalidation. The response gives no
        detail about the reason, ticket state, session, organization or former holder.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          example:
            type: about:blank
            title: Not Found
            status: 404
            code: realtime-ticket.not-found
    SignInForbidden:
      description: |
        - `auth.email-not-verified`: the password is right but the address is not verified yet;
        - `auth.issuer-not-allowed`, `auth.actor-not-allowed`: see the internal token.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          examples:
            emailNotVerified:
              summary: Address not verified
              value:
                type: about:blank
                title: Forbidden
                status: 403
                code: auth.email-not-verified
            actorNotAllowed:
              summary: Actor not accepted
              value:
                type: about:blank
                title: Forbidden
                status: 403
                code: auth.actor-not-allowed
    EmailTaken:
      description: '`auth.email-taken`: a verified account already uses the address.'
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          example:
            type: about:blank
            title: Conflict
            status: 409
            code: auth.email-taken
    SignUpRefused:
      description: |
        `auth.terms-not-accepted`, `auth.password-too-short` (with `details.minLength`) or
        `auth.password-compromised`; nothing is created.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          example:
            type: about:blank
            title: Unprocessable Content
            status: 422
            code: auth.password-too-short
            details:
              minLength: 12
    CodeRefused:
      description: |
        `auth.code-invalid` (wrong code, or no account awaits one at the address) or
        `auth.code-expired` (expired, used, replaced or too many wrong attempts).
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          example:
            type: about:blank
            title: Unprocessable Content
            status: 422
            code: auth.code-invalid
    SignUpVerificationRefused:
      description: |
        The code is checked first: `auth.code-invalid` or `auth.code-expired`, as in
        `CodeRefused`. Then, only with the right code, `auth.sign-up-replaced`: `password` differs
        from the password of the latest sign-up of the address, or is missing while the address
        was signed up more than once; the code stops working.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          examples:
            codeInvalid:
              summary: Wrong code
              value:
                type: about:blank
                title: Unprocessable Content
                status: 422
                code: auth.code-invalid
            signUpReplaced:
              summary: Another sign-up of the address
              value:
                type: about:blank
                title: Unprocessable Content
                status: 422
                code: auth.sign-up-replaced
    CredentialsRefused:
      description: |
        `auth.invalid-credentials`, with `details.remainingAttempts` (at least 1); the same when no
        account uses the address.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          example:
            type: about:blank
            title: Unprocessable Content
            status: 422
            code: auth.invalid-credentials
            details:
              remainingAttempts: 3
    AccountLocked:
      description: |
        `auth.account-locked`: the password sign-in of the address is locked until
        `details.lockedUntil`, 15 minutes after the failure that used the last attempt. On the
        re-authentication with a `code`: `auth.two-step-locked` instead (see `TwoStepLocked`).
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          example:
            type: about:blank
            title: Too Many Requests
            status: 429
            code: auth.account-locked
            details:
              lockedUntil: '2026-11-08T13:22:00Z'
    CodeThrottled:
      description: |
        `auth.code-throttled`, with `details.resendAvailableAt`: the code requests of the address
        are throttled whatever their purpose, account or not, so the sign-up, the sign-up code,
        the sign-in code and the change of address, counted on the new address, count together. A
        request is refused less than 30 seconds after
        the last accepted one, and once 5 were accepted in the current hour, which starts with the
        first request accepted after the previous hour ended. `details.resendAvailableAt` is 30
        seconds after the last accepted request, or the end of the hour.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          example:
            type: about:blank
            title: Too Many Requests
            status: 429
            code: auth.code-throttled
            details:
              resendAvailableAt: '2026-11-08T13:07:30Z'
    SessionNotFound:
      description: '`session.not-found`: no session with this id belongs to the actor.'
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          example:
            type: about:blank
            title: Not Found
            status: 404
            code: session.not-found
    UserNotFound:
      description: '`user.not-found`: no account with this id is readable by the actor.'
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          example:
            type: about:blank
            title: Not Found
            status: 404
            code: user.not-found
    SessionOrOrganizationNotFound:
      description: |
        - `session.not-found`: no session with this id belongs to the actor;
        - `organization.not-found`: the copy of the memberships holds no membership of the actor in
          this organization, also for a few seconds after a creation or an acceptance.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          examples:
            organizationNotFound:
              summary: Not a member, or not known yet
              value:
                type: about:blank
                title: Not Found
                status: 404
                code: organization.not-found
            sessionNotFound:
              summary: Session of another user
              value:
                type: about:blank
                title: Not Found
                status: 404
                code: session.not-found
    ApiTokenNotFound:
      description: '`api-token.not-found`: no token with this id belongs to the actor in the organization of the internal token.'
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          example:
            type: about:blank
            title: Not Found
            status: 404
            code: api-token.not-found
    VersionMismatch:
      description: '`request.version-mismatch`: `If-Match` is not the current version, with `details.version`.'
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          example:
            type: about:blank
            title: Precondition Failed
            status: 412
            code: request.version-mismatch
            details:
              version: 3
    ResetThrottled:
      description: |
        `auth.reset-throttled`, with `details.resendAvailableAt`: the password reset requests of
        the address are throttled, account or not, apart from the code requests. A request is
        refused less than 45 seconds after the last accepted one, and once 5 were accepted in the
        current hour, which starts with the first request accepted after the previous hour ended.
        `details.resendAvailableAt` is 45 seconds after the last accepted request, or the end of
        the hour.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          example:
            type: about:blank
            title: Too Many Requests
            status: 429
            code: auth.reset-throttled
            details:
              resendAvailableAt: '2026-11-09T13:10:45Z'
    ResetLinkExpired:
      description: '`auth.reset-link-expired`: the link expired, was used, was replaced, or is unknown or malformed.'
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          example:
            type: about:blank
            title: Unprocessable Content
            status: 422
            code: auth.reset-link-expired
    PasswordResetRefused:
      description: |
        `auth.reset-link-expired` (the link is checked first), then `auth.password-too-short`
        (with `details.minLength`) or `auth.password-compromised`, which leave the link usable.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          examples:
            resetLinkExpired:
              summary: Link no longer usable
              value:
                type: about:blank
                title: Unprocessable Content
                status: 422
                code: auth.reset-link-expired
            passwordTooShort:
              summary: Password too short
              value:
                type: about:blank
                title: Unprocessable Content
                status: 422
                code: auth.password-too-short
                details:
                  minLength: 12
    PasswordRefused:
      description: |
        `auth.password-incorrect`, with `details.remainingAttempts` (at least 1): the failures left
        before the lockout of the password sign-in of the address of the account. On the
        re-authentication with a `code`: `auth.two-step-code-invalid`, with
        `details.remainingAttempts` before the lockout of the two-step answers of the account.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          example:
            type: about:blank
            title: Unprocessable Content
            status: 422
            code: auth.password-incorrect
            details:
              remainingAttempts: 3
    PasswordChangeRefused:
      description: |
        The new password first: `auth.password-too-short` (with `details.minLength`) or
        `auth.password-compromised`, no attempt counted; then the current one:
        `auth.password-incorrect`, with `details.remainingAttempts`.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          examples:
            passwordTooShort:
              summary: New password too short
              value:
                type: about:blank
                title: Unprocessable Content
                status: 422
                code: auth.password-too-short
                details:
                  minLength: 12
            passwordIncorrect:
              summary: Wrong current password
              value:
                type: about:blank
                title: Unprocessable Content
                status: 422
                code: auth.password-incorrect
                details:
                  remainingAttempts: 3
    RecentAuthenticationRequired:
      description: |
        - `auth.reauthentication-required`: the session has no authentication in the last 10
          minutes that counts for its account, or the re-authentication sent a password for an
          account with two-step verification. `details.methods` lists the ways its person can
          confirm: `[password]` without two-step verification, `[authenticator-app]` with it; the
          gateway forwards the code, its `details` and the French title of
          `openapi/public/auth.yaml`;
        - `auth.issuer-not-allowed`, `auth.actor-not-allowed`, and `auth.organization-required` on
          a route that requires an organization: see the internal token.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          examples:
            reauthenticationRequired:
              summary: No recent authentication
              value:
                type: about:blank
                title: Forbidden
                status: 403
                code: auth.reauthentication-required
                details:
                  methods: [password]
            reauthenticationRequiredWithApp:
              summary: No recent two-step proof, account with two-step verification
              value:
                type: about:blank
                title: Forbidden
                status: 403
                code: auth.reauthentication-required
                details:
                  methods: [authenticator-app]
            actorNotAllowed:
              summary: Actor not accepted
              value:
                type: about:blank
                title: Forbidden
                status: 403
                code: auth.actor-not-allowed
    EmailUnchanged:
      description: '`auth.email-unchanged`: the new address is the current address of the account.'
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          example:
            type: about:blank
            title: Unprocessable Content
            status: 422
            code: auth.email-unchanged
    EmailChangeCodeRefused:
      description: |
        `auth.code-invalid` (wrong code, or no pending change of address) or `auth.code-expired`
        (expired, used, replaced by a newer request or too many wrong attempts).
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          example:
            type: about:blank
            title: Unprocessable Content
            status: 422
            code: auth.code-invalid
    OrganizationOwner:
      description: |
        `account.organization-owner`: the copy of the memberships holds a membership of the actor
        with the role `owner`, not removed. `details.organizationIds` lists those organizations.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          example:
            type: about:blank
            title: Conflict
            status: 409
            code: account.organization-owner
            details:
              organizationIds: [019a5f3c-8d2e-7c4a-9b1f-3e5d7a9c1b2f]
    UserOrSessionNotFound:
      description: |
        - `user.not-found`: the user id is not the actor, or no account has it;
        - `session.not-found`: the session of the request is not an open session of the actor. The
          gateway answers it as `401 auth.session-expired`.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          examples:
            userNotFound:
              summary: Another user
              value:
                type: about:blank
                title: Not Found
                status: 404
                code: user.not-found
            sessionNotFound:
              summary: Session ended since its introspection
              value:
                type: about:blank
                title: Not Found
                status: 404
                code: session.not-found
  schemas:
    FederatedBrowserBinding:
      type: string
      minLength: 32
      maxLength: 128
      pattern: '^[A-Za-z0-9_-]+$'
      description: Opaque, single-flow browser credential generated by Identity.
    FederatedFlowStarted:
      type: object
      additionalProperties: false
      required: [authorizationUrl, browserBinding, expiresAt]
      properties:
        authorizationUrl:
          $ref: '../../components/federated-sign-in.yaml#/components/schemas/FederatedAuthorizationUrl'
        browserBinding:
          $ref: '#/components/schemas/FederatedBrowserBinding'
        expiresAt:
          type: string
          format: date-time
          description: Expiration of the flow and browser binding, at most ten minutes after issue.
    FederatedOAuthCallback:
      type: object
      additionalProperties: false
      required: [provider, state, browserBinding, response]
      properties:
        provider:
          $ref: '../../components/federated-sign-in.yaml#/components/schemas/OAuthSignInProvider'
        state:
          $ref: '../../components/federated-sign-in.yaml#/components/schemas/FederatedState'
        browserBinding:
          $ref: '#/components/schemas/FederatedBrowserBinding'
        response:
          oneOf:
            - type: object
              additionalProperties: false
              required: [outcome, code]
              properties:
                outcome:
                  type: string
                  const: authorized
                code:
                  $ref: '../../components/federated-sign-in.yaml#/components/schemas/OAuthAuthorizationCode'
            - type: object
              additionalProperties: false
              required: [outcome, error]
              properties:
                outcome:
                  type: string
                  const: denied
                error:
                  $ref: '../../components/federated-sign-in.yaml#/components/schemas/OAuthAuthorizationError'
    FederatedSamlCallback:
      type: object
      additionalProperties: false
      required: [samlResponse, relayState, browserBinding]
      properties:
        samlResponse:
          $ref: '../../components/federated-sign-in.yaml#/components/schemas/SamlEncodedResponse'
        relayState:
          $ref: '../../components/federated-sign-in.yaml#/components/schemas/FederatedState'
        browserBinding:
          $ref: '#/components/schemas/FederatedBrowserBinding'
    FederatedReceiptToken:
      type: string
      minLength: 32
      maxLength: 128
      pattern: '^[A-Za-z0-9_-]+$'
      description: Opaque, single-use receipt issued after a verified provider response.
    FederatedReceipt:
      type: object
      additionalProperties: false
      required: [receipt, expiresAt]
      properties:
        receipt:
          $ref: '#/components/schemas/FederatedReceiptToken'
        expiresAt:
          type: string
          format: date-time
          description: At most two minutes after issue.
    FederatedSignInFinish:
      type: object
      additionalProperties: false
      required: [receipt, client]
      properties:
        receipt:
          $ref: '#/components/schemas/FederatedReceiptToken'
        client:
          $ref: '#/components/schemas/Client'
        trustedDeviceToken:
          $ref: '#/components/schemas/TrustedDeviceToken'
    RealtimeTicketIssuance:
      type: object
      required: [sessionId]
      additionalProperties: false
      properties:
        sessionId:
          type: string
          format: uuid
          description: The session of the verified browser request, as returned by introspection.
    RealtimeTicket:
      $ref: '../../components/realtime.yaml#/components/schemas/RealtimeTicket'
    RealtimeTicketRedemption:
      type: object
      required: [token]
      additionalProperties: false
      properties:
        token:
          $ref: '../../components/realtime.yaml#/components/schemas/RealtimeTicketToken'
          writeOnly: true
    RealtimeSession:
      type: object
      required:
        [sessionId, sessionVersion, userId, organizationId, memberId, role, sessionExpiresAt]
      additionalProperties: false
      properties:
        sessionId:
          type: string
          format: uuid
          description: Identifies the session for the revocation subscription.
        sessionVersion:
          type: integer
          minimum: 1
          description: The Identity session version after the authorization check. It advances on organization change or revocation.
        userId:
          type: string
          format: uuid
          description: The authenticated socket user.
        organizationId:
          type: string
          format: uuid
          description: The currently authorized organization of this connection.
        memberId:
          type: string
          format: uuid
          description: |
            Its verified active membership in that organization. The personal room uses
            `member:<memberId>`. For events keyed by user ID, resolve the membership by both
            organization ID and user ID before addressing that room.
        role:
          $ref: '#/components/schemas/Role'
        sessionExpiresAt:
          type: string
          format: date-time
          pattern: 'Z$'
          description: |
            The earlier of the session's absolute expiration and its current inactivity
            deadline. Close the socket by this instant even if no revocation event arrives.
        samlSourceMembership:
          type: object
          additionalProperties: false
          required: [organizationId, memberId]
          description: |
            The active membership that authorized the SAML sign-in. Present in every successful
            redemption for a SAML session. It can differ from the connection's current
            organization membership. Realtime verifies both for the authenticated user and
            closes the socket if either membership ceases to grant access.
          properties:
            organizationId:
              type: string
              format: uuid
            memberId:
              type: string
              format: uuid
    Email:
      type: string
      format: email
      maxLength: 254
      description: Email address, compared without regard to case.
      examples: [camille.martin@ateliernord.fr]
    Language:
      type: string
      description: BCP 47 language tag of the account, used for its emails. `fr` by default.
      examples: [fr]
    VerifiedEmail:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          $ref: '#/components/schemas/Email'
    NotificationRecipient:
      type: object
      additionalProperties: false
      required: [email, language, timeZone, version]
      properties:
        email:
          $ref: '#/components/schemas/Email'
        language:
          $ref: '#/components/schemas/Language'
        timeZone:
          type: string
          minLength: 1
          maxLength: 64
          description: The account's IANA time zone name.
          examples: [Europe/Paris]
        version:
          type: integer
          minimum: 1
          description: Monotone account version as returned by the account route.
    Client:
      type: object
      required: [ipAddress, userAgent]
      description: |
        The browser a request came from, as the gateway saw it. Stored with the session it opens,
        to show its device and address; shown in the security email of the request. No place is
        derived from the address. Never logged with a token.
      properties:
        ipAddress:
          type: string
          minLength: 2
          maxLength: 45
          description: IPv4 or IPv6 address of the browser, from the one proxy hop the gateway trusts.
          examples: [86.247.12.30]
        userAgent:
          type: [string, 'null']
          maxLength: 1024
          description: '`User-Agent` header of the browser, `null` when it sent none.'
    SignInMethodsRequest:
      type: object
      required: [email]
      properties:
        email:
          $ref: '#/components/schemas/Email'
    SignInMethods:
      type: object
      required: [methods]
      properties:
        methods:
          type: array
          items:
            $ref: '#/components/schemas/SignInMethod'
    SignInMethod:
      type: object
      required: [type]
      properties:
        type:
          type: string
          description: |
            `password` or `email-code` today. Later versions add other types without a new version
            (`x-extensible-enum`); the gateway passes them on.
          x-extensible-enum: [password, email-code]
    SignUpRequest:
      type: object
      required: [name, email, password, acceptTerms]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
          description: |
            Full name, as typed; surrounding spaces are removed, and a name made only of spaces is
            refused with `400 request.invalid`.
          examples: [Camille Martin]
        email:
          $ref: '#/components/schemas/Email'
        password:
          type: string
          maxLength: 256
          description: At least 12 characters, checked here (`auth.password-too-short`). Never logged.
        acceptTerms:
          type: boolean
    CodeRequest:
      type: object
      required: [email]
      properties:
        email:
          $ref: '#/components/schemas/Email'
    CodeSent:
      type: object
      required: [email, expiresAt, resendAvailableAt]
      properties:
        email:
          $ref: '#/components/schemas/Email'
        expiresAt:
          type: string
          format: date-time
        resendAvailableAt:
          type: string
          format: date-time
    SignUpVerification:
      type: object
      required: [email, code, client]
      description: |
        The code of a sign-up and the password that binds the verification to that sign-up. See
        `POST /internal/v1/auth/sign-up/verification` for the order of the checks.
      properties:
        email:
          $ref: '#/components/schemas/Email'
        code:
          type: string
          pattern: '^[0-9]{6}$'
          description: Never logged.
          examples: ['482913']
        rememberMe:
          type: boolean
          default: false
        password:
          type: string
          maxLength: 256
          description: |
            The password typed in the sign-up form, as the public request carried it. Once the code
            is right, it is compared with the password of the latest sign-up of the address: a
            different one answers `422 auth.sign-up-replaced`. Required once the address was signed
            up more than once before the verification: without it the answer is the same. Never
            logged.
        client:
          $ref: '#/components/schemas/Client'
    CodeVerification:
      type: object
      required: [email, code, client]
      properties:
        email:
          $ref: '#/components/schemas/Email'
        code:
          type: string
          pattern: '^[0-9]{6}$'
          description: Never logged.
          examples: ['482913']
        rememberMe:
          type: boolean
          default: false
        client:
          $ref: '#/components/schemas/Client'
        trustedDeviceToken:
          $ref: '#/components/schemas/TrustedDeviceToken'
    PasswordSignIn:
      type: object
      required: [email, password, client]
      properties:
        email:
          $ref: '#/components/schemas/Email'
        password:
          type: string
          minLength: 1
          maxLength: 256
          description: Never logged.
        rememberMe:
          type: boolean
          default: false
        client:
          $ref: '#/components/schemas/Client'
        trustedDeviceToken:
          $ref: '#/components/schemas/TrustedDeviceToken'
    SessionIssued:
      type: object
      required: [token, session, user]
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 256
          description: |
            Opaque session token (256 random bits), returned once. A secret: never logged, never
            stored by the gateway.
        session:
          $ref: '#/components/schemas/Session'
        user:
          $ref: '#/components/schemas/User'
        deletionCancelled:
          type: boolean
          description: |
            `true` when this sign-in cancelled the scheduled deletion of the account; the gateway
            passes it on in the public answer. Absent or `false` otherwise.
        trustedDevice:
          $ref: '#/components/schemas/TrustedDevice'
    Session:
      type: object
      required: [id, expiresAt, persistent]
      properties:
        id:
          type: string
          format: uuid
        expiresAt:
          type: string
          format: date-time
          description: When the session ends at the latest, whatever its activity.
        persistent:
          type: boolean
          description: '`true` when `rememberMe` was: the cookie lasts until `expiresAt`, else until the browser closes.'
    IntrospectionRequest:
      type: object
      required: [token]
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 256
          description: Value of the session cookie. A secret, never logged.
    Introspection:
      oneOf:
        - $ref: '#/components/schemas/ActiveToken'
        - $ref: '#/components/schemas/InactiveToken'
    ActiveToken:
      type: object
      required: [active, tokenType, sessionId, userId, organizationId, role, scopes, expiresAt]
      properties:
        active:
          type: boolean
          const: true
        tokenType:
          type: string
          description: |
            Kind of token: always `session` on this route. A personal API token is introspected by
            `POST /internal/v1/api-tokens/introspect`, which answers `api-token`. Later versions
            may add kinds without a new version (`x-extensible-enum`).
          x-extensible-enum: [session]
        sessionId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        organizationId:
          type: [string, 'null']
          format: uuid
          description: |
            Current organization of the session (`PUT /internal/v1/sessions/{sessionId}/organization`);
            `null` when it has none, when the membership it was chosen through was removed
            (`member.removed.v1`), or while it is withheld for want of two-step verification, which
            `withheldOrganization` then names: the gateway never builds an organization context
            from an answer that carries `withheldOrganization`. A session whose organization was emptied by a removal stays
            without one, even after the person joins the organization again with a new membership,
            until an organization is chosen again; a new session starts in the last organization
            the person chose, if they are a member of it.
        role:
          type: [string, 'null']
          description: |
            Role of the user in that organization, from the copy of the memberships: `owner`,
            `admin`, `member` or `guest`; `null` without an organization, also while it is
            withheld. The gateway carries it in the internal token; organization-service decides
            from its own members.
        scopes:
          type: array
          description: |
            Scopes the token grants. A session holds every scope: `tasks:read`, `tasks:write`,
            `members:read` and `webhooks:manage` today, more as they are added.
          items:
            type: string
        expiresAt:
          type: string
          format: date-time
          description: When the session ends at the latest.
        withheldOrganization:
          $ref: '#/components/schemas/WithheldOrganization'
    InactiveToken:
      type: object
      required: [active]
      properties:
        active:
          type: boolean
          const: false
    User:
      type: object
      required: [id, name, email, language, version]
      description: |
        An account. identity-service always sends `displayName`, `jobTitle` and `timeZone` from this
        version on; they are optional here so that the API gateway can move to this version of the
        contracts before identity-service does. Until then the gateway answers them as `null`,
        `null` and `Europe/Paris`, their values for an account that never set them.
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          examples: [Camille Martin]
        email:
          $ref: '#/components/schemas/Email'
        language:
          $ref: '#/components/schemas/Language'
        displayName:
          type: [string, 'null']
          description: Name used for the mentions; `null` until the person chooses one.
          examples: [camille]
        jobTitle:
          type: [string, 'null']
          description: Job title; `null` when there is none.
          examples: [Responsable produit]
        avatarId:
          type: [string, 'null']
          format: uuid
          description: Current opaque avatar reference or null. The account owns it independently of any organization.
        timeZone:
          type: string
          description: IANA time zone name; `Europe/Paris` until the person chooses another.
          examples: [Europe/Paris]
        passwordChangedAt:
          type: string
          format: date-time
          description: |
            When the password was last set: at the sign-up, by a change or by a reset.
            identity-service always sends it from this version on; it is optional so that the
            gateway can move to this version first, and the gateway leaves it out of the public
            answer until identity-service sends it.
        version:
          type: integer
          minimum: 1
          description: |
            Version of the account. A change of the profile, avatar, password, address,
            two-step verification or scheduled deletion makes it the next one.
    Role:
      $ref: '../../components/organization.yaml#/components/schemas/Role'
    ProfilePatch:
      type: object
      description: JSON Merge Patch of the profile, as the public request carried it.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
          description: Full name, trimmed here; a name made only of spaces answers `400 request.invalid`.
        displayName:
          type: [string, 'null']
          minLength: 1
          maxLength: 60
        jobTitle:
          type: [string, 'null']
          minLength: 1
          maxLength: 120
        timeZone:
          type: string
          minLength: 1
          maxLength: 64
          description: IANA time zone name, checked here.
        language:
          type: string
          enum: [fr, en, de, es]
    OrganizationChoice:
      type: object
      required: [organizationId]
      properties:
        organizationId:
          type: string
          format: uuid
    SessionOrganization:
      type: object
      required: [organizationId, role]
      properties:
        organizationId:
          type: string
          format: uuid
        role:
          $ref: '#/components/schemas/Role'
          description: Role of the actor in it, from the copy of the memberships.
    ApiTokenScope:
      type: string
      description: A scope a personal API token can be given.
      enum: [tasks:read, tasks:write, members:read, webhooks:manage]
    ApiTokenCreation:
      type: object
      required: [name, scopes]
      properties:
        sessionId:
          type: string
          format: uuid
          description: |
            The session of the public request, as the introspection returned it, whose recent
            authentication is checked. The gateway always sends it: without it the creation answers
            `403 auth.reauthentication-required`. It is optional in the schema only so that adding
            it changes no existing request.
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: Name as typed; trimmed here, a name made only of spaces answers `400 request.invalid`.
        scopes:
          type: array
          minItems: 1
          maxItems: 4
          description: At least one; the same scope twice counts once.
          items:
            $ref: '#/components/schemas/ApiTokenScope'
        expiration:
          type: string
          default: 30-days
          description: Lifetime counted from the creation; `never` gives no expiry.
          enum: [30-days, 90-days, 1-year, never]
    ApiToken:
      type: object
      required: [id, name, prefix, scopes, organizationId, createdAt, expiresAt, lastUsedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        prefix:
          type: string
          minLength: 11
          maxLength: 11
          description: First 11 characters of the secret.
        scopes:
          type: array
          items:
            type: string
            x-extensible-enum: [tasks:read, tasks:write, members:read, webhooks:manage]
        organizationId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: [string, 'null']
          format: date-time
        lastUsedAt:
          type: [string, 'null']
          format: date-time
          description: Recorded at most once a minute.
    ApiTokenCreated:
      type: object
      required: [apiToken, secret]
      properties:
        apiToken:
          $ref: '#/components/schemas/ApiToken'
        secret:
          type: string
          pattern: '^cw_pat_[0-9A-Za-z]{36}$'
          description: The token, returned once. A secret, never logged, never stored by the gateway.
    ApiTokenPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ApiToken'
        nextCursor:
          $ref: '../../components/http.yaml#/components/schemas/NextCursor'
    ApiTokenIntrospectionRequest:
      type: object
      required: [token]
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 256
          description: Value of the bearer token. A secret, never logged.
    ApiTokenIntrospection:
      oneOf:
        - $ref: '#/components/schemas/ActiveApiToken'
        - $ref: '#/components/schemas/InactiveToken'
    ActiveApiToken:
      type: object
      required: [active, tokenType, apiTokenId, userId, organizationId, role, scopes, expiresAt]
      properties:
        active:
          type: boolean
          const: true
        tokenType:
          type: string
          description: Always `api-token` on this route (`x-extensible-enum`).
          x-extensible-enum: [api-token]
        apiTokenId:
          type: string
          format: uuid
          description: Id of the token; the gateway counts its rate limit on it.
        userId:
          type: string
          format: uuid
        organizationId:
          type: string
          format: uuid
          description: |
            Organization the token acts in, the one it was created in; still set while it is
            withheld (`withheldOrganization`), when the token acts on nothing.
        role:
          $ref: '#/components/schemas/Role'
          description: Role of the user in it, from the copy of the memberships; still set while withheld.
        scopes:
          type: array
          description: |
            Scopes of the token; the gateway refuses a route whose `apiToken` requirement names a
            scope it lacks. Empty while the organization is withheld (`withheldOrganization`), so
            that a gateway that does not read `withheldOrganization` refuses every route too; the
            gateway never builds an organization context from such an answer.
          items:
            type: string
        expiresAt:
          type: [string, 'null']
          format: date-time
          description: When the token stops working; `null` for a token without expiry.
        withheldOrganization:
          $ref: '#/components/schemas/WithheldOrganization'
    PasswordResetRequest:
      type: object
      required: [email, client]
      properties:
        email:
          $ref: '#/components/schemas/Email'
        client:
          $ref: '#/components/schemas/Client'
          description: The browser that asks for the link, shown in the email.
    PasswordResetLinkSent:
      type: object
      required: [email, expiresAt, resendAvailableAt]
      description: Answered the same way whether or not a link was issued.
      properties:
        email:
          $ref: '#/components/schemas/Email'
        expiresAt:
          type: string
          format: date-time
          description: When a link issued now stops working, 30 minutes later.
        resendAvailableAt:
          type: string
          format: date-time
          description: 45 seconds later, or the end of the hour once 5 links were asked for the address in it.
    ResetToken:
      type: string
      minLength: 1
      maxLength: 256
      description: |
        The token of the reset link, as the public request carried it. A secret, never logged;
        identity-service keeps only its SHA-256 hash.
    PasswordResetToken:
      type: object
      required: [token]
      properties:
        token:
          $ref: '#/components/schemas/ResetToken'
    PasswordResetLink:
      type: object
      required: [email, expiresAt, sessionCount]
      properties:
        email:
          $ref: '#/components/schemas/Email'
          description: Address of the account of the link.
        expiresAt:
          type: string
          format: date-time
        sessionCount:
          type: integer
          minimum: 0
          description: Open sessions of the account.
    PasswordResetConfirmation:
      type: object
      required: [token, newPassword, client]
      properties:
        token:
          $ref: '#/components/schemas/ResetToken'
        newPassword:
          type: string
          maxLength: 256
          description: At least 12 characters, checked here (`auth.password-too-short`). Never logged.
        closeOtherSessions:
          type: boolean
          default: true
          description: Revokes every open session of the account; `false` leaves them open.
        client:
          $ref: '#/components/schemas/Client'
          description: The browser the new password is chosen in, shown in the email.
    PasswordResetCompleted:
      type: object
      required: [email, closedSessionCount]
      properties:
        email:
          $ref: '#/components/schemas/Email'
        closedSessionCount:
          type: integer
          minimum: 0
    ReauthenticationRequest:
      type: object
      description: |
        `password` for an account without two-step verification, `code` for an account with it.
        Both or neither answer `400 request.invalid`, `password` for an account with two-step
        verification `403 auth.reauthentication-required`, and `code` without an authenticator
        app `409 auth.two-step-not-enabled`, checked here.
      properties:
        password:
          type: string
          minLength: 1
          maxLength: 256
          description: Never logged.
        code:
          $ref: '#/components/schemas/TwoStepCode'
    RecentAuthentication:
      type: object
      required: [authenticatedAt, expiresAt]
      properties:
        authenticatedAt:
          type: string
          format: date-time
          description: The recent authentication recorded for the session.
        expiresAt:
          type: string
          format: date-time
          description: 10 minutes later, when the guarded routes require it again.
    PasswordChange:
      type: object
      required: [sessionId, currentPassword, newPassword, client]
      properties:
        sessionId:
          type: string
          format: uuid
          description: The session of the public request, which the right current password authenticates again.
        currentPassword:
          type: string
          minLength: 1
          maxLength: 256
          description: Never logged.
        newPassword:
          type: string
          maxLength: 256
          description: At least 12 characters, checked here (`auth.password-too-short`). Never logged.
        client:
          $ref: '#/components/schemas/Client'
          description: The browser the password is changed in, shown in the email.
    EmailChangeRequest:
      type: object
      required: [sessionId, email]
      properties:
        sessionId:
          type: string
          format: uuid
          description: The session of the public request, whose recent authentication is checked.
        email:
          $ref: '#/components/schemas/Email'
          description: The new address.
    EmailChangeCodeSent:
      type: object
      required: [email, expiresAt, resendAvailableAt]
      properties:
        email:
          $ref: '#/components/schemas/Email'
          description: The new address.
        expiresAt:
          type: string
          format: date-time
          description: 15 minutes after the code was issued.
        resendAvailableAt:
          type: string
          format: date-time
          description: 30 seconds later, or the end of the hour once 5 codes were asked for the new address in it.
    EmailChangeConfirmation:
      type: object
      required: [sessionId, code, client]
      properties:
        sessionId:
          type: string
          format: uuid
          description: The session of the public request.
        code:
          type: string
          pattern: '^[0-9]{6}$'
          description: Never logged.
          examples: ['731406']
        client:
          $ref: '#/components/schemas/Client'
          description: The browser the address is confirmed in, shown in the notice to the previous address.
    DeletionRequest:
      type: object
      required: [sessionId]
      properties:
        sessionId:
          type: string
          format: uuid
          description: The session of the public request, whose recent authentication is checked; it is revoked too.
    DeletionScheduled:
      type: object
      required: [deleteAt]
      properties:
        deleteAt:
          type: string
          format: date-time
          description: 30 days after the scheduling.
    Device:
      type: object
      required: [type, browser, browserVersion, os, osVersion]
      description: |
        The device of a session, read with `bowser` from the `User-Agent` of its `client`. A member
        that cannot be read is `null`.
      properties:
        type:
          type: string
          description: '`desktop`, `mobile`, `tablet` or `unknown` today; more later (`x-extensible-enum`).'
          x-extensible-enum: [desktop, mobile, tablet, unknown]
        browser:
          type: [string, 'null']
          examples: [Firefox]
        browserVersion:
          type: [string, 'null']
          description: Major version.
          examples: ['132']
        os:
          type: [string, 'null']
          examples: [Windows]
        osVersion:
          type: [string, 'null']
          description: '`null` when the `User-Agent` does not tell it reliably (Windows 10 and 11, macOS).'
          examples: ['18.1']
    OpenSession:
      type: object
      required: [id, current, device, ipAddress, signedInAt, lastActiveAt, expiresAt]
      properties:
        id:
          type: string
          format: uuid
        current:
          type: boolean
          description: '`true` for `currentSessionId`.'
        device:
          $ref: '#/components/schemas/Device'
        ipAddress:
          type: string
          description: Address of the `client` of the sign-in that opened the session.
          examples: [192.0.2.14]
        signedInAt:
          type: string
          format: date-time
        lastActiveAt:
          type: string
          format: date-time
          description: Last active introspection, recorded at most once a minute.
        expiresAt:
          type: string
          format: date-time
        inactivityTimeoutMinutes:
          type: integer
          minimum: 1
          description: |
            Minutes of inactivity after which the session closes, from the policy of its current
            organization, 720 without one. Always sent from this version on; optional so that the
            gateway can move to this version first.
          examples: [720]
    OpenSessionPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/OpenSession'
        nextCursor:
          $ref: '../../components/http.yaml#/components/schemas/NextCursor'
    RevokedSessions:
      type: object
      required: [revokedCount]
      properties:
        revokedCount:
          type: integer
          minimum: 0
          description: Sessions revoked by the request.
    TrustedDeviceToken:
      type: string
      minLength: 1
      maxLength: 256
      description: |
        Value of the cookie `__Host-cw_trusted_device` of the request, which the gateway forwards
        when the browser sent one of 1 to 256 characters, and leaves out otherwise. A secret, never
        logged; identity-service compares its SHA-256 hash with the trusted devices of the
        account. Unknown, expired, forgotten, of another account or malformed: ignored, the
        sign-in answers its challenge.
    TrustedDevice:
      type: object
      required: [token, expiresAt]
      description: |
        The device the answer of a challenge with `trustDevice` made trusted. The gateway writes
        `token` into `__Host-cw_trusted_device` (`Path=/; Secure; HttpOnly; SameSite=Strict;
        Max-Age=2592000`, 30 days, which is `expiresAt`), and passes nothing of it on in the public
        body.
      properties:
        token:
          type: string
          minLength: 32
          maxLength: 256
          description: Opaque device token (256 random bits, base64url), returned once. A secret, never logged.
        expiresAt:
          type: string
          format: date-time
          description: 30 days after the answer.
    WithheldOrganization:
      type: object
      required: [organizationId, code]
      description: |
        The organization a session or a token would act on, withheld because its authentication
        policy requires two-step verification for the role of the person, who has none. The
        gateway answers `403` with `code` and `details.organizationId` on the routes that need an
        organization. Absent when nothing is withheld.
      properties:
        organizationId:
          type: string
          format: uuid
        code:
          type: string
          description: The code the gateway answers, `organization.mfa-required` today (`x-extensible-enum`).
          x-extensible-enum: [organization.mfa-required]
    TwoStepCode:
      type: string
      pattern: '^[0-9]{6}$'
      description: The 6 digits of the authenticator app. A time step already accepted is refused. Never logged.
      examples: ['261845']
    ChallengeToken:
      type: string
      minLength: 1
      maxLength: 256
      description: |
        The token of a two-step challenge, as the public request carried it. A secret, never
        logged; identity-service keeps only its SHA-256 hash.
    ChallengeTokenRequest:
      type: object
      required: [token]
      properties:
        token:
          $ref: '#/components/schemas/ChallengeToken'
    TwoStepMethod:
      type: string
      description: '`authenticator-app`, `security-key` or `backup-code` today; more later (`x-extensible-enum`).'
      x-extensible-enum: [authenticator-app, security-key, backup-code]
    SignInChallenge:
      type: object
      required:
        [
          token,
          expiresAt,
          email,
          name,
          primaryMethod,
          methods,
          securityKeys,
          backupCodesRemaining,
          lockedUntil,
        ]
      description: |
        A two-step challenge, the `202` of the sign-ins and the `200` of its inspection, which the
        gateway answers as is.
      properties:
        token:
          type: string
          minLength: 32
          maxLength: 256
          description: The secret of the challenge (256 random bits, base64url). Never logged.
          examples: [ExampleOnlyChallengeToken00000000000000000]
        expiresAt:
          type: string
          format: date-time
          description: 10 minutes after the sign-in that issued it.
        email:
          $ref: '#/components/schemas/Email'
        name:
          type: string
          examples: [Camille Martin]
        primaryMethod:
          $ref: '#/components/schemas/TwoStepMethod'
        methods:
          type: array
          minItems: 1
          description: |
            `authenticator-app`, then `security-key` with a key, then `backup-code` while one is
            left. No upper bound: later versions may add methods, which the gateway passes on.
          items:
            $ref: '#/components/schemas/TwoStepMethod'
        securityKeys:
          type: array
          maxItems: 10
          items:
            type: object
            required: [name]
            properties:
              name:
                type: string
                examples: [YubiKey 5C NFC]
        backupCodesRemaining:
          type: integer
          minimum: 0
          maximum: 10
        lockedUntil:
          type: [string, 'null']
          format: date-time
          description: End of the lockout of the two-step answers of the account, `null` without one.
    TrustDevice:
      type: boolean
      default: false
      description: Make the browser a trusted device of the account for 30 days (`trustedDevice` in the answer).
    AuthenticatorAppAnswer:
      type: object
      required: [token, code, client]
      properties:
        token:
          $ref: '#/components/schemas/ChallengeToken'
        code:
          $ref: '#/components/schemas/TwoStepCode'
        trustDevice:
          $ref: '#/components/schemas/TrustDevice'
        client:
          $ref: '#/components/schemas/Client'
          description: The browser the session opens for.
    BackupCodeAnswer:
      type: object
      required: [token, code, client]
      properties:
        token:
          $ref: '#/components/schemas/ChallengeToken'
        code:
          type: string
          pattern: '^[0-9A-Za-z]{4}-?[0-9A-Za-z]{4}$'
          description: A backup code, compared upper-cased and without its dash. Never logged.
          examples: [4F7K-2M9Q]
        trustDevice:
          $ref: '#/components/schemas/TrustDevice'
        client:
          $ref: '#/components/schemas/Client'
          description: The browser the session opens for.
    SecurityKeyAnswer:
      type: object
      required: [token, credential, client]
      properties:
        token:
          $ref: '#/components/schemas/ChallengeToken'
        credential:
          $ref: '#/components/schemas/SecurityKeyAssertion'
        trustDevice:
          $ref: '#/components/schemas/TrustDevice'
        client:
          $ref: '#/components/schemas/Client'
          description: The browser the session opens for.
    WebAuthnCredentialDescriptor:
      type: object
      required: [id, type]
      additionalProperties: true
      description: '`PublicKeyCredentialDescriptorJSON`; members not listed here are kept.'
      properties:
        id:
          type: string
        type:
          type: string
          examples: [public-key]
        transports:
          type: array
          items:
            type: string
    WebAuthnRequestOptions:
      type: object
      required: [challenge]
      additionalProperties: true
      description: |
        `PublicKeyCredentialRequestOptionsJSON`, as `@simplewebauthn/server` generates it; members
        not listed here are kept, and the gateway passes the whole object on.
      properties:
        challenge:
          type: string
        rpId:
          type: string
        timeout:
          type: integer
          minimum: 1
        userVerification:
          type: string
        allowCredentials:
          type: array
          maxItems: 10
          items:
            $ref: '#/components/schemas/WebAuthnCredentialDescriptor'
    WebAuthnCreationOptions:
      type: object
      required: [challenge, rp, user, pubKeyCredParams]
      additionalProperties: true
      description: |
        `PublicKeyCredentialCreationOptionsJSON`, as `@simplewebauthn/server` generates it; members
        not listed here are kept, and the gateway passes the whole object on.
      properties:
        challenge:
          type: string
        rp:
          type: object
          required: [name]
          additionalProperties: true
          properties:
            id:
              type: string
            name:
              type: string
        user:
          type: object
          required: [id, name, displayName]
          additionalProperties: true
          properties:
            id:
              type: string
              description: Opaque WebAuthn handle of the account; not its id nor its address.
            name:
              type: string
            displayName:
              type: string
        pubKeyCredParams:
          type: array
          minItems: 1
          items:
            type: object
            required: [type, alg]
            additionalProperties: true
            properties:
              type:
                type: string
              alg:
                type: integer
        timeout:
          type: integer
          minimum: 1
        excludeCredentials:
          type: array
          maxItems: 10
          items:
            $ref: '#/components/schemas/WebAuthnCredentialDescriptor'
    SecurityKeyAssertion:
      type: object
      required: [id, rawId, type, response]
      additionalProperties: true
      description: '`AuthenticationResponseJSON`, as the public request carried it; members not listed here are kept.'
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 1024
        rawId:
          type: string
          minLength: 1
          maxLength: 1024
        type:
          type: string
        response:
          type: object
          required: [clientDataJSON, authenticatorData, signature]
          additionalProperties: true
          properties:
            clientDataJSON:
              type: string
              maxLength: 16384
            authenticatorData:
              type: string
              maxLength: 16384
            signature:
              type: string
              maxLength: 16384
            userHandle:
              type: [string, 'null']
              maxLength: 1024
        authenticatorAttachment:
          type: [string, 'null']
        clientExtensionResults:
          type: object
          additionalProperties: true
    SecurityKeyAttestation:
      type: object
      required: [id, rawId, type, response]
      additionalProperties: true
      description: '`RegistrationResponseJSON`, as the public request carried it; members not listed here are kept.'
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 1024
        rawId:
          type: string
          minLength: 1
          maxLength: 1024
        type:
          type: string
        response:
          type: object
          required: [clientDataJSON, attestationObject]
          additionalProperties: true
          properties:
            clientDataJSON:
              type: string
              maxLength: 16384
            attestationObject:
              type: string
              maxLength: 65536
            transports:
              type: array
              maxItems: 10
              items:
                type: string
        authenticatorAttachment:
          type: [string, 'null']
        clientExtensionResults:
          type: object
          additionalProperties: true
    SecurityKeyAssertionOptions:
      type: object
      required: [options, expiresAt]
      properties:
        options:
          $ref: '#/components/schemas/WebAuthnRequestOptions'
        expiresAt:
          type: string
          format: date-time
          description: 5 minutes after they were issued.
    TwoStepVerification:
      type: object
      required:
        [enabled, primaryMethod, methods, authenticatorApp, securityKeys, backupCodes, requiredBy]
      description: The two-step verification of an account, without any secret.
      properties:
        enabled:
          type: boolean
          description: On while the account has an authenticator app.
        primaryMethod:
          description: '`authenticator-app` today; `null` while off.'
          oneOf:
            - $ref: '#/components/schemas/TwoStepMethod'
            - type: 'null'
        methods:
          type: array
          description: |
            The configured methods, `authenticator-app` and `security-key` today, never
            `backup-code`; empty while off. No upper bound: later versions may add methods.
          items:
            $ref: '#/components/schemas/TwoStepMethod'
        authenticatorApp:
          type: [object, 'null']
          required: [configuredAt]
          properties:
            configuredAt:
              type: string
              format: date-time
        securityKeys:
          type: array
          maxItems: 10
          description: The oldest first.
          items:
            $ref: '#/components/schemas/SecurityKey'
        backupCodes:
          type: [object, 'null']
          required: [remaining, total, generatedAt]
          properties:
            remaining:
              type: integer
              minimum: 0
              maximum: 10
            total:
              type: integer
              minimum: 1
            generatedAt:
              type: string
              format: date-time
        requiredBy:
          type: array
          description: |
            The organizations of the copy of the memberships whose policy requires two-step
            verification for the role of the person in them.
          items:
            $ref: '#/components/schemas/TwoStepRequirement'
    TwoStepRequirement:
      type: object
      required: [organizationId, requiredFor]
      properties:
        organizationId:
          type: string
          format: uuid
        requiredFor:
          type: string
          description: '`admins` (owner and admins) or `everyone` today (`x-extensible-enum`).'
          x-extensible-enum: [admins, everyone]
    SecurityKey:
      type: object
      required: [id, name, createdAt, lastUsedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          examples: [YubiKey 5C NFC]
        createdAt:
          type: string
          format: date-time
        lastUsedAt:
          type: [string, 'null']
          format: date-time
    SessionReference:
      type: object
      required: [sessionId]
      properties:
        sessionId:
          type: string
          format: uuid
          description: The session of the public request, whose recent authentication is checked and which the pending setup belongs to.
    TwoStepChange:
      type: object
      required: [sessionId, client]
      properties:
        sessionId:
          type: string
          format: uuid
          description: The session of the public request, whose recent authentication is checked.
        client:
          $ref: '#/components/schemas/Client'
          description: The browser of the change, shown in the security email.
    AuthenticatorAppSetup:
      type: object
      required: [secret, otpauthUri, expiresAt]
      properties:
        secret:
          type: string
          pattern: '^[A-Z2-7]{32}$'
          description: The TOTP secret (160 bits, base32 without padding), returned once. Never logged.
          examples: [JBSWY3DPEHPK3PXPJBSWY3DPEHPK3PXP]
        otpauthUri:
          type: string
          maxLength: 2048
          description: The `otpauth://totp/…` URI of the secret, issuer `Cadenway`. Never logged.
        expiresAt:
          type: string
          format: date-time
          description: 15 minutes after the start.
    AuthenticatorAppConfirmation:
      type: object
      required: [sessionId, code, client]
      properties:
        sessionId:
          type: string
          format: uuid
          description: The session of the public request, whose pending setup is confirmed.
        code:
          $ref: '#/components/schemas/TwoStepCode'
        client:
          $ref: '#/components/schemas/Client'
          description: The browser of the change, shown in the security email.
    AuthenticatorAppConfigured:
      type: object
      required: [twoStepVerification, backupCodes]
      properties:
        twoStepVerification:
          $ref: '#/components/schemas/TwoStepVerification'
        backupCodes:
          description: The 10 backup codes when two-step verification turned on, returned once; `null` for a reconfiguration.
          oneOf:
            - $ref: '#/components/schemas/BackupCodes'
            - type: 'null'
    BackupCodes:
      type: object
      required: [codes, generatedAt]
      properties:
        codes:
          type: array
          minItems: 10
          maxItems: 10
          description: |
            10 codes `XXXX-XXXX`, returned once; identity-service keeps only their HMAC-SHA-256
            under a key derived from the pepper, outside the database, as for the one-time codes.
            Never logged.
          items:
            type: string
            pattern: '^[0-9A-Z]{4}-[0-9A-Z]{4}$'
        generatedAt:
          type: string
          format: date-time
    SecurityKeyRegistration:
      type: object
      required: [options, expiresAt]
      properties:
        options:
          $ref: '#/components/schemas/WebAuthnCreationOptions'
        expiresAt:
          type: string
          format: date-time
          description: 5 minutes after the start.
    SecurityKeyAddition:
      type: object
      required: [sessionId, name, credential, client]
      properties:
        sessionId:
          type: string
          format: uuid
          description: The session of the public request, whose pending registration is answered.
        name:
          type: string
          minLength: 1
          maxLength: 60
          description: Trimmed here; a name made only of spaces answers `400 request.invalid`.
        credential:
          $ref: '#/components/schemas/SecurityKeyAttestation'
        client:
          $ref: '#/components/schemas/Client'
          description: The browser of the change, shown in the security email.
    AuthenticationPolicy:
      type: object
      required:
        [
          twoStepVerificationRequiredFor,
          sessionInactivityTimeoutMinutes,
          membersWithoutTwoStepVerification,
          version,
        ]
      properties:
        twoStepVerificationRequiredFor:
          type: string
          description: '`nobody` (default), `admins` or `everyone` today (`x-extensible-enum`).'
          x-extensible-enum: [nobody, admins, everyone]
        sessionInactivityTimeoutMinutes:
          type: integer
          minimum: 1
          description: '`60`, `720` (default), `10080` or `43200` today (`x-extensible-enum`).'
          x-extensible-enum: [60, 720, 10080, 43200]
        membersWithoutTwoStepVerification:
          type: object
          required: [admins, everyone]
          description: Members of the copy of the memberships whose account has no two-step verification.
          properties:
            admins:
              type: integer
              minimum: 0
              description: The owner and the admins among them.
            everyone:
              type: integer
              minimum: 0
              description: All of them, guests included.
        version:
          type: integer
          minimum: 1
          description: Version of the policy, also sent as `ETag`; 1 for the default policy.
    AuthenticationPolicyPatch:
      type: object
      description: JSON Merge Patch of the policy, as the public request carried it.
      properties:
        twoStepVerificationRequiredFor:
          type: string
          enum: [nobody, admins, everyone]
        sessionInactivityTimeoutMinutes:
          type: integer
          enum: [60, 720, 10080, 43200]
