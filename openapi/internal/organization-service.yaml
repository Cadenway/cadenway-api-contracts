# Internal routes of organization-service, called by the API gateway for organizations,
# members, invitations and the member name lookup for list CSV export and notifications.
openapi: 3.1.0
info:
  title: organization-service internal routes
  version: 1.0.0
  description: |
    What organization-service exposes to the API gateway for organizations, members and
    invitations, and the member name lookup it uses for CSV export and notifications. The service has no
    public route: the gateway serves `openapi/public/organizations.yaml` and
    `openapi/public/members.yaml` and calls the corresponding internal routes.

    | Public route | Internal call |
    | --- | --- |
    | `POST /v1/organizations` | `POST /internal/v1/organizations` |
    | `GET /v1/organizations` | `GET /internal/v1/organizations` |
    | `GET /v1/organization` | `GET /internal/v1/organization` |
    | `PATCH /v1/organization` | `PATCH /internal/v1/organization` |
    | `POST /v1/organization/logo/uploads` | `POST /internal/v1/organization/logo/uploads` before Storage signs the transfer |
    | `PUT /v1/organization/logo` | Check `GET /internal/v1/organization/logo/uploads/{uploadId}`, prepare pending assets through Storage, then `PUT /internal/v1/organization/logo` |
    | `DELETE /v1/organization/logo` | `DELETE /internal/v1/organization/logo` |
    | `GET /v1/organization/logo` | `GET /internal/v1/organization` for current membership and logo reference before Storage reads it |
    | `PUT /v1/session/organization` | `PUT /internal/v1/sessions/{sessionId}/organization` of identity-service |
    | `GET /v1/members` | `GET /internal/v1/members` |
    | `GET /v1/members/{memberId}` | `GET /internal/v1/members/{memberId}` |
    | `PATCH /v1/members/{memberId}` | `PATCH /internal/v1/members/{memberId}` |
    | `DELETE /v1/members/{memberId}` | `DELETE /internal/v1/members/{memberId}` |
    | `POST /v1/invitations` | `POST /internal/v1/invitations` |
    | `GET /v1/invitations` | `GET /internal/v1/invitations` |
    | `DELETE /v1/invitations/{invitationId}` | `DELETE /internal/v1/invitations/{invitationId}` |
    | `POST /v1/invitations/{invitationId}/resend` | `POST /internal/v1/invitations/{invitationId}/resend` |
    | `GET /v1/me/invitations` | `GET /internal/v1/users/{userId}/invitations` with the user the introspection returned |
    | `POST /v1/me/invitations/{invitationId}/accept` | `POST /internal/v1/users/{userId}/invitations/{invitationId}/accept` |
    | `POST /v1/me/invitations/{invitationId}/refuse` | `POST /internal/v1/users/{userId}/invitations/{invitationId}/refuse` |

    **Internal token.** Every call carries the internal token of `@cadenway/nest-common`
    (`Authorization: Bearer`, Ed25519, 60 seconds, `aud` = `organization-service`). Gateway routes
    accept the issuer `api-gateway` and the actor `user` only. The isolated Search routes accept
    `search-service` with the actor and scope declared by each operation. Each operation says whether it
    requires an organization: an organization-scoped route acts on the organization of the token,
    the current organization of the session or the organization of the personal API token, and
    runs in the tenant transaction of that organization. A route that requires no organization
    ignores the one the token may carry, the current organization of the session, and opens no
    tenant transaction from it. The Search organization export instead requires an unscoped token.
    The guard of the kit answers
    `401 auth.token-missing`, `401 auth.token-invalid`, `403 auth.issuer-not-allowed`,
    `403 auth.actor-not-allowed` and `403 auth.organization-required`. The gateway answers
    `403 organization.not-selected` itself, before the call, when the session has no current
    organization.

    **Roles.** organization-service reads the role of the actor in the organization from its own
    members, never from the `role` of the token, and decides every role rule of
    `openapi/public/members.yaml` itself. It does not check the scopes: the gateway does, from the
    `security` of each public operation. An actor that does not belong to the organization of the
    token, for example a member removed since the token was signed, gets
    `404 organization.not-found`.

    **Cross-organization reads.** Listing the organizations of the actor and the invitations
    addressed to them read across organizations, with an explicit filter on the actor, outside a
    tenant transaction.

    **User directory.** organization-service keeps the id, name, address and verification of
    every account from `user.signed-up.v1`, `user.email-verified.v1`, `user.profile-updated.v1`
    and `user.email-changed.v1` (`asyncapi/identity-service.yaml`), to show names and addresses
    and to match an invitation with the account that verified its address. It reads the whole
    history of these events, not only those published after it subscribed, and applies each
    account by its `version`, so that a late `user.signed-up.v1` never overwrites a newer profile.
    On `user.deleted.v1` it removes the memberships of the account (`member.removed.v1`) and
    forgets its name and address. It also keeps whether each account has two-step verification,
    from the `enabled` of `user.two-step-verification-changed.v1`, applied by the `version` of the
    account like the other parts, `false` until an event says otherwise, for the column "Deux
    étapes" of the member list.

    The directory keeps avatar hints from `user.avatar-changed.v1` using a separate avatar version.
    Ordinary account events do not write that hint. Account deletion clears it and fences later
    deliveries. Member image reads still check live membership and resolve Identity's current
    reference before accessing Storage.

    **Errors.** The gateway forwards the `code` and the `details` and answers the French `title`
    of the public spec; the titles here are English. The internal client does not carry the
    headers of a problem: on a `429` the gateway derives `Retry-After` from `details`
    (`resendAvailableAt` or `nextAvailableAt`), as for identity-service; the `Retry-After` these
    routes send says the same to any other caller. The gateway's internal client turns any `401`
    into `503 upstream.unauthorized`, and answers `403 auth.issuer-not-allowed`,
    `403 auth.actor-not-allowed` and `403 auth.organization-required`, configuration defects, as
    `503 upstream.unauthorized` too, never to the browser.
  contact:
    name: Cadenway
    url: https://github.com/Cadenway/cadenway-api-contracts
  license:
    name: Proprietary
    url: https://github.com/Cadenway/cadenway-api-contracts/blob/main/LICENSE
  x-consumers:
    - repository: cadenway-api-gateway
      uses: >-
        Relays the organization, member and logo routes exposed in the public specs, and looks
        up names for list CSV export and authorized notification actors.
    - repository: cadenway-search-service
      uses: Enumerates organization IDs for rebuilds and checks the current signed user's membership before disclosing search results.
servers:
  - url: http://organization-service:3011
    description: organization-service on the internal network of each environment (`ORGANIZATION_SERVICE_URL`).
security:
  - internalToken: []
tags:
  - name: organizations
    description: Organizations of the actor and the organization of the token.
  - name: members
    description: Members of the organization of the token.
  - name: invitations
    description: Invitations of the organization of the token, and those addressed to the actor.
  - name: search
    description: Organization IDs for search rebuilds and current membership proofs.
paths:
  /internal/v1/organizations:
    post:
      operationId: createOrganizationInternal
      summary: Create an organization
      description: |
        Creates an organization owned by the actor, with the plan `free`, its owner member and the
        invitations of `inviteEmails` as `member`, in one transaction; derives the slug as
        `POST /v1/organizations` says. Emits `organization.created.v1`, `member.joined.v1` and one
        `invitation.issued.v1` per invited address. These invitations take their emails from the
        daily allowance of the new organization (`POST /internal/v1/invitations`), which a
        creation, 50 addresses at most, never exceeds.

        An actor that is not in the user directory yet answers `404 user.not-synchronized` and
        creates nothing. Internal token: actor `user`, no organization.
      tags: [organizations]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationCreation'
            example:
              name: Atelier Nord
              teamSize: 6-20
              primaryUse: product-engineering
              inviteEmails:
                - ines.robert@ateliernord.fr
      responses:
        '201':
          description: The organization exists and the actor is its owner.
          headers:
            Location:
              description: '`/internal/v1/organization`, where it reads with a token of this organization.'
              schema:
                type: string
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationCreated'
              example:
                organization:
                  id: 019a5f3c-8d2e-7c4a-9b1f-3e5d7a9c1b2f
                  name: Atelier Nord
                  slug: atelier-nord
                  description: null
                  website: null
                  defaultLanguage: fr
                  plan: free
                  memberCount: 1
                  role: owner
                  createdAt: '2026-03-02T09:00:00Z'
                  version: 1
                invitations:
                  - email: ines.robert@ateliernord.fr
                    outcome: invited
                    invitationId: 019a6b10-3c4d-7e5f-8a6b-7c8d9e0f1a73
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InternalTokenRefused'
        '403':
          $ref: '#/components/responses/InternalAccessRefused'
        '404':
          $ref: '#/components/responses/UserNotSynchronized'
        '409':
          $ref: '#/components/responses/SlugTaken'
        '422':
          $ref: '#/components/responses/SlugInvalid'
    get:
      operationId: listMyOrganizationsInternal
      summary: List the organizations of the actor
      description: |
        Lists the organizations the actor is a member of, sorted by name without regard to case or
        accents, then by id. Reads across organizations with a filter on the actor. Internal token:
        actor `user`, no organization.
      tags: [organizations]
      parameters:
        - $ref: '../../components/http.yaml#/components/parameters/Cursor'
        - $ref: '../../components/http.yaml#/components/parameters/Limit'
      responses:
        '200':
          description: One page of organizations.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyOrganizationPage'
              example:
                items:
                  - id: 019a5f3c-8d2e-7c4a-9b1f-3e5d7a9c1b2f
                    name: Atelier Nord
                    slug: atelier-nord
                    role: owner
                    memberCount: 18
                    plan: free
                    joinedAt: '2026-03-02T09:00:00Z'
                nextCursor: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InternalTokenRefused'
        '403':
          $ref: '#/components/responses/InternalAccessRefused'
  /internal/v1/organization:
    get:
      operationId: getOrganizationInternal
      summary: Read the organization of the token
      description: |
        Returns the organization of the token with the role of the actor in it. An actor that does
        not belong to it answers `404 organization.not-found`. Internal token: actor `user`,
        organization required.
      tags: [organizations]
      responses:
        '200':
          description: The organization.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
              examples:
                atelierNord:
                  $ref: '#/components/examples/AtelierNord'
        '401':
          $ref: '#/components/responses/InternalTokenRefused'
        '403':
          $ref: '#/components/responses/InternalAccessRefused'
        '404':
          $ref: '#/components/responses/OrganizationNotFound'
    patch:
      operationId: updateOrganizationInternal
      summary: Update the organization of the token
      description: |
        Applies a JSON Merge Patch to the organization of the token. Owner and admins only
        (`403 organization.role-forbidden`); `409 organization.slug-taken`; `If-Match` optional
        (`412 request.version-mismatch`). Emits `organization.updated.v1` when something changed.
        Internal token: actor `user`, organization required.
      tags: [organizations]
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationPatch'
            example:
              website: https://ateliernord.fr
      responses:
        '200':
          description: The organization after the change.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
              examples:
                atelierNord:
                  $ref: '#/components/examples/AtelierNord'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InternalTokenRefused'
        '403':
          $ref: '#/components/responses/RoleForbidden'
        '404':
          $ref: '#/components/responses/OrganizationNotFound'
        '409':
          $ref: '#/components/responses/SlugTaken'
        '412':
          $ref: '#/components/responses/VersionMismatch'
  /internal/v1/organization/logo/uploads:
    post:
      operationId: reserveOrganizationLogoUploadInternal
      summary: Reserve an organization logo upload
      description: |
        Allocates a pending reservation for the actor and the current logo generation before the
        gateway obtains a signed Storage transfer. Stores the bound declaration and expiry. While
        authorization still holds, an equivalent Idempotency-Key replays the original reservation
        and expiry. Internal token issuer api-gateway, actor user with an organization. Organization requires
        the current owner or admin role from its own membership state.
      tags: [organizations]
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: Key scoped to the verified actor and image owner.
          schema: { type: string, minLength: 1, maxLength: 255 }
      x-cadenway-strict-body: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../../components/profile-media.yaml#/components/schemas/StartOrganizationLogoUpload'
            example: { contentType: image/svg+xml, sizeBytes: 6120 }
      responses:
        '201':
          description: The current owner reservation.
          headers:
            Location:
              required: true
              description: Path of the owner reservation.
              schema:
                type: string
                examples:
                  [/internal/v1/organization/logo/uploads/019a7003-4d5e-7f6a-8b9c-0d1e2f3a4b01]
          content:
            application/json:
              schema:
                $ref: '../../components/profile-media.yaml#/components/schemas/ProfileMediaReservation'
              example:
                {
                  uploadId: 019a7003-4d5e-7f6a-8b9c-0d1e2f3a4b01,
                  expiresAt: '2026-11-08T08:10:00Z',
                }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InternalTokenRefused'
        '403':
          $ref: '#/components/responses/OrganizationLogoWriteForbidden'
        '404':
          $ref: '#/components/responses/OrganizationNotFound'
        '409':
          $ref: '#/components/responses/ProfileMediaReservationConflict'
        '422':
          $ref: '#/components/responses/ProfileMediaReservationRefused'
  /internal/v1/organization/logo/uploads/{uploadId}:
    parameters:
      - name: uploadId
        in: path
        required: true
        description: Opaque id allocated by the owning service.
        schema:
          $ref: '../../components/profile-media.yaml#/components/schemas/ProfileMediaId'
    get:
      operationId: getOrganizationLogoUploadStateInternal
      summary: Read organization logo upload state
      description: |
        Verifies the uploader and organization of the reservation, then reports whether it is pending
        or committed. An expired or superseded pending upload is refused. The gateway checks this
        before asking Storage to prepare a pending upload. A committed replay skips preparation.
        Internal token issuer api-gateway, actor user with an organization. Organization requires
        the current owner or admin role from its own membership state.
      tags: [organizations]
      responses:
        '200':
          description: State of the caller’s reservation.
          content:
            application/json:
              schema:
                $ref: '../../components/profile-media.yaml#/components/schemas/ProfileMediaReservationState'
              example:
                {
                  uploadId: 019a7003-4d5e-7f6a-8b9c-0d1e2f3a4b01,
                  state: pending,
                  expiresAt: '2026-11-08T08:10:00Z',
                }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InternalTokenRefused'
        '403':
          $ref: '#/components/responses/OrganizationLogoWriteForbidden'
        '404':
          $ref: '#/components/responses/OrganizationLogoOwnerOrUploadNotFound'
        '409':
          $ref: '#/components/responses/ProfileMediaUploadStateConflict'
  /internal/v1/organization/logo:
    put:
      operationId: setOrganizationLogoInternal
      summary: Publish the prepared logo
      description: |
        The gateway calls for a pending reservation only after Storage confirms preparation for the
        same id, organization and actor. Organization locks the relevant membership, organization and
        reservation, rechecks current role, generation and expiry, and persists the reference and
        `organization.logo-changed.v1` in the same transaction. An authorized committed retry returns
        the current ETag without changing the image. A stale optional If-Match on first publication
        is refused. Internal token issuer api-gateway, actor user with an organization. Organization requires
        the current owner or admin role from its own membership state.
      tags: [organizations]
      parameters:
        - name: If-Match
          in: header
          required: false
          description: Strong ETag of the current account or organization.
          schema:
            type: string
            pattern: '^"[1-9][0-9]*"$'
            examples: ['"7"']
      x-cadenway-strict-body: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../../components/profile-media.yaml#/components/schemas/SetProfileMedia'
            example: { uploadId: 019a7003-4d5e-7f6a-8b9c-0d1e2f3a4b01 }
      responses:
        '204':
          description: The logo was set or the reservation was already committed.
          headers:
            ETag:
              required: true
              description: Strong ETag of the current account or organization.
              schema: { type: string, examples: ['"8"'] }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InternalTokenRefused'
        '403':
          $ref: '#/components/responses/OrganizationLogoWriteForbidden'
        '404':
          $ref: '#/components/responses/OrganizationLogoOwnerOrUploadNotFound'
        '409':
          $ref: '#/components/responses/ProfileMediaUploadStateConflict'
        '412':
          $ref: '#/components/responses/VersionMismatch'
    delete:
      operationId: deleteOrganizationLogoInternal
      summary: Clear the organization logo
      description: |
        Clears the reference and invalidates older pending uploads under the same lock as
        publication. An actual logo change commits with `organization.logo-changed.v1`. An absent
        image leaves the organization version unchanged and emits no logo change. Internal token issuer api-gateway, actor user with an organization. Organization requires
        the current owner or admin role from its own membership state.
      tags: [organizations]
      parameters:
        - name: If-Match
          in: header
          required: false
          description: Strong ETag of the current account or organization.
          schema:
            type: string
            pattern: '^"[1-9][0-9]*"$'
            examples: ['"7"']
      responses:
        '204':
          description: The organization no longer has a logo.
          headers:
            ETag:
              required: true
              description: Strong ETag of the current account or organization.
              schema: { type: string, examples: ['"8"'] }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InternalTokenRefused'
        '403':
          $ref: '#/components/responses/OrganizationLogoWriteForbidden'
        '404':
          $ref: '#/components/responses/OrganizationNotFound'
        '412':
          $ref: '#/components/responses/VersionMismatch'
  /internal/v1/members:
    get:
      operationId: listMembersInternal
      summary: List the members
      description: |
        Lists the members of the organization of the token, with `total` and `counts` as
        `GET /v1/members` says. A guest gets `403 organization.role-forbidden`. For an actor who
        is the owner or an admin, each member carries `twoStepVerificationEnabled` from the user
        directory; for any other actor `twoStepVerificationEnabled` is absent. Internal token: actor `user`,
        organization required.
      tags: [members]
      parameters:
        - $ref: '../../components/http.yaml#/components/parameters/Cursor'
        - $ref: '../../components/http.yaml#/components/parameters/Limit'
        - name: search
          in: query
          required: false
          description: Text to find in the name or the address, without regard to case or accents.
          schema:
            type: string
            minLength: 1
            maxLength: 100
        - name: role
          in: query
          required: false
          description: Roles to keep, separated by commas.
          style: form
          explode: false
          schema:
            type: array
            minItems: 1
            maxItems: 4
            items:
              $ref: '#/components/schemas/Role'
      responses:
        '200':
          description: One page of members.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberPage'
              example:
                items:
                  - id: 019a5f3d-1a2b-7c3d-8e4f-5a6b7c8d9e41
                    userId: 019a5f3c-9e1f-7b2a-8c3d-4e5f6a7b8c31
                    name: Inès Robert
                    email: ines.robert@ateliernord.fr
                    role: admin
                    joinedAt: '2026-03-03T09:40:00Z'
                    version: 2
                nextCursor: null
                total: 1
                counts:
                  owner: 1
                  admin: 2
                  member: 15
                  guest: 4
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InternalTokenRefused'
        '403':
          $ref: '#/components/responses/RoleForbidden'
        '404':
          $ref: '#/components/responses/OrganizationNotFound'
  /internal/v1/member-names/lookup:
    post:
      operationId: lookupMemberNamesInternal
      summary: Resolve names of current organization members
      description: |
        Returns the directory names of requested accounts that currently belong to the
        organization of the token. All current members, including guests, can be the acting user.
        Read the actor's membership and the requested names in one tenant snapshot. Omit accounts
        outside the organization, departed members and accounts without a directory name.
        Case-equivalent UUIDs and repeated identifiers resolve to at most one result per account.
        Result order is unspecified. For list CSV export, the gateway supplies only assignees from
        `GET /internal/v1/lists/{listId}/tasks/export` for the same actor and organization. For
        notification display, it supplies at most 100 actor IDs from notifications whose subjects
        it has already authorized for that same actor and organization. The name lookup preserves
        the active membership requirement for both uses.

        Internal token: issuer `api-gateway` only, actor `user` and organization required.
      tags: [members]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemberNameLookup'
            example:
              userIds: [019a5f3c-8d2e-7c4a-9b1f-3e5d7a9c1b30, 019a5f3c-9e1f-7b2a-8c3d-4e5f6a7b8c31]
      responses:
        '200':
          description: The resolved account identifiers and names.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberNameLookupResult'
              example:
                items:
                  - userId: 019a5f3c-8d2e-7c4a-9b1f-3e5d7a9c1b30
                    name: Camille Martin
                  - userId: 019a5f3c-9e1f-7b2a-8c3d-4e5f6a7b8c31
                    name: Inès Robert
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InternalTokenRefused'
        '403':
          $ref: '#/components/responses/InternalAccessRefused'
        '404':
          $ref: '#/components/responses/OrganizationNotFound'
  /internal/v1/members/{memberId}:
    parameters:
      - $ref: '#/components/parameters/MemberId'
    get:
      operationId: getMemberInternal
      summary: Read a member
      description: |
        Returns a member of the organization of the token; any other id answers
        `404 member.not-found`. A guest gets `403 organization.role-forbidden`. Internal token:
        actor `user`, organization required.
      tags: [members]
      responses:
        '200':
          description: The member.
          headers:
            ETag:
              $ref: '#/components/headers/MemberETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
              examples:
                inesRobert:
                  $ref: '#/components/examples/InesRobert'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InternalTokenRefused'
        '403':
          $ref: '#/components/responses/RoleForbidden'
        '404':
          $ref: '#/components/responses/MemberNotFound'
    patch:
      operationId: changeMemberRoleInternal
      summary: Change the role of a member
      description: |
        Gives a member another role. Owner and admins only; `422 member.owner-protected` for the
        owner; `If-Match` optional (`412 request.version-mismatch`). Emits
        `member.role-changed.v1` when the role changes. Internal token: actor `user`, organization
        required.
      tags: [members]
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemberPatch'
            example:
              role: admin
      responses:
        '200':
          description: The member with their new role.
          headers:
            ETag:
              $ref: '#/components/headers/MemberETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
              examples:
                inesRobert:
                  $ref: '#/components/examples/InesRobert'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InternalTokenRefused'
        '403':
          $ref: '#/components/responses/RoleForbidden'
        '404':
          $ref: '#/components/responses/MemberNotFound'
        '412':
          $ref: '#/components/responses/VersionMismatch'
        '422':
          $ref: '#/components/responses/OwnerProtected'
    delete:
      operationId: removeMemberInternal
      summary: Remove a member
      description: |
        Removes a member of the organization of the token. Owner and admins only;
        `422 member.owner-protected` for the owner. Emits `member.removed.v1`. Internal token:
        actor `user`, organization required.
      tags: [members]
      responses:
        '204':
          description: The member is removed.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InternalTokenRefused'
        '403':
          $ref: '#/components/responses/RoleForbidden'
        '404':
          $ref: '#/components/responses/MemberNotFound'
        '422':
          $ref: '#/components/responses/OwnerProtected'
  /internal/v1/invitations:
    post:
      operationId: inviteMembersInternal
      summary: Invite people
      description: |
        Invites the addresses of the batch with one role, one outcome per distinct address, as
        `POST /v1/invitations` says. Owner and admins only. Emits one `invitation.issued.v1` per
        `invited` address. Internal token: actor `user`, organization required.

        **Daily allowance.** organization-service counts the invitation emails of each
        organization over a rolling 24 hours: every `invitation.issued.v1`, from this route, from
        the creation of the organization or from a resend, takes one, and the organization has
        100. Once the body and the role are accepted, a batch whose addresses that would be
        `invited` need more emails than remain is refused as a whole with
        `429 invitation.daily-limit-reached`: nothing is created, sent or emitted.
        `details.remaining` is what remains, `0` or more; `details.nextAvailableAt` is when the
        allowance grows again, the oldest email counted plus 24 hours; `Retry-After` is the
        seconds until then, rounded up. A batch whose addresses are all members or already invited
        needs none and is never refused.
      tags: [invitations]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitationBatch'
            example:
              emails: [marc.roux@ateliernord.fr]
              role: member
      responses:
        '200':
          description: The outcome of each address.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationBatchResult'
              example:
                invitations:
                  - email: marc.roux@ateliernord.fr
                    outcome: invited
                    invitationId: 019a6b10-3c4d-7e5f-8a6b-7c8d9e0f1a70
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InternalTokenRefused'
        '403':
          $ref: '#/components/responses/RoleForbidden'
        '404':
          $ref: '#/components/responses/OrganizationNotFound'
        '429':
          $ref: '#/components/responses/InvitationBatchLimited'
    get:
      operationId: listInvitationsInternal
      summary: List the pending invitations
      description: |
        Lists the pending invitations of the organization of the token, the expired ones included,
        the most recently sent first. Owner and admins only. Internal token: actor `user`,
        organization required.
      tags: [invitations]
      parameters:
        - $ref: '../../components/http.yaml#/components/parameters/Cursor'
        - $ref: '../../components/http.yaml#/components/parameters/Limit'
      responses:
        '200':
          description: One page of pending invitations.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationPage'
              example:
                items:
                  - id: 019a6b10-3c4d-7e5f-8a6b-7c8d9e0f1a70
                    email: marc.roux@ateliernord.fr
                    role: member
                    invitedBy:
                      userId: 019a5f3c-9e1f-7b2a-8c3d-4e5f6a7b8c31
                      name: Inès Robert
                    status: pending
                    sentAt: '2026-11-06T16:20:00Z'
                    expiresAt: '2026-11-13T16:20:00Z'
                    version: 1
                nextCursor: null
                total: 1
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InternalTokenRefused'
        '403':
          $ref: '#/components/responses/RoleForbidden'
        '404':
          $ref: '#/components/responses/OrganizationNotFound'
  /internal/v1/invitations/{invitationId}:
    parameters:
      - $ref: '#/components/parameters/InvitationId'
    delete:
      operationId: revokeInvitationInternal
      summary: Revoke an invitation
      description: |
        Revokes a pending invitation of the organization of the token; again answers `204`;
        `409 invitation.answered` once accepted or refused. Owner and admins only. Emits nothing.
        Internal token: actor `user`, organization required.
      tags: [invitations]
      responses:
        '204':
          description: The invitation is revoked.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InternalTokenRefused'
        '403':
          $ref: '#/components/responses/RoleForbidden'
        '404':
          $ref: '#/components/responses/InvitationNotFound'
        '409':
          $ref: '#/components/responses/InvitationAnswered'
  /internal/v1/invitations/{invitationId}/resend:
    parameters:
      - $ref: '#/components/parameters/InvitationId'
    post:
      operationId: resendInvitationInternal
      summary: Send an invitation again
      description: |
        Starts the 7 days of a pending invitation again, expired or not, and emits
        `invitation.issued.v1` with the next version; `409 invitation.revoked` or
        `409 invitation.answered` otherwise. Owner and admins only. Internal token: actor `user`,
        organization required.

        **Limits.** Once the invitation is found and pending, in this order:

        1. A resend less than an hour after the last sending of the invitation, its `sentAt`
           (the invitation itself or the previous resend), answers
           `429 invitation.resend-throttled` with `details.resendAvailableAt`, `sentAt` plus one
           hour, and `Retry-After`, the seconds until then, rounded up.
        2. A resend takes one email of the daily allowance of the organization (see
           `POST /internal/v1/invitations`): with none left, it answers
           `429 invitation.daily-limit-reached` with `details.remaining: 0`,
           `details.nextAvailableAt` and `Retry-After`.

        A refused resend changes nothing and emits nothing.
      tags: [invitations]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmptyRequest'
            example: {}
      responses:
        '200':
          description: The invitation, with its new expiry.
          headers:
            ETag:
              $ref: '#/components/headers/InvitationETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invitation'
              examples:
                marcRoux:
                  $ref: '#/components/examples/MarcRoux'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InternalTokenRefused'
        '403':
          $ref: '#/components/responses/RoleForbidden'
        '404':
          $ref: '#/components/responses/InvitationNotFound'
        '409':
          $ref: '#/components/responses/InvitationClosed'
        '429':
          $ref: '#/components/responses/InvitationResendLimited'
  /internal/v1/users/{userId}/invitations:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      operationId: listReceivedInvitationsInternal
      summary: List the invitations addressed to the actor
      description: |
        Lists the pending invitations, not expired, addressed to the verified address the user
        directory holds for the actor, from every organization, the most recently sent first.
        Reads across organizations with a filter on that address. Without a verified address in the
        directory yet, the list is empty. A `userId` other than the actor answers
        `404 user.not-found`. Internal token: actor `user`, no organization.
      tags: [invitations]
      parameters:
        - $ref: '../../components/http.yaml#/components/parameters/Cursor'
        - $ref: '../../components/http.yaml#/components/parameters/Limit'
      responses:
        '200':
          description: One page of invitations addressed to the actor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReceivedInvitationPage'
              example:
                items:
                  - id: 019a6b20-5e6f-7a8b-9c0d-1e2f3a4b5c80
                    organization:
                      id: 019a5f41-7c2e-7a3b-9d4f-6e8a0b2c4d61
                      name: Coopérative Lumen
                      slug: lumen
                      description: null
                      memberCount: 41
                    role: member
                    invitedBy:
                      userId: 019a5f3c-9e1f-7b2a-8c3d-4e5f6a7b8c31
                      name: Inès Robert
                    expiresAt: '2026-11-15T10:00:00Z'
                nextCursor: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InternalTokenRefused'
        '403':
          $ref: '#/components/responses/InternalAccessRefused'
        '404':
          $ref: '#/components/responses/UserNotFound'
  /internal/v1/users/{userId}/invitations/{invitationId}/accept:
    parameters:
      - $ref: '#/components/parameters/UserId'
      - $ref: '#/components/parameters/InvitationId'
    post:
      operationId: acceptInvitationInternal
      summary: Accept an invitation
      description: |
        Makes the actor a member of the organization of the invitation, with its role, in the
        tenant transaction of that organization. Checks, in this order: the invitation exists
        (`404 invitation.not-found`, also while the directory holds no verified address for the
        actor); its address is the verified address of the actor (`403 invitation.email-mismatch`);
        it is pending (`409 invitation.revoked`, `409 invitation.answered`,
        `409 invitation.expired`). Emits `member.joined.v1`. A `userId` other than the actor
        answers `404 user.not-found`. Internal token: actor `user`, no organization.
      tags: [invitations]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmptyRequest'
            example: {}
      responses:
        '200':
          description: The actor is a member of the organization.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyOrganization'
              example:
                id: 019a5f41-7c2e-7a3b-9d4f-6e8a0b2c4d61
                name: Coopérative Lumen
                slug: lumen
                role: member
                memberCount: 42
                plan: free
                joinedAt: '2026-11-08T10:30:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InternalTokenRefused'
        '403':
          $ref: '#/components/responses/InvitationForbidden'
        '404':
          $ref: '#/components/responses/InvitationOrUserNotFound'
        '409':
          $ref: '#/components/responses/InvitationNotPending'
  /internal/v1/users/{userId}/invitations/{invitationId}/refuse:
    parameters:
      - $ref: '#/components/parameters/UserId'
      - $ref: '#/components/parameters/InvitationId'
    post:
      operationId: refuseInvitationInternal
      summary: Refuse an invitation
      description: |
        Refuses an invitation addressed to the actor, with the checks of the acceptance. Emits
        nothing. Internal token: actor `user`, no organization.
      tags: [invitations]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmptyRequest'
            example: {}
      responses:
        '204':
          description: The invitation is refused.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InternalTokenRefused'
        '403':
          $ref: '#/components/responses/InvitationForbidden'
        '404':
          $ref: '#/components/responses/InvitationOrUserNotFound'
        '409':
          $ref: '#/components/responses/InvitationNotPending'
  /internal/v1/search-organizations:
    get:
      operationId: listSearchOrganizationsInternal
      summary: List organization IDs for a search rebuild
      description: |
        Requires issuer `search-service` and actor `{ type: 'system', id: 'search-service' }`, with
        no organization claim. Every response carries `Cache-Control: private, no-store`.
        Returns only organization IDs. Search then signs each owner's export request with the
        organization of that export.

        The first page fixes an upper organization ID in its read snapshot. Independent pages
        read ascending immutable IDs up to that inclusive upper bound. The opaque cursor binds
        this operation, the upper bound, and the last returned ID. The next page starts strictly
        after that ID. An invalid cursor returns `400 request.invalid`. The UTF-8 JSON body is at
        most 1,048,576 bytes. Only `nextCursor: null` marks completion. Before its scan, Search
        starts consuming durable invalidations, including `member.joined.v1`. Organization
        creation emits the owner's join, so Search can schedule an export of a new tenant even
        when its ID is outside this page sequence.
      tags: [search]
      parameters:
        - $ref: '../../components/http.yaml#/components/parameters/Cursor'
        - $ref: '../../components/http.yaml#/components/parameters/Limit'
      responses:
        '200':
          description: One page of organization IDs.
          headers:
            Cache-Control:
              $ref: '#/components/headers/SearchPrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchOrganizationPage'
              example:
                items: [019a5f3c-8d2e-7c4a-9b1f-3e5d7a9c1b2f]
                nextCursor: null
        '400':
          $ref: '#/components/responses/SearchAuthorityBadRequest'
        '401':
          $ref: '#/components/responses/SearchAuthorityTokenRefused'
        '403':
          $ref: '#/components/responses/SearchOrganizationAccessRefused'
        '503':
          $ref: '#/components/responses/SearchAuthorityUnavailable'
  /internal/v1/search-membership:
    get:
      operationId: getSearchMembershipInternal
      summary: Prove current organization membership for search
      description: |
        Requires issuer `search-service`, an actor of type `user` and an organization in the
        signed token. Search signs this call for the verified user and organization of the current
        request. Neither value comes from search input or indexed data. Every response carries
        `Cache-Control: private, no-store`.

        Returns the active membership's ID, version and role in one current tenant snapshot.
        The membership ID changes after removal and rejoining. The version is the version of
        that membership, independent of the organization's version. An unknown organization or
        absent active membership yields the same `404 organization.not-found`. The caller uses
        the proof to check that Task evaluates candidate access against the same membership
        identity and version. The proof alone grants no access to search results.
      tags: [search]
      responses:
        '200':
          description: The active membership of the signed actor in the selected organization.
          headers:
            Cache-Control:
              $ref: '#/components/headers/SearchPrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchMembership'
              example:
                memberId: 019a5f3d-1a2b-7c3d-8e4f-5a6b7c8d9e41
                role: admin
                version: 2
        '400':
          $ref: '#/components/responses/SearchAuthorityBadRequest'
        '401':
          $ref: '#/components/responses/SearchAuthorityTokenRefused'
        '403':
          $ref: '#/components/responses/SearchMembershipAccessRefused'
        '404':
          $ref: '#/components/responses/SearchMembershipNotFound'
        '503':
          $ref: '#/components/responses/SearchAuthorityUnavailable'
components:
  securitySchemes:
    internalToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Internal token of `@cadenway/nest-common`: Ed25519, 60 seconds, `aud` =
        `organization-service`. The operation defines the accepted issuer, actor and organization
        scope.
  parameters:
    UserId:
      name: userId
      in: path
      required: true
      description: Id of the account of the actor, as the introspection returned it.
      schema:
        type: string
        format: uuid
        examples: [019a5f3c-8d2e-7c4a-9b1f-3e5d7a9c1b30]
    MemberId:
      name: memberId
      in: path
      required: true
      description: Id of the membership.
      schema:
        type: string
        format: uuid
        examples: [019a5f3d-1a2b-7c3d-8e4f-5a6b7c8d9e41]
    InvitationId:
      name: invitationId
      in: path
      required: true
      description: Id of the invitation.
      schema:
        type: string
        format: uuid
        examples: [019a6b10-3c4d-7e5f-8a6b-7c8d9e0f1a70]
    IfMatch:
      name: If-Match
      in: header
      required: false
      description: '`"<version>"` the change was made from.'
      schema:
        type: string
  headers:
    SearchPrivateNoStore:
      required: true
      description: Keeps private search authority responses out of HTTP caches.
      schema:
        type: string
        const: 'private, no-store'
    ETag:
      description: Version of the organization, `"<version>"`.
      schema:
        type: string
    MemberETag:
      description: Version of the membership, `"<version>"`.
      schema:
        type: string
    InvitationETag:
      description: Version of the invitation, `"<version>"`.
      schema:
        type: string
    RetryAfter:
      description: Seconds to wait before the request can succeed (RFC 9110), rounded up.
      schema:
        type: integer
        minimum: 1
  examples:
    AtelierNord:
      summary: Atelier Nord, read by its owner
      value:
        id: 019a5f3c-8d2e-7c4a-9b1f-3e5d7a9c1b2f
        name: Atelier Nord
        slug: atelier-nord
        description: Studio de conception de mobilier et d’aménagement, 18 personnes entre Lille et Lyon.
        website: https://ateliernord.fr
        defaultLanguage: fr
        plan: free
        memberCount: 18
        role: owner
        createdAt: '2026-03-02T09:00:00Z'
        version: 3
    InesRobert:
      summary: Inès Robert, admin of Atelier Nord
      value:
        id: 019a5f3d-1a2b-7c3d-8e4f-5a6b7c8d9e41
        userId: 019a5f3c-9e1f-7b2a-8c3d-4e5f6a7b8c31
        name: Inès Robert
        email: ines.robert@ateliernord.fr
        role: admin
        joinedAt: '2026-03-03T09:40:00Z'
        version: 2
    MarcRoux:
      summary: Pending invitation of Marc Roux
      value:
        id: 019a6b10-3c4d-7e5f-8a6b-7c8d9e0f1a70
        email: marc.roux@ateliernord.fr
        role: member
        invitedBy:
          userId: 019a5f3c-9e1f-7b2a-8c3d-4e5f6a7b8c31
          name: Inès Robert
        status: pending
        sentAt: '2026-11-06T16:20:00Z'
        expiresAt: '2026-11-13T16:20:00Z'
        version: 1
    ActorNotAllowed:
      summary: Actor not accepted
      value:
        type: about:blank
        title: Forbidden
        status: 403
        code: auth.actor-not-allowed
    RoleForbidden:
      summary: Role not allowed
      value:
        type: about:blank
        title: Forbidden
        status: 403
        code: organization.role-forbidden
    InvitationRevoked:
      summary: Invitation revoked
      value:
        type: about:blank
        title: Conflict
        status: 409
        code: invitation.revoked
    InvitationAnswered:
      summary: Invitation accepted or refused already
      value:
        type: about:blank
        title: Conflict
        status: 409
        code: invitation.answered
        details:
          status: refused
    InvitationExpired:
      summary: Invitation expired
      value:
        type: about:blank
        title: Conflict
        status: 409
        code: invitation.expired
        details:
          expiresAt: '2026-11-02T15:00:00Z'
    InvitationDailyLimitReached:
      summary: Daily allowance of invitation emails used up
      value:
        type: about:blank
        title: Too Many Requests
        status: 429
        code: invitation.daily-limit-reached
        details:
          remaining: 2
          nextAvailableAt: '2026-11-07T09:12:00Z'
  responses:
    SearchAuthorityBadRequest:
      description: '`request.invalid` for invalid input, including an invalid organization export cursor.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/SearchPrivateNoStore'
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
    SearchAuthorityTokenRefused:
      description: '`auth.token-missing` or `auth.token-invalid`.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/SearchPrivateNoStore'
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
    SearchOrganizationAccessRefused:
      description: |
        `auth.issuer-not-allowed` for another issuer, `auth.actor-not-allowed` for another
        actor type or ID, or `auth.organization-not-allowed` when the global export receives a
        verified token scoped to an organization. The export checks the last condition after
        token verification.
      headers:
        Cache-Control:
          $ref: '#/components/headers/SearchPrivateNoStore'
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
    SearchMembershipAccessRefused:
      description: |
        `auth.issuer-not-allowed` for another issuer, `auth.actor-not-allowed` for a non-user
        actor, or `auth.organization-required` for an unscoped token.
      headers:
        Cache-Control:
          $ref: '#/components/headers/SearchPrivateNoStore'
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
    SearchMembershipNotFound:
      description: '`organization.not-found` for a missing organization or absent active membership.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/SearchPrivateNoStore'
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
    SearchAuthorityUnavailable:
      description: |
        `organization.unavailable` when Organization cannot complete the requested snapshot.
        No partial page or membership proof is returned.
      headers:
        Cache-Control:
          $ref: '#/components/headers/SearchPrivateNoStore'
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
    ProfileMediaReservationConflict:
      description: |
        `idempotency.request-in-progress` when the equivalent signing or owner reservation is running.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
    ProfileMediaReservationRefused:
      description: |
        `media.file-too-large` above 5,242,880 declared bytes, `media.unsupported-type` for a
        disallowed image encoding, or `idempotency.key-reused` for a conflicting reservation.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
    ProfileMediaUploadStateConflict:
      description: |
        `media.upload-expired` for expiration, `media.upload-not-ready` for an upload that has not
        arrived, or `media.upload-superseded` for an invalidated prior generation.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
    OrganizationLogoOwnerOrUploadNotFound:
      description: |
        `organization.not-found` for a missing or inactive membership, or `media.not-found` for an absent or unrelated upload.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
    OrganizationLogoWriteForbidden:
      description: |
        `organization.role-forbidden` for roles other than owner or admin, or `auth.issuer-not-allowed`,
        `auth.actor-not-allowed` or `auth.organization-required` for an invalid caller.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
    BadRequest:
      description: '`request.invalid`: the request does not match the schema; one `details.issues` entry per issue.'
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          example:
            type: about:blank
            title: Bad Request
            status: 400
            code: request.invalid
            details:
              issues:
                - in: body
                  path: name
                  code: too_small
                  message: Too small
    InternalTokenRefused:
      description: |
        The internal token is missing (`auth.token-missing`) or refused (`auth.token-invalid`, with
        `details.reason`). The gateway's client reports it as `503 upstream.unauthorized`.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          example:
            type: about:blank
            title: Unauthorized
            status: 401
            code: auth.token-invalid
            details:
              reason: expired
    InternalAccessRefused:
      description: |
        The internal token is valid but the route does not accept its issuer
        (`auth.issuer-not-allowed`) or its actor (`auth.actor-not-allowed`), or the route requires
        an organization the token does not carry (`auth.organization-required`).
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          examples:
            actorNotAllowed:
              $ref: '#/components/examples/ActorNotAllowed'
    RoleForbidden:
      description: |
        - `organization.role-forbidden`: the role of the actor in the organization does not allow
          the request;
        - `auth.issuer-not-allowed`, `auth.actor-not-allowed`, `auth.organization-required`: see the
          internal token.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          examples:
            roleForbidden:
              $ref: '#/components/examples/RoleForbidden'
            organizationRequired:
              summary: Token without an organization
              value:
                type: about:blank
                title: Forbidden
                status: 403
                code: auth.organization-required
    InvitationForbidden:
      description: |
        - `invitation.email-mismatch`: the invitation was sent to another address than the verified
          address of the actor;
        - `auth.issuer-not-allowed`, `auth.actor-not-allowed`: see the internal token.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          examples:
            emailMismatch:
              summary: Invitation sent to another address
              value:
                type: about:blank
                title: Forbidden
                status: 403
                code: invitation.email-mismatch
            actorNotAllowed:
              $ref: '#/components/examples/ActorNotAllowed'
    UserNotFound:
      description: '`user.not-found`: the `userId` of the path is not the actor.'
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          example:
            type: about:blank
            title: Not Found
            status: 404
            code: user.not-found
    UserNotSynchronized:
      description: |
        `user.not-synchronized`: the actor is not in the user directory yet; it is within seconds of
        the sign-up.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          example:
            type: about:blank
            title: Not Found
            status: 404
            code: user.not-synchronized
    OrganizationNotFound:
      description: '`organization.not-found`: the actor does not belong to the organization of the token.'
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          example:
            type: about:blank
            title: Not Found
            status: 404
            code: organization.not-found
    MemberNotFound:
      description: |
        - `member.not-found`: no member with this id in the organization of the token;
        - `organization.not-found`: the actor does not belong to it.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          example:
            type: about:blank
            title: Not Found
            status: 404
            code: member.not-found
    InvitationNotFound:
      description: |
        - `invitation.not-found`: no invitation with this id in the organization of the token;
        - `organization.not-found`: the actor does not belong to it.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          example:
            type: about:blank
            title: Not Found
            status: 404
            code: invitation.not-found
    InvitationOrUserNotFound:
      description: |
        - `invitation.not-found`: no invitation with this id, or no verified address of the actor in
          the directory yet;
        - `user.not-found`: the `userId` of the path is not the actor.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          example:
            type: about:blank
            title: Not Found
            status: 404
            code: invitation.not-found
    InvitationAnswered:
      description: '`invitation.answered`: the invitation was accepted or refused already, with `details.status`.'
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          examples:
            invitationAnswered:
              $ref: '#/components/examples/InvitationAnswered'
    InvitationClosed:
      description: '`invitation.revoked`, or `invitation.answered` with `details.status`.'
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          examples:
            invitationRevoked:
              $ref: '#/components/examples/InvitationRevoked'
            invitationAnswered:
              $ref: '#/components/examples/InvitationAnswered'
    InvitationBatchLimited:
      description: |
        `invitation.daily-limit-reached`: the addresses that would be invited need more invitation
        emails than the organization has left of its 100 in any 24 hours; `details.remaining` is
        what it has left, and nothing was created, sent or emitted. `details.nextAvailableAt` is
        when the oldest email counted leaves the 24 hours and `Retry-After` the seconds until then.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          examples:
            dailyLimitReached:
              $ref: '#/components/examples/InvitationDailyLimitReached'
    InvitationResendLimited:
      description: |
        - `invitation.resend-throttled`: the email of the invitation went out less than an hour
          ago; `details.resendAvailableAt` is `sentAt` plus one hour;
        - `invitation.daily-limit-reached`: the organization has no invitation email left of its
          100 in any 24 hours; `details.remaining` is `0` and `details.nextAvailableAt` says when
          the oldest email counted leaves the 24 hours.

        `Retry-After` is the seconds until the resend can succeed. Nothing changed and nothing was
        emitted.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          examples:
            resendThrottled:
              summary: Invitation email sent less than an hour ago
              value:
                type: about:blank
                title: Too Many Requests
                status: 429
                code: invitation.resend-throttled
                details:
                  resendAvailableAt: '2026-11-06T17:20:00Z'
            dailyLimitReached:
              summary: No invitation email left today
              value:
                type: about:blank
                title: Too Many Requests
                status: 429
                code: invitation.daily-limit-reached
                details:
                  remaining: 0
                  nextAvailableAt: '2026-11-07T09:12:00Z'
    InvitationNotPending:
      description: |
        `invitation.revoked`, `invitation.answered` (with `details.status`, `accepted` or
        `refused`) or `invitation.expired` (with `details.expiresAt`).
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          examples:
            invitationRevoked:
              $ref: '#/components/examples/InvitationRevoked'
            invitationAnswered:
              $ref: '#/components/examples/InvitationAnswered'
            invitationExpired:
              $ref: '#/components/examples/InvitationExpired'
    OwnerProtected:
      description: '`member.owner-protected`: the owner is neither removed nor given another role.'
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          example:
            type: about:blank
            title: Unprocessable Content
            status: 422
            code: member.owner-protected
    SlugTaken:
      description: '`organization.slug-taken`: another organization uses the address, with `details.slug`.'
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          example:
            type: about:blank
            title: Conflict
            status: 409
            code: organization.slug-taken
            details:
              slug: atelier-nord
    SlugInvalid:
      description: '`organization.slug-invalid`: the address derived from the name has fewer than 2 characters, with `details.slug`.'
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          example:
            type: about:blank
            title: Unprocessable Content
            status: 422
            code: organization.slug-invalid
            details:
              slug: e
    VersionMismatch:
      description: '`request.version-mismatch`: `If-Match` is not the current version, with `details.version`.'
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          example:
            type: about:blank
            title: Precondition Failed
            status: 412
            code: request.version-mismatch
            details:
              version: 4
  schemas:
    SearchOrganizationPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          maxItems: 100
          uniqueItems: true
          items:
            type: string
            format: uuid
        nextCursor: { $ref: '../../components/http.yaml#/components/schemas/NextCursor' }
    SearchMembership:
      $ref: '../../components/search.yaml#/components/schemas/SearchMembership'
    Email:
      type: string
      format: email
      maxLength: 254
      description: Email address, compared without regard to case.
      examples: [marc.roux@ateliernord.fr]
    Role:
      $ref: '../../components/organization.yaml#/components/schemas/Role'
    AssignableRole:
      type: string
      description: A role that can be given; never `owner`.
      enum: [admin, member, guest]
    EmptyRequest:
      type: object
      additionalProperties: false
      description: Empty object `{}`, the body the public route carried.
    OrganizationCreation:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
          description: Name as typed; trimmed here, a name made only of spaces answers `400 request.invalid`.
          examples: [Atelier Nord]
        slug:
          type: string
          minLength: 2
          maxLength: 63
          pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
          description: Address to use; derived from `name` when absent.
        teamSize:
          type: string
          default: 6-20
          enum: [1-5, 6-20, 21-100, over-100]
        primaryUse:
          type: string
          default: product-engineering
          enum:
            [
              product-engineering,
              agency-client-projects,
              marketing-content,
              operations-support,
              other,
            ]
        inviteEmails:
          type: array
          maxItems: 50
          default: []
          items:
            $ref: '#/components/schemas/Email'
    OrganizationPatch:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        slug:
          type: string
          minLength: 2
          maxLength: 63
          pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
        description:
          type: [string, 'null']
          maxLength: 280
        website:
          type: [string, 'null']
          format: uri
          maxLength: 2048
          description: |
            Absolute URL; `null` clears it. Only the schemes `https` and `http` are accepted: any
            other (`javascript:`, `data:`, `mailto:`, `ftp:`) answers `400 request.invalid` with an
            issue on `website`.
        defaultLanguage:
          type: string
          enum: [fr, en, de]
    Organization:
      type: object
      required:
        [
          id,
          name,
          slug,
          description,
          website,
          defaultLanguage,
          plan,
          memberCount,
          role,
          createdAt,
          version,
        ]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        description:
          type: [string, 'null']
        website:
          type: [string, 'null']
          description: Absolute `https` or `http` URL, the only schemes accepted; `null` when there is none.
        logoId:
          type: [string, 'null']
          format: uuid
          description: Current opaque logo reference or null.
        defaultLanguage:
          type: string
          x-extensible-enum: [fr, en, de]
        plan:
          type: string
          description: Always `free` until billing exists.
          x-extensible-enum: [free, team, enterprise]
        memberCount:
          type: integer
          minimum: 1
          description: Members that take a seat; guests are not counted.
        role:
          $ref: '#/components/schemas/Role'
          description: Role of the actor in this organization, from the members of this service.
        createdAt:
          type: string
          format: date-time
        version:
          type: integer
          minimum: 1
    InvitationResult:
      type: object
      required: [email, outcome, invitationId]
      properties:
        email:
          $ref: '#/components/schemas/Email'
        outcome:
          type: string
          x-extensible-enum: [invited, already-member, already-invited]
        invitationId:
          type: [string, 'null']
          format: uuid
    OrganizationCreated:
      type: object
      required: [organization, invitations]
      properties:
        organization:
          $ref: '#/components/schemas/Organization'
        invitations:
          type: array
          items:
            $ref: '#/components/schemas/InvitationResult'
    MyOrganization:
      type: object
      required: [id, name, slug, role, memberCount, plan, joinedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        role:
          $ref: '#/components/schemas/Role'
        memberCount:
          type: integer
          minimum: 1
        plan:
          type: string
          x-extensible-enum: [free, team, enterprise]
        joinedAt:
          type: string
          format: date-time
    MyOrganizationPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/MyOrganization'
        nextCursor:
          $ref: '../../components/http.yaml#/components/schemas/NextCursor'
    MemberNameLookup:
      type: object
      required: [userIds]
      additionalProperties: false
      properties:
        userIds:
          type: array
          minItems: 1
          maxItems: 5000
          items:
            type: string
            format: uuid
    MemberNameLookupResult:
      type: object
      required: [items]
      additionalProperties: false
      properties:
        items:
          type: array
          maxItems: 5000
          items:
            type: object
            required: [userId, name]
            additionalProperties: false
            properties:
              userId:
                type: string
                format: uuid
              name:
                type: string
                description: Full name from the organization-service user directory.
    Member:
      type: object
      required: [id, userId, name, email, role, joinedAt, version]
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        avatarId:
          type: [string, 'null']
          format: uuid
          description: Last observed directory avatar reference or null. It does not grant image access.
        name:
          type: string
          description: Full name, from the user directory.
        email:
          $ref: '#/components/schemas/Email'
        role:
          $ref: '#/components/schemas/Role'
        joinedAt:
          type: string
          format: date-time
        version:
          type: integer
          minimum: 1
        twoStepVerificationEnabled:
          type: boolean
          description: |
            Whether the account has two-step verification, from the user directory
            (`user.two-step-verification-changed.v1`), `false` until an event says otherwise.
            Present when the actor is the owner or an admin of the organization, absent otherwise;
            the gateway passes it on as is.
    MemberPage:
      type: object
      required: [items, nextCursor, total, counts]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Member'
        nextCursor:
          $ref: '../../components/http.yaml#/components/schemas/NextCursor'
        total:
          type: integer
          minimum: 0
        counts:
          $ref: '#/components/schemas/RoleCounts'
    RoleCounts:
      type: object
      required: [owner, admin, member, guest]
      description: Members of the organization by role, whatever the filters of the request.
      properties:
        owner:
          type: integer
          minimum: 0
        admin:
          type: integer
          minimum: 0
        member:
          type: integer
          minimum: 0
        guest:
          type: integer
          minimum: 0
    MemberPatch:
      type: object
      required: [role]
      properties:
        role:
          $ref: '#/components/schemas/AssignableRole'
    InvitationBatch:
      type: object
      required: [emails]
      properties:
        emails:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: '#/components/schemas/Email'
        role:
          $ref: '#/components/schemas/AssignableRole'
          default: member
    InvitationBatchResult:
      type: object
      required: [invitations]
      properties:
        invitations:
          type: array
          items:
            $ref: '#/components/schemas/InvitationResult'
    Inviter:
      type: object
      required: [userId, name]
      properties:
        userId:
          type: string
          format: uuid
        name:
          type: string
    Invitation:
      type: object
      required: [id, email, role, invitedBy, status, sentAt, expiresAt, version]
      properties:
        id:
          type: string
          format: uuid
        email:
          $ref: '#/components/schemas/Email'
        role:
          $ref: '#/components/schemas/AssignableRole'
        invitedBy:
          $ref: '#/components/schemas/Inviter'
        status:
          type: string
          x-extensible-enum: [pending, expired]
        sentAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        version:
          type: integer
          minimum: 1
    InvitationPage:
      type: object
      required: [items, nextCursor, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Invitation'
        nextCursor:
          $ref: '../../components/http.yaml#/components/schemas/NextCursor'
        total:
          type: integer
          minimum: 0
    InvitingOrganization:
      type: object
      required: [id, name, slug, description, memberCount]
      description: The organization of an invitation, as the invitee sees it before joining.
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        description:
          type: [string, 'null']
        memberCount:
          type: integer
          minimum: 1
    ReceivedInvitation:
      type: object
      required: [id, organization, role, invitedBy, expiresAt]
      properties:
        id:
          type: string
          format: uuid
        organization:
          $ref: '#/components/schemas/InvitingOrganization'
        role:
          $ref: '#/components/schemas/AssignableRole'
        invitedBy:
          $ref: '#/components/schemas/Inviter'
        expiresAt:
          type: string
          format: date-time
    ReceivedInvitationPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ReceivedInvitation'
        nextCursor:
          $ref: '../../components/http.yaml#/components/schemas/NextCursor'
