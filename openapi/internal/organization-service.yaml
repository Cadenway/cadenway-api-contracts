        '404':
          $ref: '#/components/responses/InvitationOrUserNotFound'
        '409':
          $ref: '#/components/responses/InvitationNotPending'
        '503':
          $ref: '#/components/responses/InvitationAuthorityUnavailable'
  /internal/v1/search-organizations:
    get:
      operationId: listSearchOrganizationsInternal
      summary: List organization IDs for projection rebuilds
      description: |
        Requires issuer `search-service` or `identity-service` and a system actor whose ID is
        the issuer. The internal token has no organization claim. Identity carries no delegated
        role or scopes. Every response carries `Cache-Control: private, no-store`.
        Returns only organization IDs. Both callers sign each owner's export request with the
        organization of that export.

        The first page fixes an upper organization ID in its read snapshot. Independent pages
        read ascending immutable IDs up to that inclusive upper bound. The opaque cursor binds
        this operation, the upper bound, and the last returned ID. The next page starts strictly
        after that ID. An invalid cursor returns `400 request.invalid`. The UTF-8 JSON body is at
        most 1,048,576 bytes. Only `nextCursor: null` marks completion. Before its scan, Search
        starts consuming durable invalidations, including `member.joined.v1`. Organization
        creation emits the owner's join, so Search can schedule an export of a new tenant even
        when its ID is outside this page sequence.
      tags: [search]
      parameters:
        - $ref: '../../components/http.yaml#/components/parameters/Cursor'
        - $ref: '../../components/http.yaml#/components/parameters/Limit'
      responses:
        '200':
          description: One page of organization IDs.
          headers:
            Cache-Control:
              $ref: '#/components/headers/SearchPrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchOrganizationPage'
              example:
                items: [019a5f3c-8d2e-7c4a-9b1f-3e5d7a9c1b2f]
                nextCursor: null
        '400':
          $ref: '#/components/responses/SearchAuthorityBadRequest'
        '401':
          $ref: '#/components/responses/SearchAuthorityTokenRefused'
        '403':
          $ref: '#/components/responses/SearchOrganizationAccessRefused'
        '503':
          $ref: '#/components/responses/SearchAuthorityUnavailable'
  /internal/v1/billing-organizations:
    get:
      operationId: listBillingOrganizationsInternal
      summary: List organization IDs for a Billing usage rebuild
      description: |
        Requires issuer `billing-service`, actor `{ type: 'system', id: 'billing-service' }`,
        and a null organization claim in the verified internal token. Every response carries
        `Cache-Control: private, no-store`. Only organization IDs are returned. IDs may use
        historical UUID versions. Billing signs a separate token for each tenant export.

        The first page fixes an inclusive upper organization ID in its read snapshot. Each page
        reads its own snapshot in ascending immutable UUID order above the last returned ID and
        at or below that upper bound. The opaque, authenticated cursor binds the operation, the
        upper bound and the last returned ID. The cursor has 1 to 1,024 characters. Only
        `nextCursor: null` marks completion. The UTF-8 JSON body is at most 1,048,576 bytes.

        Before the first page, Billing records the starting positions for durable consumption of
        `organization.created.v1` and the membership and attachment facts used by the tenant
        exports. After the final snapshot page, it captures catch-up positions. Billing promotes
        a rebuilt projection only once it has proved continuous coverage and applied all relevant
        facts through those positions. If a gap in the event history is confirmed, Billing discards
        the candidate and restarts from new starting positions. Durable consumption continues after
        promotion. Changes committed at the source and still in its outbox at the catch-up position
        appear when delivered. The read projection is eventually consistent after promotion.
        Mutation admission requires a separate current usage proof. `organization.created.v1`
        covers a tenant created during the scan, including a tenant whose ID falls before the
        current cursor or above the upper bound.
      tags: [billing-usage]
      parameters:
        - $ref: '../../components/billing.yaml#/components/parameters/BillingCursor'
        - $ref: '../../components/http.yaml#/components/parameters/Limit'
      responses:
        '200':
          description: One page of organization IDs.
          headers:
            Cache-Control:
              $ref: '#/components/headers/BillingPrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingOrganizationPage'
              example:
                items: [019a5f3c-8d2e-7c4a-9b1f-3e5d7a9c1b2f]
                nextCursor: null
        '400':
          $ref: '#/components/responses/BillingUsageBadRequest'
        '401':
          $ref: '#/components/responses/BillingUsageTokenRefused'
        '403':
          $ref: '#/components/responses/BillingOrganizationAccessRefused'
        '503':
          $ref: '#/components/responses/BillingUsageUnavailable'
  /internal/v1/billing-memberships:
    get:
      operationId: listBillingMembershipsInternal
      summary: Export membership states for Billing seat usage
      description: |
        Requires issuer `billing-service`, actor `{ type: 'system', id: 'billing-service' }`,
        and an organization in the verified internal token. The token determines the tenant.
        Every response carries `Cache-Control: private, no-store`. Each active membership,
        including a guest, is exported with its ID, version and role. Each retained removal is
        exported with its ID and terminal version. The export must include a removal whenever
        an older membership fact can still arrive, including from a delayed Organization outbox.
        An invitation without a membership contributes no row. A person who rejoins after removal
        gets a new membership ID. The export includes no account IDs, names or email addresses.

        The first page fixes an inclusive upper membership ID in its tenant snapshot. Each page
        reads its own tenant snapshot in ascending immutable UUID order above the last returned
        ID and at or below that upper bound. The opaque, authenticated cursor has 1 to 1,024
        characters and binds the operation, the tenant, the upper bound and the last returned ID.
        Only `nextCursor: null` marks completion. The UTF-8 JSON body is at most 1,048,576 bytes.

        Billing reconciles by membership ID and its highest source version using `member.joined.v1`,
        `member.role-changed.v1` and `member.removed.v1`. A removal is terminal for the membership ID.
        A removal takes precedence over an active row of the same version. Once a membership ID
        is terminal, Billing never restores it. A rebuild requires continuous durable delivery
        from a starting position recorded before the first page through a catch-up position
        recorded after the final page. Billing proves coverage and applies all relevant facts
        through that position before promotion. On a confirmed gap, Billing discards the candidate
        and restarts from a new starting position. Changes committed by Organization and still in
        its outbox at the catch-up position appear when delivered. The read projection is
        eventually consistent after promotion. Mutation admission requires a separate current
        usage proof.
      tags: [billing-usage]
      parameters:
        - $ref: '../../components/billing.yaml#/components/parameters/BillingCursor'
        - $ref: '../../components/http.yaml#/components/parameters/Limit'
      responses:
        '200':
          description: One page of active memberships and retained removals.
          headers:
            Cache-Control:
              $ref: '#/components/headers/BillingPrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingMembershipPage'
              example:
                items:
                  - memberId: 019a5f3d-1a2b-7c3d-8e4f-5a6b7c8d9e41
                    state: active
                    role: admin
                    version: 2
                  - memberId: 019a5f3d-1a2b-7c3d-8e4f-5a6b7c8d9e42
                    state: removed
                    version: 3
                nextCursor: null
        '400':
          $ref: '#/components/responses/BillingUsageBadRequest'
        '401':
          $ref: '#/components/responses/BillingUsageTokenRefused'
        '403':
          $ref: '#/components/responses/BillingMembershipAccessRefused'
        '404':
          $ref: '#/components/responses/BillingOrganizationNotFound'
        '503':
          $ref: '#/components/responses/BillingUsageUnavailable'
  /internal/v1/billing-active-seats:
    get:
      operationId: getBillingActiveSeatCountInternal
      summary: Read the current active seat count for Checkout
      description: |
        Requires issuer `billing-service`, actor `{ type: 'system', id: 'billing-service' }`,
        and an organization in the verified internal token. The token determines the tenant.
        Every response carries `Cache-Control: private, no-store`.

        Organization checks that the tenant exists and counts its active owners, administrators
        and members in one read snapshot. Guests, pending invitations and removed memberships
        contribute zero seats. The response contains only the total for that snapshot.

        Billing uses this read to determine the quantity for a new Checkout attempt. The
        API gateway verifies the current owner role before forwarding the Checkout request.
      tags: [billing-usage]
      responses:
        '200':
          description: Active seat count in the organization of the verified token.
          headers:
            Cache-Control:
              $ref: '#/components/headers/BillingPrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingActiveSeatCount'
              example:
                activeSeatCount: 2
        '401':
          $ref: '#/components/responses/BillingUsageTokenRefused'
        '403':
          $ref: '#/components/responses/BillingMembershipAccessRefused'
        '404':
          $ref: '#/components/responses/BillingOrganizationNotFound'
        '503':
          $ref: '#/components/responses/BillingUsageUnavailable'
  /internal/v1/quota-notification-recipients:
    get:
      operationId: listQuotaNotificationRecipientsInternal
      summary: List current organization recipients for a quota alert
      description: |
        Returns the user IDs of active owners and administrators of the organization of the
        `quota.threshold-reached.v1` event. Notification signs the event organization in the
        internal token. Organization takes the tenant from that verified claim and reads its
        own current membership state. The token requires issuer `notification-service`, actor
        `{ type: 'system', id: 'notification-service' }` and an organization claim.

        Each page returns up to `limit` eligible user IDs in ascending UUID order. Its opaque,
        authenticated cursor binds the tenant, operation and last returned user ID. Memberships
        are evaluated at the time of each page read, so eligibility may change during paging.
        Only `nextCursor: null` marks completion. Notification rechecks the IDs through the
        lookup before dispatch. Every response carries `Cache-Control: private, no-store`.
        This operation is read-only.
      tags: [quota-notifications]
      parameters:
        - $ref: '../../components/billing.yaml#/components/parameters/BillingCursor'
        - $ref: '../../components/http.yaml#/components/parameters/Limit'
      responses:
        '200':
          description: One page of eligible user IDs. An organization with no eligible users yields an empty page.
          headers:
            Cache-Control:
              $ref: '#/components/headers/QuotaNotificationRecipientsNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuotaNotificationRecipientPage'
              example:
                items: [019a5f3c-8d2e-7c4a-9b1f-3e5d7a9c1b30, 019a5f3c-9e1f-7b2a-8c3d-4e5f6a7b8c31]
                nextCursor: null
        '400':
          $ref: '#/components/responses/QuotaNotificationRecipientsBadRequest'
        '401':
          $ref: '#/components/responses/QuotaNotificationRecipientsTokenRefused'
        '403':
          $ref: '#/components/responses/QuotaNotificationRecipientsAccessRefused'
        '404':
          $ref: '#/components/responses/QuotaNotificationRecipientsOrganizationNotFound'
        '503':
          $ref: '#/components/responses/QuotaNotificationRecipientsUnavailable'
  /internal/v1/quota-notification-recipients/lookup:
    post:
      operationId: lookupQuotaNotificationRecipientsInternal
      summary: Recheck quota alert recipients immediately before delivery
      description: |
        In one tenant read, returns the requested user IDs that currently belong to an active
        owner or administrator of the organization in the verified token. All other IDs are
        omitted without distinguishing missing accounts, different organizations and ineligible
        memberships. Repeated or case-equivalent UUIDs produce at most one result per account.
        Result order is unspecified. The token requires issuer `notification-service`, actor
        `{ type: 'system', id: 'notification-service' }` and an organization claim.

        Notification calls this again before each delivery attempt, including a delayed send or
        retry. Notification delivers only to accounts in the current result. If the lookup is
        unavailable, Notification defers delivery until it obtains a fresh result. This authority checks
        membership at the time of the read. Notification still checks its delivery preferences
        and resolves the current email address through Identity. Every response carries
        `Cache-Control: private, no-store`. This operation is read-only.
      tags: [quota-notifications]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuotaNotificationRecipientLookup'
            example:
              userIds: [019a5f3c-8d2e-7c4a-9b1f-3e5d7a9c1b30, 019a5f3c-9e1f-7b2a-8c3d-4e5f6a7b8c31]
      responses:
        '200':
          description: The currently eligible subset of the supplied user IDs.
          headers:
            Cache-Control:
              $ref: '#/components/headers/QuotaNotificationRecipientsNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuotaNotificationRecipientLookupResult'
              example:
                items: [019a5f3c-8d2e-7c4a-9b1f-3e5d7a9c1b30]
        '400':
          $ref: '#/components/responses/QuotaNotificationRecipientsBadRequest'
        '401':
          $ref: '#/components/responses/QuotaNotificationRecipientsTokenRefused'
        '403':
          $ref: '#/components/responses/QuotaNotificationRecipientsAccessRefused'
        '404':
          $ref: '#/components/responses/QuotaNotificationRecipientsOrganizationNotFound'
        '503':
          $ref: '#/components/responses/QuotaNotificationRecipientsUnavailable'
  /internal/v1/search-membership:
    get:
      operationId: getSearchMembershipInternal
      summary: Prove current organization membership
      description: |
        Requires issuer `search-service`, `identity-service`, `task-service` or `realtime-gateway`,
        an actor of type `user` and an organization in the signed token. Search delegates the user
        and organization of the authenticated search request. Identity signs the account and
        organization bound to a locally verified credential. Task signs the author or recipient
        and organization from an authorized Git or Automation action. Realtime signs the account
        and organization of an authenticated connection. Identity, Task and Realtime send no
        delegated role or scopes. Every response carries `Cache-Control: private, no-store`.

        Returns the active membership's ID, version and role in one current tenant snapshot.
        The membership ID changes after removal and rejoining. The version is the version of
        that membership, independent of the organization's version. An unknown organization or
        absent active membership yields the same `404 organization.not-found`. Search uses this
        proof to check that Task evaluates candidate access against the same membership identity
        and version. Identity uses the current role and compares the membership ID before exposing
        a session's selected organization. Task checks the current membership before applying
        delegated actions. Realtime uses it to revalidate membership for an admitted connection.
        The proof alone grants no access to a task or search result.
      tags: [search]
      responses:
        '200':
          description: The active membership of the signed actor in the selected organization.
          headers:
            Cache-Control:
              $ref: '#/components/headers/SearchPrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchMembership'
              example:
                memberId: 019a5f3d-1a2b-7c3d-8e4f-5a6b7c8d9e41
                role: admin
                version: 2
        '400':
          $ref: '#/components/responses/SearchAuthorityBadRequest'
        '401':
          $ref: '#/components/responses/SearchAuthorityTokenRefused'
        '403':
          $ref: '#/components/responses/SearchMembershipAccessRefused'
        '404':
          $ref: '#/components/responses/SearchMembershipNotFound'
        '503':
          $ref: '#/components/responses/SearchAuthorityUnavailable'
  /internal/v1/identity-memberships:
    get:
      operationId: listIdentityMembershipsInternal
      summary: Export one tenant's membership states for Identity
      description: |
        Requires issuer `identity-service` and actor `{ type: 'system', id: 'identity-service' }`
        with the organization in the verified token and no delegated role or scopes. Identity
        enumerates organization IDs through `GET /internal/v1/search-organizations` and signs
        each tenant export separately. Every response carries `Cache-Control: private, no-store`.

        Returns all active memberships and retained removals. Every row includes the membership
        and account IDs and source version. An active row contains the role and a null removal
        time. A removed row contains the removal time and a null role. A removal is terminal
        for its membership ID, including when an older event arrives later. The export includes
        removals for as long as an older event can still arrive, including through a delayed outbox.
        Rejoining allocates a different membership ID. The page contains membership states only.

        The first page fixes an inclusive upper membership ID in one read snapshot. Every
        page reads ascending immutable IDs in that tenant above the last returned ID and at or
        below the upper bound. The authenticated cursor binds the operation, tenant, upper bound
        and last returned ID. A cursor has 1 to 1,024 characters. Only `nextCursor: null` marks
        completion. The UTF-8 JSON body is at most 1,048,576 bytes.

        Identity applies states by membership ID and source version and persists the checkpoint
        after committing the page. A scan requires durable event coverage from before the first
        page through catch-up after the last page. An empty page or a failed scan provides no
        evidence of membership removal. Identity restarts the rebuild after a confirmed coverage gap.
      tags: [identity-authority]
      parameters:
        - $ref: '#/components/parameters/IdentityMembershipCursor'
        - $ref: '../../components/http.yaml#/components/parameters/Limit'
      responses:
        '200':
          description: One page of active memberships and retained removals.
          headers:
            Cache-Control:
              $ref: '#/components/headers/IdentityAuthorityPrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityMembershipPage'
              example:
                items:
                  - memberId: 019a5f3d-1a2b-7c3d-8e4f-5a6b7c8d9e41
                    userId: 019a5f3c-8d2e-7c4a-9b1f-3e5d7a9c1b30
                    role: admin
                    version: 2
                    removedAt: null
                  - memberId: 019a5f3d-1a2b-7c3d-8e4f-5a6b7c8d9e42
                    userId: 019a5f3c-b2c3-7d4e-8f5a-6b7c8d9e0f33
                    role: null
                    version: 3
                    removedAt: '2026-10-12T14:00:00Z'
                nextCursor: null
        '400':
          $ref: '#/components/responses/IdentityAuthorityBadRequest'
        '401':
          $ref: '#/components/responses/IdentityAuthorityTokenRefused'
        '403':
          $ref: '#/components/responses/IdentityMembershipExportAccessRefused'
        '404':
          $ref: '#/components/responses/IdentityMembershipExportNotFound'
        '503':
          $ref: '#/components/responses/IdentityAuthorityUnavailable'
  /internal/v1/users/{userId}/account-deletion-reservations/{attemptId}:
    put:
      operationId: reserveAccountDeletionInternal
      summary: Reserve an account for final deletion
      description: |
        Requires issuer `identity-service` and actor `{ type: 'system', id: 'identity-service' }`
        with no organization, delegated role or scopes. Identity calls this operation only after
        the scheduled deadline and after durably claiming the same deletion attempt. Every
        response carries `Cache-Control: private, no-store`.

        Organization checks current ownership and creates a durable reservation in one
        transaction, serialized with operations that give the account ownership or a new
        membership. A confirmed owner keeps their account. A reserved account cannot become
        an owner or gain a new membership. The reservation persists through retry and until
        the account deletion event is applied. Expiration or absence of an HTTP response does
        not release it. An equivalent retry of a stored attempt confirms the same reservation.
        A different attempt cannot replace a reservation.

        Only a successful response for the same attempt authorizes Identity to finish deletion.
        If a response is lost, Identity retries the same request. A conflict or temporary
        failure does not authorize deletion.
      tags: [identity-authority]
      parameters:
        - name: userId
          in: path
          required: true
          description: Account claimed for deletion by Identity.
          schema:
            type: string
            format: uuid
            examples: [019a5f3c-b2c3-7d4e-8f5a-6b7c8d9e0f33]
        - name: attemptId
          in: path
          required: true
          description: Stable UUIDv7 of the deletion attempt persisted by Identity.
          schema:
            type: string
            format: uuid
            pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-7[0-9a-fA-F]{3}-[89aAbB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$'
            examples: [019a6c30-7a8b-7c9d-8e0f-1a2b3c4d8e91]
      responses:
        '201':
          description: The attempt has durably reserved the account.
          headers:
            Cache-Control:
              $ref: '#/components/headers/IdentityAuthorityPrivateNoStore'
        '204':
          description: The same attempt has already reserved the account.
          headers:
            Cache-Control:
              $ref: '#/components/headers/IdentityAuthorityPrivateNoStore'
        '400':
          $ref: '#/components/responses/IdentityAuthorityBadRequest'
        '401':
          $ref: '#/components/responses/IdentityAuthorityTokenRefused'
        '403':
          $ref: '#/components/responses/AccountDeletionReservationAccessRefused'
        '404':
          $ref: '#/components/responses/AccountDeletionReservationNotFound'
        '409':
          $ref: '#/components/responses/AccountDeletionReservationConflict'
        '503':
          $ref: '#/components/responses/IdentityAuthorityUnavailable'
components:
  securitySchemes:
    internalToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Internal token of `@cadenway/nest-common`: Ed25519, 60 seconds, `aud` =
        `organization-service`. The operation defines the accepted issuer, actor and organization
        scope.
  parameters:
    IdentityMembershipCursor:
      name: cursor
      in: query
      description: Opaque authenticated cursor returned as `nextCursor` by the preceding page.
      schema:
        allOf:
          - $ref: '../../components/http.yaml#/components/parameters/Cursor/schema'
          - type: string
            minLength: 1
            maxLength: 1024
    UserId:
      name: userId
      in: path
      required: true
      description: Id of the account of the actor, as the introspection returned it.
      schema:
        type: string
        format: uuid
        examples: [019a5f3c-8d2e-7c4a-9b1f-3e5d7a9c1b30]
    MemberId:
      name: memberId
      in: path
      required: true
      description: Id of the membership.
      schema:
        type: string
        format: uuid
        examples: [019a5f3d-1a2b-7c3d-8e4f-5a6b7c8d9e41]
    InvitationId:
      name: invitationId
      in: path
      required: true
      description: Id of the invitation.
      schema:
        type: string
        format: uuid
        examples: [019a6b10-3c4d-7e5f-8a6b-7c8d9e0f1a70]
    IfMatch:
      name: If-Match
      in: header
      required: false
      description: '`"<version>"` the change was made from.'
      schema:
        type: string
  headers:
    IdentityAuthorityPrivateNoStore:
      required: true
      description: Keeps Identity authority responses out of HTTP caches.
      schema:
        type: string
        const: 'private, no-store'
    AutomationRecipientPrivateNoStore:
      required: true
      description: Keeps the current automation recipient decision out of HTTP caches.
      schema:
        type: string
        const: 'private, no-store'
    QuotaNotificationRecipientsNoStore:
      required: true
      description: Keeps current recipient authority responses out of HTTP caches.
      schema:
        type: string
        const: 'private, no-store'
    BillingPrivateNoStore:
      required: true
      description: Keeps Billing authority responses out of HTTP caches.
      schema:
        type: string
        const: 'private, no-store'
    SearchPrivateNoStore:
      required: true
      description: Keeps private search authority responses out of HTTP caches.
      schema:
        type: string
        const: 'private, no-store'
    ETag:
      description: Version of the organization, `"<version>"`.
      schema:
        type: string
    MemberETag:
      description: Version of the membership, `"<version>"`.
      schema:
        type: string
    InvitationETag:
      description: Version of the invitation, `"<version>"`.
      schema:
        type: string
    RetryAfter:
      description: Seconds to wait before the request can succeed (RFC 9110), rounded up.
      schema:
        type: integer
        minimum: 1
  examples:
    SeatQuotaExceeded:
      summary: No seat available under the organization's plan
      value:
        type: about:blank
        title: Conflict
        status: 409
        code: organization.seat-quota-exceeded
    AtelierNord:
      summary: Atelier Nord, read by its owner
      value:
        id: 019a5f3c-8d2e-7c4a-9b1f-3e5d7a9c1b2f
        name: Atelier Nord
        slug: atelier-nord
        description: Studio de conception de mobilier et d’aménagement, 18 personnes entre Lille et Lyon.
        website: https://ateliernord.fr
        defaultLanguage: fr
        plan: free
        memberCount: 18
        role: owner
        createdAt: '2026-03-02T09:00:00Z'
        version: 3
    InesRobert:
      summary: Inès Robert, admin of Atelier Nord
      value:
        id: 019a5f3d-1a2b-7c3d-8e4f-5a6b7c8d9e41
        userId: 019a5f3c-9e1f-7b2a-8c3d-4e5f6a7b8c31
        name: Inès Robert
        email: ines.robert@ateliernord.fr
        role: admin
        joinedAt: '2026-03-03T09:40:00Z'
        version: 2
    MarcRoux:
      summary: Pending invitation of Marc Roux
      value:
        id: 019a6b10-3c4d-7e5f-8a6b-7c8d9e0f1a70
        email: marc.roux@ateliernord.fr
        role: member
        invitedBy:
          userId: 019a5f3c-9e1f-7b2a-8c3d-4e5f6a7b8c31
          name: Inès Robert
        status: pending
        sentAt: '2026-11-06T16:20:00Z'
        expiresAt: '2026-11-13T16:20:00Z'
        version: 1
    ActorNotAllowed:
      summary: Actor not accepted
      value:
        type: about:blank
        title: Forbidden
        status: 403
        code: auth.actor-not-allowed
    RoleForbidden:
      summary: Role not allowed
      value:
        type: about:blank
        title: Forbidden
        status: 403
        code: organization.role-forbidden
    InvitationRevoked:
      summary: Invitation revoked
      value:
        type: about:blank
        title: Conflict
        status: 409
        code: invitation.revoked
    InvitationAnswered:
      summary: Invitation accepted or refused already
      value:
        type: about:blank
        title: Conflict
        status: 409
        code: invitation.answered
        details:
          status: refused
    InvitationExpired:
      summary: Invitation expired
      value:
        type: about:blank
        title: Conflict
        status: 409
        code: invitation.expired
        details:
          expiresAt: '2026-11-02T15:00:00Z'
    InvitationDailyLimitReached:
      summary: Daily allowance of invitation emails used up
      value:
        type: about:blank
        title: Too Many Requests
        status: 429
        code: invitation.daily-limit-reached
        details:
          remaining: 2
          nextAvailableAt: '2026-11-07T09:12:00Z'
  responses:
    ListMembersSuccess:
      description: One page of members.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MemberPage'
          example:
            items:
              - id: 019a5f3d-1a2b-7c3d-8e4f-5a6b7c8d9e41
                userId: 019a5f3c-9e1f-7b2a-8c3d-4e5f6a7b8c31
                name: Inès Robert
                email: ines.robert@ateliernord.fr
                role: admin
                joinedAt: '2026-03-03T09:40:00Z'
                version: 2
            nextCursor: null
            total: 1
            counts:
              owner: 1
              admin: 2
              member: 15
              guest: 4
    QuotaNotificationRecipientsBadRequest:
      description: |
        `request.invalid` for malformed input, including a cursor issued for another tenant or
        operation. `request.body-too-large` when the body exceeds the service size limit.
      headers:
        Cache-Control:
          $ref: '#/components/headers/QuotaNotificationRecipientsNoStore'
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
    QuotaNotificationRecipientsTokenRefused:
      description: '`auth.token-missing` or `auth.token-invalid`.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/QuotaNotificationRecipientsNoStore'
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
    QuotaNotificationRecipientsAccessRefused:
      description: |
        `auth.issuer-not-allowed` for another issuer, `auth.actor-not-allowed` for another actor
        type or ID, or `auth.organization-required` for an unscoped token.
      headers:
        Cache-Control:
          $ref: '#/components/headers/QuotaNotificationRecipientsNoStore'
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
    QuotaNotificationRecipientsOrganizationNotFound:
      description: '`organization.not-found` when the organization in the verified token does not exist.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/QuotaNotificationRecipientsNoStore'
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
    QuotaNotificationRecipientsUnavailable:
      description: '`organization.unavailable` when Organization cannot complete the recipient read.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/QuotaNotificationRecipientsNoStore'
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
    AutomationRecipientUnavailable:
      description: '`organization.unavailable` when Organization cannot complete the recipient membership check.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/AutomationRecipientPrivateNoStore'
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
    BillingUsageBadRequest:
      description: '`request.invalid` for invalid query parameters or a malformed cursor, including a cursor for a different operation or tenant.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/BillingPrivateNoStore'
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
    BillingUsageTokenRefused:
      description: '`auth.token-missing` or `auth.token-invalid`.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/BillingPrivateNoStore'
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
    BillingOrganizationAccessRefused:
      description: |
        `auth.issuer-not-allowed` for another issuer, `auth.actor-not-allowed` for another actor type
        or ID, or `auth.organization-not-allowed` for a verified token scoped to an organization.
      headers:
        Cache-Control:
          $ref: '#/components/headers/BillingPrivateNoStore'
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
    BillingMembershipAccessRefused:
      description: |
        `auth.issuer-not-allowed` for another issuer, `auth.actor-not-allowed` for another actor
        type or ID, or `auth.organization-required` for an unscoped token.
      headers:
        Cache-Control:
          $ref: '#/components/headers/BillingPrivateNoStore'
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
    BillingOrganizationNotFound:
      description: '`organization.not-found` when the organization in the verified token does not exist.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/BillingPrivateNoStore'
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
    BillingUsageUnavailable:
      description: '`organization.unavailable` when Organization cannot complete the usage read.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/BillingPrivateNoStore'
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
    SearchAuthorityBadRequest:
      description: '`request.invalid` for invalid input, including an invalid organization export cursor.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/SearchPrivateNoStore'
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
    SearchAuthorityTokenRefused:
      description: '`auth.token-missing` or `auth.token-invalid`.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/SearchPrivateNoStore'
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
    SearchOrganizationAccessRefused:
      description: |
        `auth.issuer-not-allowed` for another issuer, `auth.actor-not-allowed` for another
        actor type or ID or for delegated Identity role or scopes, or
        `auth.organization-not-allowed` when the global export receives a verified token scoped
        to an organization. The export checks the last condition after token verification.
      headers:
        Cache-Control:
          $ref: '#/components/headers/SearchPrivateNoStore'
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
    SearchMembershipAccessRefused:
      description: |
        `auth.issuer-not-allowed` for another issuer, `auth.actor-not-allowed` for a non-user
        actor or for a delegated role or scope from Identity, Task or Realtime, or
        `auth.organization-required` for an unscoped token.
      headers:
        Cache-Control:
          $ref: '#/components/headers/SearchPrivateNoStore'
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
    SearchMembershipNotFound:
      description: '`organization.not-found` for a missing organization or absent active membership.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/SearchPrivateNoStore'
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
    SearchAuthorityUnavailable:
      description: |
        `organization.unavailable` when Organization cannot complete the requested snapshot.
        No partial page or membership proof is returned.
      headers:
        Cache-Control:
          $ref: '#/components/headers/SearchPrivateNoStore'
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
    IdentityAuthorityBadRequest:
      description: '`request.invalid` for invalid input, including an invalid membership export cursor.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/IdentityAuthorityPrivateNoStore'
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
    IdentityAuthorityTokenRefused:
      description: '`auth.token-missing` or `auth.token-invalid`.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/IdentityAuthorityPrivateNoStore'
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
    IdentityMembershipExportAccessRefused:
      description: |
        `auth.issuer-not-allowed` for another issuer, `auth.actor-not-allowed` for another
        actor type or ID or for a delegated role or scopes, or `auth.organization-required`
        for an unscoped token.
      headers:
        Cache-Control:
          $ref: '#/components/headers/IdentityAuthorityPrivateNoStore'
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
    IdentityMembershipExportNotFound:
      description: '`organization.not-found` when the signed organization does not exist.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/IdentityAuthorityPrivateNoStore'
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
    IdentityAuthorityUnavailable:
      description: '`organization.unavailable` when Organization cannot complete the snapshot or reservation.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/IdentityAuthorityPrivateNoStore'
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
    AccountDeletionReservationAccessRefused:
      description: |
        `auth.issuer-not-allowed` for another issuer, `auth.actor-not-allowed` for another actor
        type or ID or for a delegated role or scopes, or `auth.organization-not-allowed` for an
        organization-scoped token.
      headers:
        Cache-Control:
          $ref: '#/components/headers/IdentityAuthorityPrivateNoStore'
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
    AccountDeletionReservationNotFound:
      description: '`user.not-found` when there is no account directory record available for reservation.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/IdentityAuthorityPrivateNoStore'
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
    AccountDeletionReservationConflict:
      description: |
        `account.organization-owner` when the account still owns an organization, with
        `details.organizationIds` containing a nonempty list of up to 100 owned organizations
        that prevent deletion. Other owned organizations may be omitted.
        `account.deletion-reservation-conflict` when another attempt has already reserved the account.
      headers:
        Cache-Control:
          $ref: '#/components/headers/IdentityAuthorityPrivateNoStore'
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          examples:
            organizationOwner:
              value:
                type: about:blank
                title: Conflict
                status: 409
                code: account.organization-owner
                details:
                  organizationIds: [019a5f3c-8d2e-7c4a-9b1f-3e5d7a9c1b2f]
            differentAttempt:
              value:
                type: about:blank
                title: Conflict
                status: 409
                code: account.deletion-reservation-conflict
    ProfileMediaReservationConflict:
      description: |
        `idempotency.request-in-progress` when the equivalent signing or owner reservation is running.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
    ProfileMediaReservationRefused:
      description: |
        `media.file-too-large` above 5,242,880 declared bytes, `media.unsupported-type` for a
        disallowed image encoding, or `idempotency.key-reused` for a conflicting reservation.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
    ProfileMediaUploadStateConflict:
      description: |
        `media.upload-expired` for expiration, `media.upload-not-ready` for an upload that has not
        arrived, or `media.upload-superseded` for an invalidated prior generation.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
    OrganizationLogoOwnerOrUploadNotFound:
      description: |
        `organization.not-found` for a missing or inactive membership, or `media.not-found` for an absent or unrelated upload.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
    OrganizationLogoWriteForbidden:
      description: |
        `organization.role-forbidden` for roles other than owner or admin, or `auth.issuer-not-allowed`,
        `auth.actor-not-allowed` or `auth.organization-required` for an invalid caller.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
    BadRequest:
      description: '`request.invalid`: the request does not match the schema; one `details.issues` entry per issue.'
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          example:
            type: about:blank
            title: Bad Request
            status: 400
            code: request.invalid
            details:
              issues:
                - in: body
                  path: name
                  code: too_small
                  message: Too small
    InternalTokenRefused:
      description: |
        The internal token is missing (`auth.token-missing`) or refused (`auth.token-invalid`, with
        `details.reason`). The gateway's client reports it as `503 upstream.unauthorized`.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          example:
            type: about:blank
            title: Unauthorized
            status: 401
            code: auth.token-invalid
            details:
              reason: expired
    InternalAccessRefused:
      description: |
        The internal token is valid but the route does not accept its issuer
        (`auth.issuer-not-allowed`) or its actor (`auth.actor-not-allowed`), or the route requires
        an organization the token does not carry (`auth.organization-required`).
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          examples:
            actorNotAllowed:
              $ref: '#/components/examples/ActorNotAllowed'
    RoleForbidden:
      description: |
        - `organization.role-forbidden`: the role of the actor in the organization does not allow
          the request;
        - `auth.issuer-not-allowed`, `auth.actor-not-allowed`, `auth.organization-required`: see the
          internal token.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          examples:
            roleForbidden:
              $ref: '#/components/examples/RoleForbidden'
            organizationRequired:
              summary: Token without an organization
              value:
                type: about:blank
                title: Forbidden
                status: 403
                code: auth.organization-required
    InvitationAuthorityUnavailable:
      description: '`upstream.unavailable` when Organization cannot verify the current address with Identity.'
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          example:
            type: about:blank
            title: Service Unavailable
            status: 503
            code: upstream.unavailable
    InvitationForbidden:
      description: |
        - `invitation.email-mismatch`: the invitation was sent to another address than the verified
          address of the actor;
        - `auth.issuer-not-allowed`, `auth.actor-not-allowed`: see the internal token.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          examples:
            emailMismatch:
              summary: Invitation sent to another address
              value:
                type: about:blank
                title: Forbidden
                status: 403
                code: invitation.email-mismatch
            actorNotAllowed:
              $ref: '#/components/examples/ActorNotAllowed'
    UserNotFound:
      description: '`user.not-found`: the `userId` of the path is not the actor.'
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          example:
            type: about:blank
            title: Not Found
            status: 404
            code: user.not-found
    UserNotSynchronized:
      description: |
        `user.not-synchronized`: the actor is not in the user directory yet; it is within seconds of
        the sign-up.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          example:
            type: about:blank
            title: Not Found
            status: 404
            code: user.not-synchronized
    OrganizationNotFound:
      description: '`organization.not-found`: the actor does not belong to the organization of the token.'
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          example:
            type: about:blank
            title: Not Found
            status: 404
            code: organization.not-found
    MemberNotFound:
      description: |
        - `member.not-found`: no member with this id in the organization of the token;
        - `organization.not-found`: the actor does not belong to it.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          example:
            type: about:blank
            title: Not Found
            status: 404
            code: member.not-found
    InvitationNotFound:
      description: |
        - `invitation.not-found`: no invitation with this id in the organization of the token;
        - `organization.not-found`: the actor does not belong to it.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          example:
            type: about:blank
            title: Not Found
            status: 404
            code: invitation.not-found
    InvitationOrUserNotFound:
      description: |
        - `invitation.not-found`: no invitation with this id, or no verified address of the actor in
          the directory yet;
        - `user.not-found`: the `userId` of the path is not the actor.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          example:
            type: about:blank
            title: Not Found
            status: 404
            code: invitation.not-found
    InvitationAnswered:
      description: '`invitation.answered`: the invitation was accepted or refused already, with `details.status`.'
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          examples:
            invitationAnswered:
              $ref: '#/components/examples/InvitationAnswered'
    InvitationClosed:
      description: '`invitation.revoked`, or `invitation.answered` with `details.status`.'
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          examples:
            invitationRevoked:
              $ref: '#/components/examples/InvitationRevoked'
            invitationAnswered:
              $ref: '#/components/examples/InvitationAnswered'
    InvitationBatchLimited:
      description: |
        `invitation.daily-limit-reached` when the requested emails exceed the sender's or
        organization's rolling allowance. `details.remaining` is the smaller allowance
        remaining. `details.nextAvailableAt` reports when the limiting allowance next grows or
        when both will have grown if they are equal. `Retry-After` is the delay in seconds.
        Nothing was created, sent or emitted.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          examples:
            dailyLimitReached:
              $ref: '#/components/examples/InvitationDailyLimitReached'
    InvitationResendLimited:
      description: |
        - `invitation.resend-throttled`: the email of the invitation went out less than an hour
          ago; `details.resendAvailableAt` is `sentAt` plus one hour;
        - `invitation.daily-limit-reached` when the organization or sender has no invitation
          email left in their rolling allowance. `details.remaining` is `0` and
          `details.nextAvailableAt` reports when both allowances permit another email.

        `Retry-After` is the seconds until the resend can succeed. Nothing changed and nothing was
        emitted.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          examples:
            resendThrottled:
              summary: Invitation email sent less than an hour ago
              value:
                type: about:blank
                title: Too Many Requests
                status: 429
                code: invitation.resend-throttled
                details:
                  resendAvailableAt: '2026-11-06T17:20:00Z'
            dailyLimitReached:
              summary: No invitation email left today
              value:
                type: about:blank
                title: Too Many Requests
                status: 429
                code: invitation.daily-limit-reached
                details:
                  remaining: 0
                  nextAvailableAt: '2026-11-07T09:12:00Z'
    InvitationNotPending:
      description: |
        `invitation.revoked`, `invitation.answered` (with `details.status`, `accepted` or
        `refused`) or `invitation.expired` (with `details.expiresAt`).
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          examples:
            invitationRevoked:
              $ref: '#/components/examples/InvitationRevoked'
            invitationAnswered:
              $ref: '#/components/examples/InvitationAnswered'
            invitationExpired:
              $ref: '#/components/examples/InvitationExpired'
    InvitationAcceptanceConflict:
      description: |
        `invitation.revoked`, `invitation.answered` (with `details.status`, `accepted` or
        `refused`), `invitation.expired` (with `details.expiresAt`), or
        `organization.seat-quota-exceeded` when acceptance would add a seat beyond the plan limit.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          examples:
            invitationRevoked:
              $ref: '#/components/examples/InvitationRevoked'
            invitationAnswered:
              $ref: '#/components/examples/InvitationAnswered'
            invitationExpired:
              $ref: '#/components/examples/InvitationExpired'
            seatQuotaExceeded:
              $ref: '#/components/examples/SeatQuotaExceeded'
    SeatQuotaExceeded:
      description: '`organization.seat-quota-exceeded`: changing this guest to an admin or a member would add a seat beyond the plan limit.'
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          examples:
            seatQuotaExceeded:
              $ref: '#/components/examples/SeatQuotaExceeded'
    OwnerProtected:
      description: '`member.owner-protected`: the owner is neither removed nor given another role.'
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          example:
            type: about:blank
            title: Unprocessable Content
            status: 422
            code: member.owner-protected
    SlugTaken:
      description: '`organization.slug-taken`: another organization uses the address, with `details.slug`.'
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          example:
            type: about:blank
            title: Conflict
            status: 409
            code: organization.slug-taken
            details:
              slug: atelier-nord
    SlugInvalid:
      description: |
        - `organization.slug-invalid`: the address derived from the name has fewer than 2
          characters, with `details.slug`.
        - `organization.slug-reserved`: the address, given or derived, is reserved by the `Slug`
          schema of `openapi/public/organizations.yaml`, with `details.slug`.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          examples:
            slugInvalid:
              value:
                type: about:blank
                title: Unprocessable Content
                status: 422
                code: organization.slug-invalid
                details:
                  slug: e
            slugReserved:
              value:
                type: about:blank
                title: Unprocessable Content
                status: 422
                code: organization.slug-reserved
                details:
                  slug: home
    SlugReserved:
      description: |
        `organization.slug-reserved`: the new address is reserved by the `Slug` schema of
        `openapi/public/organizations.yaml`, with `details.slug`.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          example:
            type: about:blank
            title: Unprocessable Content
            status: 422
            code: organization.slug-reserved
            details:
              slug: home
    VersionMismatch:
      description: '`request.version-mismatch`: `If-Match` is not the current version, with `details.version`.'
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          example:
            type: about:blank
            title: Precondition Failed
            status: 412
            code: request.version-mismatch
            details:
              version: 4
  schemas:
    ListMembersQuery:
      type: object
      additionalProperties: false
      properties:
        search:
          type: string
          minLength: 1
          maxLength: 100
          description: Text to find in the name or address, without regard to case or accents.
        role:
          type: array
          minItems: 1
          maxItems: 4
          items:
            $ref: '#/components/schemas/Role'
        cursor:
          $ref: '../../components/http.yaml#/components/parameters/Cursor/schema'
        limit:
          $ref: '../../components/http.yaml#/components/parameters/Limit/schema'
    QuotaNotificationRecipientPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          $ref: '#/components/schemas/QuotaNotificationRecipientIds'
        nextCursor:
          type: [string, 'null']
          allOf:
            - $ref: '../../components/http.yaml#/components/schemas/NextCursor'
            - type: [string, 'null']
              minLength: 1
              maxLength: 1024
    QuotaNotificationRecipientLookup:
      type: object
      additionalProperties: false
      required: [userIds]
      properties:
        userIds:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: string
            format: uuid
    QuotaNotificationRecipientLookupResult:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          $ref: '#/components/schemas/QuotaNotificationRecipientIds'
    QuotaNotificationRecipientIds:
      type: array
      maxItems: 100
      uniqueItems: true
      items:
        type: string
        format: uuid
    BillingActiveSeatCount:
      type: object
      additionalProperties: false
      required: [activeSeatCount]
      properties:
        activeSeatCount:
          type: integer
          minimum: 0
          description: Total number of memberships using a seat at the time of the read.
    BillingOrganizationPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          maxItems: 100
          uniqueItems: true
          items:
            type: string
            format: uuid
        nextCursor: { $ref: '#/components/schemas/BillingUsageNextCursor' }
    BillingMembershipPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/BillingMembership' }
        nextCursor: { $ref: '#/components/schemas/BillingUsageNextCursor' }
    BillingMembership:
      oneOf:
        - $ref: '#/components/schemas/BillingActiveMembership'
        - $ref: '#/components/schemas/BillingRemovedMembership'
      discriminator:
        propertyName: state
        mapping:
          active: '#/components/schemas/BillingActiveMembership'
          removed: '#/components/schemas/BillingRemovedMembership'
    BillingActiveMembership:
      type: object
      additionalProperties: false
      required: [memberId, version, state, role]
      properties:
        memberId:
          type: string
          format: uuid
        state: { type: string, const: active }
        role: { $ref: '#/components/schemas/Role' }
        version:
          type: integer
          minimum: 1
          maximum: 9007199254740991
          description: Version of the membership, independent of the organization version.
    BillingRemovedMembership:
      type: object
      additionalProperties: false
      required: [memberId, version, state]
      properties:
        memberId:
          type: string
          format: uuid
        state: { type: string, const: removed }
        version:
          type: integer
          minimum: 2
          maximum: 9007199254740991
          description: Terminal version of this membership.
    BillingUsageNextCursor:
      type: [string, 'null']
      allOf:
        - $ref: '../../components/http.yaml#/components/schemas/NextCursor'
        - type: [string, 'null']
          minLength: 1
          maxLength: 1024
    IdentityMembershipPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            oneOf:
              - $ref: '#/components/schemas/IdentityActiveMembership'
              - $ref: '#/components/schemas/IdentityRemovedMembership'
        nextCursor:
          type: [string, 'null']
          allOf:
            - $ref: '../../components/http.yaml#/components/schemas/NextCursor'
            - type: [string, 'null']
              minLength: 1
              maxLength: 1024
    IdentityActiveMembership:
      type: object
      additionalProperties: false
      required: [memberId, userId, role, version, removedAt]
      properties:
        memberId: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        role: { $ref: '#/components/schemas/Role' }
        version:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        removedAt: { type: 'null' }
    IdentityRemovedMembership:
      type: object
      additionalProperties: false
      required: [memberId, userId, role, version, removedAt]
      properties:
        memberId: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        role: { type: 'null' }
        version:
          type: integer
          minimum: 2
          maximum: 9007199254740991
          description: Terminal version of this membership.
        removedAt: { type: string, format: date-time }
    SearchOrganizationPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          maxItems: 100
          uniqueItems: true
          items:
            type: string
            format: uuid
        nextCursor: { $ref: '../../components/http.yaml#/components/schemas/NextCursor' }
    SearchMembership:
      $ref: '../../components/search.yaml#/components/schemas/SearchMembership'
    Email:
      type: string
      format: email
      maxLength: 254
      description: Email address, compared without regard to case.
      examples: [marc.roux@ateliernord.fr]
    Role:
      $ref: '../../components/organization.yaml#/components/schemas/Role'
    AssignableRole:
      type: string
      description: A role that can be given; never `owner`.
      enum: [admin, member, guest]
    EmptyRequest:
      type: object
      additionalProperties: false
      description: Empty object `{}`, the body the public route carried.
    OrganizationCreation:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
          description: Name as typed; trimmed here, a name made only of spaces answers `400 request.invalid`.
          examples: [Atelier Nord]
        slug:
          type: string
          minLength: 2
          maxLength: 63
          pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
          description: Address to use; derived from `name` when absent.
        teamSize:
          type: string
          default: 6-20
          enum: [1-5, 6-20, 21-100, over-100]
        primaryUse:
          type: string
          default: product-engineering
          enum:
            [
              product-engineering,
              agency-client-projects,
              marketing-content,
              operations-support,
              other,
            ]
        inviteEmails:
          type: array
          maxItems: 50
          default: []
          items:
            $ref: '#/components/schemas/Email'
    OrganizationPatch:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        slug:
          type: string
          minLength: 2
          maxLength: 63
          pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
        description:
          type: [string, 'null']
          maxLength: 280
        website:
          type: [string, 'null']
          format: uri
          maxLength: 2048
          description: |
            Absolute URL; `null` clears it. Only the schemes `https` and `http` are accepted: any
            other (`javascript:`, `data:`, `mailto:`, `ftp:`) answers `400 request.invalid` with an
            issue on `website`.
        defaultLanguage:
          type: string
          enum: [fr, en, de]
    Organization:
      type: object
      required:
        [
          id,
          name,
          slug,
          description,
          website,
          defaultLanguage,
          plan,
          memberCount,
          role,
          createdAt,
          version,
        ]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        description:
          type: [string, 'null']
        website:
          type: [string, 'null']
          description: Absolute `https` or `http` URL, the only schemes accepted; `null` when there is none.
        logoId:
          type: [string, 'null']
          format: uuid
          description: Current opaque logo reference or null.
        defaultLanguage:
          type: string
          x-extensible-enum: [fr, en, de]
        plan:
          type: string
          description: Latest plan entitlement applied from Billing, or `free` before the first entitlement.
          x-extensible-enum: [free, team, enterprise]
        memberCount:
          type: integer
          minimum: 1
          description: Members that take a seat; guests are not counted.
        role:
          $ref: '#/components/schemas/Role'
          description: Role of the actor in this organization, from the members of this service.
        createdAt:
          type: string
          format: date-time
        version:
          type: integer
          minimum: 1
    InvitationResult:
      type: object
      required: [email, outcome, invitationId]
      properties:
        email:
          $ref: '#/components/schemas/Email'
        outcome:
          type: string
          x-extensible-enum: [invited, already-member, already-invited]
        invitationId:
          type: [string, 'null']
          format: uuid
    OrganizationCreated:
      type: object
      required: [organization, invitations]
      properties:
        organization:
          $ref: '#/components/schemas/Organization'
        invitations:
          type: array
          items:
            $ref: '#/components/schemas/InvitationResult'
    MyOrganization:
      type: object
      required: [id, name, slug, role, memberCount, plan, joinedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        role:
          $ref: '#/components/schemas/Role'
        memberCount:
          type: integer
          minimum: 1
        plan:
          type: string
          description: Latest plan entitlement applied from Billing, or `free` before the first entitlement.
          x-extensible-enum: [free, team, enterprise]
        joinedAt:
          type: string
          format: date-time
    MyOrganizationPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/MyOrganization'
        nextCursor:
          $ref: '../../components/http.yaml#/components/schemas/NextCursor'
    AutomationRecipientCheck:
      type: object
      additionalProperties: false
      required: [userId]
      properties:
        userId:
          type: string
          format: uuid
          pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-7[0-9a-fA-F]{3}-[89aAbB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$'
          description: UUIDv7 of the requested account. Compare case-equivalent forms as one account.
    AutomationRecipientDecision:
      type: object
      additionalProperties: false
      required: [eligible]
      properties:
        eligible:
          type: boolean
          description: Whether the requested account is a current active member of the organization.
    MemberNameLookup:
      type: object
      required: [userIds]
      additionalProperties: false
      properties:
        userIds:
          type: array
          minItems: 1
          maxItems: 5000
          items:
            type: string
            format: uuid
    MemberNameLookupResult:
      type: object
      required: [items]
      additionalProperties: false
      properties:
        items:
          type: array
          maxItems: 5000
          items:
            type: object
            required: [userId, name]
            additionalProperties: false
            properties:
              userId:
                type: string
                format: uuid
              name:
                type: string
                description: Full name from the organization-service user directory.
    Member:
      type: object
      required: [id, userId, name, email, role, joinedAt, version]
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        avatarId:
          type: [string, 'null']
          format: uuid
          description: Last observed directory avatar reference or null. It does not grant image access.
        name:
          type: string
          description: Full name, from the user directory.
        email:
          $ref: '#/components/schemas/Email'
        role:
          $ref: '#/components/schemas/Role'
        joinedAt:
          type: string
          format: date-time
        version:
          type: integer
          minimum: 1
        twoStepVerificationEnabled:
          type: boolean
          description: |
            Whether the account has two-step verification, from the user directory
            (`user.two-step-verification-changed.v1`), `false` until an event says otherwise.
            Present when the actor is the owner or an admin of the organization, absent otherwise;
            the gateway passes it on as is.
    MemberPage:
      type: object
      required: [items, nextCursor, total, counts]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Member'
        nextCursor:
          $ref: '../../components/http.yaml#/components/schemas/NextCursor'
        total:
          type: integer
          minimum: 0
        counts:
          $ref: '#/components/schemas/RoleCounts'
    RoleCounts:
      type: object
      required: [owner, admin, member, guest]
      description: Members of the organization by role, whatever the filters of the request.
      properties:
        owner:
          type: integer
          minimum: 0
        admin:
          type: integer
          minimum: 0
        member:
          type: integer
          minimum: 0
        guest:
          type: integer
          minimum: 0
    MemberPatch:
      type: object
      required: [role]
      properties:
        role:
          $ref: '#/components/schemas/AssignableRole'
    InvitationBatch:
      type: object
      required: [emails]
      properties:
        emails:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: '#/components/schemas/Email'
        role:
          $ref: '#/components/schemas/AssignableRole'
          default: member
    InvitationBatchResult:
      type: object
      required: [invitations]
      properties:
        invitations:
          type: array
          items:
            $ref: '#/components/schemas/InvitationResult'
    Inviter:
      type: object
      required: [userId, name]
      properties:
        userId:
          type: string
          format: uuid
        name:
          type: string
    Invitation:
      type: object
      required: [id, email, role, invitedBy, status, sentAt, expiresAt, version]
      properties:
        id:
          type: string
          format: uuid
        email:
          $ref: '#/components/schemas/Email'
        role:
          $ref: '#/components/schemas/AssignableRole'
        invitedBy:
          $ref: '#/components/schemas/Inviter'
        status:
          type: string
          x-extensible-enum: [pending, expired]
        sentAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        version:
          type: integer
          minimum: 1
    InvitationPage:
      type: object
      required: [items, nextCursor, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Invitation'
        nextCursor:
          $ref: '../../components/http.yaml#/components/schemas/NextCursor'
        total:
          type: integer
          minimum: 0
    InvitingOrganization:
      type: object
      required: [id, name, slug, description, memberCount]
      description: The organization of an invitation, as the invitee sees it before joining.
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        description:
          type: [string, 'null']
        memberCount:
          type: integer
          minimum: 1
    ReceivedInvitation:
      type: object
      required: [id, organization, role, invitedBy, expiresAt]
      properties:
        id:
          type: string
          format: uuid
        organization:
          $ref: '#/components/schemas/InvitingOrganization'
        role:
          $ref: '#/components/schemas/AssignableRole'
        invitedBy:
          $ref: '#/components/schemas/Inviter'
        expiresAt:
          type: string
          format: date-time
    ReceivedInvitationPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ReceivedInvitation'
        nextCursor:
          $ref: '../../components/http.yaml#/components/schemas/NextCursor'
