            example:
              userId: 019a5f3c-9e1f-7b2a-8c3d-4e5f6a7b8c31
      responses:
        '200':
          description: Eligibility of the requested account in the signed organization.
          headers:
            Cache-Control:
              $ref: '#/components/headers/AutomationRecipientPrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutomationRecipientDecision'
              examples:
                activeAtelierNordMember:
                  value: { eligible: true }
                outsideOrganization:
                  value: { eligible: false }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InternalTokenRefused'
        '403':
          $ref: '#/components/responses/RoleForbidden'
        '404':
          $ref: '#/components/responses/OrganizationNotFound'
        '503':
          $ref: '#/components/responses/AutomationRecipientUnavailable'
  /internal/v1/members/{memberId}:
