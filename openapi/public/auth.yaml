# Public routes of authentication: sign-up, email verification, federated sign-in, sign-in by password or by email
# code and its two-step challenge, sign-out, password reset and recent re-authentication, the
# current user and its profile, and the security of the account (password, address, two-step
# verification, open sessions, deletion). Served by cadenway-api-gateway, which calls
# openapi/internal/identity-service.yaml for each of them.
openapi: 3.1.0
info:
  title: Cadenway authentication
  version: 1.0.0
  description: |
    How a person creates an account, proves the address, signs in and out, reads who they are, and
    keeps the account safe: the password, its reset, the two-step verification, the open sessions,
    the address and the deletion of the account. The API gateway serves these routes and answers
    them through identity-service.

    **Sessions.** A session travels only in the cookie `__Host-cw_session`, set by the gateway on the
    responses that sign in (`Set-Cookie`) and cleared by the sign-out and by the scheduling of the
    deletion of the account. The token is opaque: the gateway checks it on every request with
    identity-service, without a cache, so a revoked session stops at the next request. The web
    application never reads it (`HttpOnly`). A route without a session (`security: []`) ignores the
    cookie and any bearer token: a stale one never makes it fail. The responses that sign in,
    carry a two-step challenge (the `202` of the sign-ins, the inspection of a challenge, the
    WebAuthn options) or answer one, `GET /v1/me` and the routes of the tags `account`,
    `two-step-verification` and `sessions` carry `Cache-Control: no-store`. The person lists their
    open sessions and closes them (`GET /v1/sessions`, `DELETE /v1/sessions/{sessionId}`,
    `POST /v1/sessions/revoke-others`). A session ends after the inactivity the authentication
    policy of its current organization sets (1 hour, 12 hours, 7 days or 30 days;
    `openapi/public/organizations.yaml`), 12 hours without an organization.

    **Two-step verification** ("Vérification en deux étapes"). The person turns it on from their
    account with an authenticator app (TOTP, RFC 6238: 30-second steps, 6 digits, one step of
    tolerance either way, a code accepted once only), which also gives them 10 backup codes
    (`XXXX-XXXX`, shown once, each used once), and may then add security keys or biometrics
    (WebAuthn). From then on, a sign-in whose password or email code is right answers `202` with a
    challenge instead of a session, unless the browser is a trusted device; the person answers it
    with a code of the app, a backup code or a security key (`/v1/auth/sign-in/challenge/…`), and
    only the right answer opens the session. Five wrong answers in a row, across the challenges of
    the account and the two-step confirmations of `POST /v1/auth/reauthentication`, lock the
    answers of the account for 15 minutes (`429 auth.two-step-locked`). identity-service keeps the
    secret of the app encrypted and the backup codes and challenge tokens hashed; the secret and the
    backup codes reach the browser once each, in the answer of the route that creates them, and
    never travel in an event or an email.

    **Trusted devices.** An answer with `trustDevice: true` ("Faire confiance à cet appareil pendant
    30 jours") makes the gateway set a second cookie, `__Host-cw_trusted_device`
    (`Path=/; Secure; HttpOnly; SameSite=Strict; Max-Age=2592000`): for 30 days the sign-ins of that
    account from this browser skip the challenge. The cookie holds an opaque token of the account,
    which identity-service keeps hashed; the gateway sends it to identity-service only during
    password sign-in, email-code verification or federated sign-in completion and never logs it.
    It is `SameSite=Strict`: the web application and the API are
    one site, and no other site ever needs it. A browser trusts one account at a time: trusting another one
    replaces the cookie. A password change or reset, closing the other sessions, turning two-step
    verification off and scheduling the deletion of the account forget every trusted device of the
    account at once; a stale cookie is then ignored, and the sign-in answers the challenge.

    **Credentials and scopes.** Every public operation of Cadenway declares in its own `security`
    what may call it: `sessionCookie: []` for a session, `apiToken: [<scope>]` for a personal API
    token (`openapi/public/api-tokens.yaml`) with that scope, `[]` for no credential. A session
    holds every scope. The routes of this document accept no personal API token: one that calls a
    route that needs a session, such as `GET /v1/me`, gets `403 auth.api-token-not-accepted`. On a
    route that needs a credential, a request that carries `Authorization: Bearer` is authenticated
    with that token alone and its cookie is ignored. The routes without a session (`security: []`)
    and the sign-out ignore any bearer token: the sign-out always closes the session of the cookie.

    **Cross-site requests.** Except for the SAML provider callback described below, every request
    with an unsafe method on these routes, signed in or not,
    carries an `Origin` equal to one of the gateway's allowed origins (the web application, the
    website) and, for a `POST`, a `PUT` or a `PATCH`, `Content-Type: application/json`; a bodiless
    `DELETE` passes on its `Origin` alone. The gateway refuses any other request before the route
    runs (`403 auth.csrf-rejected`). Signing in, signing up and the password reset are covered too,
    so that another site cannot sign a browser in to an account of its choosing. A `PATCH` is a
    JSON Merge Patch (RFC 7396) sent as `application/json`, for the same reason. The other
    documents apply the same rule to the requests the cookie authenticates. A request
    authenticated by a personal API token carries no ambient credential and needs no `Origin`.

    **Federated sign-in.** The browser starts the flow with JSON and an allowed Origin, then
    navigates to the returned authorization URL. OAuth providers return by GET and the SAML
    identity provider sends a form POST. Only that SAML POST accepts a cross-site form and does
    not use an existing session as proof. Both callbacks require a one-use server-issued state
    and the matching browser binding. The callback redirects to a fixed web application page
    without putting a Cadenway session token, provider credential or two-step challenge in the
    redirect. The page completes sign-in with JSON and an allowed Origin. A provider assertion,
    code, state, browser binding or receipt is never logged or echoed in an error.

    **Account enumeration.** Only the sign-up and the change of address say whether an address is
    taken: the sign-up as the mockup does, the change of address only to a signed-in person who
    proved who they are in the last 10 minutes (see "Recent authentication"). Every other route
    answers the same way whether or not an account
    uses the address: the method discovery, the code requests, the password reset request, the code
    checks, the password check and its lockout, which are counted per address. A reset link tells
    its own account (`POST /v1/auth/password-reset/inspection`) to whoever holds it, the person who
    received it at that address.

    **Recent authentication.** Changing the address (`POST /v1/me/email-change`), scheduling the
    deletion of the account (`POST /v1/me/deletion`), creating a personal API token
    (`POST /v1/api-tokens`, `openapi/public/api-tokens.yaml`), changing the authentication policy
    of an organization (`PATCH /v1/organization/authentication-policy`,
    `openapi/public/organizations.yaml`), every change of the two-step verification that starts or
    removes something (setting up or reconfiguring the app, turning it off, regenerating the backup
    codes, starting the registration of a security key and removing one), and, for an account with
    two-step verification, changing the password (`PUT /v1/me/password`) need a session whose
    person proved who they are in the last 10 minutes. Otherwise they answer
    `403 auth.reauthentication-required`, with `details.methods`, the ways the person can confirm:
    the web application asks for one, calls `POST /v1/auth/reauthentication`, then repeats the
    request. What proves it depends on the account:

    - Without two-step verification: the sign-in that opened the session, the password confirmed
      with `POST /v1/auth/reauthentication`, or the right current password of
      `PUT /v1/me/password`. `details.methods` is `[password]`.
    - With two-step verification: a two-step proof only, never a password alone. That is the
      sign-in that opened the session by answering its challenge, a code of the authenticator app
      confirmed with `POST /v1/auth/reauthentication`, or the code that confirms the app in
      `POST /v1/me/two-step-verification/authenticator-app/setup/confirmation`. A sign-in on a
      trusted device, which skipped the challenge, opens no window, and neither does the current
      password of a password change. `details.methods` is `[authenticator-app]`; a security key
      does not confirm in this version (a later version may add it as a new value, which a client
      ignores when it does not know it). A person without their app signs in again with a backup
      code: the answer of that challenge opens the window.

    The window belongs to one session: confirming in one browser does not open it in another.
    Turning two-step verification on ends the windows that other sessions of the account opened
    with a password. identity-service answers this code, which the gateway forwards. The steps
    that complete a started change (the code that confirms the app, the key that answers its
    registration options) need no new confirmation: their start did.

    **Security emails.** identity-service tells notification-service what happened, through the
    events of `asyncapi/identity-service.yaml`, and notification-service sends the email, in French
    under "Sécurité · toujours envoyé": the person cannot turn these emails off. The reset link
    travels only in a restricted event (`password-reset-link.issued.v1`), the code of a change of
    address in `one-time-code.issued.v1`; the other emails come from facts of the account
    (`user.password-changed.v1`, `user.email-changed.v1`, `session.opened-on-new-device.v1`,
    `user.deletion-scheduled.v1`, `user.deletion-cancelled.v1`,
    `user.two-step-verification-changed.v1`). No email carries a secret of two-step verification:
    the backup codes are shown once in the web application, never emailed.

    **Errors.** Every error is an `application/problem+json` problem with a stable `code`. The
    `code` is the contract. For a code the web application shows to the person, `title` is French
    text it may show as is, the same for every occurrence of the code; the other codes carry the
    English reason phrase of the status. `details` carries the values the web application formats
    its own lines from.
    A failed password or code answers `422`, never `401`: `401` means that the session cookie is
    missing or no longer active, or that a bearer token is not valid, and the web application sends
    the person to the sign-in screen on it.

    **Status codes of actions.** The addition of a security key answers `201` with a
    `Location`. A route that sends a code or a link answers `202`. Password sign-in,
    email-code verification and federated finish answer `200` with the session cookie or
    `202` with a two-step challenge and no session cookie. A successful challenge answer
    or sign-up verification opens the session with `200`. Federated start returns the
    provider URL with `200` and the provider callbacks redirect with `303`.
    The sign-out, the revocation of a session and the removals answer `204`. The
    scheduling of the deletion answers `202` and clears the cookie. Completing a
    password reset opens no session.

    **Later versions** add OAuth and SAML method discovery and new two-step methods (new values of the
    method lists, which a client ignores when it does not know them); the list of the trusted
    devices; the reset of the two-step verification of a member by an administrator; and the
    photo. The organizations, the current organization of the session, its authentication policy
    and the personal API tokens are in `openapi/public/organizations.yaml`,
    `openapi/public/members.yaml` and `openapi/public/api-tokens.yaml`.
  contact:
    name: Cadenway
    url: https://github.com/Cadenway/cadenway-api-contracts
  license:
    name: Proprietary
    url: https://github.com/Cadenway/cadenway-api-contracts/blob/main/LICENSE
  x-consumers:
    - repository: cadenway-api-gateway
      uses: Serves every route, through openapi/internal/identity-service.yaml.
    - repository: cadenway-webapp
      uses: Calls every route through @cadenway/api-client (sign-in, sign-up, code, two-step challenge, password reset and sign-out screens, account "Profil", "Préférences" and "Sécurité").
servers:
  - url: https://api.cadenway.com
    description: Production.
  - url: https://api.staging.cadenway.com
    description: Staging. The local stack of cadenway-ops serves the same routes on `api.<DOMAIN>`.
security:
  - sessionCookie: []
tags:
  - name: auth
    description: |
      Sign-up, email verification, sign-in and its two-step challenge, sign-out, password reset,
      recent re-authentication, and the current user and its profile.
  - name: account
    description: The security of the account of the signed-in person, its password, its address and its deletion.
  - name: two-step-verification
    description: |
      The two-step verification of the account of the signed-in person: its authenticator app, its
      backup codes and its security keys.
  - name: sessions
    description: The open sessions of the signed-in person.
paths:
  /v1/auth/sign-in-methods:
    post:
      operationId: discoverSignInMethods
      summary: Discover the sign-in methods of an address
      description: |
        Returns the methods the sign-in screen offers for an address. The address travels in the
        body so that it never sits in a URL or an access log.

        Today every address gets `password` and `email-code`, whether or not an account uses it.
        Later versions add `oauth` and `saml` methods; a client ignores a method type it does not
        know. No session needed. Scopes: none.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignInMethodsRequest'
            example:
              email: camille.martin@ateliernord.fr
      responses:
        '200':
          description: The methods offered for the address.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignInMethods'
              example:
                methods:
                  - type: password
                  - type: email-code
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/CrossSiteRefused'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/auth/sign-up:
    post:
      operationId: signUp
      summary: Create an account
      description: |
        Creates an account that is not verified yet and sends a 6-digit code to the address
        (`POST /v1/auth/sign-up/verification` completes the sign-up). No session is opened.

        - An address used by a verified account answers `409 auth.email-taken`.
        - An address whose earlier sign-up was never verified is not taken: the new sign-up
          replaces its name and password, and the earlier code stops working.
        - The verification is bound to the password of the latest sign-up of the address:
          `POST /v1/auth/sign-up/verification` answers `422 auth.sign-up-replaced` to a `password`
          that differs from it, and requires `password` once the address was signed up more than
          once. A code sent to the address therefore never verifies an account whose password
          someone else chose by signing up the same address.
        - A sign-up is a code request of the address, so it follows the throttle of the code
          requests (`429 auth.code-throttled`), shared with `POST /v1/auth/sign-up/code` and
          `POST /v1/auth/sign-in/code`: 30 seconds between two, at most 5 in an hour.
        - The password has 12 characters (Unicode code points) at least, no composition rule, and
          is refused when it appears in the list of compromised passwords identity-service embeds.

        No session needed. Scopes: none.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignUpRequest'
            example:
              name: Camille Martin
              email: camille.martin@ateliernord.fr
              password: atelier-nord-sprint-14
              acceptTerms: true
      responses:
        '202':
          description: The account exists, unverified, and a code was sent to the address.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodeSent'
              example:
                email: camille.martin@ateliernord.fr
                expiresAt: '2026-11-08T13:17:00Z'
                resendAvailableAt: '2026-11-08T13:07:30Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/CrossSiteRefused'
        '409':
          $ref: '#/components/responses/EmailTaken'
        '422':
          $ref: '#/components/responses/SignUpRefused'
        '429':
          $ref: '#/components/responses/CodeThrottled'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/auth/sign-up/code:
    post:
      operationId: resendSignUpCode
      summary: Send a new sign-up code
      description: |
        Sends a new code for an account whose address is not verified yet; the previous code stops
        working. Throttled per address, account or not, together with the sign-up and the sign-in
        codes: 30 seconds between two requests and at most 5 in an hour (`resendAvailableAt`, else
        `429 auth.code-throttled`).

        Answers `202` for any address, without sending anything when no unverified account uses
        it. No session needed. Scopes: none.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CodeRequest'
            example:
              email: camille.martin@ateliernord.fr
      responses:
        '202':
          description: The request is accepted; a code is on its way when the address awaits one.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodeSent'
              example:
                email: camille.martin@ateliernord.fr
                expiresAt: '2026-11-08T13:17:30Z'
                resendAvailableAt: '2026-11-08T13:08:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/CrossSiteRefused'
        '429':
          $ref: '#/components/responses/CodeThrottled'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/auth/sign-up/verification:
    post:
      operationId: verifySignUp
      summary: Verify the address and sign in
      description: |
        Checks the sign-up code, then the password of the sign-up. On success the address is
        verified, a session is opened and the gateway sets the session cookie. The code is
        single-use and expires 10 minutes after it was sent; after a few wrong attempts it stops
        working and a new one is needed.

        The checks run in this order:

        1. The code. A wrong code answers `422 auth.code-invalid`; a code that expired, was used,
           was replaced or took too many wrong attempts answers `422 auth.code-expired`, with or
           without `password`.
        2. With the right code, a `password` is compared with the password of the pending
           sign-up, the latest one of the address. When it differs, the answer is
           `422 auth.sign-up-replaced` and the code stops working.
        3. When a later sign-up replaced the name and password of the pending account (the
           address was signed up more than once before this verification), `password` is
           required: without it the answer is `422 auth.sign-up-replaced` too, and the code stops
           working. Only an accepted sign-up (`202`) counts: a refused one replaces nothing.

        Without `password`, an address signed up once is verified by its code alone. The web
        application always sends `password`, the one typed in the sign-up form; on
        `auth.sign-up-replaced` the person signs up again (`POST /v1/auth/sign-up`), which
        replaces the pending sign-up and sends a new code. `auth.sign-up-replaced` needs the right
        code, so it tells a caller without the code nothing.

        It never answers a two-step challenge: an account that has just proved its address has no
        two-step verification yet, and belongs to no organization whose policy could require it. No
        session needed. Scopes: none.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignUpVerification'
            example:
              email: camille.martin@ateliernord.fr
              code: '482913'
              rememberMe: false
              password: atelier-nord-sprint-14
      responses:
        '200':
          $ref: '#/components/responses/SignedIn'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/CrossSiteRefused'
        '422':
          $ref: '#/components/responses/SignUpVerificationRefused'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/auth/sign-in/federated/start:
    post:
      operationId: startFederatedSignIn
      x-cadenway-strict-body: true
      summary: Start federated sign-in in this browser
      description: |
        Accepts a social provider (Google, GitHub, Microsoft or GitLab) or a work email address
        for SAML. Identity selects the authorization endpoint from server configuration. A work
        email only selects a configured SAML connection for its verified organization domain;
        this step neither looks up nor discloses the account that uses the address. The caller
        supplies no provider URL or return destination. The browser navigates to the returned
        HTTPS URL. The new flow replaces the previous browser binding, clears any previous
        continuation cookie and does not open a session.
        Requires an allowed Origin and application/json. No session needed. Scopes: none.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../../components/federated-sign-in.yaml#/components/schemas/FederatedSignInStart'
            examples:
              google:
                summary: The Google button on the sign-in screen
                value:
                  provider: google
              atelierNord:
                summary: Atelier Nord's company sign-in
                value:
                  provider: saml
                  email: camille.martin@ateliernord.fr
      responses:
        '200':
          description: Navigate to the authorization endpoint. All responses on this route are private and uncacheable.
          headers:
            Cache-Control:
              $ref: '#/components/headers/FederatedNoStore'
            Set-Cookie:
              $ref: '#/components/headers/FederatedBindingCookie'
          content:
            application/json:
              schema:
                $ref: '../../components/federated-sign-in.yaml#/components/schemas/FederatedAuthorization'
              example:
                authorizationUrl: https://accounts.example.test/authorize
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/CrossSiteRefused'
        '422':
          $ref: '#/components/responses/FederatedSignInRefused'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/auth/sign-in/federated/providers/{provider}/callback:
    get:
      operationId: completeOAuthSignIn
      summary: Receive an OAuth provider's browser callback
      description: |
        The provider returns one state and either one authorization code or an error, never both.
        Recognized optional provider parameters are discarded; duplicated security parameters
        are refused. The gateway sends only the required fields and the opaque browser binding to
        Identity. Identity verifies the state belongs to this browser, provider and callback,
        then authenticates the provider response. It consumes a matched state once, including
        during a provider denial. The callback opens no session and never exposes a secret to the
        web application. All responses have private, no-store caching and no-referrer policy.
        No session needed. Scopes: none.
      tags: [auth]
      security: []
      parameters:
        - name: provider
          in: path
          required: true
          description: The social provider registered for this callback path.
          schema:
            $ref: '../../components/federated-sign-in.yaml#/components/schemas/OAuthSignInProvider'
        - name: state
          in: query
          required: true
          description: Opaque correlation issued by Identity and returned unchanged by the provider.
          schema:
            $ref: '../../components/federated-sign-in.yaml#/components/schemas/FederatedState'
        - name: code
          in: query
          description: Single-use provider authorization code. Present only on success. Never logged.
          schema:
            $ref: '../../components/federated-sign-in.yaml#/components/schemas/OAuthAuthorizationCode'
        - name: error
          in: query
          description: Provider error identifier. Present only on failure and never relayed to the web application.
          schema:
            $ref: '../../components/federated-sign-in.yaml#/components/schemas/OAuthAuthorizationError'
      responses:
        '303':
          $ref: '#/components/responses/FederatedSignInContinuation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/FederatedSignInRefused'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/auth/sign-in/federated/saml/callback:
    post:
      operationId: completeSamlSignIn
      summary: Receive a SAML identity provider's browser callback
      description: |
        SAML 2.0 Web Browser SSO assertion consumer for the HTTP POST binding. This provider
        callback accepts a form from the identity provider instead of JSON from an allowed Origin.
        It never authenticates through the session cookie. Identity verifies the browser binding,
        the one-use RelayState, and the provider assertion against the configured trust and the
        original request. Unsolicited responses are refused. The raw form and decoded assertion
        are bounded before processing. The callback opens no session. All responses have
        private, no-store caching and no-referrer policy. No session needed. Scopes: none.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '../../components/federated-sign-in.yaml#/components/schemas/SamlSignInCallback'
      responses:
        '303':
          $ref: '#/components/responses/FederatedSignInContinuation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/FederatedSignInRefused'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/auth/sign-in/federated/finish:
    post:
      operationId: finishFederatedSignIn
      x-cadenway-strict-empty: true
      summary: Complete a federated sign-in in the initiating browser
      description: |
        After the redirect, submits an empty JSON object from an allowed Origin with the
        HttpOnly continuation cookie. A short-lived, single-use receipt authorizes only this
        operation. The gateway clears it, never copies it into JSON, and applies private,
        no-store caching on all outcomes. Identity resolves the previously linked account
        from the verified external subject, applies current account and organization policies
        and uses the ordinary sign-in session and two-step flow. Neither an email claim nor a
        provider's multi-factor assertion bypasses Cadenway's two-step verification. An
        already trusted device may be used according to the existing policy. Only a 200
        establishes the Cadenway session. No session needed. Scopes: none.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmptyRequest'
            example: {}
      responses:
        '200':
          $ref: '#/components/responses/FederatedSignedIn'
        '202':
          $ref: '#/components/responses/FederatedChallengeIssued'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/CrossSiteRefused'
        '422':
          $ref: '#/components/responses/FederatedSignInRefused'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/auth/sign-in:
    post:
      operationId: signInWithPassword
      summary: Sign in with a password
      description: |
        Checks an address and its password. On success a session is opened and the gateway sets the
        session cookie; `rememberMe` ("Rester connecté pendant 30 jours") makes the cookie
        persistent.

        - A wrong address or password answers `422 auth.invalid-credentials` with
          `details.remainingAttempts`, the failures left before the lockout.
        - The failure that uses the last attempt, and every attempt during the lockout, answer
          `429 auth.account-locked` with `Retry-After` and `details.lockedUntil` (15 minutes).
        - The right password of an account whose address is not verified answers
          `403 auth.email-not-verified`; `POST /v1/auth/sign-up/code` sends a new code.
        - A sign-in to an account whose deletion is scheduled (`POST /v1/me/deletion`) cancels the
          deletion: the answer says so with `deletionCancelled: true`, and
          `user.deletion-cancelled.v1` is emitted. Signing in is the only way to cancel it.
        - A sign-in from a device the account did not use in the last 90 days (see
          `session.opened-on-new-device.v1`) sends the email "Nouvelle connexion".
        - The right password of an account with two-step verification answers `202` with a
          two-step challenge and no cookie ("Vérification en deux étapes"), unless the request
          carries the cookie `__Host-cw_trusted_device` of a device this account trusts (see
          "Trusted devices"). The web application then shows the challenge and answers it with one
          of `/v1/auth/sign-in/challenge/authenticator-app`, `/backup-code` or `/security-key`;
          only the `200` of that answer opens the session, cancels a scheduled deletion and counts
          the device. A new challenge of the account makes the previous one stop working.
          `rememberMe` is kept with the challenge and applies to the session its answer opens.

        Only a `200` means signed in: a client checks the status, not merely a success. A wrong
        password answers the same way whether or not the account has two-step verification. No
        session needed. Scopes: none.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordSignIn'
            example:
              email: camille.martin@ateliernord.fr
              password: atelier-nord-sprint-14
              rememberMe: true
      responses:
        '200':
          $ref: '#/components/responses/SignedIn'
        '202':
          $ref: '#/components/responses/ChallengeIssued'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/EmailNotVerified'
        '422':
          $ref: '#/components/responses/CredentialsRefused'
        '429':
          $ref: '#/components/responses/AccountLocked'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/auth/sign-in/code:
    post:
      operationId: requestSignInCode
      summary: Request a sign-in code
      description: |
        Sends a 6-digit sign-in code to the address when a verified account uses it, valid 10
        minutes; a new request replaces the previous code. Always answers `202`, whether or not an
        account uses the address. Throttled per address, account or not, together with the sign-up
        codes: 30 seconds between two requests and at most 5 in an hour (`resendAvailableAt`, else
        `429 auth.code-throttled`). Asking again is how a code is resent. No session needed.
        Scopes: none.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CodeRequest'
            example:
              email: camille.martin@ateliernord.fr
      responses:
        '202':
          description: The request is accepted; a code is on its way when a verified account uses the address.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodeSent'
              example:
                email: camille.martin@ateliernord.fr
                expiresAt: '2026-11-08T13:17:00Z'
                resendAvailableAt: '2026-11-08T13:07:30Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/CrossSiteRefused'
        '429':
          $ref: '#/components/responses/CodeThrottled'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/auth/sign-in/code/verification:
    post:
      operationId: signInWithCode
      summary: Sign in with a code
      description: |
        Checks a sign-in code. On success a session is opened and the gateway sets the session
        cookie. Same rules for the code as `POST /v1/auth/sign-up/verification`: single-use, 10
        minutes, a few wrong attempts. An address without an account answers like a wrong code.

        As with `POST /v1/auth/sign-in`, the sign-in cancels a scheduled deletion of the account
        (`deletionCancelled: true`, `user.deletion-cancelled.v1`) and, from a device the account did
        not use in the last 90 days, sends "Nouvelle connexion". The right code of an account with
        two-step verification answers `202` with a two-step challenge and no cookie, unless the
        browser is a trusted device of the account, as `POST /v1/auth/sign-in` says: the email code
        proves the address, not the second step. Only a `200` means signed in. No session needed.
        Scopes: none.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CodeVerification'
            example:
              email: camille.martin@ateliernord.fr
              code: '482913'
              rememberMe: true
      responses:
        '200':
          $ref: '#/components/responses/SignedIn'
        '202':
          $ref: '#/components/responses/ChallengeIssued'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/CrossSiteRefused'
        '422':
          $ref: '#/components/responses/CodeRefused'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/auth/sign-in/challenge/inspection:
    post:
      operationId: inspectSignInChallenge
      summary: Read a two-step challenge
      description: |
        Returns a two-step challenge as the `202` of the sign-in gave it, without answering it: the
        web application reads it again when the challenge screen opens anew, for example after a
        reload, from the token it kept for the life of the challenge (`sessionStorage`, never a
        URL). Reading a challenge does not use it and counts no attempt.

        A challenge that expired (10 minutes after the sign-in), was answered, was replaced by a
        newer one, or is unknown answers `422 auth.challenge-expired`: the person signs in again.
        No session needed. Scopes: none.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChallengeTokenRequest'
            example:
              token: ExampleOnlyChallengeToken00000000000000000
      responses:
        '200':
          description: The challenge, as the sign-in issued it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignInChallenge'
              examples:
                camilleMartin:
                  $ref: '#/components/examples/SignInChallenge'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/CrossSiteRefused'
        '422':
          $ref: '#/components/responses/ChallengeExpired'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/auth/sign-in/challenge/authenticator-app:
    post:
      operationId: answerSignInChallengeWithAuthenticatorApp
      summary: Answer a two-step challenge with a code of the app
      description: |
        Checks the 6 digits the authenticator app shows ("Code de l'application", "Le code change
        toutes les 30 secondes."). On success the session is opened, as a `200` sign-in does, and
        the gateway sets the session cookie, and the device cookie with `trustDevice`.

        - A wrong code, or one the account already used, answers `422 auth.two-step-code-invalid`
          with `details.remainingAttempts`. The fifth wrong answer in a row of the account, and
          every answer during the lockout, answer `429 auth.two-step-locked` with
          `details.lockedUntil` (15 minutes) and `Retry-After`.
        - A challenge no longer usable answers `422 auth.challenge-expired`; the challenge is
          checked first, so it counts no attempt.
        - The success uses the challenge up, cancels a scheduled deletion of the account
          (`deletionCancelled: true`, `user.deletion-cancelled.v1`), counts the device for
          "Nouvelle connexion" (`session.opened-on-new-device.v1`) and ends the count of wrong
          answers.

        No session needed. Scopes: none.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthenticatorAppAnswer'
            example:
              token: ExampleOnlyChallengeToken00000000000000000
              code: '261845'
              trustDevice: true
      responses:
        '200':
          $ref: '#/components/responses/ChallengeAnswered'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/CrossSiteRefused'
        '422':
          $ref: '#/components/responses/TwoStepCodeRefused'
        '429':
          $ref: '#/components/responses/TwoStepLocked'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/auth/sign-in/challenge/backup-code:
    post:
      operationId: answerSignInChallengeWithBackupCode
      summary: Answer a two-step challenge with a backup code
      description: |
        Checks a backup code ("Code de secours", `XXXX-XXXX`), which works once: the success uses
        it up, and `backupCodesRemaining` of the next challenges counts one less ("Il vous reste 7
        codes inutilisés. Pensez à en générer de nouveaux depuis votre profil."). The code is read
        without regard to case, with or without its dash. Otherwise as
        `POST /v1/auth/sign-in/challenge/authenticator-app`: the same refusals
        (`422 auth.two-step-code-invalid` for a wrong or used code, `422 auth.challenge-expired`,
        `429 auth.two-step-locked`), counted with the other answers, and the same effects of the
        success. No session needed. Scopes: none.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BackupCodeAnswer'
            example:
              token: ExampleOnlyChallengeToken00000000000000000
              code: 4F7K-2M9Q
              trustDevice: false
      responses:
        '200':
          $ref: '#/components/responses/ChallengeAnswered'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/CrossSiteRefused'
        '422':
          $ref: '#/components/responses/TwoStepCodeRefused'
        '429':
          $ref: '#/components/responses/TwoStepLocked'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/auth/sign-in/challenge/security-key/options:
    post:
      operationId: getSignInChallengeSecurityKeyOptions
      summary: Get the WebAuthn options to answer a challenge with a key
      description: |
        Returns the options the browser needs to ask a security key or the biometrics of the device
        ("Utiliser ma clé de sécurité", "Touchez votre clé ou validez avec la biométrie…"): a new
        WebAuthn challenge, valid 5 minutes, for the keys of the account only. The web application
        passes `options` to `navigator.credentials.get` (through
        `PublicKeyCredential.parseRequestOptionsFromJSON` or an equivalent), then sends the answer
        of the key to `POST /v1/auth/sign-in/challenge/security-key`. Asking again replaces the
        previous options of the challenge.

        - A challenge no longer usable: `422 auth.challenge-expired`.
        - An account without a security key: `422 auth.security-key-refused`.
        - During the lockout of the answers: `429 auth.two-step-locked`.

        No session needed. Scopes: none.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChallengeTokenRequest'
            example:
              token: ExampleOnlyChallengeToken00000000000000000
      responses:
        '200':
          description: The options to pass to the browser.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecurityKeyAssertionOptions'
              example:
                options:
                  challenge: ExampleOnlyWebAuthnChallenge000000000000000
                  rpId: cadenway.com
                  timeout: 300000
                  userVerification: preferred
                  allowCredentials:
                    - id: ExampleOnlyCredentialIdYubiKey5CNfc0000000
                      type: public-key
                      transports: [usb, nfc]
                    - id: ExampleOnlyCredentialIdTouchIdMacBookAir00
                      type: public-key
                      transports: [internal]
                expiresAt: '2026-11-09T07:47:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/CrossSiteRefused'
        '422':
          $ref: '#/components/responses/SecurityKeyAnswerRefused'
        '429':
          $ref: '#/components/responses/TwoStepLocked'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/auth/sign-in/challenge/security-key:
    post:
      operationId: answerSignInChallengeWithSecurityKey
      summary: Answer a two-step challenge with a security key
      description: |
        Checks the answer of a security key to the options of
        `POST /v1/auth/sign-in/challenge/security-key/options` ("Clé reconnue : YubiKey 5C NFC").
        The web application sends `credential` as the browser gave it, serialized as JSON
        (`PublicKeyCredential.toJSON()` or an equivalent).

        - An answer that does not verify (another key, another challenge, options that expired or
          were replaced, a signature that does not check) answers `422 auth.security-key-refused`
          with `details.remainingAttempts`, and counts with the other wrong answers
          (`429 auth.two-step-locked` on the fifth).
        - A challenge no longer usable: `422 auth.challenge-expired`.
        - On success, the effects of `POST /v1/auth/sign-in/challenge/authenticator-app`, and the
          key records its last use.

        No session needed. Scopes: none.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SecurityKeyAnswer'
            example:
              token: ExampleOnlyChallengeToken00000000000000000
              credential:
                id: ExampleOnlyCredentialIdYubiKey5CNfc0000000
                rawId: ExampleOnlyCredentialIdYubiKey5CNfc0000000
                type: public-key
                response:
                  clientDataJSON: ExampleOnlyClientDataJson
                  authenticatorData: ExampleOnlyAuthenticatorData
                  signature: ExampleOnlySignature
                  userHandle: ExampleOnlyUserHandle
                authenticatorAttachment: cross-platform
                clientExtensionResults: {}
              trustDevice: true
      responses:
        '200':
          $ref: '#/components/responses/ChallengeAnswered'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/CrossSiteRefused'
        '422':
          $ref: '#/components/responses/SecurityKeyAnswerRefused'
        '429':
          $ref: '#/components/responses/TwoStepLocked'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/auth/sign-out:
    post:
      operationId: signOut
      summary: Sign out of the current session
      description: |
        Closes the session of the cookie, on this browser only: the other sessions of the account
        stay open. Always clears the cookie and answers `204`, also when the session had already
        ended or no cookie came: signing out twice is not an error.

        The body is an empty JSON object: the cross-site check needs
        `Content-Type: application/json`. A bearer token, if any, is ignored. Scopes: none.
      tags: [auth]
      security:
        - sessionCookie: []
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignOutRequest'
            example: {}
      responses:
        '204':
          description: Signed out; the cookie is cleared.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/ClearSessionCookie'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/CrossSiteRefused'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/auth/password-reset:
    post:
      operationId: requestPasswordReset
      summary: Request a password reset link
      description: |
        Sends a link to choose a new password ("Mot de passe oublié") to the address when a
        verified account uses it. Always answers `202` the same way, whether or not an account uses
        the address ("Si un compte existe pour <email>, un lien de réinitialisation vient de
        partir.").

        - The link opens `<web application>/reset#token=<token>`: the token sits in the fragment,
          which no server receives or logs. It works once, for 30 minutes (`expiresAt`), from any
          browser: it is not bound to the browser that asked for it, so that the email can be
          opened on another device.
        - A new request makes the previous link stop working ("Un nouveau lien vient de partir ;
          le précédent ne fonctionne plus."). Asking again is how the link is resent.
        - Throttled per address, account or not, apart from the codes: a request is refused less
          than 45 seconds after the last accepted one, and once 5 were accepted in the current
          hour (`resendAvailableAt`, else `429 auth.reset-throttled`).
        - The current password keeps working until a new one is chosen; asking for a link signs
          nobody out. An account whose address is not verified gets no link: its sign-up code
          verifies it (`POST /v1/auth/sign-up/code`).

        Emits the restricted `password-reset-link.issued.v1`, from which notification-service sends
        the email "Réinitialisez votre mot de passe Cadenway". No session needed. Scopes: none.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
            example:
              email: camille.martin@ateliernord.fr
      responses:
        '202':
          description: The request is accepted; a link is on its way when a verified account uses the address.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordResetLinkSent'
              example:
                email: camille.martin@ateliernord.fr
                expiresAt: '2026-11-09T13:40:00Z'
                resendAvailableAt: '2026-11-09T13:10:45Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/CrossSiteRefused'
        '429':
          $ref: '#/components/responses/ResetThrottled'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/auth/password-reset/inspection:
    post:
      operationId: inspectPasswordResetLink
      summary: Read the account of a password reset link
      description: |
        Tells the reset screen ("Choisir un nouveau mot de passe") which account a link is for
        ("Pour le compte <email>.") and how many sessions the reset would close ("3 appareils
        connectés seront déconnectés"). The web application reads the token from the fragment of
        the link and sends it in the body, never in a URL of the API. Reading a link does not use
        it.

        `sessionCount` counts every open session of the account: the reset runs without a session,
        so none of them is "this device" (the mockup's "sauf celui-ci" does not apply). A link that
        expired, was used, was replaced by a newer one or is unknown answers
        `422 auth.reset-link-expired` ("Ce lien a expiré"): the web application offers to ask for a
        new one. No session needed. Scopes: none.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetToken'
            example:
              token: ExampleOnlyResetToken0000000000000000000000
      responses:
        '200':
          description: The link works; the account it is for.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordResetLink'
              example:
                email: camille.martin@ateliernord.fr
                expiresAt: '2026-11-09T13:40:00Z'
                sessionCount: 3
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/CrossSiteRefused'
        '422':
          $ref: '#/components/responses/ResetLinkExpired'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/auth/password-reset/confirmation:
    post:
      operationId: confirmPasswordReset
      summary: Choose a new password with a reset link
      description: |
        Sets the new password of the account of the link and uses the link up. Never signs in:
        the web application then offers "Se connecter".

        - `closeOtherSessions` ("Fermer mes autres sessions", ticked by default) closes every open
          session of the account; unticked, they stay open. `closedSessionCount` says how many
          closed ("Vos 3 autres sessions ont été fermées." or "Vos autres sessions restent
          ouvertes.").
        - The new password follows the rules of the sign-up: 12 characters at least, no
          composition rule (the four rules of the mockup's reset screen do not apply), not in the
          list of compromised passwords (`422 auth.password-too-short`,
          `422 auth.password-compromised`). A refused password leaves the link usable.
        - A link that expired, was used, was replaced or is unknown answers
          `422 auth.reset-link-expired`.
        - The reset ends the lockout of the password sign-in of the address, drops a pending change
          of address, ends the recent authentication of every session it leaves open, drops the open
          two-step challenge and every pending two-step setup and key registration of the account,
          forgets every trusted device of the account, keeps the personal API tokens and the
          two-step verification, and does not cancel a scheduled deletion of the account: only a sign-in
          does. The next sign-in of an account with two-step verification answers its challenge,
          as before the reset.

        Emits `user.password-changed.v1` (`method: reset`), from which notification-service sends
        "Votre mot de passe a été modifié" to the address of the account ("Un e-mail de
        confirmation vient de partir vers <email>."), and `session.revoked.v1` for each closed
        session. No session needed. Scopes: none.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmation'
            example:
              token: ExampleOnlyResetToken0000000000000000000000
              newPassword: nord-atelier-sprint-15
              closeOtherSessions: true
      responses:
        '200':
          description: The password is changed; nobody is signed in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordResetCompleted'
              example:
                email: camille.martin@ateliernord.fr
                closedSessionCount: 3
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/CrossSiteRefused'
        '422':
          $ref: '#/components/responses/PasswordResetRefused'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/auth/reauthentication:
    post:
      operationId: reauthenticate
      summary: Confirm who the signed-in person is
      description: |
        Opens the window of recent authentication of this session for 10 minutes (see "Recent
        authentication" above). The web application calls it when a route answered
        `403 auth.reauthentication-required`, then repeats that request. It sends the method of
        `details.methods`: `password` for an account without two-step verification, `code`, the 6
        digits of the authenticator app, for an account with it.

        - Both or neither answer `400 request.invalid`.
        - `password` for an account with two-step verification answers
          `403 auth.reauthentication-required` with `details.methods: [authenticator-app]`: a
          password alone never confirms such an account. The password is not checked and no
          attempt is counted, so the route tells nothing about it.
        - `code` for an account without an authenticator app answers
          `409 auth.two-step-not-enabled`.

        - A wrong password answers `422 auth.password-incorrect` with
          `details.remainingAttempts`. It counts with the failed sign-ins of the address of the
          account: the failure that uses the last attempt, and every attempt during the lockout,
          answer `429 auth.account-locked` (15 minutes). The lockout also refuses the password
          sign-in of the address, but leaves this session open.
        - A wrong or already used code answers `422 auth.two-step-code-invalid` with
          `details.remainingAttempts`. It counts with the wrong answers of the two-step challenges
          of the account: the fifth in a row, and every code during the lockout, answer
          `429 auth.two-step-locked` (15 minutes), which leaves this session open.

        Session only: a personal API token gets `403 auth.api-token-not-accepted`.
      tags: [auth]
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReauthenticationRequest'
            examples:
              password:
                summary: With the password
                value:
                  password: atelier-nord-sprint-14
              authenticatorApp:
                summary: With a code of the authenticator app
                value:
                  code: '261845'
      responses:
        '200':
          description: The password or the code is right; the guarded routes accept this session until `expiresAt`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecentAuthentication'
              example:
                authenticatedAt: '2026-11-09T13:12:00Z'
                expiresAt: '2026-11-09T13:22:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/RecentAuthenticationForbidden'
        '409':
          $ref: '#/components/responses/TwoStepNotEnabled'
        '422':
          $ref: '#/components/responses/PasswordRefused'
        '429':
          $ref: '#/components/responses/AccountLocked'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/me:
    get:
      operationId: getCurrentUser
      summary: Read the current user
      description: |
        Returns the account of the session and its profile ("Profil"). The organizations of the
        account are listed by `GET /v1/organizations` and the current one is read by
        `GET /v1/organization` (`openapi/public/organizations.yaml`). Session only: a personal API
        token gets `403 auth.api-token-not-accepted`.
      tags: [auth]
      security:
        - sessionCookie: []
      responses:
        '200':
          description: The signed-in user.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
              examples:
                camilleMartin:
                  $ref: '#/components/examples/CamilleMartin'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ApiTokenNotAccepted'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
    patch:
      operationId: updateCurrentUser
      summary: Update the profile of the current user
      description: |
        Applies a JSON Merge Patch (RFC 7396) to the profile of the account ("Informations
        personnelles" and "Langue"): a member left out is unchanged, `null` clears `displayName` or
        `jobTitle`. Colleagues see the change at once ("Vos collègues verront les changements tout
        de suite.").

        - `timeZone` is an IANA time zone name; a name identity-service does not know answers
          `400 request.invalid` with an issue on `timeZone`.
        - `If-Match` is optional; a version that is no longer the current one answers
          `412 request.version-mismatch`.
        - Change the address with `POST /v1/me/email-change`, the password with
          `PUT /v1/me/password` and the photo with the avatar operations in `profile-media.yaml`.

        Emits `user.profile-updated.v1` when something changed; a patch that changes nothing
        answers `200` with the same version and emits nothing. Session only: a personal API token
        gets `403 auth.api-token-not-accepted`.
      tags: [auth]
      security:
        - sessionCookie: []
      parameters:
        - name: If-Match
          in: header
          required: false
          description: '`"<version>"` the change was made from, as the `ETag` gave it.'
          schema:
            type: string
            examples: ['"2"']
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfilePatch'
            example:
              displayName: camille
              jobTitle: Responsable produit
              timeZone: Europe/Paris
      responses:
        '200':
          description: The account after the change.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
              examples:
                camilleMartin:
                  $ref: '#/components/examples/CamilleMartin'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ProfileForbidden'
        '412':
          $ref: '#/components/responses/VersionMismatch'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/me/password:
    put:
      operationId: changePassword
      summary: Change the password
      description: |
        Replaces the password of the account ("Modifier le mot de passe"). The other sessions stay
        open ("Vos autres sessions resteront ouvertes."), and so do the personal API tokens.

        The checks run in this order:

        1. The new password, against the rules of the sign-up: 12 characters at least, no
           composition rule, not in the list of compromised passwords
           (`422 auth.password-too-short`, `422 auth.password-compromised`). No attempt is counted.
        2. For an account with two-step verification only, a recent two-step proof of this
           session (see "Recent authentication"): without one, `403 auth.reauthentication-required`
           with `details.methods: [authenticator-app]`, before the current password is checked or
           counted.
        3. The current password, always required. A wrong one answers
           `422 auth.password-incorrect` with `details.remainingAttempts` and counts with the
           failed sign-ins of the address, as `POST /v1/auth/reauthentication` says
           (`429 auth.account-locked`). For an account without two-step verification, a right one
           counts as a recent authentication of this session, and no other recent authentication
           is required: the current password stands for it. For an account with two-step
           verification, it never counts as one.

        The change
        drops a pending change of address, ends the recent authentication of every other session,
        which stay open, drops their pending two-step setups and key registrations and the open
        challenge of the account, and forgets every trusted device of the account, this browser's
        included, so that the next sign-in of an account with two-step verification answers its
        challenge everywhere. Answers the account, with its new `passwordChangedAt` ("Modifié
        aujourd’hui") and the next `version`.
        Emits `user.password-changed.v1` (`method: change`, no session closed), from which
        notification-service sends "Votre mot de passe a été modifié" to the address of the
        account ("Un e-mail de confirmation vient de partir vers <email>."). Session only: a
        personal API token gets `403 auth.api-token-not-accepted`.
      tags: [account]
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChange'
            example:
              currentPassword: atelier-nord-sprint-14
              newPassword: nord-atelier-sprint-15
      responses:
        '200':
          description: The account after the change.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
              example:
                id: 019a5f3c-8d2e-7c4a-9b1f-3e5d7a9c1b30
                name: Camille Martin
                email: camille.martin@ateliernord.fr
                language: fr
                displayName: camille
                jobTitle: Responsable produit
                timeZone: Europe/Paris
                passwordChangedAt: '2026-11-09T13:16:00Z'
                version: 4
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/RecentAuthenticationForbidden'
        '422':
          $ref: '#/components/responses/PasswordChangeRefused'
        '429':
          $ref: '#/components/responses/AccountLocked'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/me/email-change:
    post:
      operationId: requestEmailChange
      summary: Ask to change the address
      description: |
        Sends a 6-digit code to the new address ("Un code à 6 chiffres y sera envoyé."), valid 15
        minutes. The current address stays the address of the account, for the sign-in and the
        emails, until the code is confirmed ("L'adresse actuelle reste active jusqu'à la
        confirmation."). A new request replaces the pending change and makes its code stop
        working; asking again for the same address is how the code is resent. The pending change
        belongs to this session: the end or the revocation of the session, and a change or a reset
        of the password, drop it.

        The checks run in this order:

        1. Recent authentication of this session (`403 auth.reauthentication-required`).
        2. `email` is the current address of the account: `422 auth.email-unchanged`.
        3. A verified account uses `email`: `409 auth.email-taken`. An unverified sign-up of the
           address does not make it taken.
        4. The code requests of the new address are throttled with its other codes, account or
           not (see `CodeThrottled`): 30 seconds between two and at most 5 in an hour
           (`429 auth.code-throttled`).

        Emits the restricted `one-time-code.issued.v1` with the purpose `email-change`, from
        which notification-service sends the code to the new address. Session only: a personal
        API token gets `403 auth.api-token-not-accepted`.
      tags: [account]
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailChangeRequest'
            example:
              email: camille@ateliernord.fr
      responses:
        '202':
          description: The code is on its way to the new address.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailChangeCodeSent'
              example:
                email: camille@ateliernord.fr
                expiresAt: '2026-11-09T13:35:00Z'
                resendAvailableAt: '2026-11-09T13:20:30Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/RecentAuthenticationForbidden'
        '409':
          $ref: '#/components/responses/EmailTaken'
        '422':
          $ref: '#/components/responses/EmailUnchanged'
        '429':
          $ref: '#/components/responses/CodeThrottled'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/me/email-change/confirmation:
    post:
      operationId: confirmEmailChange
      summary: Confirm the new address with its code
      description: |
        Checks the code sent to the new address and makes it the address of the account, verified
        ("<email> est vérifiée et reçoit désormais vos e-mails."). Same rules for the code as the
        sign-in code, except its 15 minutes: single use, and a few wrong attempts stop it.

        - The change belongs to the session that asked for it. From another session, without a
          pending change, or with a wrong code: `422 auth.code-invalid`. A code that expired, was
          used, was replaced or took too many wrong attempts: `422 auth.code-expired`.
        - An address a verified account took since the request: `409 auth.email-taken`, and the
          change is dropped.
        - Recent authentication is not required again: the request required it, and the code
          proves the new address.

        From then on the account signs in with the new address only. The codes and the reset link
        issued to the previous address stop working, and an unverified sign-up of the new address
        ends; the sessions and the personal API tokens stay. Emits `user.email-changed.v1`, from
        which notification-service sends a notice to the previous address and organization-service
        updates its directory. Answers the account. Session only: a personal API token gets
        `403 auth.api-token-not-accepted`.
      tags: [account]
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailChangeConfirmation'
            example:
              code: '731406'
      responses:
        '200':
          description: The account, with its new address.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
              example:
                id: 019a5f3c-8d2e-7c4a-9b1f-3e5d7a9c1b30
                name: Camille Martin
                email: camille@ateliernord.fr
                language: fr
                displayName: camille
                jobTitle: Responsable produit
                timeZone: Europe/Paris
                passwordChangedAt: '2026-11-09T13:16:00Z'
                version: 5
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/SessionWriteForbidden'
        '409':
          $ref: '#/components/responses/EmailTaken'
        '422':
          $ref: '#/components/responses/EmailChangeCodeRefused'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/me/deletion:
    post:
      operationId: scheduleAccountDeletion
      summary: Schedule the deletion of the account
      description: |
        Schedules the deletion of the account in 30 days ("Supprimer mon compte"). At once, every
        session of the account, this one included, and every personal API token are revoked, and
        every trusted device is forgotten: the gateway clears the session cookie and the web
        application shows the sign-out screen. The two-step verification stays: the sign-in that
        cancels the deletion answers its challenge first.

        - Until `deleteAt`, signing in again cancels the deletion ("une connexion suffit pour
          annuler"): `POST /v1/auth/sign-in` or `POST /v1/auth/sign-in/code/verification`, whose
          answer then carries `deletionCancelled: true`. There is no other way to cancel it, since
          no session or token of the account outlives the scheduling. A password reset does not
          cancel it, and the cancellation does not bring back the revoked sessions and tokens.
        - At `deleteAt`, identity-service deletes the account (`user.deleted.v1`):
          organization-service removes its memberships, and the tasks and documents stay in the
          organizations, attributed to « Ancien membre ». The address is free again.

        The checks run in this order:

        1. The person owns an organization: `409 account.organization-owner`, with
           `details.organizationIds`. identity-service answers it from its copy of the memberships
           (`member.joined.v1` gives the owner of an organization at its creation), without calling
           organization-service. An organization created in the seconds before may not be in the
           copy yet: identity-service checks the copy again at `deleteAt` and does not delete an
           account that owns an organization then.
        2. Recent authentication of this session (`403 auth.reauthentication-required`).

        Emits `user.deletion-scheduled.v1`, from which notification-service sends "La suppression
        de votre compte est programmée", and `session.revoked.v1` for each session. The body is an
        empty JSON object. Session only: a personal API token gets
        `403 auth.api-token-not-accepted`.
      tags: [account]
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmptyRequest'
            example: {}
      responses:
        '202':
          description: The deletion is scheduled; the sessions and tokens are revoked and the cookie is cleared.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/ClearSessionCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletionScheduled'
              example:
                deleteAt: '2026-12-09T15:30:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/RecentAuthenticationForbidden'
        '409':
          $ref: '#/components/responses/OrganizationOwner'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/me/two-step-verification:
    get:
      operationId: getTwoStepVerification
      summary: Read the two-step verification of the account
      description: |
        Returns the state of the card "Vérification en deux étapes" of the account: whether it is
        on ("Activée" / "Désactivée"), the authenticator app ("Configurée le 3 mars 2026 · méthode
        principale"), the security keys ("2 clés : YubiKey 5C NFC, Touch ID (MacBook Air)"), the
        backup codes left ("7 codes inutilisés sur 10"), and the organizations whose policy
        requires it of the person ("Exigée par Atelier Nord pour les propriétaires et
        administrateurs."), which the web application names from `GET /v1/organizations`. Never
        returns a secret. Session only: a personal API token gets
        `403 auth.api-token-not-accepted`.
      tags: [two-step-verification]
      security:
        - sessionCookie: []
      responses:
        '200':
          description: The two-step verification of the account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TwoStepVerification'
              examples:
                enabled:
                  $ref: '#/components/examples/TwoStepVerificationEnabled'
                disabled:
                  summary: Turned off, required by Atelier Nord for its owner and admins
                  value:
                    enabled: false
                    primaryMethod: null
                    methods: []
                    authenticatorApp: null
                    securityKeys: []
                    backupCodes: null
                    requiredBy:
                      - organizationId: 019a5f3c-8d2e-7c4a-9b1f-3e5d7a9c1b2f
                        requiredFor: admins
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ApiTokenNotAccepted'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
    delete:
      operationId: disableTwoStepVerification
      summary: Turn two-step verification off
      description: |
        Turns the two-step verification of the account off ("Désactiver"): the authenticator app,
        the security keys and the backup codes are deleted, and every trusted device is forgotten.
        The next sign-ins open a session with the password or the email code alone ("Votre compte
        n'est protégé que par un mot de passe."). Turning it off when it is off answers `204` and
        emits nothing.

        The checks run in this order:

        1. An organization whose policy requires two-step verification for a role the person has
           in it: `409 auth.mfa-required-by-organization`, with `details.organizationIds`, from
           identity-service's copy of the memberships.
        2. Recent authentication of this session (`403 auth.reauthentication-required`).

        Emits `user.two-step-verification-changed.v1` (`change: disabled`), from which
        notification-service sends a security email and organization-service updates the column
        "Deux étapes" of its members. Session only: a personal API token gets
        `403 auth.api-token-not-accepted`.
      tags: [two-step-verification]
      security:
        - sessionCookie: []
      responses:
        '204':
          description: Two-step verification is off.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/RecentAuthenticationForbidden'
        '409':
          $ref: '#/components/responses/MfaRequiredByOrganization'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/me/two-step-verification/authenticator-app/setup:
    post:
      operationId: startAuthenticatorAppSetup
      summary: Start setting up the authenticator app
      description: |
        Starts the setup of an authenticator app ("Configurer l'application d'authentification",
        step "Scanner"): returns a new secret, once, with the `otpauth://` URI the web application
        draws as a QR code ("Scannez ce code avec votre application, ou saisissez la clé :"), in
        the browser, never through a remote service or a URL. The secret is a secret: the web
        application shows it grouped by 4 and copies it without spaces, and never keeps it. Nothing changes on the account until the confirmation with a
        code of the app (`POST /v1/me/two-step-verification/authenticator-app/setup/confirmation`).

        - The same route turns two-step verification on, when it is off, and reconfigures the app
          ("Reconfigurer"), when it is on: the current app keeps working until the new one is
          confirmed.
        - The pending setup belongs to this session and expires 15 minutes later; a new start
          replaces it and its secret.
        - Recent authentication of this session is required
          (`403 auth.reauthentication-required`): a stolen session cannot enroll a factor of its
          own.

        The body is an empty JSON object. Session only: a personal API token gets
        `403 auth.api-token-not-accepted`.
      tags: [two-step-verification]
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmptyRequest'
            example: {}
      responses:
        '200':
          description: The secret of the new app, returned once.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticatorAppSetup'
              example:
                secret: JBSWY3DPEHPK3PXPJBSWY3DPEHPK3PXP
                otpauthUri: otpauth://totp/Cadenway:camille.martin%40ateliernord.fr?secret=JBSWY3DPEHPK3PXPJBSWY3DPEHPK3PXP&issuer=Cadenway&algorithm=SHA1&digits=6&period=30
                expiresAt: '2026-11-09T13:35:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/RecentAuthenticationForbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/me/two-step-verification/authenticator-app/setup/confirmation:
    post:
      operationId: confirmAuthenticatorAppSetup
      summary: Confirm the authenticator app with one of its codes
      description: |
        Checks a code the new app shows ("Vérifier", "Code affiché par l'application") against the
        secret of the pending setup of this session, then makes it the authenticator app of the
        account.

        - When two-step verification was off, it turns on, with 10 new backup codes returned here
          once ("Application configurée", "Conservez ces codes de secours hors ligne : chacun ne
          sert qu'une fois."; toast "Vérification en deux étapes activée", "Elle vous sera
          demandée à la prochaine connexion."). `change: enabled`.
        - When it was on, the new app replaces the previous one, whose codes stop working; the
          backup codes stay, and `backupCodes` is `null`: the web application skips the step
          "Codes de secours". `change: authenticator-app-replaced`.
        - A wrong code answers `422 auth.two-step-code-invalid`, without a count of attempts: the
          setup stays pending. A setup that expired, was replaced, or belongs to another session,
          or no setup: `422 auth.two-step-setup-expired`, and the person starts again.

        Recent authentication is not required again: the start required it. The right code counts
        as a recent two-step authentication of this session, and turning two-step verification on
        ends the windows that the other sessions of the account opened with a password. Emits
        `user.two-step-verification-changed.v1`, from which notification-service sends a security
        email ("La vérification en deux étapes est activée") and organization-service updates its
        directory. Session only: a personal API token gets `403 auth.api-token-not-accepted`.
      tags: [two-step-verification]
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthenticatorAppConfirmation'
            example:
              code: '261845'
      responses:
        '200':
          description: The app is the authenticator app of the account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticatorAppConfigured'
              example:
                twoStepVerification:
                  enabled: true
                  primaryMethod: authenticator-app
                  methods: [authenticator-app]
                  authenticatorApp:
                    configuredAt: '2026-11-09T13:21:00Z'
                  securityKeys: []
                  backupCodes:
                    remaining: 10
                    total: 10
                    generatedAt: '2026-11-09T13:21:00Z'
                  requiredBy:
                    - organizationId: 019a5f3c-8d2e-7c4a-9b1f-3e5d7a9c1b2f
                      requiredFor: admins
                backupCodes:
                  codes:
                    - 4F7K-2M9Q
                    - H3XP-8D2L
                    - Q9TZ-5W1C
                    - B6NR-7J4E
                    - K2VD-9S8A
                    - M8LC-3F6P
                    - T5QW-1H7Z
                    - R4GY-6B3N
                    - C7EJ-2K5U
                    - W1PS-8V9D
                  generatedAt: '2026-11-09T13:21:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/SessionWriteForbidden'
        '422':
          $ref: '#/components/responses/SetupCodeRefused'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/me/two-step-verification/backup-codes/regenerate:
    post:
      operationId: regenerateBackupCodes
      summary: Generate new backup codes
      description: |
        Replaces the backup codes of the account with 10 new ones, returned here once ("Nouveaux
        codes de secours"); the previous ones stop working at once ("Les 7 codes précédents ne
        fonctionnent plus."). The web application offers to copy them and to download
        `cadenway-codes-de-secours.txt`. Two-step verification must be on
        (`409 auth.two-step-not-enabled`), and recent authentication of this session is required
        (`403 auth.reauthentication-required`). Emits `user.two-step-verification-changed.v1`
        (`change: backup-codes-regenerated`), from which notification-service sends a security
        email, without the codes. The body is an empty JSON object. Session only: a personal API
        token gets `403 auth.api-token-not-accepted`.
      tags: [two-step-verification]
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmptyRequest'
            example: {}
      responses:
        '200':
          description: The new backup codes, returned once.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackupCodes'
              example:
                codes:
                  - 4F7K-2M9Q
                  - H3XP-8D2L
                  - Q9TZ-5W1C
                  - B6NR-7J4E
                  - K2VD-9S8A
                  - M8LC-3F6P
                  - T5QW-1H7Z
                  - R4GY-6B3N
                  - C7EJ-2K5U
                  - W1PS-8V9D
                generatedAt: '2026-11-08T16:05:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/RecentAuthenticationForbidden'
        '409':
          $ref: '#/components/responses/TwoStepNotEnabled'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/me/two-step-verification/security-keys/registration:
    post:
      operationId: startSecurityKeyRegistration
      summary: Get the WebAuthn options to register a security key
      description: |
        Starts the registration of a security key or of the biometrics of the device ("Ajouter une
        clé"): returns the options the web application passes to `navigator.credentials.create`
        (through `PublicKeyCredential.parseCreationOptionsFromJSON` or an equivalent), with a new
        WebAuthn challenge and the keys the account already has, so that the browser refuses to
        register one twice. The pending registration belongs to this session and expires 5 minutes
        later; a new start replaces it. The web application then sends the answer of the browser
        and the name of the key to `POST /v1/me/two-step-verification/security-keys`.

        The checks run in this order: two-step verification must be on, and the account has fewer
        than 10 keys (`409 auth.two-step-not-enabled`, `409 auth.security-key-limit-reached`); then
        recent authentication of this session (`403 auth.reauthentication-required`). The body is
        an empty JSON object. Session only: a personal API token gets
        `403 auth.api-token-not-accepted`.
      tags: [two-step-verification]
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmptyRequest'
            example: {}
      responses:
        '200':
          description: The options to pass to the browser.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecurityKeyRegistration'
              example:
                options:
                  challenge: ExampleOnlyWebAuthnChallenge000000000000000
                  rp:
                    id: cadenway.com
                    name: Cadenway
                  user:
                    id: ExampleOnlyWebAuthnUserHandle00000000000000
                    name: camille.martin@ateliernord.fr
                    displayName: Camille Martin
                  pubKeyCredParams:
                    - type: public-key
                      alg: -8
                    - type: public-key
                      alg: -7
                    - type: public-key
                      alg: -257
                  timeout: 300000
                  attestation: none
                  authenticatorSelection:
                    residentKey: preferred
                    userVerification: preferred
                  excludeCredentials: []
                expiresAt: '2026-11-09T13:26:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/RecentAuthenticationForbidden'
        '409':
          $ref: '#/components/responses/SecurityKeyNotAddable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/me/two-step-verification/security-keys:
    post:
      operationId: addSecurityKey
      summary: Register a security key
      description: |
        Checks the answer of the browser to the options of
        `POST /v1/me/two-step-verification/security-keys/registration` and adds the key to the
        account under `name` ("Clé de sécurité ajoutée", "Elle pourra servir dès la prochaine
        connexion."). The web application sends `credential` as the browser gave it, serialized as
        JSON (`PublicKeyCredential.toJSON()` or an equivalent). The key then answers the two-step
        challenges of the sign-ins.

        - An answer that does not verify, or a key already registered, to this account or another
          one: `422 auth.security-key-refused`.
        - A registration that expired, was replaced, belongs to another session, or no
          registration: `422 auth.two-step-setup-expired`.
        - Two-step verification turned off since the start, or 10 keys already:
          `409 auth.two-step-not-enabled`, `409 auth.security-key-limit-reached`.

        Recent authentication is not required again: the start required it. Emits
        `user.two-step-verification-changed.v1` (`change: security-key-added`), from which
        notification-service sends a security email. Session only: a personal API token gets
        `403 auth.api-token-not-accepted`.
      tags: [two-step-verification]
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SecurityKeyAddition'
            example:
              name: YubiKey 5C NFC
              credential:
                id: ExampleOnlyCredentialIdYubiKey5CNfc0000000
                rawId: ExampleOnlyCredentialIdYubiKey5CNfc0000000
                type: public-key
                response:
                  clientDataJSON: ExampleOnlyClientDataJson
                  attestationObject: ExampleOnlyAttestationObject
                  transports: [usb, nfc]
                authenticatorAttachment: cross-platform
                clientExtensionResults: {}
      responses:
        '201':
          description: The key is registered.
          headers:
            Location:
              $ref: '#/components/headers/SecurityKeyLocation'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecurityKey'
              example:
                id: 019a6c52-1d2e-7f3a-8b4c-5d6e7f8a9b01
                name: YubiKey 5C NFC
                createdAt: '2026-11-09T13:22:00Z'
                lastUsedAt: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/SessionWriteForbidden'
        '409':
          $ref: '#/components/responses/SecurityKeyNotAddable'
        '422':
          $ref: '#/components/responses/SecurityKeyRegistrationRefused'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/me/two-step-verification/security-keys/{securityKeyId}:
    delete:
      operationId: removeSecurityKey
      summary: Remove a security key
      description: |
        Removes a security key of the account: it no longer answers the challenges. The
        authenticator app and the other keys stay. A key of another account, an unknown id, or a
        key already removed answers `404 security-key.not-found`. Recent authentication of this
        session is required (`403 auth.reauthentication-required`), checked once the key is found.
        Emits `user.two-step-verification-changed.v1` (`change: security-key-removed`), from which
        notification-service sends a security email. Session only: a personal API token gets
        `403 auth.api-token-not-accepted`.
      tags: [two-step-verification]
      security:
        - sessionCookie: []
      parameters:
        - name: securityKeyId
          in: path
          required: true
          description: Id of the key, as `GET /v1/me/two-step-verification` gave it.
          schema:
            type: string
            format: uuid
            examples: [019a6c52-1d2e-7f3a-8b4c-5d6e7f8a9b01]
      responses:
        '204':
          description: The key is removed.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/RecentAuthenticationForbidden'
        '404':
          $ref: '#/components/responses/SecurityKeyNotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/sessions:
    get:
      operationId: listSessions
      summary: List the open sessions
      description: |
        Lists the open sessions of the account ("Sessions actives"): neither signed out, revoked,
        expired nor closed for inactivity. The session of the request is among them, marked
        `current` ("Cet appareil"). A session closes after the inactivity the policy of its current
        organization sets, 12 hours by default, which `inactivityTimeoutMinutes` gives ("Une
        session inactive pendant 12 heures est fermée automatiquement.").

        Sorted by sign-in, the most recent first, then by id: a session keeps its place whatever
        its activity, so the pages hold still. The web application shows the current session
        first, then the others by `lastActiveAt`. No place is given, only the address the session
        was opened from. Session only: a personal API token gets
        `403 auth.api-token-not-accepted`.
      tags: [sessions]
      security:
        - sessionCookie: []
      parameters:
        - $ref: '../../components/http.yaml#/components/parameters/Cursor'
        - $ref: '../../components/http.yaml#/components/parameters/Limit'
      responses:
        '200':
          description: One page of the open sessions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenSessionPage'
              example:
                items:
                  - id: 019a6a2e-4b1c-7d3e-8f5a-2c9b7e1d4a60
                    current: true
                    device:
                      type: desktop
                      browser: Firefox
                      browserVersion: '132'
                      os: Windows
                      osVersion: null
                    ipAddress: 192.0.2.14
                    signedInAt: '2026-11-09T07:58:00Z'
                    lastActiveAt: '2026-11-09T13:24:00Z'
                    expiresAt: '2026-12-09T07:58:00Z'
                    inactivityTimeoutMinutes: 720
                  - id: 019a6914-2f7a-7b3c-9d4e-5f6a7b8c9d01
                    current: false
                    device:
                      type: mobile
                      browser: Safari
                      browserVersion: '18'
                      os: iOS
                      osVersion: '18.1'
                    ipAddress: 86.247.12.30
                    signedInAt: '2026-11-09T07:42:00Z'
                    lastActiveAt: '2026-11-09T11:20:00Z'
                    expiresAt: '2026-12-09T07:42:00Z'
                    inactivityTimeoutMinutes: 720
                  - id: 019a5f88-1c2d-7e3f-8a4b-6c7d8e9f0a12
                    current: false
                    device:
                      type: desktop
                      browser: Chrome
                      browserVersion: '131'
                      os: macOS
                      osVersion: null
                    ipAddress: 192.0.2.14
                    signedInAt: '2026-11-06T08:15:00Z'
                    lastActiveAt: '2026-11-08T17:40:00Z'
                    expiresAt: '2026-12-06T08:15:00Z'
                    inactivityTimeoutMinutes: 720
                nextCursor: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ApiTokenNotAccepted'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/sessions/{sessionId}:
    delete:
      operationId: revokeSession
      summary: Revoke a session
      description: |
        Closes a session of the account ("Révoquer"; "Cet appareil devra se reconnecter pour
        accéder à Cadenway."): its next request answers `401 auth.session-expired`.

        - Revoking a session that already ended answers `204`.
        - A session of another account, or an unknown id, answers `404 session.not-found`.
        - The current session can be revoked here too, but its cookie stays until the next request
          finds it ended: the web application signs out with `POST /v1/auth/sign-out` instead.

        Recent authentication is not required. Emits `session.revoked.v1`. Session only: a
        personal API token gets `403 auth.api-token-not-accepted`.
      tags: [sessions]
      security:
        - sessionCookie: []
      parameters:
        - name: sessionId
          in: path
          required: true
          description: Id of the session, as `GET /v1/sessions` gave it.
          schema:
            type: string
            format: uuid
            examples: [019a6914-2f7a-7b3c-9d4e-5f6a7b8c9d01]
      responses:
        '204':
          description: The session is closed.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/SessionWriteForbidden'
        '404':
          $ref: '#/components/responses/SessionNotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/sessions/revoke-others:
    post:
      operationId: revokeOtherSessions
      summary: Close every other session
      description: |
        Closes every open session of the account except the one of the request ("Déconnecter les
        autres"; "Tous vos appareils sauf celui-ci seront déconnectés."). `revokedCount` gives the
        confirmation ("2 sessions fermées", "Seul cet appareil reste connecté."). Every trusted
        device of the account is forgotten too, this browser's included: the next sign-in of an
        account with two-step verification answers its challenge on every device. The personal API
        tokens stay. Recent authentication is not required. Emits `session.revoked.v1` for each
        closed session. The body is an empty JSON object. Session only: a personal API token gets
        `403 auth.api-token-not-accepted`.
      tags: [sessions]
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmptyRequest'
            example: {}
      responses:
        '200':
          description: The other sessions are closed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevokedSessions'
              example:
                revokedCount: 2
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/SessionWriteForbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-cw_session
      description: |
        Opaque session token, set by the gateway on sign-in with `Path=/; Secure; HttpOnly;
        SameSite=Lax` and checked with identity-service on every request. The web application sends
        it with `withCredentials` and never reads it.
  headers:
    FederatedNoStore:
      description: The response is private and cannot be stored.
      schema:
        type: string
        const: private, no-store
    FederatedBindingCookie:
      description: |
        Sets a short-lived opaque browser binding in `__Host-cw_federated_flow`
        (`Path=/; Secure; HttpOnly; SameSite=None` for the cross-site SAML form POST, and
        `SameSite=Lax` for OAuth). It expires with the server-side flow, within 10 minutes.
        It cannot authenticate any other route. Also expires any previous continuation cookie.
      schema:
        type: string
    FederatedContinuationCookies:
      description: |
        Sets `__Host-cw_federated_receipt` (`Path=/; Secure; HttpOnly; SameSite=Lax`,
        expires in at most two minutes) and expires the original flow cookie. The receipt
        only authorizes the finish POST from an allowed Origin.
      schema:
        type: string
    ClearFederatedReceiptCookie:
      description: Expires the federated receipt cookie with the same attributes and `Max-Age=0`.
      schema:
        type: string
    SetSessionCookie:
      description: |
        `__Host-cw_session=<token>; Path=/; Secure; HttpOnly; SameSite=Lax`, plus
        `Max-Age=<seconds until session.expiresAt>` when `rememberMe` was `true`. Without it the
        cookie ends with the browser, and the session ends at `session.expiresAt` at the latest.
        Either session also ends after the inactivity the policy of its current organization sets,
        12 hours by default.
      schema:
        type: string
    SetSessionAndTrustedDeviceCookies:
      description: |
        One `Set-Cookie` for the session, as `SetSessionCookie` says, and, when the answer had
        `trustDevice: true`, a second one for the trusted device:
        `__Host-cw_trusted_device=<token>; Path=/; Secure; HttpOnly; SameSite=Strict; Max-Age=2592000`
        (30 days). The device token is opaque, bound to the account, kept hashed by
        identity-service, and never readable by the web application.
      schema:
        type: string
    SecurityKeyLocation:
      description: '`/v1/me/two-step-verification/security-keys/<securityKeyId>`, where the key is removed.'
      schema:
        type: string
    ClearSessionCookie:
      description: '`__Host-cw_session=; Path=/; Secure; HttpOnly; SameSite=Lax; Max-Age=0`.'
      schema:
        type: string
    RetryAfter:
      description: Seconds to wait before the request can succeed (RFC 9110).
      schema:
        type: integer
        minimum: 1
    ETag:
      description: Version of the account, `"<version>"`.
      schema:
        type: string
  responses:
    FederatedSignInContinuation:
      description: Provider response verified. Navigate to the configured web application to finish sign-in.
      headers:
        Location:
          description: The fixed allowlisted web application continuation URL, with no query or fragment.
          schema:
            type: string
            format: uri
            examples: [https://app.example.test/auth/federated/continue]
        Set-Cookie:
          $ref: '#/components/headers/FederatedContinuationCookies'
        Cache-Control:
          $ref: '#/components/headers/FederatedNoStore'
        Referrer-Policy:
          description: Prevents forwarding the provider callback URL as a referrer.
          schema:
            type: string
            const: no-referrer
    FederatedSignedIn:
      description: A session is open. Its token is available only as the usual session cookie.
      headers:
        Set-Cookie:
          description: Sets the session cookie as on password sign-in and expires the one-use receipt cookie.
          schema:
            type: string
        Cache-Control:
          $ref: '#/components/headers/FederatedNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SignedIn'
    FederatedChallengeIssued:
      description: Two-step verification is required. No session is issued and the receipt cookie expires.
      headers:
        Set-Cookie:
          $ref: '#/components/headers/ClearFederatedReceiptCookie'
        Cache-Control:
          $ref: '#/components/headers/FederatedNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SignInChallenge'
          examples:
            camilleMartin:
              $ref: '#/components/examples/SignInChallenge'
    FederatedSignInRefused:
      description: |
        `auth.federated-sign-in-refused`: the sign-in cannot proceed. The response does not
        disclose account existence, the provider's reason, organization configuration, or
        the validity of a submitted credential.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          example:
            type: about:blank
            title: La connexion via ce fournisseur a échoué.
            status: 422
            code: auth.federated-sign-in-refused
    SignedIn:
      description: Signed in. The body describes the session; the token itself is only in the cookie.
      headers:
        Set-Cookie:
          $ref: '#/components/headers/SetSessionCookie'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SignedIn'
          example:
            user:
              id: 019a5f3c-8d2e-7c4a-9b1f-3e5d7a9c1b30
              name: Camille Martin
              email: camille.martin@ateliernord.fr
              language: fr
              displayName: null
              jobTitle: null
              timeZone: Europe/Paris
              version: 2
            session:
              id: 019a6a2e-4b1c-7d3e-8f5a-2c9b7e1d4a60
              expiresAt: '2026-12-08T13:07:00Z'
    ChallengeIssued:
      description: |
        The address and its password, or its email code, are right, and the account has two-step
        verification: no session is opened and no cookie is set. The body is the challenge to
        answer ("Vérification en deux étapes"); its `token` is a secret the web application keeps
        for the life of the challenge, sends in bodies only, and never puts in a URL.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SignInChallenge'
          examples:
            camilleMartin:
              $ref: '#/components/examples/SignInChallenge'
    ChallengeAnswered:
      description: |
        Signed in by the answer of the challenge, as a `200` sign-in. The body describes the
        session; the session token is only in its cookie, and the device token, with
        `trustDevice`, only in the second cookie.
      headers:
        Set-Cookie:
          $ref: '#/components/headers/SetSessionAndTrustedDeviceCookies'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SignedIn'
          example:
            user:
              id: 019a5f3c-8d2e-7c4a-9b1f-3e5d7a9c1b30
              name: Camille Martin
              email: camille.martin@ateliernord.fr
              language: fr
              displayName: camille
              jobTitle: Responsable produit
              timeZone: Europe/Paris
              passwordChangedAt: '2026-08-12T09:30:00Z'
              version: 9
            session:
              id: 019a6914-2f7a-7b3c-9d4e-5f6a7b8c9d01
              expiresAt: '2026-12-09T07:42:00Z'
    BadRequest:
      description: |
        The body does not match the schema: `request.invalid`, with one `details.issues` entry per
        failed member (`path` is the dotted path of the member, empty for the body itself).
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          example:
            type: about:blank
            title: Bad Request
            status: 400
            code: request.invalid
            details:
              issues:
                - in: body
                  path: email
                  code: invalid_format
                  message: Invalid email address
    EmailTaken:
      description: |
        `auth.email-taken`: a verified account already uses the address, the one of the sign-up or
        the new address of a change.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          example:
            type: about:blank
            title: Un compte existe déjà avec cette adresse.
            status: 409
            code: auth.email-taken
    SignUpRefused:
      description: |
        The sign-up is refused, and nothing is created:

        - `auth.terms-not-accepted`: `acceptTerms` is `false`;
        - `auth.password-too-short`: fewer than 12 characters;
        - `auth.password-compromised`: the password is in the list of compromised passwords.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          examples:
            termsNotAccepted:
              summary: Terms not accepted
              value:
                type: about:blank
                title: Acceptez les conditions pour créer votre compte.
                status: 422
                code: auth.terms-not-accepted
            passwordTooShort:
              summary: Password too short
              value:
                type: about:blank
                title: Le mot de passe doit compter 12 caractères minimum.
                status: 422
                code: auth.password-too-short
                details:
                  minLength: 12
            passwordCompromised:
              summary: Compromised password
              value:
                type: about:blank
                title: 'Ce mot de passe figure parmi des mots de passe divulgués : choisissez-en un autre.'
                status: 422
                code: auth.password-compromised
    CodeRefused:
      description: |
        The code is refused; the web application shows the same line for both codes:

        - `auth.code-invalid`: the code is wrong, or no account awaits a code at this address;
        - `auth.code-expired`: the code expired, was used, was replaced by a newer one, or took too
          many wrong attempts. A new code is needed.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          examples:
            codeInvalid:
              $ref: '#/components/examples/CodeInvalid'
            codeExpired:
              $ref: '#/components/examples/CodeExpired'
    SignUpVerificationRefused:
      description: |
        The verification of the sign-up is refused. The code is checked first:

        - `auth.code-invalid`: the code is wrong, or no account awaits a code at this address;
        - `auth.code-expired`: the code expired, was used, was replaced by a newer one, or took too
          many wrong attempts. A new code is needed. The web application shows the same line for
          both codes;
        - `auth.sign-up-replaced`, only with the right code: `password` differs from the password
          of the latest sign-up of the address, or is missing while the address was signed up
          more than once. The code stops working; the person signs up again.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          examples:
            codeInvalid:
              $ref: '#/components/examples/CodeInvalid'
            codeExpired:
              $ref: '#/components/examples/CodeExpired'
            signUpReplaced:
              summary: Another sign-up of the address
              value:
                type: about:blank
                title: 'Une autre inscription a été faite avec cette adresse : recommencez votre inscription.'
                status: 422
                code: auth.sign-up-replaced
    CredentialsRefused:
      description: |
        `auth.invalid-credentials`: the address or the password is wrong. `details.remainingAttempts`
        is the number of failures left before the lockout, at least 1. Answered the same way when no
        account uses the address.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          example:
            type: about:blank
            title: E-mail ou mot de passe incorrect.
            status: 422
            code: auth.invalid-credentials
            details:
              remainingAttempts: 3
    EmailNotVerified:
      description: |
        - `auth.email-not-verified`: the password is right but the address of the account is not
          verified yet. No code is sent: `POST /v1/auth/sign-up/code` sends one.
        - `auth.csrf-rejected`: see `CrossSiteRefused`.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          examples:
            emailNotVerified:
              summary: Address not verified
              value:
                type: about:blank
                title: Confirmez votre adresse e-mail pour vous connecter.
                status: 403
                code: auth.email-not-verified
            crossSiteRefused:
              summary: Request from another site
              value:
                type: about:blank
                title: Forbidden
                status: 403
                code: auth.csrf-rejected
    AccountLocked:
      description: |
        - `auth.account-locked`: too many failed passwords for the address; the password sign-in
          is refused until `details.lockedUntil` (15 minutes), even with the right password.
          Answered the same way when no account uses the address. The failed passwords of
          `POST /v1/auth/reauthentication` and `PUT /v1/me/password` count with those of the
          sign-in, and both routes answer this code during the lockout.
        - `auth.two-step-locked`, on `POST /v1/auth/reauthentication` with a `code` only: see
          `TwoStepLocked`.
        - `rate-limit.exceeded`: the gateway's own limit.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          examples:
            accountLocked:
              summary: Account locked
              value:
                type: about:blank
                title: Trop de tentatives échouées.
                status: 429
                code: auth.account-locked
                details:
                  lockedUntil: '2026-11-08T13:22:00Z'
            twoStepLocked:
              $ref: '#/components/examples/TwoStepLocked'
            rateLimited:
              $ref: '#/components/examples/RateLimited'
    CodeThrottled:
      description: |
        - `auth.code-throttled`: the code requests of this address are throttled whatever their
          purpose, account or not: a sign-up, `POST /v1/auth/sign-up/code`,
          `POST /v1/auth/sign-in/code` and `POST /v1/me/email-change`, which sends its code to the
          new address, count together. A request is refused less than 30 seconds
          after the last accepted one, and once 5 were accepted in the current hour, which starts
          with the first request accepted after the previous hour ended.
          `details.resendAvailableAt` says when the next one can be: 30 seconds after the last
          accepted request, or the end of the hour.
        - `rate-limit.exceeded`: the gateway's own limit.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          examples:
            codeThrottled:
              summary: Code asked for less than 30 seconds ago
              value:
                type: about:blank
                title: 'Un code vient d’être envoyé : patientez avant d’en demander un nouveau.'
                status: 429
                code: auth.code-throttled
                details:
                  resendAvailableAt: '2026-11-08T13:07:30Z'
            hourlyCapReached:
              summary: Five codes asked for in the hour
              value:
                type: about:blank
                title: 'Un code vient d’être envoyé : patientez avant d’en demander un nouveau.'
                status: 429
                code: auth.code-throttled
                details:
                  resendAvailableAt: '2026-11-08T14:07:00Z'
            rateLimited:
              $ref: '#/components/examples/RateLimited'
    RateLimited:
      description: '`rate-limit.exceeded`: the gateway refuses more requests from this client for now.'
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          examples:
            rateLimited:
              $ref: '#/components/examples/RateLimited'
    Unauthenticated:
      description: |
        - `auth.session-required`: the request carries no session cookie;
        - `auth.session-expired`: the cookie names a session that ended (expired, revoked or
          unknown). The web application signs the person in again;
        - `auth.api-token-invalid`: the request carries a bearer token that is unknown, revoked or
          expired, or whose user no longer belongs to its organization.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          examples:
            sessionRequired:
              summary: No session cookie
              value:
                type: about:blank
                title: Connectez-vous pour continuer.
                status: 401
                code: auth.session-required
            sessionExpired:
              summary: Session ended
              value:
                type: about:blank
                title: Session expirée
                status: 401
                code: auth.session-expired
            apiTokenInvalid:
              summary: Personal API token no longer valid
              value:
                type: about:blank
                title: Jeton d’API invalide, expiré ou révoqué.
                status: 401
                code: auth.api-token-invalid
    ApiTokenNotAccepted:
      description: '`auth.api-token-not-accepted`: a personal API token cannot call this route.'
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          examples:
            apiTokenNotAccepted:
              $ref: '#/components/examples/ApiTokenNotAccepted'
    ProfileForbidden:
      description: |
        - `auth.csrf-rejected`: see `CrossSiteRefused`;
        - `auth.api-token-not-accepted`: a personal API token cannot change a profile.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          examples:
            crossSiteRefused:
              summary: Request from another site
              value:
                type: about:blank
                title: Forbidden
                status: 403
                code: auth.csrf-rejected
            apiTokenNotAccepted:
              $ref: '#/components/examples/ApiTokenNotAccepted'
    VersionMismatch:
      description: '`request.version-mismatch`: `If-Match` is not the current version; `details.version` is.'
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          example:
            type: about:blank
            title: 'Ces informations ont été modifiées entre-temps : rechargez la page.'
            status: 412
            code: request.version-mismatch
            details:
              version: 3
    CrossSiteRefused:
      description: |
        `auth.csrf-rejected`: the `Origin` of the request is not an allowed origin, or its
        `Content-Type` is not `application/json`. Checked before the route runs, signed in or not.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          example:
            type: about:blank
            title: Forbidden
            status: 403
            code: auth.csrf-rejected
    Unavailable:
      description: |
        identity-service cannot answer: `upstream.unavailable`, `upstream.unreachable`,
        `upstream.timeout`, `upstream.circuit-open`, `upstream.failed`, `upstream.unauthorized` or
        `upstream.deadline-exceeded`, with `details.service`.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          example:
            type: about:blank
            title: Service Unavailable
            status: 503
            code: upstream.unavailable
            details:
              service: identity-service
    ResetThrottled:
      description: |
        - `auth.reset-throttled`: the password reset requests of this address are throttled,
          account or not, apart from the code requests. A request is refused less than 45 seconds
          after the last accepted one, and once 5 were accepted in the current hour, which starts
          with the first request accepted after the previous hour ended.
          `details.resendAvailableAt` says when the next one can be: 45 seconds after the last
          accepted request, or the end of the hour.
        - `rate-limit.exceeded`: the gateway's own limit.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          examples:
            resetThrottled:
              summary: Link asked for less than 45 seconds ago
              value:
                type: about:blank
                title: 'Un lien vient d’être envoyé : patientez avant d’en demander un nouveau.'
                status: 429
                code: auth.reset-throttled
                details:
                  resendAvailableAt: '2026-11-09T13:10:45Z'
            rateLimited:
              $ref: '#/components/examples/RateLimited'
    ResetLinkExpired:
      description: |
        `auth.reset-link-expired`: the link expired (30 minutes), was used, was replaced by a newer
        one, or is unknown. The web application shows one state for all of them and offers to ask
        for a new link.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          examples:
            resetLinkExpired:
              $ref: '#/components/examples/ResetLinkExpired'
    PasswordResetRefused:
      description: |
        The new password is not set:

        - `auth.reset-link-expired`: see `ResetLinkExpired`;
        - `auth.password-too-short`: fewer than 12 characters, with `details.minLength`;
        - `auth.password-compromised`: the password is in the list of compromised passwords.

        A refused password leaves the link usable.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          examples:
            resetLinkExpired:
              $ref: '#/components/examples/ResetLinkExpired'
            passwordTooShort:
              $ref: '#/components/examples/PasswordTooShort'
            passwordCompromised:
              $ref: '#/components/examples/PasswordCompromised'
    PasswordRefused:
      description: |
        - `auth.password-incorrect`: the password is not the one of the account.
          `details.remainingAttempts` is the number of failures left before the lockout of the
          password sign-in of the address, at least 1.
        - `auth.two-step-code-invalid`, on `POST /v1/auth/reauthentication` with a `code`: the code
          is not the current one of the authenticator app, or was used already.
          `details.remainingAttempts` is the number of wrong answers left before the lockout of
          the two-step answers of the account, at least 1.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          examples:
            passwordIncorrect:
              $ref: '#/components/examples/PasswordIncorrect'
            twoStepCodeInvalid:
              $ref: '#/components/examples/TwoStepCodeInvalid'
    PasswordChangeRefused:
      description: |
        The password is not changed. The new password is checked first:

        - `auth.password-too-short`: fewer than 12 characters, with `details.minLength`;
        - `auth.password-compromised`: the password is in the list of compromised passwords;
        - `auth.password-incorrect`: the current password is wrong, with
          `details.remainingAttempts` (see `PasswordRefused`).
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          examples:
            passwordTooShort:
              $ref: '#/components/examples/PasswordTooShort'
            passwordCompromised:
              $ref: '#/components/examples/PasswordCompromised'
            passwordIncorrect:
              $ref: '#/components/examples/PasswordIncorrect'
    SessionWriteForbidden:
      description: |
        - `auth.csrf-rejected`: see `CrossSiteRefused`;
        - `auth.api-token-not-accepted`: a personal API token cannot call this route.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          examples:
            crossSiteRefused:
              $ref: '#/components/examples/CrossSiteRefused'
            apiTokenNotAccepted:
              $ref: '#/components/examples/ApiTokenNotAccepted'
    RecentAuthenticationForbidden:
      description: |
        - `auth.reauthentication-required`: the person of this session has not proved who they are
          in the last 10 minutes (see "Recent authentication"), or, on
          `POST /v1/auth/reauthentication`, sent a password for an account with two-step
          verification. `details.methods` lists the ways they can, for
          `POST /v1/auth/reauthentication`: `[password]` for an account without two-step
          verification, `[authenticator-app]` (its `code`) for an account with it, never the
          password then; later versions add methods, and a client ignores a method it does not
          know. The web application asks, confirms, then repeats the request;
        - `auth.csrf-rejected`: see `CrossSiteRefused`;
        - `auth.api-token-not-accepted`: a personal API token cannot call this route.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          examples:
            reauthenticationRequired:
              summary: No recent authentication
              value:
                type: about:blank
                title: Confirmez votre identité pour continuer.
                status: 403
                code: auth.reauthentication-required
                details:
                  methods: [password]
            reauthenticationRequiredWithApp:
              summary: No recent two-step proof, account with two-step verification
              value:
                type: about:blank
                title: Confirmez votre identité pour continuer.
                status: 403
                code: auth.reauthentication-required
                details:
                  methods: [authenticator-app]
            crossSiteRefused:
              $ref: '#/components/examples/CrossSiteRefused'
            apiTokenNotAccepted:
              $ref: '#/components/examples/ApiTokenNotAccepted'
    EmailUnchanged:
      description: '`auth.email-unchanged`: the new address is the current address of the account.'
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          example:
            type: about:blank
            title: 'C’est déjà votre adresse actuelle : saisissez la nouvelle.'
            status: 422
            code: auth.email-unchanged
    EmailChangeCodeRefused:
      description: |
        The code of the change of address is refused; the web application shows the same line for
        both codes:

        - `auth.code-invalid`: the code is wrong, or no change of address awaits a code;
        - `auth.code-expired`: the code expired (15 minutes), was used, was replaced by a newer
          request, or took too many wrong attempts. A new request is needed.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          examples:
            codeInvalid:
              $ref: '#/components/examples/CodeInvalid'
            codeExpired:
              $ref: '#/components/examples/CodeExpired'
    OrganizationOwner:
      description: |
        `account.organization-owner`: the person owns at least one organization, which must first
        have another owner. `details.organizationIds` lists them, as identity-service's copy of
        the memberships knows them; the web application names them from `GET /v1/organizations`
        ("Atelier Nord doit d’abord avoir un autre propriétaire.").
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          example:
            type: about:blank
            title: Chaque organisation dont vous êtes propriétaire doit d’abord avoir un autre propriétaire.
            status: 409
            code: account.organization-owner
            details:
              organizationIds: [019a5f3c-8d2e-7c4a-9b1f-3e5d7a9c1b2f]
    SessionNotFound:
      description: '`session.not-found`: no session with this id belongs to the account.'
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          example:
            type: about:blank
            title: Session introuvable.
            status: 404
            code: session.not-found
    ChallengeExpired:
      description: |
        `auth.challenge-expired`: the two-step challenge expired (10 minutes after the sign-in),
        was answered, was replaced by a newer challenge of the account, or is unknown or
        malformed. The person signs in again.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          examples:
            challengeExpired:
              $ref: '#/components/examples/ChallengeExpired'
    TwoStepCodeRefused:
      description: |
        The answer is refused. The challenge is checked first:

        - `auth.challenge-expired`: see `ChallengeExpired`; no attempt is counted;
        - `auth.two-step-code-invalid`: the code is wrong, or was used already (a code of the app
          works once, a backup code works once). `details.remainingAttempts` is the number of
          wrong answers left before the lockout of the two-step answers of the account, at least 1.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          examples:
            challengeExpired:
              $ref: '#/components/examples/ChallengeExpired'
            twoStepCodeInvalid:
              $ref: '#/components/examples/TwoStepCodeInvalid'
    SecurityKeyAnswerRefused:
      description: |
        The key cannot answer. The challenge is checked first:

        - `auth.challenge-expired`: see `ChallengeExpired`; no attempt is counted;
        - `auth.security-key-refused`: the account has no security key (options), or the answer of
          the key does not verify against the latest options of the challenge (answer), with
          `details.remainingAttempts` as for a wrong code.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          examples:
            challengeExpired:
              $ref: '#/components/examples/ChallengeExpired'
            securityKeyRefused:
              summary: Key not recognised
              value:
                type: about:blank
                title: 'Clé de sécurité non reconnue : réessayez ou choisissez une autre méthode.'
                status: 422
                code: auth.security-key-refused
                details:
                  remainingAttempts: 4
    TwoStepLocked:
      description: |
        - `auth.two-step-locked`: five wrong answers in a row, across the two-step challenges of
          the account and the codes of `POST /v1/auth/reauthentication`, lock the two-step answers
          of the account until `details.lockedUntil`, 15 minutes after the fifth. Every answer is
          refused until then, even a right one; a sign-in still answers its challenge, with
          `lockedUntil`. The end of the lockout, or a right answer after it, starts the count again.
        - `rate-limit.exceeded`: the gateway's own limit.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          examples:
            twoStepLocked:
              $ref: '#/components/examples/TwoStepLocked'
            rateLimited:
              $ref: '#/components/examples/RateLimited'
    MfaRequiredByOrganization:
      description: |
        `auth.mfa-required-by-organization`: the policy of at least one organization of the person
        requires two-step verification for the role they have in it (see
        `openapi/public/organizations.yaml`), so it cannot be turned off. `details.organizationIds`
        lists those organizations; the web application names them from `GET /v1/organizations`
        ("Exigée par Atelier Nord pour les propriétaires et administrateurs.").
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          example:
            type: about:blank
            title: 'Une de vos organisations exige la vérification en deux étapes : elle ne peut pas être désactivée.'
            status: 409
            code: auth.mfa-required-by-organization
            details:
              organizationIds: [019a5f3c-8d2e-7c4a-9b1f-3e5d7a9c1b2f]
    SetupCodeRefused:
      description: |
        The authenticator app is not confirmed:

        - `auth.two-step-setup-expired`: no pending setup of this session, or it expired (15
          minutes) or was replaced by a newer start; the person starts again;
        - `auth.two-step-code-invalid`: the code is not one the new app shows now; the setup stays
          pending, and no attempt is counted (no `details.remainingAttempts`).
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          examples:
            setupExpired:
              $ref: '#/components/examples/TwoStepSetupExpired'
            twoStepCodeInvalid:
              summary: Wrong code of the new app
              value:
                type: about:blank
                title: Code incorrect ou déjà utilisé.
                status: 422
                code: auth.two-step-code-invalid
    TwoStepNotEnabled:
      description: |
        `auth.two-step-not-enabled`: the request needs two-step verification on the account of the
        caller, which is off: regenerating backup codes, adding a security key, confirming with a
        `code` in `POST /v1/auth/reauthentication`, or, in `openapi/public/organizations.yaml`,
        requiring two-step verification for a role the caller has.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          examples:
            twoStepNotEnabled:
              $ref: '#/components/examples/TwoStepNotEnabled'
    SecurityKeyNotAddable:
      description: |
        - `auth.two-step-not-enabled`: see `TwoStepNotEnabled`; a security key comes in addition to
          the authenticator app;
        - `auth.security-key-limit-reached`: the account has 10 security keys, the most it can
          have (`details.maxSecurityKeys`); the person removes one first.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          examples:
            twoStepNotEnabled:
              $ref: '#/components/examples/TwoStepNotEnabled'
            securityKeyLimitReached:
              summary: Ten keys already
              value:
                type: about:blank
                title: 'Nombre maximal de clés de sécurité atteint : retirez-en une pour en ajouter une autre.'
                status: 409
                code: auth.security-key-limit-reached
                details:
                  maxSecurityKeys: 10
    SecurityKeyRegistrationRefused:
      description: |
        The key is not registered:

        - `auth.two-step-setup-expired`: no pending registration of this session, or it expired (5
          minutes) or was replaced by a newer start;
        - `auth.security-key-refused`: the answer of the browser does not verify against the
          pending registration, or the key is already registered, to this account or another one.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          examples:
            setupExpired:
              $ref: '#/components/examples/TwoStepSetupExpired'
            securityKeyRefused:
              summary: Key answer that does not verify
              value:
                type: about:blank
                title: 'Clé de sécurité non reconnue : réessayez ou choisissez une autre méthode.'
                status: 422
                code: auth.security-key-refused
    SecurityKeyNotFound:
      description: '`security-key.not-found`: no security key with this id belongs to the account.'
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          example:
            type: about:blank
            title: Clé de sécurité introuvable.
            status: 404
            code: security-key.not-found
  examples:
    CamilleMartin:
      summary: Camille Martin, with the profile of the mockup
      value:
        id: 019a5f3c-8d2e-7c4a-9b1f-3e5d7a9c1b30
        name: Camille Martin
        email: camille.martin@ateliernord.fr
        language: fr
        displayName: camille
        jobTitle: Responsable produit
        timeZone: Europe/Paris
        passwordChangedAt: '2026-08-12T09:30:00Z'
        version: 3
    CrossSiteRefused:
      summary: Request from another site
      value:
        type: about:blank
        title: Forbidden
        status: 403
        code: auth.csrf-rejected
    ResetLinkExpired:
      summary: Reset link no longer usable
      value:
        type: about:blank
        title: Ce lien a expiré
        status: 422
        code: auth.reset-link-expired
    PasswordTooShort:
      summary: Password too short
      value:
        type: about:blank
        title: Le mot de passe doit compter 12 caractères minimum.
        status: 422
        code: auth.password-too-short
        details:
          minLength: 12
    PasswordCompromised:
      summary: Compromised password
      value:
        type: about:blank
        title: 'Ce mot de passe figure parmi des mots de passe divulgués : choisissez-en un autre.'
        status: 422
        code: auth.password-compromised
    PasswordIncorrect:
      summary: Wrong password
      value:
        type: about:blank
        title: Mot de passe incorrect.
        status: 422
        code: auth.password-incorrect
        details:
          remainingAttempts: 3
    ApiTokenNotAccepted:
      summary: Personal API token on a session-only route
      value:
        type: about:blank
        title: Cette requête n’accepte pas de jeton d’API.
        status: 403
        code: auth.api-token-not-accepted
    CodeInvalid:
      summary: Wrong code
      value:
        type: about:blank
        title: 'Code incorrect ou expiré : vérifiez le dernier e-mail reçu.'
        status: 422
        code: auth.code-invalid
    CodeExpired:
      summary: Code no longer usable
      value:
        type: about:blank
        title: 'Code incorrect ou expiré : vérifiez le dernier e-mail reçu.'
        status: 422
        code: auth.code-expired
    RateLimited:
      summary: Gateway limit reached
      value:
        type: about:blank
        title: 'Trop de requêtes : réessayez dans un instant.'
        status: 429
        code: rate-limit.exceeded
    SignInChallenge:
      summary: The challenge of Camille Martin, with the app, two keys and 7 backup codes
      value:
        token: ExampleOnlyChallengeToken00000000000000000
        expiresAt: '2026-11-09T07:52:00Z'
        email: camille.martin@ateliernord.fr
        name: Camille Martin
        primaryMethod: authenticator-app
        methods: [authenticator-app, security-key, backup-code]
        securityKeys:
          - name: YubiKey 5C NFC
          - name: Touch ID (MacBook Air)
        backupCodesRemaining: 7
        lockedUntil: null
    TwoStepVerificationEnabled:
      summary: The card of Camille Martin in the mockup
      value:
        enabled: true
        primaryMethod: authenticator-app
        methods: [authenticator-app, security-key]
        authenticatorApp:
          configuredAt: '2026-03-03T10:15:00Z'
        securityKeys:
          - id: 019a6c52-1d2e-7f3a-8b4c-5d6e7f8a9b01
            name: YubiKey 5C NFC
            createdAt: '2026-03-03T10:20:00Z'
            lastUsedAt: '2026-11-09T07:42:00Z'
          - id: 019a6c52-1d2e-7f3a-8b4c-5d6e7f8a9b02
            name: Touch ID (MacBook Air)
            createdAt: '2026-04-14T08:05:00Z'
            lastUsedAt: '2026-11-06T08:15:00Z'
        backupCodes:
          remaining: 7
          total: 10
          generatedAt: '2026-03-03T10:15:00Z'
        requiredBy:
          - organizationId: 019a5f3c-8d2e-7c4a-9b1f-3e5d7a9c1b2f
            requiredFor: admins
    ChallengeExpired:
      summary: Challenge no longer usable
      value:
        type: about:blank
        title: 'La vérification a expiré : connectez-vous de nouveau.'
        status: 422
        code: auth.challenge-expired
    TwoStepCodeInvalid:
      summary: Wrong or used two-step code
      value:
        type: about:blank
        title: Code incorrect ou déjà utilisé.
        status: 422
        code: auth.two-step-code-invalid
        details:
          remainingAttempts: 4
    TwoStepLocked:
      summary: Two-step answers locked
      value:
        type: about:blank
        title: 'Trop de tentatives échouées : réessayez dans 15 minutes.'
        status: 429
        code: auth.two-step-locked
        details:
          lockedUntil: '2026-11-09T08:02:00Z'
    TwoStepNotEnabled:
      summary: Two-step verification off
      value:
        type: about:blank
        title: Activez d’abord la vérification en deux étapes.
        status: 409
        code: auth.two-step-not-enabled
    TwoStepSetupExpired:
      summary: Setup no longer pending
      value:
        type: about:blank
        title: 'La configuration a expiré : recommencez.'
        status: 422
        code: auth.two-step-setup-expired
  schemas:
    Email:
      type: string
      format: email
      maxLength: 254
      description: Email address, compared without regard to case.
      examples: [camille.martin@ateliernord.fr]
    Language:
      type: string
      description: BCP 47 language tag of the account, used for its emails. `fr` by default.
      examples: [fr]
    SignInMethodsRequest:
      type: object
      required: [email]
      properties:
        email:
          $ref: '#/components/schemas/Email'
    SignInMethods:
      type: object
      required: [methods]
      properties:
        methods:
          type: array
          description: Methods to offer, in the order to show them.
          items:
            $ref: '#/components/schemas/SignInMethod'
    SignInMethod:
      type: object
      required: [type]
      properties:
        type:
          type: string
          description: |
            `password`: `POST /v1/auth/sign-in`. `email-code`: `POST /v1/auth/sign-in/code`, then
            `POST /v1/auth/sign-in/code/verification`. Later versions add other types; a client
            ignores a type it does not know. The list grows without a new version, hence
            `x-extensible-enum` and not `enum`.
          x-extensible-enum: [password, email-code]
    SignUpRequest:
      type: object
      required: [name, email, password, acceptTerms]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
          description: |
            Full name, as typed; surrounding spaces are removed, and a name made only of spaces is
            refused with `400 request.invalid`.
          examples: [Camille Martin]
        email:
          $ref: '#/components/schemas/Email'
        password:
          $ref: '#/components/schemas/Password'
        acceptTerms:
          type: boolean
          description: |
            The person accepts the terms of use and the privacy policy. `false` answers
            `422 auth.terms-not-accepted`.
    Password:
      type: string
      maxLength: 256
      description: |
        At least 12 characters, no composition rule, not in the list of compromised passwords. The
        length is checked by identity-service (`422 auth.password-too-short`), not by the schema.
        Never logged.
    CodeRequest:
      type: object
      required: [email]
      properties:
        email:
          $ref: '#/components/schemas/Email'
    CodeSent:
      type: object
      required: [email, expiresAt, resendAvailableAt]
      description: Answered the same way whether or not a code was actually sent.
      properties:
        email:
          $ref: '#/components/schemas/Email'
        expiresAt:
          type: string
          format: date-time
          description: When a code sent now stops working, 10 minutes later.
        resendAvailableAt:
          type: string
          format: date-time
          description: |
            When another code can be asked for: 30 seconds later, or the end of the hour once 5
            codes were asked for the address in it (see `CodeThrottled`).
    SignUpVerification:
      type: object
      required: [email, code]
      description: |
        The code of a sign-up and the password that binds the verification to that sign-up. See
        `POST /v1/auth/sign-up/verification` for the order of the checks.
      properties:
        email:
          $ref: '#/components/schemas/Email'
        code:
          type: string
          pattern: '^[0-9]{6}$'
          description: The 6 digits of the email, without the space it is shown with. Never logged.
          examples: ['482913']
        rememberMe:
          type: boolean
          default: false
          description: Keep the session for 30 days ("Rester connecté pendant 30 jours").
        password:
          $ref: '#/components/schemas/Password'
          description: |
            The password typed in the sign-up form; the web application always sends it. Once the
            code is right, it is compared with the password of the latest sign-up of the address:
            a different one answers `422 auth.sign-up-replaced`. Required once the address was
            signed up more than once before the verification: without it the answer is the same.
            Never logged.
    CodeVerification:
      type: object
      required: [email, code]
      properties:
        email:
          $ref: '#/components/schemas/Email'
        code:
          type: string
          pattern: '^[0-9]{6}$'
          description: The 6 digits of the email, without the space it is shown with. Never logged.
          examples: ['482913']
        rememberMe:
          type: boolean
          default: false
          description: Keep the session for 30 days ("Rester connecté pendant 30 jours").
    PasswordSignIn:
      type: object
      required: [email, password]
      properties:
        email:
          $ref: '#/components/schemas/Email'
        password:
          type: string
          minLength: 1
          maxLength: 256
          description: Never logged.
        rememberMe:
          type: boolean
          default: false
          description: Keep the session for 30 days ("Rester connecté pendant 30 jours").
    SignOutRequest:
      type: object
      additionalProperties: false
      description: 'Empty object `{}`; it exists so that the request carries `Content-Type: application/json`.'
    SignedIn:
      type: object
      required: [user, session]
      properties:
        user:
          $ref: '#/components/schemas/CurrentUser'
        session:
          $ref: '#/components/schemas/Session'
        deletionCancelled:
          type: boolean
          description: |
            `true` when this sign-in cancelled the scheduled deletion of the account
            (`POST /v1/me/deletion`): the web application tells the person (new copy: "La
            suppression de votre compte est annulée."). Absent or `false` otherwise.
    Session:
      type: object
      required: [id, expiresAt]
      properties:
        id:
          type: string
          format: uuid
          description: Id of the session; not its token.
        expiresAt:
          type: string
          format: date-time
          description: |
            When the session ends at the latest: 30 days after the sign-in with `rememberMe`. It
            also ends after the inactivity the policy of its current organization sets, 12 hours
            by default.
    CurrentUser:
      type: object
      required: [id, name, email, language, displayName, jobTitle, timeZone, version]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          description: Full name ("Nom complet"); the web application derives the initials from it.
          examples: [Camille Martin]
        email:
          $ref: '#/components/schemas/Email'
        language:
          $ref: '#/components/schemas/Language'
        displayName:
          type: [string, 'null']
          description: |
            "Nom affiché", used for the mentions (`@camille`); `null` until the person chooses one.
          examples: [camille]
        jobTitle:
          type: [string, 'null']
          description: '"Poste (facultatif)"; `null` when there is none.'
          examples: [Responsable produit]
        avatarId:
          type: [string, 'null']
          format: uuid
          description: Current opaque avatar reference or null. Read the image with GET /v1/me/avatar.
        timeZone:
          $ref: '#/components/schemas/TimeZone'
        passwordChangedAt:
          type: string
          format: date-time
          description: |
            When the password was last set: at the sign-up, by `PUT /v1/me/password` or by a reset.
            The "Mot de passe" row shows it ("Modifié le 12 août 2026."). Always present once the
            gateway and identity-service run this version of the contracts.
        version:
          type: integer
          minimum: 1
          description: |
            Version of the account, also sent as `ETag`. A change of the profile, avatar, password,
            address, two-step verification or scheduled deletion makes it the next one.
    TimeZone:
      type: string
      minLength: 1
      maxLength: 64
      description: |
        IANA time zone name of the account ("Fuseau horaire"), `Europe/Paris` until the person
        chooses another.
      examples: [Europe/Paris]
    ProfilePatch:
      type: object
      description: JSON Merge Patch of the profile; an empty object changes nothing.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
          description: |
            Full name ("Nom complet"), as typed; surrounding spaces are removed, and a name made only
            of spaces is refused with `400 request.invalid`.
          examples: [Camille Martin]
        displayName:
          type: [string, 'null']
          minLength: 1
          maxLength: 60
          description: '"Nom affiché", as typed and trimmed; `null` clears it.'
          examples: [camille]
        jobTitle:
          type: [string, 'null']
          minLength: 1
          maxLength: 120
          description: '"Poste (facultatif)", as typed and trimmed; `null` clears it.'
          examples: [Responsable produit]
        timeZone:
          $ref: '#/components/schemas/TimeZone'
        language:
          type: string
          description: |
            Language of the account and of its emails ("Langue"), a BCP 47 tag: `fr` (Français),
            `en` (English), `de` (Deutsch) or `es` (Español). Later versions may accept more.
          enum: [fr, en, de, es]
    EmptyRequest:
      type: object
      additionalProperties: false
      description: 'Empty object `{}`; it exists so that the request carries `Content-Type: application/json`.'
    PasswordResetRequest:
      type: object
      required: [email]
      properties:
        email:
          $ref: '#/components/schemas/Email'
    PasswordResetLinkSent:
      type: object
      required: [email, expiresAt, resendAvailableAt]
      description: Answered the same way whether or not a link was actually sent.
      properties:
        email:
          $ref: '#/components/schemas/Email'
        expiresAt:
          type: string
          format: date-time
          description: When a link sent now stops working, 30 minutes later ("Il reste valable 30 minutes.").
        resendAvailableAt:
          type: string
          format: date-time
          description: |
            When another link can be asked for ("Renvoyer l'e-mail dans 0:45"): 45 seconds later,
            or the end of the hour once 5 links were asked for the address in it (see
            `ResetThrottled`).
    PasswordResetToken:
      type: object
      required: [token]
      properties:
        token:
          $ref: '#/components/schemas/ResetToken'
    ResetToken:
      type: string
      minLength: 1
      maxLength: 256
      description: |
        The token of the reset link, read from the fragment of `<web application>/reset#token=<token>`.
        A secret: sent in the body only, never logged. A malformed token answers like an unknown one
        (`422 auth.reset-link-expired`).
    PasswordResetLink:
      type: object
      required: [email, expiresAt, sessionCount]
      properties:
        email:
          $ref: '#/components/schemas/Email'
          description: Address of the account of the link ("Pour le compte <email>.").
        expiresAt:
          type: string
          format: date-time
          description: When the link stops working.
        sessionCount:
          type: integer
          minimum: 0
          description: |
            Open sessions of the account, every one of which the reset closes unless the person
            unticks "Fermer mes autres sessions" ("3 appareils connectés seront déconnectés").
    PasswordResetConfirmation:
      type: object
      required: [token, newPassword]
      properties:
        token:
          $ref: '#/components/schemas/ResetToken'
        newPassword:
          $ref: '#/components/schemas/Password'
        closeOtherSessions:
          type: boolean
          default: true
          description: |
            "Fermer mes autres sessions", ticked by default: closes every open session of the
            account. `false` leaves them open.
    PasswordResetCompleted:
      type: object
      required: [email, closedSessionCount]
      properties:
        email:
          $ref: '#/components/schemas/Email'
          description: Address of the account, where the confirmation email goes.
        closedSessionCount:
          type: integer
          minimum: 0
          description: Sessions the reset closed; 0 when `closeOtherSessions` was `false` or none was open.
    ReauthenticationRequest:
      type: object
      description: |
        The method of `details.methods`: `password` for an account without two-step verification,
        `code` (`authenticator-app`) for an account with it. Both or neither answer
        `400 request.invalid`, `password` for an account with two-step verification
        `403 auth.reauthentication-required`, and `code` for an account without an authenticator
        app `409 auth.two-step-not-enabled`, all checked by identity-service.
      properties:
        password:
          type: string
          minLength: 1
          maxLength: 256
          description: |
            The current password of an account without two-step verification. Never logged.
        code:
          $ref: '#/components/schemas/TwoStepCode'
          description: |
            The 6 digits the authenticator app of an account with two-step verification shows now.
            Works once. Never logged.
    RecentAuthentication:
      type: object
      required: [authenticatedAt, expiresAt]
      properties:
        authenticatedAt:
          type: string
          format: date-time
          description: When the person last proved who they are in this session.
        expiresAt:
          type: string
          format: date-time
          description: |
            When the window ends, 10 minutes later; the guarded routes then answer
            `403 auth.reauthentication-required` again.
    PasswordChange:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
          minLength: 1
          maxLength: 256
          description: '"Mot de passe actuel". Never logged.'
        newPassword:
          $ref: '#/components/schemas/Password'
    EmailChangeRequest:
      type: object
      required: [email]
      properties:
        email:
          $ref: '#/components/schemas/Email'
          description: '"Nouvelle adresse e-mail", where the code goes.'
    EmailChangeCodeSent:
      type: object
      required: [email, expiresAt, resendAvailableAt]
      properties:
        email:
          $ref: '#/components/schemas/Email'
          description: The new address the code was sent to ("Code envoyé à <email>").
        expiresAt:
          type: string
          format: date-time
          description: When the code stops working, 15 minutes later ("Le code est valable 15 minutes.").
        resendAvailableAt:
          type: string
          format: date-time
          description: |
            When another code can be asked for the new address: 30 seconds later, or the end of the
            hour once 5 codes were asked for it (see `CodeThrottled`).
    EmailChangeConfirmation:
      type: object
      required: [code]
      properties:
        code:
          type: string
          pattern: '^[0-9]{6}$'
          description: The 6 digits sent to the new address, without the space they are shown with. Never logged.
          examples: ['731406']
    DeletionScheduled:
      type: object
      required: [deleteAt]
      properties:
        deleteAt:
          type: string
          format: date-time
          description: When the account will be deleted, 30 days after the scheduling, unless a sign-in cancels it first.
    Device:
      type: object
      required: [type, browser, browserVersion, os, osVersion]
      description: |
        The device a session runs on, as identity-service reads it from the `User-Agent` of its
        sign-in ("Firefox 132 · Windows"). A member it cannot read is `null`.
      properties:
        type:
          type: string
          description: |
            `desktop`, `mobile` or `tablet`, or `unknown` when the `User-Agent` does not tell.
            Later versions may add types; a client shows an unknown one as `unknown`.
          x-extensible-enum: [desktop, mobile, tablet, unknown]
        browser:
          type: [string, 'null']
          description: Name of the browser or client.
          examples: [Firefox]
        browserVersion:
          type: [string, 'null']
          description: Major version of the browser.
          examples: ['132']
        os:
          type: [string, 'null']
          description: Name of the operating system.
          examples: [Windows]
        osVersion:
          type: [string, 'null']
          description: |
            Version of the operating system, `null` when the `User-Agent` does not tell it
            reliably: browsers report Windows 10 and 11 alike and freeze the version of macOS.
          examples: ['18.1']
    OpenSession:
      type: object
      required: [id, current, device, ipAddress, signedInAt, lastActiveAt, expiresAt]
      properties:
        id:
          type: string
          format: uuid
        current:
          type: boolean
          description: '`true` for the session of the request ("Cet appareil").'
        device:
          $ref: '#/components/schemas/Device'
        ipAddress:
          type: string
          description: |
            IPv4 or IPv6 address the session was opened from, as the gateway saw it. No place is
            derived from it.
          examples: [192.0.2.14]
        signedInAt:
          type: string
          format: date-time
          description: When the sign-in opened the session.
        lastActiveAt:
          type: string
          format: date-time
          description: |
            Last request of the session, recorded at most once a minute ("Actif maintenant", "Il y
            a 2 h").
        expiresAt:
          type: string
          format: date-time
          description: When the session ends at the latest, whatever its activity.
        inactivityTimeoutMinutes:
          type: integer
          minimum: 1
          description: |
            Minutes of inactivity after which the session closes: the policy of its current
            organization (`60`, `720`, `10080` or `43200`), `720` (12 hours) without one ("Une
            session inactive pendant 12 heures est fermée automatiquement."). Always present once
            the gateway and identity-service run this version of the contracts.
          examples: [720]
    OpenSessionPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/OpenSession'
        nextCursor:
          $ref: '../../components/http.yaml#/components/schemas/NextCursor'
    RevokedSessions:
      type: object
      required: [revokedCount]
      properties:
        revokedCount:
          type: integer
          minimum: 0
          description: Sessions closed by the request ("2 sessions fermées").
    TwoStepCode:
      type: string
      pattern: '^[0-9]{6}$'
      description: |
        The 6 digits the authenticator app shows now, without a space. Works once: a code already
        accepted is refused. Never logged.
      examples: ['261845']
    ChallengeToken:
      type: string
      minLength: 1
      maxLength: 256
      description: |
        The token of a two-step challenge, as its `202` gave it. A secret: sent in bodies only,
        never in a URL, never logged; identity-service keeps only its SHA-256 hash. A malformed
        token answers like an unknown one (`422 auth.challenge-expired`).
    ChallengeTokenRequest:
      type: object
      required: [token]
      properties:
        token:
          $ref: '#/components/schemas/ChallengeToken'
    TwoStepMethod:
      type: string
      description: |
        A way to answer a two-step challenge: `authenticator-app` ("Application", a code of the
        app), `security-key` ("Clé de sécurité", WebAuthn) or `backup-code` ("Code de secours").
        Later versions may add methods; a client ignores one it does not know.
      x-extensible-enum: [authenticator-app, security-key, backup-code]
    SignInChallenge:
      type: object
      required:
        [
          token,
          expiresAt,
          email,
          name,
          primaryMethod,
          methods,
          securityKeys,
          backupCodesRemaining,
          lockedUntil,
        ]
      description: |
        A two-step challenge, the second step of a sign-in ("Vérification en deux étapes"). It
        holds what the screen shows: the account above it, the tabs of `methods` in their order,
        the one that opens first, the names of the keys and the backup codes left.
      properties:
        token:
          type: string
          minLength: 32
          maxLength: 256
          description: |
            The secret of the challenge (256 random bits, base64url), to send with its answer.
            Returned by the `202` of the sign-in and echoed by the inspection. Never logged.
          examples: [ExampleOnlyChallengeToken00000000000000000]
        expiresAt:
          type: string
          format: date-time
          description: When the challenge stops working, 10 minutes after the sign-in that issued it.
        email:
          $ref: '#/components/schemas/Email'
          description: Address of the account, shown above the challenge.
        name:
          type: string
          description: Full name of the account; the web application derives the initials from it.
          examples: [Camille Martin]
        primaryMethod:
          $ref: '#/components/schemas/TwoStepMethod'
          description: The method whose tab opens first, `authenticator-app` today.
        methods:
          type: array
          minItems: 1
          description: |
            The methods the account can answer with, in the order of the tabs: `authenticator-app`
            always, `security-key` when the account has a key, `backup-code` while a backup code is
            left. Later versions may add methods: a client skips one it does not know, so the list
            has no upper bound.
          items:
            $ref: '#/components/schemas/TwoStepMethod'
        securityKeys:
          type: array
          maxItems: 10
          description: |
            The keys of the account, by name ("2 clés enregistrées : YubiKey 5C NFC, Touch ID
            (MacBook Air).").
          items:
            type: object
            required: [name]
            properties:
              name:
                type: string
                examples: [YubiKey 5C NFC]
        backupCodesRemaining:
          type: integer
          minimum: 0
          maximum: 10
          description: Backup codes not used yet ("Il vous reste 7 codes inutilisés.").
        lockedUntil:
          type: [string, 'null']
          format: date-time
          description: |
            When the lockout of the two-step answers of the account ends, `null` when they are not
            locked (see `TwoStepLocked`): until then every answer is refused.
    AuthenticatorAppAnswer:
      type: object
      required: [token, code]
      properties:
        token:
          $ref: '#/components/schemas/ChallengeToken'
        code:
          $ref: '#/components/schemas/TwoStepCode'
        trustDevice:
          $ref: '#/components/schemas/TrustDevice'
    BackupCodeAnswer:
      type: object
      required: [token, code]
      properties:
        token:
          $ref: '#/components/schemas/ChallengeToken'
        code:
          type: string
          pattern: '^[0-9A-Za-z]{4}-?[0-9A-Za-z]{4}$'
          description: |
            A backup code, `XXXX-XXXX` (placeholder "XXXX-XXXX"), read without regard to case, with
            or without its dash. Works once. Never logged.
          examples: [4F7K-2M9Q]
        trustDevice:
          $ref: '#/components/schemas/TrustDevice'
    SecurityKeyAnswer:
      type: object
      required: [token, credential]
      properties:
        token:
          $ref: '#/components/schemas/ChallengeToken'
        credential:
          $ref: '#/components/schemas/SecurityKeyAssertion'
        trustDevice:
          $ref: '#/components/schemas/TrustDevice'
    TrustDevice:
      type: boolean
      default: false
      description: |
        "Faire confiance à cet appareil pendant 30 jours": the gateway sets the device cookie, and
        the sign-ins of this account from this browser skip the challenge for 30 days.
    WebAuthnCredentialDescriptor:
      type: object
      required: [id, type]
      additionalProperties: true
      description: A WebAuthn credential of the account, by id (`PublicKeyCredentialDescriptorJSON`).
      properties:
        id:
          type: string
          description: Id of the credential, base64url.
        type:
          type: string
          description: '`public-key`.'
          examples: [public-key]
        transports:
          type: array
          description: How the browser reaches the key (`usb`, `nfc`, `ble`, `internal`, `hybrid`).
          items:
            type: string
    WebAuthnRequestOptions:
      type: object
      required: [challenge]
      additionalProperties: true
      description: |
        `PublicKeyCredentialRequestOptionsJSON` of WebAuthn Level 3, as identity-service builds
        it: the web application passes the whole object to the browser. Members not listed here
        are passed on too.
      properties:
        challenge:
          type: string
          description: The WebAuthn challenge, base64url, valid once.
        rpId:
          type: string
          description: The relying party, the domain of the web application.
        timeout:
          type: integer
          minimum: 1
          description: Milliseconds the browser waits for the key.
        userVerification:
          type: string
          description: '`required`, `preferred` or `discouraged`.'
        allowCredentials:
          type: array
          maxItems: 10
          description: The keys of the account; no other key can answer.
          items:
            $ref: '#/components/schemas/WebAuthnCredentialDescriptor'
    WebAuthnCreationOptions:
      type: object
      required: [challenge, rp, user, pubKeyCredParams]
      additionalProperties: true
      description: |
        `PublicKeyCredentialCreationOptionsJSON` of WebAuthn Level 3, as identity-service builds
        it: the web application passes the whole object to the browser. Members not listed here
        (`authenticatorSelection`, `attestation`, `extensions`, `hints`) are passed on too.
      properties:
        challenge:
          type: string
          description: The WebAuthn challenge, base64url, valid once.
        rp:
          type: object
          required: [name]
          additionalProperties: true
          properties:
            id:
              type: string
              examples: [cadenway.com]
            name:
              type: string
              examples: [Cadenway]
        user:
          type: object
          required: [id, name, displayName]
          additionalProperties: true
          properties:
            id:
              type: string
              description: Opaque handle of the account for WebAuthn, base64url; not its id nor its address.
            name:
              type: string
              examples: [camille.martin@ateliernord.fr]
            displayName:
              type: string
              examples: [Camille Martin]
        pubKeyCredParams:
          type: array
          minItems: 1
          items:
            type: object
            required: [type, alg]
            additionalProperties: true
            properties:
              type:
                type: string
                examples: [public-key]
              alg:
                type: integer
                description: COSE algorithm (`-8` EdDSA, `-7` ES256, `-257` RS256).
        timeout:
          type: integer
          minimum: 1
          description: Milliseconds the browser waits for the key.
        excludeCredentials:
          type: array
          maxItems: 10
          description: The keys the account already has, which the browser refuses to register again.
          items:
            $ref: '#/components/schemas/WebAuthnCredentialDescriptor'
    SecurityKeyAssertion:
      type: object
      required: [id, rawId, type, response]
      additionalProperties: true
      description: |
        The answer of the key (`AuthenticationResponseJSON`), as the browser serializes it. Members
        not listed here are passed on to identity-service, which verifies it.
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 1024
        rawId:
          type: string
          minLength: 1
          maxLength: 1024
        type:
          type: string
          examples: [public-key]
        response:
          type: object
          required: [clientDataJSON, authenticatorData, signature]
          additionalProperties: true
          properties:
            clientDataJSON:
              type: string
              maxLength: 16384
            authenticatorData:
              type: string
              maxLength: 16384
            signature:
              type: string
              maxLength: 16384
            userHandle:
              type: [string, 'null']
              maxLength: 1024
        authenticatorAttachment:
          type: [string, 'null']
        clientExtensionResults:
          type: object
          additionalProperties: true
    SecurityKeyAttestation:
      type: object
      required: [id, rawId, type, response]
      additionalProperties: true
      description: |
        The answer of the browser to the registration options (`RegistrationResponseJSON`), as it
        serializes it. Members not listed here are passed on to identity-service, which verifies
        it.
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 1024
        rawId:
          type: string
          minLength: 1
          maxLength: 1024
        type:
          type: string
          examples: [public-key]
        response:
          type: object
          required: [clientDataJSON, attestationObject]
          additionalProperties: true
          properties:
            clientDataJSON:
              type: string
              maxLength: 16384
            attestationObject:
              type: string
              maxLength: 65536
            transports:
              type: array
              maxItems: 10
              items:
                type: string
        authenticatorAttachment:
          type: [string, 'null']
        clientExtensionResults:
          type: object
          additionalProperties: true
    SecurityKeyAssertionOptions:
      type: object
      required: [options, expiresAt]
      properties:
        options:
          $ref: '#/components/schemas/WebAuthnRequestOptions'
        expiresAt:
          type: string
          format: date-time
          description: When the options stop working, 5 minutes later.
    TwoStepVerification:
      type: object
      required:
        [enabled, primaryMethod, methods, authenticatorApp, securityKeys, backupCodes, requiredBy]
      description: The two-step verification of the account, without any secret.
      properties:
        enabled:
          type: boolean
          description: '"Activée" or "Désactivée": on while the account has an authenticator app.'
        primaryMethod:
          description: |
            The method a challenge opens on ("méthode principale"), `authenticator-app` today;
            `null` while two-step verification is off.
          oneOf:
            - $ref: '#/components/schemas/TwoStepMethod'
            - type: 'null'
        methods:
          type: array
          description: |
            The configured methods: `authenticator-app`, and `security-key` when the account has a
            key; empty while two-step verification is off. Backup codes are in `backupCodes`, never
            here. Later versions may add methods: a client skips one it does not know.
          items:
            $ref: '#/components/schemas/TwoStepMethod'
        authenticatorApp:
          type: [object, 'null']
          required: [configuredAt]
          description: The authenticator app ("Application d'authentification"), `null` while off.
          properties:
            configuredAt:
              type: string
              format: date-time
              description: When the current app was confirmed ("Configurée le 3 mars 2026").
        securityKeys:
          type: array
          maxItems: 10
          description: The security keys ("Clés de sécurité et biométrie"), the oldest first.
          items:
            $ref: '#/components/schemas/SecurityKey'
        backupCodes:
          type: [object, 'null']
          required: [remaining, total, generatedAt]
          description: The backup codes ("Codes de secours"), `null` while off.
          properties:
            remaining:
              type: integer
              minimum: 0
              maximum: 10
              description: Codes not used yet ("7 codes inutilisés sur 10").
            total:
              type: integer
              minimum: 1
              description: Codes generated together, 10.
            generatedAt:
              type: string
              format: date-time
              description: When they were generated.
        requiredBy:
          type: array
          description: |
            The organizations whose authentication policy requires two-step verification of the
            person, for the role they have in each ("Exigée par Atelier Nord pour les propriétaires
            et administrateurs."): while one is listed, it cannot be turned off.
          items:
            $ref: '#/components/schemas/TwoStepRequirement'
    TwoStepRequirement:
      type: object
      required: [organizationId, requiredFor]
      properties:
        organizationId:
          type: string
          format: uuid
        requiredFor:
          type: string
          description: |
            `admins`: the policy requires it of the owner and the admins; `everyone`: of every
            member, guests included. Later versions may add values (`x-extensible-enum`).
          x-extensible-enum: [admins, everyone]
    SecurityKey:
      type: object
      required: [id, name, createdAt, lastUsedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          description: The name the person gave it.
          examples: [YubiKey 5C NFC]
        createdAt:
          type: string
          format: date-time
        lastUsedAt:
          type: [string, 'null']
          format: date-time
          description: Last answer of a challenge with the key; `null` before the first.
    AuthenticatorAppSetup:
      type: object
      required: [secret, otpauthUri, expiresAt]
      properties:
        secret:
          type: string
          pattern: '^[A-Z2-7]{32}$'
          description: |
            The TOTP secret of the new app, 160 random bits in base32 without padding, returned
            here once ("saisissez la clé"). A secret: never logged, never kept by the web
            application or the gateway; identity-service keeps it encrypted.
          examples: [JBSWY3DPEHPK3PXPJBSWY3DPEHPK3PXP]
        otpauthUri:
          type: string
          maxLength: 2048
          description: |
            `otpauth://totp/Cadenway:<address>?secret=<secret>&issuer=Cadenway&algorithm=SHA1&digits=6&period=30`,
            drawn as a QR code by the web application. Holds the secret: never logged.
        expiresAt:
          type: string
          format: date-time
          description: When the pending setup stops working, 15 minutes later.
    AuthenticatorAppConfirmation:
      type: object
      required: [code]
      properties:
        code:
          $ref: '#/components/schemas/TwoStepCode'
    AuthenticatorAppConfigured:
      type: object
      required: [twoStepVerification, backupCodes]
      properties:
        twoStepVerification:
          $ref: '#/components/schemas/TwoStepVerification'
        backupCodes:
          description: |
            The 10 backup codes generated because two-step verification turned on, returned here
            once; `null` for a reconfiguration, which keeps the current codes.
          oneOf:
            - $ref: '#/components/schemas/BackupCodes'
            - type: 'null'
    BackupCodes:
      type: object
      required: [codes, generatedAt]
      description: Backup codes, returned once by the request that generates them.
      properties:
        codes:
          type: array
          minItems: 10
          maxItems: 10
          description: |
            10 codes `XXXX-XXXX` of upper-case letters and digits (about 41 bits each), each
            working once. Secrets: the web application shows them, offers to copy and download
            them, and never keeps them; identity-service keeps only their HMAC-SHA-256 under a key
            kept outside the database, as for the one-time codes.
          items:
            type: string
            pattern: '^[0-9A-Z]{4}-[0-9A-Z]{4}$'
        generatedAt:
          type: string
          format: date-time
    SecurityKeyRegistration:
      type: object
      required: [options, expiresAt]
      properties:
        options:
          $ref: '#/components/schemas/WebAuthnCreationOptions'
        expiresAt:
          type: string
          format: date-time
          description: When the pending registration stops working, 5 minutes later.
    SecurityKeyAddition:
      type: object
      required: [name, credential]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 60
          description: |
            Name of the key, as typed and trimmed (new field, new copy: "Nom de la clé", for
            example "YubiKey 5C NFC" or "Touch ID (MacBook Air)"). A name made only of spaces
            answers `400 request.invalid`.
          examples: [YubiKey 5C NFC]
        credential:
          $ref: '#/components/schemas/SecurityKeyAttestation'
