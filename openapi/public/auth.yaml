# Public routes of authentication: sign-up, email verification, sign-in by password or by email
# code, sign-out and the current user. Served by cadenway-api-gateway, which calls
# openapi/internal/identity-service.yaml for each of them.
openapi: 3.1.0
info:
  title: Cadenway authentication
  version: 1.0.0
  description: |
    How a person creates an account, proves the address, signs in and out, and reads who they are.
    The API gateway serves these routes and answers them through identity-service.

    **Sessions.** A session travels only in the cookie `__Host-cw_session`, set by the gateway on the
    responses that sign in (`Set-Cookie`) and cleared by the sign-out. The token is opaque: the
    gateway checks it on every request with identity-service, without a cache, so a revoked session
    stops at the next request. The web application never reads it (`HttpOnly`). A route without a
    session (`security: []`) ignores the cookie: a stale one never makes it fail. The responses that
    sign in and `GET /v1/me` carry `Cache-Control: no-store`. Personal API tokens, sent as a bearer
    token, come in a later version of this document.

    **Cross-site requests.** Every request with an unsafe method on these routes, signed in or not,
    carries an `Origin` equal to one of the gateway's allowed origins (the web application, the
    website) and `Content-Type: application/json`; the gateway refuses any other before the route
    runs (`403 auth.csrf-rejected`). Signing in and signing up are covered too, so that another
    site cannot sign a browser in to an account of its choosing.

    **Account enumeration.** Only the sign-up says whether an address is taken, as the mockup does.
    Every other route answers the same way whether or not an account uses the address: the method
    discovery, the code requests, the code checks, the password check and its lockout, which are
    counted per address.

    **Errors.** Every error is an `application/problem+json` problem with a stable `code`. The
    `code` is the contract. For a code the web application shows to the person, `title` is French
    text it may show as is, the same for every occurrence of the code; the other codes carry the
    English reason phrase of the status. `details` carries the values the web application formats
    its own lines from.
    A failed password or code answers `422`, never `401`: `401` means that the session cookie is
    missing or no longer active, and the web application sends the person to the sign-in screen on
    it.

    **Status codes of actions.** These routes are actions, not resources: none answers `201` with a
    `Location`. A route that sends a code answers `202`, one that signs in answers `200` with the
    cookie, and the sign-out answers `204`.

    **Later versions** add, without changing what is here: OAuth providers and SAML single sign-on
    (new method types in the discovery, new routes), a second factor (a sign-in that needs one will
    answer another success status with a challenge: a `200` always carries a session), password
    reset, organizations and memberships in the current user, sessions and API tokens.
  contact:
    name: Cadenway
    url: https://github.com/Cadenway/cadenway-api-contracts
  license:
    name: Proprietary
    url: https://github.com/Cadenway/cadenway-api-contracts/blob/main/LICENSE
  x-consumers:
    - repository: cadenway-api-gateway
      uses: Serves every route, through openapi/internal/identity-service.yaml.
    - repository: cadenway-webapp
      uses: Calls every route through @cadenway/api-client (sign-in, sign-up, code and sign-out screens).
servers:
  - url: https://api.cadenway.com
    description: Production.
  - url: https://api.staging.cadenway.com
    description: Staging. The local stack of cadenway-ops serves the same routes on `api.<DOMAIN>`.
security:
  - sessionCookie: []
tags:
  - name: auth
    description: Sign-up, email verification, sign-in, sign-out and the current user.
paths:
  /v1/auth/sign-in-methods:
    post:
      operationId: discoverSignInMethods
      summary: Discover the sign-in methods of an address
      description: |
        Returns the methods the sign-in screen offers for an address. The address travels in the
        body so that it never sits in a URL or an access log.

        Today every address gets `password` and `email-code`, whether or not an account uses it.
        Later versions add `oauth` and `saml` methods; a client ignores a method type it does not
        know. No session needed. Scopes: none.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignInMethodsRequest'
            example:
              email: camille.martin@ateliernord.fr
      responses:
        '200':
          description: The methods offered for the address.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignInMethods'
              example:
                methods:
                  - type: password
                  - type: email-code
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/CrossSiteRefused'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/auth/sign-up:
    post:
      operationId: signUp
      summary: Create an account
      description: |
        Creates an account that is not verified yet and sends a 6-digit code to the address
        (`POST /v1/auth/sign-up/verification` completes the sign-up). No session is opened.

        - An address used by a verified account answers `409 auth.email-taken`.
        - An address whose earlier sign-up was never verified is not taken: the new sign-up
          replaces its name and password, and the earlier code stops working.
        - The verification is bound to the password of the latest sign-up of the address:
          `POST /v1/auth/sign-up/verification` answers `422 auth.sign-up-replaced` to a `password`
          that differs from it, and requires `password` once the address was signed up more than
          once. A code sent to the address therefore never verifies an account whose password
          someone else chose by signing up the same address.
        - A sign-up is a code request of the address, so it follows the throttle of the code
          requests (`429 auth.code-throttled`), shared with `POST /v1/auth/sign-up/code` and
          `POST /v1/auth/sign-in/code`: 30 seconds between two, at most 5 in an hour.
        - The password has 12 characters (Unicode code points) at least, no composition rule, and
          is refused when it appears in the list of compromised passwords identity-service embeds.

        No session needed. Scopes: none.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignUpRequest'
            example:
              name: Camille Martin
              email: camille.martin@ateliernord.fr
              password: atelier-nord-sprint-14
              acceptTerms: true
      responses:
        '202':
          description: The account exists, unverified, and a code was sent to the address.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodeSent'
              example:
                email: camille.martin@ateliernord.fr
                expiresAt: '2026-11-08T13:17:00Z'
                resendAvailableAt: '2026-11-08T13:07:30Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/CrossSiteRefused'
        '409':
          $ref: '#/components/responses/EmailTaken'
        '422':
          $ref: '#/components/responses/SignUpRefused'
        '429':
          $ref: '#/components/responses/CodeThrottled'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/auth/sign-up/code:
    post:
      operationId: resendSignUpCode
      summary: Send a new sign-up code
      description: |
        Sends a new code for an account whose address is not verified yet; the previous code stops
        working. Throttled per address, account or not, together with the sign-up and the sign-in
        codes: 30 seconds between two requests and at most 5 in an hour (`resendAvailableAt`, else
        `429 auth.code-throttled`).

        Answers `202` for any address, without sending anything when no unverified account uses
        it. No session needed. Scopes: none.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CodeRequest'
            example:
              email: camille.martin@ateliernord.fr
      responses:
        '202':
          description: The request is accepted; a code is on its way when the address awaits one.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodeSent'
              example:
                email: camille.martin@ateliernord.fr
                expiresAt: '2026-11-08T13:17:30Z'
                resendAvailableAt: '2026-11-08T13:08:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/CrossSiteRefused'
        '429':
          $ref: '#/components/responses/CodeThrottled'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/auth/sign-up/verification:
    post:
      operationId: verifySignUp
      summary: Verify the address and sign in
      description: |
        Checks the sign-up code, then the password of the sign-up. On success the address is
        verified, a session is opened and the gateway sets the session cookie. The code is
        single-use and expires 10 minutes after it was sent; after a few wrong attempts it stops
        working and a new one is needed.

        The checks run in this order:

        1. The code. A wrong code answers `422 auth.code-invalid`; a code that expired, was used,
           was replaced or took too many wrong attempts answers `422 auth.code-expired`, with or
           without `password`.
        2. With the right code, a `password` is compared with the password of the pending
           sign-up, the latest one of the address. When it differs, the answer is
           `422 auth.sign-up-replaced` and the code stops working.
        3. When a later sign-up replaced the name and password of the pending account (the
           address was signed up more than once before this verification), `password` is
           required: without it the answer is `422 auth.sign-up-replaced` too, and the code stops
           working. Only an accepted sign-up (`202`) counts: a refused one replaces nothing.

        Without `password`, an address signed up once is verified by its code alone. The web
        application always sends `password`, the one typed in the sign-up form; on
        `auth.sign-up-replaced` the person signs up again (`POST /v1/auth/sign-up`), which
        replaces the pending sign-up and sends a new code. `auth.sign-up-replaced` needs the right
        code, so it tells a caller without the code nothing. No session needed. Scopes: none.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignUpVerification'
            example:
              email: camille.martin@ateliernord.fr
              code: '482913'
              rememberMe: false
              password: atelier-nord-sprint-14
      responses:
        '200':
          $ref: '#/components/responses/SignedIn'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/CrossSiteRefused'
        '422':
          $ref: '#/components/responses/SignUpVerificationRefused'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/auth/sign-in:
    post:
      operationId: signInWithPassword
      summary: Sign in with a password
      description: |
        Checks an address and its password. On success a session is opened and the gateway sets the
        session cookie; `rememberMe` ("Rester connecté pendant 30 jours") makes the cookie
        persistent.

        - A wrong address or password answers `422 auth.invalid-credentials` with
          `details.remainingAttempts`, the failures left before the lockout.
        - The failure that uses the last attempt, and every attempt during the lockout, answer
          `429 auth.account-locked` with `Retry-After` and `details.lockedUntil` (15 minutes).
        - The right password of an account whose address is not verified answers
          `403 auth.email-not-verified`; `POST /v1/auth/sign-up/code` sends a new code.

        No session needed. Scopes: none.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordSignIn'
            example:
              email: camille.martin@ateliernord.fr
              password: atelier-nord-sprint-14
              rememberMe: true
      responses:
        '200':
          $ref: '#/components/responses/SignedIn'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/EmailNotVerified'
        '422':
          $ref: '#/components/responses/CredentialsRefused'
        '429':
          $ref: '#/components/responses/AccountLocked'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/auth/sign-in/code:
    post:
      operationId: requestSignInCode
      summary: Request a sign-in code
      description: |
        Sends a 6-digit sign-in code to the address when a verified account uses it, valid 10
        minutes; a new request replaces the previous code. Always answers `202`, whether or not an
        account uses the address. Throttled per address, account or not, together with the sign-up
        codes: 30 seconds between two requests and at most 5 in an hour (`resendAvailableAt`, else
        `429 auth.code-throttled`). Asking again is how a code is resent. No session needed.
        Scopes: none.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CodeRequest'
            example:
              email: camille.martin@ateliernord.fr
      responses:
        '202':
          description: The request is accepted; a code is on its way when a verified account uses the address.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodeSent'
              example:
                email: camille.martin@ateliernord.fr
                expiresAt: '2026-11-08T13:17:00Z'
                resendAvailableAt: '2026-11-08T13:07:30Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/CrossSiteRefused'
        '429':
          $ref: '#/components/responses/CodeThrottled'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/auth/sign-in/code/verification:
    post:
      operationId: signInWithCode
      summary: Sign in with a code
      description: |
        Checks a sign-in code. On success a session is opened and the gateway sets the session
        cookie. Same rules for the code as `POST /v1/auth/sign-up/verification`: single-use, 10
        minutes, a few wrong attempts. An address without an account answers like a wrong code.
        No session needed. Scopes: none.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CodeVerification'
            example:
              email: camille.martin@ateliernord.fr
              code: '482913'
              rememberMe: true
      responses:
        '200':
          $ref: '#/components/responses/SignedIn'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/CrossSiteRefused'
        '422':
          $ref: '#/components/responses/CodeRefused'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/auth/sign-out:
    post:
      operationId: signOut
      summary: Sign out of the current session
      description: |
        Closes the session of the cookie, on this browser only: the other sessions of the account
        stay open. Always clears the cookie and answers `204`, also when the session had already
        ended or no cookie came: signing out twice is not an error.

        The body is an empty JSON object: the cross-site check needs
        `Content-Type: application/json`. Scopes: none.
      tags: [auth]
      security:
        - sessionCookie: []
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignOutRequest'
            example: {}
      responses:
        '204':
          description: Signed out; the cookie is cleared.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/ClearSessionCookie'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/CrossSiteRefused'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/me:
    get:
      operationId: getCurrentUser
      summary: Read the current user
      description: |
        Returns the account of the session. No organization yet: memberships and the current
        organization come in a later version, as new members. Scopes: none.
      tags: [auth]
      responses:
        '200':
          description: The signed-in user.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
              example:
                id: 019a5f3c-8d2e-7c4a-9b1f-3e5d7a9c1b30
                name: Camille Martin
                email: camille.martin@ateliernord.fr
                language: fr
                version: 2
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-cw_session
      description: |
        Opaque session token, set by the gateway on sign-in with `Path=/; Secure; HttpOnly;
        SameSite=Lax` and checked with identity-service on every request. The web application sends
        it with `withCredentials` and never reads it.
  headers:
    SetSessionCookie:
      description: |
        `__Host-cw_session=<token>; Path=/; Secure; HttpOnly; SameSite=Lax`, plus
        `Max-Age=<seconds until session.expiresAt>` when `rememberMe` was `true`. Without it the
        cookie ends with the browser, and the session ends at `session.expiresAt` at the latest.
        Either session also ends after 12 hours of inactivity by default.
      schema:
        type: string
    ClearSessionCookie:
      description: '`__Host-cw_session=; Path=/; Secure; HttpOnly; SameSite=Lax; Max-Age=0`.'
      schema:
        type: string
    RetryAfter:
      description: Seconds to wait before the request can succeed (RFC 9110).
      schema:
        type: integer
        minimum: 1
    ETag:
      description: Version of the account, `"<version>"`.
      schema:
        type: string
  responses:
    SignedIn:
      description: Signed in. The body describes the session; the token itself is only in the cookie.
      headers:
        Set-Cookie:
          $ref: '#/components/headers/SetSessionCookie'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SignedIn'
          example:
            user:
              id: 019a5f3c-8d2e-7c4a-9b1f-3e5d7a9c1b30
              name: Camille Martin
              email: camille.martin@ateliernord.fr
              language: fr
              version: 2
            session:
              id: 019a6a2e-4b1c-7d3e-8f5a-2c9b7e1d4a60
              expiresAt: '2026-12-08T13:07:00Z'
    BadRequest:
      description: |
        The body does not match the schema: `request.invalid`, with one `details.issues` entry per
        failed member (`path` is the dotted path of the member, empty for the body itself).
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          example:
            type: about:blank
            title: Bad Request
            status: 400
            code: request.invalid
            details:
              issues:
                - in: body
                  path: email
                  code: invalid_format
                  message: Invalid email address
    EmailTaken:
      description: '`auth.email-taken`: a verified account already uses the address.'
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          example:
            type: about:blank
            title: Un compte existe déjà avec cette adresse.
            status: 409
            code: auth.email-taken
    SignUpRefused:
      description: |
        The sign-up is refused, and nothing is created:

        - `auth.terms-not-accepted`: `acceptTerms` is `false`;
        - `auth.password-too-short`: fewer than 12 characters;
        - `auth.password-compromised`: the password is in the list of compromised passwords.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          examples:
            termsNotAccepted:
              summary: Terms not accepted
              value:
                type: about:blank
                title: Acceptez les conditions pour créer votre compte.
                status: 422
                code: auth.terms-not-accepted
            passwordTooShort:
              summary: Password too short
              value:
                type: about:blank
                title: Le mot de passe doit compter 12 caractères minimum.
                status: 422
                code: auth.password-too-short
                details:
                  minLength: 12
            passwordCompromised:
              summary: Compromised password
              value:
                type: about:blank
                title: 'Ce mot de passe figure parmi des mots de passe divulgués : choisissez-en un autre.'
                status: 422
                code: auth.password-compromised
    CodeRefused:
      description: |
        The code is refused; the web application shows the same line for both codes:

        - `auth.code-invalid`: the code is wrong, or no account awaits a code at this address;
        - `auth.code-expired`: the code expired, was used, was replaced by a newer one, or took too
          many wrong attempts. A new code is needed.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          examples:
            codeInvalid:
              $ref: '#/components/examples/CodeInvalid'
            codeExpired:
              $ref: '#/components/examples/CodeExpired'
    SignUpVerificationRefused:
      description: |
        The verification of the sign-up is refused. The code is checked first:

        - `auth.code-invalid`: the code is wrong, or no account awaits a code at this address;
        - `auth.code-expired`: the code expired, was used, was replaced by a newer one, or took too
          many wrong attempts. A new code is needed. The web application shows the same line for
          both codes;
        - `auth.sign-up-replaced`, only with the right code: `password` differs from the password
          of the latest sign-up of the address, or is missing while the address was signed up
          more than once. The code stops working; the person signs up again.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          examples:
            codeInvalid:
              $ref: '#/components/examples/CodeInvalid'
            codeExpired:
              $ref: '#/components/examples/CodeExpired'
            signUpReplaced:
              summary: Another sign-up of the address
              value:
                type: about:blank
                title: 'Une autre inscription a été faite avec cette adresse : recommencez votre inscription.'
                status: 422
                code: auth.sign-up-replaced
    CredentialsRefused:
      description: |
        `auth.invalid-credentials`: the address or the password is wrong. `details.remainingAttempts`
        is the number of failures left before the lockout, at least 1. Answered the same way when no
        account uses the address.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          example:
            type: about:blank
            title: E-mail ou mot de passe incorrect.
            status: 422
            code: auth.invalid-credentials
            details:
              remainingAttempts: 3
    EmailNotVerified:
      description: |
        - `auth.email-not-verified`: the password is right but the address of the account is not
          verified yet. No code is sent: `POST /v1/auth/sign-up/code` sends one.
        - `auth.csrf-rejected`: see `CrossSiteRefused`.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          examples:
            emailNotVerified:
              summary: Address not verified
              value:
                type: about:blank
                title: Confirmez votre adresse e-mail pour vous connecter.
                status: 403
                code: auth.email-not-verified
            crossSiteRefused:
              summary: Request from another site
              value:
                type: about:blank
                title: Forbidden
                status: 403
                code: auth.csrf-rejected
    AccountLocked:
      description: |
        - `auth.account-locked`: too many failed passwords for the address; the password sign-in
          is refused until `details.lockedUntil` (15 minutes), even with the right password.
          Answered the same way when no account uses the address.
        - `rate-limit.exceeded`: the gateway's own limit.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          examples:
            accountLocked:
              summary: Account locked
              value:
                type: about:blank
                title: Trop de tentatives échouées.
                status: 429
                code: auth.account-locked
                details:
                  lockedUntil: '2026-11-08T13:22:00Z'
            rateLimited:
              $ref: '#/components/examples/RateLimited'
    CodeThrottled:
      description: |
        - `auth.code-throttled`: the code requests of this address are throttled whatever their
          purpose, account or not: a sign-up, `POST /v1/auth/sign-up/code` and
          `POST /v1/auth/sign-in/code` count together. A request is refused less than 30 seconds
          after the last accepted one, and once 5 were accepted in the current hour, which starts
          with the first request accepted after the previous hour ended.
          `details.resendAvailableAt` says when the next one can be: 30 seconds after the last
          accepted request, or the end of the hour.
        - `rate-limit.exceeded`: the gateway's own limit.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          examples:
            codeThrottled:
              summary: Code asked for less than 30 seconds ago
              value:
                type: about:blank
                title: 'Un code vient d’être envoyé : patientez avant d’en demander un nouveau.'
                status: 429
                code: auth.code-throttled
                details:
                  resendAvailableAt: '2026-11-08T13:07:30Z'
            hourlyCapReached:
              summary: Five codes asked for in the hour
              value:
                type: about:blank
                title: 'Un code vient d’être envoyé : patientez avant d’en demander un nouveau.'
                status: 429
                code: auth.code-throttled
                details:
                  resendAvailableAt: '2026-11-08T14:07:00Z'
            rateLimited:
              $ref: '#/components/examples/RateLimited'
    RateLimited:
      description: '`rate-limit.exceeded`: the gateway refuses more requests from this client for now.'
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          examples:
            rateLimited:
              $ref: '#/components/examples/RateLimited'
    Unauthenticated:
      description: |
        - `auth.session-required`: the request carries no session cookie;
        - `auth.session-expired`: the cookie names a session that ended (expired, revoked or
          unknown). The web application signs the person in again.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          examples:
            sessionRequired:
              summary: No session cookie
              value:
                type: about:blank
                title: Connectez-vous pour continuer.
                status: 401
                code: auth.session-required
            sessionExpired:
              summary: Session ended
              value:
                type: about:blank
                title: Session expirée
                status: 401
                code: auth.session-expired
    CrossSiteRefused:
      description: |
        `auth.csrf-rejected`: the `Origin` of the request is not an allowed origin, or its
        `Content-Type` is not `application/json`. Checked before the route runs, signed in or not.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          example:
            type: about:blank
            title: Forbidden
            status: 403
            code: auth.csrf-rejected
    Unavailable:
      description: |
        identity-service cannot answer: `upstream.unavailable`, `upstream.unreachable`,
        `upstream.timeout`, `upstream.circuit-open`, `upstream.failed`, `upstream.unauthorized` or
        `upstream.deadline-exceeded`, with `details.service`.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          example:
            type: about:blank
            title: Service Unavailable
            status: 503
            code: upstream.unavailable
            details:
              service: identity-service
  examples:
    CodeInvalid:
      summary: Wrong code
      value:
        type: about:blank
        title: 'Code incorrect ou expiré : vérifiez le dernier e-mail reçu.'
        status: 422
        code: auth.code-invalid
    CodeExpired:
      summary: Code no longer usable
      value:
        type: about:blank
        title: 'Code incorrect ou expiré : vérifiez le dernier e-mail reçu.'
        status: 422
        code: auth.code-expired
    RateLimited:
      summary: Gateway limit reached
      value:
        type: about:blank
        title: 'Trop de requêtes : réessayez dans un instant.'
        status: 429
        code: rate-limit.exceeded
  schemas:
    Email:
      type: string
      format: email
      maxLength: 254
      description: Email address, compared without regard to case.
      examples: [camille.martin@ateliernord.fr]
    Language:
      type: string
      description: BCP 47 language tag of the account, used for its emails. `fr` by default.
      examples: [fr]
    SignInMethodsRequest:
      type: object
      required: [email]
      properties:
        email:
          $ref: '#/components/schemas/Email'
    SignInMethods:
      type: object
      required: [methods]
      properties:
        methods:
          type: array
          description: Methods to offer, in the order to show them.
          items:
            $ref: '#/components/schemas/SignInMethod'
    SignInMethod:
      type: object
      required: [type]
      properties:
        type:
          type: string
          description: |
            `password`: `POST /v1/auth/sign-in`. `email-code`: `POST /v1/auth/sign-in/code`, then
            `POST /v1/auth/sign-in/code/verification`. Later versions add other types; a client
            ignores a type it does not know. The list grows without a new version, hence
            `x-extensible-enum` and not `enum`.
          x-extensible-enum: [password, email-code]
    SignUpRequest:
      type: object
      required: [name, email, password, acceptTerms]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
          description: |
            Full name, as typed; surrounding spaces are removed, and a name made only of spaces is
            refused with `400 request.invalid`.
          examples: [Camille Martin]
        email:
          $ref: '#/components/schemas/Email'
        password:
          $ref: '#/components/schemas/Password'
        acceptTerms:
          type: boolean
          description: |
            The person accepts the terms of use and the privacy policy. `false` answers
            `422 auth.terms-not-accepted`.
    Password:
      type: string
      maxLength: 256
      description: |
        At least 12 characters, no composition rule, not in the list of compromised passwords. The
        length is checked by identity-service (`422 auth.password-too-short`), not by the schema.
        Never logged.
    CodeRequest:
      type: object
      required: [email]
      properties:
        email:
          $ref: '#/components/schemas/Email'
    CodeSent:
      type: object
      required: [email, expiresAt, resendAvailableAt]
      description: Answered the same way whether or not a code was actually sent.
      properties:
        email:
          $ref: '#/components/schemas/Email'
        expiresAt:
          type: string
          format: date-time
          description: When a code sent now stops working, 10 minutes later.
        resendAvailableAt:
          type: string
          format: date-time
          description: |
            When another code can be asked for: 30 seconds later, or the end of the hour once 5
            codes were asked for the address in it (see `CodeThrottled`).
    SignUpVerification:
      type: object
      required: [email, code]
      description: |
        The code of a sign-up and the password that binds the verification to that sign-up. See
        `POST /v1/auth/sign-up/verification` for the order of the checks.
      properties:
        email:
          $ref: '#/components/schemas/Email'
        code:
          type: string
          pattern: '^[0-9]{6}$'
          description: The 6 digits of the email, without the space it is shown with. Never logged.
          examples: ['482913']
        rememberMe:
          type: boolean
          default: false
          description: Keep the session for 30 days ("Rester connecté pendant 30 jours").
        password:
          $ref: '#/components/schemas/Password'
          description: |
            The password typed in the sign-up form; the web application always sends it. Once the
            code is right, it is compared with the password of the latest sign-up of the address:
            a different one answers `422 auth.sign-up-replaced`. Required once the address was
            signed up more than once before the verification: without it the answer is the same.
            Never logged.
    CodeVerification:
      type: object
      required: [email, code]
      properties:
        email:
          $ref: '#/components/schemas/Email'
        code:
          type: string
          pattern: '^[0-9]{6}$'
          description: The 6 digits of the email, without the space it is shown with. Never logged.
          examples: ['482913']
        rememberMe:
          type: boolean
          default: false
          description: Keep the session for 30 days ("Rester connecté pendant 30 jours").
    PasswordSignIn:
      type: object
      required: [email, password]
      properties:
        email:
          $ref: '#/components/schemas/Email'
        password:
          type: string
          minLength: 1
          maxLength: 256
          description: Never logged.
        rememberMe:
          type: boolean
          default: false
          description: Keep the session for 30 days ("Rester connecté pendant 30 jours").
    SignOutRequest:
      type: object
      additionalProperties: false
      description: 'Empty object `{}`; it exists so that the request carries `Content-Type: application/json`.'
    SignedIn:
      type: object
      required: [user, session]
      properties:
        user:
          $ref: '#/components/schemas/CurrentUser'
        session:
          $ref: '#/components/schemas/Session'
    Session:
      type: object
      required: [id, expiresAt]
      properties:
        id:
          type: string
          format: uuid
          description: Id of the session; not its token.
        expiresAt:
          type: string
          format: date-time
          description: |
            When the session ends at the latest: 30 days after the sign-in with `rememberMe`. It
            also ends after 12 hours of inactivity by default.
    CurrentUser:
      type: object
      required: [id, name, email, language, version]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          description: Full name; the web application derives the initials from it.
          examples: [Camille Martin]
        email:
          $ref: '#/components/schemas/Email'
        language:
          $ref: '#/components/schemas/Language'
        version:
          type: integer
          minimum: 1
          description: Version of the account, also sent as `ETag`.
