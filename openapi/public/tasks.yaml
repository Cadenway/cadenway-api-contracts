      description: |
        Reads the current round on a task visible to the caller. Returns `current: null` for a
        milestone or a task without a round. An archived task keeps its approval readable.
        Reviewers who no longer have edit access are omitted from both the reviewer list and
        the outcome. A round without eligible reviewers is pending.
        Scope `tasks:read` for a personal API token.
      tags: [tasks]
      security:
        - sessionCookie: []
        - apiToken: [tasks:read]
      responses:
        '200':
          description: The current approval and task version.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskApprovalState'
              example:
                taskKey: CAD-482
                taskVersion: 12
                taskStatus: progress
                current: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/TasksReadForbidden'
        '404':
          $ref: '#/components/responses/TaskNotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/tasks/{taskKey}/approvals/request:
    parameters:
      - $ref: '#/components/parameters/TaskKey'
    post:
      operationId: requestTaskApproval
      summary: Start or replace the current task approval
      description: |
        An editor of the task starts a new round, replacing any current round and clearing its
        votes from the current state. Closed round history is retained with the task.
        The task must be ordinary and live. All requested reviewers, including the caller
        when designated, must currently have edit access. Invalid reviewers cause
        `422 approval.reviewer-invalid` without identifying them. The request keeps the task
        status unchanged. The task version, round and approval event commit together.
        Scope `tasks:write` for a personal API token.
      tags: [tasks]
      security:
        - sessionCookie: []
        - apiToken: [tasks:write]
      parameters:
        - $ref: '#/components/parameters/ApprovalIfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskApprovalRequest'
            example:
              reviewerUserIds: [019a5f3c-9e1f-7b2a-8c3d-4e5f6a7b8c31]
      responses:
        '200':
          description: The new current round and task version.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskApprovalState'
              example:
                taskKey: CAD-482
                taskVersion: 13
                taskStatus: progress
                current:
                  roundId: 019a7003-4d5e-7f6a-8b9c-0d1e2f3a4b01
                  requesterUserId: 019a5f3c-8d2e-7c4a-9b1f-3e5d7a9c1b30
                  requestedAt: '2026-11-08T10:40:00Z'
                  status: pending
                  reviewers:
                    - reviewerUserId: 019a5f3c-9e1f-7b2a-8c3d-4e5f6a7b8c31
                      decision: null
                      decidedAt: null
                      commentId: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/TasksWriteForbidden'
        '404':
          $ref: '#/components/responses/TaskNotFound'
        '409':
          $ref: '#/components/responses/ApprovalRoundConflict'
        '412':
          $ref: '#/components/responses/VersionMismatch'
        '422':
