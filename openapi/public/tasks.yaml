# Public routes of tasks: create a task in a list, with subtasks; read and change it in place
# (status, priority, dates, estimate, move, parent); its assignees, its labels, its subtasks, its
# checklist, its detail and its activity log; the filtered and sorted tasks of a list and their
# group counts; the labels; "Mes tâches" and the task part of "Accueil". Served by
# cadenway-api-gateway, which calls openapi/internal/task-service.yaml for each of them.
openapi: 3.1.0
info:
  title: Cadenway tasks
  version: 1.0.0
  description: |
    The tasks of the current organization. The API gateway serves these routes and answers them
    through task-service. Spaces are in `openapi/public/spaces.yaml`, lists and sprints in
    `openapi/public/lists.yaml`.

    **Keys.** A task is named by its key, `CAD-482`, in every path and every reference: the prefix
    of the space it was created in and a number that is never given again (see "Prefixes and keys"
    in `openapi/public/spaces.yaml`). The key never changes, also when the task moves to another
    space.

    **Who sees a task.** A task is seen by whoever sees its list (see "Access" in
    `openapi/public/spaces.yaml`); a task the caller does not see answers `404 task.not-found`, as
    an unknown key does, and is left out of every collection and every count. Who has `edit` on
    the list creates and changes its tasks; anyone else who sees it reads them and gets
    `403 access.role-insufficient` for those changes. A caller with `comment` may also create
    comments, edit or delete their own comments and change their own watcher override. A guest
    sees the tasks of the lists shared with them.

    **Archives.** Archiving a task archives its subtree, its subtasks at every level, whatever
    their status (`openapi/public/archives.yaml`). An archived task (`archivedAt`) is left out of
    every collection and count, "Mes tâches" and "Accueil" included, reads by its key with its
    detail and the tasks archived with it, and refuses every change with `409 task.archived`
    until it is restored. The tasks of an archived list are not archived: they read and change as
    before.

    **Trash.** Deleting a task moves it and its subtasks to the trash as one entry
    (`openapi/public/trash.yaml`). A task in the trash is left out of every collection and count;
    every route of its key answers `404 task.trashed`, with in `details` who deleted it, when, and
    when it is erased, to a caller who could change its list ("Cette tâche a été supprimée"), and
    `404 task.not-found` to anyone else. The tasks of a deleted list or space answer
    `404 task.not-found` until they reach the trash.

    **Statuses.** Any status may be chosen, from any other: the next status the web application
    proposes ("Passer à « En revue »") is a shortcut, not a rule, and every change request is
    applied (the web application waits for the last click of a burst itself). A status the space
    no longer uses is refused (`422 task.status-hidden`), unless the task already has it.
    `cancelled` needs a reason ("Annuler la tâche", "Motif d’annulation") and accepts a note
    (`422 task.cancel-reason-required`); leaving it clears both. Entering `done` sets
    `completedAt`; leaving it clears it. The status of a parent never changes its subtasks.

    **Subtasks.** A subtask is a task with a parent: 3 levels at most (task, subtask, sub-subtask)
    and 25 direct subtasks at most per task (`422 task.subtask-depth-exceeded`,
    `422 task.subtask-limit-reached`). A task and its subtasks are always in the same list: a new
    subtask takes the list of its parent, a task that moves takes its subtasks with it, a subtask
    attached to a parent moves to its list with its own subtasks, and a subtask moved to another
    list leaves its parent first.

    **Assignees and labels.** A task has 20 assignees at most, current members of the
    organization other than guests (`422 task.assignee-invalid`), and 20 labels at most. Each is
    added or removed alone, through its own route, so that two people who change them at once never
    overwrite each other; the creation of a task takes the first ones. A person who becomes a guest
    stays among the assignees they had.

    **Checklist.** A task holds at most 100 items ("Une checklist sert aux petites étapes sans
    statut ni assigné."), added and ticked or unticked; this version neither edits, reorders nor
    removes them. The checklist is not in the activity log.

    **Activity log.** task-service records the creation of a task and the changes of its status,
    priority, due date, assignees and comments, with who made them. Changes of the due date or the priority
    of a task by the same actor within 60 seconds merge into one entry, which disappears when the
    value is back to where it was. The name, the description, the labels, the estimate, the list,
    the parent and the checklist are not recorded, nor are archives, the trash and sharing.

    **Counts and dates.** Counters read the key `done` for "Terminées" and the progress of a
    sprint, and the categories `open` and `active` for the open work; a task is late when it is
    not closed and its due date is before the `today` of the request, the date of the caller in
    their time zone, which task-service does not know. Due dates and start dates are calendar
    dates; instants are UTC; estimates are whole minutes.

    **Limits.** A name of 1 to 300 characters, a description of 50,000 at most, 20 assignees, 20
    labels of 1 to 32 characters (two labels that differ only by case are one), 25 subtasks given
    at the creation, 100 checklist items of 300 characters. The requests are bounded by them; the
    responses state them in their descriptions, so that a later version may raise one.

    **Current organization, members, versions, creations, credentials, cross-site requests, rate
    limit and errors.** As in `openapi/public/spaces.yaml`: the current organization of the session
    or of the personal API token, task-service's own copy of the members, `ETag` and `If-Match`
    (required to change a description), an optional `Idempotency-Key` on a creation, the scopes
    `tasks:read` and `tasks:write`, 600 requests per minute, French titles for the codes the web
    application shows.

    **Time tracking and status history.** See `openapi/public/time.yaml`.

    **Custom fields.** Tasks and task summaries can include sparse values for active definitions
    of their current space. The list definitions route in `openapi/public/lists.yaml` supplies
    their stable IDs and display order. Existing filter and sort parameters keep their meanings.
    New tasks start without custom values, including copies, templates and recurring successors.

    **Later versions** add attachments and development links. The detail names their parts in
    `partial` when they cannot be read.
  contact:
    name: Cadenway
    url: https://github.com/Cadenway/cadenway-api-contracts
  license:
    name: Proprietary
    url: https://github.com/Cadenway/cadenway-api-contracts/blob/main/LICENSE
  x-consumers:
    - repository: cadenway-api-gateway
      uses: >-
        Serves every route through openapi/internal/task-service.yaml, composes task detail and
        checks scopes. Allows If-Organization-Match in CORS preflight and checks it against the
        verified organization before calling task-service for task detail or update.
    - repository: cadenway-webapp
      uses: >-
        Calls every route through @cadenway/api-client (list, board and Gantt views, "Créer une tâche",
        the task detail, "Mes tâches", "Accueil", first launch and "Bien démarrer"). Sends
        If-Organization-Match on task detail reads and edits tied to an organization already shown
        in the app, and reloads the organization context after organization.context-changed.
servers:
  - url: https://api.cadenway.com
    description: Production.
  - url: https://api.staging.cadenway.com
    description: Staging. The local stack of cadenway-ops serves the same routes on `api.<DOMAIN>`.
tags:
  - name: tasks
    description: Tasks, their subtasks and their checklist.
  - name: task-queries
    description: The tasks of a list, filtered, sorted and counted by group.
  - name: task-activity
    description: The activity log of a task.
  - name: my-tasks
    description: '"Mes tâches", the task part of "Accueil", and first-launch progress.'
paths:
  /v1/lists/{listId}/tasks:
    parameters:
      - $ref: '#/components/parameters/ListId'
    post:
      operationId: createTask
      summary: Create a task
      description: |
        Creates a task in a list the caller sees ("Créer la tâche", "Tâche CAD-495 créée", "Sprint
        14 · À faire · 2 sous-tâches."), with the next key of the space of the list, and, in the
        same transaction, the subtasks of `subtasks`, which take the keys that follow, the list and
        the first assignee of the task, the status `todo` and the priority `moyenne`.
        The caller's first creation through this route in their onboarding space also completes
        the first-task marker of `GET /v1/me/onboarding` in the same transaction.

        - `status` is `todo` by default; a status the space no longer uses answers
          `422 task.status-hidden`; `cancelled` needs `cancelReason`
          (`422 task.cancel-reason-required`), which no other status accepts
          (`422 task.cancel-reason-unexpected`).
        - `assigneeIds` are current members of the organization, guests excepted
          (`422 task.assignee-invalid`, with `details.userIds`).
        - `startDate` needs a `dueDate` and is on or before it (`422 task.start-date-invalid`).
        - It needs `edit` on the list (`403 access.role-insufficient`). An archived list takes the
          task, which stays out of the sidebar with it.

        Records a creation in the activity log of each task created. Emits `task.created.v1` for
        each task created, and `task.assigned.v1` for each of their assignees. Scope `tasks:write`
        for a personal API token.
        Optional checklist entries are created unchecked in order with fresh IDs. Structured
        description mentions, milestone constraints and recurrence follow TaskCreation; ineligible
        mentions return `422 mention.recipient-invalid`, invalid milestones return
        `422 milestone.status-invalid` or `422 milestone.dates-invalid`.
      tags: [tasks]
      security:
        - sessionCookie: []
        - apiToken: [tasks:write]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskCreation'
            example:
              name: Ajouter la connexion par lien magique
              description: null
              status: todo
              priority: haute
              assigneeIds: [019a5f3c-8d2e-7c4a-9b1f-3e5d7a9c1b30]
              dueDate: '2026-11-16'
              labels: [Auth, Front]
              subtasks:
                - name: Envoyer le lien par e-mail
                - name: Valider le lien à l’ouverture
      responses:
        '201':
          description: The task exists, with its subtasks.
          headers:
            Location:
              $ref: '#/components/headers/TaskLocation'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
              example:
                key: CAD-732
                name: Ajouter la connexion par lien magique
                description: null
                status: todo
                cancelReason: null
                cancelNote: null
                priority: haute
                assignees:
                  - userId: 019a5f3c-8d2e-7c4a-9b1f-3e5d7a9c1b30
                dueDate: '2026-11-16'
                startDate: null
                estimateMinutes: null
                labels: [Auth, Front]
                parentKey: null
                listId: 019a7001-2b3c-7d4e-8f5a-6b7c8d9e0f12
                spaceId: 019a7000-1a2b-7c3d-8e4f-5a6b7c8d9e01
                subtaskCounts: { total: 2, closed: 0 }
                checklist: []
                checklistCounts: { total: 0, done: 0 }
                completedAt: null
                createdAt: '2026-11-08T10:42:00Z'
                createdBy:
                  type: user
                  id: 019a5f3c-8d2e-7c4a-9b1f-3e5d7a9c1b30
                updatedAt: '2026-11-08T10:42:00Z'
                version: 1
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/TasksWriteForbidden'
        '404':
          $ref: '#/components/responses/ListNotFound'
        '409':
          $ref: '#/components/responses/RequestInProgress'
        '422':
          $ref: '#/components/responses/TaskCreationRefused'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
    get:
      operationId: listTasks
      summary: List the tasks of a list
      description: |
        Lists the tasks of a list the caller sees, filtered and sorted (views "Liste", "Tableau",
        "Gantt"); an archived list lists its tasks too. Values of one filter add up, filters narrow
        each other ("Statut est l’un de …"). `total` counts the tasks that match the filters, on
        every page ("12 sur 98 tâches"). Archived tasks and the tasks in the trash are left out.

        - `level`: `roots` (the default) keeps the top-level tasks, whose subtasks the web
          application reads under each of them with `GET /v1/tasks/{taskKey}/subtasks`
          ("Repliées sous leur parent", "Dépliées sous leur parent"); `all` keeps the subtasks too,
          as tasks ("À part, comme des tâches").
        - `assignee`: account ids, `me` for the caller and `none` for the tasks nobody is assigned
          ("Non assigné").
        - `search` ("Rechercher") finds the text in the name, the key and the labels, without regard
          to case or accents.
        - `dueFrom` and `dueTo` keep the tasks due on or after, on or before these dates; a task
          without a due date is then left out.
        - `sort`: `manual` ("Ordre manuel", the order of the list, which is the order of creation
          in this version), `dueDate` ("Échéance", the tasks without a due date always last),
          `priority` ("Priorité", from `urgente` to `basse`), `name` ("Nom", without regard to case
          or accents) or `createdAt` ("Date de création"); a leading `-` reverses the order
          ("Décroissant"). Ties follow the order of the list.

        Grouping is a filter: the web application reads the counts of the groups with
        `GET /v1/lists/{listId}/task-groups`, then the tasks of each group it shows with the value of
        the group added to the filters.

        Scope `tasks:read` for a personal API token.
        The optional milestone filter is part of the cursor fingerprint and grouped counts;
        omitting it preserves the existing filter. It does not change unfiltered totals.
      tags: [task-queries]
      security:
        - sessionCookie: []
        - apiToken: [tasks:read]
      parameters:
        - $ref: '../../components/task.yaml#/components/parameters/MilestoneFilter'
        - $ref: '#/components/parameters/StatusFilter'
        - $ref: '#/components/parameters/PriorityFilter'
        - $ref: '#/components/parameters/AssigneeFilter'
        - $ref: '#/components/parameters/LabelFilter'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/DueFrom'
        - $ref: '#/components/parameters/DueTo'
        - $ref: '#/components/parameters/Level'
        - $ref: '#/components/parameters/TaskSort'
        - $ref: '../../components/http.yaml#/components/parameters/Cursor'
        - $ref: '../../components/http.yaml#/components/parameters/Limit'
      responses:
        '200':
          description: One page of tasks.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskSummaryPage'
              example:
                items:
                  - key: CAD-482
                    name: Refondre l’écran de connexion SSO
                    status: progress
                    cancelReason: null
                    priority: haute
                    assignees:
                      - userId: 019a5f3c-8d2e-7c4a-9b1f-3e5d7a9c1b30
                      - userId: 019a5f3c-9e1f-7b2a-8c3d-4e5f6a7b8c31
                    dueDate: '2026-11-12'
                    startDate: '2026-11-11'
                    estimateMinutes: 480
                    labels: [Auth, Front]
                    parentKey: null
                    listId: 019a7001-2b3c-7d4e-8f5a-6b7c8d9e0f12
                    spaceId: 019a7000-1a2b-7c3d-8e4f-5a6b7c8d9e01
                    subtaskCounts: { total: 3, closed: 1 }
                    checklistCounts: { total: 3, done: 3 }
                    completedAt: null
                    createdAt: '2026-11-03T09:00:00Z'
                    version: 12
                nextCursor: null
                total: 1
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/TasksReadForbidden'
        '404':
          $ref: '#/components/responses/ListNotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/lists/{listId}/task-groups:
    parameters:
      - $ref: '#/components/parameters/ListId'
    get:
      operationId: countTaskGroups
      summary: Count the tasks of a list by group
      description: |
        Counts the tasks of a list that match the filters of `GET /v1/lists/{listId}/tasks`, by
        status, by priority or by assignee ("Grouper : statut"); `total` counts each task once.

        - `status`: one group per key, in the order of the workflow, those without a task
          included; the web application hides the statuses the space no longer uses and the empty
          groups it does not show.
        - `priority`: one group per priority, from `urgente` to `basse`, those without a task
          included.
        - `assignee`: one group per account assigned to at least one task, the most tasks first,
          then `none` for the tasks nobody is assigned ("Non assignées"), always last. A task with
          two assignees counts in both groups.

        Scope `tasks:read` for a personal API token.
        The optional milestone filter is part of the cursor fingerprint and grouped counts;
        omitting it preserves the existing filter. It does not change unfiltered totals.
      tags: [task-queries]
      security:
        - sessionCookie: []
        - apiToken: [tasks:read]
      parameters:
        - $ref: '../../components/task.yaml#/components/parameters/MilestoneFilter'
        - $ref: '#/components/parameters/GroupBy'
        - $ref: '#/components/parameters/StatusFilter'
        - $ref: '#/components/parameters/PriorityFilter'
        - $ref: '#/components/parameters/AssigneeFilter'
        - $ref: '#/components/parameters/LabelFilter'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/DueFrom'
        - $ref: '#/components/parameters/DueTo'
        - $ref: '#/components/parameters/Level'
        - $ref: '../../components/http.yaml#/components/parameters/Cursor'
        - $ref: '../../components/http.yaml#/components/parameters/Limit'
      responses:
        '200':
          description: One page of groups.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskGroupPage'
              example:
                groupBy: priority
                items:
                  - { value: urgente, count: 9 }
                  - { value: haute, count: 31 }
                  - { value: moyenne, count: 42 }
                  - { value: basse, count: 16 }
                nextCursor: null
                total: 98
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/TasksReadForbidden'
        '404':
          $ref: '#/components/responses/ListNotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/tasks/bulk-actions:
    post:
      operationId: executeBulkTaskAction
      summary: Apply an atomic bulk task action
      description: |
        Applies one explicit action to 1–50 distinct selected keys in a single tenant transaction.
        Resolve and authorize all keys and optional per-key expected versions, lock and recheck in
        stable order, then apply the action and write activity and outbox. A stale selected version
        answers `412 request.version-mismatch`; duplicate or ambiguous selections and more than 50
        keys answer `400 request.invalid`. The expansion limit is 1,000 affected task rows including
        subtrees, successors and copies (`422 bulk.expansion-limit-reached`). On any deterministic
        error nothing changes or emits; `details.key` identifies only an authorized visible task.
        Status, priority and explicit assign or unassign affect selected tasks, even selected
        descendants. Move and trash collapse selections already covered by selected ancestors;
        move carries the live subtree with immutable keys, detaching a moved subtask from its old
        parent and retaining statuses. Duplicate applies the single-task copy rule per selection.
        Existing task status, cancellation, milestone, recurrence, archive, tree and role rules
        apply. A destination that is invisible answers `404 list.not-found`, a visible but
        uneditable destination `403 access.role-insufficient`. The optional Idempotency-Key replays
        the recorded response for 24 hours, and conflicting or concurrent reuse has the standard
        `422 idempotency.key-reused` or `409 idempotency.request-in-progress` problem. Normal task
        creation, change and lifecycle facts are emitted, never partial facts.
        Scope `tasks:write` for a personal API token.
      tags: [tasks]
      security:
        - sessionCookie: []
        - apiToken: [tasks:write]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkTaskAction'
            example:
              selection:
                - { taskKey: CAD-482, version: 12 }
                - { taskKey: CAD-483, version: 3 }
              action: { type: status, status: done }
      responses:
        '200':
          description: The action committed for all selected tasks.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkTaskResult'
              example:
                results:
                  - { taskKey: CAD-482, version: 13 }
                  - { taskKey: CAD-483, version: 4 }
                affectedCount: 2
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/TasksWriteForbidden'
        '404':
          $ref: '#/components/responses/BulkTargetNotFound'
        '409':
          $ref: '#/components/responses/BulkConflict'
        '412':
          $ref: '#/components/responses/VersionMismatch'
        '422':
          $ref: '#/components/responses/BulkRefused'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/tasks/{taskKey}:
    parameters:
      - $ref: '#/components/parameters/TaskKey'
    get:
      operationId: getTask
      summary: Read a task
      description: |
        Returns a task the caller sees, with its description and its checklist; an archived task
        too, with `archivedAt` and `archivedBy`. A task in the trash answers `404 task.trashed`,
        with who deleted it and when, to a caller who could change its list (page "Tâche
        supprimée": "Restaurer la tâche", "Ouvrir la corbeille"), and `404 task.not-found` to
        anyone else. Scope `tasks:read` for a personal API token.
      tags: [tasks]
      security:
        - sessionCookie: []
        - apiToken: [tasks:read]
      responses:
        '200':
          description: The task.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
              examples:
                cad482:
                  $ref: '#/components/examples/Cad482'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/TasksReadForbidden'
        '404':
          $ref: '#/components/responses/TaskNotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
    patch:
      operationId: updateTask
      summary: Change a task
      description: |
        Applies a JSON Merge Patch to a task, every property edited in place: a member left out is
        unchanged, `null` clears what can be empty.

        - `status`: any status, from any other, but one the space no longer uses
          (`422 task.status-hidden`, unless the task already has it). `cancelled` needs
          `cancelReason` (`422 task.cancel-reason-required`) and takes `cancelNote`; on a cancelled
          task, they change alone; on a task that is not cancelled after the patch they answer
          `422 task.cancel-reason-unexpected`. Leaving `cancelled` clears them, entering `done` sets
          `completedAt` and leaving it clears it.
        - `dueDate`: when the task has a start date, a new due date moves the start by as many
          days and keeps the duration, unless the patch sets `startDate` too; removing the due date
          removes the start. `startDate` needs a due date and is on or before it
          (`422 task.start-date-invalid`).
        - `listId` ("Déplacer vers…", "CAD-482 déplacée", "Vers Bugs."): the task moves to the list,
          in this space or another, with its subtasks, and keeps its key; a subtask leaves its
          parent first. A list the caller does not see answers `422 task.list-invalid`.
        - `parentKey` ("Devenir sous-tâche de…", "CAD-490 rattachée à CAD-482"): the task becomes a
          subtask of a task the caller sees, and moves with its subtasks to the list of the parent.
          The parent may be neither the task nor one of its subtasks, nor unknown
          (`422 task.parent-invalid`); the task and its subtasks must fit within 3 levels under it
          (`422 task.subtask-depth-exceeded`), and the parent must have fewer than 25 subtasks
          (`422 task.subtask-limit-reached`). With `listId` in the same patch, it must be the list
          of the parent (`422 task.list-invalid`). `null` detaches it ("CAD-490 détachée", "C’est
          de nouveau une tâche de premier niveau."); it stays in its list.
        - The statuses a space no longer uses are those of the space the task is in after the
          patch: a move or an attachment keeps the status the task has, even one the new space no
          longer uses, while a new `status` in the same patch must be used by the new space.
        - `customFieldValues`: set or clear values by active definition ID. A move to another
          space removes incompatible values from the moved tasks in the same transaction. IDs in
          this patch must belong to the resulting space and values must match their definitions
          (`422 custom-field.value-invalid`). A null entry clears that value. Other entries remain
          unchanged for a task that stays in its space. No custom values are copied to a successor.
        - `If-Match` is optional (`412 request.version-mismatch`), but required to change
          `description`, a long text: without it, `400 request.invalid` with an issue on the
          header.
        - `If-Organization-Match` optionally pins the change to the caller's expected organization.
          The gateway checks it before forwarding the change. `If-Match` still checks the task
          version within the verified organization.
        - It needs `edit` on the list of the task, and on the list it moves to
          (`403 access.role-insufficient`). An archived task answers `409 task.archived`, and so
          does an archived parent, `details.key` naming the archived task.

        Records the changes of status, priority and due date in the activity log. Emits
        `task.updated.v1` when something changed, with `changed`, and also
        `task.status-changed.v1` for a new status; a move emits `task.updated.v1` for each subtask
        that moves too. An updated task's event can name `customFieldValues` in `changed`;
        the event never carries the custom values themselves.
        A patch that changes nothing answers `200` with the same version and emits
        nothing. Scope `tasks:write` for a personal API token.
        Description mentions require If-Match, including spans-only changes. Replacing text clears
        old spans unless replacements are supplied. Milestone conversion and recurrence follow
        the shared TaskPatch rules. Entering done with a due date creates at most one root successor
        in the same list, atomically with resetting recurrence to none, the link and the outbox.
        Cancellation, an undated completion, a repeated done, creation in done and restore create
        none. A source that has already spawned cannot be rearmed (`409 recurrence.already-spawned`).
        Unrepresentable dates answer `422 recurrence.date-out-of-range`. A successor copies the
        title, Markdown, priority, labels, eligible assignees, ordinary estimate, milestone and
        unchecked checklist, with a fresh key and todo status. It excludes children, parent,
        mentions, comments, watcher overrides, dependencies and completion metadata. Start dates
        move by the due-date delta and milestones retain date alignment. Monthly cadence retains
        the original day across short months. Fresh watcher defaults apply. A live existing task
        entering done as a milestone emits milestone.reached.v1, including when the same patch
        adds the flag. Creation in done, restore, cancellation, repeated done and adding the flag
        to an already-done task do not; a later genuine transition into done can emit it again.
      tags: [tasks]
      security:
        - sessionCookie: []
        - apiToken: [tasks:write]
      parameters:
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IfOrganizationMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskPatch'
            examples:
              status:
                summary: Pass to "En revue"
                value:
                  status: review
              cancel:
                summary: Cancel as a duplicate ("Annuler CAD-457 ?")
                value:
                  status: cancelled
                  cancelReason: duplicate
                  cancelNote: Par exemple remplacée par CAD-482
              move:
                summary: Move to the list "Bugs"
                value:
                  listId: 019a7001-2b3c-7d4e-8f5a-6b7c8d9e0f13
              attach:
                summary: Make it a subtask of CAD-482
                value:
                  parentKey: CAD-482
      responses:
        '200':
          description: The task after the change.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
              examples:
                cad482:
                  $ref: '#/components/examples/Cad482'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/TasksWriteForbidden'
        '404':
          $ref: '#/components/responses/TaskNotFound'
        '409':
          $ref: '#/components/responses/TaskRecurrenceConflict'
        '412':
          $ref: '#/components/responses/TaskUpdatePreconditionFailed'
        '422':
          $ref: '#/components/responses/TaskChangeRefused'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/tasks/{taskKey}/duplicate:
    parameters:
      - $ref: '#/components/parameters/TaskKey'
    post:
      operationId: duplicateTask
      x-cadenway-strict-empty: true
      summary: Duplicate a task
      description: |
        Duplicates one live task in its own list with ` (copie)` appended, truncating the source
        portion to fit the existing name limit. It allocates a fresh task key and timestamps and
        fresh checklist IDs, preserving checklist ticks, milestone, supported status and valid
        cancellation reason and note. It keeps a live parent when tree depth and capacity permit;
        a full parent answers `422 task.subtask-limit-reached`. It copies currently assignable
        users and Markdown as text, without mention spans, children, comments, watcher overrides,
        dependencies, recurrence, files, time or approvals. A copy in done gets its own completedAt.
        Requires edit on the list; an archived task refuses changes. If-Match checks the source
        task version. An optional Idempotency-Key replays the original 201 and Location for 24
        hours; changed payload and concurrent replay use the standard idempotency problems. Emits
        the ordinary task creation and assignment facts in the creation transaction.
        Scope `tasks:write` for a personal API token.
