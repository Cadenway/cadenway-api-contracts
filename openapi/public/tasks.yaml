        with an issue `{ in: header, path: If-Match, code: required }`.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          example:
            type: about:blank
            title: Bad Request
            status: 400
            code: request.invalid
            details:
              issues:
                - in: header
                  path: If-Match
                  code: required
                  message: Required to change the description
    Unauthenticated:
      description: |
        - `auth.session-required`: the request carries neither a session cookie nor a bearer token;
        - `auth.session-expired`: the cookie names a session that ended;
        - `auth.api-token-invalid`: the bearer token is unknown, revoked or expired, or its user
          no longer belongs to its organization.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          examples:
            sessionRequired:
              summary: No credential
              value:
                type: about:blank
                title: Connectez-vous pour continuer.
                status: 401
                code: auth.session-required
            sessionExpired:
              summary: Session ended
              value:
                type: about:blank
                title: Session expirée
                status: 401
                code: auth.session-expired
            apiTokenInvalid:
              summary: Personal API token no longer valid
              value:
                type: about:blank
                title: Jeton d’API invalide, expiré ou révoqué.
                status: 401
                code: auth.api-token-invalid
    TasksReadForbidden:
      description: |
        - `auth.scope-missing`: the personal API token lacks `tasks:read`; `details.requiredScopes`
          lists what the route needs;
        - `organization.not-selected`: the session has no current organization;
        - `organization.mfa-required`: the authentication policy of the organization requires
          two-step verification for the role of the caller, who has none; `details.organizationId`
          names it.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          examples:
            scopeMissing:
              $ref: '#/components/examples/ScopeMissingRead'
            organizationNotSelected:
              $ref: '#/components/examples/OrganizationNotSelected'
            organizationMfaRequired:
              $ref: '#/components/examples/OrganizationMfaRequired'
    TasksWriteForbidden:
      description: |
        - `access.role-insufficient`: the caller sees the list of the task, or the list a move
          goes to, without `edit` on it; `details.role` is their role there, `details.requiredRole`
          is `edit`;
        - `auth.scope-missing`: the personal API token lacks `tasks:write`;
        - `organization.not-selected`, `organization.mfa-required`: see `TasksReadForbidden`;
        - `auth.csrf-rejected`: the `Origin` or the `Content-Type` of the request is refused.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          examples:
            roleInsufficient:
              $ref: '#/components/examples/RoleInsufficient'
            scopeMissing:
              $ref: '#/components/examples/ScopeMissingWrite'
            organizationNotSelected:
              $ref: '#/components/examples/OrganizationNotSelected'
            organizationMfaRequired:
              $ref: '#/components/examples/OrganizationMfaRequired'
            crossSiteRefused:
              $ref: '#/components/examples/CrossSiteRefused'
    OrganizationNotFound:
      description: |
        `organization.not-found`: the caller no longer belongs to the current organization, or, for a
        few seconds after they joined it, task-service does not know them yet.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          example:
            type: about:blank
            title: Organisation introuvable.
            status: 404
            code: organization.not-found
    ListNotFound:
      description: |
        - `list.not-found`: no list with this id that the caller sees;
        - `organization.not-found`: see `OrganizationNotFound`.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          example:
            type: about:blank
            title: Liste introuvable.
            status: 404
            code: list.not-found
    ApprovalVoteForbidden:
      description: |
        - `approval.reviewer-required` applies when an editor was omitted from the round.
        - `access.role-insufficient` applies when the actor has a list role below `edit`.
        - See `TasksWriteForbidden` for `auth.scope-missing`, `auth.csrf-rejected`,
          `organization.not-selected` and `organization.mfa-required`.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          examples:
            reviewerRequired:
              value:
                type: about:blank
                title: 'Vous ne faites pas partie des personnes chargées de l’approbation.'
                status: 403
                code: approval.reviewer-required
            RoleInsufficient:
              $ref: '#/components/examples/RoleInsufficient'
            ScopeMissingWrite:
              $ref: '#/components/examples/ScopeMissingWrite'
            CrossSiteRefused:
              $ref: '#/components/examples/CrossSiteRefused'
    ApprovalRoundNotFound:
      description: |
        - `approval.round-not-found` applies when the supplied ID differs from the current round or the task has no round.
        - See `TaskNotFound` for `task.not-found`, `task.trashed` and `organization.not-found`.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          examples:
            roundNotFound:
              value:
                type: about:blank
                title: 'Cette demande d’approbation est introuvable.'
                status: 404
                code: approval.round-not-found
            taskNotFound:
              value:
                type: about:blank
                title: 'Tâche introuvable.'
                status: 404
                code: task.not-found
    ApprovalRoundConflict:
      description: |
        - An archived task returns `task.archived`.
        - A milestone returns `approval.milestone-unsupported`.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          examples:
            TaskArchived:
              $ref: '#/components/examples/TaskArchived'
            milestoneUnsupported:
              value:
                type: about:blank
                title: 'Un jalon ne peut pas être soumis à approbation.'
                status: 409
                code: approval.milestone-unsupported
    ApprovalVoteConflict:
      description: |
        - An archived task returns `task.archived`.
        - A milestone returns `approval.milestone-unsupported`.
        - An existing vote returns `approval.vote-already-recorded`. Withdraw it before casting another.
        - The automated completion returns `recurrence.already-spawned` if it would repeat an occurrence.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          examples:
            TaskArchived:
              $ref: '#/components/examples/TaskArchived'
            milestoneUnsupported:
              value:
                type: about:blank
                title: 'Un jalon ne peut pas être soumis à approbation.'
                status: 409
                code: approval.milestone-unsupported
            alreadyVoted:
              value:
                type: about:blank
                title: 'Retirez votre vote avant d’en soumettre un autre.'
                status: 409
                code: approval.vote-already-recorded
            alreadySpawned:
              value:
                type: about:blank
                title: Cette récurrence a déjà créé une occurrence.
                status: 409
                code: recurrence.already-spawned
    ApprovalReviewersRefused:
      description: |
        A requested reviewer without edit access causes `approval.reviewer-invalid`.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          examples:
            reviewerInvalid:
              value:
                type: about:blank
                title: 'Une personne choisie ne peut pas modifier cette tâche.'
                status: 422
                code: approval.reviewer-invalid
    ApprovalTransitionRefused:
      description: |
        - `task.status-hidden` applies if the automatic status is unavailable in the task's space.
        - `task.subtask-limit-reached` applies if the recurrence successor would exceed the parent capacity.
        - `recurrence.date-out-of-range` applies if the successor dates are out of range.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          examples:
            StatusHidden:
              $ref: '#/components/examples/StatusHidden'
            SubtaskLimitReached:
              $ref: '#/components/examples/SubtaskLimitReached'
            RecurrenceDateOutOfRange:
              $ref: '#/components/examples/RecurrenceDateOutOfRange'
    TaskNotFound:
      description: |
        - `task.not-found`: no task with this key that the caller sees, or a task in the trash
          that the caller could not change;
        - `task.trashed`: the task is in the trash and the caller could change its list ("Tâche
          supprimée"). `details.key` and `details.name` name the task, `details.entryId` is the
          trash entry it belongs to (`POST /v1/trash/entries/{entryId}/restore`),
          `details.rootKey` the root of that entry, `details.trashedAt` and `details.trashedBy`
          (an `Actor`) say when and by whom it was deleted, `details.purgeAt` when it is erased
          ("Elle reste 30 jours dans la corbeille avant d’être effacée.");
        - `organization.not-found`: see `OrganizationNotFound`.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          examples:
            taskNotFound:
              summary: No task the caller sees
              value:
                type: about:blank
                title: Tâche introuvable.
                status: 404
                code: task.not-found
            taskTrashed:
              summary: CAD-452 in the trash, read by someone who could change Sprint 14
              value:
                type: about:blank
                title: Cette tâche a été supprimée
                status: 404
                code: task.trashed
                details:
                  key: CAD-452
                  name: Ancien écran de connexion
                  entryId: 019a7006-7a8b-7c9d-8e0f-1a2b3c4d5e01
                  rootKey: CAD-452
                  trashedAt: '2026-11-06T16:20:00Z'
                  trashedBy:
                    type: user
                    id: 019a5f3c-8d2e-7c4a-9b1f-3e5d7a9c1b30
                  purgeAt: '2026-12-06T16:20:00Z'
    ChecklistItemNotFound:
      description: |
        - `checklist-item.not-found`: the task has no item with this id;
        - `task.not-found`, `task.trashed`, `organization.not-found`: see `TaskNotFound`.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          example:
            type: about:blank
            title: Élément de checklist introuvable.
            status: 404
            code: checklist-item.not-found
    RequestInProgress:
      description: '`idempotency.request-in-progress`: a request with the same `Idempotency-Key` still runs.'
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          example:
            type: about:blank
            title: Conflict
            status: 409
            code: idempotency.request-in-progress
    TaskArchived:
      description: |
        `task.archived`: the task is archived, or the parent the patch names is; `details.key`
        names the archived task. It changes again once restored
        (`POST /v1/tasks/{taskKey}/unarchive`, `openapi/public/archives.yaml`).
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          examples:
            taskArchived:
              $ref: '#/components/examples/TaskArchived'
    SubtaskCreationConflict:
      description: |
        - `task.archived`: the parent is archived; `details.key` names it;
        - `idempotency.request-in-progress`: a request with the same `Idempotency-Key` still runs.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          examples:
            taskArchived:
              $ref: '#/components/examples/TaskArchived'
            requestInProgress:
              summary: The first request with this key still runs
              value:
                type: about:blank
                title: Conflict
                status: 409
                code: idempotency.request-in-progress
    ChecklistItemConflict:
      description: |
        - `task.archived`: the task is archived; `details.key` names it;
        - `idempotency.request-in-progress`: a request with the same `Idempotency-Key` still runs.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          examples:
            taskArchived:
              $ref: '#/components/examples/TaskArchived'
            requestInProgress:
              summary: The first request with this key still runs
              value:
                type: about:blank
                title: Conflict
                status: 409
                code: idempotency.request-in-progress
    TaskCreationRefused:
      description: |
        - `task.status-hidden`: the space of the list no longer uses the status; `details.status`
          names it;
        - `task.cancel-reason-required`: the status `cancelled` without `cancelReason`;
        - `task.cancel-reason-unexpected`: `cancelReason` or `cancelNote` with another status;
        - `task.assignee-invalid`: an assignee is not a current member of the organization, or is a
          guest; `details.userIds` lists them;
        - `task.start-date-invalid`: `startDate` without `dueDate`, or after it;
        - `idempotency.key-reused`: the `Idempotency-Key` was sent before with another body;
        - `mention.recipient-invalid`: a description mention recipient is ineligible;
        - `milestone.status-invalid`: the final milestone status is invalid;
        - `milestone.dates-invalid`: the final milestone dates or estimate are invalid.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          examples:
            mentionRecipientInvalid:
              $ref: '#/components/examples/MentionRecipientInvalid'
            milestoneStatusInvalid:
              $ref: '#/components/examples/MilestoneStatusInvalid'
            milestoneDatesInvalid:
              $ref: '#/components/examples/MilestoneDatesInvalid'
            statusHidden:
              $ref: '#/components/examples/StatusHidden'
            cancelReasonRequired:
              $ref: '#/components/examples/CancelReasonRequired'
            cancelReasonUnexpected:
              $ref: '#/components/examples/CancelReasonUnexpected'
            assigneeInvalid:
              $ref: '#/components/examples/AssigneeInvalid'
            startDateInvalid:
              $ref: '#/components/examples/StartDateInvalid'
            idempotencyKeyReused:
              $ref: '#/components/examples/IdempotencyKeyReused'
    SubtaskCreationRefused:
      description: |
        - `task.subtask-depth-exceeded`: the parent is at the third level;
        - `task.subtask-limit-reached`: the parent has 25 subtasks;
        - `task.status-hidden`, `task.cancel-reason-required`, `task.cancel-reason-unexpected`,
          `task.assignee-invalid`, `task.start-date-invalid`, `idempotency.key-reused`: see
          `TaskCreationRefused`.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          examples:
            subtaskDepthExceeded:
              $ref: '#/components/examples/SubtaskDepthExceeded'
            subtaskLimitReached:
              $ref: '#/components/examples/SubtaskLimitReached'
            statusHidden:
              $ref: '#/components/examples/StatusHidden'
            assigneeInvalid:
              $ref: '#/components/examples/AssigneeInvalid'
            idempotencyKeyReused:
              $ref: '#/components/examples/IdempotencyKeyReused'
    TaskChangeRefused:
      description: |
        - `task.status-hidden`: the space no longer uses the status, which the task does not have;
          `details.status` names it;
        - `task.cancel-reason-required`: the task becomes or stays `cancelled` without a reason;
        - `task.cancel-reason-unexpected`: `cancelReason` or `cancelNote` for a task that is not
          `cancelled` after the patch;
        - `task.start-date-invalid`: a start date without a due date, or after it;
        - `task.list-invalid`: the list does not exist or the caller does not see it, or is not the
          list of the new parent;
        - `task.parent-invalid`: the parent is unknown, not seen, the task itself or one of its
          subtasks; `details.parentKey` repeats it;
        - `task.subtask-depth-exceeded`: the task and its subtasks would go beyond 3 levels;
        - `task.subtask-limit-reached`: the parent has 25 subtasks;
        - `mention.recipient-invalid`: a description mention recipient is ineligible;
        - `milestone.status-invalid`: the final milestone status is invalid;
        - `milestone.dates-invalid`: the final milestone dates or estimate are invalid;
        - `recurrence.date-out-of-range`: the successor date cannot be represented;
        - `custom-field.value-invalid`: a field is absent, retired or outside the resulting space,
          the value has the wrong type or the designated sprint points value is negative.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          examples:
            invalidCustomFieldValue:
              value:
                type: about:blank
                title: Valeur de champ personnalisé invalide.
                status: 422
                code: custom-field.value-invalid
            mentionRecipientInvalid:
              $ref: '#/components/examples/MentionRecipientInvalid'
            milestoneStatusInvalid:
              $ref: '#/components/examples/MilestoneStatusInvalid'
            milestoneDatesInvalid:
              $ref: '#/components/examples/MilestoneDatesInvalid'
            recurrenceDateOutOfRange:
              $ref: '#/components/examples/RecurrenceDateOutOfRange'
            statusHidden:
              $ref: '#/components/examples/StatusHidden'
            cancelReasonRequired:
              $ref: '#/components/examples/CancelReasonRequired'
            cancelReasonUnexpected:
              $ref: '#/components/examples/CancelReasonUnexpected'
            startDateInvalid:
              $ref: '#/components/examples/StartDateInvalid'
            listInvalid:
              $ref: '#/components/examples/ListInvalid'
            parentInvalid:
              $ref: '#/components/examples/ParentInvalid'
            subtaskDepthExceeded:
              $ref: '#/components/examples/SubtaskDepthExceeded'
            subtaskLimitReached:
              $ref: '#/components/examples/SubtaskLimitReached'
    AssigneeRefused:
      description: |
        - `task.assignee-invalid`: the person is not a current member of the organization, or is a
          guest; `details.userIds` names them;
        - `task.assignee-limit-reached`: the task has 20 assignees.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          examples:
            assigneeInvalid:
              $ref: '#/components/examples/AssigneeInvalid'
            assigneeLimitReached:
              summary: 20 assignees already
              value:
                type: about:blank
                title: 20 personnes au plus par tâche.
                status: 422
                code: task.assignee-limit-reached
    LabelLimitReached:
      description: '`task.label-limit-reached`: the task has 20 labels.'
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          example:
            type: about:blank
            title: 20 étiquettes au plus par tâche.
            status: 422
            code: task.label-limit-reached
    ChecklistItemRefused:
      description: |
        - `task.checklist-limit-reached`: the checklist holds 100 items;
        - `idempotency.key-reused`: the `Idempotency-Key` was sent before with another body.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          examples:
            checklistLimitReached:
              summary: 100 items already
              value:
                type: about:blank
                title: 100 éléments au plus par checklist.
                status: 422
                code: task.checklist-limit-reached
            idempotencyKeyReused:
              $ref: '#/components/examples/IdempotencyKeyReused'
    VersionMismatch:
      description: '`request.version-mismatch`: `If-Match` is not the current version of the task; `details.version` is.'
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          example:
            type: about:blank
            title: 'Ces informations ont été modifiées entre-temps : rechargez la page.'
            status: 412
            code: request.version-mismatch
            details:
              version: 13
    OrganizationContextChanged:
      description: |
        `organization.context-changed`: `If-Organization-Match` differs from the organization
        verified for this request. The problem omits `details` and gives no information about the
        organizations or the task.
      headers:
        Cache-Control:
          $ref: '#/components/headers/TaskDetailNoStore'
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          examples:
            organizationContextChanged:
              $ref: '#/components/examples/OrganizationContextChanged'
    TaskUpdatePreconditionFailed:
      description: |
        - `organization.context-changed`: `If-Organization-Match` differs from the organization
          verified for this request. The problem omits `details` and gives no information about
          the organizations or the task. The response has `Cache-Control: private, no-store`.
        - `request.version-mismatch`: `If-Match` differs from the current task version, given in
          `details.version`.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          examples:
            organizationContextChanged:
              $ref: '#/components/examples/OrganizationContextChanged'
            versionMismatch:
              value:
                type: about:blank
                title: 'Ces informations ont été modifiées entre-temps : rechargez la page.'
                status: 412
                code: request.version-mismatch
                details:
                  version: 13
    RateLimited:
      description: '`rate-limit.exceeded`: the gateway refuses more requests from this session or token for now.'
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          examples:
            rateLimited:
              $ref: '#/components/examples/RateLimited'
    Unavailable:
      description: |
        task-service cannot answer: `upstream.unavailable`, `upstream.unreachable`,
        `upstream.timeout`, `upstream.circuit-open`, `upstream.failed`, `upstream.unauthorized` or
        `upstream.deadline-exceeded`, with `details.service`.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          example:
            type: about:blank
            title: Service Unavailable
            status: 503
            code: upstream.unavailable
            details:
              service: task-service
  schemas:
