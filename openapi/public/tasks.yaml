  /v1/tasks/{taskKey}/approvals/{roundId}/votes/me:
    parameters:
      - $ref: '#/components/parameters/TaskKey'
      - $ref: '#/components/parameters/ApprovalRoundId'
    put:
      operationId: voteOnTaskApproval
      summary: Cast the caller's approval vote
      description: |
        The caller must be a designated reviewer of this current round and still have edit
        access. Withdraw a recorded vote before casting another. A change request creates
        a task comment with the supplied reason and moves the task to `progress`.
        When the last pending eligible reviewer approves and every eligible vote approves,
        the task moves to `done`. A refused status change leaves the vote, task, comment and
        events untouched. The normal task status, activity and recurrence rules apply.
        Scope `tasks:write` for a personal API token.
      tags: [tasks]
      security:
        - sessionCookie: []
        - apiToken: [tasks:write]
      parameters:
        - $ref: '#/components/parameters/ApprovalIfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskApprovalVote'
            example:
              decision: changes-requested
              reason: Merci de vérifier le parcours de connexion.
      responses:
        '200':
          description: The recorded decision and resulting task version.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskApprovalState'
              example:
                taskKey: CAD-482
                taskVersion: 14
                taskStatus: progress
                current:
                  roundId: 019a7003-4d5e-7f6a-8b9c-0d1e2f3a4b01
                  requesterUserId: 019a5f3c-8d2e-7c4a-9b1f-3e5d7a9c1b30
                  requestedAt: '2026-11-08T10:40:00Z'
                  status: changes-requested
                  reviewers:
                    - reviewerUserId: 019a5f3c-9e1f-7b2a-8c3d-4e5f6a7b8c31
                      decision: changes-requested
                      decidedAt: '2026-11-08T10:50:00Z'
                      commentId: 019a7003-4d5e-7f6a-8b9c-0d1e2f3a4b02
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ApprovalVoteForbidden'
        '404':
          $ref: '#/components/responses/ApprovalRoundNotFound'
        '409':
          $ref: '#/components/responses/ApprovalVoteConflict'
        '412':
          $ref: '#/components/responses/VersionMismatch'
        '422':
          $ref: '#/components/responses/ApprovalTransitionRefused'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
    delete:
      operationId: withdrawTaskApprovalVote
      summary: Withdraw the caller's approval vote
      description: |
        The caller must be a designated reviewer of this current round and still have edit
        access. Withdrawing a vote leaves the task status and any earlier comment unchanged.
        The round is recomputed from the remaining eligible votes. When the caller has no
        recorded vote, the request succeeds without a change to the task version or events.
        Scope `tasks:write` for a personal API token.
      tags: [tasks]
      security:
        - sessionCookie: []
        - apiToken: [tasks:write]
      parameters:
        - $ref: '#/components/parameters/ApprovalIfMatch'
      responses:
        '204':
          description: The caller has no recorded vote. A successful withdrawal changes the task version.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ApprovalVoteForbidden'
        '404':
          $ref: '#/components/responses/ApprovalRoundNotFound'
        '409':
          $ref: '#/components/responses/ApprovalRoundConflict'
        '412':
          $ref: '#/components/responses/VersionMismatch'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/tasks/{taskKey}/comments:
    parameters:
      - $ref: '#/components/parameters/TaskKey'
    get:
      operationId: listTaskComments
      summary: List task comments
      description: |
        Lists live comments oldest first by `(createdAt,id)`, with a total excluding deleted comments.
        The cursor is opaque and bound to the task and ordering. Anyone who sees the task may read.
        Scope `tasks:read` for a personal API token.
      tags: [tasks]
      security:
        - sessionCookie: []
        - apiToken: [tasks:read]
      parameters:
        - $ref: '../../components/http.yaml#/components/parameters/Cursor'
        - $ref: '../../components/http.yaml#/components/parameters/Limit'
      responses:
        '200':
          description: The requested resource or page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/TasksReadForbidden'
        '404':
          $ref: '#/components/responses/TaskNotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
    post:
      operationId: createTaskComment
      summary: Create a task comment
      description: |
        Check the caller's comment or edit role before validating recipients; a caller below the
        required role receives `403 access.role-insufficient` before `422 mention.recipient-invalid`.
        A current member, including a guest, with read access to the list is eligible. Mention spans
        are Unicode code-point offsets into unchanged Markdown and are validated for range,
        overlap and a displayed token beginning with `@`; invalid spans answer `400 request.invalid`.
        Unmarked text is not a mention.
        Ineligible recipients answer `422 mention.recipient-invalid` without identifying them.
        A `comment` or `edit` role may post. A reply must name a live comment on the same task;
        otherwise `404 comment.not-found`. Replies are flat. The optional Idempotency-Key records
        the response and Location for 24 hours; replay has no second effect. The comment and task
        version, activity and outbox change in the same transaction.
        Scope `tasks:write` for a personal API token.
      tags: [tasks]
      security:
        - sessionCookie: []
        - apiToken: [tasks:write]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommentCreation'
            example:
              body: '@Camille Martin, la maquette est prête.'
              mentions:
                - userId: 019a5f3c-8d2e-7c4a-9b1f-3e5d7a9c1b30
                  start: 0
                  end: 15
      responses:
        '201':
          description: Created comment.
          headers:
            ETag:
              description: The comment version.
              schema:
                type: string
            Location:
              description: The public path of the created comment.
              schema:
                type: string
                examples: ['/v1/tasks/CAD-482/comments/019a7003-4d5e-7f6a-8b9c-0d1e2f3a4b01']
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
              example:
