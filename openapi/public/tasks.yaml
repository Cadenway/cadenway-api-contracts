          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/TasksReadForbidden'
        '404':
          $ref: '#/components/responses/TaskNotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/labels:
    get:
      operationId: listLabels
      summary: List the labels
      description: |
        Lists the labels of the tasks the caller sees, archived tasks and the trash left out, for
        the picker ("Étiquettes"), in alphabetical order without regard to case or accents. Two
        spellings of one label that differ only by case are listed once, in the spelling that
        comes first in that order. `search` keeps the labels that contain the text, without regard
        to case or accents.

        Scope `tasks:read` for a personal API token.
      tags: [tasks]
      security:
        - sessionCookie: []
        - apiToken: [tasks:read]
      parameters:
        - $ref: '#/components/parameters/Search'
        - $ref: '../../components/http.yaml#/components/parameters/Cursor'
        - $ref: '../../components/http.yaml#/components/parameters/Limit'
      responses:
        '200':
          description: One page of labels.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LabelPage'
              example:
                items:
                  - name: Auth
                  - name: Back
                  - name: Bug
                  - name: Contenu
                  - name: Design
                  - name: Docs
                  - name: Facturation
                  - name: Front
                  - name: Recherche
                  - name: Sécurité
                nextCursor: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/TasksReadForbidden'
        '404':
          $ref: '#/components/responses/OrganizationNotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/me/tasks:
    get:
      operationId: listMyTasks
      summary: List the tasks of the caller
      description: |
        Lists the tasks assigned to the caller in every space they see, subtasks included ("Mes
        tâches", "Toutes les tâches qui vous sont assignées, tous espaces confondus."): with
        `state=open`, the default, those that are not closed ("À faire"); with `state=closed`, those
        of the keys `done` and `cancelled` ("Terminées", "Terminées et annulées"). They come by due
        date, the tasks without a due date last, then in the order of their creation; the web
        application groups the open ones by due date ("En retard", "Aujourd’hui", "Sept prochains
        jours", "Plus tard", "Sans échéance"). `counts` counts both tabs, on every page. Archived
        tasks and the trash are left out; the tasks of an archived list stay.

        Scope `tasks:read` for a personal API token.
      tags: [my-tasks]
      security:
        - sessionCookie: []
        - apiToken: [tasks:read]
      parameters:
        - $ref: '#/components/parameters/MyTaskState'
        - $ref: '../../components/http.yaml#/components/parameters/Cursor'
        - $ref: '../../components/http.yaml#/components/parameters/Limit'
      responses:
        '200':
          description: One page of the tasks of the caller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyTaskPage'
              example:
                items:
                  - key: CAD-482
                    name: Refondre l’écran de connexion SSO
                    status: progress
                    cancelReason: null
                    priority: haute
                    assignees:
                      - userId: 019a5f3c-8d2e-7c4a-9b1f-3e5d7a9c1b30
                      - userId: 019a5f3c-9e1f-7b2a-8c3d-4e5f6a7b8c31
                    dueDate: '2026-11-12'
                    startDate: '2026-11-11'
                    estimateMinutes: 480
                    labels: [Auth, Front]
                    parentKey: null
                    listId: 019a7001-2b3c-7d4e-8f5a-6b7c8d9e0f12
                    spaceId: 019a7000-1a2b-7c3d-8e4f-5a6b7c8d9e01
                    subtaskCounts: { total: 3, closed: 1 }
                    checklistCounts: { total: 3, done: 3 }
                    completedAt: null
                    createdAt: '2026-11-03T09:00:00Z'
                    version: 12
                nextCursor: null
                counts:
                  open: 14
                  closed: 9
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/TasksReadForbidden'
        '404':
          $ref: '#/components/responses/OrganizationNotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/me/home:
    get:
      operationId: getHome
      summary: Read the task part of "Accueil"
      description: |
        Returns what "Accueil" shows of the tasks of the caller, in the spaces they see:

        - `stats`: the tasks assigned to them that are not closed ("Assignées à moi", "tâches
          ouvertes"), those of them that are late ("En retard", "à replanifier") or due `today`
          ("Aujourd’hui", "échéances du jour"), and the tasks assigned to them of the key `done`
          ("Terminées"), subtasks included;
        - `priorities` ("Mes priorités"): 7 of their tasks that are not closed, by due date, the
          tasks without a due date last, then in the order of their creation;
        - `sprints`: the sprints current on `today` (first day on or before it, last day on or
          after it), by last day then in the order of their creation, 10 at most, with the counts
          of their tasks ("Sprint 14", "3 – 17 nov.", "Avancement");
        - `lists` ("Listes"): the first 6 lists, in the order of the sidebar (spaces then lists in
          the order of their creation), with the counts of their tasks ("14 ouvertes").

        Archived tasks and the trash are left out of `stats` and `priorities`, the tasks of an
        archived list stay; archived lists are left out of `sprints` and `lists`. `today` is the
        date of the caller, in their time zone. A guest, never assigned, gets zeros, no priorities,
        and the lists shared with them. The mentions and the activity of the inbox come from
        another route in a later version. Scope `tasks:read` for a personal API token.
      tags: [my-tasks]
      security:
        - sessionCookie: []
        - apiToken: [tasks:read]
      parameters:
        - $ref: '#/components/parameters/Today'
      responses:
        '200':
          description: The task part of "Accueil".
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Home'
              example:
                stats:
                  assigned: 14
                  late: 2
                  dueToday: 1
                  done: 9
                priorities:
                  - key: CAD-482
                    name: Refondre l’écran de connexion SSO
                    status: progress
                    cancelReason: null
                    priority: haute
                    assignees:
                      - userId: 019a5f3c-8d2e-7c4a-9b1f-3e5d7a9c1b30
                      - userId: 019a5f3c-9e1f-7b2a-8c3d-4e5f6a7b8c31
                    dueDate: '2026-11-12'
                    startDate: '2026-11-11'
                    estimateMinutes: 480
                    labels: [Auth, Front]
                    parentKey: null
                    listId: 019a7001-2b3c-7d4e-8f5a-6b7c8d9e0f12
                    spaceId: 019a7000-1a2b-7c3d-8e4f-5a6b7c8d9e01
                    subtaskCounts: { total: 3, closed: 1 }
                    checklistCounts: { total: 3, done: 3 }
                    completedAt: null
                    createdAt: '2026-11-03T09:00:00Z'
                    version: 12
                sprints:
                  - list:
                      id: 019a7001-2b3c-7d4e-8f5a-6b7c8d9e0f12
                      spaceId: 019a7000-1a2b-7c3d-8e4f-5a6b7c8d9e01
                      name: Sprint 14
                      icon: lightning
                      color: violet
                      sprint:
                        startDate: '2026-11-03'
                        endDate: '2026-11-17'
                        goal: Livrer la connexion SSO et la page des quotas d’organisation.
                      createdAt: '2026-10-30T16:00:00Z'
                      version: 2
                    counts:
                      total: 98
                      open: 72
                      done: 24
                      cancelled: 2
                      late: 3
                lists:
                  - list:
                      id: 019a7001-2b3c-7d4e-8f5a-6b7c8d9e0f11
                      spaceId: 019a7000-1a2b-7c3d-8e4f-5a6b7c8d9e01
                      name: Backlog
                      icon: null
                      color: gris
                      sprint: null
                      createdAt: '2026-03-02T09:30:00Z'
                      version: 1
                    counts:
                      total: 4
                      open: 4
                      done: 0
                      cancelled: 0
                      late: 0
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/TasksReadForbidden'
        '404':
          $ref: '#/components/responses/OrganizationNotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/me/onboarding:
    get:
      operationId: getOnboarding
      summary: Read first-launch progress
      description: |
        Returns the caller's own wizard and "Bien démarrer" checklist for the current organization,
        separately from `GET /v1/me/home`. Before the first write it returns the initial state at
        version 1. The result is private to this caller and organization. Scope `tasks:read`
        for a personal API token.
      tags: [my-tasks]
      security:
        - sessionCookie: []
        - apiToken: [tasks:read]
      responses:
        '200':
          description: The caller's onboarding state.
          headers:
            ETag:
              $ref: '#/components/headers/OnboardingETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnboardingState'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/TasksReadForbidden'
        '404':
          $ref: '#/components/responses/OrganizationNotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
    patch:
      operationId: updateOnboarding
      summary: Save or dismiss the first-launch wizard
      description: |
        Saves the caller's wizard step or draft choices for later resumption. With
        `dismissed: true`, closes the wizard at the current draft. Dismissal requires only current
        organization membership. Finishing or dismissing the wizard closes it permanently. A
        repeated dismissal or another change that leaves the saved state identical preserves its
        version.
        Scope `tasks:write` for a personal API token.
      tags: [my-tasks]
      security:
        - sessionCookie: []
        - apiToken: [tasks:write]
      parameters:
        - $ref: '#/components/parameters/OnboardingIfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OnboardingDraftPatch'
            example:
              step: preset
              name: Produit
              prefix: CAD
              color: violet
              preset: dev
      responses:
        '200':
          description: The caller's updated onboarding state.
          headers:
            ETag:
              $ref: '#/components/headers/OnboardingETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnboardingState'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/OnboardingWriteForbidden'
        '404':
          $ref: '#/components/responses/OrganizationNotFound'
        '409':
          $ref: '#/components/responses/OnboardingWizardClosed'
        '412':
          $ref: '#/components/responses/OnboardingVersionMismatch'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/me/onboarding/checklist:
    patch:
      operationId: updateOnboardingChecklist
      summary: Save the onboarding checklist presentation and markers
      description: |
        Updates "Bien démarrer" for the caller. Changing its presentation or recording an attempt
        of the Board view requires a provisioned space. The caller can record an invitation
        outcome during the wizard or afterwards. To invite anyone, call `POST /v1/invitations`
        separately under its normal authorization. Record only the marker after a successful
        invitation result. Normal task creation updates `firstTaskCreated`. Reminder and mobile
        actions depend on their own capabilities. A matching repeated marker preserves the current
        version.
        Scope `tasks:write` for a personal API token.
      tags: [my-tasks]
      security:
        - sessionCookie: []
        - apiToken: [tasks:write]
      parameters:
        - $ref: '#/components/parameters/OnboardingIfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OnboardingChecklistPatch'
            example:
              presentation: collapsed
              boardTried: true
      responses:
        '200':
          description: The caller's updated onboarding state.
          headers:
            ETag:
              $ref: '#/components/headers/OnboardingETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnboardingState'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/OnboardingWriteForbidden'
        '404':
          $ref: '#/components/responses/OrganizationNotFound'
        '409':
          $ref: '#/components/responses/OnboardingChecklistUnavailable'
        '412':
          $ref: '#/components/responses/OnboardingVersionMismatch'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/me/onboarding/finish:
    post:
      operationId: finishOnboarding
      summary: Provision the space selected in the first-launch wizard
      description: |
        Creates the caller's space and the chosen preset's lists and example tasks, then marks
        the wizard finished in the same transaction. The caller needs the same organization role
        as for `POST /v1/spaces`. The prefix is explicit and subject to the ordinary reservation
        rules. Each created list and task uses the normal creation policies and keys, and the
        command emits the ordinary space, list and task creation facts. Invitations use the
        organization invitation route. Import is deferred.

        | Preset | Lists in creation order | Example task names |
        | --- | --- | --- |
        | `dev` | Backlog, Sprint 1, Bugs | Définir le périmètre du premier sprint; Configurer l’intégration continue; Corriger le bug de connexion |
        | `mkt` | Calendrier éditorial, Campagnes | Planifier les articles de décembre; Préparer la campagne de rentrée; Mettre à jour la page tarifs |
        | `agency` | Projets clients, Demandes | Lancer le projet Studio Pixel; Valider le devis Lumen; Envoyer le compte rendu de réunion |
        | `blank` | Première liste | None |

        The table gives the complete list set. For `blank`, reuse the ordinary first list
        "Première liste". `Sprint 1` is a standard list name in the `dev` preset. The first two
        examples go in the first list. The third goes in Bugs for `dev` and in the first list
        for the other nonblank presets. The first example uses `progress` and the other examples
        use `todo`. Example tasks leave the first real task marker unchanged.

        A matching `Idempotency-Key` replay within 24 hours returns the original status, state
        and space location. Provisioning is limited to one space per caller and organization.
        If provisioning fails, the wizard can still be resumed with the same draft.
        Scope `tasks:write` for a personal API token.
      tags: [my-tasks]
      security:
        - sessionCookie: []
        - apiToken: [tasks:write]
      parameters:
        - $ref: '#/components/parameters/OnboardingIfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OnboardingFinish'
            example:
              name: Produit
              prefix: CAD
              color: violet
              preset: dev
      responses:
        '201':
          description: The space exists and the state names it and its first list.
          headers:
            Location:
              description: Relative URL `/v1/spaces/<spaceId>` of the space.
              schema:
                type: string
            ETag:
              $ref: '#/components/headers/OnboardingETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnboardingState'
              example:
                version: 4
                wizard:
                  status: finished
                  step: import
                  preset: dev
                  name: Produit
                  prefix: CAD
                  color: violet
                provisioning:
                  spaceId: 019a7000-1a2b-7c3d-8e4f-5a6b7c8d9e05
                  firstListId: 019a7001-2b3c-7d4e-8f5a-6b7c8d9e0f20
                checklist:
                  presentation: expanded
                  firstTaskCreated: false
                  invitationSent: true
                  boardTried: false
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/OnboardingWriteForbidden'
        '404':
          $ref: '#/components/responses/OrganizationNotFound'
        '409':
          $ref: '#/components/responses/OnboardingFinishConflict'
        '412':
          $ref: '#/components/responses/OnboardingVersionMismatch'
        '422':
          $ref: '#/components/responses/OnboardingIdempotencyKeyReused'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-cw_session
      description: |
        Opaque session token of `openapi/public/auth.yaml`, set by the gateway on sign-in and checked
        with identity-service on every request. A session holds every scope.
    apiToken:
      type: http
      scheme: bearer
      description: |
        Personal API token (`cw_pat_…`) of `openapi/public/api-tokens.yaml`, sent as
        `Authorization: Bearer`. It acts with the rights of its user in the organization it was
        created in, within the scopes each operation lists.
  parameters:
    DependencyId:
      name: dependencyId
      in: path
      required: true
      description: ID of a directed dependency edge.
      schema:
        type: string
        format: uuid
        examples: [019a7003-4d5e-7f6a-8b9c-0d1e2f3a4b01]
    DependencyDirection:
      name: direction
      in: query
      required: true
      description: Direction of the edge relative to the anchor task.
      schema:
        $ref: '#/components/schemas/DependencyDirection'
    WatcherUserId:
      name: userId
      in: path
      required: true
      description: Account whose watcher override is changed.
      schema:
        type: string
        format: uuid
        examples: [019a5f3c-8d2e-7c4a-9b1f-3e5d7a9c1b30]
    CommentId:
      name: commentId
      in: path
      required: true
      description: ID of the comment on this task.
      schema:
        type: string
        format: uuid
        examples: [019a7003-4d5e-7f6a-8b9c-0d1e2f3a4b01]
    ListId:
      name: listId
      in: path
      required: true
      description: Id of the list or the sprint.
      schema:
        type: string
        format: uuid
        examples: [019a7001-2b3c-7d4e-8f5a-6b7c8d9e0f12]
    ApprovalRoundId:
      name: roundId
      in: path
      required: true
      description: Identifier of the current approval round.
      schema:
        type: string
        format: uuid
        examples: [019a7003-4d5e-7f6a-8b9c-0d1e2f3a4b01]
    ApprovalIfMatch:
      name: If-Match
      in: header
      required: true
      description: The strong task version ETag last returned on the task or approval state.
      schema:
        type: string
        pattern: '^"[1-9][0-9]*"$'
        examples: ['"13"']
    TaskKey:
      name: taskKey
      in: path
      required: true
      description: Key of the task.
      schema:
        $ref: '../../components/task.yaml#/components/schemas/TaskKey'
    AssigneeUserId:
      name: userId
      in: path
      required: true
      description: Account of the person to assign or to remove, as the member list gives it (`userId`).
      schema:
        type: string
        format: uuid
        examples: [019a5f3c-9e1f-7b2a-8c3d-4e5f6a7b8c31]
    ChecklistItemId:
      name: checklistItemId
      in: path
      required: true
      description: Id of the checklist item, as the task gives it.
      schema:
        type: string
        format: uuid
        examples: [019a7003-4d5e-7f6a-8b9c-0d1e2f3a4b01]
    IfMatch:
      name: If-Match
      in: header
      required: false
      description: '`"<version>"` of the task the change was made from, as the `ETag` gave it.'
      schema:
        type: string
        examples: ['"12"']
    IfOrganizationMatch:
      name: If-Organization-Match
      in: header
      required: false
      description: |
        The UUIDv7 of the organization the caller expects, compared without regard to hex case.
        The verified session or API token determines the organization for the request. The gateway
        uses this header only to check that organization before calling task-service. A mismatch
        answers `412 organization.context-changed`. Omit the header to use the verified context
        without an organization precondition. Send exactly one UUIDv7: repeated, comma-separated
        or malformed values answer `400 request.invalid` with an issue on this header.
      schema:
        type: string
        format: uuid
        pattern: '^[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-7[0-9A-Fa-f]{3}-[89ABab][0-9A-Fa-f]{3}-[0-9A-Fa-f]{12}$'
        examples: [019a5f3c-8d2e-7c4a-9b1f-3e5d7a9c1b2f]
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        Key of this creation, chosen by the client, a UUID for example; the same key with the same
        body within 24 hours answers what the first request answered.
      schema:
        type: string
        minLength: 1
        maxLength: 255
        examples: [5d0c6f1e-2a3b-4c5d-8e9f-0a1b2c3d4e5f]
    Today:
      $ref: '../../components/task.yaml#/components/parameters/Today'
    StatusFilter:
      $ref: '../../components/task.yaml#/components/parameters/StatusFilter'
    PriorityFilter:
      $ref: '../../components/task.yaml#/components/parameters/PriorityFilter'
    AssigneeFilter:
      $ref: '../../components/task.yaml#/components/parameters/AssigneeFilter'
    LabelFilter:
      $ref: '../../components/task.yaml#/components/parameters/LabelFilter'
    Search:
      $ref: '../../components/task.yaml#/components/parameters/Search'
    DueFrom:
      $ref: '../../components/task.yaml#/components/parameters/DueFrom'
    DueTo:
      $ref: '../../components/task.yaml#/components/parameters/DueTo'
    Level:
      $ref: '../../components/task.yaml#/components/parameters/Level'
    TaskSort:
      $ref: '../../components/task.yaml#/components/parameters/TaskSort'
    GroupBy:
      $ref: '../../components/task.yaml#/components/parameters/GroupBy'
    MyTaskState:
      $ref: '../../components/task.yaml#/components/parameters/MyTaskState'
    ActivityKind:
      $ref: '../../components/task.yaml#/components/parameters/ActivityKind'
    OnboardingIfMatch:
      name: If-Match
      in: header
      required: false
      description: Onboarding version returned by the ETag, for example `"3"`.
      schema:
        type: string
  headers:
    OnboardingETag:
      description: Version of the caller's onboarding state, `"<version>"`.
      schema:
        type: string
    ETag:
      description: Version of the task, `"<version>"`.
      schema:
        type: string
    TaskDetailNoStore:
      description: The response is private and cannot be stored.
      required: true
      schema:
        type: string
        const: private, no-store
    TaskLocation:
      description: '`/v1/tasks/<key>`, where the task reads.'
      schema:
        type: string
    ChecklistItemLocation:
      description: '`/v1/tasks/<key>/checklist-items/<checklistItemId>`, where the item changes.'
      schema:
        type: string
    RetryAfter:
      description: Seconds to wait before the request can succeed (RFC 9110).
      schema:
        type: integer
        minimum: 1
  examples:
    OrganizationContextChanged:
      summary: The verified organization differs from the expected Atelier Nord context
      value:
        type: about:blank
        title: L’organisation active a changé.
