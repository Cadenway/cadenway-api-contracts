          type: array
          items:
            $ref: '#/components/schemas/TaskSummary'
        nextCursor:
          $ref: '../../components/http.yaml#/components/schemas/NextCursor'
        total:
          type: integer
          minimum: 0
          description: Tasks that match the filters, on every page ("12 sur 98 tâches").
    TaskGroup:
      type: object
      required: [value, count]
      properties:
        value:
          type: string
          description: |
            The value of the group, to add to the filters to read its tasks: a status key, a
            priority, an account id, or `none` for the tasks nobody is assigned.
          examples: [progress]
        count:
          type: integer
          minimum: 0
          description: Tasks of the group that match the filters.
    TaskGroupPage:
      type: object
      required: [groupBy, items, nextCursor, total]
      properties:
        groupBy:
          type: string
          description: '`status`, `priority` or `assignee`, as asked; later versions may add groupings (`x-extensible-enum`).'
          x-extensible-enum: [status, priority, assignee]
        items:
          type: array
          items:
            $ref: '#/components/schemas/TaskGroup'
        nextCursor:
          $ref: '../../components/http.yaml#/components/schemas/NextCursor'
        total:
          type: integer
          minimum: 0
          description: Tasks that match the filters, each counted once.
    Label:
      type: object
      required: [name]
      properties:
        name:
          type: string
          description: The label, 32 characters at most.
          examples: [Auth]
    LabelPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Label'
        nextCursor:
          $ref: '../../components/http.yaml#/components/schemas/NextCursor'
    ActivityPage:
      type: object
      required: [items, nextCursor, total]
      properties:
        items:
          type: array
          description: The entries, the most recent first.
          items:
            $ref: '#/components/schemas/ActivityEntry'
        nextCursor:
          $ref: '../../components/http.yaml#/components/schemas/NextCursor'
        total:
          type: integer
          minimum: 0
          description: Entries that match the filters, on every page.
    MyTaskCounts:
      type: object
      required: [open, closed]
      description: The tasks of the two tabs of "Mes tâches", on every page.
      properties:
        open:
          type: integer
          minimum: 0
          description: Not closed ("À faire 14").
        closed:
          type: integer
          minimum: 0
          description: Of the keys `done` and `cancelled` ("Terminées 9").
    MyTaskPage:
      type: object
      required: [items, nextCursor, counts]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TaskSummary'
        nextCursor:
          $ref: '../../components/http.yaml#/components/schemas/NextCursor'
        counts:
          $ref: '#/components/schemas/MyTaskCounts'
    HomeStats:
      type: object
      required: [assigned, late, dueToday, done]
      description: The four counters of "Accueil", over the tasks assigned to the caller, subtasks included.
      properties:
        assigned:
          type: integer
          minimum: 0
          description: Not closed ("Assignées à moi").
        late:
          type: integer
          minimum: 0
          description: Not closed and due before `today` ("En retard").
        dueToday:
          type: integer
          minimum: 0
          description: Not closed and due on `today` ("Aujourd’hui").
        done:
          type: integer
          minimum: 0
          description: Of the key `done` ("Terminées").
    Home:
      type: object
      required: [stats, priorities, sprints, lists]
      properties:
        stats:
          $ref: '#/components/schemas/HomeStats'
        priorities:
          type: array
          description: '"Mes priorités", 7 tasks at most; empty for "Rien ne vous est assigné."'
          items:
            $ref: '#/components/schemas/TaskSummary'
        sprints:
          type: array
          description: The sprints current on `today`, 10 at most, with the counts of their tasks.
          items:
            $ref: '#/components/schemas/ListSummary'
        lists:
          type: array
          description: '"Listes", the first 6 lists of the sidebar, with the counts of their tasks.'
          items:
            $ref: '#/components/schemas/ListSummary'
    TaskDetail:
      type: object
      required: [task, space, list, parent, subtasks, partial]
      description: The task detail, composed by the gateway.
      properties:
        comments:
          $ref: '#/components/schemas/CommentPage'
          description: First page of comments, omitted if that part cannot be read.
        task:
          $ref: '#/components/schemas/Task'
        space:
          $ref: '#/components/schemas/Space'
        list:
          $ref: '#/components/schemas/TaskList'
        parent:
          description: The parent of a subtask, as it is now; `null` for a top-level task.
          oneOf:
            - $ref: '#/components/schemas/TaskRef'
            - type: 'null'
        subtasks:
          type: array
          description: The direct subtasks, 25 at most, in the order of their creation.
          items:
            $ref: '#/components/schemas/TaskSummary'
        partial:
          type: array
          description: |
            The parts the gateway could not read, the rest of the detail being complete. Always
            empty when all parts are available; `comments` identifies a comments-only upstream
            failure. Later versions may name other parts (`attachments`, `development`)
            (`x-extensible-enum`).
          items:
            type: string
            x-extensible-enum: [comments, attachments, development]
    OnboardingState:
      $ref: '../../components/onboarding.yaml#/components/schemas/OnboardingState'
    OnboardingDraftPatch:
      $ref: '../../components/onboarding.yaml#/components/schemas/OnboardingDraftPatch'
    OnboardingChecklistPatch:
      $ref: '../../components/onboarding.yaml#/components/schemas/OnboardingChecklistPatch'
    OnboardingFinish:
      $ref: '../../components/onboarding.yaml#/components/schemas/OnboardingFinish'
