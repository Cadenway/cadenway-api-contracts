  /v1/lists/{listId}/tasks/export:
    parameters:
      - $ref: '#/components/parameters/ListId'
    get:
      operationId: exportListTasks
      summary: Download the visible list tasks as CSV
      description: |
        Exports the filtered rows the caller can see in the list ("Exporter CSV"). It uses the
        same filters, stable order and root or subtask selection as `GET /v1/lists/{listId}/tasks`.
        It includes the entire logical result across API pages. An optional Feuille sort
        chooses a published presentation column or an active custom field ID in this list's
        space. Its direction defaults to ascending and the ordinary task sort breaks ties.
        A direction without a column or a custom field unavailable in this space yields
        `400 request.invalid`.

        The `people` column sorts on the first assignee's directory name using French collation.
        Rows without a name for that assignee sort last in either direction. The `client`
        column sorts on the first active text field named Client, matching the field name
        case-insensitively in definition order. Rows without a value sort last. If no such
        field is defined, the ordinary task sort applies. Use the field ID to sort another
        custom field explicitly.

        The UTF-8 file has semicolon-delimited, quoted fields with embedded quotes doubled.
        The headers are "Identifiant", "Nom", "Statut", "Priorité", "Assignés", "Échéance"
        and "Étiquettes", followed by active custom field names in definition order.
        The "Assignés" cell lists known directory names in assignment order, separated by a comma
        and a space. Status and priority use their French labels. Formula-like untrusted text, including
        custom header names, is rendered literally when opened in a spreadsheet. The producer
        checks the 10,000-row limit before sending any CSV bytes, and the gateway relays the
        file and safe filename. Scope `tasks:read` for a personal API token.
      tags: [lists]
      security:
        - sessionCookie: []
        - apiToken: [tasks:read]
      parameters:
        - $ref: '../../components/task.yaml#/components/parameters/StatusFilter'
        - $ref: '../../components/task.yaml#/components/parameters/PriorityFilter'
        - $ref: '../../components/task.yaml#/components/parameters/AssigneeFilter'
        - $ref: '../../components/task.yaml#/components/parameters/LabelFilter'
        - $ref: '../../components/task.yaml#/components/parameters/Search'
        - $ref: '../../components/task.yaml#/components/parameters/DueFrom'
        - $ref: '../../components/task.yaml#/components/parameters/DueTo'
        - $ref: '../../components/task.yaml#/components/parameters/Level'
        - $ref: '../../components/task.yaml#/components/parameters/MilestoneFilter'
        - $ref: '../../components/task.yaml#/components/parameters/TaskSort'
        - $ref: '#/components/parameters/SheetExportColumn'
        - $ref: '#/components/parameters/SheetExportDirection'
      responses:
        '200':
          description: The complete CSV file, including headers for an empty result.
          headers:
            Content-Disposition:
              required: true
              description: Safe attachment basename with the .csv extension, without path segments or control characters.
              schema:
                type: string
                examples: ['attachment; filename="sprint-14.csv"']
          content:
            text/csv:
              schema:
                type: string
              example: |
                "Identifiant";"Nom";"Statut";"Priorité";"Assignés";"Échéance";"Étiquettes";"Points";"Client"
                "CAD-482";"Refondre l’écran de connexion SSO";"En cours";"Haute";"Camille Martin, Inès Robert";"2026-11-12";"Auth, Front";"5";"Coopérative Lumen"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/TasksReadForbidden'
        '404':
          $ref: '#/components/responses/ListNotFound'
        '422':
          $ref: '#/components/responses/ExportRowLimitReached'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
