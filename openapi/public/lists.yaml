# Public routes of lists and sprints: create, list, read, change and delete the lists of a space
# (name, appearance, sprint dates and goal, the switch "Accès de l’organisation"), read a list's
# counts, activity log and reports, and export its tasks. The API gateway calls
# openapi/internal/task-service.yaml for these operations.
openapi: 3.1.0
info:
  title: Cadenway lists and sprints
  version: 1.0.0
  description: |
    The lists of a space, and the sprints, lists with dates and a goal ("Une période datée, avec un
    objectif et un suivi d’avancement."). The API gateway serves these routes and answers them
    through task-service. Spaces are in `openapi/public/spaces.yaml`, tasks in
    `openapi/public/tasks.yaml`.

    **Who sees a list.** A list is seen by whoever has a role on it (see "Access" in
    `openapi/public/spaces.yaml`): the rule of the organization while its switch "Accès de
    l’organisation" is on (`organizationAccess`), the owner of the space, the grants of the space
    and of the list (`openapi/public/access.yaml`). A list the caller does not see answers
    `404 list.not-found`, as an unknown or deleted one does. Who has `edit` on a space creates
    lists in it; who has `edit` on a list changes it, turns its switch, shares it, archives it
    and deletes it; anyone else who sees it gets `403 access.role-insufficient`.

    **Archives.** An archived list (`archivedAt`) leaves the sidebar, the lists of its space, the
    overview and the lists and sprints of "Accueil", and reads by its id, its tasks with it; its
    tasks still read and change by their key, and stay in "Mes tâches" and the priorities and
    counters of "Accueil". The archive routes are in `openapi/public/archives.yaml`.

    **Deletion.** A deleted list disappears at once for everyone with its tasks, which a job then
    moves to the trash (`openapi/public/trash.yaml`), one entry per top-level task. Restoring one
    of them brings the list back, at the end of its space, without its other tasks.

    **Sprints.** A sprint is a list with a first day, a last day on or after it ("La fin doit suivre
    le début."), and an optional goal. Its state follows from its dates, with no start or
    completion: it is current while the date of the caller is between them. Its tasks are the tasks
    of the list: a task joins a sprint by being created in it, moved to it, or attached to a task of
    it. Its progress is the count of its tasks of the key `done` out of its tasks that are not
    `cancelled`.

    **Counts.** The counts of a list are those of its top-level tasks, subtasks left out, as the
    sidebar, the list cards and the sprint progress count them. `today` is the date of the caller,
    in their time zone, which task-service does not know: a task is late when it is not closed and
    its due date is before it.

    **Activity.** The activity log of a list holds the entries of its tasks recorded while they
    were in it: creations, status, priority and due date changes, and assignments. An entry whose
    task the caller no longer sees, moved to a private space for example, or whose task is
    archived or in the trash, is left out. Sharing, archives, the trash and deletions are not
    recorded. The detail of the log is in `openapi/public/tasks.yaml`.

    **Current organization, members, versions, creations, credentials, cross-site requests, rate
    limit and errors.** As in `openapi/public/spaces.yaml`: the current organization of the session
    or of the personal API token, task-service's own copy of the members, `ETag` and `If-Match`, an
    optional `Idempotency-Key` on a creation, the scopes `tasks:read` and `tasks:write`, 600
    requests per minute, French titles for the codes the web application shows.

    **Custom fields.** Every list uses the active definitions of its space, including a newly
    created list. Its creation does not alter the definitions or assign values to tasks.

    **Reports and export.** The sprint report, workload and task export use the caller's list
    and task visibility. The list's timesheet is in `openapi/public/time.yaml`.
  contact:
    name: Cadenway
    url: https://github.com/Cadenway/cadenway-api-contracts
  license:
    name: Proprietary
    url: https://github.com/Cadenway/cadenway-api-contracts/blob/main/LICENSE
  x-consumers:
    - repository: cadenway-api-gateway
      uses: >-
        Serves every route through openapi/internal/task-service.yaml, checks the scopes and
        exposes Content-Disposition for CSV downloads from another origin.
    - repository: cadenway-webapp
      uses: Calls every route through @cadenway/api-client for list and sprint dialogs, list headers, sharing, activity, sprint reports, workload and CSV export.
servers:
  - url: https://api.cadenway.com
    description: Production.
  - url: https://api.staging.cadenway.com
    description: Staging. The local stack of cadenway-ops serves the same routes on `api.<DOMAIN>`.
tags:
  - name: lists
    description: Lists and sprints of the spaces of the current organization.
paths:
  /v1/spaces/{spaceId}/lists:
    parameters:
      - $ref: '#/components/parameters/SpaceId'
    post:
      operationId: createList
      summary: Create a list or a sprint
      description: |
        Creates a list in a space the caller has `edit` on, after its other lists ("Créer la
        liste", "Liste créée"); with `sprint`, a sprint ("Créer le sprint", "Sprint créé"). An end
        before the start answers `422 list.sprint-dates-invalid` ("La fin doit suivre le début.").
        The web application proposes the name, the dates and the appearance of a new sprint
        ("Sprint 15", the day after the end of the last sprint, 14 days, the lightning and
        "Améthyste"); the API takes what it is sent. `organizationAccess` is on unless the body
        turns it off. A caller who sees the space without `edit` on it, through the grants of some
        of its lists for example, gets `403 access.role-insufficient`.

        Emits `list.created.v1`. Scope `tasks:write` for a personal API token.
      tags: [lists]
      security:
        - sessionCookie: []
        - apiToken: [tasks:write]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ListCreation'
            examples:
              sprint:
                summary: The next sprint of "Produit"
                value:
                  name: Sprint 15
                  icon: lightning
                  color: violet
                  sprint:
                    startDate: '2026-11-18'
                    endDate: '2026-12-01'
                    goal: Ouvrir la facturation par siège.
              list:
                summary: A list
                value:
                  name: Bugs
                  icon: bug
                  color: rouge
      responses:
        '201':
          description: The list exists.
          headers:
            Location:
              $ref: '#/components/headers/ListLocation'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskList'
              example:
                id: 019a7001-2b3c-7d4e-8f5a-6b7c8d9e0f15
                spaceId: 019a7000-1a2b-7c3d-8e4f-5a6b7c8d9e01
                name: Sprint 15
                icon: lightning
                color: violet
                sprint:
                  startDate: '2026-11-18'
                  endDate: '2026-12-01'
                  goal: Ouvrir la facturation par siège.
                createdAt: '2026-11-08T11:20:00Z'
                version: 1
                organizationAccess: true
                archivedAt: null
                archivedBy: null
                callerRole: edit
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/TasksWriteForbidden'
        '404':
          $ref: '#/components/responses/SpaceNotFound'
        '409':
          $ref: '#/components/responses/RequestInProgress'
        '422':
          $ref: '#/components/responses/ListCreationRefused'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
    get:
      operationId: listLists
      summary: List the lists of a space
      description: |
        Lists the lists and the sprints of a space that the caller sees, in the order of the
        sidebar: the order of their creation, a list restored from the archives or the trash at
        the end. The archived lists are left out (`GET /v1/archives/lists`,
        `openapi/public/archives.yaml`). Their counts are read with
        `GET /v1/spaces/{spaceId}/overview` (`openapi/public/spaces.yaml`).

        Scope `tasks:read` for a personal API token.
      tags: [lists]
      security:
        - sessionCookie: []
        - apiToken: [tasks:read]
      parameters:
        - $ref: '../../components/http.yaml#/components/parameters/Cursor'
        - $ref: '../../components/http.yaml#/components/parameters/Limit'
      responses:
        '200':
          description: One page of lists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskListPage'
              example:
                items:
                  - id: 019a7001-2b3c-7d4e-8f5a-6b7c8d9e0f11
                    spaceId: 019a7000-1a2b-7c3d-8e4f-5a6b7c8d9e01
                    name: Backlog
                    icon: null
                    color: gris
                    sprint: null
                    createdAt: '2026-03-02T09:30:00Z'
                    version: 1
                  - id: 019a7001-2b3c-7d4e-8f5a-6b7c8d9e0f12
                    spaceId: 019a7000-1a2b-7c3d-8e4f-5a6b7c8d9e01
                    name: Sprint 14
                    icon: lightning
                    color: violet
                    sprint:
                      startDate: '2026-11-03'
                      endDate: '2026-11-17'
                      goal: Livrer la connexion SSO et la page des quotas d’organisation.
                    createdAt: '2026-10-30T16:00:00Z'
                    version: 2
                  - id: 019a7001-2b3c-7d4e-8f5a-6b7c8d9e0f13
                    spaceId: 019a7000-1a2b-7c3d-8e4f-5a6b7c8d9e01
                    name: Bugs
                    icon: bug
                    color: rouge
                    sprint: null
                    createdAt: '2026-03-02T09:31:00Z'
                    version: 1
                nextCursor: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/TasksReadForbidden'
        '404':
          $ref: '#/components/responses/SpaceNotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/lists/{listId}:
    parameters:
      - $ref: '#/components/parameters/ListId'
    get:
      operationId: getList
      summary: Read a list
      description: |
        Returns a list or a sprint the caller sees, an archived one included (`archivedAt`), with
        the role of the caller on it (`callerRole`). A deleted list answers `404 list.not-found`.
        Scope `tasks:read` for a personal API token.
      tags: [lists]
      security:
        - sessionCookie: []
        - apiToken: [tasks:read]
      responses:
        '200':
          description: The list.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskList'
              examples:
                sprint14:
                  $ref: '#/components/examples/Sprint14'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/TasksReadForbidden'
        '404':
          $ref: '#/components/responses/ListNotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
    patch:
      operationId: updateList
      summary: Change a list or a sprint
      description: |
        Applies a JSON Merge Patch to a list ("Modifier la liste", "Modifier le sprint", "Liste
        modifiée", "Sprint modifié"): a member left out is unchanged, `icon: null` puts back the
        default icon.

        - `sprint` with its two dates makes a list a sprint or changes the dates of a sprint; an
          end before the start answers `422 list.sprint-dates-invalid` ("La fin doit suivre le
          début."). `sprint: null` makes a sprint a list again, without dates or goal; its tasks
          stay in it.
        - `organizationAccess` turns the switch "Accès de l’organisation" of the dialog
          "Partager" ("Tous les membres de Atelier Nord peuvent voir cette liste"). Off, in a space
          `organization`, the members of the organization who hold no grant stop seeing the list
          and its tasks at once; in a private space it changes nothing.
        - `If-Match` is optional (`412 request.version-mismatch`).

        It needs `edit` on the list (`403 access.role-insufficient`); an archived list changes
        too. A list never moves to another space in this version. Emits `list.updated.v1` when
        its name, appearance or sprint changed, and `list.access-changed.v1` when its switch did,
        with the same version; a patch that changes nothing answers `200` with the same version
        and emits nothing. Scope `tasks:write` for a personal API token.
      tags: [lists]
      security:
        - sessionCookie: []
        - apiToken: [tasks:write]
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ListPatch'
            examples:
              dates:
                summary: Move the end of a sprint
                value:
                  sprint:
                    startDate: '2026-11-03'
                    endDate: '2026-11-19'
              notASprint:
                summary: Make a sprint a list again
                value:
                  sprint: null
              organizationAccess:
                summary: Turn off "Tous les membres de Atelier Nord peuvent voir cette liste"
                value:
                  organizationAccess: false
      responses:
        '200':
          description: The list after the change.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskList'
              examples:
                sprint14:
                  $ref: '#/components/examples/Sprint14'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/TasksWriteForbidden'
        '404':
          $ref: '#/components/responses/ListNotFound'
        '412':
          $ref: '#/components/responses/VersionMismatch'
        '422':
          $ref: '#/components/responses/SprintDatesInvalid'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
    delete:
      operationId: deleteList
      summary: Delete a list or a sprint
      description: |
        Deletes a list ("Supprimer la liste", "Liste « Bugs » supprimée"), archived or not, which
        needs `edit` on it (`403 access.role-insufficient`). The web application asks first for
        the name of the list ("Pour confirmer, saisissez Bugs") and offers to archive it instead
        ("Pour la garder de côté, archivez-la plutôt.").

        The list and its tasks disappear at once for everyone: they answer `404` and leave every
        collection and count. A job then moves the tasks to the trash in bounded batches, one entry
        per top-level task with its subtasks (`openapi/public/trash.yaml`), within minutes ("N
        tâches dans la corbeille, restaurables pendant 30 jours."); archived tasks go too and leave
        the archives. Restoring one of them brings the list back, at the end of its space, without
        its other tasks. The pending access requests of the list and its tasks are dropped.
        `If-Match` is optional (`412 request.version-mismatch`).

        Not recorded in the activity log. Emits `list.deleted.v1`, then `task.trashed.v1` for each
        task the job moves. Scope `tasks:write` for a personal API token.
      tags: [lists]
      security:
        - sessionCookie: []
        - apiToken: [tasks:write]
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '204':
          description: The list is deleted; its tasks are on their way to the trash.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/TasksWriteForbidden'
        '404':
          $ref: '#/components/responses/ListNotFound'
        '412':
          $ref: '#/components/responses/VersionMismatch'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/lists/{listId}/duplicate:
    parameters:
      - $ref: '#/components/parameters/ListId'
    post:
      operationId: duplicateList
      x-cadenway-strict-empty: true
      summary: Duplicate a list
      description: |
        Creates an ordinary live list in the same space, with ` (copie)` appended to the name
        after truncating the source portion to fit the name limit. Requires edit on both the source
        list and destination space; an archived source list is allowed. It copies the complete live
        task forest, regardless of filters, remapping parents and allocating fresh keys using the
        current destination prefix; a live task whose parent is outside the forest becomes a root.
        Independently archived and trashed tasks are skipped. Task fields follow the single-task
        copy rule, but task names are retained. More than 500 live tasks answers
        `422 list.duplicate-limit-reached` and creates nothing. The list retains the source look and
        organization-access switch, but copies no direct grants, sprint, views or favorites; the
        resulting access cannot broaden the source. If-Match checks the source list version. The
        optional Idempotency-Key replays the original 201 and Location for 24 hours. The list and
        task creation facts commit with the entire copy.
        Scope `tasks:write` for a personal API token.
      tags: [lists]
      security:
        - sessionCookie: []
        - apiToken: [tasks:write]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ListDuplicate'
            example: {}
      responses:
        '201':
          description: The copy was created.
          headers:
            Location:
              description: Path of the new list.
              schema:
                type: string
                examples: ['/v1/lists/019a7001-2b3c-7d4e-8f5a-6b7c8d9e0f15']
            ETag:
              description: Version of the new resource.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListDuplication'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/TasksWriteForbidden'
        '404':
          $ref: '#/components/responses/ListNotFound'
        '409':
          $ref: '#/components/responses/ListDuplicateConflict'
        '412':
          $ref: '#/components/responses/VersionMismatch'
        '422':
          $ref: '#/components/responses/ListDuplicateRefused'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/lists/{listId}/sprint-report:
    parameters:
      - $ref: '#/components/parameters/ListId'
    get:
      operationId: getSprintReport
      summary: Read the points, burndown and velocity of a sprint
      description: |
        Reads a sprint the caller can see ("Rapport du Sprint 14"). Each contribution requires
        current task visibility as well as access to the sprint. Only ordinary root tasks that
        were in the sprint and eligible at the evaluated instant contribute. Milestones and
        cancelled, archived or trashed tasks are excluded at that instant. A purged task leaves
        the report history.
        The designated numeric custom field supplies points, with zero as a valid value. In its
        absence, an estimate of up to 60, 180, 360 or 600 minutes is worth 1, 2, 3 or 5 points
        respectively. Larger estimates are worth 8 points and an unset estimate is worth 1.

        Opening commitment uses the sprint's first local midnight. Delivered and remaining
        points and task counts use the earliest of the server observation, the end of the
        requested local date and sprint close. Sprint close is the end of its last local day.
        Later scope changes can change that total. Historical days use their own end-of-day
        cutoff. The current partial day uses the report observation and future dates have no
        actual value.

        The burndown pages dates from the first to the last sprint day, oldest first. The cursor
        binds the sprint, caller, requested date, time zone and server observation instant.
        A missing baseline or gap yields a null value for any metric it makes unavailable.
        Ideal points fall evenly from the known opening commitment to zero at close.
        Projected values require an open sprint and a positive burn rate established by at
        least two covered end-of-day observations. Velocity contains up to the four most recent
        readable, completed sprints of the same space whose closing date precedes this sprint's
        start. It orders them by closing date and ID, oldest first, with unavailable historical
        values left null. Scope `tasks:read` for a personal API token.
      tags: [lists]
      security:
        - sessionCookie: []
        - apiToken: [tasks:read]
      parameters:
        - $ref: '../../components/reporting.yaml#/components/parameters/ReportToday'
        - $ref: '../../components/reporting.yaml#/components/parameters/ReportTimeZone'
        - $ref: '../../components/http.yaml#/components/parameters/Cursor'
        - $ref: '../../components/http.yaml#/components/parameters/Limit'
      responses:
        '200':
          description: Sprint metrics and one page of burndown days.
          content:
            application/json:
              schema:
                $ref: '../../components/reporting.yaml#/components/schemas/SprintReport'
              example:
                listId: 019a7001-2b3c-7d4e-8f5a-6b7c8d9e0f12
                name: Sprint 14
                startDate: '2026-11-03'
                endDate: '2026-11-17'
                observedAt: '2026-11-08T12:00:00Z'
                coverageStartedAt: '2026-11-02T00:00:00Z'
                openingPoints: 40
                delivered:
                  points: 13
                  taskCount: 8
                  items:
                    [
                      {
                        taskKey: CAD-481,
                        name: Corriger le libellé du formulaire,
                        points: 0,
                        status: done,
                      },
                    ]
                remaining:
                  points: 29
                  taskCount: 12
                  items:
                    [
                      {
                        taskKey: CAD-482,
                        name: Refondre l’écran de connexion SSO,
                        points: 5,
                        status: progress,
                      },
                    ]
                projectedRemainingPoints: 16
                items:
                  - date: '2026-11-03'
                    actualRemainingPoints: 40
                    idealRemainingPoints: 37.333333333333336
                    projectedRemainingPoints: null
                  - date: '2026-11-04'
                    actualRemainingPoints: 37
                    idealRemainingPoints: 34.666666666666664
                    projectedRemainingPoints: null
                nextCursor: eyJkYXRlIjoiMjAyNi0xMS0wNCJ9
                velocity:
                  - listId: 019a7001-2b3c-7d4e-8f5a-6b7c8d9e0f13
                    name: Sprint 13
                    startDate: '2026-10-20'
                    endDate: '2026-11-02'
                    openingPoints: null
                    deliveredPoints: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/TasksReadForbidden'
        '404':
          $ref: '#/components/responses/SprintReportNotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/lists/{listId}/workload:
    parameters:
      - $ref: '#/components/parameters/ListId'
    get:
      operationId: getListWorkload
      summary: Read scheduled work for two calendar weeks
      description: |
        Reads the filtered live tasks the caller can see in a readable list ("Charge"). Tasks
        require a due date and a positive estimate. Cancelled, archived and trashed tasks are
        excluded. With no start date the interval begins on the due date. Allocate each estimate
        across all Monday–Friday dates in its inclusive interval, then across its assignees for
        each day.
        A weekend-only interval uses the preceding working day. A task with no assignee uses
        the separate unassigned bucket. Whole-minute remainders go to earlier dates and then
        lower account IDs in ascending order. That allocation preserves the full estimate.

        Return only the 14 days starting at `weekStart` after allocating the whole interval.
        Include rows with positive allocated minutes in that window. Capacity is 360 minutes
        per person per weekday and zero on weekends. Totals cover every matching row, across
        pages. Each page orders rows by assignee account ID (unassigned last) and task key.
        The opaque cursor binds the caller, list, week and filters. Scope `tasks:read` for a
        personal API token. Reassignment follows the existing task assignment routes.
      tags: [lists]
      security:
        - sessionCookie: []
        - apiToken: [tasks:read]
      parameters:
        - $ref: '../../components/reporting.yaml#/components/parameters/ReportWeekStart'
        - $ref: '../../components/task.yaml#/components/parameters/StatusFilter'
        - $ref: '../../components/task.yaml#/components/parameters/PriorityFilter'
        - $ref: '../../components/task.yaml#/components/parameters/AssigneeFilter'
        - $ref: '../../components/task.yaml#/components/parameters/LabelFilter'
        - $ref: '../../components/task.yaml#/components/parameters/Search'
        - $ref: '../../components/task.yaml#/components/parameters/DueFrom'
        - $ref: '../../components/task.yaml#/components/parameters/DueTo'
        - $ref: '../../components/task.yaml#/components/parameters/Level'
        - $ref: '../../components/task.yaml#/components/parameters/MilestoneFilter'
        - $ref: '../../components/http.yaml#/components/parameters/Cursor'
        - $ref: '../../components/http.yaml#/components/parameters/Limit'
