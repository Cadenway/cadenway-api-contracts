                $ref: '#/components/schemas/SavedView'
              example:
                id: 019a7007-8b9c-7d0e-8f1a-2b3c4d5e6f03
                listId: 019a7001-2b3c-7d4e-8f5a-6b7c8d9e0f12
                name: Bugs critiques (copie)
                icon: bug
                configuration:
                  layout: list
                  filters:
                    priority:
                      - urgente
                      - haute
                  sort: dueDate
                  groupBy: status
                createdAt: '2026-11-08T10:40:00Z'
                updatedAt: '2026-11-08T10:40:00Z'
                version: 1
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/TasksWriteForbidden'
        '404':
          $ref: '#/components/responses/SavedViewNotFound'
        '409':
          $ref: '#/components/responses/SavedViewCreateConflict'
        '412':
          $ref: '#/components/responses/VersionMismatch'
        '422':
          $ref: '#/components/responses/SavedViewCreateRefused'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/lists/{listId}/custom-fields:
    parameters:
      - $ref: '#/components/parameters/ListId'
    get:
      operationId: listListCustomFields
      summary: List the custom fields visible in a list
      description: |
        Lists active definitions in the list's space in `(position, id)` order. A read role on the
        list suffices, including a direct list grant. The cursor is bound to this list and order.
        The definitions remain readable on a retained archived list.
        An unknown, invisible or deleted list answers `404 list.not-found`.
        Scope `tasks:read` for a personal API token.
      tags: [lists]
      security:
        - sessionCookie: []
        - apiToken: [tasks:read]
      parameters:
        - $ref: '../../components/http.yaml#/components/parameters/Cursor'
        - $ref: '../../components/http.yaml#/components/parameters/Limit'
      responses:
        '200':
          description: A page of active custom fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomFieldDefinitionPage'
              example:
                items:
                  - {
                      id: 019a700a-1234-7567-89ab-cdef01234567,
                      spaceId: 019a7000-1a2b-7c3d-8e4f-5a6b7c8d9e01,
                      name: Points,
                      type: number,
                      position: 0,
                      sprintPoints: true,
                      version: 2,
                    }
                nextCursor: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/TasksReadForbidden'
        '404':
          $ref: '#/components/responses/ListNotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-cw_session
      description: |
        Opaque session token of `openapi/public/auth.yaml`, set by the gateway on sign-in and checked
        with identity-service on every request. A session holds every scope.
    apiToken:
      type: http
      scheme: bearer
      description: |
        Personal API token (`cw_pat_…`) of `openapi/public/api-tokens.yaml`, sent as
        `Authorization: Bearer`. It acts with the rights of its user in the organization it was
        created in, within the scopes each operation lists.
  parameters:
    SheetExportColumn:
      name: sheetSortColumn
      in: query
      required: false
      description: Feuille column key or an active custom field ID for this list's space.
      schema:
        $ref: '../../components/reporting.yaml#/components/schemas/SheetExportColumn'
    SheetExportDirection:
      name: sheetSortDirection
      in: query
      required: false
      description: Sheet export sort direction, ascending when omitted. Requires sheetSortColumn.
      schema:
        $ref: '../../components/reporting.yaml#/components/schemas/SheetExportDirection'
    SavedViewId:
      name: viewId
      in: path
      required: true
      description: ID of the saved view.
      schema:
        type: string
        format: uuid
        examples: [019a7007-8b9c-7d0e-8f1a-2b3c4d5e6f01]
    SpaceId:
      name: spaceId
      in: path
      required: true
      description: Id of the space, as the list of spaces gives it.
      schema:
        type: string
        format: uuid
        examples: [019a7000-1a2b-7c3d-8e4f-5a6b7c8d9e01]
    ListId:
      name: listId
      in: path
      required: true
      description: Id of the list or the sprint.
      schema:
        type: string
        format: uuid
        examples: [019a7001-2b3c-7d4e-8f5a-6b7c8d9e0f12]
    IfMatch:
      name: If-Match
      in: header
      required: false
      description: '`"<version>"` the change was made from, as the `ETag` gave it.'
      schema:
        type: string
        examples: ['"2"']
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        Key of this creation, chosen by the client, a UUID for example; the same key with the same
        body within 24 hours answers what the first request answered.
      schema:
        type: string
        minLength: 1
        maxLength: 255
        examples: [5d0c6f1e-2a3b-4c5d-8e9f-0a1b2c3d4e5f]
    Today:
      $ref: '../../components/task.yaml#/components/parameters/Today'
    ActivityKind:
      $ref: '../../components/task.yaml#/components/parameters/ActivityKind'
    ActorId:
      $ref: '../../components/task.yaml#/components/parameters/ActorId'
  headers:
    ETag:
      description: Version of the list, `"<version>"`.
      schema:
        type: string
    ListLocation:
      description: '`/v1/lists/<listId>`, where the list reads.'
      schema:
        type: string
    RetryAfter:
      description: Seconds to wait before the request can succeed (RFC 9110).
      schema:
        type: integer
        minimum: 1
  examples:
    Sprint14:
      summary: Sprint 14 of the space "Produit"
      value:
        id: 019a7001-2b3c-7d4e-8f5a-6b7c8d9e0f12
        spaceId: 019a7000-1a2b-7c3d-8e4f-5a6b7c8d9e01
        name: Sprint 14
        icon: lightning
        color: violet
        sprint:
          startDate: '2026-11-03'
          endDate: '2026-11-17'
          goal: Livrer la connexion SSO et la page des quotas d’organisation.
        createdAt: '2026-10-30T16:00:00Z'
        version: 2
        organizationAccess: true
        archivedAt: null
        archivedBy: null
        callerRole: edit
    RoleInsufficient:
      summary: A person with "Lecture seule" changes the list
      value:
        type: about:blank
        title: Il faut le droit « Peut modifier » pour cette action.
        status: 403
        code: access.role-insufficient
        details:
          role: view
          requiredRole: edit
    CrossSiteRefused:
      summary: Request from another site
      value:
        type: about:blank
        title: Forbidden
        status: 403
        code: auth.csrf-rejected
    ScopeMissingRead:
      summary: Personal API token without `tasks:read`
      value:
        type: about:blank
        title: Ce jeton n’a pas la portée nécessaire pour cette requête.
        status: 403
        code: auth.scope-missing
        details:
          requiredScopes: [tasks:read]
    ScopeMissingWrite:
      summary: Personal API token without `tasks:write`
      value:
        type: about:blank
        title: Ce jeton n’a pas la portée nécessaire pour cette requête.
        status: 403
        code: auth.scope-missing
        details:
          requiredScopes: [tasks:write]
    OrganizationNotSelected:
      summary: No current organization
      value:
        type: about:blank
        title: Choisissez une organisation pour continuer.
        status: 403
        code: organization.not-selected
    OrganizationMfaRequired:
      summary: Two-step verification required by the organization
      value:
        type: about:blank
        title: 'Cette organisation exige la vérification en deux étapes : configurez-la depuis votre compte.'
        status: 403
        code: organization.mfa-required
        details:
          organizationId: 019a5f3c-8d2e-7c4a-9b1f-3e5d7a9c1b2f
    SprintDatesInvalid:
      summary: End before the start
      value:
        type: about:blank
        title: La fin doit suivre le début.
        status: 422
        code: list.sprint-dates-invalid
    IdempotencyKeyReused:
      summary: Key sent before with another body
      value:
        type: about:blank
        title: Unprocessable Content
        status: 422
        code: idempotency.key-reused
    RateLimited:
      summary: Gateway limit reached
      value:
        type: about:blank
        title: 'Trop de requêtes : réessayez dans un instant.'
        status: 429
        code: rate-limit.exceeded
  responses:
    SprintReportNotFound:
      description: |
        `list.not-found` when the list is not a readable sprint. `organization.not-found`
        follows `ListNotFound`.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          example:
            type: about:blank
            title: Sprint introuvable.
            status: 404
            code: list.not-found
    ExportRowLimitReached:
      description: |
        `list.export-row-limit-reached` when more than 10,000 readable rows match.
        `details.maxRows` is the export limit and the response contains no CSV bytes.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          example:
            type: about:blank
            title: La liste dépasse la limite d’export.
            status: 422
            code: list.export-row-limit-reached
            details: { maxRows: 10000 }
    SavedViewNotFound:
      description: '`saved-view.not-found`, `list.not-found`, `organization.not-found`.'
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          examples:
            problem1:
              value:
                type: about:blank
                title: Vue introuvable.
                status: 404
                code: saved-view.not-found
            problem2:
              value:
                type: about:blank
                title: Liste introuvable.
                status: 404
                code: list.not-found
            problem3:
              value:
                type: about:blank
                title: Organisation introuvable.
                status: 404
                code: organization.not-found
    SavedViewCreateConflict:
      description: '`saved-view.list-archived`, `idempotency.request-in-progress`.'
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          examples:
            problem1:
              value:
                type: about:blank
                title: Cette liste est archivée.
                status: 409
                code: saved-view.list-archived
            problem2:
              value:
                type: about:blank
                title: 'Conflict'
                status: 409
                code: idempotency.request-in-progress
    SavedViewWriteConflict:
      description: '`saved-view.list-archived`.'
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          examples:
            problem1:
              value:
                type: about:blank
                title: Cette liste est archivée.
                status: 409
                code: saved-view.list-archived
    SavedViewCreateRefused:
      description: '`saved-view.limit-reached`, `idempotency.key-reused`.'
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          examples:
            problem1:
              value:
                type: about:blank
                title: La limite de vues est atteinte.
                status: 422
                code: saved-view.limit-reached
            problem2:
              value:
                type: about:blank
                title: 'Unprocessable Content'
                status: 422
                code: idempotency.key-reused
    ListDuplicateConflict:
      description: '`idempotency.request-in-progress`: a request with this key is still running.'
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          example:
            type: about:blank
            title: 'Conflict'
            status: 409
            code: idempotency.request-in-progress
    ListDuplicateRefused:
      description: |
        `list.duplicate-limit-reached`, `idempotency.key-reused`.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          examples:
            problem1:
              value:
                type: about:blank
                title: Cette liste contient trop de tâches à dupliquer.
                status: 422
                code: list.duplicate-limit-reached
            problem2:
              value:
                type: about:blank
                title: 'Unprocessable Content'
                status: 422
                code: idempotency.key-reused
    BadRequest:
      description: |
        The request does not match the schema: `request.invalid`, with one `details.issues` entry
        per failed member (`path` is the dotted path of the member, empty for the body itself).
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          example:
            type: about:blank
            title: Bad Request
            status: 400
            code: request.invalid
            details:
              issues:
                - in: body
                  path: sprint.endDate
                  code: invalid_type
                  message: Required
    Unauthenticated:
      description: |
        - `auth.session-required`: the request carries neither a session cookie nor a bearer token;
        - `auth.session-expired`: the cookie names a session that ended;
        - `auth.api-token-invalid`: the bearer token is unknown, revoked or expired, or its user
          no longer belongs to its organization.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          examples:
            sessionRequired:
              summary: No credential
              value:
                type: about:blank
                title: Connectez-vous pour continuer.
                status: 401
                code: auth.session-required
            sessionExpired:
              summary: Session ended
              value:
                type: about:blank
                title: Session expirée
                status: 401
                code: auth.session-expired
            apiTokenInvalid:
              summary: Personal API token no longer valid
              value:
                type: about:blank
                title: Jeton d’API invalide, expiré ou révoqué.
                status: 401
                code: auth.api-token-invalid
    TasksReadForbidden:
      description: |
        - `auth.scope-missing`: the personal API token lacks `tasks:read`; `details.requiredScopes`
          lists what the route needs;
        - `organization.not-selected`: the session has no current organization;
        - `organization.mfa-required`: the authentication policy of the organization requires
          two-step verification for the role of the caller, who has none; `details.organizationId`
          names it.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          examples:
            scopeMissing:
              $ref: '#/components/examples/ScopeMissingRead'
            organizationNotSelected:
              $ref: '#/components/examples/OrganizationNotSelected'
            organizationMfaRequired:
              $ref: '#/components/examples/OrganizationMfaRequired'
    TasksWriteForbidden:
      description: |
        - `access.role-insufficient`: the caller sees the list, or the space for a creation,
          without `edit` on it; `details.role` is their role there (`null` for a space they see
          only through some of its lists), `details.requiredRole` is `edit`;
        - `auth.scope-missing`: the personal API token lacks `tasks:write`;
        - `organization.not-selected`, `organization.mfa-required`: see `TasksReadForbidden`;
        - `auth.csrf-rejected`: the `Origin` or the `Content-Type` of the request is refused.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          examples:
            roleInsufficient:
              $ref: '#/components/examples/RoleInsufficient'
            scopeMissing:
              $ref: '#/components/examples/ScopeMissingWrite'
            organizationNotSelected:
              $ref: '#/components/examples/OrganizationNotSelected'
            organizationMfaRequired:
              $ref: '#/components/examples/OrganizationMfaRequired'
            crossSiteRefused:
              $ref: '#/components/examples/CrossSiteRefused'
    SpaceNotFound:
      description: |
        - `space.not-found`: no space with this id that the caller sees;
        - `organization.not-found`: the caller no longer belongs to the current organization, or,
          for a few seconds after they joined it, task-service does not know them yet.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          example:
            type: about:blank
            title: Espace introuvable.
            status: 404
            code: space.not-found
    ListNotFound:
      description: |
        - `list.not-found`: no list with this id that the caller sees, a deleted one included;
        - `organization.not-found`: see `SpaceNotFound`.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          example:
            type: about:blank
            title: Liste introuvable.
            status: 404
            code: list.not-found
    RequestInProgress:
      description: '`idempotency.request-in-progress`: a request with the same `Idempotency-Key` still runs.'
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          example:
            type: about:blank
            title: Conflict
            status: 409
            code: idempotency.request-in-progress
    ListCreationRefused:
      description: |
        - `list.sprint-dates-invalid`: the end of the sprint is before its start;
        - `idempotency.key-reused`: the `Idempotency-Key` was sent before with another body.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          examples:
            sprintDatesInvalid:
              $ref: '#/components/examples/SprintDatesInvalid'
            idempotencyKeyReused:
              $ref: '#/components/examples/IdempotencyKeyReused'
    SprintDatesInvalid:
      description: '`list.sprint-dates-invalid`: the end of the sprint is before its start.'
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          examples:
            sprintDatesInvalid:
              $ref: '#/components/examples/SprintDatesInvalid'
    VersionMismatch:
      description: '`request.version-mismatch`: `If-Match` is not the current version; `details.version` is.'
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          example:
            type: about:blank
            title: 'Ces informations ont été modifiées entre-temps : rechargez la page.'
            status: 412
            code: request.version-mismatch
            details:
              version: 3
    RateLimited:
      description: '`rate-limit.exceeded`: the gateway refuses more requests from this session or token for now.'
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          examples:
            rateLimited:
              $ref: '#/components/examples/RateLimited'
    Unavailable:
      description: |
        task-service cannot answer: `upstream.unavailable`, `upstream.unreachable`,
        `upstream.timeout`, `upstream.circuit-open`, `upstream.failed`, `upstream.unauthorized` or
        `upstream.deadline-exceeded`, with `details.service`.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          example:
            type: about:blank
            title: Service Unavailable
            status: 503
            code: upstream.unavailable
            details:
              service: task-service
  schemas:
    CustomFieldDefinitionPage:
      $ref: '../../components/task.yaml#/components/schemas/CustomFieldDefinitionPage'
    SavedView:
      $ref: '../../components/task.yaml#/components/schemas/SavedView'
    SavedViewCreation:
      $ref: '../../components/task.yaml#/components/schemas/SavedViewCreation'
    SavedViewDuplicate:
      $ref: '../../components/task.yaml#/components/schemas/SavedViewDuplicate'
    SavedViewPage:
      $ref: '../../components/task.yaml#/components/schemas/SavedViewPage'
    SavedViewPatch:
      $ref: '../../components/task.yaml#/components/schemas/SavedViewPatch'
    ListDuplicate:
      $ref: '../../components/task.yaml#/components/schemas/ListDuplicate'
    ListDuplication:
      $ref: '../../components/task.yaml#/components/schemas/ListDuplication'
    TaskList:
      $ref: '../../components/task.yaml#/components/schemas/TaskList'
    ListCreation:
      $ref: '../../components/task.yaml#/components/schemas/ListCreation'
    ListPatch:
      $ref: '../../components/task.yaml#/components/schemas/ListPatch'
    ListSummary:
      $ref: '../../components/task.yaml#/components/schemas/ListSummary'
    ActivityEntry:
      $ref: '../../components/task.yaml#/components/schemas/ActivityEntry'
    TaskListPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TaskList'
        nextCursor:
          $ref: '../../components/http.yaml#/components/schemas/NextCursor'
    ActivityPage:
      type: object
      required: [items, nextCursor, total]
      properties:
        items:
          type: array
          description: The entries, the most recent first.
          items:
            $ref: '#/components/schemas/ActivityEntry'
        nextCursor:
          $ref: '../../components/http.yaml#/components/schemas/NextCursor'
        total:
          type: integer
          minimum: 0
          description: Entries that match the filters, on every page ("18 événements").
