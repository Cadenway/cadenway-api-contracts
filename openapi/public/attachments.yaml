openapi: 3.1.0
info:
  title: Cadenway task attachments
  version: 1.0.0
  description: |
    Attachments of tasks the caller may read or edit in the verified organization. The API
    gateway checks current task access in one task-service decision before relaying each request
    to storage-service. A task that is unreadable, in the trash, erased or in another organization
    answers `404 task.not-found`. A readable archived task remains available for reads. Edits
    require the `edit` list role and an active task and list. The upload and download capabilities
    have their own expiration. Send them without application credentials.
  contact:
    name: Cadenway
    url: https://github.com/Cadenway/cadenway-api-contracts
  license:
    name: Proprietary
    url: https://github.com/Cadenway/cadenway-api-contracts/blob/main/LICENSE
  x-consumers:
    - repository: cadenway-api-gateway
      uses: Serves these routes and relays authorized requests to storage-service.
    - repository: cadenway-webapp
      uses: Uploads and previews task attachments with the generated API client.
servers:
  - url: https://api.cadenway.com
    description: Production.
tags:
  - name: attachments
    description: Signed upload and download, attachment metadata and cleanup.
paths:
  /v1/tasks/{taskKey}/attachments:
    parameters:
      - $ref: '#/components/parameters/TaskKey'
    get:
      operationId: listTaskAttachments
      summary: List task attachments
      description: |
        Lists ready attachments in descending `(uploadedAt,id)` order. The opaque cursor is
        bound to the caller's organization, task and ordering. The caller must be able to read
        the task. Readable archived tasks remain accessible. Pending or deleted attachments
        are excluded.
      tags: [attachments]
      security:
        - sessionCookie: []
        - apiToken: [tasks:read]
      parameters:
        - $ref: '../../components/http.yaml#/components/parameters/Cursor'
        - $ref: '../../components/http.yaml#/components/parameters/Limit'
      responses:
        '200':
          description: One page of ready attachments.
          content:
            application/json:
              schema:
                $ref: '../../components/attachments.yaml#/components/schemas/AttachmentPage'
              example:
                items:
                  - id: 019a7004-3b2c-7d4e-8f5a-6b7c8d9e0f15
                    taskKey: CAD-482
                    fileName: maquette-sso.png
                    contentType: image/png
                    sizeBytes: 248320
                    authorUserId: 019a5f3c-9e1f-7b2a-8c3d-4e5f6a7b8c31
                    uploadedAt: '2026-11-08T08:05:00Z'
                    version: 1
                nextCursor: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ReadForbidden'
        '404':
          $ref: '#/components/responses/TaskNotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
    post:
      operationId: startTaskAttachmentUpload
      summary: Reserve a signed task attachment upload
      description: |
        Reserves one upload for the verified editor of the active task. The file-size limit is
        26,214,400 bytes (25 MiB). A larger declared size answers `422 attachment.file-too-large`
        before a URL is issued. The media type must match the registered type of the final file
        extension, ignoring case. The response authorizes a five-minute multipart POST to the opaque
        URL returned by the server. Append all returned form fields unchanged to FormData, then
        append the file as its final part named `file`. Complete the upload before the expiry instant.
        When the returned fields contain a `ticket`, the transfer accepts the exact declared file
        length and media type and can be consumed only once. After an uncertain transfer outcome,
        try completion before starting a new reservation. Keep the URL and fields out of logs.

        While authorization still holds, an equivalent request with the same Idempotency-Key
        replays the original response and Location for 24 hours, with the original URL expiry.
        Use a fresh key for a new reservation.
      tags: [attachments]
      security:
        - sessionCookie: []
        - apiToken: [tasks:write]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../../components/attachments.yaml#/components/schemas/StartAttachmentUpload'
            example: { fileName: maquette-sso.png, contentType: image/png, sizeBytes: 248320 }
      responses:
        '201':
          description: The reserved attachment and temporary upload capability.
          headers:
            Location:
              $ref: '#/components/headers/Location'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '../../components/attachments.yaml#/components/schemas/AttachmentUpload'
              example:
                id: 019a7004-3b2c-7d4e-8f5a-6b7c8d9e0f15
                method: POST
                url: https://files.example.com/fixtures/sso-upload
                fields: { Content-Type: image/png }
                expiresAt: '2026-11-08T08:10:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/WriteForbidden'
        '404':
          $ref: '#/components/responses/AttachmentOrTaskNotFound'
        '409':
          $ref: '#/components/responses/UploadStartConflict'
        '422':
          $ref: '#/components/responses/UploadStartRefused'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/tasks/{taskKey}/attachments/{attachmentId}:
    parameters:
      - $ref: '#/components/parameters/TaskKey'
      - $ref: '#/components/parameters/AttachmentId'
    get:
      operationId: getTaskAttachment
      summary: Read a ready attachment
      description: |
        Returns metadata for a ready attachment of a readable task, including an archived one.
        An attachment pending upload, erased, or associated with another task answers
        `404 attachment.not-found`.
      tags: [attachments]
      security:
        - sessionCookie: []
        - apiToken: [tasks:read]
      responses:
        '200':
          description: Metadata of the ready attachment.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '../../components/attachments.yaml#/components/schemas/TaskAttachment'
              example:
                id: 019a7004-3b2c-7d4e-8f5a-6b7c8d9e0f15
                taskKey: CAD-482
                fileName: maquette-sso.png
                contentType: image/png
                sizeBytes: 248320
                authorUserId: 019a5f3c-9e1f-7b2a-8c3d-4e5f6a7b8c31
                uploadedAt: '2026-11-08T08:05:00Z'
                version: 1
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ReadForbidden'
        '404':
          $ref: '#/components/responses/AttachmentOrTaskNotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
    delete:
      operationId: deleteTaskAttachment
      summary: Delete a task attachment
      description: |
        Deletes a ready attachment from an active task the caller may edit. An optional strong ETag
        checks its current version. The deletion makes the attachment unavailable, records
        `file.deleted.v1` and persists the cleanup request together. Object cleanup is asynchronous.
        Previously issued download URLs can remain valid until expiration or object cleanup.
      tags: [attachments]
      security:
        - sessionCookie: []
        - apiToken: [tasks:write]
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '204':
          description: The attachment is unavailable and cleanup is scheduled.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/WriteForbidden'
        '404':
          $ref: '#/components/responses/AttachmentOrTaskNotFound'
        '409':
          $ref: '#/components/responses/ArchivedTarget'
        '412':
          $ref: '#/components/responses/VersionMismatch'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/tasks/{taskKey}/attachments/{attachmentId}/completion:
    parameters:
      - $ref: '#/components/parameters/TaskKey'
      - $ref: '#/components/parameters/AttachmentId'
    post:
      operationId: completeTaskAttachmentUpload
      summary: Complete a task attachment upload
      description: |
        Completes the reservation of the verified uploader, who must still be able to edit the active
        task. The service checks the staged object length and media type against the reservation,
        and checks its type using the first 4 KiB of bytes. Plain-text files, including logs, require
        a valid UTF-8 prefix without NUL bytes and without a conflicting detected binary type.
        Other types require a matching file signature. The checks apply to the finalized bytes.
        The finalized object is independent of the upload capability, so a repeated POST to the
        upload URL cannot replace it. The first successful completion publishes the attachment
        and records `file.uploaded.v1` together. Repeating successful completion returns the same
        metadata without a second fact. A staged object that is missing before expiry answers
        `409 attachment.upload-not-ready`. Expired pending reservations cannot be completed.

        A first completion that would increase the organization's verified attachment storage
        beyond its plan limit answers `409 attachment.storage-quota-exceeded` without publishing
        the attachment or its event.
      tags: [attachments]
      security:
        - sessionCookie: []
        - apiToken: [tasks:write]
      responses:
        '200':
          description: The ready attachment and its strong ETag.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '../../components/attachments.yaml#/components/schemas/TaskAttachment'
              example:
                id: 019a7004-3b2c-7d4e-8f5a-6b7c8d9e0f15
                taskKey: CAD-482
                fileName: maquette-sso.png
                contentType: image/png
                sizeBytes: 248320
                authorUserId: 019a5f3c-9e1f-7b2a-8c3d-4e5f6a7b8c31
                uploadedAt: '2026-11-08T08:05:00Z'
                version: 1
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/WriteForbidden'
        '404':
          $ref: '#/components/responses/AttachmentOrTaskNotFound'
        '409':
          $ref: '#/components/responses/UploadCompletionConflict'
        '422':
          $ref: '#/components/responses/UploadContentRefused'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/tasks/{taskKey}/attachments/{attachmentId}/download:
    parameters:
      - $ref: '#/components/parameters/TaskKey'
      - $ref: '#/components/parameters/AttachmentId'
    get:
      operationId: getTaskAttachmentDownload
      summary: Sign a task attachment download
      description: |
        Signs a temporary GET for a ready attachment of a readable task. The signed URL is a capability
        on the cookie-free object-storage origin. Clients do not send application credentials to that origin.
        The signed download always uses `Content-Disposition: attachment` with a safely encoded filename.
        The application can provide its own safe preview for supported media. It never renders HTML or SVG
        inline. This operation does not change attachment state.
      tags: [attachments]
      security:
        - sessionCookie: []
        - apiToken: [tasks:read]
      responses:
        '200':
          description: The signed GET URL and its expiry.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '../../components/attachments.yaml#/components/schemas/AttachmentDownload'
              example:
                url: https://files.example.com/fixtures/sso-download
                expiresAt: '2026-11-08T08:10:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ReadForbidden'
        '404':
          $ref: '#/components/responses/AttachmentOrTaskNotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-cw_session
      description: Session held by the caller's browser.
    apiToken:
      type: http
      scheme: bearer
      description: Personal API token with the operation's required task scope.
  parameters:
    TaskKey:
      name: taskKey
      in: path
      required: true
      description: Stable key of the target task.
      schema:
        $ref: '../../components/task.yaml#/components/schemas/TaskKey'
    AttachmentId:
      name: attachmentId
      in: path
      required: true
      description: UUID allocated by the upload request.
      schema:
        $ref: '../../components/attachments.yaml#/components/schemas/AttachmentId'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Client-chosen key for an upload reservation.
      schema:
        type: string
        minLength: 1
        maxLength: 255
    IfMatch:
      name: If-Match
      in: header
      required: false
      description: Strong ETag of the attachment version when a conditional deletion is needed.
      schema:
        type: string
        pattern: '^"[1-9][0-9]*"$'
        examples: ['"1"']
  headers:
    Location:
      required: true
      description: Path of the reserved attachment. Its metadata becomes readable when the upload is complete.
      schema:
        type: string
        examples: ['/v1/tasks/CAD-482/attachments/019a7004-3b2c-7d4e-8f5a-6b7c8d9e0f15']
    NoStore:
      required: true
      description: Prevents HTTP caches from storing a response that carries a signed URL.
      schema:
        type: string
        const: no-store
    ETag:
      required: true
      description: Strong entity tag of the attachment version.
      schema:
        type: string
        examples: ['"1"']
  responses:
    BadRequest:
      description: |
        `request.invalid` with `details.issues`.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
    Unauthenticated:
      description: |
        `auth.session-required`, `auth.session-expired` or `auth.api-token-invalid`.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
    ReadForbidden:
      description: |
        `auth.scope-missing`, `organization.not-selected` or `organization.mfa-required`.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
    WriteForbidden:
      description: |
        `access.role-insufficient`, `auth.scope-missing`, `organization.not-selected`,
        `organization.mfa-required` or `auth.csrf-rejected`. A role refusal reports
        `details.role` and `details.requiredRole` with `edit` as the latter.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
    TaskNotFound:
      description: |
        `task.not-found` for an invisible, trashed or erased task, or `organization.not-found`
        for an inactive membership.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
    AttachmentOrTaskNotFound:
      description: |
        `task.not-found` for an invisible, trashed or erased task, `organization.not-found` for an inactive membership, or `attachment.not-found` for an attachment unavailable for this operation, including a pending reservation of another uploader.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
    ArchivedTarget:
      description: |
        `task.archived` when the target task or its list is archived.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
    UploadStartConflict:
      description: |
        `task.archived` when the target task or its list is archived,
        `idempotency.request-in-progress` while the equivalent reservation is running, or
        `attachment.storage-quota-exceeded` when the organization cannot reserve the declared
        bytes for a temporary upload. This refusal includes no plan, limit or usage details.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          examples:
            requestInProgress:
              value:
                type: about:blank
                title: Conflict
                status: 409
                code: idempotency.request-in-progress
            storageQuotaExceeded:
              value:
                type: about:blank
                title: Cette pièce jointe ne peut pas être reçue.
                status: 409
                code: attachment.storage-quota-exceeded
    UploadCompletionConflict:
      description: |
        `task.archived` when the target task or its list is archived, `attachment.upload-expired`
        for an expired pending reservation, `attachment.upload-not-ready` when the temporary
        object has not arrived, or `attachment.storage-quota-exceeded` when adding the verified
        object would exceed the organization's plan limit.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          example:
            type: about:blank
            title: Cette pièce jointe ne peut pas être reçue.
            status: 409
            code: attachment.storage-quota-exceeded
    UploadStartRefused:
      description: |
        `attachment.file-too-large` above 26,214,400 bytes, `attachment.upload-metadata-mismatch`
        for a missing or unknown extension or one that disagrees with the declared media type,
        or `idempotency.key-reused` for a key previously used with a different request.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
    UploadContentRefused:
      description: |
        `attachment.file-too-large` when the stored object exceeds the limit, or
        `attachment.upload-metadata-mismatch` when its length, declared media type or detected type
        is inconsistent with the reservation.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
    VersionMismatch:
      description: |
        `request.version-mismatch` when the supplied attachment ETag is stale.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
    RateLimited:
      description: |
        `rate-limit.exceeded`. Retry after the delay in `Retry-After`.
      headers:
        Retry-After:
          required: true
          description: Whole seconds before the caller can retry.
          schema:
            type: integer
            minimum: 1
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
    Unavailable:
      description: |
        `storage.unavailable` for a storage dependency failure, or `upstream.unavailable`,
        `upstream.unreachable`, `upstream.timeout`, `upstream.circuit-open`, `upstream.failed`,
        `upstream.unauthorized` or `upstream.deadline-exceeded` for an internal service failure.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
