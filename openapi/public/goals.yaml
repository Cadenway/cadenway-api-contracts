# Quarterly goals and key results served by the API gateway through task-service.
openapi: 3.1.0
info:
  title: Cadenway goals
  version: 1.0.0
  description: |
    Quarter-bound goals and key results in the organization of the authenticated actor.
    Organization goals are readable to current full members and writable to owners or admins.
    Space goals use effective roles on the space itself. A list-only grant does not confer
    a space goal role. Write access requires `edit`. Unknown or inaccessible goals share
    the same not-found response.

    Only the currently readable results contribute to progress. The value of a number result
    is `clamp((currentValue - startValue) / (targetValue - startValue), 0, 1)`, including
    decreasing targets. For equal endpoints the result is complete only when the value is
    equal to those endpoints. A checkbox and a reached milestone are binary. List progress
    is the number of eligible `done` tasks divided by eligible live, noncancelled tasks in
    the readable list. An empty list contributes zero. A readable milestone is reached exactly
    when its status is `done`. Existing list and task read permissions determine target
    visibility, including for archived targets that those reads still expose.

    The goal's progress averages readable results equally and is zero when none are readable.
    Expected progress is `100 * clamp((today - quarterStart) / (quarterEnd - quarterStart), 0, 1)`,
    where date differences are in calendar days. A goal at 100 percent is achieved. Otherwise
    progress at least expected minus 5 percentage points is on track, at least expected minus 20
    is at risk, and lower progress is behind. Health and percentages use unrounded values.

    Version, idempotency, CSRF, rate limiting and problem format follow `openapi/public/tasks.yaml`.
  contact:
    name: Cadenway
    url: https://github.com/Cadenway/cadenway-api-contracts
  license:
    name: Proprietary
    url: https://github.com/Cadenway/cadenway-api-contracts/blob/main/LICENSE
  x-consumers:
    - repository: cadenway-api-gateway
      uses: Relays the routes to openapi/internal/task-service.yaml through its generated client.
    - repository: cadenway-webapp
      uses: Calls the routes through @cadenway/api-client for Objectifs.
servers:
  - url: https://api.cadenway.com
    description: Production.
  - url: https://api.staging.cadenway.com
    description: Staging.
tags:
  - name: goals
    description: Quarterly goals and their key results.
paths:
  /v1/goals:
    parameters:
      - $ref: '../../components/http.yaml#/components/parameters/IfOrganizationMatch'
    get:
      operationId: listGoals
      summary: List the visible goals for a quarter
      description: |
        Returns goals the caller can currently read, in `(createdAt, id)` descending order. The cursor belongs to
        the caller, organization, quarter and `today` of the request. `summary` describes all readable goals of
        that quarter before paging, using the same visible results as the returned goals.
      tags: [goals]
      security:
        - sessionCookie: []
        - apiToken: [tasks:read]
      parameters:
        - $ref: '#/components/parameters/GoalQuarter'
        - $ref: '#/components/parameters/GoalToday'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: The page of visible goals and quarter summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoalPage'
              examples:
                atelierNord:
                  $ref: '#/components/examples/EmptyQuarter'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/TasksReadForbidden'
        '404':
          $ref: '#/components/responses/OrganizationNotFound'
        '412':
          $ref: '../../components/http.yaml#/components/responses/OrganizationContextChanged'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
    post:
      operationId: createGoal
      summary: Create a goal
      description: |
        Creates the goal and all supplied initial key results in a single write. `spaceId` sets the scope
        and stays fixed. With `spaceId` omitted or `null`, an organization owner or admin creates an
        organization goal. Otherwise the caller needs effective `edit` on the space itself. The owner
        must be a current member eligible to read the selected scope. The due date falls within the
        selected quarter. An optional idempotency key replays the original response for 24 hours.
      tags: [goals]
      security:
        - sessionCookie: []
        - apiToken: [tasks:write]
      parameters:
        - $ref: '#/components/parameters/GoalToday'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoalCreation'
            example:
              name: Lancer le SSO pour les entreprises
              ownerUserId: 019a5f3c-8d2e-7c4a-9b1f-3e5d7a9c1b30
              dueDate: '2026-12-31'
              quarter: 2026-Q4
              spaceId: 019a7000-1a2b-7c3d-8e4f-5a6b7c8d9e01
              results:
                - kind: list-progress
                  label: Tâches du Sprint 14 terminées
                  listId: 019a7001-2b3c-7d4e-8f5a-6b7c8d9e0f12
                - kind: number
                  label: Organisations clientes connectées en SSO
                  startValue: 0
                  currentValue: 4
                  targetValue: 10
                - kind: checkbox
                  label: Documentation SSO publiée
                  checked: false
                - kind: milestone
                  label: Démo SSO aux clients
                  taskKey: CAD-580
      responses:
        '201':
          description: The goal exists.
          headers:
            Location:
              $ref: '#/components/headers/GoalLocation'
            ETag:
              $ref: '#/components/headers/GoalETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Goal'
              examples:
                atelierNord:
                  $ref: '#/components/examples/GoalWithResults'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/GoalWriteForbidden'
        '404':
          $ref: '#/components/responses/SpaceNotFound'
        '409':
          $ref: '#/components/responses/RequestInProgress'
        '412':
          $ref: '../../components/http.yaml#/components/responses/OrganizationContextChanged'
        '422':
          $ref: '#/components/responses/GoalCreationRefused'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/goals/{goalId}:
    parameters:
      - $ref: '../../components/http.yaml#/components/parameters/IfOrganizationMatch'
    get:
      operationId: getGoal
      summary: Read a goal and its visible results
      description: |
        Returns the goal and the results whose linked targets the caller can currently read. Progress and
        health use exactly this visible result set. The version identifies the stored goal aggregate and
        changes only after a write.
      tags: [goals]
      security:
        - sessionCookie: []
        - apiToken: [tasks:read]
      parameters:
        - $ref: '#/components/parameters/GoalId'
        - $ref: '#/components/parameters/GoalToday'
      responses:
        '200':
          description: The readable goal.
          headers:
            ETag:
              $ref: '#/components/headers/GoalETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Goal'
              examples:
                atelierNord:
                  $ref: '#/components/examples/GoalWithResults'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/TasksReadForbidden'
        '404':
          $ref: '#/components/responses/GoalNotFound'
        '412':
          $ref: '../../components/http.yaml#/components/responses/OrganizationContextChanged'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
    patch:
      operationId: updateGoal
      summary: Update a goal
      description: |
        Applies a merge patch to the name, owner or due date, using the current goal's scope to authorize
        the write. The owner must remain eligible to read that scope and the due date must fall in the
        goal's immutable quarter. When provided, `If-Match` checks the version of the goal.
      tags: [goals]
      security:
        - sessionCookie: []
        - apiToken: [tasks:write]
      parameters:
        - $ref: '#/components/parameters/GoalId'
        - $ref: '#/components/parameters/GoalToday'
        - $ref: '#/components/parameters/GoalIfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoalPatch'
            example:
              dueDate: '2026-12-15'
      responses:
        '200':
          description: The updated goal.
          headers:
            ETag:
              $ref: '#/components/headers/GoalETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Goal'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/GoalWriteForbidden'
        '404':
          $ref: '#/components/responses/GoalNotFound'
        '412':
          $ref: '#/components/responses/GoalVersionMismatch'
        '422':
          $ref: '#/components/responses/GoalChangeRefused'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
    delete:
      operationId: deleteGoal
      summary: Delete a goal
      description: |
        Deletes the goal and its results in one write. Linked lists and milestone tasks stay available.
        When provided, `If-Match` checks the version of the goal.
      tags: [goals]
      security:
        - sessionCookie: []
        - apiToken: [tasks:write]
      parameters:
        - $ref: '#/components/parameters/GoalId'
        - $ref: '#/components/parameters/GoalIfMatch'
      responses:
        '204':
          description: The goal was deleted.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/GoalWriteForbidden'
        '404':
          $ref: '#/components/responses/GoalNotFound'
        '412':
          $ref: '#/components/responses/GoalVersionMismatch'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/goals/{goalId}/results:
    parameters:
      - $ref: '../../components/http.yaml#/components/parameters/IfOrganizationMatch'
    post:
      operationId: createGoalResult
      summary: Add a result to a goal
      description: |
        Adds a result to a writable goal. A linked list or milestone task must be readable by the
        caller in the same organization. Each goal holds at most 20 stored results. `If-Match`
        checks the goal's version, and an optional idempotency key replays the original response for
        24 hours.
      tags: [goals]
      security:
        - sessionCookie: []
        - apiToken: [tasks:write]
      parameters:
        - $ref: '#/components/parameters/GoalId'
        - $ref: '#/components/parameters/GoalIfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoalResultCreation'
            example:
              kind: list-progress
              label: Tâches du Sprint 14 terminées
              listId: 019a7001-2b3c-7d4e-8f5a-6b7c8d9e0f12
      responses:
        '201':
          description: The result exists.
          headers:
            Location:
              $ref: '#/components/headers/GoalResultLocation'
            ETag:
              $ref: '#/components/headers/GoalETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoalResult'
              examples:
                atelierNord:
                  $ref: '#/components/examples/Sprint14Result'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/GoalWriteForbidden'
        '404':
          $ref: '#/components/responses/GoalNotFound'
        '409':
          $ref: '#/components/responses/RequestInProgress'
        '412':
          $ref: '#/components/responses/GoalVersionMismatch'
        '422':
          $ref: '#/components/responses/GoalResultCreationRefused'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/goals/{goalId}/results/{resultId}:
    parameters:
      - $ref: '../../components/http.yaml#/components/parameters/IfOrganizationMatch'
    get:
      operationId: getGoalResult
      summary: Read a goal result
      description: |
        Returns a result on a readable goal. A linked result is returned only while its current target
        is readable. The ETag identifies the parent goal's stored version.
      tags: [goals]
      security:
        - sessionCookie: []
        - apiToken: [tasks:read]
      parameters:
        - $ref: '#/components/parameters/GoalId'
        - $ref: '#/components/parameters/ResultId'
      responses:
        '200':
          description: The readable result.
          headers:
            ETag:
              $ref: '#/components/headers/GoalETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoalResult'
              examples:
                atelierNord:
                  $ref: '#/components/examples/Sprint14Result'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/TasksReadForbidden'
        '404':
          $ref: '#/components/responses/GoalResultNotFound'
        '412':
          $ref: '../../components/http.yaml#/components/responses/OrganizationContextChanged'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
    patch:
      operationId: updateGoalResult
      summary: Update a goal result
      description: |
        Applies a merge patch to a result the caller can read on a writable goal. Every kind accepts a
        label. Only a number accepts `currentValue`, and only a checkbox accepts `checked`. The kind,
        numeric endpoints and linked target are fixed. Use result deletion and creation to replace a
        link. A linked target must stay readable through the write. `If-Match` checks the goal's
        version.
      tags: [goals]
      security:
        - sessionCookie: []
        - apiToken: [tasks:write]
      parameters:
        - $ref: '#/components/parameters/GoalId'
        - $ref: '#/components/parameters/ResultId'
        - $ref: '#/components/parameters/GoalIfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoalResultPatch'
            example:
              label: Tâches SSO terminées
      responses:
        '200':
          description: The updated result.
          headers:
            ETag:
              $ref: '#/components/headers/GoalETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoalResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/GoalWriteForbidden'
        '404':
          $ref: '#/components/responses/GoalResultNotFound'
        '412':
          $ref: '#/components/responses/GoalVersionMismatch'
        '422':
          $ref: '#/components/responses/GoalResultChangeRefused'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
    delete:
      operationId: deleteGoalResult
      summary: Delete a goal result
      description: |
        Removes a readable result from a writable goal. A linked target must stay readable
        through the write. `If-Match` checks the goal's version.
      tags: [goals]
      security:
        - sessionCookie: []
        - apiToken: [tasks:write]
      parameters:
        - $ref: '#/components/parameters/GoalId'
        - $ref: '#/components/parameters/ResultId'
        - $ref: '#/components/parameters/GoalIfMatch'
      responses:
        '204':
          description: The result was deleted.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/GoalWriteForbidden'
        '404':
          $ref: '#/components/responses/GoalResultNotFound'
        '412':
          $ref: '#/components/responses/GoalVersionMismatch'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-cw_session
      description: Opaque session held by the caller's browser.
    apiToken:
      type: http
      scheme: bearer
      description: Personal API token with the operation's required task scope.
  parameters:
    GoalToday:
      name: today
      in: query
      required: true
      description: |
        The caller's calendar day. Expected goal progress is
        `100 * clamp((today - quarterStart) / (quarterEnd - quarterStart), 0, 1)`,
        using calendar days. Compare expected and actual percentages before display rounding.
      schema:
        type: string
        format: date
        examples: ['2026-11-08']
    GoalIfMatch:
      name: If-Match
      in: header
      required: false
      description: Strong ETag of the goal aggregate underlying the change.
      schema:
        type: string
        examples: ['"12"']
    GoalQuarter:
      name: quarter
      in: query
      required: true
      description: Calendar quarter whose goals are requested.
      schema:
        $ref: '../../components/goals.yaml#/components/schemas/GoalQuarter'
    GoalId:
      name: goalId
      in: path
      required: true
      description: UUID of the goal.
      schema:
        type: string
        format: uuid
        examples: [019a7008-8b9c-7d0e-8f1a-2b3c4d5e6f01]
    ResultId:
      name: resultId
      in: path
      required: true
      description: UUID of the key result within the goal.
      schema:
        type: string
        format: uuid
        examples: [019a7008-8b9c-7d0e-8f1a-2b3c4d5e6f02]
    Cursor:
      $ref: '../../components/http.yaml#/components/parameters/Cursor'
    Limit:
      $ref: '../../components/http.yaml#/components/parameters/Limit'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Client-chosen key whose matching request replays the original response for 24 hours.
      schema:
        type: string
        minLength: 1
        maxLength: 255
        examples: [5d0c6f1e-2a3b-4c5d-8e9f-0a1b2c3d4e5f]
  headers:
    GoalETag:
      description: Strong validator of the goal aggregate, including its results.
      schema:
        type: string
        examples: ['"1"']
    GoalLocation:
      description: Public URI reference for the new goal, including the creation request's today value.
      schema:
        type: string
        format: uri-reference
        examples: ['/v1/goals/019a7008-8b9c-7d0e-8f1a-2b3c4d5e6f01?today=2026-11-08']
    GoalResultLocation:
      description: Public URI reference for the new key result.
      schema:
        type: string
        format: uri-reference
        examples:
          [
            /v1/goals/019a7008-8b9c-7d0e-8f1a-2b3c4d5e6f01/results/019a7008-8b9c-7d0e-8f1a-2b3c4d5e6f02,
          ]
  responses:
    BadRequest:
      description: |
        `request.invalid`: the request does not match the contract. `details.issues` identifies
        invalid parameters or body fields.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          example:
            type: about:blank
            title: Bad Request
            status: 400
            code: request.invalid
    Unauthenticated:
      description: |
        `auth.session-required`, `auth.session-expired` or `auth.api-token-invalid`.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          example:
            type: about:blank
            title: 'Connectez-vous pour continuer.'
            status: 401
            code: auth.session-required
    TasksReadForbidden:
      description: |
        - `auth.scope-missing`: the personal token lacks `tasks:read`.
        - `organization.not-selected`: the session has no current organization.
        - `organization.mfa-required`: the organization requires two-step verification for the caller.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          example:
            type: about:blank
            title: 'Ce jeton n’a pas la portée nécessaire pour cette requête.'
            status: 403
            code: auth.scope-missing
            details:
              requiredScopes: [tasks:read]
    OrganizationNotFound:
      description: |
        `organization.not-found`: task-service does not recognize a current membership for the caller.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          example:
            type: about:blank
            title: 'Organisation introuvable.'
            status: 404
            code: organization.not-found
    SpaceNotFound:
      description: |
        - `space.not-found`: the goal's requested space is unknown, removed or inaccessible.
        - `organization.not-found`: the caller is no longer a member of the current organization.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          example:
            type: about:blank
            title: 'Espace introuvable.'
            status: 404
            code: space.not-found
    RequestInProgress:
      description: |
        `idempotency.request-in-progress`: a request with the same key is running.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          example:
            type: about:blank
            title: Conflict
            status: 409
            code: idempotency.request-in-progress
    RateLimited:
      description: |
        `rate-limit.exceeded`: the request exceeds the gateway's limit for the caller.
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema:
            type: integer
            minimum: 1
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          example:
            type: about:blank
            title: 'Trop de requêtes : réessayez dans un instant.'
            status: 429
            code: rate-limit.exceeded
    Unavailable:
      description: |
        task-service cannot answer. `details.service` identifies it. Possible codes are
        `upstream.unavailable`, `upstream.unreachable`, `upstream.timeout`, `upstream.circuit-open`,
        `upstream.failed`, `upstream.unauthorized` and `upstream.deadline-exceeded`.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          example:
            type: about:blank
            title: 'Service Unavailable'
            status: 503
            code: upstream.unavailable
            details:
              service: task-service
    GoalVersionMismatch:
      description: |
        - `request.version-mismatch`: If-Match names an older goal version. `details.version` gives the current version.
        - `organization.context-changed` when the expected organization differs from the verified
          context. This problem has no details or ETag and is returned with
          `Cache-Control: private, no-store`.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          examples:
            versionMismatch:
              value:
                type: about:blank
                title: 'Ces informations ont été modifiées entre-temps : rechargez la page.'
                status: 412
                code: request.version-mismatch
                details:
                  version: 13
            organizationContextChanged:
              $ref: '../../components/http.yaml#/components/examples/OrganizationContextChanged'
    GoalWriteForbidden:
      description: |
        - `organization.role-forbidden`: only an owner or admin writes organization goals.
        - `access.role-insufficient`: the caller sees the space without `edit`.
          `details.role` and `details.requiredRole` describe the effective and required roles.
        - `auth.scope-missing`: the personal token lacks `tasks:write`.
        - `organization.not-selected`, `organization.mfa-required`: see the existing task routes.
        - `auth.csrf-rejected`: the origin or content type is refused.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          examples:
            organizationRoleForbidden:
              value:
                type: about:blank
                title: 'Votre rôle ne permet pas cette action.'
                status: 403
                code: organization.role-forbidden
            roleInsufficient:
              value:
                type: about:blank
                title: 'Il faut le droit « Peut modifier » pour cette action.'
                status: 403
                code: access.role-insufficient
                details:
                  role: view
                  requiredRole: edit
    GoalNotFound:
      description: |
        - `goal.not-found`: the goal is unknown or hidden in the current organization.
        - `organization.not-found`: the organization is unknown or the caller is no longer a member.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          examples:
            goalNotFound:
              value:
                type: about:blank
                title: 'Objectif introuvable.'
                status: 404
                code: goal.not-found
    GoalResultNotFound:
      description: |
        - `goal.not-found`: the parent goal is unknown or hidden.
        - `goal.result-not-found`: the result is unknown, belongs to another goal or links an unavailable target.
        - `organization.not-found`: the organization is unknown or the caller is no longer a member.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          examples:
            resultNotFound:
              value:
                type: about:blank
                title: 'Résultat clé introuvable.'
                status: 404
                code: goal.result-not-found
    GoalCreationRefused:
      description: |
        - `goal.owner-ineligible`: the selected owner cannot read the goal's scope.
        - `goal.due-date-outside-quarter`: the due date falls outside the quarter.
        - `goal.result-target-invalid`: an initial target is unavailable or unsuitable.
        - `idempotency.key-reused`: the key was used with another request.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          examples:
            ownerIneligible:
              value:
                type: about:blank
                title: 'Le responsable choisi ne peut pas lire cet objectif.'
                status: 422
                code: goal.owner-ineligible
            dueDate:
              value:
                type: about:blank
                title: 'L’échéance doit appartenir au trimestre.'
                status: 422
                code: goal.due-date-outside-quarter
    GoalChangeRefused:
      description: |
        - `goal.owner-ineligible`: the selected owner cannot read the goal's scope.
        - `goal.due-date-outside-quarter`: the due date falls outside the quarter.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          examples:
            dueDate:
              value:
                type: about:blank
                title: 'L’échéance doit appartenir au trimestre.'
                status: 422
                code: goal.due-date-outside-quarter
    GoalResultCreationRefused:
      description: |
        - `goal.result-target-invalid`: the supplied target is unknown, unavailable or unsuitable.
        - `goal.result-limit-reached`: the goal already has 20 stored results.
        - `idempotency.key-reused`: the key was used with another request.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          examples:
            targetInvalid:
              value:
                type: about:blank
                title: 'La cible de ce résultat est indisponible.'
                status: 422
                code: goal.result-target-invalid
            resultLimit:
              value:
                type: about:blank
                title: 'Cet objectif a atteint sa limite de résultats clés.'
                status: 422
                code: goal.result-limit-reached
    GoalResultChangeRefused:
      description: |
        `goal.result-patch-invalid`: the merge patch writes a member unsupported by the current kind.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          examples:
            patchInvalid:
              value:
                type: about:blank
                title: 'Cette modification ne convient pas au type de résultat.'
                status: 422
                code: goal.result-patch-invalid
