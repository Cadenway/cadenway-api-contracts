# Public intake is served by api-gateway, with files stored by storage-service.
openapi: 3.1.0
info:
  title: Cadenway public intake
  version: 1.0.0
  description: |
    List editors configure and publish an intake form. An opaque publication key allows anyone
    with the public link to open that form and submit a request. The projected form only
    contains the text and field settings intended for applicants.

    Management uses the current organization of the session or personal API token and the
    caller's current list role. Anonymous access resolves the form from the publication key
    and ignores cookies and personal API tokens. The key does not grant access to tasks or
    lists. An applicant's upload reservations are additionally bound to a private draft key.
    Editors choose what text they publish, and the default text contains no list or space
    metadata.

    The gateway applies its trusted client IP limit before lookup on the anonymous routes,
    including for unknown keys. The defaults are 30 form reads and 10 submissions per minute
    per IP, in separate buckets. Upload mutations have their own per-IP bucket. Public
    responses and responses containing the management configuration or contact email use
    `Cache-Control: no-store`. Publication keys, draft keys, contact email and signed transfer
    details are redacted from request logs and tracing attributes. Problem instances use a
    request reference without either key, and validation issues identify fields without values.
  contact:
    name: Cadenway
    url: https://github.com/Cadenway/cadenway-api-contracts
  license:
    name: Proprietary
    url: https://github.com/Cadenway/cadenway-api-contracts/blob/main/LICENSE
  x-consumers:
    - repository: cadenway-api-gateway
      uses: Serves these routes, checks task scopes for management, rate-limits anonymous requests and relays operations to task-service and storage-service.
    - repository: cadenway-webapp
      uses: Configures list forms, serves the applicant page and its signed uploads, and displays contact email to task editors through @cadenway/api-client.
servers:
  - url: https://api.cadenway.com
    description: Production.
  - url: https://api.staging.cadenway.com
    description: Staging.
tags:
  - name: intake-management
    description: List form settings and protected task contact information.
  - name: public-intake
    description: Published forms, applicant uploads and submissions.
paths:
  /v1/lists/{listId}/intake-form:
    parameters:
      - $ref: '#/components/parameters/IntakeListId'
    get:
      operationId: getIntakeFormConfiguration
      summary: Read the intake configuration of a list
      description: |
        Requires `edit` on the list and `tasks:read` for a personal API token. A list without
        changes to its configuration starts with the default draft at version 1. Its publication
        key is null. When initializing the draft, the service selects `triage` if available,
        with `todo` as fallback, and leaves the assignee null. Later status changes can make
        the saved default invalid. An editor can read settings while the list is archived.
      tags: [intake-management]
      security:
        - sessionCookie: []
        - apiToken: [tasks:read]
      responses:
        '200':
          $ref: '#/components/responses/IntakeConfiguration'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/IntakeEditorReadForbidden'
        '404':
          $ref: '#/components/responses/IntakeListNotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
    patch:
      operationId: updateIntakeFormConfiguration
      summary: Change intake settings
      description: |
        Applies a JSON Merge Patch to editable settings. Requires `edit` and the current strong
        form `ETag` in `If-Match`. The status must be available for a normal task creation
        with these settings, and a non-null assignee must still be eligible on the list. An
        effective change increments the configuration version once. An empty patch keeps the
        version. A published form keeps its key and exposes the new settings after commit.
      tags: [intake-management]
      security:
        - sessionCookie: []
        - apiToken: [tasks:write]
      parameters:
        - $ref: '#/components/parameters/RequiredIntakeIfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../../components/intake.yaml#/components/schemas/IntakeFormPatch'
            example:
              title: Déposer une demande
              fields: { description: required, contactEmail: optional }
              defaultStatus: triage
              defaultAssigneeId: null
      responses:
        '200':
          $ref: '#/components/responses/IntakeConfiguration'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/IntakeEditorWriteForbidden'
        '404':
          $ref: '#/components/responses/IntakeListNotFound'
        '409':
          $ref: '#/components/responses/IntakeListArchived'
        '412':
          $ref: '#/components/responses/IntakeVersionMismatch'
        '422':
          $ref: '#/components/responses/IntakeDefaultsInvalid'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/lists/{listId}/intake-form/publish:
    parameters:
      - $ref: '#/components/parameters/IntakeListId'
    post:
      operationId: publishIntakeForm
      summary: Publish an intake form
      description: |
        Requires `edit` on an active list. Revalidates the task defaults under the same lock
        as publication. Publishing a disabled form creates a new key and increments the
        configuration version. Repeating publication with unchanged valid settings keeps the
        current key and version. The returned key can be used to construct the applicant link.
      tags: [intake-management]
      security:
        - sessionCookie: []
        - apiToken: [tasks:write]
      parameters:
        - $ref: '#/components/parameters/IntakeIfMatch'
      responses:
        '200':
          $ref: '#/components/responses/IntakeConfiguration'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/IntakeEditorWriteForbidden'
        '404':
          $ref: '#/components/responses/IntakeListNotFound'
        '409':
          $ref: '#/components/responses/IntakeListArchived'
        '412':
          $ref: '#/components/responses/IntakeVersionMismatch'
        '422':
          $ref: '#/components/responses/IntakeDefaultsInvalid'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/lists/{listId}/intake-form/publication:
    parameters:
      - $ref: '#/components/parameters/IntakeListId'
    delete:
      operationId: disableIntakeForm
      summary: Disable a published intake form
      description: |
        Requires `edit` on the list. Revokes the key immediately and keeps the draft,
        including when the list is archived. Any subsequent publication has a new key.
        Repeating the action on an already disabled form keeps the version.
      tags: [intake-management]
      security:
        - sessionCookie: []
        - apiToken: [tasks:write]
      parameters:
        - $ref: '#/components/parameters/IntakeIfMatch'
      responses:
        '204':
          description: The draft is unpublished.
          headers:
            ETag:
              $ref: '#/components/headers/IntakeETag'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/IntakeEditorWriteForbidden'
        '404':
          $ref: '#/components/responses/IntakeListNotFound'
        '412':
          $ref: '#/components/responses/IntakeVersionMismatch'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/tasks/{taskKey}/intake-contact:
    parameters:
      - $ref: '#/components/parameters/IntakeTaskKey'
    get:
      operationId: getTaskIntakeContact
      summary: Read a requester's contact email
      description: |
        Requires `edit` on the task's current list and `tasks:read` for a personal API token.
        Returns null for a task without a stored intake contact. Storage and retention follow
        the task and its current placement. The contact is kept outside ordinary task reads,
        task descriptions, logs, event payloads and receipts.
      tags: [intake-management]
      security:
        - sessionCookie: []
        - apiToken: [tasks:read]
      responses:
        '200':
          description: The independently stored contact, if any.
          headers:
            Cache-Control:
              $ref: '#/components/headers/IntakeNoStore'
          content:
            application/json:
              schema:
                $ref: '../../components/intake.yaml#/components/schemas/TaskIntakeContact'
              example:
                contactEmail: prenom.nom@example.com
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/IntakeEditorReadForbidden'
        '404':
          $ref: '#/components/responses/IntakeTaskNotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/intake-forms/{publicKey}:
    parameters:
      - $ref: '#/components/parameters/IntakePublicKey'
    get:
      operationId: getPublicIntakeForm
      summary: Read the published applicant form
      description: |
        Returns the applicant projection of a valid publication on an active list. The
        projection includes only the editor's public text and field settings. Invalidated,
        unknown, disabled, stale, archived or removed forms all answer the same generic 404.
        Archive suspends access to the publication. Deletion and explicit disable revoke the
        key, which stays revoked after a list restore or a new publication.
      tags: [public-intake]
      security: []
      responses:
        '200':
          description: The applicant's form.
          headers:
            Cache-Control:
              $ref: '#/components/headers/IntakeNoStore'
          content:
            application/json:
              schema:
                $ref: '../../components/intake.yaml#/components/schemas/PublicIntakeForm'
              example:
                title: Déposer une demande
                description: Décrivez votre besoin en quelques mots.
                fields:
                  description: optional
                  priority: optional
                  dueDate: optional
                  contactEmail: required
        '404':
          $ref: '#/components/responses/PublicIntakeNotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/intake-forms/{publicKey}/submissions:
    parameters:
      - $ref: '#/components/parameters/IntakePublicKey'
    post:
      operationId: submitPublicIntakeForm
      summary: Submit a request through a published form
      description: |
        The publication supplies the organization, list, allowed fields and task defaults.
        The request contract accepts only applicant-visible fields. The title is always
        required. Missing required fields and supplied disabled fields are reported by field
        in `details.issues`. An empty required text field is invalid after trimming.

        When the form allows attachments, submit the IDs of up to five completed uploads
        from the same draft, using `Intake-Draft-Key` and `Idempotency-Key`. Changing only
        the order or hexadecimal case of the same attachment IDs is a matching replay.
        The draft key requires an idempotency key even if no attachment IDs are supplied.
        A submission without either a draft key or attachment IDs retains the ordinary
        text-only behavior. A form that requires attachments refuses a submission with none.

        The producer rechecks the active publication and its defaults before committing a
        normal task, any contact, an opaque receipt and the selected upload claims in one
        transaction. A committed draft releases its unselected reservations. Attachment
        metadata becomes available only to authorized members through the task attachment API.
        A valid publication replays a matching request with the same idempotency key for
        24 hours, using the original receipt even if its successful draft is no longer open.
        The receipt carries no attachment metadata, public task link or contact email.
      tags: [public-intake]
      security: []
      parameters:
        - $ref: '#/components/parameters/IntakeIdempotencyKey'
        - $ref: '#/components/parameters/IntakeDraftKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../../components/intake.yaml#/components/schemas/IntakeSubmission'
            example:
              title: Accès SSO pour Atelier Nord
              description: Activer la connexion pour l’équipe du sprint 14.
              contactEmail: prenom.nom@example.com
      responses:
        '200':
          description: The submission is accepted and its task is committed. A matching replay returns the same acknowledgment.
          headers:
            Cache-Control:
              $ref: '#/components/headers/IntakeNoStore'
          content:
            application/json:
              schema:
                $ref: '../../components/intake.yaml#/components/schemas/IntakeReceipt'
              example:
                receipt: T3Wf3e3VdFKPIsnP7t9m2kUuwtHTU2yXrP-Ekq11BRg
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/IntakeDraftNotFound'
        '409':
          $ref: '#/components/responses/IntakeAttachmentSubmissionConflict'
        '422':
          $ref: '#/components/responses/IntakeSubmissionRefused'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/intake-forms/{publicKey}/attachments:
    parameters:
      - $ref: '#/components/parameters/IntakePublicKey'
    post:
      operationId: startPublicIntakeAttachmentUpload
      summary: Reserve a signed upload for an applicant's draft
      description: |
        Reserve one upload on an active publication that allows attachments. Generate a
        private draft key once for this submission and keep it with the draft. Use a distinct
        idempotency key for each new file. The draft starts with its first reservation and
        accepts up to five active reservations within its 30-minute lifetime.

        The signed multipart POST permits up to 25 MiB and expires after five minutes at
        most, bounded by the draft expiry. Append the returned fields unchanged to FormData,
        then append the file as the final part named `file`. Call completion after transfer.
        The declared media type must match the registered final filename extension. The
        temporary destination does not identify the organization, list or publication.

        The service retains the reservation key for 24 hours. While the draft and publication
        remain eligible, a matching start replays the original signed response without
        extending its expiry. Use a new reservation for another upload.
      tags: [public-intake]
      security: []
      parameters:
        - $ref: '#/components/parameters/RequiredIntakeDraftKey'
        - $ref: '#/components/parameters/IntakeAttachmentIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../../components/attachments.yaml#/components/schemas/StartAttachmentUpload'
            example: { fileName: capture-sso.png, contentType: image/png, sizeBytes: 184320 }
      responses:
        '201':
          description: The reservation and its temporary upload capability.
          headers:
            Location:
              $ref: '#/components/headers/IntakeAttachmentLocation'
            Cache-Control:
              $ref: '#/components/headers/IntakeAttachmentNoStore'
          content:
            application/json:
              schema:
                $ref: '../../components/attachments.yaml#/components/schemas/AttachmentUpload'
              example:
                id: 019a7004-3b2c-7d4e-8f5a-6b7c8d9e0f15
                method: POST
                url: https://files.example.com/fixtures/intake-upload
                fields: { Content-Type: image/png }
                expiresAt: '2026-11-20T14:05:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/IntakeDraftNotFound'
        '409':
          $ref: '#/components/responses/IntakeSubmissionInProgress'
        '422':
          $ref: '#/components/responses/IntakeAttachmentStartRefused'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/IntakeAttachmentUnavailable'
  /v1/intake-forms/{publicKey}/attachments/{attachmentId}:
    parameters:
      - $ref: '#/components/parameters/IntakePublicKey'
      - $ref: '#/components/parameters/IntakeAttachmentId'
    delete:
      operationId: abandonPublicIntakeAttachmentUpload
      summary: Release an applicant's unused upload
      description: |
        Release a reservation of the same live publication and draft. This frees its slot
        and schedules object cleanup. A matching repeat of an abandoned upload succeeds
        while the draft and publication remain eligible. A claimed file cannot be removed
        by an applicant. Files not selected at submission or left in an expired draft are
        released without a separate request.
      tags: [public-intake]
      security: []
      parameters:
        - $ref: '#/components/parameters/RequiredIntakeDraftKey'
      responses:
        '204':
          description: The reservation has been released.
          headers:
            Cache-Control:
              $ref: '#/components/headers/IntakeAttachmentNoStore'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/IntakeDraftNotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/intake-forms/{publicKey}/attachments/{attachmentId}/completion:
    parameters:
      - $ref: '#/components/parameters/IntakePublicKey'
      - $ref: '#/components/parameters/IntakeAttachmentId'
    post:
      operationId: completePublicIntakeAttachmentUpload
      summary: Verify an applicant's uploaded file
      description: |
        Verify the file from the temporary upload on this same live publication and draft.
        A matching retry returns the same acknowledgement without another verification
        fact. Submission can briefly answer `409 attachment.upload-not-ready` while the
        verification reaches task-service. Retry submission with the same idempotency key.
        A first verification that would exceed the receiving organization's storage limit
        answers `409 attachment.storage-quota-exceeded` and does not make the file available
        for submission. The acknowledgement gives the applicant no metadata or download access.
      tags: [public-intake]
      security: []
      parameters:
        - $ref: '#/components/parameters/RequiredIntakeDraftKey'
      responses:
        '200':
          description: The upload was verified for the current draft.
          headers:
            Cache-Control:
              $ref: '#/components/headers/IntakeAttachmentNoStore'
          content:
            application/json:
              schema:
                $ref: '../../components/intake.yaml#/components/schemas/IntakeAttachmentCompletion'
              example: { id: 019a7004-3b2c-7d4e-8f5a-6b7c8d9e0f15 }
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/IntakeDraftNotFound'
        '409':
          $ref: '#/components/responses/IntakeAttachmentCompletionConflict'
        '422':
          $ref: '#/components/responses/IntakeAttachmentContentRefused'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/IntakeAttachmentUnavailable'
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-cw_session
      description: The current organization's session.
    apiToken:
      type: http
      scheme: bearer
      description: Personal API token with the operation's required task scope.
  parameters:
    IntakeListId:
      name: listId
      in: path
      required: true
      description: List ID in the authenticated organization.
      schema:
        type: string
        format: uuid
        example: 019a7001-2b3c-7d4e-8f5a-6b7c8d9e0f12
    IntakeTaskKey:
      name: taskKey
      in: path
      required: true
      description: Stable task key.
      schema:
        $ref: '../../components/task.yaml#/components/schemas/TaskKey'
    IntakePublicKey:
      name: publicKey
      in: path
      required: true
      description: |
        Opaque key from the published link. A key with an invalid shape is handled as unknown.
        It is separate from the authenticated management credentials.
      schema:
        type: string
        example: F3Nq7tG2hu0TQvQqMCuBCgBl2R7dV7jvxrT3SRiYkTQ
    IntakeIfMatch:
      name: If-Match
      in: header
      required: false
      description: Expected form version. A stale version is refused.
      schema:
        type: string
        examples: ['"2"']
    RequiredIntakeIfMatch:
      name: If-Match
      in: header
      required: true
      description: Strong ETag of the current form settings.
      schema:
        type: string
        examples: ['"1"']
    IntakeIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Client-chosen key scoped to this publication, retained for 24 hours.
      schema:
        type: string
        minLength: 1
        maxLength: 255
        examples: [5d0c6f1e-2a3b-4c5d-8e9f-0a1b2c3d4e5f]
    IntakeAttachmentId:
      name: attachmentId
      in: path
      required: true
      description: ID previously allocated to this draft by the reservation route.
      schema:
        $ref: '../../components/attachments.yaml#/components/schemas/AttachmentId'
    IntakeDraftKey:
      name: Intake-Draft-Key
      in: header
      required: false
      description: Private applicant key, required when attachment IDs are supplied.
      schema:
        $ref: '../../components/intake.yaml#/components/schemas/IntakeDraftKey'
    RequiredIntakeDraftKey:
      name: Intake-Draft-Key
      in: header
      required: true
      description: Private applicant key reused for the reservations and submission of this draft.
      schema:
        $ref: '../../components/intake.yaml#/components/schemas/IntakeDraftKey'
    IntakeAttachmentIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Client-chosen reservation key scoped to the publication and draft.
      schema:
        type: string
        minLength: 1
        maxLength: 255
  headers:
    IntakeETag:
      description: Strong ETag of the returned or current form version.
      schema:
        type: string
        examples: ['"2"']
    IntakeNoStore:
      description: Prevents storage by caches.
      schema:
        type: string
        const: no-store
    IntakeAttachmentNoStore:
      required: true
      description: Prevents caches from storing an applicant upload response.
      schema:
        type: string
        const: no-store
    IntakeAttachmentLocation:
      required: true
      description: Relative reference to the reservation, resolved against the request URI.
      schema:
        type: string
        examples: ['attachments/019a7004-3b2c-7d4e-8f5a-6b7c8d9e0f15']
  responses:
    IntakeConfiguration:
      description: Current list form configuration.
      headers:
        ETag:
          $ref: '#/components/headers/IntakeETag'
        Cache-Control:
          $ref: '#/components/headers/IntakeNoStore'
      content:
        application/json:
          schema:
            $ref: '../../components/intake.yaml#/components/schemas/IntakeFormConfiguration'
          example:
            title: Déposer une demande
            description: Décrivez votre besoin en quelques mots.
            fields:
              description: optional
              priority: optional
              dueDate: optional
              contactEmail: required
            defaultStatus: triage
            defaultAssigneeId: null
            publicKey: F3Nq7tG2hu0TQvQqMCuBCgBl2R7dV7jvxrT3SRiYkTQ
            version: 2
    BadRequest:
      description: '`request.invalid`: invalid headers, request shape or fields. `details.issues` identifies the invalid input.'
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          example: { type: about:blank, title: Bad Request, status: 400, code: request.invalid }
    Unauthenticated:
      description: '`auth.session-required`, `auth.session-expired` or `auth.api-token-invalid`.'
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          example:
            {
              type: about:blank,
              title: Connectez-vous pour continuer.,
              status: 401,
              code: auth.session-required,
            }
    IntakeEditorReadForbidden:
      description: |
        `access.role-insufficient`, `auth.scope-missing`, `organization.not-selected` or
        `organization.mfa-required`. Insufficient role identifies the actual role and required
        `edit` role in `details.role` and `details.requiredRole`.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          example:
            type: about:blank
            title: Il faut le droit « Peut modifier » pour cette action.
            status: 403
            code: access.role-insufficient
            details: { role: view, requiredRole: edit }
    IntakeEditorWriteForbidden:
      description: 'The codes in `IntakeEditorReadForbidden` or `auth.csrf-rejected` for an untrusted session origin.'
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          example:
            type: about:blank
            title: Il faut le droit « Peut modifier » pour cette action.
            status: 403
            code: access.role-insufficient
            details: { role: view, requiredRole: edit }
    IntakeListNotFound:
      description: '`list.not-found` for an invisible, unknown or deleted list, or `organization.not-found` for missing membership.'
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          example:
            { type: about:blank, title: Liste introuvable., status: 404, code: list.not-found }
    IntakeTaskNotFound:
      description: |
        `task.not-found` for an invisible or unknown task, `task.trashed` for authorized
        restorers as in task detail, or `organization.not-found` for missing membership.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          example:
            { type: about:blank, title: Tâche introuvable., status: 404, code: task.not-found }
    PublicIntakeNotFound:
      description: '`intake-form.not-found`: the key does not resolve to a valid active publication. The response is generic.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/IntakeNoStore'
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          example:
            type: about:blank
            title: Formulaire introuvable
            status: 404
            code: intake-form.not-found
    IntakeDraftNotFound:
      description: |
        `intake-form.not-found` for an unavailable publication, expired or closed draft, or
        an unknown, unavailable or unrelated reservation. All have the same public response.
      headers:
        Cache-Control:
          $ref: '#/components/headers/IntakeNoStore'
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          example:
            type: about:blank
            title: Formulaire introuvable
            status: 404
            code: intake-form.not-found
    IntakeListArchived:
      description: '`intake-form.list-archived`: editing or publishing an archived list’s form is refused.'
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          example:
            type: about:blank
            title: Liste archivée
            status: 409
            code: intake-form.list-archived
    IntakeSubmissionInProgress:
      description: '`idempotency.request-in-progress`: a request using this key and publication is already running.'
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          example:
            type: about:blank
            title: Conflict
            status: 409
            code: idempotency.request-in-progress
    IntakeAttachmentSubmissionConflict:
      description: |
        `idempotency.request-in-progress` when a matching submission key is in progress,
        or `attachment.upload-not-ready` when a selected reservation in this draft has
        not yet been recorded as verified by task-service.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          example:
            type: about:blank
            title: La pièce jointe est en cours de vérification
            status: 409
            code: attachment.upload-not-ready
    IntakeAttachmentCompletionConflict:
      description: |
        `attachment.upload-expired` when the signed transfer expired before verification,
        `attachment.upload-not-ready` when the reserved object has not arrived, or
        `attachment.storage-quota-exceeded` when the receiving organization cannot accept
        those additional verified bytes. The quota refusal is generic and omits plan, limit,
        and usage details.
        These errors apply only to an otherwise eligible reservation of the presented draft.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          example:
            type: about:blank
            title: Cette pièce jointe ne peut pas être reçue.
            status: 409
            code: attachment.storage-quota-exceeded
    IntakeAttachmentStartRefused:
      description: |
        `attachment.file-too-large` above 26,214,400 bytes, `attachment.upload-metadata-mismatch`
        for an unsupported or inconsistent declaration, `intake-form.attachments-disabled`
        when the current form disallows attachments, `intake-form.attachment-limit-exceeded`
        when the draft already has five active reservations, or `idempotency.key-reused`
        when a reservation key was used with a different declaration.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
    IntakeAttachmentContentRefused:
      description: |
        `attachment.file-too-large` when the stored object exceeds 26,214,400 bytes,
        or `attachment.upload-metadata-mismatch` when the stored length, media type or
        detected type disagrees with the reservation.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
    IntakeVersionMismatch:
      description: '`request.version-mismatch`: `If-Match` is stale. `details.version` is the current form version.'
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          example:
            type: about:blank
            title: 'Ces informations ont été modifiées entre-temps : rechargez la page.'
            status: 412
            code: request.version-mismatch
            details: { version: 2 }
    IntakeDefaultsInvalid:
      description: '`intake-form.defaults-invalid`: the configured status or assignee is invalid for this list.'
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          example:
            type: about:blank
            title: Valeurs par défaut invalides
            status: 422
            code: intake-form.defaults-invalid
    IntakeSubmissionRefused:
      description: '`idempotency.key-reused`: this key was already used with a different body on this publication.'
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          example:
            type: about:blank
            title: Unprocessable Content
            status: 422
            code: idempotency.key-reused
    RateLimited:
      description: '`rate-limit.exceeded`: the gateway rate limit was reached.'
      headers:
        Retry-After:
          description: Whole seconds before retrying.
          schema: { type: integer, minimum: 0 }
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          example:
            {
              type: about:blank,
              title: 'Trop de requêtes : réessayez dans un instant.',
              status: 429,
              code: rate-limit.exceeded,
            }
    Unavailable:
      description: |
        `upstream.unavailable`, `upstream.unreachable`, `upstream.timeout`,
        `upstream.circuit-open`, `upstream.failed`, `upstream.unauthorized` or
        `upstream.deadline-exceeded`. `details.service` identifies task-service.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          example:
            type: about:blank
            title: Service Unavailable
            status: 503
            code: upstream.unavailable
            details: { service: task-service }
    IntakeAttachmentUnavailable:
      description: |
        `storage.unavailable` when storage-service cannot reach its object store or durable
        attachment state. For a service failure, the code is `upstream.unavailable`,
        `upstream.unreachable`, `upstream.timeout`, `upstream.circuit-open`,
        `upstream.failed`, `upstream.unauthorized` or `upstream.deadline-exceeded`.
        `details.service` identifies the affected service, task-service or storage-service.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
