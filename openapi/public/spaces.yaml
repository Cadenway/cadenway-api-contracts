components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-cw_session
      description: |
        Opaque session token of `openapi/public/auth.yaml`, set by the gateway on sign-in and checked
        with identity-service on every request. A session holds every scope.
    apiToken:
      type: http
      scheme: bearer
      description: |
        Personal API token (`cw_pat_…`) of `openapi/public/api-tokens.yaml`, sent as
        `Authorization: Bearer`. It acts with the rights of its user in the organization it was
        created in, within the scopes each operation lists.
  parameters:
    TemplateId:
      name: templateId
      in: path
      required: true
      description: ID of the template.
      schema:
        type: string
        format: uuid
        examples: [019a7007-8b9c-7d0e-8f1a-2b3c4d5e6f01]
    FavoriteId:
      name: favoriteId
      in: path
      required: true
      description: ID of the favorite.
      schema:
        type: string
        format: uuid
        examples: [019a7007-8b9c-7d0e-8f1a-2b3c4d5e6f01]
    SpaceId:
      name: spaceId
      in: path
      required: true
      description: Id of the space, as the list of spaces gives it.
      schema:
        type: string
        format: uuid
        examples: [019a7000-1a2b-7c3d-8e4f-5a6b7c8d9e01]
    IfMatch:
      name: If-Match
      in: header
      required: false
      description: '`"<version>"` the change was made from, as the `ETag` gave it.'
      schema:
        type: string
        examples: ['"4"']
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        Key of this creation, chosen by the client, a UUID for example; the same key with the same
        body within 24 hours answers what the first request answered.
      schema:
        type: string
        minLength: 1
        maxLength: 255
        examples: [5d0c6f1e-2a3b-4c5d-8e9f-0a1b2c3d4e5f]
    Today:
      $ref: '../../components/task.yaml#/components/parameters/Today'
  headers:
    ETag:
      description: Version of the space, `"<version>"`.
      schema:
        type: string
    SpaceLocation:
      description: '`/v1/spaces/<spaceId>`, where the space reads.'
      schema:
        type: string
    RetryAfter:
      description: Seconds to wait before the request can succeed (RFC 9110).
      schema:
        type: integer
        minimum: 1
  examples:
    Produit:
      summary: The space "Produit" of Atelier Nord
      value:
        id: 019a7000-1a2b-7c3d-8e4f-5a6b7c8d9e01
        name: Produit
        prefix: CAD
        description: 'Développement de Cadenway : sprints, bugs et feuille de route.'
        icon: rocket
        color: violet
        visibility: organization
        owner:
          userId: 019a5f3c-8d2e-7c4a-9b1f-3e5d7a9c1b30
        statuses:
          triage: { category: open, name: null, hidden: false }
          backlog: { category: open, name: null, hidden: false }
          todo: { category: open, name: null, hidden: false }
          progress: { category: active, name: null, hidden: false }
          review: { category: active, name: null, hidden: false }
          testing: { category: active, name: null, hidden: false }
          waiting: { category: active, name: null, hidden: false }
          blocked: { category: active, name: null, hidden: false }
          done: { category: closed, name: null, hidden: false }
          cancelled: { category: closed, name: null, hidden: false }
        nextKey: CAD-732
        createdAt: '2026-03-02T09:30:00Z'
        version: 4
        callerRole: edit
        callerCanManage: true
    CrossSiteRefused:
      summary: Request from another site
      value:
        type: about:blank
        title: Forbidden
        status: 403
        code: auth.csrf-rejected
    ScopeMissingRead:
      summary: Personal API token without `tasks:read`
      value:
        type: about:blank
        title: Ce jeton n’a pas la portée nécessaire pour cette requête.
        status: 403
        code: auth.scope-missing
        details:
          requiredScopes: [tasks:read]
    ScopeMissingWrite:
      summary: Personal API token without `tasks:write`
      value:
        type: about:blank
        title: Ce jeton n’a pas la portée nécessaire pour cette requête.
        status: 403
        code: auth.scope-missing
        details:
          requiredScopes: [tasks:write]
    OrganizationNotSelected:
      summary: No current organization
      value:
        type: about:blank
        title: Choisissez une organisation pour continuer.
        status: 403
        code: organization.not-selected
    OrganizationMfaRequired:
      summary: Two-step verification required by the organization
      value:
        type: about:blank
        title: 'Cette organisation exige la vérification en deux étapes : configurez-la depuis votre compte.'
        status: 403
        code: organization.mfa-required
        details:
          organizationId: 019a5f3c-8d2e-7c4a-9b1f-3e5d7a9c1b2f
    RoleForbidden:
      summary: A guest creates a space
      value:
        type: about:blank
        title: Votre rôle ne permet pas cette action.
        status: 403
        code: organization.role-forbidden
    VisibilityForbidden:
      summary: A member who does not own the space changes its visibility
      value:
        type: about:blank
        title: Seuls le propriétaire de l’espace et les administrateurs changent sa confidentialité.
        status: 403
        code: space.visibility-forbidden
    ManageForbidden:
      summary: A member who does not manage the space shares it or deletes it
      value:
        type: about:blank
        title: Seuls le propriétaire de l’espace et les administrateurs le partagent et le suppriment.
        status: 403
        code: space.manage-forbidden
    RoleInsufficient:
      summary: A person with "Lecture seule" on a private space renames it
      value:
        type: about:blank
        title: Il faut le droit « Peut modifier » pour cette action.
        status: 403
        code: access.role-insufficient
        details:
          role: view
          requiredRole: edit
    PrefixTaken:
      summary: Prefix of another space
      value:
        type: about:blank
        title: Ce préfixe est déjà utilisé par un autre espace.
        status: 409
        code: space.prefix-taken
        details:
          prefix: CAD
    RequestInProgress:
      summary: The first request with this key still runs
      value:
        type: about:blank
        title: Conflict
        status: 409
        code: idempotency.request-in-progress
    RateLimited:
      summary: Gateway limit reached
      value:
        type: about:blank
        title: 'Trop de requêtes : réessayez dans un instant.'
        status: 429
        code: rate-limit.exceeded
  responses:
    TemplateWriteForbidden:
      description: |
        `access.role-insufficient` when the caller lacks edit on the space or source list;
        `auth.scope-missing`, `auth.csrf-rejected`, `organization.not-selected` or
        `organization.mfa-required` as for other task writes.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          examples:
            roleInsufficient:
              $ref: '#/components/examples/RoleInsufficient'
            scopeMissing:
              $ref: '#/components/examples/ScopeMissingWrite'
            crossSiteRefused:
              $ref: '#/components/examples/CrossSiteRefused'
    TemplateNotFound:
      description: '`template.not-found`, `space.not-found`, `organization.not-found`.'
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          examples:
            problem1:
              value:
                type: about:blank
                title: Modèle introuvable.
                status: 404
                code: template.not-found
            problem2:
              value:
                type: about:blank
                title: Espace introuvable.
                status: 404
                code: space.not-found
            problem3:
              value:
                type: about:blank
                title: Organisation introuvable.
                status: 404
                code: organization.not-found
    TemplateSourceNotFound:
      description: '`space.not-found`, `task.not-found`, `task.trashed`, `organization.not-found`.'
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          examples:
            problem1:
              value:
                type: about:blank
                title: Espace introuvable.
                status: 404
                code: space.not-found
            problem2:
              value:
                type: about:blank
                title: Tâche introuvable.
                status: 404
                code: task.not-found
            problem3:
              value:
                type: about:blank
                title: 'Cette tâche a été supprimée'
                status: 404
                code: task.trashed
            problem4:
              value:
                type: about:blank
                title: Organisation introuvable.
                status: 404
                code: organization.not-found
    TemplateCreateConflict:
      description: '`task.archived`, `idempotency.request-in-progress`.'
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          examples:
            problem1:
              value:
                type: about:blank
                title: 'Cette tâche est archivée : restaurez-la depuis les Archives pour la modifier.'
                status: 409
                code: task.archived
            problem2:
              value:
                type: about:blank
                title: 'Conflict'
                status: 409
                code: idempotency.request-in-progress
    TemplateCreateRefused:
      description: '`template.source-restricted`, `template.limit-reached`, `idempotency.key-reused`.'
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          examples:
            problem1:
              value:
                type: about:blank
                title: Ce modèle ne peut pas être partagé dans cet espace.
                status: 422
                code: template.source-restricted
            problem2:
              value:
                type: about:blank
                title: La limite de modèles est atteinte.
                status: 422
                code: template.limit-reached
            problem3:
              value:
                type: about:blank
                title: 'Unprocessable Content'
                status: 422
                code: idempotency.key-reused
    FavoriteTargetNotFound:
      description: '`favorite.target-not-found`, `organization.not-found`.'
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          examples:
            problem1:
              value:
                type: about:blank
                title: Cet élément est introuvable.
                status: 404
                code: favorite.target-not-found
            problem2:
              value:
                type: about:blank
                title: Organisation introuvable.
                status: 404
                code: organization.not-found
    FavoriteNotFound:
      description: '`favorite.not-found`, `organization.not-found`.'
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          examples:
            problem1:
              value:
                type: about:blank
                title: Favori introuvable.
                status: 404
                code: favorite.not-found
            problem2:
              value:
                type: about:blank
                title: Organisation introuvable.
                status: 404
                code: organization.not-found
    FavoriteCreateConflict:
      description: '`favorite.already-exists`, `idempotency.request-in-progress`.'
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          examples:
            problem1:
              value:
                type: about:blank
                title: Cet élément est déjà dans vos favoris.
                status: 409
                code: favorite.already-exists
            problem2:
              value:
                type: about:blank
                title: 'Conflict'
                status: 409
                code: idempotency.request-in-progress
    FavoriteCreateRefused:
      description: '`favorite.limit-reached`, `idempotency.key-reused`.'
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          examples:
            problem1:
              value:
                type: about:blank
                title: La limite de favoris est atteinte.
                status: 422
                code: favorite.limit-reached
            problem2:
              value:
                type: about:blank
                title: 'Unprocessable Content'
                status: 422
                code: idempotency.key-reused
    FavoriteWriteForbidden:
      description: '`auth.scope-missing`, `auth.csrf-rejected`, `organization.not-selected`, `organization.mfa-required`.'
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          examples:
            problem1:
              value:
                type: about:blank
                title: Ce jeton n’a pas la portée nécessaire pour cette requête.
                status: 403
                code: auth.scope-missing
            problem2:
              value:
                type: about:blank
                title: 'Forbidden'
                status: 403
                code: auth.csrf-rejected
            problem3:
              value:
                type: about:blank
                title: Choisissez une organisation pour continuer.
                status: 403
                code: organization.not-selected
            problem4:
              value:
                type: about:blank
                title: 'Cette organisation exige la vérification en deux étapes : configurez-la depuis votre compte.'
                status: 403
                code: organization.mfa-required
    BadRequest:
      description: |
        The request does not match the schema: `request.invalid`, with one `details.issues` entry
        per failed member (`path` is the dotted path of the member, empty for the body itself).
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          example:
            type: about:blank
            title: Bad Request
            status: 400
            code: request.invalid
            details:
              issues:
                - in: body
                  path: prefix
                  code: invalid_format
                  message: Invalid string
    Unauthenticated:
      description: |
        - `auth.session-required`: the request carries neither a session cookie nor a bearer token;
        - `auth.session-expired`: the cookie names a session that ended;
        - `auth.api-token-invalid`: the bearer token is unknown, revoked or expired, or its user
          no longer belongs to its organization.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          examples:
            sessionRequired:
              summary: No credential
              value:
                type: about:blank
                title: Connectez-vous pour continuer.
                status: 401
                code: auth.session-required
            sessionExpired:
              summary: Session ended
              value:
                type: about:blank
                title: Session expirée
                status: 401
                code: auth.session-expired
            apiTokenInvalid:
              summary: Personal API token no longer valid
              value:
                type: about:blank
                title: Jeton d’API invalide, expiré ou révoqué.
                status: 401
                code: auth.api-token-invalid
    TasksReadForbidden:
      description: |
        - `auth.scope-missing`: the personal API token lacks `tasks:read`; `details.requiredScopes`
          lists what the route needs;
        - `organization.not-selected`: the session has no current organization;
        - `organization.mfa-required`: the authentication policy of the organization requires
          two-step verification for the role of the caller, who has none; `details.organizationId`
          names it.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          examples:
            scopeMissing:
              $ref: '#/components/examples/ScopeMissingRead'
            organizationNotSelected:
              $ref: '#/components/examples/OrganizationNotSelected'
            organizationMfaRequired:
              $ref: '#/components/examples/OrganizationMfaRequired'
    SpaceCreationForbidden:
      description: |
        - `organization.role-forbidden`: a guest does not create spaces;
        - `auth.scope-missing`: the personal API token lacks `tasks:write`;
        - `organization.not-selected`, `organization.mfa-required`: see `TasksReadForbidden`;
        - `auth.csrf-rejected`: the `Origin` or the `Content-Type` of the request is refused.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          examples:
            roleForbidden:
              $ref: '#/components/examples/RoleForbidden'
            scopeMissing:
              $ref: '#/components/examples/ScopeMissingWrite'
            organizationNotSelected:
              $ref: '#/components/examples/OrganizationNotSelected'
            organizationMfaRequired:
              $ref: '#/components/examples/OrganizationMfaRequired'
            crossSiteRefused:
              $ref: '#/components/examples/CrossSiteRefused'
    SpaceWriteForbidden:
      description: |
        - `space.visibility-forbidden`: only the owner of the space, and the owner and the admins
          of the organization, change its visibility;
        - `access.role-insufficient`: the caller sees the space without `edit` on it;
          `details.role` is their role there (`null` for a space they see only through some of its
          lists), `details.requiredRole` is `edit`;
        - `auth.scope-missing`: the personal API token lacks `tasks:write`;
        - `organization.not-selected`, `organization.mfa-required`: see `TasksReadForbidden`;
        - `auth.csrf-rejected`: the `Origin` or the `Content-Type` of the request is refused.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          examples:
            visibilityForbidden:
              $ref: '#/components/examples/VisibilityForbidden'
            roleInsufficient:
              $ref: '#/components/examples/RoleInsufficient'
            scopeMissing:
              $ref: '#/components/examples/ScopeMissingWrite'
            organizationNotSelected:
              $ref: '#/components/examples/OrganizationNotSelected'
            organizationMfaRequired:
              $ref: '#/components/examples/OrganizationMfaRequired'
            crossSiteRefused:
              $ref: '#/components/examples/CrossSiteRefused'
    SpaceManageForbidden:
      description: |
        - `space.manage-forbidden`: only the owner of the space, and for a space `organization` the
          owner and the admins of the organization, delete it;
        - `auth.scope-missing`: the personal API token lacks `tasks:write`;
        - `organization.not-selected`, `organization.mfa-required`: see `TasksReadForbidden`;
        - `auth.csrf-rejected`: the `Origin` of the request is refused.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          examples:
            manageForbidden:
              $ref: '#/components/examples/ManageForbidden'
            scopeMissing:
              $ref: '#/components/examples/ScopeMissingWrite'
            organizationNotSelected:
              $ref: '#/components/examples/OrganizationNotSelected'
            organizationMfaRequired:
              $ref: '#/components/examples/OrganizationMfaRequired'
            crossSiteRefused:
              $ref: '#/components/examples/CrossSiteRefused'
    OrganizationNotFound:
      description: |
        `organization.not-found`: the caller no longer belongs to the current organization, or,
        for a few seconds after they joined it, task-service does not know them yet.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          example:
            type: about:blank
            title: Organisation introuvable.
            status: 404
            code: organization.not-found
    SpaceNotFound:
      description: |
        - `space.not-found`: no space with this id that the caller sees, a deleted one included;
        - `organization.not-found`: see `OrganizationNotFound`.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          example:
            type: about:blank
            title: Espace introuvable.
            status: 404
            code: space.not-found
    PrefixTaken:
      description: |
        `space.prefix-taken`: another space of the organization uses or used this prefix;
        `details.prefix` repeats it.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          examples:
            prefixTaken:
              $ref: '#/components/examples/PrefixTaken'
    SpaceCreationConflict:
      description: |
        - `space.prefix-taken`: another space of the organization uses or used this prefix;
        - `idempotency.request-in-progress`: a request with the same `Idempotency-Key` still runs.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          examples:
            prefixTaken:
              $ref: '#/components/examples/PrefixTaken'
            requestInProgress:
              $ref: '#/components/examples/RequestInProgress'
    IdempotencyKeyReused:
      description: '`idempotency.key-reused`: the `Idempotency-Key` was sent before with another body.'
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          example:
            type: about:blank
            title: Unprocessable Content
            status: 422
            code: idempotency.key-reused
    StatusRequired:
      description: '`space.status-required`: the patch hides `todo` or `done`; `details.status` names it.'
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          example:
            type: about:blank
            title: 'Ce statut est obligatoire : il ne peut pas être masqué.'
            status: 422
            code: space.status-required
            details:
              status: done
    VersionMismatch:
      description: '`request.version-mismatch`: `If-Match` is not the current version; `details.version` is.'
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          example:
            type: about:blank
            title: 'Ces informations ont été modifiées entre-temps : rechargez la page.'
            status: 412
            code: request.version-mismatch
            details:
              version: 5
    RateLimited:
      description: '`rate-limit.exceeded`: the gateway refuses more requests from this session or token for now.'
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          examples:
            rateLimited:
              $ref: '#/components/examples/RateLimited'
    Unavailable:
      description: |
        task-service cannot answer: `upstream.unavailable`, `upstream.unreachable`,
        `upstream.timeout`, `upstream.circuit-open`, `upstream.failed`, `upstream.unauthorized` or
        `upstream.deadline-exceeded`, with `details.service`.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          example:
            type: about:blank
            title: Service Unavailable
            status: 503
            code: upstream.unavailable
            details:
              service: task-service
  schemas:
    Favorite:
      $ref: '../../components/task.yaml#/components/schemas/Favorite'
    FavoriteCreation:
      $ref: '../../components/task.yaml#/components/schemas/FavoriteCreation'
    FavoritePage:
      $ref: '../../components/task.yaml#/components/schemas/FavoritePage'
    TaskTemplate:
      $ref: '../../components/task.yaml#/components/schemas/TaskTemplate'
    TaskTemplateCreation:
      $ref: '../../components/task.yaml#/components/schemas/TaskTemplateCreation'
    TaskTemplatePage:
      $ref: '../../components/task.yaml#/components/schemas/TaskTemplatePage'
    MilestonePage:
      $ref: '../../components/task.yaml#/components/schemas/MilestonePage'
    Space:
      $ref: '../../components/task.yaml#/components/schemas/Space'
    SpaceCreation:
      $ref: '../../components/task.yaml#/components/schemas/SpaceCreation'
    SpacePatch:
      $ref: '../../components/task.yaml#/components/schemas/SpacePatch'
    TaskList:
      $ref: '../../components/task.yaml#/components/schemas/TaskList'
    ListSummary:
      $ref: '../../components/task.yaml#/components/schemas/ListSummary'
    SpaceCreated:
      type: object
      required: [space, firstList]
      properties:
        space:
          $ref: '#/components/schemas/Space'
        firstList:
          $ref: '#/components/schemas/TaskList'
          description: The list "Première liste" created with the space, which the web application opens.
    SpacePage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Space'
        nextCursor:
          $ref: '../../components/http.yaml#/components/schemas/NextCursor'
    SpaceOverview:
      type: object
      required: [spaceId, listCount, taskCount, items, nextCursor]
      properties:
        spaceId:
          type: string
          format: uuid
        listCount:
          type: integer
          minimum: 0
          description: Lists of the space, on every page ("4 listes").
        taskCount:
          type: integer
          minimum: 0
          description: Top-level tasks of the space, on every page ("108 tâches").
        items:
          type: array
          description: The lists of this page, in the order of their creation, with their counts.
          items:
            $ref: '#/components/schemas/ListSummary'
        nextCursor:
          $ref: '../../components/http.yaml#/components/schemas/NextCursor'
