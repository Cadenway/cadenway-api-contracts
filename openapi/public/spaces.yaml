# Public routes of spaces: create, list, read, change and delete the spaces of the current
# organization (name, prefix, appearance, visibility, renamed or hidden statuses), and read the
# overview of a space with the counts of its lists. The access rules of spaces and lists, which
# every task spec refers to, are stated here. Served by cadenway-api-gateway, which calls
# openapi/internal/task-service.yaml for each of them.
openapi: 3.1.0
info:
  title: Cadenway spaces
  version: 1.0.0
  description: |
    The spaces of the current organization ("Espaces"): each groups the lists and the sprints of a
    team or a domain ("Un espace regroupe les listes et les sprints d’une équipe ou d’un domaine."),
    gives the prefix of their task keys, and names its statuses. The API gateway serves these
    routes and answers them through task-service. The lists of a space are in
    `openapi/public/lists.yaml`, its tasks in `openapi/public/tasks.yaml`.

    **Current organization.** Every route acts on the current organization of the session
    (`PUT /v1/session/organization`, `openapi/public/organizations.yaml`) or on the organization
    of the personal API token; without one it answers `403 organization.not-selected`, and
    `403 organization.mfa-required` while the authentication policy of the organization requires
    two-step verification of the caller, who has none.

    **Members.** task-service keeps its own copy of the members and their roles, from
    `member.joined.v1`, `member.role-changed.v1` and `member.removed.v1` of organization-service
    (`asyncapi/organization-service.yaml`), never from the token; the copy follows within seconds.
    Until it knows the caller, right after a creation of the organization or an acceptance of an
    invitation, every route answers `404 organization.not-found`, and the web application retries
    for a few seconds.

    **Access.** A person reaches a space and its lists in three ways, and has on each the highest
    role these give: `edit` ("Peut modifier"), `comment` ("Peut commenter", which reads like
    `view` until comments exist) or `view` ("Lecture seule").

    - The rule of the organization: in a space `organization` ("Tout Atelier Nord"), every owner,
      admin and member of the organization has `edit` on the space, and on each of its lists whose
      switch "Accès de l’organisation" is on (`organizationAccess`, `openapi/public/lists.yaml`).
      Never a guest, and never in a private space ("Privé").
    - The owner of the space, the member who created it, has `edit` on it and on every list of it
      ("Propriétaire"), whatever the switch.
    - Grants (`openapi/public/access.yaml`): a grant of the space gives its role on the space and
      on every list of it, whatever the switch; a grant of a list gives its role on that list only.
      A guest holds grants of lists only ("Elle ne verra que cette liste"), and a space grant they
      held as a member gives them nothing while they are a guest.

    A person sees a space when they have a role on it (`callerRole`) or see one of its lists; one
    who sees it only through some of its lists (`callerRole: null`) sees those lists and nothing
    else of it. Reads need any role; changes of a list and its tasks need `edit`, and a person who
    sees the resource without it gets `403 access.role-insufficient`, never a `404`. The owner and
    the admins of the organization see neither a private space nor a list whose switch is off,
    unless it is shared with them. A person who does not see a space, a list or a task asks for
    access with `POST /v1/access-requests` ("Demander l’accès"), which answers the same whether
    it exists or not.

    **Who sees a space.** A space the caller does not see answers `404 space.not-found`, as an
    unknown or deleted one does, and is left out of every collection and every count, as are the
    lists and the tasks the caller does not see.

    **Who changes what.** Every member but the guests creates spaces; a guest gets
    `403 organization.role-forbidden`. Who has `edit` on a space changes its settings and its
    statuses and creates lists in it, as every member who saw a space did before grants existed.
    Only the people who manage a space (`callerCanManage`), its owner and, for a space
    `organization`, the owner and the admins of the organization, change its visibility
    (`403 space.visibility-forbidden`), share it and delete it (`403 space.manage-forbidden`).
    When the owner of a private space leaves the organization, the owner of the organization
    becomes its owner; the grants of a person who leaves are removed.

    **Deletion.** A deleted space disappears at once with its lists, archived ones included, and
    its tasks ("Les membres perdent l’accès immédiatement."); within minutes its tasks reach the
    trash, one entry per top-level task (`openapi/public/trash.yaml`). Restoring one of them brings
    back its list and the space, at the end of the sidebar, without the other lists. The prefixes
    of a deleted space stay reserved, and its keys are never given again.

    **Prefixes and keys.** A space has a prefix of 2 to 5 letters ("CAD"), and its tasks are
    numbered after it ("CAD-482"), one counter per prefix, never going back: a number is never given
    again, even after the task is deleted or archived. A prefix belongs for good to the space that
    used it: another space of the organization can take neither its current prefix nor a former one
    (`409 space.prefix-taken`); a space may take back one of its own former prefixes and continues
    its numbering. A new prefix numbers the new tasks only: the existing tasks keep their key ("Les
    nouvelles tâches seront numérotées RH-1, RH-2… ; les tâches existantes gardent leur
    identifiant."), as does a task moved to another space.

    **Statuses.** The ten status keys and their three categories never change
    (`@cadenway/contracts`). A space gives a status another name, at most 24 characters, or stops
    using it ("Ne plus utiliser …"); `todo` and `done` are always used
    (`422 space.status-required`). A task keeps a status its space no longer uses; the status menus
    and the list groups leave it out ("Les catégories ne changent pas : les compteurs restent
    justes.").

    **Versions.** Each space carries a `version`, returned as `ETag`; a change may send it back in
    `If-Match` and answers `412 request.version-mismatch` when the space changed meanwhile.

    **Creations.** A creation may carry an `Idempotency-Key`, which the web application always
    sends: the same key with the same body within 24 hours answers what the first request answered,
    without creating anything again; with another body, `422 idempotency.key-reused`; while the
    first request still runs, `409 idempotency.request-in-progress`. Keys are kept per caller.

    **Credentials and scopes.** Each operation declares in `security` what may call it: the
    session cookie, or a personal API token with `tasks:read` to read and `tasks:write` to change
    (`403 auth.scope-missing` without it). A token acts with the rights of its user. When a
    request carries `Authorization: Bearer`, the gateway authenticates it with that token alone.

    **Cross-site requests.** A request with an unsafe method authenticated by the cookie carries an
    `Origin` equal to one of the gateway's allowed origins; a `POST`, `PUT` or `PATCH` also
    carries `Content-Type: application/json`, which is why the actions without input take the
    empty object `{}`. A `DELETE` has no body: a browser sends one cross-site only after a CORS
    preflight, so its `Origin` is the check; one that carries a body or a `Content-Type` all the
    same declares `application/json`. The gateway refuses any other request before the route runs
    (`403 auth.csrf-rejected`). A request authenticated by a personal token carries no ambient
    credential and needs no `Origin`. A `PATCH` is a JSON Merge Patch (RFC 7396) sent as
    `application/json`.

    **Rate limit.** 600 requests per minute per session or personal token; beyond,
    `429 rate-limit.exceeded` with `Retry-After`.

    **Errors.** As in `openapi/public/auth.yaml`: a stable `code`, a French `title` for the codes
    the web application shows to the person, the English reason phrase otherwise.

    **Later versions** add, without changing what is here: creation from the onboarding assistant.
  contact:
    name: Cadenway
    url: https://github.com/Cadenway/cadenway-api-contracts
  license:
    name: Proprietary
    url: https://github.com/Cadenway/cadenway-api-contracts/blob/main/LICENSE
  x-consumers:
    - repository: cadenway-api-gateway
      uses: Serves every route, through openapi/internal/task-service.yaml, and checks the scopes of every operation.
    - repository: cadenway-webapp
      uses: Calls every route through @cadenway/api-client (sidebar "Espaces", dialogs "Créer un espace" and "Modifier l’espace", "Statuts de l’espace", space overview, "Supprimer l’espace").
servers:
  - url: https://api.cadenway.com
    description: Production.
  - url: https://api.staging.cadenway.com
    description: Staging. The local stack of cadenway-ops serves the same routes on `api.<DOMAIN>`.
tags:
  - name: spaces
    description: Spaces of the current organization.
paths:
  /v1/spaces:
    post:
      operationId: createSpace
      summary: Create a space
      description: |
        Creates a space whose owner is the caller ("Créer l’espace"), with a first list named
        "Première liste", in one transaction ("Espace créé", "Ressources humaines · une première
        liste est prête."). The answer carries both, so that the web application opens the list.
        Every status of a new space keeps its default label and is used.

        - `prefix` is required: the form derives one from the name (its first three letters
          without accents, completed with `X`), the API does not. A prefix another space of the
          organization uses or used answers `409 space.prefix-taken`.
        - A guest gets `403 organization.role-forbidden`.

        Emits `space.created.v1` and `list.created.v1`. Scope `tasks:write` for a personal API
        token.
      tags: [spaces]
      security:
        - sessionCookie: []
        - apiToken: [tasks:write]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SpaceCreation'
            example:
              name: Ressources humaines
              prefix: RH
              description: null
              icon: users
              color: lagon
              visibility: organization
      responses:
        '201':
          description: The space exists, with its first list.
          headers:
            Location:
              $ref: '#/components/headers/SpaceLocation'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpaceCreated'
              example:
                space:
                  id: 019a7000-1a2b-7c3d-8e4f-5a6b7c8d9e05
                  name: Ressources humaines
                  prefix: RH
                  description: null
                  icon: users
                  color: lagon
                  visibility: organization
                  owner:
                    userId: 019a5f3c-8d2e-7c4a-9b1f-3e5d7a9c1b30
                  statuses:
                    triage: { category: open, name: null, hidden: false }
                    backlog: { category: open, name: null, hidden: false }
                    todo: { category: open, name: null, hidden: false }
                    progress: { category: active, name: null, hidden: false }
                    review: { category: active, name: null, hidden: false }
                    testing: { category: active, name: null, hidden: false }
                    waiting: { category: active, name: null, hidden: false }
                    blocked: { category: active, name: null, hidden: false }
                    done: { category: closed, name: null, hidden: false }
                    cancelled: { category: closed, name: null, hidden: false }
                  nextKey: RH-1
                  createdAt: '2026-11-08T10:15:00Z'
                  version: 1
                  callerRole: edit
                  callerCanManage: true
                firstList:
                  id: 019a7001-2b3c-7d4e-8f5a-6b7c8d9e0f20
                  spaceId: 019a7000-1a2b-7c3d-8e4f-5a6b7c8d9e05
                  name: Première liste
                  icon: null
                  color: gris
                  sprint: null
                  createdAt: '2026-11-08T10:15:00Z'
                  version: 1
                  organizationAccess: true
                  archivedAt: null
                  archivedBy: null
                  callerRole: edit
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/SpaceCreationForbidden'
        '404':
          $ref: '#/components/responses/OrganizationNotFound'
        '409':
          $ref: '#/components/responses/SpaceCreationConflict'
        '422':
          $ref: '#/components/responses/IdempotencyKeyReused'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
    get:
      operationId: listSpaces
      summary: List the spaces
      description: |
        Lists the spaces the caller sees ("Espaces"), in the order of their creation, the order of
        the sidebar; a space restored from the trash comes at the end. A guest gets the spaces of
        the lists shared with them. The lists of each space and their counts are read with
        `GET /v1/spaces/{spaceId}/overview`.

        Scope `tasks:read` for a personal API token.
      tags: [spaces]
      security:
        - sessionCookie: []
        - apiToken: [tasks:read]
      parameters:
        - $ref: '../../components/http.yaml#/components/parameters/Cursor'
        - $ref: '../../components/http.yaml#/components/parameters/Limit'
      responses:
        '200':
          description: One page of spaces.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpacePage'
              example:
                items:
                  - id: 019a7000-1a2b-7c3d-8e4f-5a6b7c8d9e01
                    name: Produit
                    prefix: CAD
                    description: 'Développement de Cadenway : sprints, bugs et feuille de route.'
                    icon: rocket
                    color: violet
                    visibility: organization
                    owner:
                      userId: 019a5f3c-8d2e-7c4a-9b1f-3e5d7a9c1b30
                    statuses:
                      triage: { category: open, name: null, hidden: false }
                      backlog: { category: open, name: null, hidden: false }
                      todo: { category: open, name: null, hidden: false }
                      progress: { category: active, name: null, hidden: false }
                      review: { category: active, name: null, hidden: false }
                      testing: { category: active, name: null, hidden: false }
                      waiting: { category: active, name: null, hidden: false }
                      blocked: { category: active, name: null, hidden: false }
                      done: { category: closed, name: null, hidden: false }
                      cancelled: { category: closed, name: null, hidden: false }
                    nextKey: CAD-732
                    createdAt: '2026-03-02T09:30:00Z'
                    version: 4
                    callerRole: edit
                    callerCanManage: true
                  - id: 019a7000-1a2b-7c3d-8e4f-5a6b7c8d9e02
                    name: Design
                    prefix: DES
                    description: Système de design et recherche utilisateur.
                    icon: paint
                    color: orange
                    visibility: private
                    owner:
                      userId: 019a5f3c-8d2e-7c4a-9b1f-3e5d7a9c1b30
                    statuses:
                      triage: { category: open, name: null, hidden: true }
                      backlog: { category: open, name: null, hidden: false }
                      todo: { category: open, name: null, hidden: false }
                      progress: { category: active, name: null, hidden: false }
                      review: { category: active, name: Relecture, hidden: false }
                      testing: { category: active, name: null, hidden: true }
                      waiting: { category: active, name: null, hidden: false }
                      blocked: { category: active, name: null, hidden: false }
                      done: { category: closed, name: null, hidden: false }
                      cancelled: { category: closed, name: null, hidden: false }
                    nextKey: DES-122
                    createdAt: '2026-03-04T14:00:00Z'
                    version: 7
                    callerRole: edit
                    callerCanManage: true
                nextCursor: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/TasksReadForbidden'
        '404':
          $ref: '#/components/responses/OrganizationNotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/spaces/{spaceId}:
    parameters:
      - $ref: '#/components/parameters/SpaceId'
    get:
      operationId: getSpace
      summary: Read a space
      description: |
        Returns a space the caller sees, with its statuses and the key its next task would take
        ("Les tâches seront numérotées CAD-1, CAD-2…"). A space the caller does not see answers
        `404 space.not-found`.

        Scope `tasks:read` for a personal API token.
      tags: [spaces]
      security:
        - sessionCookie: []
        - apiToken: [tasks:read]
      responses:
        '200':
          description: The space.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Space'
              examples:
                produit:
                  $ref: '#/components/examples/Produit'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/TasksReadForbidden'
        '404':
          $ref: '#/components/responses/SpaceNotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
    patch:
      operationId: updateSpace
      summary: Change a space
      description: |
        Applies a JSON Merge Patch to a space ("Modifier l’espace", "Espace modifié"): a member
        left out is unchanged, `null` clears `description` or `icon`. It needs `edit` on the space
        (`403 access.role-insufficient` for a caller who sees it without, a `view` grant or the
        grants of some of its lists only); `visibility` needs more, see below.

        - `prefix`: a prefix another space uses or used answers `409 space.prefix-taken`. The new
          tasks are numbered after the new prefix, from the next number never given under it; the
          existing tasks keep their key.
        - `statuses` ("Statuts de « Produit »"): by key, a new `name` (`null` for the default
          label) or `hidden`; `null` for a key puts back its default, `null` for `statuses` puts
          back every default ("Rétablir par défaut"). Hiding `todo` or `done` answers
          `422 space.status-required`.
        - `visibility`: only the people who manage the space (`callerCanManage`: its owner, and for
          a space `organization` the owner and the admins of the organization) change it
          (`403 space.visibility-forbidden`). An admin who makes the space private gets the answer,
          then no longer sees it, unless it is shared with them. The grants and the switches of the
          lists stay as they are.
        - `If-Match` is optional (`412 request.version-mismatch`).

        Emits `space.updated.v1` when something changed; a patch that changes nothing answers `200`
        with the same version and emits nothing. Scope `tasks:write` for a personal API token.
      tags: [spaces]
      security:
        - sessionCookie: []
        - apiToken: [tasks:write]
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SpacePatch'
            examples:
              statuses:
                summary: Rename "En revue" and stop using "En validation"
                value:
                  statuses:
                    review:
                      name: Relecture
                    testing:
                      hidden: true
              prefix:
                summary: Change the prefix
                value:
                  prefix: PRD
      responses:
        '200':
          description: The space after the change.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Space'
              examples:
                produit:
                  $ref: '#/components/examples/Produit'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/SpaceWriteForbidden'
        '404':
          $ref: '#/components/responses/SpaceNotFound'
        '409':
          $ref: '#/components/responses/PrefixTaken'
        '412':
          $ref: '#/components/responses/VersionMismatch'
        '422':
          $ref: '#/components/responses/StatusRequired'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
    delete:
      operationId: deleteSpace
      summary: Delete a space
      description: |
        Deletes a space ("Supprimer l’espace", "Espace « Marketing » supprimé"), which only the
        people who manage it do (`403 space.manage-forbidden`): its owner, and for a space
        `organization` the owner and the admins of the organization. The web application asks
        first for the name of the space ("Pour confirmer, saisissez Marketing").

        The space, its lists, archived ones included, and their tasks disappear at once for
        everyone: they answer `404` and leave every collection and count. A job then moves the tasks
        to the trash in bounded batches, one entry per top-level task with its subtasks
        (`openapi/public/trash.yaml`), within minutes; the trash shows them as they arrive, to the
        people who could change their list. Restoring one of them brings back its list and the
        space, at the end of the sidebar, without the other lists. The pending access requests of
        the space and its lists are dropped. The prefixes of the space stay reserved and its keys
        are never given again. `If-Match` is optional (`412 request.version-mismatch`).

        Not recorded in the activity log. Emits `space.deleted.v1`, then `task.trashed.v1` for each
        task the job moves. Scope `tasks:write` for a personal API token.
      tags: [spaces]
      security:
        - sessionCookie: []
        - apiToken: [tasks:write]
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '204':
          description: The space is deleted; its tasks are on their way to the trash.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/SpaceManageForbidden'
        '404':
          $ref: '#/components/responses/SpaceNotFound'
        '412':
          $ref: '#/components/responses/VersionMismatch'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/spaces/{spaceId}/milestones:
    parameters:
      - $ref: '#/components/parameters/SpaceId'
    get:
      operationId: listSpaceMilestones
      summary: List milestones of a space
      description: |
        Returns visible live milestones in visible lists of the space, excluding archived lists.
        A caller with only list grants sees only their qualifying lists. Sort by due date ascending,
        undated last; the opaque cursor is bound to the space and ordering. Total counts matching
        visible milestones and does not change existing space, list or sprint counts.
        Scope `tasks:read` for a personal API token.
      tags: [spaces]
      security:
        - sessionCookie: []
        - apiToken: [tasks:read]
      parameters:
        - $ref: '../../components/http.yaml#/components/parameters/Cursor'
        - $ref: '../../components/http.yaml#/components/parameters/Limit'
      responses:
        '200':
          description: One page of milestones.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MilestonePage'
              example: { items: [], nextCursor: null, total: 0 }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/TasksReadForbidden'
        '404':
          $ref: '#/components/responses/SpaceNotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/spaces/{spaceId}/overview:
    parameters:
      - $ref: '#/components/parameters/SpaceId'
    get:
      operationId: getSpaceOverview
      summary: Read the overview of a space
      description: |
        Returns the lists of a space with the counts of their tasks, in the order of the sidebar
        (their creation, a restored list at the end): the space overview ("Vue d’ensemble": "4
        listes · 108 tâches", and on each list card "32 tâches", "12 / 32 terminées", "38 %", "14
        ouvertes", "3 en retard") and the sidebar (the count of each list, the total of the space).
        The counts are those of the top-level tasks, subtasks left out; `listCount` and `taskCount`
        count the whole space, on every page. Only the lists the caller sees count, and neither the
        archived lists nor the archived tasks do.

        `today` is the date of the caller, in their time zone, which task-service does not know: a
        task is late when it is not closed and its due date is before it.

        Scope `tasks:read` for a personal API token.
      tags: [spaces]
      security:
        - sessionCookie: []
        - apiToken: [tasks:read]
      parameters:
        - $ref: '#/components/parameters/Today'
        - $ref: '../../components/http.yaml#/components/parameters/Cursor'
        - $ref: '../../components/http.yaml#/components/parameters/Limit'
      responses:
        '200':
          description: One page of the lists of the space, with their counts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpaceOverview'
              example:
                spaceId: 019a7000-1a2b-7c3d-8e4f-5a6b7c8d9e01
                listCount: 4
                taskCount: 108
                items:
                  - list:
                      id: 019a7001-2b3c-7d4e-8f5a-6b7c8d9e0f11
                      spaceId: 019a7000-1a2b-7c3d-8e4f-5a6b7c8d9e01
                      name: Backlog
                      icon: null
                      color: gris
                      sprint: null
                      createdAt: '2026-03-02T09:30:00Z'
                      version: 1
                    counts:
                      total: 4
                      open: 4
                      done: 0
                      cancelled: 0
                      late: 0
                  - list:
