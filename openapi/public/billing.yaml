openapi: 3.1.0
info:
  title: Cadenway organization billing
  version: 1.0.0
  description: Subscription, measured usage, hosted checkout and invoices for the selected organization.
  contact:
    name: Cadenway
    url: https://github.com/Cadenway/cadenway-api-contracts
  license:
    name: Proprietary
    url: https://github.com/Cadenway/cadenway-api-contracts/blob/main/LICENSE
  x-consumers:
    - repository: cadenway-api-gateway
      uses: Authorizes organization billing and relays signed Stripe deliveries to Billing.
    - repository: cadenway-webapp
      uses: Shows the current plan, usage, Checkout and invoice history in organization settings.
servers:
  - url: https://api.cadenway.com
    description: Production.
  - url: https://api.staging.cadenway.com
    description: Staging.
tags:
  - name: billing
    description: Subscription, measured usage, payments and invoices.
paths:
  /v1/billing/subscription:
    get:
      operationId: getBillingSubscription
      summary: Read the current organization subscription
      description: |
        The selected organization comes from the verified browser session. The gateway checks
        the caller's current membership with Organization. Only an active owner can
        read the subscription and usage. Billing returns its current plan and available usage
        counters. When a required source baseline is unavailable, the route returns 503.

        The Free plan includes five seats and 2,000,000,000 bytes of storage. Active owners,
        admins and members consume seats. Active guests are counted separately. The storage usage
        field measures verified ready attachment bytes. Its limit is the organization's storage
        allowance.
      tags: [billing]
      security:
        - sessionCookie: []
      responses:
        '200':
          description: The subscription and measured usage of the selected organization.
          headers:
            Cache-Control:
              $ref: '../../components/billing.yaml#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '../../components/billing.yaml#/components/schemas/BillingSubscription'
              examples:
                free:
                  summary: Exemple d’Atelier Nord au plan Gratuit
                  value:
                    plan: free
                    seats:
                      used: 3
                      limit: 5
                    guestCount: 1
                    storage:
                      attachmentBytesUsed: 120000000
                      limitBytes: 2000000000
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/OrganizationNotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/billing/checkout:
    post:
      operationId: startBillingCheckout
      summary: Start hosted Checkout for the Team plan
      description: |
        The gateway takes the organization from the browser session and verifies an active owner
        membership with Organization on every request, including retries. The Team plan is
        available through self-service checkout. Billing supplies the price, seat quantity and
        return destinations from its configuration and the organization's current state.

        This action returns a Stripe Checkout URL. Billing confirms the payment and subscription
        against current Stripe state. A verified Stripe webhook or recovery of the original
        session on a retry can trigger the same reconciliation.

        The same key and equivalent body replay the original response for 24 hours while the
        caller remains authorized. Billing keeps the original reservation while its outcome is
        uncertain. A replacement can proceed when Stripe confirms that the previous session
        expired without payment or that it definitively rejected the first creation request
        before creating a session.
      tags: [billing]
      security:
        - sessionCookie: []
      parameters:
        - $ref: '../../components/billing-payments.yaml#/components/parameters/BillingCheckoutIdempotencyKey'
      x-cadenway-strict-body: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../../components/billing-payments.yaml#/components/schemas/BillingCheckoutRequest'
            example:
              plan: team
      responses:
        '200':
          description: Hosted Checkout URL for the organization.
          headers:
            Cache-Control:
              $ref: '../../components/billing.yaml#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '../../components/billing-payments.yaml#/components/schemas/BillingCheckoutSession'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: |
            `auth.api-token-not-accepted`, `organization.not-selected`, `organization.mfa-required`,
            or `organization.role-forbidden` when the current active membership lacks the owner role.
            `auth.csrf-rejected` applies when the gateway refuses the `Origin` or `Content-Type`.
        '404':
          $ref: '#/components/responses/OrganizationNotFound'
        '409':
          $ref: '../../components/billing-payments.yaml#/components/responses/BillingCheckoutConflict'
        '422':
          $ref: '../../components/billing-payments.yaml#/components/responses/BillingCheckoutKeyReused'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/PaymentUnavailable'
  /v1/billing/invoices:
    get:
      operationId: listBillingInvoices
      summary: List issued invoices for the selected organization
      description: |
        The gateway verifies an active owner membership with Organization on every request. Billing
        lists issued invoices for the Stripe customer linked to the selected organization, newest
        creation first. An organization without a linked customer has an empty history. Continue
        with the opaque cursor from the preceding page.
      tags: [billing]
      security:
        - sessionCookie: []
      parameters:
        - $ref: '../../components/billing.yaml#/components/parameters/BillingCursor'
        - $ref: '../../components/http.yaml#/components/parameters/Limit'
      responses:
        '200':
          description: A page of issued invoices.
          headers:
            Cache-Control:
              $ref: '../../components/billing.yaml#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '../../components/billing-payments.yaml#/components/schemas/BillingInvoicePage'
        '400':
          $ref: '../../components/billing-payments.yaml#/components/responses/BillingInvoiceBadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/OrganizationNotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/PaymentUnavailable'
  /v1/billing/webhooks/stripe:
    post:
      operationId: receiveStripeBillingWebhook
      summary: Receive a signed Stripe billing event
      description: |
        Stripe sends this server-to-server request. The gateway forwards the unchanged body and
        Stripe-Signature to Billing under a signed system token with no organization. Billing
        verifies the Stripe signature and its timestamp before reading the event or resolving
        the organization from Billing's provider records.

        Billing durably accepts supported deliveries before acknowledging them. Duplicate
        verified deliveries and verified event types that Billing does not process also return
        204. The provider signature is the credential for this route.
      tags: [billing]
      security: []
      parameters:
        - $ref: '../../components/billing-payments.yaml#/components/parameters/StripeSignature'
      requestBody:
        $ref: '../../components/billing-payments.yaml#/components/requestBodies/StripeWebhook'
      responses:
        '204':
          description: Verified delivery accepted, already recorded, or intentionally ignored.
          headers:
            Cache-Control:
              $ref: '../../components/billing.yaml#/components/headers/PrivateNoStore'
        '400':
          $ref: '../../components/billing-payments.yaml#/components/responses/StripeWebhookBadRequest'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/PaymentUnavailable'
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-cw_session
      description: Browser session with a selected organization.
  responses:
    PaymentUnavailable:
      description: |
        `billing.unavailable` when Billing cannot complete the operation. Dependency failures
        can use `upstream.failed`, `upstream.unauthorized`, `upstream.unreachable`,
        `upstream.timeout`, `upstream.unavailable`, `upstream.circuit-open`
        or `upstream.deadline-exceeded`.
      headers:
        Cache-Control:
          $ref: '../../components/billing.yaml#/components/headers/PrivateNoStore'
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
    BadRequest:
      description: |
        `request.invalid` with `details.issues` for an unknown query parameter or an invalid
        request body. `request.body-too-large` applies when the request exceeds the gateway body
        limit.
      headers:
        Cache-Control:
          $ref: '../../components/billing.yaml#/components/headers/PrivateNoStore'
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
    Unauthenticated:
      description: '`auth.session-required`, `auth.session-expired` or `auth.api-token-invalid`.'
      headers:
        Cache-Control:
          $ref: '../../components/billing.yaml#/components/headers/PrivateNoStore'
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
    Forbidden:
      description: |
        `auth.api-token-not-accepted`, `organization.not-selected`, `organization.mfa-required`,
        or `organization.role-forbidden` when the current active membership lacks the owner role.
      headers:
        Cache-Control:
          $ref: '../../components/billing.yaml#/components/headers/PrivateNoStore'
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
    OrganizationNotFound:
      description: '`organization.not-found` when the organization or current membership is absent.'
      headers:
        Cache-Control:
          $ref: '../../components/billing.yaml#/components/headers/PrivateNoStore'
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          example:
            type: about:blank
            title: Organisation introuvable.
            status: 404
            code: organization.not-found
    RateLimited:
      description: '`rate-limit.exceeded` when the gateway limit applies.'
      headers:
        Cache-Control:
          $ref: '../../components/billing.yaml#/components/headers/PrivateNoStore'
        Retry-After:
          description: Delay in seconds before trying again.
          schema:
            type: integer
            minimum: 1
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
    Unavailable:
      description: |
        `billing.unavailable` when the subscription or a required usage baseline is unavailable.
        Dependency failures can use `upstream.failed`, `upstream.unauthorized`,
        `upstream.unreachable`, `upstream.timeout`, `upstream.unavailable`,
        `upstream.circuit-open` or `upstream.deadline-exceeded`.
      headers:
        Cache-Control:
          $ref: '../../components/billing.yaml#/components/headers/PrivateNoStore'
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
