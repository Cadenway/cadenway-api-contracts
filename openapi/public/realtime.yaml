# Issues short-lived tickets for the authenticated browser to connect to realtime-gateway.
openapi: 3.1.0
info:
  title: Cadenway realtime
  version: 1.0.0
  description: |
    The API gateway issues a single-use ticket for a Socket.IO connection in the current
    organization of the browser's session. The browser holds the ticket in memory and passes
    it as `auth.token` to the realtime gateway on its configured realtime origin.

    The realtime gateway independently verifies that the connection's Origin exactly matches an
    allowed origin before redeeming a ticket. On reconnect, the client requests a new ticket.
    Ticket values never appear in URLs, cookies, problems, logs, traces or events.
  contact:
    name: Cadenway
    url: https://github.com/Cadenway/cadenway-api-contracts
  license:
    name: Proprietary
    url: https://github.com/Cadenway/cadenway-api-contracts/blob/main/LICENSE
  x-consumers:
    - repository: cadenway-api-gateway
      uses: Calls the Identity issuance route for the verified browser session and organization.
    - repository: cadenway-webapp
      uses: Requests a fresh ticket through the generated client before each realtime handshake.
servers:
  - url: https://api.cadenway.com
    description: Production.
  - url: https://api.staging.cadenway.com
    description: Staging.
tags:
  - name: realtime
    description: Realtime handshake credentials.
paths:
  /v1/realtime/tickets:
    parameters:
      - $ref: '../../components/http.yaml#/components/parameters/IfOrganizationMatch'
    post:
      operationId: issueRealtimeTicket
      x-cadenway-strict-empty: true
      summary: Issue a ticket for a realtime connection
      description: |
        Issues a ticket for the active session and its current organization, as verified by
        the API gateway. The request has no user, session or organization selector. A personal
        API token cannot issue a ticket, even when it belongs to a member of the organization.

        Cookie authentication uses the existing same-site write rules. Send an
        `application/json` body and an allowed Origin. This credential action returns `200`;
        the ticket has no retrievable resource URL. Every successful call returns a fresh
        credential with at most 60 seconds to redeem it. It becomes unusable once redeemed,
        if the session ends or if the session changes organization. The API gateway does not
        cache or automatically retry issuance.
      tags: [realtime]
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RealtimeTicketRequest'
            example: {}
      responses:
        '200':
          description: A fresh ticket for one connection attempt.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RealtimeTicket'
              example:
                token: 0123456789abcdefghijklmnopqrstuvwxyzABCDEFA
                expiresAt: '2026-12-08T13:08:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/IssuanceForbidden'
        '404':
          $ref: '#/components/responses/OrganizationNotFound'
        '412':
          $ref: '../../components/http.yaml#/components/responses/OrganizationContextChanged'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-cw_session
      description: The opaque browser session introspected with identity-service.
  headers:
    NoStore:
      description: Prevents storage by caches.
      schema:
        type: string
        const: no-store
        examples: [no-store]
  responses:
    BadRequest:
      description: |
        `request.invalid` if the body or query does not match the contract, or
        `request.body-too-large` if it exceeds the public request body limit.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          example:
            type: about:blank
            title: Bad Request
            status: 400
            code: request.invalid
    Unauthenticated:
      description: |
        `auth.session-required` when no session was supplied, `auth.session-expired` when the
        session has ended, or `auth.api-token-invalid` when an invalid bearer token is supplied.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          example:
            type: about:blank
            title: 'Connectez-vous pour continuer.'
            status: 401
            code: auth.session-required
    IssuanceForbidden:
      description: |
        - `auth.csrf-rejected`: the Origin is not allowed or the request is not JSON.
        - `auth.api-token-not-accepted`: the route does not accept a personal API token.
        - `organization.not-selected`: the session has no current organization for the request.
        - `organization.mfa-required`: the organization requires two-step verification for the
          caller. `details.organizationId` identifies that organization.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          example:
            type: about:blank
            title: 'Choisissez une organisation pour continuer.'
            status: 403
            code: organization.not-selected
    OrganizationNotFound:
      description: '`organization.not-found`: identity-service no longer recognizes the current membership.'
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          example:
            type: about:blank
            title: 'Organisation introuvable.'
            status: 404
            code: organization.not-found
    RateLimited:
      description: '`rate-limit.exceeded`: the request exceeds the gateway limit for the caller.'
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema:
            type: integer
            minimum: 1
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          example:
            type: about:blank
            title: 'Trop de requêtes : réessayez dans un instant.'
            status: 429
            code: rate-limit.exceeded
    Unavailable:
      description: |
        identity-service cannot answer. Possible codes are `upstream.unavailable`,
        `upstream.unreachable`, `upstream.timeout`, `upstream.circuit-open`, `upstream.failed`,
        `upstream.unauthorized` and `upstream.deadline-exceeded`. `details.service` identifies
        the unavailable service.
      content:
        application/problem+json:
          schema:
            $ref: '../../components/http.yaml#/components/schemas/Problem'
          example:
            type: about:blank
            title: Service Unavailable
            status: 503
            code: upstream.unavailable
            details:
              service: identity-service
  schemas:
    RealtimeTicketRequest:
      type: object
      additionalProperties: false
      description: An empty request. The gateway obtains the session and organization from the cookie.
    RealtimeTicket:
      $ref: '../../components/realtime.yaml#/components/schemas/RealtimeTicket'
