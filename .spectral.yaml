# Spectral rules of `pnpm lint:specs`: the stock OpenAPI and AsyncAPI rulesets, then the Cadenway
# contract style where a rule can check it (the `cw-contract-style` skill holds the whole table).
# A rule only reports on the documents that have what its `given` selects, so the OpenAPI rules
# stay silent on AsyncAPI documents and the reverse.
#
# test/spectral/valid/ passes every rule; test/spectral/invalid/ breaks each of them once, and
# test/spectral/ruleset.spec.ts asserts both.
extends:
  - spectral:oas
  - spectral:asyncapi

rules:
  # The stock rule asks for the latest AsyncAPI version, 3.1.0; cadenway-asyncapi-version requires
  # 3.0.0, the last one the model generator reads.
  asyncapi-latest-version: off

  # --- OpenAPI ---------------------------------------------------------------------------------

  cadenway-openapi-version:
    description: Specs are written in OpenAPI 3.1.
    message: '`openapi` must be a 3.1.x version, found {{value}}.'
    severity: error
    given: $.openapi
    then:
      function: pattern
      functionOptions:
        match: '^3\.1\.\d+$'

  cadenway-openapi-no-dynamic-ref:
    description: oasdiff does not resolve `$dynamicRef`, so the breaking-change check would miss it.
    message: '`$dynamicRef` is not allowed.'
    severity: error
    given: $..[?(@ && @.$dynamicRef)]
    then:
      field: $dynamicRef
      function: undefined

  cadenway-openapi-no-path-items-component:
    description: oasdiff does not resolve `components.pathItems`.
    message: '`components.pathItems` is not allowed.'
    severity: error
    given: $.components
    then:
      field: pathItems
      function: undefined

  cadenway-path-kebab-case:
    description: Path segments are kebab-case; path parameters are camelCase.
    message: '{{property}} must be made of kebab-case segments and camelCase parameters.'
    severity: error
    given: $.paths[*]~
    then:
      function: pattern
      functionOptions:
        match: '^(/([a-z][a-z0-9]*(-[a-z0-9]+)*|\{[a-z][A-Za-z0-9]*\}))+$'

  cadenway-path-plural-collection:
    description: >-
      A resource is plural: the segment in front of a path parameter names a collection. A warning,
      because a pattern cannot tell an irregular plural.
    message: '{{property}}: the segment in front of a path parameter must be plural.'
    severity: warn
    given: $.paths[*]~
    then:
      function: pattern
      functionOptions:
        notMatch: '[^s/]/\{'

  cadenway-path-no-organization:
    description: The organization comes from the verified token, never from the path.
    message: '{{property}} must not carry the organization.'
    severity: error
    given: $.paths[*]~
    then:
      function: pattern
      functionOptions:
        notMatch: '/\{(org|organi[sz]ation)(Id)?\}'

  cadenway-error-status:
    description: Error responses use 400, 401, 403, 404, 409, 412, 422, 429 or 503.
    message: 'Status {{property}}: error responses use 400, 401, 403, 404, 409, 412, 422, 429 or 503.'
    severity: error
    # On the document as written: the report names the status, not the component it refers to.
    resolved: false
    given: $.paths[*][get,put,post,patch,delete].responses
    then:
      function: schema
      functionOptions:
        schema:
          type: object
          patternProperties:
            '^(?!(400|401|403|404|409|412|422|429|503)$)[45]': false

  cadenway-error-problem-json:
    description: An error response has one body, `application/problem+json` (RFC 9457).
    message: 'An error response must have `application/problem+json` as its only content.'
    severity: error
    given: $.paths[*][get,put,post,patch,delete].responses[?(@property.match(/^[45]/))]
    then:
      function: schema
      functionOptions:
        schema:
          type: object
          required: [content]
          properties:
            content:
              type: object
              required: [application/problem+json]
              additionalProperties: false
              properties:
                application/problem+json: true

  cadenway-problem-schema:
    description: >-
      The problem declares `type`, `title`, `status`, `detail`, `instance`, `code` and `details`,
      and requires `type`, `title`, `status` and `code`.
    message: 'The problem schema must declare the seven members and require `type`, `title`, `status`, `code`: {{error}}'
    severity: error
    given: $.paths[*][get,put,post,patch,delete].responses[?(@property.match(/^[45]/))].content[application/problem+json].schema
    then:
      function: schema
      functionOptions:
        schema:
          type: object
          required: [properties, required]
          properties:
            properties:
              type: object
              required: [type, title, status, detail, instance, code, details]
            required:
              type: array
              allOf:
                - contains: { const: type }
                - contains: { const: title }
                - contains: { const: status }
                - contains: { const: code }

  cadenway-pagination-no-offset:
    description: Lists are paginated by cursor, never by page or offset.
    message: 'Query parameter `{{value}}` is page or offset pagination; use `cursor` and `limit`.'
    severity: error
    given: $.paths..parameters[?(@ && @.in == 'query')].name
    then:
      function: pattern
      functionOptions:
        notMatch: '^(page|pageNumber|pageSize|perPage|per_page|offset|skip)$'

  cadenway-pagination-limit:
    description: '`limit` is an integer from 1 to 100 at most, 50 by default.'
    message: '`limit` must be an integer with `minimum: 1`, a `maximum` of 100 at most and `default: 50`: {{error}}'
    severity: error
    given: $.paths..parameters[?(@ && @.in == 'query' && @.name == 'limit')].schema
    then:
      function: schema
      functionOptions:
        schema:
          type: object
          required: [type, minimum, maximum, default]
          properties:
            type: { const: integer }
            minimum: { const: 1 }
            maximum: { type: integer, minimum: 1, maximum: 100 }
            default: { const: 50 }

  cadenway-pagination-cursor:
    description: >-
      A list takes `cursor` and `limit` together and answers `nextCursor`, a string or `null` on
      the last page.
    message: 'A paginated operation needs `cursor`, `limit` and a required `nextCursor` of type string or null in its 200 response: {{error}}'
    severity: error
    given: $.paths[*].get
    then:
      function: schema
      functionOptions:
        schema:
          type: object
          if:
            required: [parameters]
            properties:
              parameters:
                contains:
                  type: object
                  required: [in, name]
                  properties:
                    in: { const: query }
                    name: { enum: [cursor, limit] }
          then:
            required: [responses]
            properties:
              parameters:
                allOf:
                  - contains:
                      type: object
                      required: [in, name]
                      properties:
                        in: { const: query }
                        name: { const: cursor }
                  - contains:
                      type: object
                      required: [in, name]
                      properties:
                        in: { const: query }
                        name: { const: limit }
              responses:
                type: object
                required: ['200']
                properties:
                  '200':
                    type: object
                    required: [content]
                    properties:
                      content:
                        type: object
                        required: [application/json]
                        properties:
                          application/json:
                            type: object
                            required: [schema]
                            properties:
                              schema:
                                type: object
                                required: [properties, required]
                                properties:
                                  required:
                                    type: array
                                    contains: { const: nextCursor }
                                  properties:
                                    type: object
                                    required: [nextCursor]
                                    properties:
                                      nextCursor:
                                        type: object
                                        required: [type]
                                        properties:
                                          type:
                                            type: array
                                            minItems: 2
                                            maxItems: 2
                                            allOf:
                                              - contains: { const: string }
                                              - contains: { const: 'null' }

  # --- AsyncAPI --------------------------------------------------------------------------------

  cadenway-asyncapi-version:
    description: >-
      Event specs are AsyncAPI 3.0.0 exactly: the model generator does not read 3.1.0 and writes
      one untyped `Root` model without failing, so this rule is the only guard.
    message: '`asyncapi` must be 3.0.0, found {{value}}.'
    severity: error
    given: $.asyncapi
    then:
      function: pattern
      functionOptions:
        match: '^3\.0\.0$'

  cadenway-event-channel-address:
    description: The address of a channel is the subject `evt.<entity>.<past-tense-fact>.v<n>`.
    message: 'Channel address {{value}} must be `evt.<entity>.<fact>.v<n>`.'
    severity: error
    given: $.channels[*]
    then:
      - field: address
        function: truthy
      - field: address
        function: pattern
        functionOptions:
          match: '^evt\.[a-z][a-z0-9-]*(\.[a-z][a-z0-9-]*)+\.v[1-9][0-9]*$'

  cadenway-event-name:
    description: An event is named `<entity>.<past-tense-fact>.v<n>`.
    message: 'Message name must be `<entity>.<fact>.v<n>`.'
    severity: error
    given:
      - $.channels[*].messages[*]
      - $.components.messages[*]
    then:
      - field: name
        function: truthy
      - field: name
        function: pattern
        functionOptions:
          match: '^[a-z][a-z0-9-]*(\.[a-z][a-z0-9-]*)+\.v[1-9][0-9]*$'

  cadenway-event-payload:
    description: >-
      Every event carries `id`, `occurredAt`, `organizationId`, `actor` and `version`; `actor` is
      `{ type, id }` with the four actor types; `version` is the integer version of the aggregate.
    message: 'Event payload: {{error}}'
    severity: error
    given:
      - $.channels[*].messages[*].payload
      - $.components.messages[*].payload
    then:
      function: schema
      functionOptions:
        schema:
          type: object
          required: [properties, required]
          properties:
            required:
              type: array
              allOf:
                - contains: { const: id }
                - contains: { const: occurredAt }
                - contains: { const: organizationId }
                - contains: { const: actor }
                - contains: { const: version }
            properties:
              type: object
              required: [id, occurredAt, organizationId, actor, version]
              properties:
                version:
                  type: object
                  required: [type]
                  properties:
                    type: { const: integer }
                actor:
                  type: object
                  required: [properties, required]
                  properties:
                    required:
                      type: array
                      allOf:
                        - contains: { const: type }
                        - contains: { const: id }
                    properties:
                      type: object
                      required: [type, id]
                      properties:
                        type:
                          type: object
                          required: [enum]
                          properties:
                            enum:
                              type: array
                              minItems: 4
                              maxItems: 4
                              allOf:
                                - contains: { const: user }
                                - contains: { const: automation }
                                - contains: { const: git }
                                - contains: { const: system }

# The prefix of a path depends on the folder of the document: public routes are what the gateway
# exposes, internal routes what a service exposes to the gateway.
overrides:
  - files:
      - '**/openapi/public/**'
    rules:
      cadenway-path-prefix-public:
        description: Public paths start with `/v1/`.
        message: '{{property}} must start with `/v1/`.'
        severity: error
        given: $.paths[*]~
        then:
          function: pattern
          functionOptions:
            match: '^/v1/'
  - files:
      - '**/openapi/internal/**'
    rules:
      cadenway-path-prefix-internal:
        description: Internal paths start with `/internal/v1/`.
        message: '{{property}} must start with `/internal/v1/`.'
        severity: error
        given: $.paths[*]~
        then:
          function: pattern
          functionOptions:
            match: '^/internal/v1/'
