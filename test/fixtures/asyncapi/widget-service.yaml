asyncapi: 3.0.0
info:
  title: Widget service fixture events
  version: 1.0.0
  description: >-
    Fictional event contract used only by the pipeline tests of this repository. It describes no
    Waypoint event; it only follows the event naming and payload rules.
  contact:
    name: Pipeline fixture
    url: https://fixture.invalid
    email: fixture@fixture.invalid
  license:
    name: Proprietary
  tags:
    - name: widgets
      description: A fictional resource.
servers:
  fixture:
    host: fixture.invalid
    protocol: nats
    description: Placeholder; nothing is deployed at this address.
channels:
  widget.created.v1:
    address: widget.created.v1
    description: >-
      A widget was created. Emitter: the fictional widget service. Consumers: none.
    messages:
      widgetCreatedV1:
        $ref: '#/components/messages/WidgetCreatedV1'
operations:
  publishWidgetCreatedV1:
    action: send
    summary: Publish the creation of a widget
    description: Sent once per created widget.
    channel:
      $ref: '#/channels/widget.created.v1'
    messages:
      - $ref: '#/channels/widget.created.v1/messages/widgetCreatedV1'
components:
  messages:
    WidgetCreatedV1:
      name: widget.created.v1
      title: Widget created
      summary: A widget was created.
      contentType: application/json
      payload:
        $ref: '#/components/schemas/WidgetCreatedV1'
      examples:
        - name: redGear
          summary: A red widget created by a member
          payload:
            id: evt-1
            occurredAt: '2026-01-15T09:30:00Z'
            organizationId: org-1
            actor:
              type: user
              id: usr-1
            widgetId: wid-1
            name: Left gear
            color: red
  schemas:
    WidgetCreatedV1:
      type: object
      description: Payload of widget.created.v1.
      required:
        - id
        - occurredAt
        - organizationId
        - actor
        - widgetId
        - name
        - color
      properties:
        id:
          type: string
          description: Identifier of the event, used to deduplicate deliveries.
        occurredAt:
          type: string
          format: date-time
          description: When the fact happened, ISO 8601.
        organizationId:
          type: string
          description: Organization that owns the widget.
        actor:
          $ref: '#/components/schemas/EventActor'
        widgetId:
          type: string
          description: Identifier of the created widget.
        name:
          type: string
          description: Display name of the widget.
        color:
          $ref: '#/components/schemas/WidgetColor'
    EventActor:
      type: object
      description: Who caused the fact.
      required:
        - type
        - id
      properties:
        type:
          $ref: '#/components/schemas/EventActorType'
        id:
          type: string
          description: Identifier of the actor.
    EventActorType:
      type: string
      description: Kind of actor.
      enum:
        - user
        - system
    WidgetColor:
      type: string
      description: Color of a widget.
      enum:
        - red
        - green
        - blue
