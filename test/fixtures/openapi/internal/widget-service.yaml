openapi: 3.1.0
info:
  title: Widget service fixture
  version: 1.0.0
  description: >-
    Fictional internal contract of the pipeline tests: what an imaginary widget service would expose
    to the gateway. Internal documents feed the contracts package only, never the Angular client.
  contact:
    name: Pipeline fixture
servers:
  - url: https://fixture.invalid
    description: Placeholder; nothing is deployed at this address.
tags:
  - name: widgets
    description: A fictional resource.
paths:
  /internal/widgets/{widgetId}:
    get:
      operationId: getInternalWidget
      summary: Get a widget
      description: Returns one widget with the fields only the gateway reads.
      tags:
        - widgets
      parameters:
        - name: widgetId
          in: path
          description: Identifier of the widget.
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The widget.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalWidget'
              examples:
                redGear:
                  summary: An existing widget
                  value:
                    id: wid-1
                    organizationId: org-1
                    name: Left gear
        '404':
          description: No widget has this identifier.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                notFound:
                  summary: An unknown widget
                  value:
                    code: widget.not-found
                    message: No widget has this identifier.
components:
  schemas:
    InternalWidget:
      type: object
      description: A widget as the service stores it.
      required:
        - id
        - organizationId
        - name
      properties:
        id:
          type: string
          description: Identifier of the widget.
        organizationId:
          type: string
          description: Organization that owns the widget.
        name:
          type: string
          description: Display name.
    Error:
      type: object
      description: The single error shape of every route.
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: Stable machine code.
        message:
          type: string
          description: Human-readable explanation.
        details:
          type: object
          description: Optional structured context.
          additionalProperties: true
