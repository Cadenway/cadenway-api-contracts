# Fixture of tests/redocly/ruleset.spec.ts: every Cadenway rule on event names and payloads is
# broken here once, on purpose. Not linted by `pnpm lint:specs`.
asyncapi: 3.0.0
info:
  title: Contract style counter-example, events
  version: 1.0.0
  description: Breaks the Redocly rules of this repository.
channels:
  taskUpdated:
    # cadenway/event-channel-address: no `evt.` prefix and no version.
    address: task.updated
    description: A task changed.
    messages:
      taskUpdated:
        $ref: '#/components/messages/taskUpdated'
operations:
  publishTaskUpdated:
    action: send
    summary: task-service publishes the change of a task.
    channel:
      $ref: '#/channels/taskUpdated'
    messages:
      - $ref: '#/channels/taskUpdated/messages/taskUpdated'
components:
  messages:
    taskUpdated:
      # cadenway/event-name: not `<entity>.<fact>.v<n>`.
      name: TaskUpdated
      title: Task updated
      summary: A task changed.
      # cadenway/event-payload: no `version`, and an actor type outside the four.
      payload:
        type: object
        required: [id, occurredAt, organizationId, actor]
        properties:
          id:
            type: string
          occurredAt:
            type: string
            format: date-time
          organizationId:
            type: string
          actor:
            type: object
            required: [type, id]
            properties:
              type:
                type: string
                enum: [user, bot]
              id:
                type: string
