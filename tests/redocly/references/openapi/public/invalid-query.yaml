openapi: 3.2.0
info:
  title: Invalid query reference
  version: 1.0.0
paths:
  /v1/tasks:
    query:
      operationId: queryTasks
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                cursor:
                  type: string
                limit:
                  type: integer
                  minimum: 0
                  maximum: 1000
                  default: 50
                offset:
                  type: integer
      responses:
        '200':
          description: Page without a continuation.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: string
