plugins:
  - ./rules/contracts-redocly.mjs
extends:
  - recommended
rules:
  struct: error
  security-defined: off
  cadenway/openapi-version: error
  cadenway/openapi-no-dynamic-ref: error
  cadenway/openapi-no-path-items-component: error
  cadenway/path-kebab-case: error
  cadenway/path-plural-collection: warn
  cadenway/path-no-organization: error
  cadenway/path-prefix-public: error
  cadenway/path-prefix-internal: error
  cadenway/error-status: error
  cadenway/error-problem-json: error
  cadenway/problem-schema: error
  cadenway/pagination-no-offset: error
  cadenway/pagination-limit: error
  cadenway/pagination-cursor: error
  cadenway/security-declared: error
  cadenway/security-scopes: error
  cadenway/asyncapi-version: error
  cadenway/event-channel-address: error
  cadenway/event-name: error
  cadenway/event-payload: error
# Shared components have no routes or servers. Their members are used by specs in other files.
apis:
  public-intake:
    root: openapi/public/intake.yaml
  shared-attachments:
    root: components/attachments.yaml
    rules:
      no-empty-servers: off
      no-unused-components: off
  shared-task-approval:
    root: components/approval.yaml
    rules:
      no-empty-servers: off
      no-unused-components: off
  shared-http:
    root: components/http.yaml
    rules:
      no-empty-servers: off
      no-unused-components: off
  shared-organization:
    root: components/organization.yaml
    rules:
      no-empty-servers: off
      no-unused-components: off
  shared-task:
    root: components/task.yaml
    rules:
      no-empty-servers: off
      no-unused-components: off
  shared-time:
    root: components/time.yaml
    rules:
      no-empty-servers: off
      no-unused-components: off
  shared-onboarding:
    root: components/onboarding.yaml
    rules:
      no-empty-servers: off
      no-unused-components: off
  shared-goals:
    root: components/goals.yaml
    rules:
      no-empty-servers: off
      no-unused-components: off
  shared-dashboard:
    root: components/dashboard.yaml
    rules:
      no-empty-servers: off
      no-unused-components: off
  shared-reporting:
    root: components/reporting.yaml
    rules:
      no-empty-servers: off
      no-unused-components: off
  shared-intake:
    root: components/intake.yaml
    rules:
      no-empty-servers: off
      no-unused-components: off
