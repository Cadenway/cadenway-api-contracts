name: CI

on:
  pull_request:
  push:
    branches: [main]

# Each job states the permissions it needs.
permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      # Reads the @cadenway/* packages from GitHub Packages.
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: '@cadenway'
      - run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: pnpm format:check
      # Lint the reference documents as well as the authored contracts.
      - run: pnpm test:lint
      - run: pnpm lint:code
      - run: pnpm lint:specs
      - run: pnpm generate
      # The generated trees are committed: a spec change without its regenerated code stops here.
      - run: git status --porcelain && test -z "$(git status --porcelain)"
      - run: pnpm typecheck
      - run: pnpm test:architecture
      - run: pnpm test
      - run: pnpm build

  breaking:
    name: Breaking changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: head
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.base_ref }}
          path: base
          persist-credentials: false
      # Compares every OpenAPI document with main; skipped while main has no spec.
      - if: hashFiles('base/openapi/**/*.yaml') != ''
        uses: oasdiff/oasdiff-action/breaking@8a211b41745fcecdfa4a86531ffbf08934fb14f6 # v0.1.23
        with:
          base: 'base/openapi/**/*.yaml'
          revision: 'head/openapi/**/*.yaml'
          composed: true
          fail-on: ERR
          # The specs take the problem and the pagination members from components/ by a relative
          # `$ref`, which the action refuses by default. `pnpm breaking` passes the same option.
          allow-external-refs: true

  tooling:
    name: Agent tooling copies
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A rule or a skill exists twice, for Claude Code and for Codex: the two copies must match.
      - name: Compare the .claude and .codex copies of rules and skills
        run: |
          status=0
          for file in .claude/rules/*.md .claude/skills/*/SKILL.md; do
            twin=".codex/${file#.claude/}"
            if ! cmp --silent "$file" "$twin"; then
              echo "::error file=$file::differs from $twin"
              status=1
            fi
          done
          for file in .codex/rules/*.md; do
            twin=".claude/${file#.codex/}"
            if ! cmp --silent "$file" "$twin"; then
              echo "::error file=$file::differs from $twin"
              status=1
            fi
          done
          exit "$status"

  conventions:
    name: Commit conventions
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: '@cadenway'
      - run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # The pull request title becomes the squash commit on main.
      - run: printf '%s\n' "$PR_TITLE" | pnpm exec commitlint
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
      - run: pnpm exec commitlint --from "$BASE_SHA" --to "$HEAD_SHA"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
