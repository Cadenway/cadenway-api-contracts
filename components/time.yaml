# Shared models of the task time and status history routes.
openapi: 3.1.0
info:
  title: Cadenway shared task time components
  version: 1.0.0
  description: Time entries, totals and measured status history of a task.
  contact:
    name: Cadenway
    url: https://github.com/Cadenway/cadenway-api-contracts
  license:
    name: Proprietary
    url: https://github.com/Cadenway/cadenway-api-contracts/blob/main/LICENSE
components:
  parameters:
    TimeEntryId:
      name: timeEntryId
      in: path
      required: true
      description: UUID of the time entry within the task.
      schema:
        $ref: '#/components/schemas/TimeEntryId'
  schemas:
    TimeEntryId:
      type: string
      format: uuid
      pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-7[0-9a-fA-F]{3}-[89aAbB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$'
      examples: [019a7003-4d5e-7f6a-8b9c-0d1e2f3a4b01]
    WorkLogMinutes:
      type: integer
      minimum: 1
      maximum: 1440
      description: Whole minutes recorded in this entry.
    TaskWorkDate:
      type: string
      format: date
      pattern: '^([1-9][0-9]{3}|0[1-9][0-9]{2}|00[1-9][0-9]|000[1-9])-[0-9]{2}-[0-9]{2}$'
      description: Work date in the caller's time zone from 0001-01-01 to 9999-12-31, independent of the UTC creation instant.
    TaskTimeEntryCreation:
      type: object
      additionalProperties: false
      required: [minutes, workDate]
      properties:
        minutes:
          $ref: '#/components/schemas/WorkLogMinutes'
        workDate:
          $ref: '#/components/schemas/TaskWorkDate'
        note:
          type: string
          maxLength: 500
          description: Plain text. Surrounding whitespace is removed. An empty note is stored as null.
    TaskTimeEntry:
      type: object
      required: [id, taskKey, authorUserId, minutes, workDate, note, createdAt]
      properties:
        id:
          $ref: '#/components/schemas/TimeEntryId'
        taskKey:
          $ref: './task.yaml#/components/schemas/TaskKey'
        authorUserId:
          type: string
          format: uuid
          description: Stable ID of the verified author, including after the author leaves the organization.
        minutes:
          $ref: '#/components/schemas/WorkLogMinutes'
        workDate:
          $ref: '#/components/schemas/TaskWorkDate'
        note:
          type: [string, 'null']
          description: The normalized note, or null when absent.
        createdAt:
          type: string
          format: date-time
          description: Server creation instant in UTC.
    TaskTimeEntryPage:
      type: object
      required: [items, nextCursor, total, totalMinutes]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TaskTimeEntry'
        nextCursor:
          $ref: './http.yaml#/components/schemas/NextCursor'
        total:
          type: integer
          minimum: 0
          description: Number of entries on the task before pagination.
        totalMinutes:
          type: integer
          minimum: 0
          description: Sum over all entries on the task before pagination. Subtasks are counted separately.
    TaskTimeSummary:
      type: object
      required: [totalMinutes, estimateMinutes]
      properties:
        totalMinutes:
          type: integer
          minimum: 0
          description: Sum over all entries on the task. Subtasks are counted separately.
        estimateMinutes:
          $ref: './task.yaml#/components/schemas/EstimateMinutes'
    TaskStatusDuration:
      type: object
      required: [status, durationMilliseconds, active]
      properties:
        status:
          $ref: './task.yaml#/components/schemas/StatusKey'
        durationMilliseconds:
          type: integer
          minimum: 0
          description: Sum of elapsed milliseconds across the covered visits to this status.
        active:
          type: boolean
          description: True only for the current status when its category is open or active.
    TaskStatusDurationSummary:
      type: object
      required: [observedAt, coverageStartedAt, complete, durations]
      properties:
        observedAt:
          type: string
          format: date-time
          description: One server observation instant in UTC used for all spans in this summary.
        coverageStartedAt:
          type: string
          format: date-time
          description: Earliest reliable boundary of the covered suffix, or observedAt with no earlier boundary.
        complete:
          type: boolean
          description: True when the initial status and all transitions are known since task creation.
        durations:
          type: array
          description: |
            One row per covered status, in order of first appearance in the covered suffix.
            The observed current status has a row even when its measured duration is zero.
          items:
            $ref: '#/components/schemas/TaskStatusDuration'
    TaskStatusDurationResult:
      type: object
      required: [summary]
      properties:
        summary:
          oneOf:
            - $ref: '#/components/schemas/TaskStatusDurationSummary'
            - type: 'null'
          description: Null for a milestone.
