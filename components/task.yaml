# Components shared by the task contracts: openapi/public/spaces.yaml, openapi/public/lists.yaml,
# openapi/public/tasks.yaml, openapi/public/access.yaml, openapi/public/archives.yaml,
# openapi/public/trash.yaml and openapi/internal/task-service.yaml. A spec references them with a
# relative `$ref` (`../../components/task.yaml#/components/...`); nothing here is a route.
openapi: 3.1.0
info:
  title: Cadenway shared task components
  version: 1.0.0
  description: |
    The shared enumerations of `@cadenway/contracts` (status keys and categories, priorities,
    cancel reasons), the resources of spaces, lists, sprints and tasks, their access grants,
    access requests, archives and trash entries, and the query parameters of the task queries,
    which the public routes of the gateway and the internal routes of task-service carry with the
    same shape.

    **Limits.** The limits of the product (lengths of names and texts, counts of assignees,
    labels, subtasks, checklist items and grants, the estimate) bound the requests. The responses
    state them in their descriptions only, so that a later version may raise one without refusing
    what an older validator reads. The formats of the identifiers, a task key and a prefix, are not
    limits: the responses check them.

    **Members added later.** A member added to a resource after its first version (the role of
    the caller, the switch "Accès de l’organisation", the archive of a list or a task) is optional
    in the response schemas, so that an answer of a task-service that does not send it yet still
    passes the validator of a gateway that already knows it; each says what its absence stands
    for. Every answer of a task-service of this version carries them.
  contact:
    name: Cadenway
    url: https://github.com/Cadenway/cadenway-api-contracts
  license:
    name: Proprietary
    url: https://github.com/Cadenway/cadenway-api-contracts/blob/main/LICENSE
components:
  parameters:
    Today:
      name: today
      in: query
      required: true
      description: |
        The date of the caller, in their time zone, which task-service does not know: the late
        tasks, the tasks due that day and the current sprints are counted against it.
      schema:
        type: string
        format: date
        examples: ['2026-11-08']
    StatusFilter:
      name: status
      in: query
      required: false
      description: Statuses to keep, separated by commas.
      style: form
      explode: false
      schema:
        type: array
        minItems: 1
        maxItems: 10
        items:
          $ref: '#/components/schemas/StatusKey'
        examples: [[progress, review]]
    PriorityFilter:
      name: priority
      in: query
      required: false
      description: Priorities to keep, separated by commas.
      style: form
      explode: false
      schema:
        type: array
        minItems: 1
        maxItems: 4
        items:
          $ref: '#/components/schemas/PriorityKey'
        examples: [[urgente, haute]]
    AssigneeFilter:
      name: assignee
      in: query
      required: false
      description: |
        Assignees to keep, separated by commas: account ids, `me` for the caller, `none` for the
        tasks nobody is assigned.
      style: form
      explode: false
      schema:
        type: array
        minItems: 1
        maxItems: 20
        items:
          type: string
          pattern: '^(me|none|[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})$'
        examples: [[me, none]]
    LabelFilter:
      name: label
      in: query
      required: false
      description: Labels to keep, separated by commas, without regard to case.
      style: form
      explode: false
      schema:
        type: array
        minItems: 1
        maxItems: 20
        items:
          type: string
          minLength: 1
          maxLength: 32
        examples: [[Auth, Front]]
    Search:
      name: search
      in: query
      required: false
      description: Text to find, without regard to case or accents.
      schema:
        type: string
        minLength: 1
        maxLength: 100
        examples: [sso]
    DueFrom:
      name: dueFrom
      in: query
      required: false
      description: Keep the tasks due on or after this date.
      schema:
        type: string
        format: date
        examples: ['2026-11-09']
    DueTo:
      name: dueTo
      in: query
      required: false
      description: Keep the tasks due on or before this date.
      schema:
        type: string
        format: date
        examples: ['2026-11-15']
    Level:
      name: level
      in: query
      required: false
      description: '`roots` for the top-level tasks only, `all` for the subtasks too.'
      schema:
        type: string
        default: roots
        enum: [roots, all]
    TaskSort:
      name: sort
      in: query
      required: false
      description: Order of the tasks; a leading `-` reverses it.
      schema:
        type: string
        default: manual
        enum:
          [
            manual,
            -manual,
            dueDate,
            -dueDate,
            priority,
            -priority,
            name,
            -name,
            createdAt,
            -createdAt,
          ]
    GroupBy:
      name: groupBy
      in: query
      required: true
      description: What to group by ("Statut", "Priorité", "Assigné").
      schema:
        type: string
        enum: [status, priority, assignee]
    MyTaskState:
      name: state
      in: query
      required: false
      description: '`open` ("À faire", not closed) or `closed` ("Terminées", `done` and `cancelled`).'
      schema:
        type: string
        default: open
        enum: [open, closed]
    MilestoneFilter:
      name: milestone
      in: query
      required: false
      description: Keep only milestones when true, or only ordinary tasks when false; absent leaves both.
      schema:
        type: boolean
    ActivityKind:
      name: kind
      in: query
      required: false
      description: Kinds of entries to keep, separated by commas; every kind when absent.
      style: form
      explode: false
      schema:
        type: array
        minItems: 1
        maxItems: 6
        items:
          type: string
          enum: [create, status, priority, due, assign, comment]
        examples: [[status, assign]]
    ActorId:
      name: actorId
      in: query
      required: false
      description: |
        Actors to keep, separated by commas: account ids for people, the id of the actor otherwise;
        every actor when absent.
      style: form
      explode: false
      schema:
        type: array
        minItems: 1
        maxItems: 20
        items:
          type: string
          minLength: 1
          maxLength: 100
        examples: [[019a5f3c-a0b1-7c2d-9e3f-5a6b7c8d9e32]]
  schemas:
    TaskTemplateCreation:
      type: object
      required: [sourceTaskKey]
      properties:
        sourceTaskKey:
          $ref: '#/components/schemas/TaskKey'
        name:
          $ref: '#/components/schemas/SavedItemName'
          description: Optional library name; when omitted it defaults to the source task name.
    SavedItemName:
      type: string
      minLength: 1
      maxLength: 80
      pattern: '\S'
      description: A nonblank saved view or template name, at most 80 characters.
    TaskTemplate:
      type: object
      required:
        [
          id,
          spaceId,
          name,
          title,
          description,
          priority,
          labels,
          checklist,
          subtasks,
          createdAt,
          version,
        ]
      description: |
        A space-shared snapshot of task ingredients. Checklist texts and direct live child names
        retain their order; dates, assignees, mentions, recurrence, milestones and watchers are not
        copied. A client uses these ingredients to prefill a normal TaskCreation.
      properties:
        id: { type: string, format: uuid }
        spaceId: { type: string, format: uuid }
        name: { type: string, description: 'Library name, at most 80 characters.' }
        title:
          { type: string, description: 'Source task title for a new task, at most 300 characters.' }
        description:
          { type: [string, 'null'], description: Markdown source at most 50000 characters or null. }
        priority:
          $ref: '#/components/schemas/PriorityKey'
        labels:
          type: array
          items: { type: string }
        checklist:
          type: array
          description: Up to 100 checklist texts, each subject to ChecklistItemCreation rules when submitted.
          items: { type: string }
        subtasks:
          type: array
          description: Up to 25 direct child names, each subject to SubtaskName rules when submitted.
          items: { type: string }
        createdAt: { type: string, format: date-time }
        version: { type: integer, minimum: 1 }
    TaskTemplatePage:
      type: object
      required: [items, nextCursor]
      description: Space templates ordered by creation time and ID.
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/TaskTemplate' }
        nextCursor: { $ref: './http.yaml#/components/schemas/NextCursor' }
    SavedViewSort:
      type: string
      description: The signed sort vocabulary of the list tasks query, without a patch-time default.
      enum:
        [
          manual,
          -manual,
          dueDate,
          -dueDate,
          priority,
          -priority,
          name,
          -name,
          createdAt,
          -createdAt,
        ]
    SavedViewLayout:
      type: string
      description: Layout key from the task views in the mockup.
      enum: [list, board, calendar, gantt, workload, table, form, activity, timesheet]
    SavedViewSheetColumn:
      type: string
      description: Feuille column key from the mockup.
      enum: [name, status, priority, people, due, estimate, spent, labels, list, points, client]
    SavedViewCustomFieldSort:
      type: object
      required: [fieldId, direction]
      description: |
        Feuille-only sort by a custom field's stable ID. It takes precedence over sheetSort while
        the list has that active definition. Otherwise the client falls back to sheetSort.
      properties:
        fieldId: { $ref: '#/components/schemas/CustomFieldId' }
        direction: { type: string, enum: [asc, desc] }
    SavedViewFilters:
      type: object
      description: |
        Existing task-query filters. `me` is resolved for the person applying the view, not its
        creator. Search, milestone, level, collapsed groups, zoom and tab selection remain local.
      properties:
        status: { $ref: '#/components/parameters/StatusFilter/schema' }
        priority: { $ref: '#/components/parameters/PriorityFilter/schema' }
        assignee: { $ref: '#/components/parameters/AssigneeFilter/schema' }
        label: { $ref: '#/components/parameters/LabelFilter/schema' }
    SavedViewPresentation:
      type: object
      description: Client presentation settings; sheet sort never changes the server query sort.
      properties:
        hiddenBoardStatusKeys:
          type: array
          items: { $ref: '#/components/schemas/StatusKey' }
        hiddenSheetColumns:
          type: array
          items: { $ref: '#/components/schemas/SavedViewSheetColumn' }
        hiddenCustomFieldIds:
          type: array
          maxItems: 30
          description: IDs of custom columns to hide, including stored preferences for retired fields.
          items: { $ref: '#/components/schemas/CustomFieldId' }
        sheetSort:
          type: object
          required: [column, direction]
          description: Feuille-only sort applied to the fully loaded result by the client.
          properties:
            column: { $ref: '#/components/schemas/SavedViewSheetColumn' }
            direction: { type: string, enum: [asc, desc] }
        customFieldSort: { $ref: '#/components/schemas/SavedViewCustomFieldSort' }
    SavedViewLayoutValue:
      type: string
      x-extensible-enum: [list, board, calendar, gantt, workload, table, form, activity, timesheet]
      description: Layout key; clients may ignore unknown future layouts.
    SavedViewSheetColumnValue:
      type: string
      x-extensible-enum:
        [name, status, priority, people, due, estimate, spent, labels, list, points, client]
      description: Feuille column key; clients may ignore unknown future columns.
    SavedViewPresentationValue:
      type: object
      description: Client presentation settings; sheet sort never changes the server query sort.
      properties:
        hiddenBoardStatusKeys:
          type: array
          items: { $ref: '#/components/schemas/StatusKey' }
        hiddenSheetColumns:
          type: array
          items: { $ref: '#/components/schemas/SavedViewSheetColumnValue' }
        hiddenCustomFieldIds:
          type: array
          description: Stable IDs of hidden custom columns; clients ignore retired or unknown IDs.
          items: { $ref: '#/components/schemas/CustomFieldId' }
        sheetSort:
          type: object
          required: [column, direction]
          description: Feuille-only sort applied to the fully loaded result by the client.
          properties:
            column: { $ref: '#/components/schemas/SavedViewSheetColumnValue' }
            direction: { type: string, x-extensible-enum: [asc, desc] }
        customFieldSort: { $ref: '#/components/schemas/SavedViewCustomFieldSort' }
    SavedViewConfigurationInput:
      type: object
      required: [layout, filters, sort, groupBy]
      description: |
        Shared explicit query and presentation settings. `groupBy: null` is ungrouped and skips
        the task-groups call. Signed `sort` values use the existing list-tasks vocabulary.
      properties:
        layout: { $ref: '#/components/schemas/SavedViewLayout' }
        filters: { $ref: '#/components/schemas/SavedViewFilters' }
        sort: { $ref: '#/components/schemas/SavedViewSort' }
        groupBy:
          oneOf:
            - $ref: '#/components/parameters/GroupBy/schema'
            - type: 'null'
        presentation: { $ref: '#/components/schemas/SavedViewPresentation' }
    SavedViewSortValue:
      type: string
      description: Signed server task sort; clients may ignore future values.
      x-extensible-enum:
        [
          manual,
          -manual,
          dueDate,
          -dueDate,
          priority,
          -priority,
          name,
          -name,
          createdAt,
          -createdAt,
        ]
    SavedViewGroupByValue:
      type: [string, 'null']
      description: Grouping key, or null for ungrouped; clients may ignore future values.
      x-extensible-enum: [status, priority, assignee]
    SavedViewConfiguration:
      type: object
      required: [layout, filters, sort, groupBy]
      description: |
        Shared explicit query and presentation settings. `groupBy: null` is ungrouped and skips
        the task-groups call. Signed `sort` values use the existing list-tasks vocabulary.
      properties:
        layout: { $ref: '#/components/schemas/SavedViewLayoutValue' }
        filters: { $ref: '#/components/schemas/SavedViewFilters' }
        sort: { $ref: '#/components/schemas/SavedViewSortValue' }
        groupBy: { $ref: '#/components/schemas/SavedViewGroupByValue' }
        presentation: { $ref: '#/components/schemas/SavedViewPresentationValue' }
    SavedViewFiltersPatch:
      type: object
      description: A nested merge patch; null removes the named filter.
      properties:
        status:
          oneOf:
            - $ref: '#/components/parameters/StatusFilter/schema'
            - type: 'null'
        priority:
          oneOf:
            - $ref: '#/components/parameters/PriorityFilter/schema'
            - type: 'null'
        assignee:
          oneOf:
            - $ref: '#/components/parameters/AssigneeFilter/schema'
            - type: 'null'
        label:
          oneOf:
            - $ref: '#/components/parameters/LabelFilter/schema'
            - type: 'null'
    SavedViewPresentationPatch:
      type: object
      description: A nested merge patch; null removes the corresponding presentation setting.
      properties:
        hiddenBoardStatusKeys:
          oneOf:
            - type: array
              items: { $ref: '#/components/schemas/StatusKey' }
            - type: 'null'
        hiddenSheetColumns:
          oneOf:
            - type: array
              items: { $ref: '#/components/schemas/SavedViewSheetColumn' }
            - type: 'null'
        hiddenCustomFieldIds:
          oneOf:
            - type: array
              maxItems: 30
              items: { $ref: '#/components/schemas/CustomFieldId' }
            - type: 'null'
        sheetSort:
          oneOf:
            - type: object
              properties:
                column: { $ref: '#/components/schemas/SavedViewSheetColumn' }
                direction: { type: string, enum: [asc, desc] }
            - type: 'null'
        customFieldSort:
          oneOf:
            - type: object
              properties:
                fieldId: { $ref: '#/components/schemas/CustomFieldId' }
                direction: { type: string, enum: [asc, desc] }
            - type: 'null'
    SavedViewConfigurationPatch:
      type: object
      description: |
        Nested JSON Merge Patch. Null groupBy clears grouping and is returned as null; null
        presentation removes presentation settings. Omitted members keep their current values.
        The merged result must satisfy SavedViewConfiguration or the request is invalid.
      properties:
        layout: { $ref: '#/components/schemas/SavedViewLayout' }
        filters: { $ref: '#/components/schemas/SavedViewFiltersPatch' }
        sort: { $ref: '#/components/schemas/SavedViewSort' }
        groupBy:
          oneOf:
            - $ref: '#/components/parameters/GroupBy/schema'
            - type: 'null'
        presentation:
          oneOf:
            - $ref: '#/components/schemas/SavedViewPresentationPatch'
            - type: 'null'
    SavedViewCreation:
      type: object
      required: [name, configuration]
      properties:
        name: { $ref: '#/components/schemas/SavedItemName' }
        icon: { $ref: '#/components/schemas/LookIcon' }
        configuration: { $ref: '#/components/schemas/SavedViewConfigurationInput' }
    SavedViewPatch:
      type: object
      description: JSON Merge Patch; nested settings are merged and undeclared members are ignored. A null icon clears it.
      properties:
        name: { $ref: '#/components/schemas/SavedItemName' }
        icon: { $ref: '#/components/schemas/LookIcon' }
        configuration: { $ref: '#/components/schemas/SavedViewConfigurationPatch' }
    SavedViewDuplicate:
      type: object
      additionalProperties: false
      description: Empty object for duplicating a saved view.
    SavedView:
      type: object
      required: [id, listId, name, icon, configuration, createdAt, updatedAt, version]
      description: A view shared with readers of a list.
      properties:
        id: { type: string, format: uuid }
        listId: { type: string, format: uuid }
        name: { type: string }
        icon: { $ref: '#/components/schemas/LookIconValue' }
        configuration: { $ref: '#/components/schemas/SavedViewConfiguration' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        version: { type: integer, minimum: 1 }
    SavedViewPage:
      type: object
      required: [items, nextCursor]
      description: Views in creation order, with a duplicate inserted after its source.
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/SavedView' }
        nextCursor: { $ref: './http.yaml#/components/schemas/NextCursor' }
    FavoriteKindInput:
      type: string
      enum: [space, list, saved-view]
      description: Kind of active target to favorite.
    FavoriteCreation:
      type: object
      required: [kind, targetId]
      properties:
        kind: { $ref: '#/components/schemas/FavoriteKindInput' }
        targetId: { type: string, format: uuid, description: UUID of the target resource. }
    Favorite:
      type: object
      required: [id, kind, targetId, target, createdAt, version]
      description: A private favorite of the current user and organization.
      properties:
        id: { type: string, format: uuid }
        kind:
          type: string
          x-extensible-enum: [space, list, saved-view]
          description: Target kind; unknown future kinds may be ignored by a client.
        targetId: { type: string, format: uuid }
        target:
          type: object
          required: [name, href]
          description: Current visible target name and public resource path; listId is present for a saved view.
          properties:
            name: { type: string }
            href: { type: string, format: uri-reference }
            listId: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        version: { type: integer, minimum: 1 }
    FavoritePage:
      type: object
      required: [items, nextCursor]
      description: The caller's currently accessible active targets in insertion order by creation time and ID.
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Favorite' }
        nextCursor: { $ref: './http.yaml#/components/schemas/NextCursor' }
    TaskDuplicate:
      type: object
      additionalProperties: false
      description: Empty object for duplicating a task.
    ListDuplicate:
      type: object
      additionalProperties: false
      description: Empty object for duplicating a list.
    ListDuplication:
      type: object
      required: [list, taskCount]
      description: The newly created list and number of copied tasks.
      properties:
        list:
          $ref: '#/components/schemas/TaskList'
        taskCount:
          type: integer
          minimum: 0
    BulkTaskSelection:
      type: object
      additionalProperties: false
      required: [taskKey]
      description: One explicitly selected task and its optional expected version.
      properties:
        taskKey:
          $ref: '#/components/schemas/TaskKey'
        version:
          type: integer
          minimum: 1
          description: Expected current task version, checked before any changes.
    BulkTaskAction:
      type: object
      additionalProperties: false
      required: [selection, action]
      description: |
        One atomic action over 1 to 50 distinct task keys. Duplicate keys are invalid even if
        their versions differ. The client sends its visible-row selection explicitly. The action
        and each selection entry must contain only the declared members for their kind.
      properties:
        selection:
          type: array
          minItems: 1
          maxItems: 50
          description: Distinct explicit task keys; duplicate keys answer `400 request.invalid`.
          items:
            $ref: '#/components/schemas/BulkTaskSelection'
        action:
          $ref: '#/components/schemas/BulkTaskActionValue'
    BulkTaskActionValue:
      description: The requested action; its `type` selects the permitted members.
      oneOf:
        - $ref: '#/components/schemas/BulkTaskStatusAction'
        - $ref: '#/components/schemas/BulkTaskPriorityAction'
        - $ref: '#/components/schemas/BulkTaskAssignAction'
        - $ref: '#/components/schemas/BulkTaskUnassignAction'
        - $ref: '#/components/schemas/BulkTaskMoveAction'
        - $ref: '#/components/schemas/BulkTaskTrashAction'
        - $ref: '#/components/schemas/BulkTaskDuplicateAction'
      discriminator:
        propertyName: type
        mapping:
          status: '#/components/schemas/BulkTaskStatusAction'
          priority: '#/components/schemas/BulkTaskPriorityAction'
          assign: '#/components/schemas/BulkTaskAssignAction'
          unassign: '#/components/schemas/BulkTaskUnassignAction'
          move: '#/components/schemas/BulkTaskMoveAction'
          trash: '#/components/schemas/BulkTaskTrashAction'
          duplicate: '#/components/schemas/BulkTaskDuplicateAction'
    BulkTaskStatusAction:
      type: object
      additionalProperties: false
      required: [type, status]
      properties:
        type: { type: string, const: status }
        status:
          $ref: '#/components/schemas/StatusKey'
        cancelReason:
          $ref: '#/components/schemas/CancelReasonInput'
        cancelNote:
          type: [string, 'null']
          maxLength: 500
          description: Cancellation note, allowed only when the final status is cancelled.
    BulkTaskPriorityAction:
      type: object
      additionalProperties: false
      required: [type, priority]
      properties:
        type: { type: string, const: priority }
        priority:
          $ref: '#/components/schemas/PriorityKey'
    BulkTaskAssignAction:
      type: object
      additionalProperties: false
      required: [type, userId]
      properties:
        type: { type: string, const: assign }
        userId: { type: string, format: uuid }
    BulkTaskUnassignAction:
      type: object
      additionalProperties: false
      required: [type, userId]
      properties:
        type: { type: string, const: unassign }
        userId: { type: string, format: uuid }
    BulkTaskMoveAction:
      type: object
      additionalProperties: false
      required: [type, listId]
      properties:
        type: { type: string, const: move }
        listId: { type: string, format: uuid }
    BulkTaskTrashAction:
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type: { type: string, const: trash }
    BulkTaskDuplicateAction:
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type: { type: string, const: duplicate }
    BulkTaskResult:
      type: object
      required: [results, affectedCount]
      description: Results for selected keys after one committed transaction; there is no partial success.
      properties:
        results:
          type: array
          description: One result per selected key, including selections covered by an ancestor.
          items:
            $ref: '#/components/schemas/BulkTaskResultEntry'
        affectedCount:
          type: integer
          minimum: 0
          description: Distinct task rows affected, including subtrees, successors and copies.
    BulkTaskResultEntry:
      type: object
      required: [taskKey]
      description: The selected task and, where applicable, the resulting versions or created IDs.
      properties:
        taskKey:
          $ref: '#/components/schemas/TaskKey'
        version:
          type: integer
          minimum: 1
          description: Resulting version of the selected task when applicable.
        newTaskKey:
          $ref: '#/components/schemas/TaskKey'
          description: Key of the copy created for this selection.
        newTaskVersion:
          type: integer
          minimum: 1
        successorKey:
          $ref: '#/components/schemas/TaskKey'
          description: Key of the recurrence successor when one was created.
        successorVersion:
          type: integer
          minimum: 1
        trashEntryId:
          type: string
          format: uuid
          description: Trash entry containing this selected task, including a covered descendant.
    Recurrence:
      type: string
      description: |
        `RECURRENCES` of @cadenway/contracts. Only entering `done` with a due date creates a
        successor. Daily advances to the next weekday, weekly and biweekly by 7 or 14 days;
        monthly clamps to the last day while retaining the chain's original day.
      enum: [none, daily, weekly, biweekly, monthly]
    DependencyDirection:
      type: string
      description: Whether the anchor task blocks the other task or is blocked by it.
      enum: [blocks, blocked-by]
    DependencyCreation:
      type: object
      required: [otherTaskKey, direction]
      properties:
        otherTaskKey:
          $ref: '#/components/schemas/TaskKey'
        direction:
          $ref: '#/components/schemas/DependencyDirection'
    Dependency:
      type: object
      required: [id, blocker, blocked]
      description: A directed edge between visible tasks in the current organization.
      properties:
        id:
          type: string
          format: uuid
        blocker:
          $ref: '#/components/schemas/TaskSummary'
        blocked:
          $ref: '#/components/schemas/TaskSummary'
    DependencyPage:
      type: object
      required: [items, nextCursor]
      description: Visible edges ordered by creation time and ID.
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Dependency'
        nextCursor:
          $ref: './http.yaml#/components/schemas/NextCursor'
    MilestonePage:
      type: object
      required: [items, nextCursor, total]
      description: Visible milestones in the space, ordered by due date ascending with undated last.
      properties:
        items:
          type: array
          description: Task summaries whose milestone flag is true.
          items:
            allOf:
              - $ref: '#/components/schemas/TaskSummary'
              - type: object
                required: [milestone]
                properties:
                  milestone:
                    type: boolean
                    const: true
        nextCursor:
          $ref: './http.yaml#/components/schemas/NextCursor'
        total:
          type: integer
          minimum: 0
          description: Matching visible milestones on every page.
    Mention:
      type: object
      required: [userId, start, end]
      description: |
        A recipient identified by account, not spelling. Offsets count Unicode code points in
        the unchanged Markdown, zero-based, start inclusive and end exclusive. Spans must be
        non-overlapping, in range, and cover a nonempty displayed token beginning with `@`.
        Raw text without a span never identifies a recipient. The recipient must be a current
        member, including a guest, with read access to the task's list after the write.
      properties:
        userId:
          type: string
          format: uuid
        start:
          type: integer
          minimum: 0
        end:
          type: integer
          minimum: 1
    Comment:
      type: object
      required: [id, taskKey, actor, body, createdAt, editedAt, version, mentions, replyToCommentId]
      description: A live comment in the flat task timeline; deleted comments are omitted.
      properties:
        id:
          type: string
          format: uuid
        taskKey:
          $ref: '#/components/schemas/TaskKey'
        actor:
          $ref: '#/components/schemas/Actor'
        body:
          type: string
          description: The submitted Markdown source, unchanged.
        createdAt:
          type: string
          format: date-time
        editedAt:
          type: [string, 'null']
          format: date-time
        version:
          type: integer
          minimum: 1
        mentions:
          type: array
          items:
            $ref: '#/components/schemas/Mention'
        replyToCommentId:
          type: [string, 'null']
          format: uuid
          description: Immutable reply target, retained even when that comment is deleted.
    CommentCreation:
      type: object
      required: [body]
      description: A comment and optional structured mentions and reply target.
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 5000
          pattern: '\S'
          description: |
            Markdown of 1 to 5,000 Unicode code points, not whitespace only; stored unchanged.
          examples: ['@Camille Martin, la maquette est prête.']
        mentions:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/Mention'
        replyToCommentId:
          type: string
          format: uuid
          description: A live comment on this same task.
    CommentPatch:
      type: object
      description: |
        JSON Merge Patch. Replacing the body clears existing mention spans unless a replacement
        array is supplied. A spans-only change still requires the comment's If-Match. Undeclared
        members are ignored.
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 5000
          pattern: '\S'
          description: Markdown of 1 to 5,000 Unicode code points, not whitespace only; stored unchanged.
        mentions:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/Mention'
    CommentPage:
      type: object
      required: [items, nextCursor, total]
      description: Live comments ordered by creation time and ID, oldest first; total excludes tombstones.
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Comment'
        nextCursor:
          $ref: './http.yaml#/components/schemas/NextCursor'
        total:
          type: integer
          minimum: 0
    TaskParticipant:
      type: object
      required: [userId, memberId]
      description: A current member eligible for a mention on this task, including guests.
      properties:
        userId:
          type: string
          format: uuid
        memberId:
          type: string
          format: uuid
    TaskParticipantPage:
      type: object
      required: [items, nextCursor]
      description: Eligible accounts ordered by user ID.
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TaskParticipant'
        nextCursor:
          $ref: './http.yaml#/components/schemas/NextCursor'
    Watcher:
      type: object
      required: [userId]
      description: An effective watcher who currently has task access.
      properties:
        userId:
          type: string
          format: uuid
    WatcherPage:
      type: object
      required: [items, nextCursor, total, callerFollows]
      description: Effective watchers ordered by user ID, with the same total and caller state on every page.
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Watcher'
        nextCursor:
          $ref: './http.yaml#/components/schemas/NextCursor'
        total:
          type: integer
          minimum: 0
        callerFollows:
          type: boolean
    StatusKey:
      type: string
      description: |
        Key of a task status, in the order of the workflow: `triage` ("À trier"), `backlog` ("À
        planifier"), `todo` ("À faire"), `progress` ("En cours"), `review` ("En revue"), `testing`
        ("En validation"), `waiting` ("En attente"), `blocked` ("Bloqué"), `done` ("Terminé") and
        `cancelled` ("Annulé"). `STATUS_KEYS` of `@cadenway/contracts`; a space renames or hides a
        status, it never adds or removes a key.
      enum: [triage, backlog, todo, progress, review, testing, waiting, blocked, done, cancelled]
    StatusCategory:
      type: string
      description: |
        Category of a status: `open` ("Non commencé": `triage`, `backlog`, `todo`), `active`
        ("Actif": `progress`, `review`, `testing`, `waiting`, `blocked`) or `closed` ("Fermé":
        `done`, `cancelled`). `STATUS_CATEGORIES` and `STATUS_CATEGORY_BY_KEY` of
        `@cadenway/contracts`; the category of a key never changes.
      enum: [open, active, closed]
    PriorityKey:
      type: string
      description: |
        Priority of a task, from the most to the least urgent: `urgente` ("Urgente"), `haute`
        ("Haute"), `moyenne` ("Moyenne", the default) and `basse` ("Basse"). `PRIORITY_KEYS` of
        `@cadenway/contracts`. A closed set: another priority would be a breaking change.
      enum: [urgente, haute, moyenne, basse]
    CancelReason:
      type: string
      description: |
        Why a task was cancelled ("Motif d’annulation"): `duplicate` ("Doublon"), `wontdo` ("Ne sera
        pas fait"), `scope` ("Hors périmètre") or `obsolete` ("Obsolète"). `CANCEL_REASONS` of
        `@cadenway/contracts`. A closed set: another reason would be a breaking change.
      enum: [duplicate, wontdo, scope, obsolete]
    TaskKey:
      type: string
      pattern: '^[A-Z]{2,5}-[1-9][0-9]{0,8}$'
      description: |
        Key of a task, the only way a task is named outside task-service: the prefix of the space
        it was created in, a dash and a number. A key never changes, also when the task moves to
        another space or its space changes prefix, and is never given to another task.
      examples: [CAD-482]
    SpacePrefix:
      type: string
      pattern: '^[A-Z]{2,5}$'
      description: |
        Prefix of the keys of a space ("Préfixe", "De 2 à 5 lettres, sans accent."): 2 to 5
        uppercase letters A to Z.
      examples: [CAD]
    LookColor:
      type: string
      description: |
        Color of a space or a list ("Couleur"): `gris` ("Gris", the default), `violet` ("Améthyste"),
        `indigo` ("Indigo"), `azur` ("Azur"), `lagon` ("Lagon"), `vert` ("Jade"), `olive` ("Olive"),
        `jaune` ("Balise"), `orange` ("Cornaline"), `rouge` ("Grenat"), `rose` ("Rose"), `fuchsia`
        ("Fuchsia") or `ardoise` ("Ardoise"). The keys of `LOOK_COLORS` of the mockup.
      enum:
        [
          gris,
          violet,
          indigo,
          azur,
          lagon,
          vert,
          olive,
          jaune,
          orange,
          rouge,
          rose,
          fuchsia,
          ardoise,
        ]
    LookIcon:
      type: [string, 'null']
      description: |
        Icon of a space or a list ("Icône"): `rocket` ("Fusée"), `paint` ("Pinceau"), `megaphone`
        ("Mégaphone"), `gear` ("Engrenage"), `code` ("Code"), `bug` ("Bogue"), `lightning`
        ("Éclair"), `target` ("Cible"), `flag` ("Drapeau"), `briefcase` ("Mallette"), `chart`
        ("Courbe"), `users` ("Équipe"), `book` ("Livre"), `cube` ("Cube"), `headset` ("Casque"),
        `globe` ("Globe") or `star` ("Étoile"), the keys of `LOOK_ICONS` of the mockup; `null` for
        none ("Initiale" for a space, "Par défaut" for a list).
      enum:
        [
          rocket,
          paint,
          megaphone,
          gear,
          code,
          bug,
          lightning,
          target,
          flag,
          briefcase,
          chart,
          users,
          book,
          cube,
          headset,
          globe,
          star,
          null,
        ]
    Visibility:
      type: string
      description: |
        Who sees a space ("Confidentialité"): `organization` ("Tout Atelier Nord": every member of
        the organization but the guests) or `private` ("Privé": its owner and the people it is
        shared with).
      enum: [organization, private]
    AccessRole:
      type: string
      description: |
        A role given by a grant ("Droit d’accès"): `edit` ("Peut modifier"), `comment` ("Peut
        commenter", which reads like `view` until comments exist) or `view` ("Lecture seule"),
        from the most to the least. The owner of a space ("Propriétaire") holds no grant: they
        always have `edit` on it and on its lists.
      enum: [edit, comment, view]
    AccessRoleValue:
      type: string
      description: |
        A role of `AccessRole`, as a resource carries it. Later versions may add roles
        (`x-extensible-enum`): a client treats an unknown one as `view`.
      x-extensible-enum: [edit, comment, view]
    LookColorValue:
      type: string
      description: |
        A color of `LookColor`, as a resource carries it. Later versions add colors
        (`x-extensible-enum`): a client shows an unknown one as `gris`.
      x-extensible-enum:
        [
          gris,
          violet,
          indigo,
          azur,
          lagon,
          vert,
          olive,
          jaune,
          orange,
          rouge,
          rose,
          fuchsia,
          ardoise,
        ]
    LookIconValue:
      type: [string, 'null']
      description: |
        An icon of `LookIcon`, as a resource carries it; `null` for none: the initial of its name
        for a space ("Initiale"), and for a list its bullets, or the lightning for a sprint ("Par
        défaut"). Later versions add icons (`x-extensible-enum`): a client shows an unknown one as
        `null`.
      x-extensible-enum:
        [
          rocket,
          paint,
          megaphone,
          gear,
          code,
          bug,
          lightning,
          target,
          flag,
          briefcase,
          chart,
          users,
          book,
          cube,
          headset,
          globe,
          star,
        ]
    VisibilityValue:
      type: string
      description: |
        `organization` ("Tout Atelier Nord") or `private` ("Privé", the lock "Espace privé"), as a
        space carries it. Later versions may add values (`x-extensible-enum`): a client treats an
        unknown one as `private`.
      x-extensible-enum: [organization, private]
    Actor:
      type: object
      required: [type, id]
      description: |
        Who made a change: a person (`user`, `id` is the account), an automation rule
        (`automation`), the Git integration (`git`) or a service (`system`, `id` is its name, for
        example `task-service` when a removed member leaves the assignees). A client can show an
        unknown type as is. Git activity can identify the verified provider.
      properties:
        type:
          type: string
          x-extensible-enum: [user, automation, git, system]
        id:
          type: string
          minLength: 1
          examples: [019a5f3c-8d2e-7c4a-9b1f-3e5d7a9c1b30]
        provider:
          type: string
          x-extensible-enum: [github, gitlab]
          description: Verified provider for Git activity. Other actors and earlier Git activity omit it.
    UserRef:
      type: object
      required: [userId]
      description: |
        A person, by account. Only the account id in this version: the web application takes the
        name and the initials from the member list. It may name a former member, for example the
        owner of a space of the whole organization who left it. Later versions may add members.
      properties:
        userId:
          type: string
          format: uuid
          examples: [019a5f3c-8d2e-7c4a-9b1f-3e5d7a9c1b30]
    SpaceStatus:
      type: object
      required: [category, name, hidden]
      description: How a space shows one status ("Statuts de « Produit »").
      properties:
        category:
          $ref: '#/components/schemas/StatusCategory'
        name:
          type: [string, 'null']
          description: |
            The name the space gives the status, 24 characters at most; `null` for its default
            label, for example "À faire" for `todo`.
          examples: [Relecture]
        hidden:
          type: boolean
          description: |
            Whether the space no longer uses the status ("Ne plus utiliser …"): it leaves the
            status menus and the list groups, but a task that has it keeps it. Always `false` for
            `todo` and `done`.
    SpaceStatuses:
      type: object
      description: The ten statuses as the space shows them, by key.
      required:
        [triage, backlog, todo, progress, review, testing, waiting, blocked, done, cancelled]
      properties:
        triage:
          $ref: '#/components/schemas/SpaceStatus'
        backlog:
          $ref: '#/components/schemas/SpaceStatus'
        todo:
          $ref: '#/components/schemas/SpaceStatus'
        progress:
          $ref: '#/components/schemas/SpaceStatus'
        review:
          $ref: '#/components/schemas/SpaceStatus'
        testing:
          $ref: '#/components/schemas/SpaceStatus'
        waiting:
          $ref: '#/components/schemas/SpaceStatus'
        blocked:
          $ref: '#/components/schemas/SpaceStatus'
        done:
          $ref: '#/components/schemas/SpaceStatus'
        cancelled:
          $ref: '#/components/schemas/SpaceStatus'
    Space:
      type: object
      required:
        [
          id,
          name,
          prefix,
          description,
          icon,
          color,
          visibility,
          owner,
          statuses,
          nextKey,
          createdAt,
          version,
        ]
      description: |
        A space ("Espace"): the lists and sprints of a team or a domain, the prefix of their task
        keys, its appearance, who sees it and how it names its statuses. `nextKey` is the key the
        next task created in the space would take now ("Les tâches seront numérotées CAD-1,
        CAD-2…"), a preview that reserves nothing: another creation may take it first.
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          description: '"Nom de l’espace", 80 characters at most.'
          examples: [Produit]
        prefix:
          $ref: '#/components/schemas/SpacePrefix'
        description:
          type: [string, 'null']
          description: '"Description", 500 characters at most; `null` when there is none.'
        icon:
          $ref: '#/components/schemas/LookIconValue'
        color:
          $ref: '#/components/schemas/LookColorValue'
        visibility:
          $ref: '#/components/schemas/VisibilityValue'
        owner:
          $ref: '#/components/schemas/UserRef'
        statuses:
          $ref: '#/components/schemas/SpaceStatuses'
        nextKey:
          $ref: '#/components/schemas/TaskKey'
        createdAt:
          type: string
          format: date-time
        version:
          type: integer
          minimum: 1
          description: |
            Version of the space, also sent as `ETag`; a change of its grants adds one too.
        callerRole:
          description: |
            The role of the caller on the space itself (see "Access" in
            `openapi/public/spaces.yaml`): the highest of the rule of the organization, the owner
            of the space and a grant of the space. `null` when the caller sees the space only
            through the grants of some of its lists, as a guest does: they see those lists only,
            and create no list in the space. Absent, it reads as `edit`, the rule before grants
            existed.
          oneOf:
            - $ref: '#/components/schemas/AccessRoleValue'
            - type: 'null'
        callerCanManage:
          type: boolean
          description: |
            Whether the caller manages the space: changes its visibility, shares it and deletes it;
            its settings and statuses need `edit` only. `true` for the owner of the space, and for
            the owner and the admins of the organization when the space is `organization`. Absent,
            the web application offers the actions and handles their `403`.
    SpaceName:
      type: string
      minLength: 1
      maxLength: 80
      description: |
        "Nom de l’espace", as typed; surrounding spaces are removed, and a name made only of spaces
        is refused with `400 request.invalid`.
      examples: [Produit]
    SpaceDescription:
      type: [string, 'null']
      maxLength: 500
      description: '"Description" ("Facultatif"), trimmed; `null` or an empty text for none.'
      examples: ['Développement de Cadenway : sprints, bugs et feuille de route.']
    SpaceCreation:
      type: object
      required: [name, prefix]
      description: |
        A new space. The members with a default declare their values themselves, the values of
        `LookIcon`, `LookColor` and `Visibility`.
      properties:
        name:
          $ref: '#/components/schemas/SpaceName'
        prefix:
          $ref: '#/components/schemas/SpacePrefix'
        description:
          $ref: '#/components/schemas/SpaceDescription'
        icon:
          type: [string, 'null']
          description: One of the icons of `LookIcon`; `null`, the default, for the initial.
          enum:
            [
              rocket,
              paint,
              megaphone,
              gear,
              code,
              bug,
              lightning,
              target,
              flag,
              briefcase,
              chart,
              users,
              book,
              cube,
              headset,
              globe,
              star,
              null,
            ]
          default: null
        color:
          type: string
          description: One of the colors of `LookColor`; `gris` by default.
          enum:
            [
              gris,
              violet,
              indigo,
              azur,
              lagon,
              vert,
              olive,
              jaune,
              orange,
              rouge,
              rose,
              fuchsia,
              ardoise,
            ]
          default: gris
        visibility:
          type: string
          description: '`organization` ("Tout Atelier Nord", the default) or `private` ("Privé").'
          enum: [organization, private]
          default: organization
    SpaceStatusPatch:
      type: [object, 'null']
      description: |
        Change of one status: a member left out is unchanged; `null` for the whole status puts back
        its default label and uses it again.
      properties:
        name:
          type: [string, 'null']
          minLength: 1
          maxLength: 24
          description: |
            New name, trimmed; a name made only of spaces is refused with `400 request.invalid`;
            `null` puts back the default label.
        hidden:
          type: boolean
          description: '`true` to stop using the status; `todo` and `done` cannot be hidden.'
    SpaceStatusesPatch:
      type: [object, 'null']
      description: |
        Change of the statuses by key ("Statuts de « Produit »"); `null` puts back every default
        ("Rétablir par défaut").
      properties:
        triage:
          $ref: '#/components/schemas/SpaceStatusPatch'
        backlog:
          $ref: '#/components/schemas/SpaceStatusPatch'
        todo:
          $ref: '#/components/schemas/SpaceStatusPatch'
        progress:
          $ref: '#/components/schemas/SpaceStatusPatch'
        review:
          $ref: '#/components/schemas/SpaceStatusPatch'
        testing:
          $ref: '#/components/schemas/SpaceStatusPatch'
        waiting:
          $ref: '#/components/schemas/SpaceStatusPatch'
        blocked:
          $ref: '#/components/schemas/SpaceStatusPatch'
        done:
          $ref: '#/components/schemas/SpaceStatusPatch'
        cancelled:
          $ref: '#/components/schemas/SpaceStatusPatch'
    SpacePatch:
      type: object
      description: JSON Merge Patch of a space; an empty object changes nothing.
      properties:
        name:
          $ref: '#/components/schemas/SpaceName'
        prefix:
          $ref: '#/components/schemas/SpacePrefix'
        description:
          $ref: '#/components/schemas/SpaceDescription'
        icon:
          $ref: '#/components/schemas/LookIcon'
        color:
          $ref: '#/components/schemas/LookColor'
        visibility:
          $ref: '#/components/schemas/Visibility'
        statuses:
          $ref: '#/components/schemas/SpaceStatusesPatch'
    Sprint:
      type: object
      required: [startDate, endDate, goal]
      description: |
        What makes a list a sprint ("Une période datée, avec un objectif et un suivi
        d’avancement."). Its state follows from its dates: there is no start or completion.
      properties:
        startDate:
          type: string
          format: date
          description: '"Début", the first day of the sprint.'
          examples: ['2026-11-03']
        endDate:
          type: string
          format: date
          description: '"Fin", the last day of the sprint, on or after `startDate`.'
          examples: ['2026-11-17']
        goal:
          type: [string, 'null']
          description: '"Objectif du sprint", 300 characters at most; `null` when there is none.'
          examples: ['Livrer la connexion SSO et la page des quotas d’organisation.']
    TaskList:
      type: object
      required: [id, spaceId, name, icon, color, sprint, createdAt, version]
      description: |
        A list of tasks of a space; with `sprint`, a sprint ("Sprint 14"). Lists keep the order of
        their creation.
      properties:
        id:
          type: string
          format: uuid
        spaceId:
          type: string
          format: uuid
        name:
          type: string
          description: '"Nom", 80 characters at most.'
          examples: [Sprint 14]
        icon:
          $ref: '#/components/schemas/LookIconValue'
        color:
          $ref: '#/components/schemas/LookColorValue'
        sprint:
          description: The dates and the goal of a sprint; `null` for a list that is not a sprint.
          oneOf:
            - $ref: '#/components/schemas/Sprint'
            - type: 'null'
        createdAt:
          type: string
          format: date-time
        version:
          type: integer
          minimum: 1
          description: |
            Version of the list, also sent as `ETag`; a change of its grants, an archive and a
            restoration add one too.
        organizationAccess:
          type: boolean
          description: |
            The switch "Accès de l’organisation" ("Tous les membres de Atelier Nord peuvent voir
            cette liste"), on by default. In a space of the whole organization, on, every owner,
            admin and member of the organization has `edit` on the list; off, only the owner of
            the space and the people the space or the list is shared with see it. In a private
            space it changes nothing. Absent, it reads as `true`.
        archivedAt:
          type: [string, 'null']
          format: date-time
          description: |
            When the list was archived ("archivée le 3 nov."); `null` for a list that is not.
            An archived list is left out of the lists of its space, of the overview and of
            "Accueil", and reads by its id. Absent, it reads as `null`.
        archivedBy:
          description: Who archived the list; `null` for a list that is not archived. Absent, it reads as `null`.
          oneOf:
            - $ref: '#/components/schemas/Actor'
            - type: 'null'
        callerRole:
          $ref: '#/components/schemas/AccessRoleValue'
          description: |
            The role of the caller on the list (see "Access" in `openapi/public/spaces.yaml`):
            reads need any role, changes to the list and its tasks need `edit`. Absent, it reads
            as `edit`, the rule before grants existed.
    TaskCounts:
      type: object
      required: [total, open, done, cancelled, late]
      description: |
        Counts of the top-level tasks of a list, subtasks left out, as the sidebar, the list cards
        and the sprint progress count them. The progress of a list ("12 / 32 terminées", "38 %")
        is `done` out of `total` minus `cancelled`.
      properties:
        total:
          type: integer
          minimum: 0
          description: Every top-level task of the list ("32 tâches").
        open:
          type: integer
          minimum: 0
          description: The tasks that are not closed, of the categories `open` and `active` ("14 ouvertes").
        done:
          type: integer
          minimum: 0
          description: The tasks of the key `done` ("12 / 32 terminées").
        cancelled:
          type: integer
          minimum: 0
          description: The tasks of the key `cancelled`, left out of the progress.
        late:
          type: integer
          minimum: 0
          description: |
            The tasks that are not closed and whose due date is before the `today` of the request
            ("3 en retard").
    ListSummary:
      type: object
      required: [list, counts]
      description: A list with the counts of its tasks.
      properties:
        list:
          $ref: '#/components/schemas/TaskList'
        counts:
          $ref: '#/components/schemas/TaskCounts'
    ListName:
      type: string
      minLength: 1
      maxLength: 80
      description: |
        "Nom", as typed; surrounding spaces are removed, and a name made only of spaces is refused
        with `400 request.invalid`.
      examples: [Sprint 15]
    SprintInput:
      type: object
      required: [startDate, endDate]
      description: |
        The dates and the goal of a sprint, the two dates always together; a `goal` left out is
        unchanged by a patch and `null` at a creation.
      properties:
        startDate:
          type: string
          format: date
          description: '"Début".'
        endDate:
          type: string
          format: date
          description: '"Fin", on or after `startDate` ("La fin doit suivre le début.").'
        goal:
          type: [string, 'null']
          maxLength: 300
          description: '"Objectif du sprint", trimmed; `null` or an empty text for none.'
    ListCreation:
      type: object
      required: [name]
      description: |
        A new list or sprint. The members with a default declare their values themselves, the
        values of `LookIcon` and `LookColor`.
      properties:
        name:
          $ref: '#/components/schemas/ListName'
        icon:
          type: [string, 'null']
          description: One of the icons of `LookIcon`; `null`, the default, for the default icon.
          enum:
            [
              rocket,
              paint,
              megaphone,
              gear,
              code,
              bug,
              lightning,
              target,
              flag,
              briefcase,
              chart,
              users,
              book,
              cube,
              headset,
              globe,
              star,
              null,
            ]
          default: null
        color:
          type: string
          description: One of the colors of `LookColor`; `gris` by default.
          enum:
            [
              gris,
              violet,
              indigo,
              azur,
              lagon,
              vert,
              olive,
              jaune,
              orange,
              rouge,
              rose,
              fuchsia,
              ardoise,
            ]
          default: gris
        sprint:
          description: |
            The dates and the goal to create a sprint ("Sprint"), both dates required; absent or
            `null` for a list.
          oneOf:
            - $ref: '#/components/schemas/SprintInput'
            - type: 'null'
        organizationAccess:
          type: boolean
          description: |
            The switch "Accès de l’organisation" of the new list; absent, it is on (`true`), as
            for every list created before the switch existed.
    ListPatch:
      type: object
      description: |
        JSON Merge Patch of a list; an empty object changes nothing. `sprint: null` makes a sprint
        a list again, and drops its dates and goal.
      properties:
        name:
          $ref: '#/components/schemas/ListName'
        icon:
          $ref: '#/components/schemas/LookIcon'
        color:
          $ref: '#/components/schemas/LookColor'
        sprint:
          oneOf:
            - $ref: '#/components/schemas/SprintInput'
            - type: 'null'
        organizationAccess:
          type: boolean
          description: |
            Turns the switch "Accès de l’organisation" on or off ("Tous les membres de Atelier
            Nord peuvent voir cette liste").
    TaskName:
      type: string
      minLength: 1
      maxLength: 300
      description: |
        "Nom de la tâche", as typed; surrounding spaces are removed, and a name made only of spaces
        is refused with `400 request.invalid`.
      examples: [Refondre l’écran de connexion SSO]
    TaskDescription:
      type: [string, 'null']
      maxLength: 50000
      description: '"Description", Markdown; `null` when there is none.'
      examples:
        [
          "Remplacer l’écran actuel par la connexion d’entreprise.\n\n- Bouton « Continuer avec l’authentification unique »\n- Message d’erreur si le domaine n’est pas vérifié",
        ]
    LabelName:
      type: string
      minLength: 1
      maxLength: 32
      description: |
        A label ("Étiquette"), trimmed; two labels that differ only by case are the same label.
      examples: [Auth]
    EstimateMinutes:
      type: [integer, 'null']
      minimum: 1
      maximum: 60000
      description: '"Estimation", in whole minutes ("8 h" is `480`); `null` for none.'
      examples: [480]
    CancelReasonInput:
      description: Required with the status `cancelled`, refused with any other; `null` for none.
      oneOf:
        - $ref: '#/components/schemas/CancelReason'
        - type: 'null'
    SubtaskCounts:
      type: object
      required: [total, closed]
      description: Direct subtasks of a task ("2 / 3 terminées"); `done` and `cancelled` count as closed.
      properties:
        total:
          type: integer
          minimum: 0
        closed:
          type: integer
          minimum: 0
    ChecklistCounts:
      type: object
      required: [total, done]
      description: Items of the checklist of a task, and those ticked ("3 / 3").
      properties:
        total:
          type: integer
          minimum: 0
        done:
          type: integer
          minimum: 0
    ChecklistItem:
      type: object
      required: [id, text, done]
      description: One item of a checklist ("Une checklist sert aux petites étapes sans statut ni assigné.").
      properties:
        id:
          type: string
          format: uuid
        text:
          type: string
          description: '"Élément de checklist", 300 characters at most.'
          examples: [Maquette validée]
        done:
          type: boolean
          description: Ticked ("Terminer") or not ("Rouvrir").
    TaskRef:
      type: object
      required: [key, name, status]
      description: A task named by another resource, with its name and status as they are now.
      properties:
        key:
          $ref: '#/components/schemas/TaskKey'
        name:
          type: string
        status:
          $ref: '#/components/schemas/StatusKey'
    CustomFieldId:
      type: string
      format: uuid
      pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
      description: A stable UUID v7 identifying one custom field definition, in lowercase.
      examples: [019a700a-1234-7567-89ab-cdef01234567]
    CustomFieldDefinition:
      type: object
      required: [id, spaceId, name, type, position, sprintPoints, version]
      description: An active definition of a custom column in a space.
      properties:
        id:
          $ref: '#/components/schemas/CustomFieldId'
        spaceId:
          type: string
          format: uuid
          examples: [019a7000-1a2b-7c3d-8e4f-5a6b7c8d9e01]
        name:
          type: string
          examples: [Points, Client]
        type:
          type: string
          x-extensible-enum: [number, text]
          description: Immutable kind. This delivery supports numeric and text values.
        position:
          type: integer
          minimum: 0
          description: Zero-based position among the active definitions of the space.
        sprintPoints:
          type: boolean
          description: True only for the active numeric definition used for sprint points.
        version:
          type: integer
          minimum: 1
          description: Definition version used by its ETag.
    CustomFieldDefinitionPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CustomFieldDefinition'
        nextCursor:
          $ref: 'http.yaml#/components/schemas/NextCursor'
    CustomFieldDefinitionCreation:
      type: object
      required: [name, type]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
          pattern: '\S'
          description: Display name, trimmed. Renaming never changes the ID.
          examples: [Points, Client]
        type:
          type: string
          enum: [number, text]
    CustomFieldDefinitionPatch:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
          pattern: '\S'
          description: Display name, trimmed. Renaming never changes the ID.
          examples: [Points, Client]
        position:
          type: integer
          minimum: 0
          maximum: 29
          description: Move to this zero-based position in the active definition order.
        sprintPoints:
          type: boolean
          description: |
            True designates this numeric field, clearing any previous designation. False clears
            the designation if this field currently holds it.
    TaskCustomFieldValues:
      type: object
      description: |
        Sparse values keyed by lowercase stable custom field ID. Only active definitions of the readable
        task's current space are included. Missing entries have no value. Absence of the member
        means the producer has not reported these values. Numeric zero and empty text are values.
      propertyNames:
        $ref: '#/components/schemas/CustomFieldId'
      additionalProperties:
        type: [number, string]
      examples:
        - 019a700a-1234-7567-89ab-cdef01234567: 0
          019a700a-1234-7567-89ab-cdef01234568: Atelier Nord
    TaskCustomFieldValuesPatch:
      type: object
      description: |
        Merge values by lowercase active field ID in the task's resulting space. Omitted keys are unchanged.
        A null value clears that entry. A number or string must match the field's immutable type.
        A value of the designated sprint points field must be nonnegative, including zero.
      maxProperties: 30
      propertyNames:
        $ref: '#/components/schemas/CustomFieldId'
      additionalProperties:
        oneOf:
          - type: number
          - type: string
            maxLength: 500
          - type: 'null'
      examples:
        - 019a700a-1234-7567-89ab-cdef01234567: 0
          019a700a-1234-7567-89ab-cdef01234568: null
    TaskSummary:
      type: object
      required:
        [
          key,
          name,
          status,
          cancelReason,
          priority,
          assignees,
          dueDate,
          startDate,
          estimateMinutes,
          labels,
          parentKey,
          listId,
          spaceId,
          subtaskCounts,
          checklistCounts,
          completedAt,
          createdAt,
          version,
        ]
      description: |
        A task as a row of a list, of "Mes tâches" or of "Accueil" shows it: everything but the
        description, the note of the cancellation and the items of the checklist.
      properties:
        milestone:
          type: boolean
          description: Whether this task is a milestone; absence means the producer did not report it.
        recurrence:
          $ref: '#/components/schemas/Recurrence'
        customFieldValues:
          $ref: '#/components/schemas/TaskCustomFieldValues'
        key:
          $ref: '#/components/schemas/TaskKey'
        name:
          type: string
          description: '"Nom de la tâche", 300 characters at most.'
          examples: [Refondre l’écran de connexion SSO]
        status:
          $ref: '#/components/schemas/StatusKey'
        cancelReason:
          description: 'Why the task was cancelled ("Annulée : Doublon"); `null` unless its status is `cancelled`.'
          oneOf:
            - $ref: '#/components/schemas/CancelReason'
            - type: 'null'
        priority:
          $ref: '#/components/schemas/PriorityKey'
        assignees:
          type: array
          description: '"Assignés", 20 at most, in the order they were assigned; empty for "Non assignée".'
          items:
            $ref: '#/components/schemas/UserRef'
        dueDate:
          type: [string, 'null']
          format: date
          description: '"Échéance", a calendar date; `null` when there is none.'
        startDate:
          type: [string, 'null']
          format: date
          description: |
            First day of the work, for the Gantt view; `null` when there is none, always `null`
            without a due date, and never after the due date.
        estimateMinutes:
          type: [integer, 'null']
          minimum: 1
          description: '"Estimation", in whole minutes, 60,000 at most; `null` when there is none.'
        labels:
          type: array
          description: '"Étiquettes", 20 at most, in the order they were added.'
          items:
            type: string
        parentKey:
          description: The parent of a subtask ("Sous-tâche de CAD-482"); `null` for a top-level task.
          oneOf:
            - $ref: '#/components/schemas/TaskKey'
            - type: 'null'
        listId:
          type: string
          format: uuid
          description: The list of the task; a subtask is always in the list of its parent.
        spaceId:
          type: string
          format: uuid
          description: The space of that list, which may not be the space of the prefix of the key.
        subtaskCounts:
          $ref: '#/components/schemas/SubtaskCounts'
        checklistCounts:
          $ref: '#/components/schemas/ChecklistCounts'
        completedAt:
          type: [string, 'null']
          format: date-time
          description: When the task last entered `done`; `null` while its status is not `done`.
        createdAt:
          type: string
          format: date-time
        version:
          type: integer
          minimum: 1
          description: Version of the task, also sent as `ETag` by the routes of one task.
    Task:
      type: object
      required:
        [
          key,
          name,
          description,
          status,
          cancelReason,
          cancelNote,
          priority,
          assignees,
          dueDate,
          startDate,
          estimateMinutes,
          labels,
          parentKey,
          listId,
          spaceId,
          subtaskCounts,
          checklist,
          checklistCounts,
          completedAt,
          createdAt,
          createdBy,
          updatedAt,
          version,
        ]
      description: A task, with its description and its checklist.
      properties:
        milestone:
          type: boolean
          description: Whether this task is a milestone; absence means the producer did not report it.
        recurrence:
          $ref: '#/components/schemas/Recurrence'
        descriptionMentions:
          type: array
          description: Structured spans in the current Markdown description.
          items:
            $ref: '#/components/schemas/Mention'
        nextOccurrenceKey:
          $ref: '#/components/schemas/TaskKey'
          description: Successor key only when the successor is live and readable by the caller.
        customFieldValues:
          $ref: '#/components/schemas/TaskCustomFieldValues'
        key:
          $ref: '#/components/schemas/TaskKey'
        name:
          type: string
          description: '"Nom de la tâche", 300 characters at most.'
          examples: [Refondre l’écran de connexion SSO]
        description:
          type: [string, 'null']
          description: '"Description", Markdown, 50,000 characters at most; `null` when there is none.'
        status:
          $ref: '#/components/schemas/StatusKey'
        cancelReason:
          description: Why the task was cancelled; `null` unless its status is `cancelled`.
          oneOf:
            - $ref: '#/components/schemas/CancelReason'
            - type: 'null'
        cancelNote:
          type: [string, 'null']
          description: |
            "Précision" of the cancellation, 500 characters at most; `null` when there is none or
            the task is not cancelled.
        priority:
          $ref: '#/components/schemas/PriorityKey'
        assignees:
          type: array
          description: '"Assignés", 20 at most, in the order they were assigned.'
          items:
            $ref: '#/components/schemas/UserRef'
        dueDate:
          type: [string, 'null']
          format: date
          description: '"Échéance"; `null` when there is none.'
        startDate:
          type: [string, 'null']
          format: date
          description: First day of the work; `null` when there is none, always `null` without a due date.
        estimateMinutes:
          type: [integer, 'null']
          minimum: 1
          description: '"Estimation", in whole minutes, 60,000 at most; `null` when there is none.'
        labels:
          type: array
          description: '"Étiquettes", 20 at most, in the order they were added.'
          items:
            type: string
        parentKey:
          description: The parent of a subtask; `null` for a top-level task.
          oneOf:
            - $ref: '#/components/schemas/TaskKey'
            - type: 'null'
        listId:
          type: string
          format: uuid
        spaceId:
          type: string
          format: uuid
        subtaskCounts:
          $ref: '#/components/schemas/SubtaskCounts'
        checklist:
          type: array
          description: '"Checklist", 100 items at most, in the order they were added.'
          items:
            $ref: '#/components/schemas/ChecklistItem'
        checklistCounts:
          $ref: '#/components/schemas/ChecklistCounts'
        completedAt:
          type: [string, 'null']
          format: date-time
          description: When the task last entered `done`; `null` while its status is not `done`.
        createdAt:
          type: string
          format: date-time
        createdBy:
          $ref: '#/components/schemas/Actor'
        updatedAt:
          type: string
          format: date-time
          description: When the task last changed, its assignees, labels and checklist included.
        version:
          type: integer
          minimum: 1
          description: |
            Version of the task, also sent as `ETag`; every change adds one, a change of its
            assignees, labels or checklist, an archive and a restoration included.
        archivedAt:
          type: [string, 'null']
          format: date-time
          description: |
            When the task was archived, with the subtree it heads or belongs to ("archivée le 5
            nov."); `null` for a task that is not. An archived task is left out of every
            collection and count, reads by its key and refuses changes (`409 task.archived`) until
            it is restored. Absent, it reads as `null`.
        archivedBy:
          description: Who archived the task; `null` for a task that is not archived. Absent, it reads as `null`.
          oneOf:
            - $ref: '#/components/schemas/Actor'
            - type: 'null'
    SubtaskName:
      type: object
      required: [name]
      description: A subtask to create with its parent ("Ajouter une sous-tâche (Entrée pour valider)").
      properties:
        name:
          $ref: '#/components/schemas/TaskName'
    TaskCreation:
      type: object
      required: [name]
      description: |
        A new task. `status` and `priority` declare their values themselves, those of `StatusKey`
        and `PriorityKey`, with their default.
      properties:
        descriptionMentions:
          type: array
          maxItems: 20
          description: |
            Structured spans in the description; replacing text clears prior spans unless a
            replacement array is supplied. Invalid
            spans answer `400 request.invalid`, ineligible recipients `422 mention.recipient-invalid`.
          items:
            $ref: '#/components/schemas/Mention'
        milestone:
          type: boolean
          description: |
            A milestone permits only todo, blocked, done and cancelled. Dated milestones have
            equal start and due dates, undated milestones have both null; estimate is null.
            Conversion normalizes inherited fields and maps an inherited disallowed status to todo.
            Conflicting explicit dates or status answer `422 milestone.dates-invalid` or
            `422 milestone.status-invalid`. Removing the flag keeps normalized fields.
        recurrence:
          $ref: '#/components/schemas/Recurrence'
        checklist:
          type: array
          maxItems: 100
          description: Checklist text in order; fresh IDs and unchecked items are created atomically.
          items:
            $ref: '#/components/schemas/ChecklistItemCreation'
        name:
          $ref: '#/components/schemas/TaskName'
        description:
          $ref: '#/components/schemas/TaskDescription'
        status:
          type: string
          description: '"Statut", one of `StatusKey`; `todo` ("À faire") by default.'
          enum:
            [triage, backlog, todo, progress, review, testing, waiting, blocked, done, cancelled]
          default: todo
        cancelReason:
          $ref: '#/components/schemas/CancelReasonInput'
        cancelNote:
          type: [string, 'null']
          maxLength: 500
          description: '"Précision (facultatif)" of a cancellation, trimmed; only with the status `cancelled`.'
        priority:
          type: string
          description: '"Priorité", one of `PriorityKey`; `moyenne` by default.'
          enum: [urgente, haute, moyenne, basse]
          default: moyenne
        assigneeIds:
          type: array
          maxItems: 20
          default: []
          description: |
            Accounts to assign, current members of the organization other than guests; the same
            account twice counts once. The creation form sends the caller by default.
          items:
            type: string
            format: uuid
        dueDate:
          type: [string, 'null']
          format: date
          description: '"Échéance".'
        startDate:
          type: [string, 'null']
          format: date
          description: First day of the work; needs a due date, on or before it.
        estimateMinutes:
          $ref: '#/components/schemas/EstimateMinutes'
        labels:
          type: array
          maxItems: 20
          default: []
          description: '"Étiquettes"; trimmed, and a label that repeats another without regard to case is ignored.'
          items:
            $ref: '#/components/schemas/LabelName'
        subtasks:
          type: array
          maxItems: 25
          default: []
          description: |
            Subtasks to create with the task ("Sous-tâches"), in this order. Each takes the next key
            after the task, its list and its first assignee, the status `todo` and the priority
            `moyenne`.
          items:
            $ref: '#/components/schemas/SubtaskName'
    SubtaskCreation:
      type: object
      required: [name]
      description: |
        A subtask created under a task ("Nouvelle sous-tâche"). It takes the list of its parent;
        without `assigneeIds`, it takes the first assignee of its parent.
      properties:
        name:
          $ref: '#/components/schemas/TaskName'
        description:
          $ref: '#/components/schemas/TaskDescription'
        status:
          type: string
          description: '"Statut", one of `StatusKey`; `todo` ("À faire") by default.'
          enum:
            [triage, backlog, todo, progress, review, testing, waiting, blocked, done, cancelled]
          default: todo
        cancelReason:
          $ref: '#/components/schemas/CancelReasonInput'
        cancelNote:
          type: [string, 'null']
          maxLength: 500
          description: Only with the status `cancelled`.
        priority:
          type: string
          description: '"Priorité", one of `PriorityKey`; `moyenne` by default.'
          enum: [urgente, haute, moyenne, basse]
          default: moyenne
        assigneeIds:
          type: array
          maxItems: 20
          description: Accounts to assign; absent, the first assignee of the parent, if any.
          items:
            type: string
            format: uuid
        dueDate:
          type: [string, 'null']
          format: date
        startDate:
          type: [string, 'null']
          format: date
          description: Needs a due date, on or before it.
        estimateMinutes:
          $ref: '#/components/schemas/EstimateMinutes'
        labels:
          type: array
          maxItems: 20
          default: []
          items:
            $ref: '#/components/schemas/LabelName'
    TaskPatch:
      type: object
      description: |
        JSON Merge Patch of a task; an empty object changes nothing. The assignees, the labels and
        the checklist are collections: they change through their own routes, and a patch ignores
        the members it does not declare, `assigneeIds` and `labels` included.
      properties:
        customFieldValues:
          $ref: '#/components/schemas/TaskCustomFieldValuesPatch'
        descriptionMentions:
          type: array
          maxItems: 20
          description: |
            Structured spans in the description; replacing text clears prior spans unless a
            replacement array is supplied. A spans-only patch also requires If-Match. Invalid
            spans answer `400 request.invalid`, ineligible recipients `422 mention.recipient-invalid`.
          items:
            $ref: '#/components/schemas/Mention'
        milestone:
          type: boolean
          description: |
            A milestone permits only todo, blocked, done and cancelled. Dated milestones have
            equal start and due dates, undated milestones have both null; estimate is null.
            Conversion normalizes inherited fields and maps an inherited disallowed status to todo.
            Conflicting explicit dates or status answer `422 milestone.dates-invalid` or
            `422 milestone.status-invalid`. Removing the flag keeps normalized fields.
        recurrence:
          $ref: '#/components/schemas/Recurrence'
        name:
          $ref: '#/components/schemas/TaskName'
        description:
          $ref: '#/components/schemas/TaskDescription'
        status:
          $ref: '#/components/schemas/StatusKey'
        cancelReason:
          description: |
            Required when the status becomes `cancelled`; changes the reason of a cancelled task;
            refused on a task that is not cancelled after the patch. Leaving `cancelled` clears it.
          oneOf:
            - $ref: '#/components/schemas/CancelReason'
            - type: 'null'
        cancelNote:
          type: [string, 'null']
          maxLength: 500
          description: '"Précision" of a cancellation, trimmed; `null` clears it.'
        priority:
          $ref: '#/components/schemas/PriorityKey'
        dueDate:
          type: [string, 'null']
          format: date
          description: |
            New due date; `null` removes it. Without `startDate` in the same patch, the start
            moves with it and the duration is kept (see `PATCH /v1/tasks/{taskKey}`).
        startDate:
          type: [string, 'null']
          format: date
          description: New first day of the work; `null` removes it.
        estimateMinutes:
          $ref: '#/components/schemas/EstimateMinutes'
        listId:
          type: string
          format: uuid
          description: |
            The list to move the task to ("Déplacer vers…"), in this space or another; its
            subtasks follow, and a subtask leaves its parent first.
        parentKey:
          description: |
            The task to attach this one to ("Devenir sous-tâche de…"), which brings it and its
            subtasks to the list of the parent; `null` detaches it ("Détacher de CAD-482").
          oneOf:
            - $ref: '#/components/schemas/TaskKey'
            - type: 'null'
    LabelChange:
      type: object
      required: [name]
      description: A label to add to a task or to remove from it.
      properties:
        name:
          $ref: '#/components/schemas/LabelName'
    ChecklistItemCreation:
      type: object
      required: [text]
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 300
          description: |
            "Élément de checklist", trimmed; a text made only of spaces is refused with
            `400 request.invalid`.
          examples: [Maquette validée]
    ChecklistItemPatch:
      type: object
      required: [done]
      description: JSON Merge Patch of a checklist item; ticking or unticking it is the one change of this version.
      properties:
        done:
          type: boolean
          description: '`true` ticks the item ("Terminer"), `false` unticks it ("Rouvrir").'
    ActivityEntry:
      type: object
      required: [id, occurredAt, kind, actor, task, listId]
      description: |
        One entry of the activity log of a task ("Activité"); every entry names a task, and an entry
        about a list or a space would come on a route of its own. The member that names the change
        is the one of its `kind`: `status`, `priority`, `dueDate`, `assignee` or `commentId`; a creation has
        none. Comment creation records its ID and an excerpt of the current body; deleting the comment
        removes the entry. Edits and deletions do not create separate entries. Later versions add kinds: a client shows an unknown kind
        as "a modifié la tâche".
      properties:
        commentId:
          type: string
          format: uuid
          description: Comment associated with a comment activity entry.
        commentExcerpt:
          type: string
          description: Up to 240 Unicode code points of the current comment body.
        id:
          type: string
          format: uuid
        occurredAt:
          type: string
          format: date-time
          description: When the change was made; for merged changes, the last of them.
        kind:
          type: string
          description: |
            `create` records creation, `status` a status change, `priority` a priority change,
            `due` a due-date change, `assign` an assignment change, and `comment` a new comment.
            Future kinds may be added; render unknown kinds as a generic task change.
          x-extensible-enum: [create, status, priority, due, assign, comment]
        actor:
          $ref: '#/components/schemas/Actor'
        task:
          $ref: '#/components/schemas/TaskRef'
        listId:
          type: string
          format: uuid
          description: |
            The list the task was in when the change was made, an id only, which may be a list the
            caller no longer sees.
        status:
          type: object
          required: [from, to]
          description: For `status`, the status before and after.
          properties:
            from:
              $ref: '#/components/schemas/StatusKey'
            to:
              $ref: '#/components/schemas/StatusKey'
        priority:
          type: object
          required: [from, to]
          description: For `priority`, the priority before and after.
          properties:
            from:
              $ref: '#/components/schemas/PriorityKey'
            to:
              $ref: '#/components/schemas/PriorityKey'
        dueDate:
          type: object
          required: [from, to]
          description: For `due`, the due date before and after; `from` is `null` when one is set, `to` when it is removed.
          properties:
            from:
              type: [string, 'null']
              format: date
            to:
              type: [string, 'null']
              format: date
        assignee:
          type: object
          required: [userId, added]
          description: |
            For `assign`, who was assigned (`added: true`) or left the assignees (`added: false`);
            the person themself when `userId` is the id of the actor.
          properties:
            userId:
              type: string
              format: uuid
            added:
              type: boolean
    Grant:
      type: object
      required: [userId, role, grantedAt, grantedBy]
      description: |
        The access of one person to a space or a list ("Personnes ayant accès"), given by someone
        who manages it. A space or a list holds 200 grants at most. The owner of the space holds
        none: they always have `edit` ("Propriétaire").
      properties:
        userId:
          type: string
          format: uuid
          description: Account of the person, a current member or guest of the organization.
          examples: [019a5f3c-9e1f-7b2a-8c3d-4e5f6a7b8c31]
        role:
          $ref: '#/components/schemas/AccessRoleValue'
        grantedAt:
          type: string
          format: date-time
          description: When the person was given this role.
        grantedBy:
          $ref: '#/components/schemas/Actor'
    GrantChange:
      type: object
      required: [role]
      description: The role to give ("Droit d’accès"); it replaces the role the person had there.
      properties:
        role:
          $ref: '#/components/schemas/AccessRole'
    ListStateValue:
      type: string
      description: |
        `active` for a list of the sidebar, `archived` for a list of the archives ("Liste
        archivée"), `deleted` for a deleted list ("Liste supprimée"), which comes back when one of
        its tasks is restored. Later versions may add states (`x-extensible-enum`).
      x-extensible-enum: [active, archived, deleted]
    ListRef:
      type: object
      required: [id, spaceId, name, state]
      description: The list of an archived or trashed task, with its name and state as they are now.
      properties:
        id:
          type: string
          format: uuid
        spaceId:
          type: string
          format: uuid
        name:
          type: string
          description: '"Nom", 80 characters at most.'
          examples: [Sprint 14]
        state:
          $ref: '#/components/schemas/ListStateValue'
    ArchivedList:
      type: object
      required: [list, taskCount]
      description: A list of the archives ("Archives", tab "Listes").
      properties:
        list:
          $ref: '#/components/schemas/TaskList'
          description: The list, with `archivedAt` and `archivedBy`.
        taskCount:
          type: integer
          minimum: 0
          description: Its top-level tasks, subtasks left out ("14 tâches").
    ArchivedTask:
      type: object
      required: [task, list, subtaskCount, archivedAt, archivedBy]
      description: |
        A task of the archives ("Archives", tab "Tâches"): the root of a subtree archived together,
        which comes back together.
      properties:
        task:
          $ref: '#/components/schemas/TaskSummary'
        list:
          $ref: '#/components/schemas/ListRef'
          description: Its list, `archived` when the list is archived too ("Liste archivée").
        subtaskCount:
          type: integer
          minimum: 0
          description: The subtasks archived with it, at every level.
        archivedAt:
          type: string
          format: date-time
          description: '"archivée le 5 nov."'
        archivedBy:
          $ref: '#/components/schemas/Actor'
    TrashEntry:
      type: object
      required: [id, task, parentKey, subtaskCount, list, trashedAt, trashedBy, purgeAt]
      description: |
        One element of the trash ("Corbeille"): a task and its subtasks at every level, deleted
        together, which come back or are erased together. Deleting a subtask makes an entry of its
        own subtree; deleting a list or a space makes one entry per top-level task.
      properties:
        id:
          type: string
          format: uuid
        task:
          $ref: '#/components/schemas/TaskRef'
          description: The task at the root of the entry, with its name and status.
        parentKey:
          description: |
            The parent the root had when it was deleted ("Sous-tâche de CAD-482"); `null` for a
            top-level task.
          oneOf:
            - $ref: '#/components/schemas/TaskKey'
            - type: 'null'
        subtaskCount:
          type: integer
          minimum: 0
          description: The subtasks deleted with it, at every level ("Avec 3 sous-tâches").
        list:
          $ref: '#/components/schemas/ListRef'
          description: The list the entry comes back to; `deleted` reads "Liste supprimée".
        trashedAt:
          type: string
          format: date-time
          description: '"Supprimée il y a 2 jours"'
        trashedBy:
          $ref: '#/components/schemas/Actor'
        purgeAt:
          type: string
          format: date-time
          description: |
            When the entry is erased for good, 30 days after `trashedAt` ("Effacée définitivement
            dans 28 jours").
    TrashRestored:
      type: object
      required: [task, list, subtaskCount, detached, listRestored, spaceRestored]
      description: |
        What a restoration brought back ("CAD-452 restaurée", "Avec 2 sous-tâches, de retour dans
        Sprint 14.").
      properties:
        task:
          $ref: '#/components/schemas/Task'
          description: The root of the entry, back in its list.
        list:
          $ref: '#/components/schemas/TaskList'
          description: The list it is back in.
        subtaskCount:
          type: integer
          minimum: 0
          description: The subtasks that came back with it, at every level.
        detached:
          type: boolean
          description: |
            Whether the root left its parent, which is no longer live or can no longer take it
            (", détachée de son parent supprimé"); it is then a top-level task.
        listRestored:
          type: boolean
          description: Whether its list, deleted, came back with it, at the end of its space.
        spaceRestored:
          type: boolean
          description: Whether the space of that list, deleted, came back too, at the end of the sidebar.
    TrashEmptied:
      type: object
      required: [entryCount]
      description: What "Vider la corbeille" took out ("Corbeille vidée", "12 éléments effacés définitivement.").
      properties:
        entryCount:
          type: integer
          minimum: 0
          description: Entries that left the trash, to be erased for good.
    AccessRequestCreation:
      type: object
      description: |
        A request for access ("Demander l’accès"): exactly one of `spaceId`, `listId` and
        `taskKey`, as the link the caller followed names the target; none or several answer
        `400 request.invalid`.
      properties:
        spaceId:
          type: string
          format: uuid
          description: A space to have a role on.
        listId:
          type: string
          format: uuid
          description: A list to see.
        taskKey:
          $ref: '#/components/schemas/TaskKey'
          description: A task to see, through its list.
        message:
          type: [string, 'null']
          maxLength: 500
          description: '"Message pour Léa (facultatif)", trimmed; `null` or an empty text for none.'
          examples: [Je dois chiffrer la part outillage du budget 2027.]
    AccessRequestTargetValue:
      type: string
      description: |
        What a request asks for: `space`, `list` or `task`. Later versions may add targets
        (`x-extensible-enum`).
      x-extensible-enum: [space, list, task]
    AccessRequestStateValue:
      type: string
      description: |
        `pending` until someone who manages the target answers, then `approved` or `refused`. Later
        versions may add states (`x-extensible-enum`).
      x-extensible-enum: [pending, approved, refused]
    AccessRequest:
      type: object
      required:
        [
          id,
          target,
          spaceId,
          listId,
          task,
          requester,
          message,
          state,
          role,
          createdAt,
          decidedAt,
          decidedBy,
        ]
      description: |
        A request for access, as the people who manage its target read it. The requester never
        reads it: they learn the answer from the inbox (cadenway-notification-service). It has no
        `version` of its own to send back: it changes once, from `pending`, and a second answer
        gets `409 access-request.already-decided`; its events carry `1`, then `2`.
      properties:
        id:
          type: string
          format: uuid
        target:
          $ref: '#/components/schemas/AccessRequestTargetValue'
        spaceId:
          type: string
          format: uuid
          description: The space of the target.
        listId:
          type: [string, 'null']
          format: uuid
          description: The list of a list or task target; `null` for a space.
        task:
          description: The task of a task target, with its name and status as they are now; `null` otherwise.
          oneOf:
            - $ref: '#/components/schemas/TaskRef'
            - type: 'null'
        requester:
          $ref: '#/components/schemas/UserRef'
        message:
          type: [string, 'null']
          description: The message of the requester, 500 characters at most; `null` when there is none.
        state:
          $ref: '#/components/schemas/AccessRequestStateValue'
        role:
          description: The role an approval gave; `null` while pending or when refused.
          oneOf:
            - $ref: '#/components/schemas/AccessRoleValue'
            - type: 'null'
        createdAt:
          type: string
          format: date-time
        decidedAt:
          type: [string, 'null']
          format: date-time
          description: When it was approved or refused; `null` while pending.
        decidedBy:
          description: Who approved or refused it; `null` while pending.
          oneOf:
            - $ref: '#/components/schemas/Actor'
            - type: 'null'
    AccessRequestApproval:
      type: object
      required: [role]
      description: The role an approval gives the requester ("Droit d’accès").
      properties:
        role:
          $ref: '#/components/schemas/AccessRole'
